<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">理解的三级台阶：从认字到懂原理</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">《Understanding in LLMs》三层框架（arXiv 2507.08017）· 哲学 + 机制证据的融合</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="134" font-size="16" font-weight="bold" fill="#1A2433">"理解"不是有或无，而是三级台阶</text>

    
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,440 H408 A12,12 0 0 1 420,452 V618 A12,12 0 0 1 408,630 H72 A12,12 0 0 1 60,618 V452 A12,12 0 0 1 72,440 Z" />
    <rect x="60" y="440" width="360" height="4" fill="#0B6E99" />
    <text x="84" y="474" font-size="16" font-weight="bold" fill="#0B6E99">第一级：概念理解</text>
    <text x="84" y="502" font-size="13.5" fill="#1A2433">认出"猫"的千姿百态都是猫</text>
    <text x="84" y="530" font-size="13.5" fill="#51617A">机制：特征=潜在空间的方向</text>
    <text x="84" y="554" font-size="13.5" fill="#51617A">（线性表示假说）</text>
    <text x="84" y="588" font-size="13" fill="#8494AB">类比：图书馆的分类卡系统</text>
    <text x="84" y="612" font-size="13" fill="#8494AB">证据：上一页的 3400 万特征</text>

    
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M452,330 H788 A12,12 0 0 1 800,342 V618 A12,12 0 0 1 788,630 H452 A12,12 0 0 1 440,618 V342 A12,12 0 0 1 452,330 Z" />
    <rect x="440" y="330" width="360" height="4" fill="#C77800" />
    <text x="464" y="364" font-size="16" font-weight="bold" fill="#C77800">第二级：世界状态理解</text>
    <text x="464" y="392" font-size="13.5" fill="#1A2433">知道"居里夫人→物理学家"</text>
    <text x="464" y="420" font-size="13.5" fill="#1A2433">这样的经验事实连接</text>
    <text x="464" y="452" font-size="13.5" fill="#51617A">机制：特征间的偶然连接</text>
    <text x="464" y="480" font-size="13.5" fill="#51617A">+ 动态更新（世界变了，</text>
    <text x="464" y="504" font-size="13.5" fill="#51617A">内部模型跟着变）</text>
    <text x="464" y="540" font-size="13" fill="#8494AB">类比：不止认得名词，还知道</text>
    <text x="464" y="562" font-size="13" fill="#8494AB">"谁干过什么"的知识网</text>
    <text x="464" y="596" font-size="13" fill="#8494AB">证据：知识编辑、探测实验</text>
    <text x="464" y="618" font-size="13" fill="#8494AB">（Othello，下页）</text>

    
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M832,220 H1208 A12,12 0 0 1 1220,232 V618 A12,12 0 0 1 1208,630 H832 A12,12 0 0 1 820,618 V232 A12,12 0 0 1 832,220 Z" />
    <rect x="820" y="220" width="400" height="4" fill="#6D4FC2" />
    <text x="844" y="254" font-size="16" font-weight="bold" fill="#6D4FC2">第三级：原理理解</text>
    <text x="844" y="282" font-size="13.5" fill="#1A2433">不再背"3×7=21"，而是掌握</text>
    <text x="844" y="310" font-size="13.5" fill="#1A2433">乘法本身——用一条规律统一</text>
    <text x="844" y="338" font-size="13.5" fill="#1A2433">无数事实</text>
    <text x="844" y="372" font-size="13.5" fill="#51617A">机制：发现连接事实的紧凑</text>
    <text x="844" y="400" font-size="13.5" fill="#51617A">"电路"（circuit）——像食谱：</text>
    <text x="844" y="428" font-size="13.5" fill="#51617A">不是背菜名，而是学会</text>
    <text x="844" y="452" font-size="13.5" fill="#51617A">"先热油、再下菜"的步骤逻辑</text>
    <text x="844" y="488" font-size="13" fill="#8494AB">证据：grokking 现象中模型</text>
    <text x="844" y="510" font-size="13" fill="#8494AB">从背答案切换到用规律</text>
    <text x="844" y="534" font-size="13" fill="#8494AB">（下下页详讲）</text>
    <text x="844" y="572" font-size="13" fill="#6D4FC2" font-weight="bold">→ 当前 LLM 部分达到、</text>
    <text x="844" y="594" font-size="13" fill="#6D4FC2" font-weight="bold">尚未完全达到的一级</text>

    
    <path d="M 420 530 L 440 510" stroke="#8494AB" stroke-width="2" marker-end="url(#st1)" />
    <path d="M 800 420 L 820 400" stroke="#8494AB" stroke-width="2" marker-end="url(#st1)" />
    <defs>
      <marker id="st1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB" />
      </marker>
    </defs>
    <text x="240" y="660" text-anchor="middle" font-size="13" fill="#8494AB">↑ 台阶越高：需要的机制越复杂，达到的模型越少</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.35" d="M832,118 H1208 A12,12 0 0 1 1220,130 V192 A12,12 0 0 1 1208,204 H832 A12,12 0 0 1 820,192 V130 A12,12 0 0 1 832,118 Z" />
    <text x="844" y="148" font-size="14" font-weight="bold" fill="#C0392B">重要警示：三级是"共存"不是"取代"</text>
    <text x="844" y="174" font-size="13" fill="#1A2433">高级理解与低级启发式并存——同一个模型</text>
    <text x="844" y="196" font-size="13" fill="#1A2433">有时用原理、有时退回背题，难以预测</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">框架来源：arXiv 2507.08017（机制可解释性×哲学认识论）· 每一级都有 MI 实证证据支撑，非纯思辨</text>
</svg>