<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">概念字典：模型脑内的 3400 万张"分类卡"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Anthropic《Scaling Monosemanticity》· 生产级模型 Claude 3 Sonnet 首次解剖成功</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V346 A12,12 0 0 1 620,358 H72 A12,12 0 0 1 60,346 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">什么是"特征"（Feature）？</text>
    <path fill="#E8F1F8" d="M92,168 H600 A8,8 0 0 1 608,176 V320 A8,8 0 0 1 600,328 H92 A8,8 0 0 1 84,320 V176 A8,8 0 0 1 92,168 Z" />
    
    <g text-anchor="middle">
      <path fill="#FFFFFF" stroke="#0B6E99" d="M118,190 H212 A8,8 0 0 1 220,198 V234 A8,8 0 0 1 212,242 H118 A8,8 0 0 1 110,234 V198 A8,8 0 0 1 118,190 Z" />
      <text x="165" y="212" font-size="12.5" fill="#1A2433">"金门大桥"</text>
      <text x="165" y="232" font-size="11" fill="#8494AB">英文 Golden Gate</text>
      <path fill="#FFFFFF" stroke="#0B6E99" d="M248,190 H342 A8,8 0 0 1 350,198 V234 A8,8 0 0 1 342,242 H248 A8,8 0 0 1 240,234 V198 A8,8 0 0 1 248,190 Z" />
      <text x="295" y="212" font-size="12.5" fill="#1A2433">日文</text>
      <text x="295" y="232" font-size="11" fill="#8494AB">ゴールデンゲートブリッジ</text>
      <path fill="#FFFFFF" stroke="#0B6E99" d="M378,190 H472 A8,8 0 0 1 480,198 V234 A8,8 0 0 1 472,242 H378 A8,8 0 0 1 370,234 V198 A8,8 0 0 1 378,190 Z" />
      <text x="425" y="212" font-size="12.5" fill="#1A2433">照片</text>
      <text x="425" y="232" font-size="11" fill="#8494AB">桥的图像</text>
      <path fill="#FFFFFF" stroke="#0B6E99" d="M508,190 H582 A8,8 0 0 1 590,198 V234 A8,8 0 0 1 582,242 H508 A8,8 0 0 1 500,234 V198 A8,8 0 0 1 508,190 Z" />
      <text x="545" y="212" font-size="12.5" fill="#1A2433">上下文</text>
      <text x="545" y="232" font-size="11" fill="#8494AB">"旧金山地标"</text>
    </g>
    <path d="M 165 242 L 165 268 M 295 242 L 295 268 M 425 242 L 425 268 M 545 242 L 545 268" stroke="#0B6E99" stroke-width="1.5" stroke-dasharray="3,3" />
    <path fill="#0B6E99" opacity="0.12" d="M261,270 H439 A21,21 0 0 1 460,291 V291 A21,21 0 0 1 439,312 H261 A21,21 0 0 1 240,291 V291 A21,21 0 0 1 261,270 Z" />
    <text x="350" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#0B6E99">同一张"分类卡"全部点亮 ↑</text>
    <text x="84" y="346" font-size="13" fill="#51617A">Anthropic 用稀疏自编码器（SAE）从 Claude 中间层拆出 3400 万个这样的卡片</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V346 A12,12 0 0 1 1208,358 H664 A12,12 0 0 1 652,346 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#C77800">著名实验：拧大"金门大桥"旋钮</text>
    <g font-size="14" fill="#1A2433">
      <text x="676" y="182">问："你的物理形态是什么？"</text>
      <text x="700" y="210" fill="#51617A">正常 Claude：</text>
      <text x="820" y="210">"我没有物理形态，我是 AI 模型"</text>
      <text x="700" y="240" fill="#C77800" font-weight="bold">拧大特征后：</text>
      <text x="840" y="240">"我就是金门大桥……</text>
      <text x="840" y="266">我的物理形态就是这座标志性的大桥"</text>
      <text x="676" y="300" font-size="13.5" fill="#1A2433">→ 问答什么都要扯上大桥，像被人"下了迷魂药"</text>
    </g>
    <text x="676" y="336" font-size="13" fill="#51617A">意义：找到了思想在机器里的"物理位置"——可以定位、可以拧动</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,382 H748 A12,12 0 0 1 760,394 V640 A12,12 0 0 1 748,652 H72 A12,12 0 0 1 60,640 V394 A12,12 0 0 1 72,382 Z" />
    <text x="84" y="414" font-size="15" font-weight="bold" fill="#6D4FC2">更惊人的发现：卡片是按"地理"组织的</text>
    <text x="84" y="444" font-size="13.5" fill="#1A2433">金门大桥特征附近的卡片：</text>
    
    <g font-size="12.5">
      <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.3" d="M112,460 H246 A8,8 0 0 1 254,468 V508 A8,8 0 0 1 246,516 H112 A8,8 0 0 1 104,508 V468 A8,8 0 0 1 112,460 Z" />
      <text x="179" y="484" text-anchor="middle" fill="#1A2433">恶魔岛</text>
      <text x="179" y="504" text-anchor="middle" fill="#8494AB">（旁边的小岛监狱）</text>
      <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.3" d="M278,460 H412 A8,8 0 0 1 420,468 V508 A8,8 0 0 1 412,516 H278 A8,8 0 0 1 270,508 V468 A8,8 0 0 1 278,460 Z" />
      <text x="345" y="484" text-anchor="middle" fill="#1A2433">吉拉德里广场</text>
      <text x="345" y="504" text-anchor="middle" fill="#8494AB">（附近巧克力名店）</text>
      <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.3" d="M444,460 H578 A8,8 0 0 1 586,468 V508 A8,8 0 0 1 578,516 H444 A8,8 0 0 1 436,508 V468 A8,8 0 0 1 444,460 Z" />
      <text x="511" y="484" text-anchor="middle" fill="#1A2433">勇士队</text>
      <text x="511" y="504" text-anchor="middle" fill="#8494AB">（旧金山球队）</text>
      <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.3" d="M610,460 H730 A8,8 0 0 1 738,468 V508 A8,8 0 0 1 730,516 H610 A8,8 0 0 1 602,508 V468 A8,8 0 0 1 610,460 Z" />
      <text x="670" y="484" text-anchor="middle" fill="#1A2433">1906 地震</text>
      <text x="670" y="504" text-anchor="middle" fill="#8494AB">（城市历史）</text>
    </g>
    <text x="84" y="556" font-size="13.5" fill="#1A2433">像真实城市的地图：概念之间的"远近"对应现实中的关联——</text>
    <text x="84" y="582" font-size="13.5" fill="#1A2433">模型不是把知识胡乱堆放，而是组织成了一张<tspan font-weight="bold" fill="#6D4FC2">有结构的语义地图</tspan>。</text>
    <text x="84" y="622" font-size="13" fill="#51617A">还有实用卡：代码漏洞卡（见到坏代码亮起）、诈骗邮件卡（帮你识别骗局）</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.35" d="M792,382 H1208 A12,12 0 0 1 1220,394 V640 A12,12 0 0 1 1208,652 H792 A12,12 0 0 1 780,640 V394 A12,12 0 0 1 792,382 Z" />
    <text x="804" y="414" font-size="15" font-weight="bold" fill="#C0392B">诚实的另一面（学界批评）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="446">· 命名陷阱：卡片以最高激活样本命名，</text>
      <text x="824" y="470">但中位情况下 &lt;10% 的激活与名字相关</text>
      <text x="804" y="504">· 找不到"点名卡"：想要特定的安全卡</text>
      <text x="824" y="528">（如"欺骗检测"）未必拆得出来</text>
      <text x="804" y="562">· 3400 万卡 vs 人的概念量级：到底</text>
      <text x="824" y="586">拆到多细才算"读懂"，仍是开放问题</text>
    </g>
    <text x="804" y="628" font-size="13" fill="#51617A">结论：能"开颅"了，但离"读懂大脑"还有距离</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Anthropic Scaling Monosemanticity（transformer-circuits.pub）· 批评：aizi.substack 独立分析</text>
</svg>