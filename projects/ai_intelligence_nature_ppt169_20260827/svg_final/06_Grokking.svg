<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">Grokking：死记硬背的学生突然开窍</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">2026 三连发：维度相变（2604.04655）· 可证缩放律（2509.21519）· 真实 LLM 预训练验证（ICLR 2026）</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H688 A12,12 0 0 1 700,130 V386 A12,12 0 0 1 688,398 H72 A12,12 0 0 1 60,386 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#C77800">现象：训练曲线上的一条"神奇分界线"</text>
    
    <line x1="110" y1="360" x2="660" y2="360" stroke="#8494AB" stroke-width="1.5" />
    <line x1="110" y1="170" x2="110" y2="360" stroke="#8494AB" stroke-width="1.5" />
    <g font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#8494AB">
      <text x="104" y="364" text-anchor="end">0</text>
      <text x="104" y="195" text-anchor="end">100%</text>
    </g>
    
    <path d="M 110 358 L 170 175 L 660 172" fill="none" stroke="#8494AB" stroke-width="2.5" />
    
    <path d="M 110 358 L 300 330 L 380 326 L 430 180 L 660 172" fill="none" stroke="#C77800" stroke-width="3" />
    <circle cx="430" cy="180" r="6" fill="#C0392B" />
    <text x="442" y="168" font-size="13" font-weight="bold" fill="#C0392B">开窍点！</text>
    <g font-size="12" fill="#51617A" font-family="'PingFang SC',sans-serif">
      <text x="620" y="378">训练时间 →</text>
    </g>
    <text x="170" y="160" font-size="12.5" fill="#8494AB">灰线=训练集正确率（早就满分）</text>
    <text x="180" y="320" font-size="12.5" fill="#C77800">橙线=新题正确率（长期躺平后突然起飞）</text>
    <text x="84" y="402" font-size="13" fill="#1A2433">训练集早就全对（背下来了），新题却一直不会——直到某一天<tspan font-weight="bold" fill="#C77800">突然全会了</tspan></text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M732,118 H1208 A12,12 0 0 1 1220,130 V386 A12,12 0 0 1 1208,398 H732 A12,12 0 0 1 720,386 V130 A12,12 0 0 1 732,118 Z" />
    <text x="744" y="150" font-size="15" font-weight="bold" fill="#C77800">学生类比：背题 → 开窍</text>
    <g font-size="14" fill="#1A2433">
      <text x="744" y="186">第一阶段（记忆期）：</text>
      <text x="764" y="212" fill="#51617A">题海战术后把答案都背下来了</text>
      <text x="764" y="236" fill="#51617A">——换道新题就傻眼</text>
      <text x="744" y="276" font-weight="bold" fill="#C77800">第二阶段（泛化期）：</text>
      <text x="764" y="302" fill="#1A2433">某天突然"懂了"——原来所有题</text>
      <text x="764" y="326" fill="#1A2433">背后是同一条规律！</text>
      <text x="764" y="354" fill="#1A2433">新题旧题一起通杀</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" d="M72,424 H428 A12,12 0 0 1 440,436 V640 A12,12 0 0 1 428,652 H72 A12,12 0 0 1 60,640 V436 A12,12 0 0 1 72,424 Z" />
    <text x="84" y="456" font-size="15" font-weight="bold" fill="#0B6E99">① 它是物理学的"相变"（2604.04655）</text>
    <text x="84" y="488" font-size="13.5" fill="#1A2433">像水加热到 100°C 突然沸腾：</text>
    <text x="84" y="514" font-size="13.5" fill="#1A2433">有效维度 D 从 &lt;1（死记）跳到 &gt;1</text>
    <text x="84" y="540" font-size="13.5" fill="#1A2433">（开窍），符合"自组织临界性"</text>
    <text x="84" y="576" font-size="13" fill="#51617A">8 个模型尺度验证，与架构无关</text>
    <text x="84" y="602" font-size="13" fill="#51617A">→ 开窍不是玄学，是可测量的临界点</text>

    <path fill="#EAF5EE" d="M472,424 H828 A12,12 0 0 1 840,436 V640 A12,12 0 0 1 828,652 H472 A12,12 0 0 1 460,640 V436 A12,12 0 0 1 472,424 Z" />
    <text x="484" y="456" font-size="15" font-weight="bold" fill="#1E8E3E">② 何时开窍可以算出来（2509.21519）</text>
    <text x="484" y="488" font-size="13.5" fill="#1A2433">田渊栋团队证明"特征涌现缩放律"：</text>
    <text x="484" y="514" font-size="13.5" fill="#1A2433">题目规模 M → 大约需要 M·logM 道题</text>
    <text x="484" y="540" font-size="13.5" fill="#1A2433">数据够 = 学规律；数据不够 = 只能背</text>
    <text x="484" y="576" font-size="13" fill="#51617A">三阶段：偷懒学 → 分开学特征 → 特征互动</text>
    <text x="484" y="602" font-size="13" fill="#51617A">顺带解释了 Muon 新优化器为何有效</text>

    <path fill="#EFEBF8" d="M872,424 H1208 A12,12 0 0 1 1220,436 V640 A12,12 0 0 1 1208,652 H872 A12,12 0 0 1 860,640 V436 A12,12 0 0 1 872,424 Z" />
    <text x="884" y="456" font-size="15" font-weight="bold" fill="#6D4FC2">③ 大模型预训练里也有（ICLR 26）</text>
    <text x="884" y="488" font-size="13.5" fill="#1A2433">不再只是玩具实验：真实 7B MoE</text>
    <text x="884" y="514" font-size="13.5" fill="#1A2433">预训练中验证了 grokking——</text>
    <text x="884" y="540" font-size="13.5" fill="#1A2433">MoE 路由从"一题一路"变成</text>
    <text x="884" y="564" font-size="13.5" fill="#1A2433">"结构化共享"（= 学会举一反三）</text>
    <text x="884" y="600" font-size="13" fill="#51617A">并给出两个零成本监测指标</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">核心句：智能的"质变"（从记忆到理解）有明确的物理特征——临界点、缩放律、可监测指标。这不是哲学猜想，是被测量的事实</text>
</svg>