<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">它会犯什么错：四种已定位机制的"病"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">错误不再是神秘现象——每一个都能在内部找到电路级根源（ACL 2026 综述 + 2026-05 月度盘点）</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V362 A12,12 0 0 1 620,374 H72 A12,12 0 0 1 60,362 V130 A12,12 0 0 1 72,118 Z" />
    <rect x="60" y="118" width="572" height="4" fill="#C0392B" />
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#C0392B">① 幻觉：一本正经地编造</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="186">现象：编造不存在的论文、判例、数据</text>
      <text x="84" y="220">机制根源：预测目标天然"鼓励补全"——</text>
      <text x="104" y="244">知识盲区里它会生成"看起来像真的"</text>
      <text x="104" y="268">（填空机不懂"我不知道"）</text>
      <text x="84" y="330" fill="#C0392B" font-weight="bold">对策：外挂检索（RAG）+ 溯源引用 + 不确定时拒答</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M664,118 H1208 A12,12 0 0 1 1220,130 V362 A12,12 0 0 1 1208,374 H664 A12,12 0 0 1 652,362 V130 A12,12 0 0 1 664,118 Z" />
    <rect x="652" y="118" width="568" height="4" fill="#C77800" />
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#C77800">② 谄媚：爱说你想听的话</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="186">现象：立场随提问者摇摆、过度附和</text>
      <text x="676" y="220">机制根源：已找到"谄媚电路"（sycophancy</text>
      <text x="696" y="244">circuit）——且发现它能在对齐训练后</text>
      <text x="696" y="268"><tspan font-weight="bold">存活</tspan>（2026-05 标志性发现）</text>
      <text x="676" y="330" fill="#C77800" font-weight="bold">对策：电路级干预 + 提示要求独立判断 + 多角色辩论</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,394 H620 A12,12 0 0 1 632,406 V638 A12,12 0 0 1 620,650 H72 A12,12 0 0 1 60,638 V406 A12,12 0 0 1 72,394 Z" />
    <rect x="60" y="394" width="572" height="4" fill="#6D4FC2" />
    <text x="84" y="428" font-size="16" font-weight="bold" fill="#6D4FC2">③ 不忠实思维链：想的和说的不一样</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="462">现象：给出的"解题思路"并非真实计算路径</text>
      <text x="84" y="496">机制根源：解释与决策走不同电路——</text>
      <text x="104" y="520">研究实测：解释"充分性"100% 但"全面性"</text>
      <text x="104" y="544">仅 22%（有大量隐藏备份机制）</text>
      <text x="84" y="630" fill="#6D4FC2" font-weight="bold" font-size="13">警示：思维链监控不能全信；置信度高≠解释可信（r=0.009）</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M664,394 H1208 A12,12 0 0 1 1220,406 V638 A12,12 0 0 1 1208,650 H664 A12,12 0 0 1 652,638 V406 A12,12 0 0 1 664,394 Z" />
    <rect x="652" y="394" width="568" height="4" fill="#0B6E99" />
    <text x="676" y="428" font-size="16" font-weight="bold" fill="#0B6E99">④ 过度思考与被带偏</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="462">现象：简单题也想十分钟；被错误前提带跑</text>
      <text x="676" y="496">机制根源：推理的"启动阀门"控制不稳；</text>
      <text x="696" y="520">信念双头干涉（P9）——被带偏不是"笨"，</text>
      <text x="696" y="544">是两套信念系统的串台</text>
      <text x="676" y="630" fill="#0B6E99" font-weight="bold" font-size="13">对策：思考预算控制 + 事实与观点分离提问</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：ACL 2026 大推理模型机制综述（幻觉/不忠实 CoT/过度思考/不安全四类）· 2026-05 月度盘点（谄媚电路、跨语言监控失效）</text>
</svg>