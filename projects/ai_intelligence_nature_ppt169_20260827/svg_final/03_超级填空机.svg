<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">预备知识：超级填空机</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ChatGPT 们的唯一"出厂设置" = 猜下一个词 · 一切智能都从这里长出来</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H748 A12,12 0 0 1 760,130 V356 A12,12 0 0 1 748,368 H72 A12,12 0 0 1 60,356 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">它的工作方式：永远在做一道填空题</text>
    <path fill="#E8F1F8" d="M92,168 H728 A8,8 0 0 1 736,176 V230 A8,8 0 0 1 728,238 H92 A8,8 0 0 1 84,230 V176 A8,8 0 0 1 92,168 Z" />
    <text x="104" y="196" font-size="16" fill="#1A2433">"床前明月"的下一个字是<tspan font-weight="bold" fill="#0B6E99">__</tspan><tspan fill="#8494AB" font-size="13">（光，99.9%）</tspan></text>
    <text x="104" y="224" font-size="16" fill="#1A2433">"银行审计发现三处"的下一个词是<tspan font-weight="bold" fill="#0B6E99">____</tspan><tspan fill="#8494AB" font-size="13">（违规/疑点/重复报销…）</tspan></text>
    <path fill="#FBF3E4" d="M92,252 H728 A8,8 0 0 1 736,260 V338 A8,8 0 0 1 728,346 H92 A8,8 0 0 1 84,338 V260 A8,8 0 0 1 92,252 Z" />
    <text x="104" y="280" font-size="14.5" fill="#1A2433">把"猜下一个词"重复几百次，就得到一段完整回答——你看到的每篇</text>
    <text x="104" y="304" font-size="14.5" fill="#1A2433">AI 长文，都是它一个词一个词"接龙"出来的。</text>
    <text x="104" y="334" font-size="13" fill="#51617A">训练 = 读遍互联网的文本，猜错就微调参数，猜了上万亿次之后……</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.35" d="M792,118 H1208 A12,12 0 0 1 1220,130 V356 A12,12 0 0 1 1208,368 H792 A12,12 0 0 1 780,356 V130 A12,12 0 0 1 792,118 Z" />
    <text x="804" y="150" font-size="15" font-weight="bold" fill="#6D4FC2">最大的误解 vs 真相</text>
    <text x="804" y="182" font-size="14" fill="#C0392B" font-weight="bold">误解：</text>
    <text x="862" y="182" font-size="14" fill="#1A2433">"它只是照搬背过的句子"</text>
    <text x="804" y="210" font-size="14" fill="#1A2433">（随机鹦鹉 stochastic parrot）</text>
    <text x="804" y="248" font-size="14" fill="#1E8E3E" font-weight="bold">真相（2507.08017）：</text>
    <text x="804" y="276" font-size="14" fill="#1A2433">训练目标简单 ≠ 内部机制简单。</text>
    <text x="804" y="304" font-size="14" fill="#1A2433">为了把"下一词"猜得更准，模型被迫</text>
    <text x="804" y="330" font-size="14" fill="#1A2433">在内部学会语法、事实、逻辑甚至</text>
    <text x="804" y="356" font-size="14" fill="#1A2433">"理解世界"——这就是本 PPT 的主题。</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="408" font-size="16" font-weight="bold" fill="#1A2433">从填空到智能：一条流水线</text>
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,426 H1208 A12,12 0 0 1 1220,438 V644 A12,12 0 0 1 1208,656 H72 A12,12 0 0 1 60,644 V438 A12,12 0 0 1 72,426 Z" />
    
    <g text-anchor="middle">
      <path fill="#E8F1F8" d="M100,456 H260 A10,10 0 0 1 270,466 V566 A10,10 0 0 1 260,576 H100 A10,10 0 0 1 90,566 V466 A10,10 0 0 1 100,456 Z" />
      <text x="180" y="492" font-size="14" font-weight="bold" fill="#0B6E99">① 读遍互联网</text>
      <text x="180" y="520" font-size="12.5" fill="#51617A">数万亿词的文本</text>
      <text x="180" y="544" font-size="12.5" fill="#51617A">（人类几万年写的）</text>

      <path fill="#E8F1F8" d="M330,456 H490 A10,10 0 0 1 500,466 V566 A10,10 0 0 1 490,576 H330 A10,10 0 0 1 320,566 V466 A10,10 0 0 1 330,456 Z" />
      <text x="410" y="492" font-size="14" font-weight="bold" fill="#0B6E99">② 疯狂做填空</text>
      <text x="410" y="520" font-size="12.5" fill="#51617A">猜错 → 调整参数</text>
      <text x="410" y="544" font-size="12.5" fill="#51617A">（数万亿次）</text>

      <path fill="#FBF3E4" d="M560,456 H720 A10,10 0 0 1 730,466 V566 A10,10 0 0 1 720,576 H560 A10,10 0 0 1 550,566 V466 A10,10 0 0 1 560,456 Z" />
      <text x="640" y="492" font-size="14" font-weight="bold" fill="#C77800">③ 特征涌现</text>
      <text x="640" y="520" font-size="12.5" fill="#51617A">内部自发长出</text>
      <text x="640" y="544" font-size="12.5" fill="#51617A">"概念分类卡"（P4）</text>

      <path fill="#EFEBF8" d="M790,456 H950 A10,10 0 0 1 960,466 V566 A10,10 0 0 1 950,576 H790 A10,10 0 0 1 780,566 V466 A10,10 0 0 1 790,456 Z" />
      <text x="870" y="492" font-size="14" font-weight="bold" fill="#6D4FC2">④ 规律涌现</text>
      <text x="870" y="520" font-size="12.5" fill="#51617A">从背题到开窍</text>
      <text x="870" y="544" font-size="12.5" fill="#51617A">（grokking，P6）</text>

      <path fill="#EAF5EE" d="M1020,456 H1180 A10,10 0 0 1 1190,466 V566 A10,10 0 0 1 1180,576 H1020 A10,10 0 0 1 1010,566 V466 A10,10 0 0 1 1020,456 Z" />
      <text x="1100" y="492" font-size="14" font-weight="bold" fill="#1E8E3E">⑤ 会用工具干活</text>
      <text x="1100" y="520" font-size="12.5" fill="#51617A">接上工具=Agent</text>
      <text x="1100" y="544" font-size="12.5" fill="#51617A">（工作版图 P10-11）</text>
    </g>
    <path d="M 270 516 L 320 516" stroke="#8494AB" stroke-width="2" marker-end="url(#p1)" />
    <path d="M 500 516 L 550 516" stroke="#8494AB" stroke-width="2" marker-end="url(#p1)" />
    <path d="M 730 516 L 780 516" stroke="#8494AB" stroke-width="2" marker-end="url(#p1)" />
    <path d="M 960 516 L 1010 516" stroke="#8494AB" stroke-width="2" marker-end="url(#p1)" />
    <defs>
      <marker id="p1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB" />
      </marker>
    </defs>
    <text x="84" y="628" font-size="14" fill="#C77800" font-weight="bold">核心句：没有人教它语法、逻辑、常识——这些都是"猜下一个词"的副产品，是自己长出来的。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">类比：让一个孩子把图书馆的书全读一遍并玩"接龙游戏"十万小时——某天他突然能写文章、答问题、做推理</text>
</svg>