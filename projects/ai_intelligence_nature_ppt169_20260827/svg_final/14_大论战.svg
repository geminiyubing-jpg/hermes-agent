<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">大论战：世界模型 vs 启发式袋子</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">AI 到底"懂世界"还是"只会套套路"？——2026 年最尖锐的学术之争</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M72,118 H620 A12,12 0 0 1 632,130 V386 A12,12 0 0 1 620,398 H72 A12,12 0 0 1 60,386 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">乐观派：它在构建世界模型</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="188">证据 A：Othello 棋盘自发涌现（P7）</text>
      <text x="84" y="218">证据 B：空间/时间概念在内部有几何结构</text>
      <text x="84" y="248">证据 C：三层理解框架——机制证据支持</text>
      <text x="104" y="272">"类理解"的统一化能力（P5）</text>
      <text x="84" y="308">证据 D：Nature NeuroSci——组合性</text>
      <text x="104" y="332">（智能的核心操作）可从规模涌现</text>
      <text x="84" y="374" fill="#1E8E3E" font-weight="bold">立场：预测做得好，内部必然建了世界的模型</text>
    </g>

    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V386 A12,12 0 0 1 1208,398 H664 A12,12 0 0 1 652,386 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#C0392B">怀疑派：只是一袋子启发式</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188">质疑 A（Melanie Mitchell）：Othello 棋盘小</text>
      <text x="696" y="212">且规则封闭——真实世界没有这么友好</text>
      <text x="676" y="248">质疑 B：高级电路与低级启发式共存（P5），</text>
      <text x="696" y="272">很多任务其实走的"抄近路"</text>
      <text x="676" y="308">质疑 C：分布外一换就崩——真模型应能</text>
      <text x="696" y="332">迁移，套路的换题型就露馅</text>
      <text x="676" y="374" fill="#C0392B" font-weight="bold">立场：大部分时候是超大规模的模式匹配复读</text>
    </g>
  </g>

  
  <circle cx="640" cy="258" r="34" fill="#FFFFFF" stroke="#D8E0EC" stroke-width="2" />
  <text x="640" y="266" text-anchor="middle" font-size="18" font-weight="bold" fill="#51617A">VS</text>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,424 H1208 A12,12 0 0 1 1220,436 V640 A12,12 0 0 1 1208,652 H72 A12,12 0 0 1 60,640 V436 A12,12 0 0 1 72,424 Z" />
    <text x="84" y="458" font-size="16" font-weight="bold" fill="#0B6E99">2026 年的调和立场（本 PPT 采用）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="492">① 不是二选一：同一模型内，世界模型与启发式<tspan font-weight="bold">混合共存</tspan>——简单问题抄近路，硬问题才动用模型</text>
      <text x="84" y="524">② 涌现是"局部真实"的：封闭小世界（棋盘）里模型清晰可见；开放大世界里模型是碎片化的、局部的</text>
      <text x="84" y="556">③ 判断标准看行为：分布外泛化能力 = 世界模型含金量的试金石（这正是 grokking/缩放律研究要解决的）</text>
      <text x="84" y="600" fill="#0B6E99" font-weight="bold">哲学注脚：这场争论本质是"什么是理解"的千年之问换了个战场——而这次，我们第一次能用手术刀（MI）参与辩论</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Melanie Mitchell 世界模型系列评论 · Li/Nanda Othello 研究 · 2507.08017 共存立场 · Nature Neuroscience 2026 组合性连续统</text>
</svg>