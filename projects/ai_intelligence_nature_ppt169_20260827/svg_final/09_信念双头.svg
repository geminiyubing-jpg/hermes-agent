<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">信念双头：模型分得清"我知道"和"他以为"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Mechanist 发现"信念机制理论"（arXiv 2608.12036）· AI 自主做实验发现的 AI 原理</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H1208 A12,12 0 0 1 1220,130 V236 A12,12 0 0 1 1208,248 H72 A12,12 0 0 1 60,236 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#6D4FC2">先说这个研究本身的特别之处：AI 给 AI 做解剖</text>
    <text x="84" y="180" font-size="13.5" fill="#1A2433">Mechanist 是一个"AI 科学家"系统：读 1.3 万篇可解释性论文 + 跨 26 学科 4300 万篇文献，自己提出假设、自己设计实验、</text>
    <text x="84" y="206" font-size="13.5" fill="#1A2433">自己验证——战胜 Claude Code 等对手，产出的机制假设被评为更新颖、更可检验。<tspan fill="#51617A">（"用 AI 研究AI"从口号变成了流水线）</tspan></text>
    <text x="84" y="234" font-size="13" fill="#51617A">它最漂亮的成果之一，就是发现了下面的"信念双头"</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,272 H748 A12,12 0 0 1 760,284 V510 A12,12 0 0 1 748,522 H72 A12,12 0 0 1 60,510 V284 A12,12 0 0 1 72,272 Z" />
    <text x="84" y="304" font-size="15" font-weight="bold" fill="#0B6E99">模型的"心智理论"长这样</text>
    
    <path fill="#E8F1F8" d="M120,326 H380 A10,10 0 0 1 390,336 V436 A10,10 0 0 1 380,446 H120 A10,10 0 0 1 110,436 V336 A10,10 0 0 1 120,326 Z" />
    <text x="250" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B6E99">个人信念头（PB）</text>
    <text x="250" y="392" text-anchor="middle" font-size="13" fill="#1A2433">"我自己认为世界是什么样"</text>
    <text x="250" y="418" text-anchor="middle" font-size="12" fill="#51617A">2026 世界杯在新泽西 ✓</text>
    <path fill="#FBF3E4" d="M440,326 H700 A10,10 0 0 1 710,336 V436 A10,10 0 0 1 700,446 H440 A10,10 0 0 1 430,436 V336 A10,10 0 0 1 440,326 Z" />
    <text x="570" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#C77800">归因信念头（AB）</text>
    <text x="570" y="392" text-anchor="middle" font-size="13" fill="#1A2433">"小明以为世界是什么样"</text>
    <text x="570" y="418" text-anchor="middle" font-size="12" fill="#51617A">小明坚持认为在洛杉矶 ✓</text>
    <text x="84" y="486" font-size="13.5" fill="#1A2433">两组不同的注意力头分管两种"信念"——屏蔽 PB 头，模型答不出事实；屏蔽 AB 头，模型猜不透他人想法</text>
    <text x="84" y="512" font-size="13" fill="#51617A">（Pythia 2k→143k 训练步追踪：这些头随能力同步逐步长出——预训练的产物，非提示词魔术）</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.35" d="M792,272 H1208 A12,12 0 0 1 1220,284 V510 A12,12 0 0 1 1208,522 H792 A12,12 0 0 1 780,510 V284 A12,12 0 0 1 792,272 Z" />
    <text x="804" y="304" font-size="15" font-weight="bold" fill="#C0392B">为什么它有时"被带偏"？双头打架</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="338">· 你说"小明认为在洛杉矶"之后再问</text>
      <text x="824" y="362">"到底在哪" → 有时答"洛杉矶"</text>
      <text x="844" y="386" fill="#C0392B">（他人信念污染了事实判断）</text>
      <text x="804" y="424">· 问"小明认为在哪" → 有时答</text>
      <text x="824" y="448">"新泽西"（自己的知识盖过了他人）</text>
      <text x="844" y="472" fill="#C0392B">（自我知识污染了视角切换）</text>
    </g>
    <text x="804" y="504" font-size="12.5" fill="#51617A">与认知科学的"他人中心/自我中心干涉"平行</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.35" d="M72,542 H1208 A12,12 0 0 1 1220,554 V640 A12,12 0 0 1 1208,652 H72 A12,12 0 0 1 60,640 V554 A12,12 0 0 1 72,542 Z" />
    <text x="84" y="574" font-size="15" font-weight="bold" fill="#1E8E3E">这页的意义</text>
    <text x="84" y="604" font-size="14" fill="#1A2433">"知道自己在想什么"和"知道别人在想什么"是两套分开的机制，人如此，AI 也如此——机器内部存在类似"心智理论"的结构，</text>
    <text x="84" y="630" font-size="14" fill="#1A2433">而且这种结构是训练中自己长出来的。它解释了 AI 被虚假信息带偏的机制根源（双头干涉），也指出了修复的入手点。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2608.12036 Mechanist · 跨 GPT/Gemini/Claude/Qwen/Pythia/OLMo 六家模型验证了干涉失败普遍存在</text>
</svg>