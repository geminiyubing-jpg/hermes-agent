<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">通往原理理解：下一代 AI 的蓝图</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Mechanistic World Models（2607.12474）+ ACL 2026 综述路线图</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H1208 A12,12 0 0 1 1220,130 V336 A12,12 0 0 1 1208,348 H72 A12,12 0 0 1 60,336 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#0B6E99">范式主张：从"预测机器"到"机制机器"</text>
    <g text-anchor="middle">
      <path fill="#EEF2F8" d="M110,178 H580 A10,10 0 0 1 590,188 V308 A10,10 0 0 1 580,318 H110 A10,10 0 0 1 100,308 V188 A10,10 0 0 1 110,178 Z" />
      <text x="345" y="212" font-size="15" font-weight="bold" fill="#51617A">现在的 AI（预测范式）</text>
      <text x="345" y="244" font-size="13.5" fill="#1A2433">组织知识围绕"输入→输出映射"</text>
      <text x="345" y="272" font-size="13.5" fill="#51617A">算得准，但说不清为什么</text>
      <text x="345" y="300" font-size="13" fill="#8494AB">（黑箱：会看病不会解释病理）</text>

      <path fill="#EFEBF8" d="M680,178 H1170 A10,10 0 0 1 1180,188 V308 A10,10 0 0 1 1170,318 H680 A10,10 0 0 1 670,308 V188 A10,10 0 0 1 680,178 Z" />
      <text x="925" y="212" font-size="15" font-weight="bold" fill="#6D4FC2">提议的 AI（机制范式）</text>
      <text x="925" y="244" font-size="13.5" fill="#1A2433">组织知识围绕"可复用的机制模块"</text>
      <text x="925" y="272" font-size="13.5" fill="#51617A">变量 + 机制 + 组装结构，解释生观察</text>
      <text x="925" y="300" font-size="13" fill="#8494AB">（白箱：既会看病也讲得出病理）</text>
    </g>
    <path d="M 590 248 L 670 248" stroke="#6D4FC2" stroke-width="3" marker-end="url(#b1)" />
    <defs>
      <marker id="b1" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6D4FC2" />
      </marker>
    </defs>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M72,372 H620 A12,12 0 0 1 632,384 V540 A12,12 0 0 1 620,552 H72 A12,12 0 0 1 60,540 V384 A12,12 0 0 1 72,372 Z" />
    <text x="84" y="404" font-size="15" font-weight="bold" fill="#C77800">设计原则一：简约性（Parsimony）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="436">好科学 = 用最少的原理解释最多的现象</text>
      <text x="84" y="466">（奥卡姆剃刀：如无必要，勿增实体）</text>
      <text x="84" y="502" fill="#51617A">AI 版：偏好能用少量机制解释大量观察的</text>
      <text x="84" y="526" fill="#51617A">内部组织——与 grokking 的"压缩即理解"呼应</text>
    </g>

    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M664,372 H1208 A12,12 0 0 1 1220,384 V540 A12,12 0 0 1 1208,552 H664 A12,12 0 0 1 652,540 V384 A12,12 0 0 1 664,372 Z" />
    <text x="676" y="404" font-size="15" font-weight="bold" fill="#1E8E3E">设计原则二：组合性（Compositionality）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="436">知识靠"组装"积累，而非推倒重来</text>
      <text x="676" y="466">（乐高积木：新模型=旧积木新搭法）</text>
      <text x="676" y="502" fill="#51617A">AI 版：机制库可复用可重组 → 迁移到新领域，</text>
      <text x="676" y="526" fill="#51617A">持续学习只改局部不动全身</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3" d="M72,572 H1208 A12,12 0 0 1 1220,584 V644 A12,12 0 0 1 1208,656 H72 A12,12 0 0 1 60,644 V584 A12,12 0 0 1 72,572 Z" />
    <text x="84" y="604" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#0B6E99">ACL 2026 综述的三个未来方向：</tspan>① 应用可解释性（用机制发现直接改进训练/推理）② 可扩展方法学（现在的解剖工具太贵太慢）</text>
    <text x="84" y="632" font-size="14.5" fill="#1A2433">③ 统一理论——寻找推理的"缩放定律"，像预言模型能力一样预言推理行为（从描述科学到预测科学）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Mechanistic World Models 设计范式（变量/机制/结构三元组）· ACL 2026 大推理模型机制综述路线图</text>
</svg>