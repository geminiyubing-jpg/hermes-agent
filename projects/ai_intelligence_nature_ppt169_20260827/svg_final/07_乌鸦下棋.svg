<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">乌鸦下棋：模型脑内自画出一张棋盘</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Othello-GPT 世界模型实验（Li et al. 2023 / Nanda 线性探针 / 2026 重访 2503.04421）</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V356 A12,12 0 0 1 620,368 H72 A12,12 0 0 1 60,356 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">实验设计：只给它看"棋谱文字"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="182">输入（就像窗外的乌鸦只听得见报棋声）：</text>
      <path fill="#E8F1F8" d="M112,196 H576 A8,8 0 0 1 584,204 V232 A8,8 0 0 1 576,240 H112 A8,8 0 0 1 104,232 V204 A8,8 0 0 1 112,196 Z" />
      <text x="124" y="224" font-family="'SF Mono',monospace" font-size="14">"E6 D3 C4 … F5 G6 ？"</text>
      <text x="84" y="272">任务：猜下一个合法落子（仅此而已！没人告诉它规则，</text>
      <text x="84" y="298">没人给它棋盘，甚至棋谱一半是随机的）</text>
      <text x="84" y="340" fill="#C77800" font-weight="bold">问题：它脑内到底存了什么？</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V356 A12,12 0 0 1 1208,368 H664 A12,12 0 0 1 652,356 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#1E8E3E">发现：脑内自发出一张 64 格棋盘</text>
    
    <g transform="translate(700,170)">
      <path fill="#1A2433" opacity="0.85" d="M6,0 H154 A6,6 0 0 1 160,6 V154 A6,6 0 0 1 154,160 H6 A6,6 0 0 1 0,154 V6 A6,6 0 0 1 6,0 Z" />
      <g fill="#51617A">
        <path d="M13,10 H40 A3,3 0 0 1 43,13 V40 A3,3 0 0 1 40,43 H13 A3,3 0 0 1 10,40 V13 A3,3 0 0 1 13,10 Z" /><path d="M51,10 H78 A3,3 0 0 1 81,13 V40 A3,3 0 0 1 78,43 H51 A3,3 0 0 1 48,40 V13 A3,3 0 0 1 51,10 Z" /><path d="M89,10 H116 A3,3 0 0 1 119,13 V40 A3,3 0 0 1 116,43 H89 A3,3 0 0 1 86,40 V13 A3,3 0 0 1 89,10 Z" /><path d="M127,10 H154 A3,3 0 0 1 157,13 V40 A3,3 0 0 1 154,43 H127 A3,3 0 0 1 124,40 V13 A3,3 0 0 1 127,10 Z" />
        <path d="M13,48 H40 A3,3 0 0 1 43,51 V78 A3,3 0 0 1 40,81 H13 A3,3 0 0 1 10,78 V51 A3,3 0 0 1 13,48 Z" /><path d="M51,48 H78 A3,3 0 0 1 81,51 V78 A3,3 0 0 1 78,81 H51 A3,3 0 0 1 48,78 V51 A3,3 0 0 1 51,48 Z" /><path d="M89,48 H116 A3,3 0 0 1 119,51 V78 A3,3 0 0 1 116,81 H89 A3,3 0 0 1 86,78 V51 A3,3 0 0 1 89,48 Z" /><path d="M127,48 H154 A3,3 0 0 1 157,51 V78 A3,3 0 0 1 154,81 H127 A3,3 0 0 1 124,78 V51 A3,3 0 0 1 127,48 Z" />
        <path d="M13,86 H40 A3,3 0 0 1 43,89 V116 A3,3 0 0 1 40,119 H13 A3,3 0 0 1 10,116 V89 A3,3 0 0 1 13,86 Z" /><path d="M51,86 H78 A3,3 0 0 1 81,89 V116 A3,3 0 0 1 78,119 H51 A3,3 0 0 1 48,116 V89 A3,3 0 0 1 51,86 Z" /><path d="M89,86 H116 A3,3 0 0 1 119,89 V116 A3,3 0 0 1 116,119 H89 A3,3 0 0 1 86,116 V89 A3,3 0 0 1 89,86 Z" /><path d="M127,86 H154 A3,3 0 0 1 157,89 V116 A3,3 0 0 1 154,119 H127 A3,3 0 0 1 124,116 V89 A3,3 0 0 1 127,86 Z" />
        <path d="M13,124 H40 A3,3 0 0 1 43,127 V154 A3,3 0 0 1 40,157 H13 A3,3 0 0 1 10,154 V127 A3,3 0 0 1 13,124 Z" /><path d="M51,124 H78 A3,3 0 0 1 81,127 V154 A3,3 0 0 1 78,157 H51 A3,3 0 0 1 48,154 V127 A3,3 0 0 1 51,124 Z" /><path d="M89,124 H116 A3,3 0 0 1 119,127 V154 A3,3 0 0 1 116,157 H89 A3,3 0 0 1 86,154 V127 A3,3 0 0 1 89,124 Z" /><path d="M127,124 H154 A3,3 0 0 1 157,127 V154 A3,3 0 0 1 154,157 H127 A3,3 0 0 1 124,154 V127 A3,3 0 0 1 127,124 Z" />
      </g>
      <circle cx="64" cy="64" r="11" fill="#FFFFFF" />
      <circle cx="98" cy="98" r="11" fill="#1A2433" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="98" cy="64" r="11" fill="#FFFFFF" />
      <circle cx="64" cy="98" r="11" fill="#1A2433" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
    <g font-size="13.5" fill="#1A2433">
      <text x="890" y="200">用"探针"读取内部激活：</text>
      <text x="890" y="226">64 个格子每格的黑白空</text>
      <text x="890" y="252">状态，都被<tspan font-weight="bold" fill="#1E8E3E">线性地</tspan>记录着</text>
      <text x="890" y="288" font-size="13" fill="#51617A">干预实验：篡改内部某格</text>
      <text x="890" y="310" font-size="13" fill="#51617A">状态 → 模型按"以为的棋面"</text>
      <text x="890" y="332" font-size="13" fill="#51617A">走棋（真的在用它！）</text>
    </g>
    <text x="676" y="356" font-size="13" fill="#1E8E3E" font-weight="bold">2026 重访：大数据量下无监督接地达 99% 精度</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,392 H748 A12,12 0 0 1 760,404 V640 A12,12 0 0 1 748,652 H72 A12,12 0 0 1 60,640 V404 A12,12 0 0 1 72,392 Z" />
    <text x="84" y="424" font-size="15" font-weight="bold" fill="#0B6E99">这个实验为什么重要</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="458">① "预测下一词"的目标，会自发产生对世界结构的认知</text>
      <text x="104" y="484" fill="#51617A">（猜棋谱猜得准的最好办法，就是内部悄悄画一张棋盘）</text>
      <text x="84" y="520">② 智能不一定要"被赋予"，可以"自己长出来"</text>
      <text x="104" y="546" fill="#51617A">（没人教规则，规则被自己发现）</text>
      <text x="84" y="582">③ 它是真的"在用"这个内部模型做决策（干预会改变行为）</text>
      <text x="104" y="608" fill="#51617A">—— 不是事后牵强的解读，是因果生效的表示</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M792,392 H1208 A12,12 0 0 1 1220,404 V640 A12,12 0 0 1 1208,652 H792 A12,12 0 0 1 780,640 V404 A12,12 0 0 1 792,392 Z" />
    <text x="804" y="424" font-size="15" font-weight="bold" fill="#C77800">原论文的乌鸦比喻</text>
    <text x="804" y="456" font-size="13.5" fill="#1A2433">窗外一只乌鸦天天听你们报棋谱，</text>
    <text x="804" y="482" font-size="13.5" fill="#1A2433">某天它也开始"哇哇"报出合法棋步——</text>
    <text x="804" y="516" font-size="13.5" fill="#1A2433">它脑子里有没有一张棋盘？</text>
    <text x="804" y="556" font-size="13.5" fill="#1A2433">Othello-GPT 的回答：<tspan font-weight="bold" fill="#C77800">有，</tspan></text>
    <text x="804" y="582" font-size="13.5" fill="#1A2433">而且可以被读出来、被改写。</text>
    <text x="804" y="622" font-size="12.5" fill="#51617A">（LLM 就是被喂了整个互联网"棋谱"的乌鸦）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Li et al. ICLR 2023 Oral · Neel Nanda 线性探针 · 2503.04421 重访 · 注意：棋盘世界很小，真实世界是否同样涌现仍存争论（P14）</text>
</svg>