<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">大脑的镜像：AI 里自己长出了"部门分工"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Modular Cognitive Architecture Emerges in LLMs · arXiv 2608.13567 · 2026-08（本周新论文）</text>
  </g>

  <!-- human brain side -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="300" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">人脑：天生分四个"部门"</text>
    <text x="84" y="178" font-size="13" fill="#51617A">功能特化是生物脑的显著特征——不同网络分管不同认知：</text>
    <g text-anchor="middle">
      <rect x="100" y="196" width="230" height="64" rx="10" fill="#E8F1F8"/>
      <text x="215" y="222" font-size="14" font-weight="bold" fill="#0B6E99">语言网络</text>
      <text x="215" y="246" font-size="12" fill="#51617A">听说读写</text>
      <rect x="350" y="196" width="230" height="64" rx="10" fill="#FBF3E4"/>
      <text x="465" y="222" font-size="14" font-weight="bold" fill="#C77800">形式推理网络</text>
      <text x="465" y="246" font-size="12" fill="#51617A">数学·逻辑</text>
      <rect x="100" y="272" width="230" height="64" rx="10" fill="#EFEBF8"/>
      <text x="215" y="298" font-size="14" font-weight="bold" fill="#6D4FC2">社会认知网络</text>
      <text x="215" y="322" font-size="12" fill="#51617A">理解他人心思</text>
      <rect x="350" y="272" width="230" height="64" rx="10" fill="#EAF5EE"/>
      <text x="465" y="298" font-size="14" font-weight="bold" fill="#1E8E3E">物理推理网络</text>
      <text x="465" y="322" font-size="12" fill="#51617A">直觉物理</text>
    </g>
    <text x="84" y="372" font-size="13" fill="#1A2433">老问题：这是智能的<tspan font-weight="bold">必然设计</tspan>，还是生物演化的<tspan font-weight="bold">偶然</tspan>？</text>
    <text x="84" y="400" font-size="13" fill="#51617A">→ 检验方法：看完全不同"出身"的 AI 是否也长成这样</text>
  </g>

  <!-- LLM side -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="300" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.35"/>
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#6D4FC2">LLM：电路分析发现同样的分工</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="182">实验：46 个任务 × 四大认知域，</text>
      <text x="676" y="208">追踪每个任务动用了哪些<tspan font-weight="bold">神经元电路</tspan></text>
      <text x="676" y="248" fill="#1E8E3E" font-weight="bold">结果一（重叠）：</text>
      <text x="700" y="274" fill="#1A2433">同类任务（都是"语言题"）→ 用重叠的神经元</text>
      <text x="700" y="300" fill="#1A2433">（在语言部内部解决）</text>
      <text x="676" y="340" fill="#C0392B" font-weight="bold">结果二（分离）：</text>
      <text x="700" y="366" fill="#1A2433">异类任务（语言 vs 物理）→ 用不同的神经元</text>
      <text x="700" y="392" fill="#1A2433">（各自找各自的部门）</text>
    </g>
  </g>

  <!-- mirror diagram -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="442" width="1160" height="210" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="474" font-size="15" font-weight="bold" fill="#1A2433">镜像对照：两套"部门结构"惊人相似</text>
    <!-- human box -->
    <rect x="120" y="496" width="420" height="110" rx="10" fill="#EEF2F8"/>
    <text x="330" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#0B6E99">人脑（演化产物）</text>
    <text x="330" y="550" text-anchor="middle" font-size="12.5" fill="#51617A">语言部 · 逻辑部 · 心理部 · 物理部</text>
    <text x="330" y="578" text-anchor="middle" font-size="12" fill="#8494AB">几十万年演化 + 学习塑造</text>
    <!-- mirror symbol -->
    <path d="M 560 551 L 700 551" stroke="#6D4FC2" stroke-width="3" stroke-dasharray="8,5"/>
    <text x="630" y="535" text-anchor="middle" font-size="13" font-weight="bold" fill="#6D4FC2">镜像趋同</text>
    <!-- LLM box -->
    <rect x="720" y="496" width="420" height="110" rx="10" fill="#EFEBF8"/>
    <text x="930" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#6D4FC2">LLM（梯度下降产物）</text>
    <text x="930" y="550" text-anchor="middle" font-size="12.5" fill="#51617A">语言部 · 逻辑部 · 心理部 · 物理部</text>
    <text x="930" y="578" text-anchor="middle" font-size="12" fill="#8494AB">几个月训练 + 同一个预测目标</text>
    <text x="84" y="636" font-size="14.5" fill="#C0392B" font-weight="bold">论文结论：模块化可能是智能系统的基本属性——不同的"出身"，长出同样的组织</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">类比：两家完全不同的公司（一家百年老店、一家三个月初创），内部都自发长出了财务部/技术部/市场部——分工是效率的必然</text>
</svg>
