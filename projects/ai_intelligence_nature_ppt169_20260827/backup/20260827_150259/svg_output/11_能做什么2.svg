<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">它能做什么 ②：科学·行动·自主工作</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">从工具到同事：AI 正在跨过的三道门槛</text>
  </g>

  <!-- science -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="164" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="1160" height="4" fill="#1E8E3E"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">科学发现：从"预测"走向"解释"（Mechanistic World Models，2607.12474）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="184">· 已实现：蛋白质折叠预测（AlphaFold 诺奖级）、天气、材料筛选——"算得准"的胜利</text>
      <text x="84" y="214">· 正在跨：AI 自主提出机制假设并实验验证——Mechanist 发现信念双头、DNA 序列定向生成</text>
      <text x="84" y="244">· 前沿主张：科学发现 = 知识组织问题。下一代 AI 应围绕"可复用机制"而非"预测映射"组织知识</text>
      <text x="84" y="270" fill="#51617A" font-size="13">（解释比预测更值钱：预测说"会下雨"，解释说"为什么下雨"——后者可迁移到新情境）</text>
    </g>
  </g>

  <!-- agent -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="304" width="572" height="250" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="304" width="572" height="4" fill="#C77800"/>
    <text x="84" y="338" font-size="16" font-weight="bold" fill="#C77800">自主行动（Agent）：给目标，自己干活</text>
    <text x="84" y="366" font-size="12.5" fill="#8494AB">（= 大脑 + 循环 + 工具 + 记忆，Agent 前沿报告的主战场）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="400">· 订机票、查资料、写报告、操作电脑——</text>
      <text x="104" y="424">OSWorld 真实电脑任务 85%</text>
      <text x="84" y="454">· 长任务软肋（Horizon Gap）：多小时任务</text>
      <text x="104" y="478">仍会忘决策/谎报完工/跑偏</text>
      <text x="84" y="508">· 训练侧正在补课：过程信号、记忆重构</text>
      <text x="84" y="538" fill="#C77800" font-weight="bold">定位：可用作"实习生"，还不能当"负责人"</text>
    </g>
  </g>

  <!-- personalized & creation -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="304" width="568" height="250" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="304" width="568" height="4" fill="#6D4FC2"/>
    <text x="676" y="338" font-size="16" font-weight="bold" fill="#6D4FC2">个人助理与持续陪伴：记忆让它"认识你"</text>
    <text x="676" y="366" font-size="12.5" fill="#8494AB">（= 信念双头 + 跨会话记忆系统）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="400">· 记住偏好与约定，跨会话保持一致</text>
      <text x="676" y="430">· 理解"我说的"vs"别人说的"，减少被带偏</text>
      <text x="676" y="460">· 教育：个性化辅导（苏格拉底式提问）</text>
      <text x="676" y="490">· 现状：记忆仍是最大短板（ICML 记忆五重奏</text>
      <text x="700" y="514">正在攻关：评测打假 + 重构式检索）</text>
      <text x="676" y="540" fill="#6D4FC2" font-weight="bold">定位：可用的贴身助手，可靠度取决于记忆与集成质量</text>
    </g>
  </g>

  <!-- bottom summary strip -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="576" width="1160" height="76" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.35"/>
    <text x="84" y="608" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#1E8E3E">一句话总结能力版图：</tspan>凡是能写成文字/代码/图像的知识性工作，它都能显著加速；凡是需要</text>
    <text x="84" y="636" font-size="14.5" fill="#1A2433">持续自主、长期记忆、真实世界行动的工作，它正在快速进步但还没到"托付"级别——机制研究（前半部分）正是这两个差距的说明书。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">引用：2607.12474 机制世界模型 · Mechanist 案例 · OSWorld/Terminal-Bench 数据 · ICML 2026 记忆研究（详见 Agent 前沿报告）</text>
</svg>
