<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">收束：智能的第一性原理</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">把 15 页浓缩成一张图 · 每一环都有本 PPT 的证据支撑</text>
  </g>

  <!-- the equation -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="180" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="640" y="164" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A2433">简单目标（猜下一词）× 海量数据 × 巨大算力</text>
    <text x="640" y="200" text-anchor="middle" font-size="17" fill="#51617A">↓ 优化压力迫使 ↓</text>
    <text x="640" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#0B6E99">特征涌现 + 世界模型成形 + 模块化分工 + 从记忆到泛化的相变</text>
    <text x="640" y="282" text-anchor="middle" font-size="15" fill="#51617A">= 我们称之为"智能"的东西（的大部分）</text>
  </g>

  <!-- evidence chain -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="324" width="1160" height="220" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="356" font-size="15" font-weight="bold" fill="#1A2433">四条证据链回顾（每条都可回溯到论文）</text>
    <g font-size="13.5">
      <rect x="84" y="374" width="270" height="140" rx="10" fill="#E8F1F8"/>
      <text x="100" y="404" font-weight="bold" fill="#0B6E99">特征涌现</text>
      <text x="100" y="432" fill="#1A2433">3400 万张"分类卡"</text>
      <text x="100" y="458" fill="#51617A">按语义地理组织</text>
      <text x="100" y="492" fill="#8494AB" font-size="12">Anthropic（P4）</text>

      <rect x="374" y="374" width="270" height="140" rx="10" fill="#EAF5EE"/>
      <text x="390" y="404" font-weight="bold" fill="#1E8E3E">世界模型</text>
      <text x="390" y="432" fill="#1A2433">乌鸦脑内自画棋盘</text>
      <text x="390" y="458" fill="#51617A">且因果地使用它</text>
      <text x="390" y="492" fill="#8494AB" font-size="12">Othello-GPT（P7）</text>

      <rect x="664" y="374" width="270" height="140" rx="10" fill="#FBF3E4"/>
      <text x="680" y="404" font-weight="bold" fill="#C77800">相变开窍</text>
      <text x="680" y="432" fill="#1A2433">记忆→理解有临界点</text>
      <text x="680" y="458" fill="#51617A">可测量、可预言</text>
      <text x="680" y="492" fill="#8494AB" font-size="12">Grokking 三连（P6）</text>

      <rect x="954" y="374" width="246" height="140" rx="10" fill="#EFEBF8"/>
      <text x="970" y="404" font-weight="bold" fill="#6D4FC2">模块分工</text>
      <text x="970" y="432" fill="#1A2433">与大脑镜像趋同</text>
      <text x="970" y="458" fill="#51617A">不同出身同样组织</text>
      <text x="970" y="492" fill="#8494AB" font-size="12">46 任务电路（P8）</text>
    </g>
  </g>

  <!-- takeaways -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="568" width="1160" height="88" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.35"/>
    <text x="84" y="600" font-size="15" fill="#1A2433"><tspan font-weight="bold" fill="#1E8E3E">记住三句话就够了：</tspan>① 它的智能是"长"出来的不是"编"出来的；② 它强在模式、弱在原理与人不在场的判断；</text>
    <text x="84" y="630" font-size="15" fill="#1A2433">③ 我们正第一次拿着手术刀研究"理解"本身——这件事的意义不亚于 AI 本身。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">注：本页"公式"是对当前证据的通俗综合，非任何单篇论文原文——学术严谨性见各证据页引用</text>
</svg>
