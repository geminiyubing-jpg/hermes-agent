<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">它能做什么 ①：语言·知识·代码·推理</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">"能做什么"的边界，正是前三部分机制的直接外推 · 每项标注成熟度</text>
  </g>

  <!-- 4 quadrants -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="256" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#1E8E3E"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">语言与知识 ★★★★★</text>
    <text x="84" y="180" font-size="12.5" fill="#8494AB">（机制根基：概念字典 + 世界状态理解）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="214">· 写作/翻译/摘要：多语言概念卡互通</text>
      <text x="84" y="244">（金门大桥卡同时点亮中日俄文）</text>
      <text x="84" y="274">· 知识问答：覆盖几乎全部常识与专业知识</text>
      <text x="84" y="304">· 文档检索增强（RAG）：外挂知识库随查随用</text>
      <text x="84" y="340" fill="#1E8E3E">成熟度：生产级——日常工作的可靠助手</text>
    </g>

    <rect x="652" y="118" width="568" height="256" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="118" width="568" height="4" fill="#C77800"/>
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#C77800">代码与工程 ★★★★☆</text>
    <text x="676" y="180" font-size="12.5" fill="#8494AB">（机制根基：原理理解的电路 + 长程训练）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="214">· 写代码/改 bug/重构：主流模型达工程师水准</text>
      <text x="676" y="244">· 自动化测试、代码审查、文档生成</text>
      <text x="676" y="274">· Terminal-Bench 真实命令行任务 88.8%（GPT-5.6）</text>
      <text x="676" y="304">· 自进化 harness（Ouroboros 161 天自我改进）</text>
      <text x="676" y="340" fill="#C77800">成熟度：可用但需人把关——半小时以上的长任务仍会迷路</text>
    </g>

    <rect x="60" y="394" width="572" height="256" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="394" width="572" height="4" fill="#0B6E99"/>
    <text x="84" y="428" font-size="16" font-weight="bold" fill="#0B6E99">推理与分析 ★★★☆☆</text>
    <text x="84" y="456" font-size="12.5" fill="#8494AB">（机制根基：模块化电路 + RL 训练的部署策略）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="490">· 数学/逻辑推理：竞赛级题目表现强劲</text>
      <text x="84" y="520">· "深度思考"模式：先想后答，正确率显著提升</text>
      <text x="84" y="550">· 研究发现：基座已有推理能力，RL 教的是</text>
      <text x="104" y="574">"何时调用"（ACL 2026 综述）</text>
      <text x="84" y="624" fill="#0B6E99">成熟度：强但有暗坑——过度思考、不忠实思维链（P12）</text>
    </g>

    <rect x="652" y="394" width="568" height="256" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="394" width="568" height="4" fill="#6D4FC2"/>
    <text x="676" y="428" font-size="16" font-weight="bold" fill="#6D4FC2">感知与创作 ★★★★☆</text>
    <text x="676" y="456" font-size="12.5" fill="#8494AB">（机制根基：多模态特征 + 组合性（Nature NeuroSci 2026））</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="490">· 看图说话/视频理解/语音识别与合成</text>
      <text x="676" y="520">· 图像/视频/音乐生成（组合泛化是关键机制）</text>
      <text x="676" y="550">· 组合性研究：规模即可涌现组合能力，</text>
      <text x="104" y="574">不必显式编程语法规则</text>
      <text x="676" y="624" fill="#6D4FC2">成熟度：辅助创作成熟，原创品味仍需人来主导</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">★ 评级为通俗化主观校准（综合 benchmark + 部署实践），每项能力都能在本 PPT 前半部分找到对应的机制解释</text>
</svg>
