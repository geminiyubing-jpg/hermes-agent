<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">它替代不了什么：人的三张底牌</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">基于机制研究的诚实边界——不是安慰，是证据</text>
  </g>

  <!-- three cards -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="368" height="330" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="368" height="4" fill="#0B6E99"/>
    <text x="84" y="152" font-size="17" font-weight="bold" fill="#0B6E99">底牌一：判断（Judgment）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="190">机制证据：LLM 的高级理解与低级启发式</text>
      <text x="84" y="214"><tspan font-weight="bold">共存</tspan>，何时用哪套不可预测</text>
      <text x="84" y="254">→ 它能给你一百个方案的分析，</text>
      <text x="84" y="278">但"哪个该做"的价值权衡，</text>
      <text x="84" y="302">仍在决策者手里</text>
      <text x="84" y="360" fill="#51617A" font-size="13">审计视角：抽样风险判断、问题定性尺度、</text>
      <text x="84" y="384" fill="#51617A" font-size="13">移送标准——AI 供参考，人签字</text>
    </g>

    <rect x="456" y="118" width="368" height="330" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="456" y="118" width="368" height="4" fill="#C77800"/>
    <text x="480" y="152" font-size="17" font-weight="bold" fill="#C77800">底牌二：责任（Accountability）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="480" y="190">机制证据：不忠实思维链（充分性 100% /</text>
      <text x="480" y="214">全面性 22%）——解释可能不是真原因</text>
      <text x="480" y="254">→ AI 的"解释"是线索，不是证词</text>
      <text x="480" y="278">重大事项的问责链条必须落在</text>
      <text x="480" y="302">人身上（谁复核、谁签字）</text>
      <text x="480" y="360" fill="#51617A" font-size="13">治理呼应：微软 ACS 五检查点 / ASSERT</text>
      <text x="480" y="384" fill="#51617A" font-size="13">政策驱动评测——把人留在关键环上</text>
    </g>

    <rect x="852" y="118" width="368" height="330" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="852" y="118" width="368" height="4" fill="#1E8E3E"/>
    <text x="876" y="152" font-size="17" font-weight="bold" fill="#1E8E3E">底牌三：在场（Presence）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="876" y="190">机制证据：信念双头=它会"猜你在想什么"，</text>
      <text x="876" y="214">但这是推断不是共情——没有利害、</text>
      <text x="876" y="238">没有身体、没有承担后果</text>
      <text x="876" y="278">→ 陪伴、谈判、教育中的"人到场"，</text>
      <text x="876" y="302">传递的不只是信息，是承诺</text>
      <text x="876" y="360" fill="#51617A" font-size="13">（家庭视角：给孩子讲题的是 AI，</text>
      <text x="876" y="384" fill="#51617A" font-size="13">坐在旁边的是爸爸——缺一不可）</text>
    </g>
  </g>

  <!-- bottom -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="476" width="1160" height="176" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="510" font-size="16" font-weight="bold" fill="#0B6E99">正确的协作姿势（机制视角）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="542">· 让它做"模式匹配"的活（它有 3400 万张分类卡，不知疲倦）</text>
      <text x="84" y="572">· 让人做"意义裁决"的活（判断/责任/在场是人的机制优势）</text>
      <text x="84" y="602">· 对它的输出保持"审计式怀疑"：溯源、交叉验证、独立复核——就像对待一位能力很强但偶尔自信胡说的新同事</text>
      <text x="84" y="632" fill="#0B6E99" font-weight="bold">它增强人，不是替代人——这句话现在有了机制层面的注脚</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">本页所有论断均回链前文机制发现：共存机制（P5）/ 不忠实解释（P12）/ 信念推断非共情（P9）</text>
</svg>
