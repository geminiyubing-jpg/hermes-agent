<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">四大部分 · 18 页 · 约 50 分钟 · 零基础可听懂</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="136" font-size="15" font-weight="bold" fill="#0B6E99">Ⅰ · 它到底是什么：一台"超级填空机"</text>
    <rect x="80" y="150" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="182"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03</tspan>  超级填空机：下一词预测的魔法与误解</text>
      <text x="80" y="212"><tspan font-family="'SF Mono',monospace" fill="#8494AB">04</tspan>  概念字典：3400 万个"分类卡"（Anthropic）</text>
      <text x="80" y="242"><tspan font-family="'SF Mono',monospace" fill="#8494AB">05</tspan>  理解的三级台阶：概念→事实→原理</text>
    </g>

    <text x="80" y="294" font-size="15" font-weight="bold" fill="#C77800">Ⅱ · 它如何"开窍"：智能涌现的机制</text>
    <rect x="80" y="308" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="340"><tspan font-family="'SF Mono',monospace" fill="#8494AB">06</tspan>  Grokking：死记硬背的学生突然开窍（相变）</text>
      <text x="80" y="370"><tspan font-family="'SF Mono',monospace" fill="#8494AB">07</tspan>  乌鸦下棋：Othello 世界模型实验</text>
      <text x="80" y="400"><tspan font-family="'SF Mono',monospace" fill="#8494AB">08</tspan>  大脑的镜像：LLM 里长出"部门分工"</text>
      <text x="80" y="430"><tspan font-family="'SF Mono',monospace" fill="#8494AB">09</tspan>  信念双头：模型分得清"我知道"和"他以为"</text>
    </g>

    <text x="680" y="136" font-size="15" font-weight="bold" fill="#6D4FC2">Ⅲ · 它能做什么：工作版图与边界</text>
    <rect x="680" y="150" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="182"><tspan font-family="'SF Mono',monospace" fill="#8494AB">10</tspan>  能做什么①：语言·知识·代码·推理</text>
      <text x="680" y="212"><tspan font-family="'SF Mono',monospace" fill="#8494AB">11</tspan>  能做什么②：科学发现·自主行动·创作</text>
      <text x="680" y="242"><tspan font-family="'SF Mono',monospace" fill="#8494AB">12</tspan>  它会犯什么错：幻觉·谄媚·不忠实思维链</text>
      <text x="680" y="272"><tspan font-family="'SF Mono',monospace" fill="#8494AB">13</tspan>  它替代不了什么：判断·责任·价值</text>
    </g>

    <text x="680" y="324" font-size="15" font-weight="bold" fill="#1E8E3E">Ⅳ · 本质之争与展望</text>
    <rect x="680" y="338" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="370"><tspan font-family="'SF Mono',monospace" fill="#8494AB">14</tspan>  世界模型 vs 启发式袋子：大论战</text>
      <text x="680" y="400"><tspan font-family="'SF Mono',monospace" fill="#8494AB">15</tspan>  通往原理理解：机制世界模型蓝图</text>
      <text x="680" y="430"><tspan font-family="'SF Mono',monospace" fill="#8494AB">16</tspan>  智能的第一性原理：连接·预测·压缩</text>
    </g>
  </g>

  <rect x="80" y="470" width="1140" height="190" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
  <text x="104" y="502" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#C77800">一句话主线</text>
  <text x="104" y="534" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">AI 的智能不是被"编程"出来的，而是从"预测下一词"这个简单目标下自发长出来的——</text>
  <text x="104" y="560" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">特征自己涌现（3400万张分类卡）、世界模型自己成形（乌鸦脑内棋盘）、部门自己分工（脑镜像）、</text>
  <text x="104" y="586" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">某一天突然从背题开窍成理解（grokking 相变）。理解这个"自发生长"，就理解了它擅长什么、</text>
  <text x="104" y="612" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">害怕什么、以及为什么现在还替代不了人的判断。</text>
  <text x="104" y="642" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8494AB">全部内容基于 2024-2026 顶刊顶会研究（Nature Neuroscience / ICLR / ACL / arXiv / Anthropic），每页配图解与生活类比。</text>
</svg>
