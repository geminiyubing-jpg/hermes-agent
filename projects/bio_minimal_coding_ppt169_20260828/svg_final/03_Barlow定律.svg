<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">Barlow 定律：最少 spike 传递最多信息</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">高效编码假说 · Attneave 1954 先声 · Barlow 1961 形式化 · 60 年验证史</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.35" d="M72,118 H1208 A12,12 0 0 1 1220,130 V256 A12,12 0 0 1 1208,268 H72 A12,12 0 0 1 60,256 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="154" font-size="17" font-weight="bold" fill="#0B6E99">核心思想（一句话版）</text>
    <text x="84" y="190" font-size="15.5" fill="#1A2433">感觉神经元的目标：<tspan font-weight="bold" fill="#0B6E99">在代谢成本与噪声约束下，最大化传递的输入信息</tspan>——</text>
    <text x="84" y="222" font-size="15.5" fill="#1A2433">像压缩文件：只传"意外的、不可预测的"部分；可预测的冗余全部省掉。</text>
    <text x="84" y="250" font-size="13" fill="#51617A">spike（动作电位）是昂贵的：早期视觉通路的动态范围有限，不该浪费在"地面还在地上"这种消息上</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,292 H620 A12,12 0 0 1 632,304 V530 A12,12 0 0 1 620,542 H72 A12,12 0 0 1 60,530 V304 A12,12 0 0 1 72,292 Z" />
    <text x="84" y="326" font-size="15" font-weight="bold" fill="#1E8E3E">60 年来的成功预言</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="360">· 视网膜的感受野结构（中心- Surround 拮抗）</text>
      <text x="104" y="386">= 去除空间冗余的最优滤波器</text>
      <text x="84" y="420">· V1 皮层简单细胞的<tspan font-weight="bold">朝向选择性</tspan></text>
      <text x="104" y="446">= 自然图像稀疏统计的最优基（类似压缩感知）</text>
      <text x="84" y="480">· 适应现象（明适应/对比度适应）</text>
      <text x="104" y="506">= 按输入统计动态调整信道容量分配</text>
    </g>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M664,292 H1208 A12,12 0 0 1 1220,304 V530 A12,12 0 0 1 1208,542 H664 A12,12 0 0 1 652,530 V304 A12,12 0 0 1 664,292 Z" />
    <text x="676" y="326" font-size="15" font-weight="bold" fill="#C77800">信息论视角（为什么必然如此）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="360">· 感觉通路 = 通信信道，容量有限（能耗/噪声）</text>
      <text x="676" y="394">· 自然信号高度冗余（相邻像素相关 ~90%+）</text>
      <text x="676" y="428">· 最优策略必然是：先去除冗余再传输</text>
      <text x="676" y="462" fill="#C77800" font-weight="bold">→ 高效编码不是"可能的设计"，是信道约束下的</text>
      <text x="696" y="488" fill="#C77800" font-weight="bold">数学必然——这解释了为何全物种趋同</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,566 H1208 A12,12 0 0 1 1220,578 V644 A12,12 0 0 1 1208,656 H72 A12,12 0 0 1 60,644 V578 A12,12 0 0 1 72,566 Z" />
    <text x="84" y="598" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#0B6E99">历史地位：</tspan>Barlow 假说之于神经科学，类似最大熵原理之于统计力学——</text>
    <text x="84" y="626" font-size="14.5" fill="#1A2433">一个"第一性原理"式的约束条件，60 年来持续正确预言新实验结果（下一页：它如何统一三个分支）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Barlow 1961《Possible principles underlying sensory messages》· Wikipedia efficient coding hypothesis · PNAS 统一理论综述</text>
</svg>