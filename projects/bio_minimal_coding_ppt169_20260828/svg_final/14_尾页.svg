<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="endGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B6E99" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1E8E3E" stop-opacity="0.07"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#F7F9FC"/>
  <rect width="1280" height="720" fill="url(#endGrad)"/>

  <text x="640" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#51617A" letter-spacing="8">THANK YOU · 系列五篇收官</text>
  <text x="640" y="205" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="bold" fill="#1A2433">生命用 5 亿年解一道压缩题</text>
  <text x="640" y="250" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#C77800">—— 而 AI 才刚开始读题</text>

  <line x1="440" y1="288" x2="840" y2="288" stroke="#D8E0EC"/>

  <text x="640" y="326" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">研究清单</text>
  <g font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#51617A">
    <text x="640" y="354" text-anchor="middle">Barlow 1961 · PNAS 统一理论 PMC5776796 · Nature NS s41593-024-01766-5</text>
    <text x="640" y="378" text-anchor="middle">bioRxiv: 4-neuron 2022.05 / 连接组最优解 2024.11 / 蜂蚁蝇保守 2026.07</text>
    <text x="640" y="402" text-anchor="middle">C. elegans: PMC3098610 · MIT 2026-04 · 洛克菲勒 2026 · 果蝇连接组 FlyEM</text>
  </g>

  <text x="640" y="460" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">观察哨（年度复查）</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1A2433" text-anchor="middle">
    <text x="640" y="488">① 线虫全脑仿真能否跑通"数字 302"——极简原理的终极验证</text>
    <text x="640" y="514">② AI 首个"结构内置"空间模块（不靠学习，接线即罗盘）的出现</text>
    <text x="640" y="540">③ 高效编码理论在 LLM 时代的严格化（3400 万特征的信息效率度量）</text>
    <text x="640" y="566">④ 果蝇/蚁连接组→可控神经回路复现（把最优解移植进芯片）</text>
  </g>

  <text x="640" y="630" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8494AB">采集时点 2026-08-28 · 浅色无网格模板 · 仅供研究交流</text>

