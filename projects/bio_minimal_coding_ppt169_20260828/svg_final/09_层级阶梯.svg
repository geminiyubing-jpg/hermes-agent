<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">极简层级阶梯：从 4 神经元到海马地图</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">空间感知的"造价表"——越基础的表征越便宜，越高级的越昂贵</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M72,500 H318 A12,12 0 0 1 330,512 V648 A12,12 0 0 1 318,660 H72 A12,12 0 0 1 60,648 V512 A12,12 0 0 1 72,500 Z" />
    <text x="84" y="532" font-size="15" font-weight="bold" fill="#1E8E3E">① 朝向（我朝哪）</text>
    <text x="84" y="562" font-size="13" fill="#1A2433">理论下限：4 个神经元</text>
    <text x="84" y="588" font-size="13" fill="#1A2433">果蝇实际：~50 个 EPG</text>
    <text x="84" y="618" font-size="12.5" fill="#51617A">环吸引子 · 寒武纪起源</text>

    
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.4" d="M362,410 H608 A12,12 0 0 1 620,422 V648 A12,12 0 0 1 608,660 H362 A12,12 0 0 1 350,648 V422 A12,12 0 0 1 362,410 Z" />
    <text x="374" y="442" font-size="15" font-weight="bold" fill="#0B6E99">② 路径积分（走了多远）</text>
    <text x="374" y="472" font-size="13" fill="#1A2433">蚂蚁：计步器 + 天体罗盘</text>
    <text x="374" y="498" font-size="13" fill="#1A2433">两个通道的矢量累积</text>
    <text x="374" y="528" font-size="13" fill="#1A2433">无需内部表征</text>
    <text x="374" y="572" font-size="12.5" fill="#51617A">50 万神经元全脑搞定</text>
    <text x="374" y="596" font-size="12.5" fill="#51617A">全部导航（沙漠蚁）</text>

    
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M652,320 H898 A12,12 0 0 1 910,332 V648 A12,12 0 0 1 898,660 H652 A12,12 0 0 1 640,648 V332 A12,12 0 0 1 652,320 Z" />
    <text x="664" y="352" font-size="15" font-weight="bold" fill="#C77800">③ 位置（我在哪）</text>
    <text x="664" y="382" font-size="13" fill="#1A2433">线虫：几个感觉神经元</text>
    <text x="684" y="408" font-size="13" fill="#1A2433">+ 感觉运动闭环</text>
    <text x="664" y="438" font-size="13" fill="#1A2433">无地图——跟着梯度走</text>
    <text x="664" y="478" font-size="13" fill="#1A2433">蚁/蜂：路标序列 +</text>
    <text x="684" y="504" font-size="13" fill="#1A2433">快照匹配（视觉记忆）</text>
    <text x="664" y="566" font-size="12.5" fill="#51617A">拓扑图 + 局部度量即可</text>
    <text x="664" y="590" font-size="12.5" fill="#51617A">（皇家学会框架）</text>

    
    <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.4" d="M942,230 H1208 A12,12 0 0 1 1220,242 V648 A12,12 0 0 1 1208,660 H942 A12,12 0 0 1 930,648 V242 A12,12 0 0 1 942,230 Z" />
    <text x="954" y="262" font-size="15" font-weight="bold" fill="#6D4FC2">④ 认知地图（整个环境）</text>
    <text x="954" y="292" font-size="13" fill="#1A2433">哺乳类创新：海马位置细胞</text>
    <text x="974" y="318" font-size="13" fill="#1A2433">+ 内嗅网格细胞（诺奖）</text>
    <text x="954" y="348" font-size="13" fill="#1A2433">度量坐标系 + 快速重映射</text>
    <text x="954" y="378" font-size="13" fill="#1A2433">+ 情景记忆绑定</text>
    <text x="954" y="438" font-size="13" fill="#6D4FC2" font-weight="bold">"贵"的方案：百万级神经元</text>
    <text x="954" y="464" font-size="13" fill="#6D4FC2" font-weight="bold">只在闭环不够时才启用</text>
    <text x="954" y="530" font-size="12.5" fill="#51617A">人类：+ 语言符号层（最晚出现）</text>
    <text x="954" y="554" font-size="12.5" fill="#51617A">地图/文字/GPS——外包记忆</text>
  </g>

  
  <path d="M 340 580 L 350 560" stroke="#8494AB" stroke-width="2" />
  <path d="M 630 490 L 640 470" stroke="#8494AB" stroke-width="2" />
  <path d="M 920 400 L 930 380" stroke="#8494AB" stroke-width="2" />
  <text x="620" y="200" text-anchor="middle" font-size="14" fill="#8494AB" font-family="'PingFang SC',sans-serif">↑ 造价递增：表征能力越强，神经元/能耗/复杂度越贵</text>
  <text x="620" y="676" text-anchor="middle" font-size="13.5" fill="#C77800" font-weight="bold" font-family="'PingFang SC',sans-serif">演化策略：能用便宜方案绝不用贵的——每层只在下一层不够用时才被发明</text>

  <text x="60" y="700" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">综合自本报告全部研究 + 皇家学会导航工具箱 · 与系列第二篇（空间本源）的层级完全对应</text>
</svg>