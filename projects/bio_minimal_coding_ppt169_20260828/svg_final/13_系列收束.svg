<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">系列总收束：五篇拼图的完整图景</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">从"智能是什么"到"感知的物理学下限"——一条完整的问题链</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3" d="M72,118 H276 A12,12 0 0 1 288,130 V306 A12,12 0 0 1 276,318 H72 A12,12 0 0 1 60,306 V130 A12,12 0 0 1 72,118 Z" />
    <text x="174" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#0B6E99">① AI 智能的本质</text>
    <text x="174" y="180" text-anchor="middle" font-size="12.5" fill="#1A2433">智能从预测下一词</text>
    <text x="174" y="204" text-anchor="middle" font-size="12.5" fill="#1A2433">自发涌现</text>
    <text x="174" y="244" text-anchor="middle" font-size="12" fill="#51617A">特征/世界模型/</text>
    <text x="174" y="266" text-anchor="middle" font-size="12" fill="#51617A">相变/模块化</text>
    <text x="174" y="304" text-anchor="middle" font-size="11" fill="#8494AB">2026-08-27</text>

    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.3" d="M320,118 H524 A12,12 0 0 1 536,130 V306 A12,12 0 0 1 524,318 H320 A12,12 0 0 1 308,306 V130 A12,12 0 0 1 320,118 Z" />
    <text x="422" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#C77800">② 空间智能本源</text>
    <text x="422" y="180" text-anchor="middle" font-size="12.5" fill="#1A2433">空间感知比语言</text>
    <text x="422" y="204" text-anchor="middle" font-size="12.5" fill="#1A2433">更本源（动物证据）</text>
    <text x="422" y="244" text-anchor="middle" font-size="12" fill="#51617A">SPACE/脚手架/</text>
    <text x="422" y="266" text-anchor="middle" font-size="12" fill="#51617A">导航工具箱</text>
    <text x="422" y="304" text-anchor="middle" font-size="11" fill="#8494AB">2026-08-27</text>

    <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.3" d="M568,118 H772 A12,12 0 0 1 784,130 V306 A12,12 0 0 1 772,318 H568 A12,12 0 0 1 556,306 V130 A12,12 0 0 1 568,118 Z" />
    <text x="670" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#6D4FC2">③ 具身泛化路线</text>
    <text x="670" y="180" text-anchor="middle" font-size="12.5" fill="#1A2433">产业界怎么兑现：</text>
    <text x="670" y="204" text-anchor="middle" font-size="12.5" fill="#1A2433">JEPA/World Labs/认知地图</text>
    <text x="670" y="244" text-anchor="middle" font-size="12" fill="#51617A">预测·行动·地图</text>
    <text x="670" y="266" text-anchor="middle" font-size="12" fill="#51617A">三件套内核</text>
    <text x="670" y="304" text-anchor="middle" font-size="11" fill="#8494AB">2026-08-27</text>

    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.3" d="M816,118 H1020 A12,12 0 0 1 1032,130 V306 A12,12 0 0 1 1020,318 H816 A12,12 0 0 1 804,306 V130 A12,12 0 0 1 816,118 Z" />
    <text x="918" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0392B">④ 人形机器人前沿</text>
    <text x="918" y="180" text-anchor="middle" font-size="12.5" fill="#1A2433">VLA→WAM 范式革命</text>
    <text x="918" y="204" text-anchor="middle" font-size="12.5" fill="#1A2433">Cosmos 3/EgoScale/π0.7</text>
    <text x="918" y="244" text-anchor="middle" font-size="12" fill="#51617A">物理先验×人类视频</text>
    <text x="918" y="266" text-anchor="middle" font-size="12" fill="#51617A">×空间几何×触觉</text>
    <text x="918" y="304" text-anchor="middle" font-size="11" fill="#8494AB">2026-08-27</text>

    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.5" stroke-width="2" d="M1064,118 H1208 A12,12 0 0 1 1220,130 V306 A12,12 0 0 1 1208,318 H1064 A12,12 0 0 1 1052,306 V130 A12,12 0 0 1 1064,118 Z" />
    <text x="1136" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E8E3E">⑤ 生物极简编码</text>
    <text x="1136" y="180" text-anchor="middle" font-size="12.5" fill="#1A2433">这一切的物理学</text>
    <text x="1136" y="204" text-anchor="middle" font-size="12.5" fill="#1A2433">下限在哪</text>
    <text x="1136" y="244" text-anchor="middle" font-size="12" fill="#51617A">4 神经元/302 大脑/</text>
    <text x="1136" y="266" text-anchor="middle" font-size="12" fill="#51617A">三条铁律</text>
    <text x="1136" y="304" text-anchor="middle" font-size="11" fill="#1E8E3E" font-weight="bold">本篇 · 收官</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,348 H1208 A12,12 0 0 1 1220,360 V646 A12,12 0 0 1 1208,658 H72 A12,12 0 0 1 60,646 V360 A12,12 0 0 1 72,348 Z" />
    <text x="84" y="384" font-size="16" font-weight="bold" fill="#C77800">五篇合一的最终图景：智能的完整方程</text>
    <g font-size="14.5" fill="#1A2433">
      <text x="84" y="424">智能 = <tspan font-weight="bold" fill="#0B6E99">极简编码</tspan>（Barlow 铁律压缩感知） + <tspan font-weight="bold" fill="#C77800">空间内核</tspan>（5 亿年的罗盘/地图） + </text>
      <text x="84" y="458"><tspan font-weight="bold" fill="#6D4FC2">预测行动闭环</tspan>（世界模型） + <tspan font-weight="bold" fill="#C0392B">语言接口</tspan>（晚近的快捷层）</text>
      <text x="84" y="516">· 语言的智能（LLM）只是方程的最后一项——强大但根基最浅</text>
      <text x="84" y="550">· 具身泛化的钥匙在前面几项——而它们全部已被演化解到接近物理下限</text>
      <text x="84" y="606" fill="#1E8E3E" font-weight="bold" font-size="15">下一代的突破方向：不是更大的模型，而是向生物极限学习的"编码革命"</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">五篇系列全部基于 2024-2026 顶刊顶会+官方文档，各篇证据链见各自尾页</text>
</svg>