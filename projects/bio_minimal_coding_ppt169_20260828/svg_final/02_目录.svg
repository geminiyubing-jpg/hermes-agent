<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">四部分 · 14 页 · 约 40 分钟 · 系列第五篇（收官之作）</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="140" font-size="15" font-weight="bold" fill="#0B6E99">Ⅰ · 理论基石：60 年的"省电哲学"</text>
    <rect x="80" y="154" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03</tspan>  Barlow 定律：最少 spike 传递最多信息</text>
      <text x="80" y="220"><tspan font-family="'SF Mono',monospace" fill="#8494AB">04</tspan>  三码合一：高效 · 稀疏 · 预测的统一</text>
    </g>

    <text x="80" y="280" font-size="15" font-weight="bold" fill="#C0392B">Ⅱ · 三大极简实证</text>
    <rect x="80" y="294" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="328"><tspan font-family="'SF Mono',monospace" fill="#8494AB">05</tspan>  方向罗盘：4 个神经元的数学奇迹</text>
      <text x="80" y="360"><tspan font-family="'SF Mono',monospace" fill="#8494AB">06</tspan>  果蝇连接组：演化写进接线图的最优解</text>
      <text x="80" y="392"><tspan font-family="'SF Mono',monospace" fill="#8494AB">07</tspan>  302 个神经元的一生：线虫的极简触觉</text>
      <text x="80" y="424"><tspan font-family="'SF Mono',monospace" fill="#8494AB">08</tspan>  蝇眼视觉：百万分之一功耗的飞行计算机</text>
    </g>

    <text x="680" y="140" font-size="15" font-weight="bold" fill="#C77800">Ⅲ · 三条铁律与层级</text>
    <rect x="680" y="154" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">09</tspan>  极简层级阶梯：从 4 神经元到海马地图</text>
      <text x="680" y="220"><tspan font-family="'SF Mono',monospace" fill="#8494AB">10</tspan>  铁律一：压缩到行为相关的最小统计量</text>
      <text x="680" y="252"><tspan font-family="'SF Mono',monospace" fill="#8494AB">11</tspan>  铁律二：硬件即算法 · 铁律三：闭环代替表征</text>
    </g>

    <text x="680" y="312" font-size="15" font-weight="bold" fill="#1E8E3E">Ⅳ · 对 AI 的终极启示</text>
    <rect x="680" y="326" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="360"><tspan font-family="'SF Mono',monospace" fill="#8494AB">12</tspan>  3400 万特征 vs 50 个罗盘神经元</text>
      <text x="680" y="392"><tspan font-family="'SF Mono',monospace" fill="#8494AB">13</tspan>  系列总收束：五篇拼图的完整图景</text>
      <text x="680" y="424"><tspan font-family="'SF Mono',monospace" fill="#8494AB">14</tspan>  尾页：清单与观察哨</text>
    </g>
  </g>

  <path fill="#FFFFFF" stroke="#D8E0EC" d="M92,470 H1208 A12,12 0 0 1 1220,482 V648 A12,12 0 0 1 1208,660 H92 A12,12 0 0 1 80,648 V482 A12,12 0 0 1 92,470 Z" />
  <text x="104" y="502" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#C77800">一句话主线</text>
  <text x="104" y="534" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">生命用 5 亿年时间做了一道压缩题：把"感知世界所需的表征"压到信息论下限——</text>
  <text x="104" y="560" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">只编行为相关的量、把数学写进接线图、能用闭环就不建模型。今天 AI 的感知编码密度，</text>
  <text x="104" y="586" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">距离这个下限还有天文数字的差距——而通往它的路，演化已经替我们探过了。</text>
  <text x="104" y="634" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8494AB">承接系列前四篇：智能本质 → 空间本源 → 具身路线 → 全模态输入 → 本篇：感知的信息论极限</text>
</svg>