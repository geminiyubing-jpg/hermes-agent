<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">302 个神经元的一生：线虫的极简触觉</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">C. elegans 秀丽隐杆线虫 · 唯一连接组完全已知的动物 · 2026 三项新成果</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V366 A12,12 0 0 1 620,378 H72 A12,12 0 0 1 60,366 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#C77800">这个生物的"全部家当"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="184">· 身长 1 毫米，<tspan font-family="'SF Mono',monospace" font-weight="bold" fill="#C77800">302 个神经元</tspan>（人脑的 2.8 亿分之一）</text>
      <text x="84" y="216">· 连接组 1986 年完全画出（电镜逐片重建）</text>
      <text x="104" y="242">每个个体一模一样——神经科学的"果蝇中的果蝇"</text>
      <text x="84" y="280">· 302 个神经元实现：触觉、化学感应、温度、</text>
      <text x="104" y="306">觅食、交配、睡眠……完整的一生</text>
      <text x="84" y="352" fill="#C77800" font-weight="bold">= 已知最低配的"全功能大脑"</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.35" d="M664,118 H1208 A12,12 0 0 1 1220,130 V366 A12,12 0 0 1 1208,378 H664 A12,12 0 0 1 652,366 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#0B6E99">触觉编码：简到骨子里</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="184">· 轻触通道： handful 个触觉神经元（ASH/PLM 等）</text>
      <text x="700" y="210">感受机械形变 → 直接反射回路</text>
      <text x="676" y="244">· 重触通道：另一组神经元分流处理</text>
      <text x="700" y="270">（同一模态，按强度分通道，无融合表征）</text>
      <text x="676" y="304">· 无"触觉地图"、无物体表征——</text>
      <text x="700" y="330" font-weight="bold" fill="#0B6E99">刺激 → 反射，一步到位</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,404 H1208 A12,12 0 0 1 1220,416 V644 A12,12 0 0 1 1208,656 H72 A12,12 0 0 1 60,644 V416 A12,12 0 0 1 72,404 Z" />
    <text x="84" y="438" font-size="15" font-weight="bold" fill="#1E8E3E">2026 年三项新成果</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="474">① MIT（2026-04）：全脑活动图谱完成——"跟着鼻子走"的化学趋化导航中，302 个神经元的</text>
      <text x="104" y="500">每一步活动被完整映射：感觉梯度 → 转向决策，中间几乎没有"推理层"</text>
      <text x="84" y="536">② 洛克菲勒（2026）：发现线虫也有<tspan font-weight="bold" fill="#1E8E3E">脉冲神经元</tspan>（此前以为全是梯度电位）——</text>
      <text x="104" y="562">最小尺度上的"数字通信"经济学：脉冲贵但抗噪，该省省该花花</text>
      <text x="84" y="598" fill="#C77800" font-weight="bold">③ 方法论价值：连接组完全已知 + 神经元少 = 唯一能"全脑仿真"的动物，极简原理的验证场</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：PMC3098610（触觉通道）· MIT News 2026-04《navigating nematodes》· 洛克菲勒大学 2026 · Frontiers Aging Neurosci 2026 综述</text>
</svg>