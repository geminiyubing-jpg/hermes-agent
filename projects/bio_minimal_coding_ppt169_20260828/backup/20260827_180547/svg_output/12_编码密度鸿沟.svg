<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">3400 万特征 vs 50 个罗盘神经元</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">对 AI 的终极启示：编码密度的鸿沟与机会</text>
  </g>

  <!-- the comparison -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="270" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#0B6E99"/>
    <text x="84" y="152" font-size="15.5" font-weight="bold" fill="#0B6E99">AI 现状（系列第一篇回顾）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="188">· Anthropic 从 Claude 拆出 3400 万特征</text>
      <text x="104" y="214">（金门大桥卡点亮中日俄文+图片）</text>
      <text x="84" y="252">· 但 SPACE 基准：空间认知接近随机</text>
      <text x="104" y="278">（心理旋转/视角切换不及动物）</text>
      <text x="84" y="316">· 特征多而杂：没有按行为剪裁</text>
      <text x="84" y="370" fill="#0B6E99" font-weight="bold">"什么都编"的富编码 = 高容量低效率</text>
    </g>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="270" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <rect x="652" y="118" width="568" height="4" fill="#1E8E3E"/>
    <text x="676" y="152" font-size="15.5" font-weight="bold" fill="#1E8E3E">生物上限（本篇）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188">· 方向罗盘：50 个神经元（理论 4 个）</text>
      <text x="104" y="0"></text>
      <text x="676" y="214">· 全功能大脑：302 个（线虫）</text>
      <text x="676" y="252">· 全向运动视觉：~100 万（蝇，1mW）</text>
      <text x="676" y="290">· 每个表征都被行为必要性论证过</text>
      <text x="676" y="370" fill="#1E8E3E" font-weight="bold">"按需编码"的穷编码 = 低容量高效率</text>
    </g>
  </g>

  <!-- gap chart -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="414" width="1160" height="244" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="448" font-size="15" font-weight="bold" fill="#C0392B">数量级鸿沟（编者估算）</text>
    <!-- log bar chart -->
    <line x1="380" y1="580" x2="1180" y2="580" stroke="#8494AB" stroke-width="1.5"/>
    <g font-size="13">
      <text x="84" y="490">果蝇罗盘（50 单元）</text>
      <rect x="380" y="472" width="60" height="24" rx="4" fill="#1E8E3E"/>
      <text x="84" y="530">线虫全脑（302 单元）</text>
      <rect x="380" y="512" width="70" height="24" rx="4" fill="#1E8E3E"/>
      <text x="84" y="570">AI 空间注意力层</text>
      <rect x="380" y="552" width="600" height="24" rx="4" fill="#C0392B" opacity="0.75"/>
      <text x="990" y="570" font-family="'SF Mono',monospace" fill="#C0392B" font-weight="bold">~10⁶-10⁹ 参数</text>
    </g>
    <text x="380" y="618" font-size="12.5" fill="#8494AB">（对数尺度示意：同样"知道朝哪"的任务，参数量差 4-7 个数量级）</text>
    <text x="84" y="648" font-size="14" fill="#C0392B" font-weight="bold">方向：不是 AI 太强，是生物把这道题解到了物理下限——向极限学习，而非堆料</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">AI 数据回链：系列第一篇（3400 万特征/SPACE 基准）· 数量级为编者示意估算，非论文数据</text>
</svg>
