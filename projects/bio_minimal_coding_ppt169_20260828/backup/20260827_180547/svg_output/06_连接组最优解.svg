<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">果蝇连接组：演化写进接线图的最优解</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">bioRxiv 2024.11.01.621596《From the fly connectome to exact ring attractor dynamics》</text>
  </g>

  <!-- from structure to math -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="200" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="152" font-size="15" font-weight="bold" fill="#6D4FC2">研究做了什么：突触计数 → 数学验证</text>
    <g text-anchor="middle">
      <rect x="100" y="176" width="300" height="110" rx="10" fill="#EFEBF8"/>
      <text x="250" y="208" font-size="13.5" font-weight="bold" fill="#6D4FC2">电子显微镜连接组</text>
      <text x="250" y="234" font-size="12.5" fill="#1A2433">EPG（兴奋）与 Δ7（抑制）</text>
      <text x="250" y="258" font-size="12.5" fill="#1A2433">每个突触都被数出来</text>
      <rect x="460" y="176" width="300" height="110" rx="10" fill="#EFEBF8"/>
      <text x="610" y="208" font-size="13.5" font-weight="bold" fill="#6D4FC2">换算成网络权重</text>
      <text x="610" y="234" font-size="12.5" fill="#1A2433">突触计数 × 少数细胞类型</text>
      <text x="610" y="258" font-size="12.5" fill="#1A2433">特异性缩放因子</text>
      <rect x="820" y="176" width="360" height="110" rx="10" fill="#EFEBF8"/>
      <text x="1000" y="208" font-size="13.5" font-weight="bold" fill="#6D4FC2">代入环吸引子理论</text>
      <text x="1000" y="234" font-size="12.5" fill="#1A2433">检验：能否自持连续环吸引子？</text>
      <text x="1000" y="258" font-size="12.5" fill="#1A2433">能否精确积分角速度？</text>
    </g>
  </g>

  <!-- the verdict -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="344" width="572" height="200" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="84" y="378" font-size="15" font-weight="bold" fill="#1E8E3E">判决：恰好落在最优区间</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="414">果蝇的接线图<tspan font-weight="bold" fill="#1E8E3E">"惊人地好配置"</tspan>——</text>
      <text x="104" y="440">满足自持连续环吸引子的全部数学条件</text>
      <text x="84" y="480">不是"近似能跑"，是接近理论最优解</text>
      <text x="84" y="520" fill="#1E8E3E" font-weight="bold">演化不是试错出"能用"的网，是收敛到"最优"的网</text>
    </g>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="344" width="568" height="200" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4"/>
    <text x="676" y="378" font-size="15" font-weight="bold" fill="#C77800">稳健性机制：模块化（Modulability）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="414">个体间突触数量有差异（连接组已实测多只蝇）</text>
      <text x="700" y="440">→ 但只需神经调质重标定少数缩放因子，</text>
      <text x="700" y="466">即可补偿变异、恢复最优动力学</text>
      <text x="676" y="506" fill="#C77800" font-weight="bold">= 高维连接组里只有少数维度真正承载计算——</text>
      <text x="700" y="528" fill="#C77800" font-weight="bold">其余维度是"容错余量"</text>
    </g>
  </g>

  <!-- deep conservation -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="568" width="1160" height="88" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="600" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#0B6E99">2026-07 加冕：</tspan>蜂、蚁、蝇的头方向回路深度保守（bioRxiv 740564）——不同生态位、不同体型，</text>
    <text x="84" y="628" font-size="14.5" fill="#1A2433">同一个极简蓝图 → 再次证明这是物理必然解，不是演化的一次性运气</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：bioRxiv 2024.11.01.621596 · 《Deep conservation of head direction circuits in bees, ants and flies》bioRxiv 2026.07.26</text>
</svg>
