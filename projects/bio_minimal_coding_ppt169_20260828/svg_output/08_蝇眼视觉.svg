<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">蝇眼视觉：百万分之一功耗的飞行计算机</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">果蝇视叶连接组已完整解析 · Reichardt 相关器 1969 至今仍是神经形态芯片标配</text>
  </g>

  <!-- numbers -->
  <g font-family="'SF Mono','Menlo',monospace">
    <rect x="60" y="118" width="1160" height="120" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="152" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#0B6E99">数量级对比</text>
    <text x="84" y="188" font-size="17" fill="#1A2433">蝇视觉系统 ~10⁶ 神经元 · 功耗 ~1 mW<tspan fill="#8494AB" font-size="13" font-family="'PingFang SC',sans-serif">（人视网膜感光细胞 1.25×10⁸；GPU 万瓦级）</tspan></text>
    <text x="84" y="220" font-size="17" fill="#1A2433">任务：防撞 + 着陆 + 追踪交配目标 + 天体罗盘<tspan fill="#8494AB" font-size="13" font-family="'PingFang SC',sans-serif"> ——全部实时完成</tspan></text>
  </g>

  <!-- Reichardt -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="264" width="700" height="280" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.35"/>
    <text x="84" y="298" font-size="15" font-weight="bold" fill="#0B6E99">Reichardt 相关器：两个单元算一个方向（1969 经典）</text>
    <!-- circuit -->
    <g>
      <rect x="110" y="324" width="120" height="52" rx="8" fill="#FFFFFF" stroke="#0B6E99"/>
      <text x="170" y="348" text-anchor="middle" font-size="12.5" fill="#1A2433">左眼像素</text>
      <text x="170" y="366" text-anchor="middle" font-size="11" fill="#51617A">信号 A</text>
      <rect x="110" y="400" width="120" height="52" rx="8" fill="#FFFFFF" stroke="#0B6E99"/>
      <text x="170" y="424" text-anchor="middle" font-size="12.5" fill="#1A2433">右眼像素</text>
      <text x="170" y="442" text-anchor="middle" font-size="11" fill="#51617A">信号 B</text>
      <rect x="300" y="400" width="100" height="52" rx="8" fill="#FBF3E4" stroke="#C77800"/>
      <text x="350" y="424" text-anchor="middle" font-size="12.5" fill="#C77800">延迟 τ</text>
      <text x="350" y="442" text-anchor="middle" font-size="11" fill="#51617A">等一拍</text>
      <rect x="470" y="362" width="100" height="52" rx="8" fill="#FBECEA" stroke="#C0392B"/>
      <text x="520" y="386" text-anchor="middle" font-size="12.5" fill="#C0392B">× 乘法</text>
      <text x="520" y="404" text-anchor="middle" font-size="11" fill="#51617A">相关运算</text>
      <rect x="620" y="362" width="110" height="52" rx="8" fill="#EAF5EE" stroke="#1E8E3E"/>
      <text x="675" y="386" text-anchor="middle" font-size="12.5" fill="#1E8E3E">方向输出</text>
      <text x="675" y="404" text-anchor="middle" font-size="11" fill="#51617A">动了没？朝哪动？</text>
      <path d="M 230 426 L 300 426" stroke="#8494AB" stroke-width="2" marker-end="url(#r1)"/>
      <path d="M 230 350 Q 400 350 470 378" stroke="#8494AB" stroke-width="2" fill="none" marker-end="url(#r1)"/>
      <path d="M 400 426 Q 440 426 470 400" stroke="#8494AB" stroke-width="2" fill="none" marker-end="url(#r1)"/>
      <path d="M 570 388 L 620 388" stroke="#8494AB" stroke-width="2" marker-end="url(#r1)"/>
      <defs>
        <marker id="r1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
          <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB"/>
        </marker>
      </defs>
    </g>
    <text x="84" y="492" font-size="13.5" fill="#1A2433">原理：一路延迟一拍再与另一路相乘——若物体朝该方向动，两路信号相关最大</text>
    <text x="84" y="520" font-size="13" fill="#51617A">一对单元检测一个运动方向；蝇眼 repetitions 排布成阵列 = 全向运动感知</text>
  </g>

  <!-- principle -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="780" y="264" width="440" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="804" y="298" font-size="15" font-weight="bold" fill="#C77800">核心原则：按行为剪裁</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="334">· 蝇不需要"识别花"——只需要防撞、</text>
      <text x="824" y="360">着陆、追踪；视觉系统按行为需求剪裁</text>
      <text x="804" y="398">· 连接组解析显示：每个视觉功能由</text>
      <text x="824" y="424"><tspan font-weight="bold">极少数命名的神经元类型</tspan>实现</text>
      <text x="824" y="450">（T4/T4' 做方向选择性运动检测）</text>
      <text x="804" y="496" fill="#C77800" font-weight="bold">每个比特都花在刀刃上——没有"备用"的视觉</text>
    </g>
  </g>

  <!-- bottom -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="568" width="1160" height="88" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.35"/>
    <text x="84" y="600" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#1E8E3E">工程影响：</tspan>Reichardt 相关器至今是神经形态芯片（事件相机+脉冲芯片）的标配模块——</text>
    <text x="84" y="628" font-size="14.5" fill="#1A2433">无人机避障研究持续从蝇眼逆向工程取经：57 年前的两单元电路，仍是"性价比"天花板</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：果蝇视叶连接组（FlyEM/Janelia）· Reichardt 1969 控制论经典 · 神经形态工程文献</text>
</svg>
