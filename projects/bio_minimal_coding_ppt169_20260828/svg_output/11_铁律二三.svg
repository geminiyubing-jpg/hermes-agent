<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">铁律二：硬件即算法 · 铁律三：闭环代替表征</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">不学而会的数学 · 能不建模型就不建模型</text>
  </g>

  <!-- rule 2 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="290" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.4"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#6D4FC2">铁律二：硬件即算法</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="188">果蝇环吸引子的数学（吸引、持续、积分）</text>
      <text x="104" y="214">不是学出来的——<tspan font-weight="bold" fill="#6D4FC2">是接线图天生的</tspan></text>
      <text x="84" y="252">· 8 列结构 = 360°/8，几何即语义</text>
      <text x="84" y="280">· EPG 兴奋 + Δ7 抑制的连接模式</text>
      <text x="104" y="306">自持连续环吸引子——出生即会导航</text>
      <text x="84" y="344">· 幼体不需要"学习方向感"训练</text>
      <text x="84" y="382" fill="#6D4FC2" font-weight="bold">→ 演化把最优解编译进了基因/结构，</text>
      <text x="104" y="404" fill="#6D4FC2" font-weight="bold">个体只需生长不需学习</text>
    </g>
  </g>

  <!-- rule 3 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="290" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">铁律三：闭环代替表征</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188">线虫趋化导航不建任何内部"气味地图"：</text>
      <rect x="696" y="206" width="480" height="56" rx="8" fill="#FFFFFF" stroke="#1E8E3E" stroke-opacity="0.3"/>
      <text x="936" y="230" text-anchor="middle">感觉当前浓度 → 偏转 → 再感觉 → 再偏转</text>
      <text x="936" y="250" text-anchor="middle" font-size="12" fill="#51617A">（感知-行动-感知的反馈回路）</text>
      <text x="676" y="296">世界本身就是最好的"数据库"——</text>
      <text x="696" y="322">需要什么信息，动一动再测一次就有</text>
      <text x="676" y="360">表征（内部模型）只在闭环不够用时发明：</text>
      <text x="696" y="386">环境变化太快/行动代价太高/需要规划时</text>
      <text x="676" y="400" fill="#1E8E3E" font-weight="bold" font-size="13">地图最贵所以最后出现（P9 阶梯）</text>
    </g>
  </g>

  <!-- synthesis -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="434" width="1160" height="224" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="468" font-size="15" font-weight="bold" fill="#C77800">三条铁律合起来读：生物的"编码哲学"</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="504">① 只编对行动有用的量（最小充分统计量）——决定"编什么"</text>
      <text x="84" y="538">② 能写进结构的不留给学习（硬件即算法）——决定"怎么实现"</text>
      <text x="84" y="572">③ 能靠世界反馈解决的不建内部模型（闭环优先）——决定"要不要编"</text>
      <text x="84" y="630" fill="#C77800" font-weight="bold">= 一套完整的"感知工程经济学"：每个比特、每个神经元、每个模型都要论证其必要性</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">铁律二证据：果蝇连接组最优解研究（P6）· 铁律三证据：线虫全脑图谱（P7）· 三律为编者综合提炼</text>
</svg>
