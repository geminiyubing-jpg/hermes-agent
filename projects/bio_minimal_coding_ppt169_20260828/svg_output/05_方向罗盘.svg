<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">方向罗盘：4 个神经元的数学奇迹</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Nature Neuroscience 2024 + bioRxiv 2022 · 颠覆"环吸引子需要大网络"的教科书</text>
  </g>

  <!-- ring attractor visual -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="620" height="300" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">环吸引子：一圈神经元 = 一个罗盘</text>
    <!-- 8-column ring -->
    <g transform="translate(240,270)">
      <circle cx="0" cy="0" r="95" fill="none" stroke="#D8E0EC" stroke-width="2"/>
      <g>
        <circle cx="0" cy="-95" r="16" fill="#E8F1F8" stroke="#0B6E99"/>
        <circle cx="67" cy="-67" r="16" fill="#E8F1F8" stroke="#0B6E99"/>
        <circle cx="95" cy="0" r="16" fill="#E8F1F8" stroke="#0B6E99"/>
        <circle cx="67" cy="67" r="16" fill="#E8F1F8" stroke="#0B6E99"/>
        <circle cx="0" cy="95" r="16" fill="#E8F1F8" stroke="#0B6E99"/>
        <circle cx="-67" cy="67" r="16" fill="#E8F1F8" stroke="#0B6E99"/>
        <circle cx="-95" cy="0" r="16" fill="#E8F1F8" stroke="#0B6E99"/>
        <circle cx="-67" cy="-67" r="16" fill="#E8F1F8" stroke="#0B6E99"/>
      </g>
      <!-- active bump -->
      <circle cx="67" cy="-67" r="16" fill="#C0392B"/>
      <text x="67" y="-62" text-anchor="middle" font-size="11" fill="#FFFFFF">★</text>
      <text x="0" y="130" text-anchor="middle" font-size="12" fill="#51617A">8 列 = 360°/8，活跃团块位置 = 朝向</text>
    </g>
    <g font-size="13.5" fill="#1A2433">
      <text x="420" y="210">· 果蝇中央复合体：</text>
      <text x="440" y="236">不到 50 个 EPG 罗盘神经元</text>
      <text x="440" y="262">排成 8 列均匀覆盖 360°</text>
      <text x="420" y="300">· 团块活跃位置=头朝向；</text>
      <text x="440" y="326">无输入时也持续（记忆）；</text>
      <text x="440" y="352">角速度输入推动团块转动</text>
    </g>
  </g>

  <!-- the 4-neuron result -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="700" y="118" width="520" height="300" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4"/>
    <text x="724" y="150" font-size="15" font-weight="bold" fill="#C0392B">颠覆性结论：4 个就够</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="724" y="186">教科书观点：环吸引子需要大量神经元</text>
      <text x="744" y="212">保证表征"连续且准确"</text>
      <text x="724" y="252">数学证明（受果蝇黑暗导航启发）：</text>
      <text x="744" y="280" font-weight="bold" fill="#C0392B">最少 4 个计算单元，连接精确调谐，</text>
      <text x="744" y="306" font-weight="bold" fill="#C0392B">即可匹配大网络的全部性能</text>
      <text x="724" y="346">· 持续表征（无输入不失忆）</text>
      <text x="724" y="372">· 角速度精确积分（转多少记多少）</text>
      <text x="724" y="398" fill="#51617A" font-size="13">解析给出"规模 vs 调谐精度"权衡公式</text>
    </g>
  </g>

  <!-- implications -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="444" width="1160" height="212" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="478" font-size="15" font-weight="bold" fill="#C77800">这意味着什么</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="512">① 空间表征的信息论下限极低——"知道朝哪"本质只需几比特/几单元，昂贵的是精度而非原理</text>
      <text x="84" y="546">② 演化选择"少而精"而非"多而糙"：调谐好 4 个连接 vs 维护 1000 个神经元，前者代谢上完胜</text>
      <text x="84" y="596" fill="#C77800" font-weight="bold">③ 对 AI 的刺：今天用一个注意力层（百万参数）做的事，生物用 4 个单元做——编码效率差着 5-6 个数量级</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Nature Neuroscience s41593-024-01766-5《...with a handful of neurons》· bioRxiv 2022.05.23.493052《Accurate angular integration with only a handful of neurons》</text>
</svg>
