<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">铁律一：压缩到行为相关的最小统计量</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">不编"世界是什么样"，只编"对我的行动有用的量"</text>
  </g>

  <!-- fly example -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="270" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#0B6E99"/>
    <text x="84" y="152" font-size="15.5" font-weight="bold" fill="#0B6E99">果蝇的取舍清单</text>
    <g font-size="13.5">
      <rect x="84" y="172" width="524" height="44" rx="8" fill="#FBECEA"/>
      <text x="100" y="200" fill="#C0392B" font-weight="bold">✗ 不编码：花的种类、颜色美感、场景语义</text>
      <rect x="84" y="226" width="524" height="44" rx="8" fill="#EAF5EE"/>
      <text x="100" y="254" fill="#1E8E3E" font-weight="bold">✓ 编码：是否有东西在动？朝哪动？（防撞）</text>
      <rect x="84" y="280" width="524" height="44" rx="8" fill="#EAF5EE"/>
      <text x="100" y="308" fill="#1E8E3E" font-weight="bold">✓ 编码：下落气流（着陆时机）</text>
      <rect x="84" y="334" width="524" height="44" rx="8" fill="#EAF5EE"/>
      <text x="100" y="362" fill="#1E8E3E" font-weight="bold">✓ 编码：小黑点是不是同类（追踪目标）</text>
    </g>
  </g>

  <!-- ant example -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="270" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="118" width="568" height="4" fill="#C77800"/>
    <text x="676" y="152" font-size="15.5" font-weight="bold" fill="#C77800">沙漠蚁的极简返巢包</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188">不带地图、不带 GPS，只带两个数：</text>
      <rect x="676" y="206" width="240" height="60" rx="8" fill="#FBF3E4"/>
      <text x="796" y="232" text-anchor="middle" font-weight="bold" fill="#C77800">离巢的距离</text>
      <text x="796" y="252" text-anchor="middle" font-size="12" fill="#51617A">（步数计步器）</text>
      <rect x="936" y="206" width="240" height="60" rx="8" fill="#FBF3E4"/>
      <text x="1056" y="232" text-anchor="middle" font-weight="bold" fill="#C77800">相对巢的方向</text>
      <text x="1056" y="252" text-anchor="middle" font-size="12" fill="#51617A">（天体罗盘）</text>
      <text x="676" y="302">→ 全程只维护一个二维矢量"回巢向量"</text>
      <text x="676" y="336">→ 走到哪算到哪（积分），到家即清零</text>
      <text x="676" y="370" fill="#C77800" font-weight="bold">整个"导航系统" = 一个不断更新的箭头</text>
    </g>
  </g>

  <!-- principle statement -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="414" width="1160" height="150" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="448" font-size="15" font-weight="bold" fill="#0B6E99">这就是"最小充分统计量"（Minimal Sufficient Statistic）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="482">统计学概念：丢弃一切与任务无关的信息，只保留做出正确决策所需的最少变量</text>
      <text x="84" y="514">生物是天然的最小充分统计量引擎——感知不是"忠实记录世界"，是"为行动提取刚好够用的参数"</text>
    </g>
  </g>

  <!-- AI contrast -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="586" width="1160" height="70" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.3"/>
    <text x="84" y="616" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#C0392B">对照 AI：</tspan>今天的多模态模型试图"什么都编"（3400 万特征），没有按下游行为剪裁——</text>
    <text x="84" y="642" font-size="14.5" fill="#1A2433">这正是编码密度差距 5-6 个数量级的根源：生物按需编码，AI 按可得编码</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：综合本报告果蝇视觉/沙漠蚁研究 · "最小充分统计量"为统计学术语（Fisher-Neyman 因子定理语境）</text>
</svg>
