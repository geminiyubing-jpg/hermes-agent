<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">三码合一：高效 · 稀疏 · 预测的统一</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">PNAS 统一理论（2018→2026 持续发展）· 三个"流派"其实是一门学问</text>
  </g>

  <!-- three codes -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="368" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="368" height="4" fill="#0B6E99"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#0B6E99">高效编码</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="188">最大化输入信息，给定成本约束</text>
      <text x="84" y="222">代表成果：视网膜感受野、</text>
      <text x="104" y="248">对比度敏感度曲线预测</text>
      <text x="84" y="310" fill="#51617A" font-size="13">关注点：信道与成本</text>
    </g>

    <rect x="456" y="118" width="368" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="456" y="118" width="368" height="4" fill="#C77800"/>
    <text x="480" y="152" font-size="16" font-weight="bold" fill="#C77800">稀疏编码</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="480" y="188">任一时刻只有少数神经元活跃</text>
      <text x="480" y="222">代表成果：V1 朝向/运动选择性</text>
      <text x="500" y="248">（特征检测器自发涌现）</text>
      <text x="480" y="310" fill="#51617A" font-size="13">关注点：表示的形式</text>
    </g>

    <rect x="852" y="118" width="368" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="852" y="118" width="368" height="4" fill="#6D4FC2"/>
    <text x="876" y="152" font-size="16" font-weight="bold" fill="#6D4FC2">预测编码</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="876" y="188">只传输预测误差（意外）</text>
      <text x="876" y="222">代表成果：皮层分层结构</text>
      <text x="896" y="248">自上而下反馈的机能解释</text>
      <text x="876" y="310" fill="#51617A" font-size="13">关注点：时间维度的压缩</text>
    </g>
  </g>

  <!-- unification -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="384" width="1160" height="160" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.35"/>
    <text x="84" y="418" font-size="15.5" font-weight="bold" fill="#6D4FC2">统一定理：稀疏与预测都是高效编码的推论</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="452">自然感官信号具有稀疏潜在结构：由许多特征组合生成，但任一时刻只有少数特征出现</text>
      <text x="84" y="486">→ 对这类信号做高效编码，<tspan font-weight="bold" fill="#6D4FC2">最优解自动是稀疏的</tspan>（少数活跃单元）<tspan font-weight="bold" fill="#6D4FC2">且自动是预测式的</tspan>（时序冗余被差分掉）</text>
      <text x="84" y="524" fill="#6D4FC2" font-weight="bold">三个假说不是三种机制，是同一最优压缩的三个侧面——就像波粒二象性不是两种光</text>
    </g>
  </g>

  <!-- AI connection -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="568" width="1160" height="88" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.35"/>
    <text x="84" y="600" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#1E8E3E">与系列第二篇的暗线呼应：</tspan>Anthropic 的 3400 万特征 = 稀疏编码的机器版（少数卡片点亮）；</text>
    <text x="84" y="628" font-size="14.5" fill="#1A2433">LeCun 的 JEPA"只预测抽象" = 预测编码的机器版——AI 正在无意识地重新发现 Barlow 定律</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：PNAS《Toward a unified theory of efficient, predictive, and sparse coding》（PMC5776796）· 预测编码综述 arXiv 2112.10048</text>
</svg>
