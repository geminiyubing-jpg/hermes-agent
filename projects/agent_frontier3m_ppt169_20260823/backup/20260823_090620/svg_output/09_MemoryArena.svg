<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">MemoryArena：把记忆评测"打回原形"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ICML 2026 · arXiv 2602.16313 · He et al. 14 作者 · 全场被引用最多的发现（mem0 评）</text>
  </g>

  <rect x="60" y="118" width="1160" height="130" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4"/>
  <text x="84" y="152" font-family="'PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#C0392B">"打脸"结论（原文最可引用的一点）</text>
  <text x="84" y="184" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#1A2433">在 LoCoMo 等对话记忆基准上"刷爆分"的 agent，换到真实多会话任务上<tspan fill="#C0392B" font-weight="bold">大面积失败</tspan>——</text>
  <text x="84" y="212" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#1A2433">甚至过不好"跨会话正确复用用户偏好而不被噪声带偏"这种基本任务。<tspan fill="#51617A" font-size="14">LoCoMo 分数不预测真实表现。</tspan></text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="272" width="572" height="230" rx="12" fill="#FFFFFF" stroke="#6D4FC2" stroke-opacity="0.35"/>
    <text x="84" y="304" font-size="15" font-weight="bold" fill="#6D4FC2">评测设计：Memory-Agent-Environment 循环</text>
    <text x="84" y="336" font-size="13.5" fill="#1A2433">不再孤立考"记没记住"或"单会话会不会做"：</text>
    <text x="84" y="366" font-size="13.5" fill="#1A2433">· 人工设计的相互依赖子任务（会话跨天/周）</text>
    <text x="84" y="394" font-size="13.5" fill="#1A2433">· 后续任务依赖早期决策与反馈</text>
    <text x="84" y="422" font-size="13.5" fill="#1A2433">· 隐藏依赖 + 部分信息 + "该忘就忘"场景</text>
    <text x="84" y="460" font-size="13" fill="#0B6E99">记忆必须在"被使用中"被评测——存的目的是用</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="272" width="568" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="676" y="304" font-size="15" font-weight="bold" fill="#C77800">暴露的三大隐疾</text>
    <text x="676" y="340" font-size="14" fill="#1A2433">① 过度保留 over-retention：什么都记，噪声淹没信号</text>
    <text x="676" y="372" font-size="14" fill="#1A2433">② 错位遗忘 misaligned forgetting：该记的丢了，该忘的留着</text>
    <text x="676" y="404" font-size="14" fill="#1A2433">③ 冲突调和失败：新旧信息矛盾时无法裁决更新</text>
    <text x="676" y="452" font-size="13" fill="#51617A">（单指标 recall 评测全部看不见这三件事）</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="524" width="1160" height="120" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="556" font-size="15" font-weight="bold" fill="#0B6E99">为什么它是"方向性"论文</text>
    <text x="84" y="588" font-size="14" fill="#1A2433">它重定义了赛道：记忆研究的 KPI 从"召回率"变成"跨会话任务完成度"——此后所有记忆系统（含 Hermes 的记忆设计）</text>
    <text x="84" y="616" font-size="14" fill="#1A2433">都应在这个 gym 里自证。这也是"评测驱动领域"的又一次重演：GAIA 之于通用 agent，MemoryArena 之于记忆。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2602.16313 · 项目页 memoryarena.github.io · ICML 2026 poster</text>
</svg>
