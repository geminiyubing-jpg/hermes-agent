<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">SimpleMem 与 EAM：结构化记忆 = 更准 + 更省</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ICML 2026 记忆五重奏（上）：生产可落地的两件武器 · mem0 8-12 盘点</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="320" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#0B6E99"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#0B6E99">SimpleMem：压缩 × 意图对齐</text>
    <rect x="84" y="170" width="524" height="120" rx="8" fill="#EEF2F8"/>
    <g font-size="12.5" fill="#1A2433">
      <text x="100" y="196">历史交互</text>
      <text x="100" y="216" fill="#8494AB">全量记录</text>
      <text x="185" y="206" fill="#0B6E99">→</text>
      <text x="212" y="196">分层聚类</text>
      <text x="212" y="216" fill="#8494AB">片段分组</text>
      <text x="300" y="206" fill="#0B6E99">→</text>
      <text x="328" y="196">小模型摘要</text>
      <text x="328" y="216" fill="#8494AB">每簇一条</text>
      <text x="420" y="206" fill="#0B6E99">→</text>
      <text x="448" y="196">意图质心</text>
      <text x="448" y="216" fill="#8494AB">intent centroids</text>
    </g>
    <text x="84" y="316" font-size="13.5" fill="#1A2433">检索时：预测当前查询意图 → 只取最近的压缩摘要</text>
    <text x="84" y="346" font-size="14" fill="#1E8E3E">结果：F1 超过全量向量检索，token 大幅下降，零定制硬件</text>
    <text x="84" y="380" font-size="13" fill="#C0392B">未解决：时间推理——记忆条目独立处理，跨会话时序仍弱</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="320" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="118" width="568" height="4" fill="#C77800"/>
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#C77800">EAM：GUI 记忆 = 知识图谱</text>
    <text x="676" y="188" font-size="13.5" fill="#1A2433">为 GUI agent 量身定制：</text>
    <g font-size="13.5">
      <text x="676" y="222" fill="#1A2433">· 节点：窗口 / 控件 / 用户输入 / 应用实体</text>
      <text x="676" y="250" fill="#1A2433">· 边：关系 + 时序转移（按钮→状态变化）</text>
      <text x="676" y="278" fill="#1A2433">· 长期记忆 = 持续演化的图，不是对话滚动条</text>
    </g>
    <text x="676" y="316" font-size="13.5" fill="#1A2433">检索：查相关子图（同类表单的历史配置、成功点击序列）</text>
    <text x="676" y="346" font-size="14" fill="#1E8E3E">结果：准确率提升 + prompt token 大降</text>
    <text x="676" y="380" font-size="13" fill="#51617A">边界：GUI 领域专用；开放对话需重新设计 schema</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="462" width="1160" height="180" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.3"/>
    <text x="84" y="494" font-size="16" font-weight="bold" fill="#6D4FC2">两篇合读的共同教训</text>
    <text x="84" y="528" font-size="14.5" fill="#1A2433">"把记忆当结构化过程（聚类、图、意图对齐），而不是当自由文本生成"——</text>
    <text x="84" y="558" font-size="14.5" fill="#1A2433">准确率与成本同时改善，破除"记忆 = 烧 token"的权衡幻觉。</text>
    <text x="84" y="600" font-size="14" fill="#0B6E99">对 Hermes 的直接启示：MEMORY.md 压缩、skill 库按意图检索、会话聚类去重——都是这个方向的工程化形态</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：mem0.ai ICML 2026 盘点（8-12）全文解析 + ICML 2026 poster 列表</text>
</svg>
