<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">五大部分 · 16 页 · 建议讲解 40 分钟</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="140" font-size="15" font-weight="bold" fill="#0B6E99">Ⅰ · 定调：Horizon Gap（为什么这三个月属于"长程任务"）</text>
    <rect x="80" y="154" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="15" fill="#1A2433">
      <text x="80" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03</tspan>  执行摘要：一个矛盾与五大主线</text>
      <text x="80" y="222"><tspan font-family="'SF Mono',monospace" fill="#8494AB">04</tspan>  The Horizon Gap：1547 篇综述定调全年</text>
      <text x="80" y="256"><tspan font-family="'SF Mono',monospace" fill="#8494AB">05</tspan>  三个被混淆的概念：horizon / context / memory</text>
    </g>

    <text x="80" y="320" font-size="15" font-weight="bold" fill="#C77800">Ⅱ · 训练革命：从 Outcome 到 Process</text>
    <rect x="80" y="334" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="15" fill="#1A2433">
      <text x="80" y="368"><tspan font-family="'SF Mono',monospace" fill="#8494AB">06</tspan>  HPO：事后诸葛亮式策略优化</text>
      <text x="80" y="402"><tspan font-family="'SF Mono',monospace" fill="#8494AB">07</tspan>  MileGPO：里程碑+陷阱的图信用分配</text>
      <text x="80" y="436"><tspan font-family="'SF Mono',monospace" fill="#8494AB">08</tspan>  Agent-Omit / STAR：RL 配方科学化</text>
    </g>

    <text x="680" y="140" font-size="15" font-weight="bold" fill="#6D4FC2">Ⅲ · 记忆重构：ICML 2026 五重奏</text>
    <rect x="680" y="154" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="15" fill="#1A2433">
      <text x="680" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">09</tspan>  MemoryArena：评测体系的"打脸"论文</text>
      <text x="680" y="222"><tspan font-family="'SF Mono',monospace" fill="#8494AB">10</tspan>  SimpleMem / EAM：结构化记忆降本增效</text>
      <text x="680" y="256"><tspan font-family="'SF Mono',monospace" fill="#8494AB">11</tspan>  MRAgent / MemEvolve：记忆是重构非检索</text>
    </g>

    <text x="680" y="320" font-size="15" font-weight="bold" fill="#C0392B">Ⅳ · 基准重置与模型军备</text>
    <rect x="680" y="334" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="15" fill="#1A2433">
      <text x="680" y="368"><tspan font-family="'SF Mono',monospace" fill="#8494AB">12</tspan>  OSWorld 2.0 / Gaia2 / DeepSWE：难度重置</text>
      <text x="680" y="402"><tspan font-family="'SF Mono',monospace" fill="#8494AB">13</tspan>  模型侧：Kimi K3 / GPT-5.6 / OX Alpha</text>
    </g>

    <text x="680" y="466" font-size="15" font-weight="bold" fill="#1E8E3E">Ⅴ · 自我进化：Agent 的终点站？</text>
    <rect x="680" y="480" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="15" fill="#1A2433">
      <text x="680" y="514"><tspan font-family="'SF Mono',monospace" fill="#8494AB">14</tspan>  Ouroboros：161 天自我进化的 coding agent</text>
      <text x="680" y="548"><tspan font-family="'SF Mono',monospace" fill="#8494AB">15</tspan>  工业里程碑与趋势判断</text>
      <text x="680" y="582"><tspan font-family="'SF Mono',monospace" fill="#8494AB">16</tspan>  尾页：论文清单与观察哨</text>
    </g>
  </g>

  <rect x="80" y="470" width="540" height="170" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
  <text x="104" y="504" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#C77800">一句话主线</text>
  <text x="104" y="536" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">单步推理已经"超标"，多小时的持续任务成为主战场——</text>
  <text x="104" y="562" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">训练（过程信用）、记忆（跨会话）、基准（长程重置）、</text>
  <text x="104" y="588" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">自我进化（经验闭环）四条线都在围剿同一个敌人：Horizon Gap。</text>
  <text x="104" y="618" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8494AB">全部论文为 arXiv 官方摘要 + 多源交叉验证，时窗 2026-06-01 → 08-23。</text>
</svg>
