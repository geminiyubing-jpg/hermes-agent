<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">The Horizon Gap：1547 篇综述给全年定调</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">arXiv 2608.06663 · 2026-08-07 · Chen, Wang &amp; Qu（DeepGrounding）· 39 页 6 图</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="134" font-size="16" font-weight="bold" fill="#1A2433">差距长什么样</text>
    <rect x="80" y="152" width="600" height="120" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="104" y="186" font-size="15" font-weight="bold" fill="#1E8E3E">单步/单次前向 ✅ 已"超标"</text>
    <text x="104" y="214" font-size="13.5" fill="#1A2433">GPQA / HLE / 数学竞赛：达到甚至超过人类研究者水平</text>
    <text x="104" y="240" font-size="13.5" fill="#1A2433">（"几年前还是研究贡献的问题，现在一次 forward 就解了"）</text>

    <path d="M 370 276 L 370 306" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrDown)"/>
    <defs>
      <marker id="arrDown" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#C0392B"/>
      </marker>
    </defs>
    <text x="395" y="298" font-size="13" fill="#C0392B">放进 agent 循环</text>

    <rect x="80" y="312" width="600" height="140" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4"/>
    <text x="104" y="346" font-size="15" font-weight="bold" fill="#C0392B">多小时任务 ❌ 三大失败模式</text>
    <text x="104" y="376" font-size="13.5" fill="#1A2433">1. 丢失早期决策（"我为什么改这个文件来着？"）</text>
    <text x="104" y="402" font-size="13.5" fill="#1A2433">2. 半成品宣称完工（"declaring victory on a half-finished patch"）</text>
    <text x="104" y="428" font-size="13.5" fill="#1A2433">3. 目标漂移（drift from the goal it was given）</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="720" y="120" width="500" height="180" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="744" y="152" font-size="15" font-weight="bold" fill="#0B6E99">综述方法论（罕见的严谨）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="744" y="182">· 系统化种子收割：1547 篇（2024–2026）</text>
      <text x="744" y="208">· 披露 26.8% 的"渗漏率"过滤（学科边界噪音）</text>
      <text x="744" y="234">· 定向补充 + 六类 × 三轴分类矩阵</text>
      <text x="744" y="266" font-size="13" fill="#51617A">（分类学本身就是这季度最好的 agent 知识地图）</text>
    </g>
  </g>

  <rect x="80" y="476" width="1140" height="164" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.5"/>
  <text x="104" y="510" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#C77800">核心发现（一句话记住这篇论文）</text>
  <text x="104" y="542" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#1A2433">"随着 horizon 拉长，仅依赖最终结果的信号越来越无信息量——而领域的全部回应，无论叫过程奖励模型（PRM）、</text>
  <text x="104" y="570" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#1A2433">信用分配（credit assignment）还是轨迹级诊断，本质上都是在'制造过程信号'。"</text>
  <text x="104" y="604" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#0B6E99">→ 这解释了为什么本季度的 HPO、MileGPO、MemoryArena 是同一场战争的三条战线</text>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">GitHub: deepgrounding/long-horizon-task · 摘要直抓自 arxiv.org/abs/2608.06663</text>
</svg>
