<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">模型侧军备：Agent-native 基座之战</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Kimi K3 · GPT-5.6 · OX Alpha · 2026-07/08 · "为 agent 而生"成为旗舰标配</text>
  </g>

  <!-- Kimi K3 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#6D4FC2"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#6D4FC2">Kimi K3（7-14 发布 · 权重 7-27 开放）</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13.5">
      <text x="84" y="188" fill="#1A2433">参数 <tspan font-weight="bold" fill="#6D4FC2">2.8T</tspan>（首个 3T 级开源）</text>
      <text x="84" y="216" fill="#1A2433">上下文 <tspan font-weight="bold" fill="#6D4FC2">1M</tspan> · 原生视觉</text>
      <text x="84" y="244" fill="#1A2433">thinking 常开 · effort low/high/max</text>
      <text x="84" y="272" fill="#1A2433">价格 $2.60/M in · $13/M out</text>
    </g>
    <text x="84" y="310" font-size="13.5" fill="#1A2433">Agent 战绩：agentic tool use 类别第 5（134 模型，73.9/100）</text>
    <text x="84" y="338" font-size="13.5" fill="#1A2433">OfficeQA Pro：PDF 全图像化（无机器可读文本）评测</text>
    <text x="84" y="372" font-size="13.5" fill="#1E8E3E">意义：开源阵营首次在"长程 agentic"档位布防旗舰</text>
  </g>

  <!-- GPT-5.6 + OX -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="118" width="568" height="4" fill="#C0392B"/>
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#C0392B">GPT-5.6（Sol / Terra / Luna）</text>
    <text x="676" y="188" font-size="13.5" fill="#1A2433">· 三型号分工：Sol（旗舰）/ Terra / Luna（轻量）</text>
    <text x="676" y="216" font-size="13.5" fill="#1A2433">· Sol 声称 Terminal-Bench 2.1 SOTA（第三方报 <tspan font-family="'SF Mono',monospace" font-weight="bold" fill="#C0392B">88.8%</tspan>）</text>
    <text x="676" y="244" font-size="13.5" fill="#1A2433">· Cerebras 4 代推理加持，速度大幅提升</text>
    <text x="676" y="286" font-size="15" font-weight="bold" fill="#C77800">OX Alpha（8-22 神秘模型）</text>
    <text x="676" y="316" font-size="13.5" fill="#1A2433">· 仅 <tspan font-family="'SF Mono',monospace" font-weight="bold" fill="#C77800">27.8B</tspan> dense 参数</text>
    <text x="676" y="344" font-size="13.5" fill="#1A2433">· Terminal-Bench <tspan font-family="'SF Mono',monospace" font-weight="bold">73.0</tspan>——一年前这分数需数百 B</text>
    <text x="676" y="376" font-size="13" fill="#51617A">→ 效率曲线陡峭下移：小模型军团正在逼近大模型防线</text>
  </g>

  <!-- Terminal-Bench leaderboard -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="424" width="1160" height="220" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="458" font-size="15" font-weight="bold" fill="#0B6E99">Terminal-Bench 2.1 排行（shell 环境 agentic coding）</text>
    <!-- bars -->
    <g font-size="13.5">
      <text x="84" y="496" fill="#1A2433">GPT-5.6 Sol（OpenAI）</text>
      <rect x="330" y="480" width="435" height="22" rx="4" fill="#C0392B" opacity="0.85"/>
      <text x="773" y="497" font-family="'SF Mono',monospace" font-weight="bold" fill="#C0392B">88.8%</text>

      <text x="84" y="530" fill="#1A2433">Ouroboros（Opus 5 run，自进化 harness）</text>
      <rect x="330" y="514" width="425" height="22" rx="4" fill="#C77800" opacity="0.85"/>
      <text x="763" y="531" font-family="'SF Mono',monospace" font-weight="bold" fill="#C77800">86.74%</text>

      <text x="84" y="564" fill="#1A2433">Kimi K3（max effort，开源 2.8T）</text>
      <rect x="330" y="548" width="330" height="22" rx="4" fill="#6D4FC2" opacity="0.8"/>
      <text x="668" y="565" font-family="'SF Mono',monospace" font-weight="bold" fill="#6D4FC2">~69%</text>

      <text x="84" y="598" fill="#1A2433">OX Alpha（27.8B dense）</text>
      <rect x="330" y="582" width="358" height="22" rx="4" fill="#1E8E3E" opacity="0.8"/>
      <text x="696" y="599" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">73.0</text>
    </g>
    <text x="860" y="620" font-size="12" fill="#8494AB">（分数为各官方/第三方披露口径，跨 harness 比较需谨慎）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：kimi.com/blog/kimi-k3 · HF moonshotai/Kimi-K3 · OpenRouter · BenchLM · buildfastwithai 8-22 快讯 · 注：Kimi K3 TB2.1 为社区测得分数量级</text>
</svg>
