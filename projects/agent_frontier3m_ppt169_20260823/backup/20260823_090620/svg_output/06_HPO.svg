<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">HPO：给 Agent RL 装上"事后诸葛亮"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Hindsight Policy Optimization · arXiv 2607.16257 · 2026-07 · From Outcomes to Actions</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="560" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#C0392B">问题：长程 RL 的方差灾难</text>
    <text x="84" y="180" font-size="13.5" fill="#1A2433">长轨迹里哪一步立功、哪一步埋雷？</text>
    <text x="84" y="206" font-size="13.5" fill="#1A2433">· DeepSeek-R1 式 outcome RL 只看最终对错</text>
    <text x="84" y="232" font-size="13.5" fill="#1A2433">· 单轮可行，多轮长程 = 信用分配失败</text>
    <text x="84" y="258" font-size="13.5" fill="#1A2433">· PPO 需要 critic（值函数），训练不稳定</text>
    <text x="84" y="290" font-size="13.5" fill="#51617A">结果：优化方差爆炸，小改进淹没在噪声里</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="640" y="118" width="580" height="230" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4"/>
    <text x="664" y="150" font-size="15" font-weight="bold" fill="#C77800">思想：用"事后信息"重标每步动作</text>
    <text x="664" y="182" font-size="13.5" fill="#1A2433">Hindsight（事后）翻译：轨迹走完后，</text>
    <text x="664" y="208" font-size="13.5" fill="#1A2433">用 hindsight 分布在 <tspan fill="#0B6E99" font-weight="bold">intent space（意图空间）</tspan>里</text>
    <text x="664" y="234" font-size="13.5" fill="#1A2433">对比当前策略 → 每个动作获得"它通向哪个意图"的信号</text>
    <text x="664" y="266" font-size="13.5" fill="#1E8E3E">效果：低方差、平滑的学习信号（无需 critic）</text>
    <text x="664" y="292" font-size="13.5" fill="#51617A">类比：复盘时不再问"对没对"，问"这步把局面导向了哪"</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="372" width="1160" height="180" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="404" font-size="15" font-weight="bold" fill="#0B6E99">三个关键结果</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="438">① multi-hop（多跳）任务提升最显著——正是 horizon 最长的场景</text>
      <text x="84" y="470">② Offline HPO 优于 Online HPO：先收集轨迹离线重标，再更新——工程上更好落地</text>
      <text x="84" y="502">③ 通向 critic-free 的稳定 RL：不需要价值网络也能在长程任务稳定训练</text>
    </g>
    <text x="84" y="534" font-size="13" fill="#51617A">与 Horizon Gap 呼应：这正是综述所说"制造过程信号"的代表性训练侧方案</text>
  </g>

  <g font-family="'SF Mono','Menlo',monospace">
    <rect x="60" y="572" width="1160" height="88" rx="12" fill="#EEF2F8" stroke="#D8E0EC"/>
    <text x="84" y="600" font-size="13" fill="#0B6E99"># HPO 核心直觉（伪代码）</text>
    <text x="84" y="624" font-size="13.5" fill="#1A2433">for traj in rollouts:  intent = infer_intent(traj)        # 事后推断"这条轨迹实际想干什么"</text>
    <text x="84" y="646" font-size="13.5" fill="#1A2433">  adv = score(current_policy, intent) - baseline          # 意图空间内对比 → 步级信号替代终局信号</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2607.16257（HTML v1）· "low-variance and smooth learning signals"（原文）</text>
</svg>
