<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">Agent-Omit 与 STAR：RL 配方的科学化</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ICML 2026 · HKUST usail-lab / arXiv 2602.04284 + 2603.21972</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#0B6E99"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#0B6E99">Agent-Omit：学会"不说废话"</text>
    <text x="84" y="184" font-size="13.5" fill="#1A2433">观察：agent 轨迹里大量冗余 thought/observation</text>
    <text x="84" y="210" font-size="13.5" fill="#1A2433">占用上下文 → 稀释注意力 → 效率下降</text>
    <text x="84" y="246" font-size="14" font-weight="bold" fill="#C77800">做法：Agentic RL 训练"自适应上下文省略"</text>
    <text x="84" y="276" font-size="13.5" fill="#1A2433">1. 合成冷启动数据（单轮+多轮省略场景）微调</text>
    <text x="84" y="302" font-size="13.5" fill="#1A2433">2. RL 阶段奖励"该省就省"的轨迹</text>
    <text x="84" y="340" font-size="13.5" fill="#1E8E3E">本质：把"上下文管理"从工程技巧变成模型能力</text>
    <text x="84" y="370" font-size="13" fill="#51617A">（对应 Horizon Gap 第二轴 beyond-context 战场）</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="118" width="568" height="4" fill="#6D4FC2"/>
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#6D4FC2">STAR：5 轴拆解 agent RL 设计空间</text>
    <text x="676" y="184" font-size="13.5" fill="#1A2433">测试床：TravelPlanner（多约束工具编排，老板熟悉的场景）</text>
    <g font-size="13.5">
      <text x="676" y="220" fill="#1A2433">① 奖励塑造</text><text x="856" y="220" fill="#51617A">课程奖励 vs 稀疏奖励</text>
      <text x="676" y="248" fill="#1A2433">② 模型规模</text><text x="856" y="248" fill="#51617A">小/大模型最优解不同</text>
      <text x="676" y="276" fill="#1A2433">③ 数据构成</text><text x="856" y="276" fill="#51617A">任务混合比例</text>
      <text x="676" y="304" fill="#1A2433">④ 算法选择</text><text x="856" y="304" fill="#51617A">PPO/GRPO/REINFORCE++</text>
      <text x="676" y="332" fill="#1A2433">⑤ 环境稳定性</text><text x="856" y="332" fill="#51617A">环境抖动的影响</text>
    </g>
    <text x="676" y="368" font-size="13.5" fill="#1E8E3E">核心结论：小模型需要分阶段课程奖励，大模型可承受稀疏奖励</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="424" width="1160" height="220" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.35"/>
    <text x="84" y="458" font-size="16" font-weight="bold" fill="#0B6E99">两篇合读的意义：从"能训"到"会训"</text>
    <text x="84" y="494" font-size="14.5" fill="#1A2433">2025 年的问题是"agent 能不能用 RL 训"（可行性）；2026 中期的问题变成"怎么训才对"（配方）——</text>
    <text x="84" y="524" font-size="14.5" fill="#1A2433">STAR 给出设计空间地图，Agent-Omit 给出"上下文效率也是可训练能力"的新维度，</text>
    <text x="84" y="554" font-size="14.5" fill="#1A2433">HPO/MileGPO 解决"信号从哪来"——四篇合起来 = 训练侧的完整拼图。</text>
    <text x="84" y="598" font-size="14" fill="#C77800">对 PR&amp;T 研究者的启发：过程信号的"来源、粒度、可靠性"是当前最有论文空间的三件事</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">Agent-Omit: github.com/usail-hkust/Agent-Omit（ICML 2026 official）· STAR: arXiv 2603.21972</text>
</svg>
