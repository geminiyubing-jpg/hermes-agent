<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">MileGPO：从轨迹里"挖"里程碑与陷阱</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Milestone Inference with Local Evidence for Graph-Based PO · arXiv 2608.19803 · 2026-08（三天前挂出）</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="134" font-size="16" font-weight="bold" fill="#1A2433">三段式流水线</text>

    <rect x="80" y="152" width="360" height="200" rx="12" fill="#FFFFFF" stroke="#0B6E99" stroke-opacity="0.35"/>
    <text x="104" y="184" font-size="15" font-weight="bold" fill="#0B6E99">① Milestone Discovery</text>
    <text x="104" y="214" font-size="13.5" fill="#1A2433">在成组 on-policy rollout 中：</text>
    <text x="104" y="242" font-size="13.5" fill="#1E8E3E">· 成功轨迹 → 识别候选里程碑</text>
    <text x="104" y="270" font-size="13.5" fill="#C0392B">· 失败轨迹 → 识别反复踩的"陷阱"</text>
    <text x="104" y="304" font-size="13" fill="#51617A">（正反两面证据都用上）</text>

    <path d="M 440 252 L 470 252" stroke="#8494AB" stroke-width="2.5" marker-end="url(#a2)"/>
    <defs>
      <marker id="a2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB"/>
      </marker>
    </defs>

    <rect x="472" y="152" width="360" height="200" rx="12" fill="#FFFFFF" stroke="#C77800" stroke-opacity="0.35"/>
    <text x="496" y="184" font-size="15" font-weight="bold" fill="#C77800">② Reliability-Calibrated Shaping</text>
    <text x="496" y="214" font-size="13.5" fill="#1A2433">按"结果置信度"给候选加权：</text>
    <text x="496" y="242" font-size="13.5" fill="#1A2433">· 可靠的里程碑/陷阱 → 加强</text>
    <text x="496" y="270" font-size="13.5" fill="#1A2433">· 不确定的 → 降权</text>
    <text x="496" y="304" font-size="13" fill="#51617A">（防止噪声里程碑污染训练）</text>

    <path d="M 832 252 L 862 252" stroke="#8494AB" stroke-width="2.5" marker-end="url(#a2)"/>

    <rect x="864" y="152" width="356" height="200" rx="12" fill="#FFFFFF" stroke="#6D4FC2" stroke-opacity="0.35"/>
    <text x="888" y="184" font-size="15" font-weight="bold" fill="#6D4FC2">③ Graph-Based PO</text>
    <text x="888" y="214" font-size="13.5" fill="#1A2433">信用分配从"轨迹级"细化为</text>
    <text x="888" y="242" font-size="13.5" fill="#1A2433">"图结构上的过程级"：</text>
    <text x="888" y="270" font-size="13.5" fill="#1A2433">里程碑=图节点，路径=优势估计</text>
    <text x="888" y="304" font-size="13" fill="#51617A">（承接 2605.26684 图信用分配谱系）</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="80" y="384" width="700" height="170" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="104" y="416" font-size="15" font-weight="bold" fill="#0B6E99">为什么值得盯</text>
    <text x="104" y="448" font-size="14" fill="#1A2433">· 信用分配是长程 agentic RL 的"卡脖子"问题——HPO 从意图空间攻，MileGPO 从图结构攻</text>
    <text x="104" y="478" font-size="14" fill="#1A2433">· "陷阱"（trap）显式建模是亮点：失败信息第一次成为一等公民</text>
    <text x="104" y="508" font-size="14" fill="#1A2433">· 三天前挂出，属最前沿——跟踪它的复现实验是观察点</text>

    <rect x="812" y="384" width="408" height="170" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="836" y="416" font-size="15" font-weight="bold" fill="#1E8E3E">同期伙伴（8 月）</text>
    <text x="836" y="448" font-size="13.5" fill="#1A2433">· MileGPO（图 + 里程碑）</text>
    <text x="836" y="476" font-size="13.5" fill="#1A2433">· Memory-R2（记忆动作公平信用）</text>
    <text x="836" y="504" font-size="13.5" fill="#1A2433">· Physics of Multi-Turn Planning（OPD）</text>
    <text x="836" y="532" font-size="13" fill="#51617A">→ 训练侧密度突然上升 = 领域共识正在形成</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5">
    <rect x="80" y="576" width="1140" height="84" rx="12" fill="#EEF2F8" stroke="#D8E0EC"/>
    <text x="104" y="608" fill="#51617A">方法论对比一句话：</text>
    <text x="296" y="608" fill="#1A2433">Outcome RL 问"赢没赢" · PRM 问"这步对不对" · <tspan fill="#C77800" font-weight="bold">MileGPO 问"离里程碑近了还是掉陷阱了"</tspan></text>
    <text x="104" y="640" fill="#51617A">适用：</text>
    <text x="160" y="640" fill="#1A2433">既有明确阶段成果又有典型错误模式的长程任务（编码 agent、多跳研究、旅行规划）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2608.19803 · 2026-08-20 挂出</text>
</svg>
