<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">Ouroboros：161 天自我进化的 coding agent</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">arXiv 2608.08311 · 2026-08 · 衔尾蛇：改进自身 harness 的能力本身成为任务</text>
  </g>

  <!-- how it works -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="700" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">机制：reviewed commits 成为明天的运行时</text>
    <text x="84" y="182" font-size="13.5" fill="#1A2433">自我开发的 agent harness——工具、提示词、上下文组装、核心实现，</text>
    <text x="84" y="208" font-size="13.5" fill="#1A2433">全部通过"被评审的提交"进化，并成为后续任务的运行时。</text>
    <rect x="84" y="228" width="330" height="100" rx="8" fill="#EAF5EE"/>
    <text x="100" y="256" font-size="14" font-weight="bold" fill="#1E8E3E">模式一：递归自由进化</text>
    <text x="100" y="282" font-size="12.5" fill="#1A2433">"改进"本身是一个任务；</text>
    <text x="100" y="302" font-size="12.5" fill="#1A2433">完成一轮进化可调度下一轮</text>
    <rect x="430" y="228" width="306" height="100" rx="8" fill="#FBF3E4"/>
    <text x="446" y="256" font-size="14" font-weight="bold" fill="#C77800">模式二：经验驱动核心进化</text>
    <text x="446" y="282" font-size="12.5" fill="#1A2433">日常工作与社交暴露 bug、</text>
    <text x="446" y="302" font-size="12.5" fill="#1A2433">毛边、低效上下文 → 结构性修改</text>
  </g>

  <!-- scores -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="780" y="118" width="440" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="804" y="150" font-size="15" font-weight="bold" fill="#C77800">战绩（Opus 5 run，model-matched）</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="14">
      <text x="804" y="188" fill="#1A2433">Terminal-Bench 2.1</text>
      <text x="1080" y="188" font-weight="bold" fill="#1E8E3E">86.74%</text>
      <text x="804" y="220" fill="#8494AB" font-size="12">（该基准最佳报告成绩）</text>
      <text x="804" y="252" fill="#1A2433">OSWorld-Verified</text>
      <text x="1080" y="252" font-weight="bold" fill="#1E8E3E">90.69%</text>
      <text x="804" y="284" fill="#8494AB" font-size="12">（超此前所有报告）</text>
      <text x="804" y="316" fill="#1A2433">CL-Bench（5-rollout）</text>
      <text x="1080" y="316" font-weight="bold" fill="#1E8E3E">0.2301</text>
      <text x="804" y="340" fill="#8494AB" font-size="12">（新 SOTA）</text>
    </g>
  </g>

  <!-- significance + safety -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="372" width="572" height="170" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="404" font-size="15" font-weight="bold" fill="#0B6E99">为什么是"终点站"级叙事</text>
    <text x="84" y="436" font-size="14" fill="#1A2433">· harness 与模型的边界开始流动：同一个模型，更好的脚手架 = 更强的 agent</text>
    <text x="84" y="466" font-size="14" fill="#1A2433">· "经验→结构→运行时"闭环跑通 161 天不崩，证明可持续</text>
    <text x="84" y="496" font-size="14" fill="#1A2433">· 与 EvolveR（经验自蒸馏）、Skill-Pro（非参数技能）构成进化三件套</text>

    <rect x="652" y="372" width="568" height="170" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.35"/>
    <text x="676" y="404" font-size="15" font-weight="bold" fill="#C0392B">安全警钟（论文自己承认的）</text>
    <text x="676" y="436" font-size="14" fill="#1A2433">· 自我修改的 agent：谁能评审"评审者"？reviewed commits 的评审标准本身可被进化改写</text>
    <text x="676" y="466" font-size="14" fill="#1A2433">· 与 Constitutional Black-Box Monitoring（ICML 2026）等监督论文同读才是完整图景</text>
    <text x="676" y="496" font-size="14" fill="#1A2433">· "Hope" 部署是公开记录中最长的 Ouroboros 运行——观察样本本身就有研究价值</text>
  </g>

  <!-- bottom -->
  <rect x="60" y="562" width="1160" height="84" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
  <text x="84" y="594" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#1A2433">一句话：模型能力（Kimi K3/GPT-5.6）× 训练方法（HPO/MileGPO）× 自进化 harness（Ouroboros）——</text>
  <text x="84" y="624" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#1A2433">三者叠加才是 2026 年 agent 的真实战斗力公式，单看任何一个维度都会误判局势。</text>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2608.08311 · github.com/razzant/ouroboros · SWE-bench Pro 与 Codex CLI 统计持平（诚实披露）</text>
</svg>
