<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">MRAgent 与 MemEvolve：记忆是重构，不是检索</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ICML 2026 记忆五重奏（下）：范式转变的两篇 · 人类记忆的"建构性"被搬进 agent</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="300" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#1E8E3E"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">MRAgent：查询时"重构"记忆视图</text>
    <text x="84" y="186" font-size="13.5" fill="#1A2433">记忆底座 = 动态知识图：</text>
    <text x="104" y="214" font-size="13.5" fill="#1A2433">· 节点：实体/事实/事件 · 边带时间与因果标签</text>
    <text x="104" y="242" font-size="13.5" fill="#1A2433">· 可回溯时间线与推理链</text>
    <text x="84" y="278" font-size="13.5" fill="#1A2433">查询时不是"取回固定片段"，而是：</text>
    <text x="104" y="306" font-size="13.5" fill="#0B6E99">遍历图 → 选子图 → 组装成情境专属的叙事/摘要</text>
    <text x="84" y="348" font-size="14" fill="#1E8E3E">增益最大处：冲突信息 + 长依赖链场景（LoCoMo/LongMemEval）</text>
    <text x="84" y="378" font-size="13.5" fill="#1A2433">时间信号可压制过时事实、突出当前事实</text>
    <text x="84" y="406" font-size="13" fill="#C0392B">代价：图维护与遍历的计算开销</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="300" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="118" width="568" height="4" fill="#C0392B"/>
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#C0392B">MemEvolve：元学习进化记忆系统本身</text>
    <text x="676" y="186" font-size="13.5" fill="#1A2433">当前所有记忆方案共同盲点：系统设计是一次性的</text>
    <text x="676" y="222" font-size="14" fill="#C77800" font-weight="bold">MemEvolve 同时进化两样东西：</text>
    <text x="700" y="252" font-size="13.5" fill="#1A2433">① 存什么（知识内容）</text>
    <text x="700" y="280" font-size="13.5" fill="#1A2433">② 怎么记怎么取（使用记忆的架构）</text>
    <text x="676" y="318" font-size="13.5" fill="#1A2433">机制：元学习（meta-learning）在任务流上持续优化记忆策略</text>
    <text x="676" y="360" font-size="14" fill="#1E8E3E">意义："怎么记住"本身成为可学习对象——记忆系统从手工艺品变成学习体</text>
    <text x="676" y="398" font-size="13" fill="#51617A">（对应 Horizon Gap 第三轴 cross-task persistent 的核心拼图）</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="442" width="1160" height="200" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.35"/>
    <text x="84" y="476" font-size="16" font-weight="bold" fill="#6D4FC2">范式转变：Store → Reconstruct</text>
    <g font-size="14.5">
      <text x="84" y="514" fill="#51617A">旧范式（2023-2025）：</text>
      <text x="300" y="514" fill="#1A2433">记忆 = 向量库 + 相似度检索（"图书管理员模式"：原样存、原样取）</text>
      <text x="84" y="552" fill="#0B6E99" font-weight="bold">新范式（2026 中期成型）：</text>
      <text x="340" y="552" fill="#1A2433">记忆 = 动态结构 + 查询时重构 + 系统自进化（"历史学家模式"：为当下问题重写过去）</text>
      <text x="84" y="596" fill="#C77800">哲学注脚：这正回到 Bartlett 1932 的人类记忆理论——回忆是建构性重构，不是录像回放</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：mem0.ai ICML 2026 盘点 · MRAgent/MemEvolve 均为 ICML 2026 poster · Shichun-Liu Agent-Memory-Paper-List</text>
</svg>
