<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">基准重置：OSWorld 2.0 / Gaia2 / DeepSWE</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">当 agent 分数逼近天花板，领域把门槛整体抬高一档 · 2026-06→08</text>
  </g>

  <g id="osw">
    <text x="80" y="134" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#1A2433">Computer-use 得分两年爬到 85%…</text>
    <line x1="100" y1="290" x2="420" y2="290" stroke="#D8E0EC" stroke-width="1.5"/>
    <line x1="100" y1="160" x2="100" y2="290" stroke="#D8E0EC" stroke-width="1.5"/>
    <g stroke="#E4EAF3" stroke-dasharray="3,5">
      <line x1="100" y1="225" x2="420" y2="225"/>
      <line x1="100" y1="160" x2="420" y2="160"/>
    </g>
    <g font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#8494AB">
      <text x="92" y="294" text-anchor="end">0</text>
      <text x="92" y="229" text-anchor="end">50</text>
      <text x="92" y="164" text-anchor="end">100</text>
    </g>
    <path d="M 120 285 L 200 250 L 280 200 L 360 165" fill="none" stroke="#1E8E3E" stroke-width="3"/>
    <g fill="#1E8E3E">
      <circle cx="120" cy="285" r="4"/><circle cx="200" cy="250" r="4"/>
      <circle cx="280" cy="200" r="4"/><circle cx="360" cy="165" r="5" fill="#C77800" stroke="#F7F9FC" stroke-width="2"/>
    </g>
    <g font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#51617A" text-anchor="middle">
      <text x="120" y="308">2024-04</text><text x="200" y="308">2024-12</text>
      <text x="280" y="308">2025-12</text><text x="360" y="308">2026-06</text>
    </g>
    <text x="360" y="150" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="bold" fill="#C77800">85%</text>
    <text x="120" y="273" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11.5" fill="#51617A">12%</text>
  </g>

  <path d="M 440 225 L 480 225" stroke="#C0392B" stroke-width="3" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#C0392B"/>
    </marker>
  </defs>
  <text x="460" y="205" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#C0392B">2.0 重置</text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="500" y="120" width="720" height="200" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="524" y="150" font-size="15" font-weight="bold" fill="#C0392B">OSWorld 2.0（arXiv 2606.29537）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="524" y="180">· 108 个长程 computer-use 工作流（原 369 短任务）</text>
      <text x="524" y="206">· 人类中位 <tspan fill="#C77800" font-weight="bold" font-family="'SF Mono',monospace">1.6 小时</tspan>/任务 · Opus 4.7 平均 <tspan fill="#C77800" font-weight="bold" font-family="'SF Mono',monospace">318 次</tspan>工具调用（1.0 时代约 30）</text>
      <text x="524" y="232">· 新挑战现象：流式交互、动态环境、跨源工作流、agent 模式协作</text>
      <text x="524" y="262" font-size="13" fill="#51617A">→ "30 步任务"的排行榜被作废，一切重新开始</text>
      <text x="524" y="292" font-size="13" fill="#51617A">→ 这就是 Horizon Gap 在评测侧的显形</text>
    </g>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="340" width="572" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="340" width="572" height="4" fill="#6D4FC2"/>
    <text x="84" y="374" font-size="15" font-weight="bold" fill="#6D4FC2">Gaia2（Meta · arXiv 2602.11964 · ICML 2026）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="406">· 异步动态环境：世界独立于 agent 演化</text>
      <text x="84" y="432">· 时间约束 + 噪声 + 歧义 + 多 agent 协作</text>
      <text x="84" y="458">· 连续时间事件驱动 MDP 建模</text>
      <text x="84" y="494" fill="#0B6E99">杀手锏：write-action verifier → 动作级评测</text>
      <text x="84" y="520" font-size="13.5" fill="#0B6E99">且可直接作为 RLVR（可验证奖励）训练环境</text>
      <text x="84" y="556" font-size="13" fill="#51617A">→ 评测与训练合一：基准本身成为训练场</text>
    </g>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="340" width="568" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="340" width="568" height="4" fill="#1E8E3E"/>
    <text x="676" y="374" font-size="15" font-weight="bold" fill="#1E8E3E">DeepSWE（DataCurve · 8 月）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="406">· 原创真实仓库的长程 SWE 任务</text>
      <text x="676" y="432">· prompt 仅 SWE-bench Pro 一半长</text>
      <text x="676" y="458">· 但要求 <tspan fill="#C77800" font-weight="bold" font-family="'SF Mono',monospace">5.5×</tspan> 代码量 + <tspan fill="#C77800" font-weight="bold" font-family="'SF Mono',monospace">2×</tspan> 输出 token</text>
      <text x="676" y="494" font-size="13.5" fill="#1A2433">+ PerspectiveGap：多智能体编排 prompting 基准</text>
      <text x="676" y="556" font-size="13" fill="#51617A">→ "读题容易动手难"：把 agent 从理解考试逼到交付考试</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2606.29537 与 2602.11964 · OSWorld 12%→85% 数据：Medium/Masood 2026-07 · DeepSWE: deepswe.datacurve.ai</text>
</svg>
