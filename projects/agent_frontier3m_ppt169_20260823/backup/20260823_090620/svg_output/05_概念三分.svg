<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">三个总被混淆的概念：Horizon ≠ Context ≠ Memory</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Horizon Gap 综述的概念澄清贡献 · 讨论 agent 前先分清这三个词</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="120" width="368" height="260" rx="12" fill="#FFFFFF" stroke="#0B6E99" stroke-opacity="0.35"/>
    <rect x="60" y="120" width="368" height="4" fill="#0B6E99"/>
    <text x="84" y="156" font-size="17" font-weight="bold" fill="#0B6E99">Long-Horizon 长程</text>
    <rect x="84" y="172" width="120" height="24" rx="4" fill="#E8F1F8"/>
    <text x="94" y="189" font-size="12.5" fill="#0B6E99">任务属性 task</text>
    <text x="84" y="226" font-size="14" fill="#1A2433">"完成这个任务必需多少步"</text>
    <text x="84" y="258" font-size="13.5" fill="#51617A">· 属于问题本身，与模型无关</text>
    <text x="84" y="282" font-size="13.5" fill="#51617A">· 写一个跨系统报表 = 长程</text>
    <text x="84" y="306" font-size="13.5" fill="#51617A">· 回答一个知识问题 = 短程</text>
    <text x="84" y="344" font-size="13" fill="#C77800">夸大它 = 把任务难度错当模型不行</text>

    <rect x="456" y="120" width="368" height="260" rx="12" fill="#FFFFFF" stroke="#C77800" stroke-opacity="0.35"/>
    <rect x="456" y="120" width="368" height="4" fill="#C77800"/>
    <text x="480" y="156" font-size="17" font-weight="bold" fill="#C77800">Long-Context 长上下文</text>
    <rect x="480" y="172" width="120" height="24" rx="4" fill="#FBF3E4"/>
    <text x="490" y="189" font-size="12.5" fill="#C77800">模型属性 model</text>
    <text x="480" y="226" font-size="14" fill="#1A2433">"一次能装多少 token"</text>
    <text x="480" y="258" font-size="13.5" fill="#51617A">· Kimi K3：1M token 窗口</text>
    <text x="480" y="282" font-size="13.5" fill="#51617A">· 窗口大 ≠ 用得好（注意力稀释、</text>
    <text x="480" y="306" font-size="13.5" fill="#51617A">  中段遗忘仍在）</text>
    <text x="480" y="344" font-size="13" fill="#C0392B">夸大它 = "堆窗口解决一切"的幻觉</text>

    <rect x="852" y="120" width="368" height="260" rx="12" fill="#FFFFFF" stroke="#6D4FC2" stroke-opacity="0.35"/>
    <rect x="852" y="120" width="368" height="4" fill="#6D4FC2"/>
    <text x="876" y="156" font-size="17" font-weight="bold" fill="#6D4FC2">Long-Term Memory 长期记忆</text>
    <rect x="876" y="172" width="120" height="24" rx="4" fill="#EFEBF8"/>
    <text x="886" y="189" font-size="12.5" fill="#6D4FC2">系统属性 system</text>
    <text x="876" y="226" font-size="14" fill="#1A2433">"跨步/跨会话持久化"</text>
    <text x="876" y="258" font-size="13.5" fill="#51617A">· 记什么、怎么组织、何时取用</text>
    <text x="876" y="282" font-size="13.5" fill="#51617A">· ICML 2026 整个专场在谈它</text>
    <text x="876" y="306" font-size="13.5" fill="#51617A">· MemoryArena：这是最大短板</text>
    <text x="876" y="344" font-size="13" fill="#1E8E3E">夸大它 = 记忆库≠好记忆系统</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="428" font-size="16" font-weight="bold" fill="#1A2433">综述的第二把刀：horizon 由谁承载（三轴）</text>
    <rect x="80" y="446" width="1140" height="190" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <g font-size="13.5" fill="#1A2433">
      <rect x="104" y="470" width="18" height="18" rx="3" fill="#0B6E99"/>
      <text x="132" y="484" font-weight="bold" fill="#0B6E99">Within-context</text>
      <text x="320" y="484">整个任务塞进一个上下文窗口 → 窗口够大就行，最简单</text>
      <rect x="104" y="510" width="18" height="18" rx="3" fill="#C77800"/>
      <text x="132" y="524" font-weight="bold" fill="#C77800">Within-task, beyond-context</text>
      <text x="400" y="524">任务超出窗口 → 需要压缩/遗忘/检索策略（ACON、Agent-Omit 战场）</text>
      <rect x="104" y="550" width="18" height="18" rx="3" fill="#6D4FC2"/>
      <text x="132" y="564" font-weight="bold" fill="#6D4FC2">Cross-task persistent</text>
      <text x="340" y="564">跨任务持久（经验/技能沉淀）→ EvolveR、Skill-Pro、Ouroboros 战场</text>
    </g>
    <text x="104" y="610" font-size="13.5" fill="#0B6E99">→ 越往右越难，也越是 2026 下半年的主战场——五条主线论文全部落在右侧两轴</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">概念三分法 + 三轴承载模型：引用本综述时最常被复用的两张图（原文 §2）</text>
</svg>
