<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">HPO：给 Agent RL 装上"事后诸葛亮"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Hindsight Policy Optimization · arXiv 2607.16257 · 2026-07 · 一步一步图解</text>
  </g>

  <!-- step diagram -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="134" font-size="16" font-weight="bold" fill="#1A2433">HPO 三步走（配"审计复盘"类比）</text>

    <rect x="60" y="152" width="373" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="152" width="373" height="4" fill="#0B6E99"/>
    <text x="84" y="186" font-size="15" font-weight="bold" fill="#0B6E99">第 1 步：先跑完，拿到完整轨迹</text>
    <rect x="84" y="204" width="325" height="110" rx="8" fill="#EEF2F8"/>
    <g font-family="'SF Mono','Menlo',monospace" font-size="11.5" fill="#1A2433">
      <text x="100" y="230">①打开账表 ✓</text>
      <text x="100" y="252">②筛异常样本 ✓（关键伏笔）</text>
      <text x="100" y="274">③写抽样函 ✓</text>
      <text x="100" y="296">④…（共 200 步）→ 任务失败 ✗</text>
    </g>
    <text x="84" y="344" font-size="13" fill="#51617A">类比：项目做砸了，底稿完整留下来</text>
    <text x="84" y="368" font-size="13" fill="#51617A">（outcome RL 到这一步只有"失败"俩字）</text>

    <rect x="453" y="152" width="373" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="453" y="152" width="373" height="4" fill="#C77800"/>
    <text x="477" y="186" font-size="15" font-weight="bold" fill="#C77800">第 2 步：事后推断"这条轨迹的意图"</text>
    <rect x="477" y="204" width="325" height="110" rx="8" fill="#FBF3E4"/>
    <text x="493" y="230" font-size="13" fill="#1A2433">重读 200 步 → 发现实际导向了</text>
    <text x="493" y="254" font-size="13" fill="#1A2433">"全量排查"（而不是要求的"抽样审计"）</text>
    <text x="493" y="282" font-size="13" fill="#51617A">这就是 intent（意图）：</text>
    <text x="493" y="302" font-size="13" fill="#51617A">"这条路实际通向哪"的事后判读</text>
    <text x="477" y="344" font-size="13" fill="#51617A">类比：复盘时先弄清"当时实际在干啥"</text>
    <text x="477" y="368" font-size="13" fill="#51617A">而不是"该不该干"</text>

    <rect x="846" y="152" width="374" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="846" y="152" width="374" height="4" fill="#6D4FC2"/>
    <text x="870" y="186" font-size="15" font-weight="bold" fill="#6D4FC2">第 3 步：意图空间里对比打分</text>
    <rect x="870" y="204" width="326" height="110" rx="8" fill="#EFEBF8"/>
    <text x="886" y="230" font-size="13" fill="#1A2433">"抽样审计策略"的轨迹 vs 这条</text>
    <text x="886" y="254" font-size="13" fill="#1A2433">"全量排查轨迹" → 差距量化</text>
    <text x="886" y="282" font-size="13" fill="#1A2433">每一步获得信号："这一步让你偏向了</text>
    <text x="886" y="302" font-size="13" fill="#1A2433">全量排查（错意图），该抑制"</text>
    <text x="870" y="344" font-size="13" fill="#51617A">类比：定位到"第 41 步开始走偏"</text>
    <text x="870" y="368" font-size="13" fill="#51617A">——逐题批改达成</text>
  </g>

  <!-- results plain -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="416" width="1160" height="232" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.35"/>
    <text x="84" y="450" font-size="15" font-weight="bold" fill="#0B6E99">三个结果，翻译成大白话</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="484">① <tspan font-weight="bold">多跳任务（一环扣一环的任务）进步最大</tspan>——因为这类任务的"意图偏移"最容易被事后识别</text>
      <text x="84" y="518">② <tspan font-weight="bold">离线版效果更好</tspan>——先攒一批轨迹再慢慢复盘打分，不用边跑边学，工程上省钱省心</text>
      <text x="84" y="552">③ <tspan font-weight="bold">不需要 critic（裁判网络）也能稳</tspan>——PPO 要养一个裁判，HPO 用"事后意图"替代裁判，训练更稳</text>
    </g>
    <text x="84" y="596" font-size="14" fill="#C77800" font-weight="bold">一句话：让 agent 学会复盘——失败不再是浪费，失败轨迹本身变成教材</text>
    <text x="84" y="626" font-size="13" fill="#51617A">与 Horizon Gap 的呼应：这就是综述说的"制造过程信号"——总分不够用，就事后造出每步的分数</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2607.16257 · 原文关键句 "low-variance and smooth learning signals"（低方差且平滑的学习信号）</text>
</svg>
