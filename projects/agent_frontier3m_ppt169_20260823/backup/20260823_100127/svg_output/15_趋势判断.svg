<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">工业里程碑与趋势判断</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">学术之外的三个信号 + 面向 2026 Q4 的四条判断</text>
  </g>

  <!-- industry milestones -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="380" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="380" height="4" fill="#0B6E99"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">ICML 2026（首尔 · 7 月）</text>
    <text x="84" y="182" font-size="13.5" fill="#1A2433">· 投稿 <tspan font-family="'SF Mono',monospace" font-weight="bold">23,918</tspan> 篇创纪录</text>
    <text x="84" y="210" font-size="13.5" fill="#1A2433">· Google PAT（Paper Assistant Tool）</text>
    <text x="84" y="236" font-size="13.5" fill="#1A2433">  审稿 10,000+ 篇，每篇约 30 分钟</text>
    <text x="84" y="264" font-size="13.5" fill="#1A2433">  = 史上最大规模 AI 同行评审部署</text>
    <text x="84" y="296" font-size="13" fill="#51617A">AI 审 AI 论文，本身成为 agent 论文</text>

    <rect x="460" y="118" width="380" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="460" y="118" width="380" height="4" fill="#C77800"/>
    <text x="484" y="150" font-size="15" font-weight="bold" fill="#C77800">微软 Build 2026（6-02）</text>
    <text x="484" y="182" font-size="13.5" fill="#1A2433">· <tspan font-weight="bold">ASSERT</tspan>：政策驱动评测开源框架</text>
    <text x="484" y="210" font-size="13.5" fill="#1A2433">  （把合规政策变成可测场景）</text>
    <text x="484" y="238" font-size="13.5" fill="#1A2433">· <tspan font-weight="bold">ACS</tspan>：Agent Control Specification——</text>
    <text x="484" y="264" font-size="13.5" fill="#1A2433">  "agent 安全界的 MCP"，5 检查点</text>
    <text x="484" y="290" font-size="13.5" fill="#1A2433">  （input/LLM/state/tool/output）</text>
    <text x="484" y="320" font-size="13" fill="#51617A">治理标准化开始：IBM/Arize 已接入</text>

    <rect x="860" y="118" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="860" y="118" width="360" height="4" fill="#6D4FC2"/>
    <text x="884" y="150" font-size="15" font-weight="bold" fill="#6D4FC2">Google I/O 与 Alphabet</text>
    <text x="884" y="182" font-size="13.5" fill="#1A2433">· token 处理 2 年 <tspan font-family="'SF Mono',monospace" font-weight="bold">300×</tspan></text>
    <text x="884" y="208" font-size="13.5" fill="#1A2433">  （9.7T/月 → 3.2 quadrillion/月）</text>
    <text x="884" y="236" font-size="13.5" fill="#1A2433">· Gemini Spark：常驻后台个人 agent</text>
    <text x="884" y="264" font-size="13.5" fill="#1A2433">· Gemini 3.5 聚焦 agentic coding/长程</text>
    <text x="884" y="296" font-size="13" fill="#51617A">"agent-first"成产品哲学</text>
  </g>

  <!-- trend judgments -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="398" font-size="16" font-weight="bold" fill="#1A2433">四条趋势判断（面向 2026 Q4 — 2027）</text>

    <rect x="60" y="414" width="572" height="110" rx="12" fill="#E8F1F8"/>
    <text x="84" y="446" font-size="14.5" font-weight="bold" fill="#0B6E99">① 过程信号军备竞赛白热化</text>
    <text x="84" y="474" font-size="13.5" fill="#1A2433">HPO 意图空间 / MileGPO 里程碑图 / PRM 将快速合流，</text>
    <text x="84" y="498" font-size="13.5" fill="#1A2433">Q4 大概率出现统一框架（_watch NeurIPS 2026 投稿）</text>

    <rect x="652" y="414" width="568" height="110" rx="12" fill="#EFEBF8"/>
    <text x="676" y="446" font-size="14.5" font-weight="bold" fill="#6D4FC2">② 记忆系统进入"重构范式"落地期</text>
    <text x="676" y="474" font-size="13.5" fill="#1A2433">图结构 + 意图检索 + 元进化从论文走向产品</text>
    <text x="676" y="498" font-size="13.5" fill="#1A2433">（mem0/Graphiti 类产品的 ICML 后升级潮）</text>

    <rect x="60" y="540" width="572" height="110" rx="12" fill="#FBF3E4"/>
    <text x="84" y="572" font-size="14.5" font-weight="bold" fill="#C77800">③ 基准与训练合一（RLVR 化）</text>
    <text x="84" y="600" font-size="13.5" fill="#1A2433">Gaia2 的 verifier 即训练环境的模式会被复制：</text>
    <text x="84" y="624" font-size="13.5" fill="#1A2433">"评测集"与"训练场"的边界消失，评测即军备</text>

    <rect x="652" y="540" width="568" height="110" rx="12" fill="#EAF5EE"/>
    <text x="676" y="572" font-size="14.5" font-weight="bold" fill="#1E8E3E">④ 自进化 + 安全治理并行立法</text>
    <text x="676" y="600" font-size="13.5" fill="#1A2433">Ouroboros 们跑得越远，ACS/ASSERT 类控制标准越刚需</text>
    <text x="676" y="624" font-size="13.5" fill="#1A2433">——内审视角：这两条线值得纳入 2027 审计规划</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">判断为主观校准，基于本季度论文轨迹外推 · 工业：icml.cc · devblogs.microsoft.com · blog.google（均已抓取验证）</text>
</svg>
