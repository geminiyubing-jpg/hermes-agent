<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">预备知识 ①：Agent 到底是什么？</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">用银行工作的类比，把基础概念一次讲透 · 后面所有论文都建立在这页之上</text>
  </g>

  <!-- Agent vs Chatbot -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="250" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#8494AB">普通聊天机器人（一问一答）</text>
    <!-- diagram: user -> model -> answer -->
    <rect x="104" y="170" width="130" height="52" rx="8" fill="#EEF2F8"/>
    <text x="169" y="192" text-anchor="middle" font-size="13.5" fill="#1A2433">你提问</text>
    <text x="169" y="212" text-anchor="middle" font-size="12" fill="#51617A">"帮我写封邮件"</text>
    <path d="M 234 196 L 288 196" stroke="#8494AB" stroke-width="2" marker-end="url(#ar1)"/>
    <rect x="290" y="170" width="150" height="52" rx="8" fill="#EEF2F8"/>
    <text x="365" y="192" text-anchor="middle" font-size="13.5" fill="#1A2433">模型生成</text>
    <text x="365" y="212" text-anchor="middle" font-size="12" fill="#51617A">一次性输出文字</text>
    <path d="M 440 196 L 494 196" stroke="#8494AB" stroke-width="2" marker-end="url(#ar1)"/>
    <rect x="496" y="170" width="116" height="52" rx="8" fill="#EEF2F8"/>
    <text x="554" y="192" text-anchor="middle" font-size="13.5" fill="#1A2433">收到回答</text>
    <text x="554" y="212" text-anchor="middle" font-size="12" fill="#51617A">结束</text>
    <defs>
      <marker id="ar1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB"/>
      </marker>
    </defs>
    <text x="84" y="266" font-size="13.5" fill="#51617A">像"咨询窗口"：问一句答一句，它不动手，也不会根据</text>
    <text x="84" y="290" font-size="13.5" fill="#51617A">结果调整下一步行动。</text>
    <text x="84" y="332" font-size="13" fill="#8494AB">局限：无法完成"要连续做很多步"的真实工作</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="250" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.4"/>
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#0B6E99">Agent（会动手、会循环、会用工具）</text>
    <!-- loop diagram -->
    <rect x="676" y="170" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#0B6E99"/>
    <text x="736" y="191" text-anchor="middle" font-size="13.5" fill="#0B6E99" font-weight="bold">① 目标</text>
    <text x="736" y="209" text-anchor="middle" font-size="11.5" fill="#51617A">"查数据写报告"</text>
    <rect x="836" y="170" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#0B6E99"/>
    <text x="896" y="191" text-anchor="middle" font-size="13.5" fill="#0B6E99" font-weight="bold">② 思考</text>
    <text x="896" y="209" text-anchor="middle" font-size="11.5" fill="#51617A">"先打开数据库"</text>
    <rect x="996" y="170" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#0B6E99"/>
    <text x="1056" y="191" text-anchor="middle" font-size="13.5" fill="#0B6E99" font-weight="bold">③ 行动</text>
    <text x="1056" y="209" text-anchor="middle" font-size="11.5" fill="#51617A">调用工具执行</text>
    <path d="M 796 195 L 836 195" stroke="#0B6E99" stroke-width="2" marker-end="url(#ar2)"/>
    <path d="M 956 195 L 996 195" stroke="#0B6E99" stroke-width="2" marker-end="url(#ar2)"/>
    <defs>
      <marker id="ar2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#0B6E99"/>
      </marker>
    </defs>
    <rect x="836" y="250" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#C77800"/>
    <text x="896" y="271" text-anchor="middle" font-size="13.5" fill="#C77800" font-weight="bold">④ 观察</text>
    <text x="896" y="289" text-anchor="middle" font-size="11.5" fill="#51617A">看工具返回了啥</text>
    <path d="M 1056 220 L 1056 275 L 956 275" stroke="#C77800" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
    <path d="M 836 275 L 736 275 L 736 220" stroke="#C77800" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
    <defs>
      <marker id="ar3" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#C77800"/>
      </marker>
    </defs>
    <text x="1020" y="300" font-size="12.5" fill="#C77800" font-weight="bold">↺ 循环：观察完再思考下一步</text>
    <text x="676" y="336" font-size="13.5" fill="#1A2433">像"新入职的审计助理"：给目标，自己拆步骤、用系统、</text>
    <text x="676" y="358" font-size="13.5" fill="#1A2433">看结果、纠错重试，直到交活。</text>
  </g>

  <!-- key terms -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="392" width="1160" height="256" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="424" font-size="15" font-weight="bold" fill="#0B6E99">四个关键词（后文反复出现，先记住）</text>
    <g font-size="13.5">
      <rect x="84" y="444" width="270" height="88" rx="8" fill="#EEF2F8"/>
      <text x="100" y="472" font-weight="bold" fill="#1A2433">工具调用 Tool Call</text>
      <text x="100" y="496" fill="#51617A">agent 执行动作的方式：查库、搜网、</text>
      <text x="100" y="518" fill="#51617A">改文件、跑代码——每次都是一次调用</text>

      <rect x="370" y="444" width="270" height="88" rx="8" fill="#EEF2F8"/>
      <text x="386" y="472" font-weight="bold" fill="#1A2433">回合 Turn</text>
      <text x="386" y="496" fill="#51617A">"思考+行动+观察"完整一圈 = 一回合。</text>
      <text x="386" y="518" fill="#51617A">复杂任务要几百回合（OSWorld 2.0: 318）</text>

      <rect x="656" y="444" width="270" height="88" rx="8" fill="#EEF2F8"/>
      <text x="672" y="472" font-weight="bold" fill="#1A2433">轨迹 Trajectory</text>
      <text x="672" y="496" fill="#51617A">从头到尾所有回合连成的完整记录，</text>
      <text x="672" y="518" fill="#51617A">相当于工作底稿——训练时用它复盘</text>

      <rect x="942" y="444" width="254" height="88" rx="8" fill="#EEF2F8"/>
      <text x="958" y="472" font-weight="bold" fill="#1A2433">奖励 Reward</text>
      <text x="958" y="496" fill="#51617A">任务结束时给的总评分（成功=1/失败=0），</text>
      <text x="958" y="518" fill="#51617A">agent 训练全靠这个分数倒推改进</text>
    </g>
    <text x="84" y="580" font-size="13.5" fill="#1A2433">一句话总纲：<tspan font-weight="bold" fill="#0B6E99">Agent = LLM（大脑）+ 循环（不干完不停）+ 工具（手和脚）+ 记忆（笔记本）</tspan></text>
    <text x="84" y="608" font-size="13" fill="#51617A">本季度所有论文，都是在修补这套结构里的某一环：循环太长会迷路（Horizon Gap）、只看总分不会练（RL 系列）、笔记本不会记（记忆系列）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">预备知识页 · 讲解时建议在此页多停留，确保听众建立循环心智模型后再进入论文</text>
</svg>
