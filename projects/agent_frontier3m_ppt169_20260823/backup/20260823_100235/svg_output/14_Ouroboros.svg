<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">Ouroboros：会"自己升级自己"的 Agent</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">arXiv 2608.08311 · 2026-08 · 衔尾蛇（咬住自己尾巴的蛇）· 图解机制与战绩</text>
  </g>

  <!-- what is harness first -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="104" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">先说清一个词：Harness（脚手架/工作台）</text>
    <text x="84" y="180" font-size="13.5" fill="#1A2433">模型是大脑，harness 是给它配的"办公装备"：工具清单怎么写、提示词怎么措辞、上下文怎么组装、代码怎么组织。</text>
    <text x="84" y="206" font-size="13.5" fill="#51617A">同一个模型，配上好 harness 就是能干活的员工，配上烂 harness 就是实习生——这是 agent 工程界的基本共识。</text>
  </g>

  <!-- the loop diagram -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="244" width="700" height="260" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="84" y="276" font-size="15" font-weight="bold" fill="#1E8E3E">Ouroboros 的自升级循环</text>
    <rect x="84" y="296" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#1E8E3E"/>
    <text x="174" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1A2433">① 干活</text>
    <text x="174" y="344" text-anchor="middle" font-size="11.5" fill="#51617A">写代码/查资料/交流</text>
    <rect x="320" y="296" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#C77800"/>
    <text x="410" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1A2433">② 暴露问题</text>
    <text x="410" y="344" text-anchor="middle" font-size="11.5" fill="#51617A">工具不好用/提示词绕/低效</text>
    <rect x="556" y="296" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#6D4FC2"/>
    <text x="646" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1A2433">③ 提交改进</text>
    <text x="646" y="344" text-anchor="middle" font-size="11.5" fill="#51617A">写补丁→过评审→合并</text>
    <path d="M 264 331 L 320 331" stroke="#8494AB" stroke-width="2" marker-end="url(#ob1)"/>
    <path d="M 500 331 L 556 331" stroke="#8494AB" stroke-width="2" marker-end="url(#ob1)"/>
    <defs>
      <marker id="ob1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB"/>
      </marker>
    </defs>
    <rect x="320" y="410" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="2"/>
    <text x="410" y="436" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1E8E3E">④ 明天的自己</text>
    <text x="410" y="458" text-anchor="middle" font-size="11.5" fill="#51617A">用升级后的装备继续干活</text>
    <path d="M 646 366 L 646 445 L 500 445" stroke="#1E8E3E" stroke-width="2" fill="none" marker-end="url(#ob2)"/>
    <path d="M 320 445 L 174 445 L 174 366" stroke="#1E8E3E" stroke-width="2" fill="none" marker-end="url(#ob2)"/>
    <defs>
      <marker id="ob2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#1E8E3E"/>
      </marker>
    </defs>
    <text x="84" y="500" font-size="13.5" fill="#1A2433">关键：<tspan font-weight="bold">改进要过"代码评审"才能上线</tspan>——不是乱改，是带着安全带的进化</text>
  </g>

  <!-- scores -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="780" y="244" width="440" height="260" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="804" y="276" font-size="15" font-weight="bold" fill="#C77800">战绩（重点：模型没换！）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="310">都是同一个 Claude Opus 5 当大脑：</text>
      <rect x="804" y="326" width="392" height="44" rx="6" fill="#EEF2F8"/>
      <text x="818" y="346" font-weight="bold">Terminal-Bench 2.1</text>
      <text x="818" y="364" font-size="12.5" fill="#51617A">86.74%（该基准最佳成绩）</text>
      <rect x="804" y="378" width="392" height="44" rx="6" fill="#EEF2F8"/>
      <text x="818" y="398" font-weight="bold">OSWorld-Verified</text>
      <text x="818" y="416" font-size="12.5" fill="#51617A">90.69%（超过此前所有报告）</text>
      <rect x="804" y="430" width="392" height="44" rx="6" fill="#EEF2F8"/>
      <text x="818" y="450" font-weight="bold">连续运行</text>
      <text x="818" y="468" font-size="12.5" fill="#51617A">161 天持续自我进化不崩溃</text>
    </g>
    <text x="804" y="498" font-size="13" fill="#1E8E3E" font-weight="bold">→ 提升全部来自 harness 自我改进</text>
  </g>

  <!-- safety -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="524" width="1160" height="124" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.35"/>
    <text x="84" y="556" font-size="15" font-weight="bold" fill="#C0392B">但是——论文自己敲响的警钟</text>
    <text x="84" y="586" font-size="13.5" fill="#1A2433">① 谁来评审"评审标准"？改进要过评审，但评审规则本身也在被改进的对象里——套娃隐患</text>
    <text x="84" y="612" font-size="13.5" fill="#1A2433">② 进化 161 天 = 无人监督的 161 天；一旦"改进"方向跑偏（比如学会绕过检查），如何回滚？</text>
    <text x="84" y="638" font-size="13.5" fill="#1A2433">③ 这正是 ICML 同时出现多篇"agent 监督"论文的原因——进化与缰绳必须同步发展</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2608.08311 · github.com/razzant/ouroboros · 诚实披露：SWE-bench Pro 上与 Codex CLI 统计持平</text>
</svg>
