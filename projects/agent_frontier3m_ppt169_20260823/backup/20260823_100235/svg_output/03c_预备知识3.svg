<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">预备知识 ③：Agent 的"笔记本"——记忆系统</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">记忆系列论文的地基 · 为什么"记住"这么难，难在哪</text>
  </g>

  <!-- memory lifecycle -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="134" font-size="16" font-weight="bold" fill="#1A2433">记忆系统 = 写 → 管 → 读 三个环节（每个环节都能出错）</text>

    <rect x="60" y="152" width="368" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="152" width="368" height="4" fill="#0B6E99"/>
    <text x="84" y="186" font-size="15" font-weight="bold" fill="#0B6E99">写 Write：什么值得记？</text>
    <text x="84" y="218" font-size="13.5" fill="#1A2433">每轮对话都产生信息，但 99% 是噪音：</text>
    <text x="104" y="246" font-size="13.5" fill="#1A2433">· 用户随口一句"喜欢辣的"→ 该记</text>
    <text x="104" y="272" font-size="13.5" fill="#1A2433">· 中间报错重试的过程 → 多数不该记</text>
    <text x="104" y="298" font-size="13.5" fill="#1A2433">· 记多了 → 噪音淹没信号（过度保留）</text>
    <text x="104" y="324" font-size="13.5" fill="#1A2433">· 记少了 → 关键偏好丢失（错位遗忘）</text>
    <text x="84" y="360" font-size="13" fill="#51617A">类比：底稿什么都要 vs 结论卷只要关键件</text>

    <rect x="456" y="152" width="368" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="456" y="152" width="368" height="4" fill="#C77800"/>
    <text x="480" y="186" font-size="15" font-weight="bold" fill="#C77800">管 Manage：怎么组织？</text>
    <text x="480" y="218" font-size="13.5" fill="#1A2433">记下来的东西要维护：</text>
    <text x="500" y="246" font-size="13.5" fill="#1A2433">· 上月说"用 A 银行"，本月改"用 B"→</text>
    <text x="520" y="270" font-size="13.5" fill="#1A2433">  新旧冲突怎么裁决？（调和失败病）</text>
    <text x="500" y="298" font-size="13.5" fill="#1A2433">· 组织形态：一锅文本？按主题分档？</text>
    <text x="520" y="322" font-size="13.5" fill="#1A2433">  还是画成关系图（知识图谱）？</text>
    <text x="480" y="360" font-size="13" fill="#51617A">MRAgent/EAM 的战场：图谱化组织</text>

    <rect x="852" y="152" width="368" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="852" y="152" width="368" height="4" fill="#6D4FC2"/>
    <text x="876" y="186" font-size="15" font-weight="bold" fill="#6D4FC2">读 Read：怎么取？</text>
    <text x="876" y="218" font-size="13.5" fill="#1A2433">用的时候怎么找到对的记忆：</text>
    <text x="896" y="246" font-size="13.5" fill="#1A2433">· 关键词/相似度检索（现状主流）</text>
    <text x="896" y="272" font-size="13.5" fill="#1A2433">· 按意图检索（SimpleMem 新方案）</text>
    <text x="896" y="298" font-size="13.5" fill="#1A2433">· 现场重构一份"情境摘要"（MRAgent）</text>
    <text x="896" y="324" font-size="13.5" fill="#1A2433">· 取太多 → 挤爆上下文；取太少 → 缺信息</text>
    <text x="876" y="360" font-size="13" fill="#51617A">类比：调卷宗——全调来读不完，调漏了误判</text>
  </g>

  <!-- multi-session problem -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="408" width="1160" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="440" font-size="15" font-weight="bold" fill="#C0392B">真正的新难题：跨会话（Multi-Session）——记分牌上的"隐形断层"</text>
    <!-- timeline diagram -->
    <line x1="84" y1="500" x2="1196" y2="500" stroke="#8494AB" stroke-width="2"/>
    <g font-size="12.5">
      <circle cx="130" cy="500" r="7" fill="#0B6E99"/>
      <text x="130" y="478" text-anchor="middle" fill="#1A2433" font-weight="bold">周一会话</text>
      <text x="130" y="530" text-anchor="middle" fill="#51617A">说好"预算上限 500"</text>
      <circle cx="480" cy="500" r="7" fill="#0B6E99"/>
      <text x="480" y="478" text-anchor="middle" fill="#1A2433" font-weight="bold">周三会话</text>
      <text x="480" y="530" text-anchor="middle" fill="#51617A">订了 620 的方案</text>
      <circle cx="830" cy="500" r="7" fill="#C0392B"/>
      <text x="830" y="478" text-anchor="middle" fill="#C0392B" font-weight="bold">下周一会话</text>
      <text x="830" y="530" text-anchor="middle" fill="#51617A">又推了 620 的方案 ✗</text>
      <text x="1060" y="530" fill="#8494AB">（忘了上限约束）</text>
    </g>
    <path d="M 140 545 Q 480 585 820 545" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
    <text x="480" y="590" text-anchor="middle" font-size="13" fill="#C0392B">跨会话依赖：周三的错误根源在周一，暴露在下周——单次测试根本看不到</text>
    <text x="84" y="630" font-size="13.5" fill="#1A2433">现有基准（LoCoMo 等）只考"单次聊天里记没记住某句话"——<tspan font-weight="bold" fill="#C0392B">这就是 MemoryArena 要打假的盲区</tspan></text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">预备知识页 · 记住"写-管-读"三环节 + 跨会话断层，记忆五篇论文各治一个环节的病</text>
</svg>
