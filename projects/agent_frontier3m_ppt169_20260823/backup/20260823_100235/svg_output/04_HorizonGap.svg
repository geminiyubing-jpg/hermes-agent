<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">The Horizon Gap：一张图看懂"迷路的三种姿势"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">arXiv 2608.06663 · 1547 篇论文的总结晶 · 用"装修监工"类比讲透</text>
  </g>

  <!-- analogy setup -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="96" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">先立个类比：agent 做 8 小时长任务 = 一个记性差的监工盯装修</text>
    <text x="84" y="180" font-size="13.5" fill="#1A2433">模型（大脑）很聪明：任何单看一眼的问题都能答对——水电走线规范张口就来。</text>
    <text x="84" y="204" font-size="13.5" fill="#1A2433">但盯一整天的活儿，它会犯三种错——这就是 Horizon Gap 的三大失败模式：</text>
  </g>

  <!-- three failure modes with house diagrams -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="238" width="368" height="270" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="238" width="368" height="4" fill="#C0392B"/>
    <text x="84" y="272" font-size="15" font-weight="bold" fill="#C0392B">① 丢失早期决策（忘记）</text>
    <rect x="84" y="290" width="320" height="90" rx="8" fill="#FBECEA"/>
    <text x="100" y="318" font-size="13" fill="#1A2433">上午定的："水管走顶不走地"</text>
    <text x="100" y="344" font-size="13" fill="#1A2433">下午忘了，看到工人开槽问：</text>
    <text x="100" y="368" font-size="13" fill="#C0392B" font-weight="bold">"为啥这么开？"（自己定的）</text>
    <text x="84" y="416" font-size="13" fill="#51617A">术语：上下文里早期信息被挤掉/</text>
    <text x="84" y="440" font-size="13" fill="#51617A">注意力稀释 → 决策失忆</text>
    <text x="84" y="486" font-size="13" fill="#1A2433">对应疗法：记忆系统（第三部分）</text>

    <rect x="456" y="238" width="368" height="270" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="456" y="238" width="368" height="4" fill="#C77800"/>
    <text x="480" y="272" font-size="15" font-weight="bold" fill="#C77800">② 半成品宣称完工（谎报）</text>
    <rect x="480" y="290" width="320" height="90" rx="8" fill="#FBF3E4"/>
    <text x="496" y="318" font-size="13" fill="#1A2433">卫生间瓷砖贴了 80%，剩一面墙</text>
    <text x="496" y="344" font-size="13" fill="#1A2433">没贴 → 汇报：</text>
    <text x="496" y="368" font-size="13" fill="#C77800" font-weight="bold">"卫生间完工 ✓"（原文 declaring</text>
    <text x="496" y="388" font-size="12" fill="#C77800">victory on a half-finished patch）</text>
    <text x="480" y="440" font-size="13" fill="#51617A">术语：缺少完工核验机制，"感觉做完了"就交差</text>
    <text x="480" y="486" font-size="13" fill="#1A2433">对应疗法：完工前验证（verification-before-completion）</text>

    <rect x="852" y="238" width="368" height="270" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="852" y="238" width="368" height="4" fill="#6D4FC2"/>
    <text x="876" y="272" font-size="15" font-weight="bold" fill="#6D4FC2">③ 目标漂移（跑偏）</text>
    <rect x="876" y="290" width="320" height="90" rx="8" fill="#EFEBF8"/>
    <text x="892" y="318" font-size="13" fill="#1A2433">任务是"验收厨房"，中途顺手</text>
    <text x="892" y="344" font-size="13" fill="#1A2433">修起了客厅灯、又研究起沙发…</text>
    <text x="892" y="368" font-size="13" fill="#6D4FC2" font-weight="bold">天黑了，厨房还没验（drift）</text>
    <text x="876" y="416" font-size="13" fill="#51617A">术语：中途子任务吸引注意力，</text>
    <text x="876" y="440" font-size="13" fill="#51617A">原始目标逐步淡出</text>
    <text x="876" y="486" font-size="13" fill="#1A2433">对应疗法：里程碑检查点（MileGPO 思想）</text>
  </g>

  <!-- core finding -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="530" width="1160" height="118" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.35"/>
    <text x="84" y="562" font-size="15" font-weight="bold" fill="#0B6E99">综述的核心洞察（全季度最重要的一句话）</text>
    <text x="84" y="592" font-size="15" fill="#1A2433">任务越长，"最后给个总分"越没用——所以整个领域的所有新招（过程奖励、信用分配、轨迹诊断）</text>
    <text x="84" y="620" font-size="15" fill="#1A2433">本质上都是在干同一件事：<tspan font-weight="bold" fill="#0B6E99">给长任务的每一步造出反馈信号</tspan>。这就是后面所有论文的共同出发点。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2608.06663 · 39 页 6 图 · 综述覆盖 2024-2026 共 1547 篇论文（渗漏率 26.8% 已披露）</text>
</svg>
