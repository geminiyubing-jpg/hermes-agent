<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">MemoryArena：现有记忆考试的"翻车现场"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ICML 2026 · arXiv 2602.16313 · 先看它怎么"打假"，再看它怎么"重建"</text>
  </g>

  <!-- the expose -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="250" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#C0392B">打假：旧考卷（LoCoMo 类）考什么？</text>
    <rect x="84" y="168" width="524" height="80" rx="8" fill="#FFFFFF"/>
    <text x="100" y="196" font-size="13.5" fill="#1A2433">考题示范："三周前我说过我女儿叫什么？"</text>
    <text x="100" y="222" font-size="13.5" fill="#51617A">→ 纯记忆抽查，答对就得分</text>
    <text x="84" y="282" font-size="13.5" fill="#1A2433">刷高分的套路：把历史对话全塞进检索库，</text>
    <text x="84" y="308" font-size="13.5" fill="#1A2433">关键词匹配就能拿 90+ 分</text>
    <text x="84" y="344" font-size="14" fill="#C0392B" font-weight="bold">翻车：换个要"用记忆做决定"的任务，全露馅</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="250" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#0B6E99">重建：MemoryArena 的考法</text>
    <rect x="676" y="168" width="520" height="176" rx="8" fill="#E8F1F8"/>
    <text x="692" y="196" font-size="13.5" fill="#1A2433" font-weight="bold">多会话连环任务示例：</text>
    <text x="700" y="224" font-size="13" fill="#1A2433">会话1（周一）：定了"报销上限 500 元"的原则</text>
    <text x="700" y="250" font-size="13" fill="#1A2433">会话2（周三）：提交 620 元的报销单</text>
    <text x="700" y="276" font-size="13" fill="#1A2433">→ agent 该记得原则并<tspan font-weight="bold" fill="#C0392B">主动拦下</tspan></text>
    <text x="700" y="302" font-size="13" fill="#1A2433">会话3（周五）：第三方故意说错"上限是 800"</text>
    <text x="700" y="328" font-size="13" fill="#1A2433">→ agent 该<tspan font-weight="bold">拒绝被错误信息带偏</tspan></text>
    <text x="676" y="364" font-size="13" fill="#51617A">记忆在"被使用中"被考核——存的目的是用</text>
  </g>

  <!-- three hidden diseases -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="392" width="1160" height="130" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="422" font-size="15" font-weight="bold" fill="#C77800">它揪出的三大隐疾（旧考卷全都看不见）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="452">① <tspan font-weight="bold">过度保留</tspan>：把"上次说预算 500"和"随口夸了句天气"同等重要地全记着 → 用的时候抓不到重点</text>
      <text x="84" y="480">② <tspan font-weight="bold">错位遗忘</tspan>：该忘的中间过程记了一堆，该记的原则性约定反而丢了</text>
      <text x="84" y="508">③ <tspan font-weight="bold">冲突调和失败</tspan>：新旧信息打架（上周说 A 这周说 B），agent 不知道听谁的，或干脆被最新的错误信息覆盖</text>
    </g>
  </g>

  <!-- why directional -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="544" width="1160" height="104" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="576" font-size="15" font-weight="bold" fill="#0B6E99">为什么"方向性"：它换了记分牌</text>
    <text x="84" y="606" font-size="14" fill="#1A2433">记忆系统的 KPI 从"召回率"（背得出）换成"跨会话任务完成度"（用得上）——</text>
    <text x="84" y="632" font-size="14" fill="#1A2433">此后所有记忆系统都得来这个考场自证。GAIA 之于通用 agent，MemoryArena 之于记忆。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2602.16313 · 项目页 memoryarena.github.io · ICML 2026 poster · 全场引用最多的发现（mem0 评）</text>
</svg>
