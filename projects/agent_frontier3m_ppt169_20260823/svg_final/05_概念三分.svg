<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">长 ≠ 长 ≠ 长：三个最容易搞混的词</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Horizon Gap 综述的概念澄清 · 用三件办公物品讲明白</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H416 A12,12 0 0 1 428,130 V406 A12,12 0 0 1 416,418 H72 A12,12 0 0 1 60,406 V130 A12,12 0 0 1 72,118 Z" />
    <rect x="60" y="118" width="368" height="4" fill="#0B6E99" />
    <text x="84" y="152" font-size="17" font-weight="bold" fill="#0B6E99">长任务 Long-Horizon</text>
    <path fill="#E8F1F8" d="M88,170 H210 A4,4 0 0 1 214,174 V192 A4,4 0 0 1 210,196 H88 A4,4 0 0 1 84,192 V174 A4,4 0 0 1 88,170 Z" />
    <text x="94" y="188" font-size="12.5" fill="#0B6E99">任务的属性</text>
    
    <path fill="#EEF2F8" stroke="#8494AB" d="M124,212 H196 A4,4 0 0 1 200,216 V308 A4,4 0 0 1 196,312 H124 A4,4 0 0 1 120,308 V216 A4,4 0 0 1 124,212 Z" />
    <path fill="#0B6E99" opacity="0.5" d="M115,204 H189 A3,3 0 0 1 192,207 V215 A3,3 0 0 1 189,218 H115 A3,3 0 0 1 112,215 V207 A3,3 0 0 1 115,204 Z" />
    <text x="160" y="340" text-anchor="middle" font-size="11.5" fill="#51617A">一项大工程</text>
    <text x="84" y="376" font-size="13.5" fill="#1A2433">"这个活儿本身要多少步才能干完"</text>
    <text x="84" y="402" font-size="13.5" fill="#1A2433">例：年度审计项目（几十个现场、</text>
    <text x="84" y="426" font-size="13.5" fill="#1A2433">上千个科目）——不管谁来做都长</text>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M468,118 H812 A12,12 0 0 1 824,130 V406 A12,12 0 0 1 812,418 H468 A12,12 0 0 1 456,406 V130 A12,12 0 0 1 468,118 Z" />
    <rect x="456" y="118" width="368" height="4" fill="#C77800" />
    <text x="480" y="152" font-size="17" font-weight="bold" fill="#C77800">长上下文 Long-Context</text>
    <path fill="#FBF3E4" d="M484,170 H606 A4,4 0 0 1 610,174 V192 A4,4 0 0 1 606,196 H484 A4,4 0 0 1 480,192 V174 A4,4 0 0 1 484,170 Z" />
    <text x="490" y="188" font-size="12.5" fill="#C77800">模型的属性</text>
    
    <path fill="#FBF3E4" stroke="#C77800" d="M514,212 H626 A4,4 0 0 1 630,216 V278 A4,4 0 0 1 626,282 H514 A4,4 0 0 1 510,278 V216 A4,4 0 0 1 514,212 Z" />
    <path fill="#C77800" opacity="0.6" d="M503,204 H637 A3,3 0 0 1 640,207 V213 A3,3 0 0 1 637,216 H503 A3,3 0 0 1 500,213 V207 A3,3 0 0 1 503,204 Z" />
    <text x="570" y="340" text-anchor="middle" font-size="11.5" fill="#51617A">一张大办公桌</text>
    <text x="480" y="376" font-size="13.5" fill="#1A2433">"桌面一次能摊开多少材料"</text>
    <text x="480" y="402" font-size="13.5" fill="#1A2433">Kimi K3 = 100 万 token 的桌子。</text>
    <text x="480" y="426" font-size="13.5" fill="#C0392B">但桌面大 ≠ 会整理：堆满照样找不到</text>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M864,118 H1208 A12,12 0 0 1 1220,130 V406 A12,12 0 0 1 1208,418 H864 A12,12 0 0 1 852,406 V130 A12,12 0 0 1 864,118 Z" />
    <rect x="852" y="118" width="368" height="4" fill="#6D4FC2" />
    <text x="876" y="152" font-size="17" font-weight="bold" fill="#6D4FC2">长期记忆 Long-Term Memory</text>
    <path fill="#EFEBF8" d="M880,170 H1022 A4,4 0 0 1 1026,174 V192 A4,4 0 0 1 1022,196 H880 A4,4 0 0 1 876,192 V174 A4,4 0 0 1 880,170 Z" />
    <text x="886" y="188" font-size="12.5" fill="#6D4FC2">系统的属性</text>
    
    <path fill="#EFEBF8" stroke="#6D4FC2" d="M934,212 H1016 A4,4 0 0 1 1020,216 V308 A4,4 0 0 1 1016,312 H934 A4,4 0 0 1 930,308 V216 A4,4 0 0 1 934,212 Z" />
    <line x1="940" y1="240" x2="1010" y2="240" stroke="#6D4FC2" />
    <line x1="940" y1="270" x2="1010" y2="270" stroke="#6D4FC2" />
    <line x1="940" y1="300" x2="1010" y2="300" stroke="#6D4FC2" />
    <text x="975" y="340" text-anchor="middle" font-size="11.5" fill="#51617A">档案柜</text>
    <text x="876" y="376" font-size="13.5" fill="#1A2433">"今天的东西明天还在不在"</text>
    <text x="876" y="402" font-size="13.5" fill="#1A2433">换会话/关机后还能记得上次的事</text>
    <text x="876" y="426" font-size="13.5" fill="#1A2433">——目前最薄弱的一环</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,442 H1208 A12,12 0 0 1 1220,454 V636 A12,12 0 0 1 1208,648 H72 A12,12 0 0 1 60,636 V454 A12,12 0 0 1 72,442 Z" />
    <text x="84" y="474" font-size="15" font-weight="bold" fill="#C0392B">为什么必须分清？（一个真实谬误）</text>
    <text x="84" y="506" font-size="14" fill="#1A2433">常见说法："Kimi K3 有 1M 上下文，所以它能干长任务。"——<tspan font-weight="bold" fill="#C0392B">错在哪？</tspan></text>
    <text x="104" y="536" font-size="13.5" fill="#1A2433">桌子（上下文）再大，也架不住：干活过程不断产生新记录把桌面堆满（几千次工具调用）→</text>
    <text x="104" y="562" font-size="13.5" fill="#1A2433">要么学会丢（压缩/省略：Agent-Omit）、要么学会存柜子（记忆系统：第三部分）。</text>
    <text x="84" y="596" font-size="14" fill="#1A2433">综述的第二把刀——任务由谁承载三档：<tspan font-weight="bold" fill="#0B6E99">桌面内</tspan>（窗口够就行）→ <tspan font-weight="bold" fill="#C77800">超桌面单任务</tspan>（要压缩遗忘）→ <tspan font-weight="bold" fill="#6D4FC2">跨任务沉淀</tspan>（要档案柜）</text>
    <text x="84" y="626" font-size="13.5" fill="#51617A">本季度所有论文都落在右侧两档——越往右越难，也越是主战场</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">概念三分法（原文 §2）· 记住比喻：工程大小（任务）≠ 桌子大小（模型）≠ 柜子好坏（系统）</text>
</svg>