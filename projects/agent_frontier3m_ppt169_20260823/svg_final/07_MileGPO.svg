<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">MileGPO：给长任务标出"检查点"和"坑"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">arXiv 2608.19803 · 2026-08-20 · 用地图类比讲透三步机制</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H748 A12,12 0 0 1 760,130 V406 A12,12 0 0 1 748,418 H72 A12,12 0 0 1 60,406 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#1A2433">核心思想：把任务轨迹当成"寻宝地图"</text>
    
    <path fill="#EEF2F8" d="M92,168 H728 A8,8 0 0 1 736,176 V330 A8,8 0 0 1 728,338 H92 A8,8 0 0 1 84,330 V176 A8,8 0 0 1 92,168 Z" />
    <line x1="110" y1="310" x2="710" y2="310" stroke="#8494AB" stroke-width="1.5" />
    <path d="M 110 300 L 200 260 L 310 240 L 430 200 L 560 180 L 690 190" fill="none" stroke="#0B6E99" stroke-width="2.5" />
    
    <g font-size="11.5">
      <circle cx="110" cy="300" r="6" fill="#1E8E3E" />
      <text x="110" y="330" text-anchor="middle" fill="#1E8E3E" font-weight="bold">起点</text>
      <path d="M 200 252 l 0 16 m -8 -8 l 16 0 m -8 -8 l 0 16" stroke="#1E8E3E" stroke-width="2.5" fill="none" />
      <text x="200" y="330" text-anchor="middle" fill="#1E8E3E" font-weight="bold">里程碑1 ✓</text>
      <circle cx="310" cy="240" r="6" fill="#1E8E3E" />
      <text x="310" y="222" text-anchor="middle" fill="#1E8E3E" font-weight="bold">里程碑2 ✓</text>
      <circle cx="430" cy="200" r="6" fill="#1E8E3E" />
      <text x="430" y="182" text-anchor="middle" fill="#1E8E3E" font-weight="bold">里程碑3 ✓</text>
      <circle cx="690" cy="190" r="8" fill="#C77800" />
      <text x="690" y="172" text-anchor="middle" fill="#C77800" font-weight="bold">宝藏 🏆</text>
    </g>
    
    <path d="M 110 300 L 180 280 L 250 285 L 300 295" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,4" />
    <text x="293" y="279" font-size="16" fill="#C0392B" font-weight="bold">⚠</text>
    <text x="320" y="279" font-size="11.5" fill="#C0392B" font-weight="bold">陷阱：死循环排查</text>
    <text x="84" y="366" font-size="13.5" fill="#1A2433">从<tspan font-weight="bold" fill="#1E8E3E">成功轨迹</tspan>里找出"每次路过都离宝藏更近"的地点 = <tspan font-weight="bold">里程碑</tspan></text>
    <text x="84" y="392" font-size="13.5" fill="#1A2433">从<tspan font-weight="bold" fill="#C0392B">失败轨迹</tspan>里找出"反复掉进去"的地点 = <tspan font-weight="bold">陷阱</tspan></text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M792,118 H1208 A12,12 0 0 1 1220,130 V406 A12,12 0 0 1 1208,418 H792 A12,12 0 0 1 780,406 V130 A12,12 0 0 1 792,118 Z" />
    <text x="804" y="150" font-size="15" font-weight="bold" fill="#0B6E99">三步机制（比上一版更白话）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="184" font-weight="bold" fill="#0B6E99">① 挖点（Discovery）</text>
      <text x="824" y="210">让 agent 把同一任务跑 N 遍，</text>
      <text x="824" y="234">成功路线上标里程碑，</text>
      <text x="824" y="258">失败路线上标陷阱</text>
      <text x="804" y="294" font-weight="bold" fill="#C77800">② 验真（Calibration）</text>
      <text x="824" y="320">候选点按可信度加权：</text>
      <text x="824" y="344">"10 次成功 9 次路过"→ 强信号</text>
      <text x="824" y="368">"只碰巧路过一次"→ 弱化</text>
      <text x="804" y="404" font-weight="bold" fill="#6D4FC2">③ 铺路（Graph PO）</text>
      <text x="824" y="430">点连成图，训练时奖励</text>
      <text x="824" y="452">"靠近里程碑"，惩罚"靠近陷阱"</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,440 H1208 A12,12 0 0 1 1220,452 V636 A12,12 0 0 1 1208,648 H72 A12,12 0 0 1 60,636 V452 A12,12 0 0 1 72,440 Z" />
    <text x="84" y="472" font-size="15" font-weight="bold" fill="#1A2433">三代训练方法对比（谁在给 agent 反馈？）</text>
    <g font-size="13.5">
      <path fill="#FBECEA" d="M92,490 H426 A8,8 0 0 1 434,498 V612 A8,8 0 0 1 426,620 H92 A8,8 0 0 1 84,612 V498 A8,8 0 0 1 92,490 Z" />
      <text x="100" y="518" font-weight="bold" fill="#C0392B">Outcome RL（2024-25 通行）</text>
      <text x="100" y="546" fill="#1A2433">"最后赢了没？"</text>
      <text x="100" y="572" fill="#51617A">反馈粒度：整个任务 1 个分数</text>
      <text x="100" y="598" fill="#51617A">长任务上：几乎学不到东西</text>

      <path fill="#FBF3E4" d="M462,490 H796 A8,8 0 0 1 804,498 V612 A8,8 0 0 1 796,620 H462 A8,8 0 0 1 454,612 V498 A8,8 0 0 1 462,490 Z" />
      <text x="470" y="518" font-weight="bold" fill="#C77800">PRM 过程奖励模型（2025）</text>
      <text x="470" y="546" fill="#1A2433">"每一步对不对？"（AI 助教逐题批）</text>
      <text x="470" y="572" fill="#51617A">反馈粒度：每步 1 个分数</text>
      <text x="470" y="598" fill="#51617A">问题：助教自己会判错，训练贵</text>

      <path fill="#EAF5EE" d="M832,490 H1188 A8,8 0 0 1 1196,498 V612 A8,8 0 0 1 1188,620 H832 A8,8 0 0 1 824,612 V498 A8,8 0 0 1 832,490 Z" />
      <text x="840" y="518" font-weight="bold" fill="#1E8E3E">MileGPO（2026-08）</text>
      <text x="840" y="546" fill="#1A2433">"离检查点近了？还是掉坑了？"</text>
      <text x="840" y="572" fill="#51617A">反馈粒度：关键节点 + 可信度加权</text>
      <text x="840" y="598" fill="#51617A">优点：不用养助教，失败数据也变教材</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2608.19803 · "失败轨迹的价值第一次被显式挖掘"——与 HPO 互补：一个看意图、一个看地形</text>
</svg>