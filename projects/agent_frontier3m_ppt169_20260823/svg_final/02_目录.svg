<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">六大部分 · 19 页 · 约 50 分钟 · 前面有零基础铺垫，任何人都能听懂</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="132" font-size="15" font-weight="bold" fill="#8494AB">Ⅰ · 预备知识（不熟悉 agent 的听众从这里跟上）</text>
    <rect x="80" y="146" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="178"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03a</tspan>  Agent 是什么？循环+工具+记忆（图解）</text>
      <text x="80" y="208"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03b</tspan>  怎么训练？从"只给总分"讲起（RL 速成）</text>
      <text x="80" y="238"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03c</tspan>  记忆系统 = 写→管→读（图解）+ 跨会话难题</text>
    </g>

    <text x="80" y="290" font-size="15" font-weight="bold" fill="#0B6E99">Ⅱ · 定调：Horizon Gap（长任务的三大迷路姿势）</text>
    <rect x="80" y="304" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="336"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03</tspan>  执行摘要：一个矛盾与五大主线</text>
      <text x="80" y="366"><tspan font-family="'SF Mono',monospace" fill="#8494AB">04</tspan>  装修监工类比：忘记/谎报/跑偏（图解）</text>
      <text x="80" y="396"><tspan font-family="'SF Mono',monospace" fill="#8494AB">05</tspan>  三个"长"字辨析：任务/桌子/柜子</text>
    </g>

    <text x="80" y="448" font-size="15" font-weight="bold" fill="#C77800">Ⅲ · 训练革命：从"只给总分"到"逐题批改"</text>
    <rect x="80" y="462" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="494"><tspan font-family="'SF Mono',monospace" fill="#8494AB">06</tspan>  HPO：让 agent 学会复盘（三步图解）</text>
      <text x="80" y="524"><tspan font-family="'SF Mono',monospace" fill="#8494AB">07</tspan>  MileGPO：给任务标检查点和坑（地图图解）</text>
      <text x="80" y="554"><tspan font-family="'SF Mono',monospace" fill="#8494AB">08</tspan>  Agent-Omit / STAR：省话费与配方手册</text>
    </g>

    <text x="680" y="132" font-size="15" font-weight="bold" fill="#6D4FC2">Ⅳ · 记忆重构：从"存得下"到"用得上"</text>
    <rect x="680" y="146" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="178"><tspan font-family="'SF Mono',monospace" fill="#8494AB">09</tspan>  MemoryArena：旧考试的翻车现场</text>
      <text x="680" y="208"><tspan font-family="'SF Mono',monospace" fill="#8494AB">10</tspan>  SimpleMem：像档案室一样整理（流程图解）</text>
      <text x="680" y="238"><tspan font-family="'SF Mono',monospace" fill="#8494AB">11</tspan>  MRAgent：从取档案到写专题报告（图解）</text>
    </g>

    <text x="680" y="290" font-size="15" font-weight="bold" fill="#C0392B">Ⅴ · 基准重置与模型军备</text>
    <rect x="680" y="304" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="336"><tspan font-family="'SF Mono',monospace" fill="#8494AB">12</tspan>  考试改革三板斧（基准扫盲+图解）</text>
      <text x="680" y="366"><tspan font-family="'SF Mono',monospace" fill="#8494AB">13</tspan>  模型三件事 + Terminal-Bench 榜单（扫盲版）</text>
    </g>

    <text x="680" y="418" font-size="15" font-weight="bold" fill="#1E8E3E">Ⅵ · 自我进化与展望</text>
    <rect x="680" y="432" width="540" height="2" fill="#D8E0EC" />
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="464"><tspan font-family="'SF Mono',monospace" fill="#8494AB">14</tspan>  Ouroboros：自己升级自己（循环图解+安全警钟）</text>
      <text x="680" y="494"><tspan font-family="'SF Mono',monospace" fill="#8494AB">15</tspan>  工业里程碑与四条趋势判断</text>
      <text x="680" y="524"><tspan font-family="'SF Mono',monospace" fill="#8494AB">16</tspan>  尾页：论文清单与观察哨</text>
    </g>
  </g>

  <path fill="#FFFFFF" stroke="#D8E0EC" d="M92,576 H1208 A12,12 0 0 1 1220,588 V644 A12,12 0 0 1 1208,656 H92 A12,12 0 0 1 80,644 V588 A12,12 0 0 1 92,576 Z" />
  <text x="104" y="608" font-family="'PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#C77800">阅读路线：赶时间 → 只看 03/04/09/14/15（五页抓住全局）；想深入 → 按顺序全读，预备知识保证零基础不掉队</text>
  <text x="104" y="636" font-family="'PingFang SC',sans-serif" font-size="13" fill="#51617A">全部论文 arXiv 官方摘要核验，时窗 2026-06-01 → 08-23 · 每页都有图形化解释与生活化类比</text>
</svg>