<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">MRAgent：从"取档案"到"写专题报告"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ICML 2026 · 图解"记忆是重构不是检索" · 附 MemEvolve 一句话版</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V386 A12,12 0 0 1 620,398 H72 A12,12 0 0 1 60,386 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#8494AB">老范式：检索（取档案）</text>
    <path fill="#EEF2F8" d="M92,168 H600 A8,8 0 0 1 608,176 V290 A8,8 0 0 1 600,298 H92 A8,8 0 0 1 84,290 V176 A8,8 0 0 1 92,168 Z" />
    <g font-size="12.5" fill="#1A2433">
      <path fill="#FFFFFF" stroke="#D8E0EC" d="M106,184 H214 A6,6 0 0 1 220,190 V218 A6,6 0 0 1 214,224 H106 A6,6 0 0 1 100,218 V190 A6,6 0 0 1 106,184 Z" />
      <text x="160" y="209" text-anchor="middle">档案 A：原始记录</text>
      <path fill="#FFFFFF" stroke="#D8E0EC" d="M106,236 H214 A6,6 0 0 1 220,242 V270 A6,6 0 0 1 214,276 H106 A6,6 0 0 1 100,270 V242 A6,6 0 0 1 106,236 Z" />
      <text x="160" y="261" text-anchor="middle">档案 B：原始记录</text>
      <text x="260" y="215" fill="#51617A">问题来了 → 按相似度</text>
      <text x="260" y="240" fill="#51617A">把 A、B 原样搬进上下文</text>
      <text x="400" y="215" fill="#C0392B">→ 搬来的可能：</text>
      <text x="400" y="240" fill="#C0392B">过时的、矛盾的、</text>
      <text x="400" y="265" fill="#C0392B">和本题无关的</text>
    </g>
    <text x="84" y="332" font-size="13.5" fill="#51617A">像调卷宗：把两年前的底稿原样扔桌上，</text>
    <text x="84" y="358" font-size="13.5" fill="#51617A">"是不是最新版本？相关吗？"——机器自己看着办</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V386 A12,12 0 0 1 1208,398 H664 A12,12 0 0 1 652,386 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#6D4FC2">新范式：重构（写专题报告）</text>
    <path fill="#FFFFFF" d="M684,168 H1188 A8,8 0 0 1 1196,176 V290 A8,8 0 0 1 1188,298 H684 A8,8 0 0 1 676,290 V176 A8,8 0 0 1 684,168 Z" />
    <g font-size="12.5" fill="#1A2433">
      
      <circle cx="730" cy="215" r="18" fill="#EFEBF8" stroke="#6D4FC2" />
      <text x="730" y="219" text-anchor="middle" font-size="10.5" fill="#6D4FC2">供应商</text>
      <circle cx="810" cy="180" r="18" fill="#EFEBF8" stroke="#6D4FC2" />
      <text x="810" y="184" text-anchor="middle" font-size="10.5" fill="#6D4FC2">合同</text>
      <circle cx="810" cy="250" r="18" fill="#EFEBF8" stroke="#6D4FC2" />
      <text x="810" y="254" text-anchor="middle" font-size="10.5" fill="#6D4FC2">付款</text>
      <line x1="744" y1="205" x2="794" y2="186" stroke="#6D4FC2" stroke-width="1.5" />
      <line x1="744" y1="225" x2="794" y2="244" stroke="#6D4FC2" stroke-width="1.5" />
      <text x="770" y="184" font-size="9.5" fill="#8494AB">2025签</text>
      <text x="770" y="248" font-size="9.5" fill="#8494AB">2026付</text>
      <text x="870" y="200" fill="#1A2433">→ 遍历图，挑出相关链条</text>
      <text x="870" y="225" fill="#1A2433">→ <tspan font-weight="bold" fill="#6D4FC2">现场组装</tspan>一份"当前问题专属"</text>
      <text x="870" y="250" fill="#1A2433">   的简报（矛盾已裁决、</text>
      <text x="870" y="272" fill="#1A2433">   过时项已标注）</text>
    </g>
    <text x="676" y="332" font-size="13.5" fill="#1A2433">像老审计员：不搬原始底稿，而是翻完所有资料后</text>
    <text x="676" y="358" font-size="13.5" fill="#1A2433"><tspan font-weight="bold" fill="#6D4FC2">写一页针对本题的分析简报</tspan>给你</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,420 H748 A12,12 0 0 1 760,432 V640 A12,12 0 0 1 748,652 H72 A12,12 0 0 1 60,640 V432 A12,12 0 0 1 72,420 Z" />
    <text x="84" y="452" font-size="15" font-weight="bold" fill="#1E8E3E">在哪见效（大白话）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="486">① <tspan font-weight="bold">信息打架时</tspan>：图上每条边带时间戳，"2026 年的新说法"自动压过"2025 年的旧说法"</text>
      <text x="84" y="516">② <tspan font-weight="bold">一环扣一环的追溯</tspan>：合同→付款→报销，链条完整还原，不会断片</text>
      <text x="84" y="546">③ 实测：在 LoCoMo / LongMemEval 两个记忆基准上<tspan font-weight="bold" fill="#1E8E3E">成绩提升</tspan>，</text>
      <text x="104" y="572">且提升最大的恰是"矛盾信息多 + 依赖链长"的难题</text>
      <text x="84" y="608" font-size="13" fill="#C0392B">代价：维护这张图要额外算力——简单任务用不上，杀鸡别用牛刀</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3" d="M792,420 H1208 A12,12 0 0 1 1220,432 V640 A12,12 0 0 1 1208,652 H792 A12,12 0 0 1 780,640 V432 A12,12 0 0 1 792,420 Z" />
    <text x="804" y="452" font-size="15" font-weight="bold" fill="#0B6E99">MemEvolve：连"整理方法"本身也在进化</text>
    <text x="804" y="486" font-size="13.5" fill="#1A2433">现在的记忆系统是人设计好就固定了；</text>
    <text x="804" y="512" font-size="13.5" fill="#1A2433">MemEvolve 用"元学习"让系统自己调：</text>
    <text x="804" y="542" font-size="13.5" fill="#1A2433">· 哪些该记（内容）——自己改</text>
    <text x="804" y="568" font-size="13.5" fill="#1A2433">· 怎么记怎么取（架构）——也自己改</text>
    <text x="804" y="604" font-size="13.5" fill="#0B6E99" font-weight="bold">档案室自己学会怎么当档案室</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：mem0.ai ICML 2026 盘点 · MRAgent / MemEvolve 均为 ICML 2026 poster · 哲学源头：Bartlett 1932"回忆是建构性重构"</text>
</svg>