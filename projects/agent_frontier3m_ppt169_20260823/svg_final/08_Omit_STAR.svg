<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">Agent-Omit 与 STAR：两个"省钱省心"的研究</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ICML 2026 · HKUST / arXiv 2602.04284 + 2603.21972 · 白话图解</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V406 A12,12 0 0 1 620,418 H72 A12,12 0 0 1 60,406 V130 A12,12 0 0 1 72,118 Z" />
    <rect x="60" y="118" width="572" height="4" fill="#0B6E99" />
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#0B6E99">Agent-Omit：教 agent"别记流水账"</text>
    
    <path fill="#FBECEA" d="M92,170 H600 A8,8 0 0 1 608,178 V248 A8,8 0 0 1 600,256 H92 A8,8 0 0 1 84,248 V178 A8,8 0 0 1 92,170 Z" />
    <text x="100" y="196" font-size="13" fill="#1A2433">改前（啰嗦模式）：思考"我先搜一下…" + 工具吐回 2000 字原始网页</text>
    <text x="100" y="220" font-size="13" fill="#1A2433">→ 全都留在记录里，越攒越厚，<tspan font-weight="bold" fill="#C0392B">挤爆上下文、稀释注意力</tspan></text>
    <text x="100" y="244" font-size="12.5" fill="#51617A">（就像工作底稿把每次打印的废页也全订进去了）</text>
    <path fill="#EAF5EE" d="M92,268 H600 A8,8 0 0 1 608,276 V346 A8,8 0 0 1 600,354 H92 A8,8 0 0 1 84,346 V276 A8,8 0 0 1 92,268 Z" />
    <text x="100" y="294" font-size="13" fill="#1A2433">改后（省略模式）：无关的观察丢掉、无效的思考不留，</text>
    <text x="100" y="318" font-size="13" fill="#1A2433">只留关键结论 <tspan font-weight="bold" fill="#1E8E3E">→ 记录薄、注意力集中、干活快</tspan></text>
    <text x="100" y="342" font-size="12.5" fill="#51617A">（底稿只订关键件）</text>
    <text x="84" y="384" font-size="13.5" fill="#1A2433">方法：先用少量示范数据教会"什么该省"，再用 RL 奖励</text>
    <text x="84" y="408" font-size="13.5" fill="#1A2433">"该省就省"的行为——<tspan font-weight="bold">省略本身成了可训练的能力</tspan></text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M664,118 H1208 A12,12 0 0 1 1220,130 V406 A12,12 0 0 1 1208,418 H664 A12,12 0 0 1 652,406 V130 A12,12 0 0 1 664,118 Z" />
    <rect x="652" y="118" width="568" height="4" fill="#6D4FC2" />
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#6D4FC2">STAR：训练配方的"对照实验"</text>
    <text x="676" y="184" font-size="13.5" fill="#1A2433">以前训 agent 全凭手感（玄学），STAR 用一个旅行规划</text>
    <text x="676" y="210" font-size="13.5" fill="#1A2433">测试床做了系统实验，把 5 个设计变量挨个测了一遍：</text>
    <g font-size="13">
      <path fill="#EFEBF8" d="M682,228 H925 A6,6 0 0 1 931,234 V262 A6,6 0 0 1 925,268 H682 A6,6 0 0 1 676,262 V234 A6,6 0 0 1 682,228 Z" />
      <text x="692" y="254" fill="#1A2433">① 奖励怎么给（粗/细）</text>
      <path fill="#EFEBF8" d="M951,228 H1194 A6,6 0 0 1 1200,234 V262 A6,6 0 0 1 1194,268 H951 A6,6 0 0 1 945,262 V234 A6,6 0 0 1 951,228 Z" />
      <text x="961" y="254" fill="#1A2433">② 模型多大合适</text>
      <path fill="#EFEBF8" d="M682,276 H925 A6,6 0 0 1 931,282 V310 A6,6 0 0 1 925,316 H682 A6,6 0 0 1 676,310 V282 A6,6 0 0 1 682,276 Z" />
      <text x="692" y="302" fill="#1A2433">③ 训练数据怎么配比</text>
      <path fill="#EFEBF8" d="M951,276 H1194 A6,6 0 0 1 1200,282 V310 A6,6 0 0 1 1194,316 H951 A6,6 0 0 1 945,310 V282 A6,6 0 0 1 951,276 Z" />
      <text x="961" y="302" fill="#1A2433">④ 用哪个算法</text>
      <path fill="#EFEBF8" d="M682,324 H925 A6,6 0 0 1 931,330 V358 A6,6 0 0 1 925,364 H682 A6,6 0 0 1 676,358 V330 A6,6 0 0 1 682,324 Z" />
      <text x="692" y="350" fill="#1A2433">⑤ 环境稳不稳定</text>
      <path fill="#FBF3E4" d="M951,324 H1194 A6,6 0 0 1 1200,330 V358 A6,6 0 0 1 1194,364 H951 A6,6 0 0 1 945,358 V330 A6,6 0 0 1 951,324 Z" />
      <text x="961" y="350" fill="#C77800" font-weight="bold">= 训练配方手册</text>
    </g>
    <text x="676" y="394" font-size="13.5" fill="#1A2433">核心发现：<tspan font-weight="bold" fill="#6D4FC2">小模型要"先易后难"的课程式奖励，大模型直接上稀疏奖励也行</tspan></text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3" d="M72,442 H1208 A12,12 0 0 1 1220,454 V636 A12,12 0 0 1 1208,648 H72 A12,12 0 0 1 60,636 V454 A12,12 0 0 1 72,442 Z" />
    <text x="84" y="474" font-size="16" font-weight="bold" fill="#0B6E99">合读的意义：从"能训"到"会训"</text>
    <text x="84" y="508" font-size="14.5" fill="#1A2433">2025 年大家问："agent 能不能用 RL 训？"（能不能）</text>
    <text x="84" y="538" font-size="14.5" fill="#1A2433">2026 年中大家问："到底怎么训才对？"（怎么训）——STAR 给配方地图，Agent-Omit 加新维度（省略也是能力），</text>
    <text x="84" y="568" font-size="14.5" fill="#1A2433">HPO/MileGPO 解决"反馈信号从哪来"——四篇拼起来就是训练侧的完整拼图。</text>
    <text x="84" y="612" font-size="14" fill="#C77800" font-weight="bold">给做研究的人指路：过程信号的"来源、粒度、可信度"是当下最有论文空间的三件事</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">Agent-Omit: github.com/usail-hkust/Agent-Omit（ICML 2026）· STAR: arXiv 2603.21972 · 测试床 TravelPlanner 为多约束旅行规划任务</text>
</svg>