<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">基准是什么？为什么要"重置"？</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">预备知识 + OSWorld 2.0 / Gaia2 / DeepSWE 三件套 · 用"考试改革"讲明白</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H1208 A12,12 0 0 1 1220,130 V226 A12,12 0 0 1 1208,238 H72 A12,12 0 0 1 60,226 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">基准（Benchmark）= 一套标准化考卷</text>
    <text x="84" y="180" font-size="13.5" fill="#1A2433">所有人都做同一套题、同一把评分尺 → 分数可比、进步可测。agent 领域的著名考卷：SWE-bench（修 GitHub 真实 bug）、</text>
    <text x="84" y="206" font-size="13.5" fill="#1A2433">Terminal-Bench（命令行里干活）、OSWorld（在真实电脑上点鼠标敲键盘完成任务）、GAIA（通用助理任务）。</text>
    <text x="84" y="230" font-size="13.5" fill="#C0392B" font-weight="bold">问题：考卷会被"刷穿"——分数逼近满分时，考卷就失去了区分度，必须出新卷</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,260 H748 A12,12 0 0 1 760,272 V508 A12,12 0 0 1 748,520 H72 A12,12 0 0 1 60,508 V272 A12,12 0 0 1 72,260 Z" />
    <rect x="60" y="260" width="700" height="4" fill="#C0392B" />
    <text x="84" y="292" font-size="15" font-weight="bold" fill="#C0392B">OSWorld 2.0：从"小测验"到"全天工作"</text>
    
    <path fill="#EEF2F8" d="M92,310 H376 A8,8 0 0 1 384,318 V412 A8,8 0 0 1 376,420 H92 A8,8 0 0 1 84,412 V318 A8,8 0 0 1 92,310 Z" />
    <text x="100" y="338" font-size="13.5" font-weight="bold" fill="#51617A">1.0 时代（369 个短任务）</text>
    <text x="100" y="364" font-size="13" fill="#51617A">例：在 LibreOffice 里改表格格式</text>
    <text x="100" y="388" font-size="13" fill="#51617A">约 30 步 · 几分钟搞定</text>
    <text x="100" y="410" font-size="13" fill="#1E8E3E" font-weight="bold">最高分已刷到 85%</text>
    <path fill="#FBECEA" d="M418,310 H728 A8,8 0 0 1 736,318 V412 A8,8 0 0 1 728,420 H418 A8,8 0 0 1 410,412 V318 A8,8 0 0 1 418,310 Z" />
    <text x="426" y="338" font-size="13.5" font-weight="bold" fill="#C0392B">2.0 时代（108 个长流程）</text>
    <text x="426" y="364" font-size="13" fill="#1A2433">例：跨 5 个应用整理差旅报销：</text>
    <text x="426" y="388" font-size="13" fill="#1A2433">邮件取票据→核对政策→填单→提交</text>
    <text x="426" y="410" font-size="13" fill="#1A2433">人类中位 1.6 小时 · 平均 318 步</text>
    <text x="84" y="462" font-size="13.5" fill="#1A2433">新增考验：界面边用边变（流式）、环境自己会动（动态）、</text>
    <text x="84" y="488" font-size="13.5" fill="#1A2433">跨应用搬信息、还要和别的 agent 打配合</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M792,260 H1208 A12,12 0 0 1 1220,272 V508 A12,12 0 0 1 1208,520 H792 A12,12 0 0 1 780,508 V272 A12,12 0 0 1 792,260 Z" />
    <rect x="780" y="260" width="440" height="4" fill="#6D4FC2" />
    <text x="804" y="292" font-size="15" font-weight="bold" fill="#6D4FC2">Gaia2：会"自己动"的考场</text>
    <text x="804" y="324" font-size="13.5" fill="#1A2433">以前的考卷是死的：题目等着你做。</text>
    <text x="804" y="350" font-size="13.5" fill="#1A2433">Gaia2 的考场是活的：</text>
    <text x="804" y="380" font-size="13.5" fill="#1A2433">· 你查航班时，航班<tspan font-weight="bold">真的会取消</tspan></text>
    <text x="804" y="406" font-size="13.5" fill="#1A2433">· 同事 agent 会发消息催你</text>
    <text x="804" y="432" font-size="13.5" fill="#1A2433">· 有的信息故意给得含糊</text>
    <text x="804" y="462" font-size="13.5" fill="#1E8E3E" font-weight="bold">妙笔：每个动作可机判对错 →</text>
    <text x="804" y="488" font-size="13.5" fill="#1E8E3E">考卷本身直接当训练场（RLVR）</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M72,540 H1208 A12,12 0 0 1 1220,552 V636 A12,12 0 0 1 1208,648 H72 A12,12 0 0 1 60,636 V552 A12,12 0 0 1 72,540 Z" />
    <text x="84" y="572" font-size="15" font-weight="bold" fill="#C77800">三件套合起来读：难度重置的三板斧</text>
    <text x="84" y="602" font-size="14" fill="#1A2433">OSWorld 2.0 把任务<tspan font-weight="bold">拉长</tspan>（30 步 → 318 步）· Gaia2 把环境<tspan font-weight="bold">搞活</tspan>（静止 → 动态）· DeepSWE 把交付<tspan font-weight="bold">加码</tspan>（读懂 → 写出 5.5 倍代码）</text>
    <text x="84" y="630" font-size="14" fill="#1A2433">→ 三者都在测同一件事：<tspan font-weight="bold" fill="#C0392B">Horizon Gap 补上没有</tspan>。旧分数作废，一切重新开始——这就是"基准重置"</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">摘要直抓 arxiv.org/abs/2606.29537（OSWorld 2.0）与 2602.11964（Gaia2）· DeepSWE: deepswe.datacurve.ai</text>
</svg>