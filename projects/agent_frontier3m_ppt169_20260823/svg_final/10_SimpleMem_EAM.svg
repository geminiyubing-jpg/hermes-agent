<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">SimpleMem：像"档案室"一样整理记忆</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">ICML 2026 · 流程图解：从"什么都存"到"按需取摘要"</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V376 A12,12 0 0 1 620,388 H72 A12,12 0 0 1 60,376 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#8494AB">老办法：全文检索（像把底稿全堆桌上）</text>
    <path fill="#EEF2F8" d="M92,168 H600 A8,8 0 0 1 608,176 V280 A8,8 0 0 1 600,288 H92 A8,8 0 0 1 84,280 V176 A8,8 0 0 1 92,168 Z" />
    <g font-size="12.5" fill="#1A2433">
      <text x="100" y="196">历史对话原文 · 10 万 token</text>
      <text x="100" y="222">用户：帮我订机票……（+3000 行原文）</text>
      <text x="100" y="248">用户：上次那个预算……（+5000 行原文）</text>
      <text x="100" y="274">→ 每次提问都要在这堆里搜相似段落，塞进上下文</text>
    </g>
    <text x="84" y="322" font-size="13.5" fill="#C0392B">痛点：① token 烧钱（每次都带原文）② 搜出来的未必相关</text>
    <text x="84" y="352" font-size="13.5" fill="#C0392B">③ 越用越贵——历史越长，每次带得越多</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V376 A12,12 0 0 1 1208,388 H664 A12,12 0 0 1 652,376 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#1E8E3E">SimpleMem：压缩 + 按意图归档</text>
    
    <path fill="#FFFFFF" d="M684,168 H1188 A8,8 0 0 1 1196,176 V310 A8,8 0 0 1 1188,318 H684 A8,8 0 0 1 676,310 V176 A8,8 0 0 1 684,168 Z" />
    <g font-size="12.5">
      <path fill="#EEF2F8" d="M698,184 H826 A6,6 0 0 1 832,190 V234 A6,6 0 0 1 826,240 H698 A6,6 0 0 1 692,234 V190 A6,6 0 0 1 698,184 Z" />
      <text x="762" y="208" text-anchor="middle" fill="#1A2433">① 相似片段聚类</text>
      <text x="762" y="228" text-anchor="middle" fill="#51617A">"订机票"相关归一档</text>
      <path d="M 832 212 L 862 212" stroke="#1E8E3E" stroke-width="2" marker-end="url(#sm1)" />
      <path fill="#EEF2F8" d="M870,184 H1008 A6,6 0 0 1 1014,190 V234 A6,6 0 0 1 1008,240 H870 A6,6 0 0 1 864,234 V190 A6,6 0 0 1 870,184 Z" />
      <text x="939" y="208" text-anchor="middle" fill="#1A2433">② 小模型写摘要</text>
      <text x="939" y="228" text-anchor="middle" fill="#51617A">每档一段话代替全文</text>
      <path d="M 1014 212 L 1044 212" stroke="#1E8E3E" stroke-width="2" marker-end="url(#sm1)" />
      <path fill="#EEF2F8" d="M1052,184 H1174 A6,6 0 0 1 1180,190 V234 A6,6 0 0 1 1174,240 H1052 A6,6 0 0 1 1046,234 V190 A6,6 0 0 1 1052,184 Z" />
      <text x="1113" y="208" text-anchor="middle" fill="#1A2433">③ 贴意图标签</text>
      <text x="1113" y="228" text-anchor="middle" fill="#51617A">"差旅类""预算类"</text>
      <defs>
        <marker id="sm1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1E8E3E" />
        </marker>
      </defs>
      <text x="692" y="278" fill="#1A2433">④ 用时：先判断"这次问题属于哪类"→ 只调那一两段摘要</text>
      <text x="692" y="302" fill="#51617A">（不再全文搜索，token 用量断崖式下降）</text>
    </g>
    <text x="676" y="348" font-size="14" fill="#1E8E3E" font-weight="bold">结果：答案更准（F1 反超）+ 成本大降 + 不用买任何特殊硬件</text>
    <text x="676" y="374" font-size="13" fill="#C0392B">仍没解决：时间先后关系（"上周改的主意"会覆盖错）</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,412 H1208 A12,12 0 0 1 1220,424 V640 A12,12 0 0 1 1208,652 H72 A12,12 0 0 1 60,640 V424 A12,12 0 0 1 72,412 Z" />
    <text x="84" y="446" font-size="15" font-weight="bold" fill="#0B6E99">同门 EAM：把 GUI 操作画成"关系图"（一句话版）</text>
    <text x="84" y="478" font-size="14" fill="#1A2433">GUI agent（操作电脑界面的 agent）的记忆难题：操作记录是流水账，翻起来没完。EAM 的做法：把"窗口、按钮、输入、</text>
    <text x="84" y="506" font-size="14" fill="#1A2433">状态变化"画成一张图——节点是界面元素，箭头是"点了 A 弹出 B"。下次遇到类似表单，直接查图上成功路径，不再翻流水账。</text>
    <line x1="84" y1="530" x2="1196" y2="530" stroke="#E4EAF3" />
    <text x="84" y="562" font-size="15" font-weight="bold" fill="#C77800">两篇合起来的人生道理</text>
    <text x="84" y="592" font-size="14" fill="#1A2433">"记忆是整理出来的，不是攒出来的"——聚类归档（SimpleMem）和画关系图（EAM）都证明：</text>
    <text x="84" y="620" font-size="14" fill="#1A2433">花小力气先整理，检索时就能又快又准又省钱。<tspan font-weight="bold" fill="#1E8E3E">"记得多"不如"理得清"。</tspan></text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：mem0.ai ICML 2026 盘点（8-12）全文解析 · SimpleMem / EAM 均为 ICML 2026 poster</text>
</svg>