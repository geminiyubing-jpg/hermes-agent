<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">预备知识 ②：训练一个 Agent 靠什么？</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">强化学习（RL）速成：从"考试只给总分"讲起 · 这是 HPO/MileGPO 两篇的地基</text>
  </g>

  <!-- outcome vs process -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#C0392B">Outcome RL（只看总分）——目前的通行做法</text>
    <!-- exam analogy -->
    <rect x="84" y="168" width="524" height="90" rx="8" fill="#FBECEA"/>
    <text x="100" y="196" font-size="13.5" fill="#1A2433">类比：学生做一张 300 题的卷子，老师<tspan font-weight="bold" fill="#C0392B">只在最后打一个总分</tspan></text>
    <text x="100" y="220" font-size="13.5" fill="#1A2433">卷面：第 41 题做对了 ✓ → 第 42 题思路歪了 ✗ → 第 43 题蒙对了 ✓ → …</text>
    <text x="100" y="244" font-size="13.5" fill="#51617A">总分 62 分。请问：是哪几题的方法要改？——<tspan font-weight="bold">不知道</tspan></text>
    <text x="84" y="292" font-size="13.5" fill="#1A2433">映射到 agent：跑完 300 步任务，只收到"成功/失败"一个 bit，</text>
    <text x="84" y="318" font-size="13.5" fill="#1A2433">哪步好哪步坏全靠猜——这就是<tspan font-weight="bold" fill="#C0392B">"信用分配难题"</tspan></text>
    <text x="84" y="362" font-size="13" fill="#51617A">（credit assignment：功劳/责任在 300 步之间怎么分摊）</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="280" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#1E8E3E">过程信号（每步都给反馈）——本季度的攻关方向</text>
    <rect x="676" y="168" width="520" height="90" rx="8" fill="#FFFFFF"/>
    <text x="692" y="196" font-size="13.5" fill="#1A2433">同样的卷子，老师<tspan font-weight="bold" fill="#1E8E3E">逐题批改</tspan>：第 41 题方法对 ✓、</text>
    <text x="692" y="220" font-size="13.5" fill="#1A2433">第 42 题第二步符号错了 ✗、第 43 题是蒙的（记为不可靠）……</text>
    <text x="692" y="244" font-size="13.5" fill="#51617A">学生立刻知道每题该怎么改——进步快得多</text>
    <text x="676" y="292" font-size="13.5" fill="#1A2433">三种"逐题批改"的流派（对应三篇论文）：</text>
    <text x="676" y="318" font-size="13.5" fill="#1A2433">· <tspan font-weight="bold" fill="#0B6E99">HPO</tspan>：事后重读整张卷子，推断"每题当时想干嘛"</text>
    <text x="676" y="344" font-size="13.5" fill="#1A2433">· <tspan font-weight="bold" fill="#C77800">MileGPO</tspan>：标出关键里程碑（得分点）和陷阱（丢分点）</text>
    <text x="676" y="370" font-size="13.5" fill="#1A2433">· PRM（过程奖励模型）：训一个"助教"逐题打分</text>
  </g>

  <!-- GRPO quick card -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="424" width="572" height="224" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="456" font-size="15" font-weight="bold" fill="#6D4FC2">顺带认识 GRPO（论文里反复出现的词）</text>
    <text x="84" y="488" font-size="13.5" fill="#1A2433">DeepSeek 发明的训练法：同一道题让模型做 N 遍（比如 16 遍），</text>
    <text x="84" y="514" font-size="13.5" fill="#1A2433">拿<tspan font-weight="bold">组内平均分当基准</tspan>：高于平均 → 加强这条路子；</text>
    <text x="84" y="540" font-size="13.5" fill="#1A2433">低于平均 → 抑制。省掉了训练"裁判模型"的成本。</text>
    <text x="84" y="586" font-size="13" fill="#51617A">类比：同题 16 份答卷互相对照打分，不需要标准答案细则。</text>
    <text x="84" y="612" font-size="13" fill="#51617A">2025 年起成了 agent 训练的主流底座（R1 同款）。</text>
  </g>

  <!-- why long horizon hard -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="424" width="568" height="224" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4"/>
    <text x="676" y="456" font-size="15" font-weight="bold" fill="#C77800">为什么"任务越长越难训"？</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="490">① 好坏动作混在一起：300 步里 240 步正确 60 步错误，</text>
      <text x="696" y="514">总分一样 = 训练完全无法区分它们</text>
      <text x="676" y="548">② 早期决定影响深远：第 3 步选错方向，第 250 步才暴露——</text>
      <text x="696" y="572">功劳该记在第 3 步头上，但总分看不到这么远</text>
      <text x="676" y="606" font-size="13.5" fill="#C0392B" font-weight="bold">→ 这就是 HPO/MileGPO 要治的病</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">预备知识页 · 听懂"总分 vs 逐题批改"，后面两篇训练论文就是具体怎么造"逐题批改"</text>
</svg>
