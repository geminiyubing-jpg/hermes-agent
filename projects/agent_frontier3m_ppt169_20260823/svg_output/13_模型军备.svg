<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">模型侧：三件大事，一张榜单</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Kimi K3 / GPT-5.6 / OX Alpha · 先扫盲"参数量"和"开源权重"两个词</text>
  </g>

  <!-- jargon buster -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="110" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="148" font-size="15" font-weight="bold" fill="#0B6E99">先扫两个盲（10 秒版）</text>
    <text x="84" y="178" font-size="13.5" fill="#1A2433"><tspan font-weight="bold">参数量</tspan>：模型的"脑容量"。2.8T = 2.8 万亿个可调数字——越大通常越聪明但也越贵越慢（27.8B = 278 亿，小 100 倍）</text>
    <text x="84" y="204" font-size="13.5" fill="#1A2433"><tspan font-weight="bold">开源权重</tspan>：把"大脑的结构文件"公开下载。闭源（GPT）= 只能云上调用；开源 = 可以自己部署、自己微调、数据不出门（银行最关心这点）</text>
  </g>

  <!-- three events -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="248" width="380" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="248" width="380" height="4" fill="#6D4FC2"/>
    <text x="84" y="280" font-size="15" font-weight="bold" fill="#6D4FC2">Kimi K3（月之暗面 · 7-14）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="312">· 2.8T 参数，<tspan font-weight="bold">首个 3T 级开源</tspan></text>
      <text x="84" y="340">· 1M 上下文 + 原生看图</text>
      <text x="84" y="368">· "思考"永远开着（可调档位）</text>
      <text x="84" y="396">· 价格：$2.6/百万字输入</text>
      <text x="84" y="430" font-size="13" fill="#1E8E3E" font-weight="bold">意义：开源阵营第一次在"长任务"</text>
      <text x="84" y="454" font-size="13" fill="#1E8E3E" font-weight="bold">档位摆出旗舰武器</text>
    </g>

    <rect x="460" y="248" width="380" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="460" y="248" width="380" height="4" fill="#C0392B"/>
    <text x="484" y="280" font-size="15" font-weight="bold" fill="#C0392B">GPT-5.6 三兄弟（OpenAI · 7 月）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="484" y="312">· Sol（旗舰）/ Terra / Luna（轻快）</text>
      <text x="484" y="340">· Sol 在 Terminal-Bench 2.1 打出</text>
      <text x="484" y="366" text-anchor="start"><tspan font-family="'SF Mono',monospace" font-weight="bold" fill="#C0392B">88.8%</tspan>（第三方实测）</text>
      <text x="484" y="396">· 配新一代推理芯片，速度快一截</text>
      <text x="484" y="430" font-size="13" fill="#51617A">闭源路线：能力顶格，但数据必须</text>
      <text x="484" y="454" font-size="13" fill="#51617A">过 OpenAI 的云</text>
    </g>

    <rect x="860" y="248" width="360" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="860" y="248" width="360" height="4" fill="#1E8E3E"/>
    <text x="884" y="280" font-size="15" font-weight="bold" fill="#1E8E3E">OX Alpha（8-22 披露）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="884" y="312">· 神秘模型（身份未官宣）</text>
      <text x="884" y="340">· 仅 <tspan font-family="'SF Mono',monospace" font-weight="bold">27.8B</tspan>（比 K3 小 100 倍）</text>
      <text x="884" y="368">· Terminal-Bench 打到 <tspan font-family="'SF Mono',monospace" font-weight="bold">73</tspan></text>
      <text x="884" y="400" font-size="13" fill="#C77800" font-weight="bold">信号：一年前这个分数需要几百 B</text>
      <text x="884" y="424" font-size="13" fill="#C77800" font-weight="bold">→ 小模型军团逼近大模型防线</text>
      <text x="884" y="454" font-size="13" fill="#51617A">（本地部署成本即将大降）</text>
    </g>
  </g>

  <!-- leaderboard explained -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="498" width="1160" height="150" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="528" font-size="15" font-weight="bold" fill="#0B6E99">Terminal-Bench 2.1 是什么？——"命令行里干真活"考试：给一个坏了的项目，让 agent 在终端里自己查、自己改、自己验</text>
    <g font-size="13.5">
      <text x="84" y="560" fill="#1A2433">GPT-5.6 Sol</text>
      <rect x="240" y="546" width="440" height="22" rx="4" fill="#C0392B" opacity="0.8"/>
      <text x="688" y="563" font-family="'SF Mono',monospace" font-weight="bold" fill="#C0392B">88.8%</text>
      <text x="84" y="592" fill="#1A2433">Ouroboros（自进化 harness + Opus 5）</text>
      <rect x="240" y="578" width="430" height="22" rx="4" fill="#C77800" opacity="0.8"/>
      <text x="678" y="595" font-family="'SF Mono',monospace" font-weight="bold" fill="#C77800">86.74%</text>
      <text x="84" y="624" fill="#1A2433">OX Alpha（27.8B 小个子）</text>
      <rect x="240" y="610" width="364" height="22" rx="4" fill="#1E8E3E" opacity="0.8"/>
      <text x="612" y="627" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">73.0</text>
      <text x="760" y="595" font-size="12.5" fill="#8494AB">（各官方披露口径，</text>
      <text x="760" y="615" font-size="12.5" fill="#8494AB">跨系统比较需谨慎）</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：kimi.com/blog/kimi-k3 · HF moonshotai/Kimi-K3 · OpenRouter · buildfastwithai 8-22 快讯 · BenchLM 2026-08</text>
</svg>
