<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFEFF"/>
      <stop offset="55%" stop-color="#F4F8FB"/>
      <stop offset="100%" stop-color="#EBF2F7"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B6E99"/>
      <stop offset="100%" stop-color="#6D4FC2"/>
    </linearGradient>
    <linearGradient id="bandFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B6E99" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6D4FC2" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- clean background, no grid -->
  <rect width="1280" height="720" fill="url(#bgWash)"/>

  <!-- soft side accent band (left edge) -->
  <rect x="0" y="0" width="14" height="720" fill="url(#bandFade)"/>

  <!-- subtle rising curve deco, low contrast -->
  <g>
    <path d="M 0 660 C 320 620 660 560 980 480 S 1280 380 1300 360"
          fill="none" stroke="#0B6E99" stroke-opacity="0.10" stroke-width="42"/>
    <path d="M 0 700 C 340 668 700 616 1020 540 S 1280 448 1300 428"
          fill="none" stroke="#6D4FC2" stroke-opacity="0.08" stroke-width="30"/>
  </g>

  <!-- top info strip: clean white card, no texture -->
  <rect x="60" y="40" width="1160" height="52" rx="10" fill="#FFFFFF" stroke="#D8E0EC"/>
  <g font-family="'SF Mono','Menlo',monospace" font-size="15">
    <text x="84" y="72" fill="#51617A">HorizonGap</text><text x="189" y="72" fill="#0B6E99" font-weight="bold">1547篇</text>
    <text x="282" y="72" fill="#51617A">Terminal-Bench</text><text x="416" y="72" fill="#C77800" font-weight="bold">88.8%</text>
    <text x="480" y="72" fill="#51617A">OSWorld2.0</text><text x="588" y="72" fill="#0B6E99" font-weight="bold">318 calls</text>
    <text x="700" y="72" fill="#51617A">Kimi K3</text><text x="778" y="72" fill="#6D4FC2" font-weight="bold">2.8T开源</text>
    <text x="868" y="72" fill="#51617A">ICML2026</text><text x="962" y="72" fill="#1E8E3E" font-weight="bold">23918投稿</text>
    <text x="1082" y="72" fill="#8494AB" font-size="12">arXiv 2026-06→08</text>
  </g>

  <text x="90" y="228" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#51617A" letter-spacing="5">AI AGENT FRONTIER · JUN—AUG 2026</text>
  <text x="86" y="298" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="bold" fill="#1A2433">AI Agent 前沿论文精读</text>
  <text x="86" y="360" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="bold" fill="url(#titleGlow)">近三个月最重要的方向性研究</text>

  <rect x="90" y="400" width="5" height="60" fill="#C77800"/>
  <text x="114" y="428" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#1A2433">"The Horizon Gap" 之年：模型很强，Agent 仍会迷路</text>
  <text x="114" y="456" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#51617A">五大主线：长程任务 · 训练革命 · 记忆重构 · 基准重置 · 自我进化</text>

  <!-- source badges: clean outlined chips -->
  <g font-family="'SF Mono','Menlo',monospace" font-size="13">
    <rect x="90" y="630" width="86" height="30" rx="15" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="102" y="650" fill="#51617A">arXiv</text>
    <rect x="186" y="630" width="100" height="30" rx="15" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="196" y="650" fill="#51617A">ICML 2026</text>
    <rect x="296" y="630" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="308" y="650" fill="#51617A">HF / GitHub</text>
  </g>
  <text x="436" y="650" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8494AB">20+ 篇顶会级论文 · 官方 abstract 逐篇核验 · 采集 2026-08-23</text>

  <!-- bottom-right corner accent, clean geometric -->
  <path d="M 1280 720 L 1200 720 L 1280 640 Z" fill="#0B6E99" opacity="0.10"/>
  <path d="M 1280 720 L 1240 720 L 1280 680 Z" fill="#0B6E99" opacity="0.25"/>
</svg>
