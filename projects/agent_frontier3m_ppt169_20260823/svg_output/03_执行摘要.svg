<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">执行摘要：一个矛盾，五大主线</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">EXECUTIVE SUMMARY · 2026-06 → 08 季度全景</text>
  </g>

  <rect x="60" y="118" width="1160" height="110" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4"/>
  <text x="84" y="152" font-family="'PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#C0392B">季度核心矛盾</text>
  <text x="84" y="182" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#1A2433">前沿模型单次前向已能解"研究级"问题（GPQA/HLE 屡创新高），但放进 agent 循环跑多小时任务，</text>
  <text x="84" y="210" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#1A2433">仍会：丢失早期决策 · 半成品宣称完工 · 目标漂移。这个差距有了正式名字 —— <tspan fill="#C77800" font-weight="bold">The Horizon Gap</tspan>（arXiv 2608.06663）</text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="252" width="222" height="220" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="252" width="222" height="4" fill="#0B6E99"/>
    <text x="82" y="286" font-size="15" font-weight="bold" fill="#0B6E99">① 长程任务定调</text>
    <text x="82" y="316" font-size="13" fill="#1A2433">Horizon Gap 综述</text>
    <text x="82" y="338" font-size="13" fill="#1A2433">1547 篇系统梳理</text>
    <text x="82" y="372" font-size="12.5" fill="#51617A">把 planning/memory/</text>
    <text x="82" y="392" font-size="12.5" fill="#51617A">execution/training/</text>
    <text x="82" y="412" font-size="12.5" fill="#51617A">eval/safety 六维统一</text>
    <text x="82" y="448" font-size="12" fill="#8494AB">代表：2608.06663</text>

    <rect x="300" y="252" width="222" height="220" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="300" y="252" width="222" height="4" fill="#C77800"/>
    <text x="322" y="286" font-size="15" font-weight="bold" fill="#C77800">② 训练革命</text>
    <text x="322" y="316" font-size="13" fill="#1A2433">Outcome RL → 过程信号</text>
    <text x="322" y="338" font-size="13" fill="#1A2433">HPO / MileGPO / STAR</text>
    <text x="322" y="372" font-size="12.5" fill="#51617A">hindsight 分布对比、</text>
    <text x="322" y="392" font-size="12.5" fill="#51617A">里程碑信用分配、</text>
    <text x="322" y="412" font-size="12.5" fill="#51617A">5 轴配方科学化</text>
    <text x="322" y="448" font-size="12" fill="#8494AB">代表：2607.16257</text>

    <rect x="540" y="252" width="222" height="220" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="540" y="252" width="222" height="4" fill="#6D4FC2"/>
    <text x="562" y="286" font-size="15" font-weight="bold" fill="#6D4FC2">③ 记忆重构</text>
    <text x="562" y="316" font-size="13" fill="#1A2433">ICML 2026 五重奏</text>
    <text x="562" y="338" font-size="13" fill="#1A2433">MemoryArena 打脸</text>
    <text x="562" y="372" font-size="12.5" fill="#51617A">"记忆是重构不是</text>
    <text x="562" y="392" font-size="12.5" fill="#51617A">检索"；评测从回忆</text>
    <text x="562" y="412" font-size="12.5" fill="#51617A">转向跨会话决策</text>
    <text x="562" y="448" font-size="12" fill="#8494AB">代表：2602.16313</text>

    <rect x="780" y="252" width="222" height="220" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="780" y="252" width="222" height="4" fill="#C0392B"/>
    <text x="802" y="286" font-size="15" font-weight="bold" fill="#C0392B">④ 基准重置</text>
    <text x="802" y="316" font-size="13" fill="#1A2433">OSWorld 2.0 / Gaia2</text>
    <text x="802" y="338" font-size="13" fill="#1A2433">DeepSWE</text>
    <text x="802" y="372" font-size="12.5" fill="#51617A">1.6 小时/任务、318 次</text>
    <text x="802" y="392" font-size="12.5" fill="#51617A">工具调用、异步动态</text>
    <text x="802" y="412" font-size="12.5" fill="#51617A">环境——难度全面重置</text>
    <text x="802" y="448" font-size="12" fill="#8494AB">代表：2606.29537</text>

    <rect x="1020" y="252" width="200" height="220" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="1020" y="252" width="200" height="4" fill="#1E8E3E"/>
    <text x="1042" y="286" font-size="15" font-weight="bold" fill="#1E8E3E">⑤ 自我进化</text>
    <text x="1042" y="316" font-size="13" fill="#1A2433">Ouroboros 161 天</text>
    <text x="1042" y="338" font-size="13" fill="#1A2433">EvolveR / Skill-Pro</text>
    <text x="1042" y="372" font-size="12.5" fill="#51617A">经验→技能→运行时</text>
    <text x="1042" y="392" font-size="12.5" fill="#51617A">的闭环；安全边界</text>
    <text x="1042" y="412" font-size="12.5" fill="#51617A">成为新议题</text>
    <text x="1042" y="448" font-size="12" fill="#8494AB">代表：2608.08311</text>
  </g>

  <g font-family="'SF Mono','Menlo',monospace">
    <rect x="60" y="498" width="1160" height="140" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="532" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#0B6E99">季度数字速览</text>
    <text x="84" y="574" font-size="26" font-weight="bold" fill="#0B6E99">1547</text>
    <text x="84" y="598" font-size="12.5" fill="#51617A" font-family="'PingFang SC',sans-serif">Horizon Gap 综述论文数</text>
    <text x="320" y="574" font-size="26" font-weight="bold" fill="#C77800">86.74%</text>
    <text x="320" y="598" font-size="12.5" fill="#51617A" font-family="'PingFang SC',sans-serif">Ouroboros Terminal-Bench 2.1</text>
    <text x="620" y="574" font-size="26" font-weight="bold" fill="#C0392B">318</text>
    <text x="620" y="598" font-size="12.5" fill="#51617A" font-family="'PingFang SC',sans-serif">OSWorld 2.0 平均工具调用/任务</text>
    <text x="920" y="574" font-size="26" font-weight="bold" fill="#1E8E3E">2.8T</text>
    <text x="920" y="598" font-size="12.5" fill="#51617A" font-family="'PingFang SC',sans-serif">Kimi K3 开源参数量（7 月）</text>
    <text x="84" y="628" font-size="12" fill="#8494AB" font-family="'PingFang SC',sans-serif">同期背景：ICML 2026 收稿 23,918 篇创纪录 · Google PAT 审稿 1 万+ 篇 · 微软开源 ASSERT/ACS 治理框架</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">数据源：arXiv 官方 abstract（6 篇直抓核验）+ ICML 2026 论文列表 + mem0/HF/GitHub 交叉 · 采集 2026-08-23</text>
</svg>
