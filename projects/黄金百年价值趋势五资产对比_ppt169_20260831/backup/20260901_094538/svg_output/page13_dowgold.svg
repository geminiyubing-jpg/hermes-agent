<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">Dow/Gold 比率：一道钟摆了百年的裂隙</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">「多少盎司黄金买一股道指」——百年在 1.3 与 40+ 之间摆动五个来回</text>

  <!-- 比率曲线 -->
  <g>
    <g stroke="#E5DCC8" stroke-width="1">
      <line x1="100" y1="440" x2="1180" y2="440"/>
      <line x1="100" y1="370" x2="1180" y2="370" stroke-dasharray="4,4"/>
      <line x1="100" y1="300" x2="1180" y2="300" stroke-dasharray="4,4"/>
      <line x1="100" y1="230" x2="1180" y2="230" stroke-dasharray="4,4"/>
      <line x1="100" y1="160" x2="1180" y2="160" stroke-dasharray="4,4"/>
      <line x1="100" y1="125" x2="1180" y2="125" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9184" text-anchor="end">
      <text x="94" y="444">0</text><text x="94" y="374">5</text><text x="94" y="304">10</text>
      <text x="94" y="234">20</text><text x="94" y="164">30</text><text x="94" y="129">40</text>
    </g>
    <!-- 曲线: 1920~12(371) 1929~18(371) 1933低1.94 1966~28 1980低1.29 1999高~42 2011低~6 2018~22 2021~20 2026~10 -->
    <polyline points="120,265 220,225 300,435 380,390 460,245 540,180 580,438 640,320 720,150 800,250 900,345 960,290 1000,285 1080,235 1140,300 1180,308" fill="none" stroke="#8A6D1F" stroke-width="3.5"/>
    <g font-family="'PingFang SC', sans-serif" font-size="11.5">
      <circle cx="300" cy="435" r="5" fill="#B3541E"/>
      <text x="260" y="464" fill="#B3541E">1933 低点 1.94</text>
      <circle cx="580" cy="438" r="6" fill="#B3541E"/>
      <text x="545" y="468" fill="#B3541E" font-weight="700">1980.1 低点 1.29 ★</text>
      <circle cx="720" cy="150" r="6" fill="#277653"/>
      <text x="680" y="140" fill="#277653" font-weight="700">1999 高点 ~40+</text>
      <circle cx="900" cy="345" r="5" fill="#8A6D1F"/>
      <text x="872" y="330" fill="#8A6D1F">2011 低点 ~6</text>
      <circle cx="1180" cy="308" r="5" fill="#B3541E"/>
      <text x="1088" y="290" fill="#B3541E">2026 ~10（估算）</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9184" text-anchor="middle">
      <text x="120" y="460">1920</text><text x="300" y="460">1933</text><text x="580" y="460">1980</text>
      <text x="720" y="460">1999</text><text x="900" y="460">2011</text><text x="1080" y="460">2020</text><text x="1180" y="460">26</text>
    </g>
    <text x="640" y="488" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">比率低=黄金贵（股票相对便宜）；比率高=黄金便宜（股票相对贵）——极端处即风格切换的路口</text>
  </g>

  <!-- 解读卡 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="506" width="572" height="120" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="88" y="538" font-size="14.5" font-weight="700" fill="#8A6D1F">钟摆的两次极致</text>
    <text x="88" y="566" font-size="12.5" fill="#2B2620">· 1980.1：1 盎司金 ≈ 1.3 股道指——滞胀末日感+金狂热顶点</text>
    <text x="88" y="590" font-size="12.5" fill="#2B2620">· 1999：1 股道指 ≈ 42 盎司金——互联网无限信念+黄金被斥为 relic</text>
    <text x="88" y="614" font-size="12.5" fill="#6E655A">　 两个极端后 20 年，输家都变成了赢家</text>

    <rect x="648" y="506" width="572" height="120" rx="12" fill="#2B2620"/>
    <text x="676" y="538" font-size="14.5" font-weight="700" fill="#F0C98A">2026 的钟摆位置（估算）</text>
    <text x="676" y="566" font-size="12.5" fill="#F5F0E4">· 道指 ~45,000 / 金 ~$4,450 ≈ 比率 10：从 1999 高点回落 75%</text>
    <text x="676" y="590" font-size="12.5" fill="#F5F0E4">· 仍高于 1980/1933 的极端低位（1.3-1.9）——钟摆偏金但未到极值</text>
    <text x="676" y="614" font-size="12.5" fill="#F0C98A" font-weight="600">历史提示：比率 &lt;5 的年代买入股票、&gt;30 的年代买入黄金，都是十年级别的大机会</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：Macrotrends Dow/Gold百年图(B+)·极值点为官方历史数据·2026为估算(C)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">13 / 19</text>
</svg>
