<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F7931A"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">比特币五轮周期：波动的代价表</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">每轮「减半-牛市-崩盘」的完整账本——收益递减，但底逐轮抬升</text>

  <!-- 周期表 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="108" width="1160" height="36" fill="#2B2620"/>
    <text x="170" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">周期</text>
    <text x="360" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F7931A">峰值</text>
    <text x="600" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#277653">谷值</text>
    <text x="820" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#B3541E">最大回撤</text>
    <text x="1090" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F0C98A">备注</text>

    <rect x="60" y="144" width="1160" height="52" fill="#FFFFFF"/>
    <text x="170" y="176" text-anchor="middle" font-size="13">① 2011.6 → 11</text>
    <text x="360" y="176" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#F7931A">$31.9</text>
    <text x="600" y="176" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#277653">$2.0</text>
    <text x="820" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-94%</text>
    <text x="1090" y="176" text-anchor="middle" font-size="12" fill="#6E655A">Mt.Gox 初崩盘</text>

    <rect x="60" y="196" width="1160" height="52" fill="#F6F1E6"/>
    <text x="170" y="228" text-anchor="middle" font-size="13">② 2013.11 → 15.1</text>
    <text x="360" y="228" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#F7931A">$1,156</text>
    <text x="600" y="228" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#277653">$171.5</text>
    <text x="820" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-85.2%</text>
    <text x="1090" y="228" text-anchor="middle" font-size="12" fill="#6E655A">Mt.Gox 破产</text>

    <rect x="60" y="248" width="1160" height="52" fill="#FFFFFF"/>
    <text x="170" y="280" text-anchor="middle" font-size="13">③ 2017.12 → 18.12</text>
    <text x="360" y="280" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#F7931A">$20,089</text>
    <text x="600" y="280" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#277653">$3,191</text>
    <text x="820" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-84.1%</text>
    <text x="1090" y="280" text-anchor="middle" font-size="12" fill="#6E655A">ICO 泡沫出清</text>

    <rect x="60" y="300" width="1160" height="52" fill="#F6F1E6"/>
    <text x="170" y="332" text-anchor="middle" font-size="13">④ 2021.11 → 22.11</text>
    <text x="360" y="332" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#F7931A">$68,790</text>
    <text x="600" y="332" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#277653">$15,599</text>
    <text x="820" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-77.3%</text>
    <text x="1090" y="332" text-anchor="middle" font-size="12" fill="#6E655A">LUNA+FTX 双雷</text>

    <rect x="60" y="352" width="1160" height="52" fill="#FFFFFF"/>
    <text x="170" y="384" text-anchor="middle" font-size="13">⑤ 2025.10 → 26.6</text>
    <text x="360" y="384" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#F7931A">$126,198</text>
    <text x="600" y="384" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#277653">$58,559</text>
    <text x="820" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-53.6%</text>
    <text x="1090" y="384" text-anchor="middle" font-size="12" fill="#6E655A">ETF后首次周期·8月~$80K</text>
  </g>
  <rect x="60" y="108" width="1160" height="296" fill="none" stroke="#E5DCC8"/>

  <!-- 底部双结论 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="424" width="572" height="202" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="88" y="458" font-size="15" font-weight="700" fill="#F7931A">规律一：波动率逐轮收敛</text>
    <text x="88" y="490" font-size="13" fill="#2B2620">回撤：-94% → -85% → -84% → -77% → -54%</text>
    <text x="88" y="518" font-size="13" fill="#2B2620">牛市倍数：8,000% → 61x → 116x → 22x → 8x</text>
    <text x="88" y="552" font-size="12.5" fill="#6E655A">市场在自我「机构化」：体量越大，越难疯。</text>
    <text x="88" y="580" font-size="12.5" fill="#6E655A">但收敛后的 -50% 依然是黄金从未有过的烈度</text>
    <text x="88" y="610" font-size="13" fill="#F7931A" font-weight="600">（黄金百年最深 -70%，用了 20 年）</text>

    <rect x="648" y="424" width="572" height="202" rx="12" fill="#2B2620"/>
    <text x="676" y="458" font-size="15" font-weight="700" fill="#F0C98A">规律二：底与顶都在抬升</text>
    <text x="676" y="490" font-size="13" fill="#F5F0E4">每轮谷值：$2 → $171 → $3,191 → $15,599 → $58K</text>
    <text x="676" y="518" font-size="13" fill="#F5F0E4">每轮峰值：$32 → $1,156 → $20K → $69K → $126K</text>
    <text x="676" y="552" font-size="12.5" fill="#C7BFA8">「归零论」至今 15 年未兑现；但「数字黄金」的</text>
    <text x="676" y="580" font-size="12.5" fill="#C7BFA8">波动画像仍属成长期资产，而非避险资产——</text>
    <text x="676" y="610" font-size="13" fill="#F7931A" font-weight="600">在组合里应按「高波动增长仓」而非「避险仓」计权</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：CoinMarketCap日线归档 cryptoclassic/davemanuel(A-)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">16 / 19</text>
</svg>
