<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">时代二 1934-1971：$35 时代的繁荣与裂缝</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">布雷顿森林：黄金退居幕后，美元走上王座——裂缝由此而生</text>

  <!-- 布雷顿森林结构图 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="572" height="270" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="88" y="146" font-size="15.5" font-weight="700" fill="#8A6D1F">1944 布雷顿森林体系：黄金-美元双锚</text>
    <rect x="120" y="170" width="180" height="60" rx="10" fill="#8A6D1F"/>
    <text x="210" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">黄金</text>
    <text x="210" y="216" text-anchor="middle" font-size="11.5" fill="#F0E8D4">$35/oz 固定</text>
    <text x="325" y="206" font-size="16" fill="#2B2620">⇄</text>
    <rect x="360" y="170" width="180" height="60" rx="10" fill="#1F3A5C"/>
    <text x="450" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">美元</text>
    <text x="450" y="216" text-anchor="middle" font-size="11.5" fill="#D5DEE8">各国货币锚定美元</text>
    <text x="88" y="264" font-size="13" fill="#2B2620">· 只有外国政府可按 $35 向美国兑金</text>
    <text x="88" y="290" font-size="13" fill="#2B2620">· 美元成为全球储备，黄金成为「幕后抵押品」</text>
    <text x="88" y="316" font-size="13" fill="#2B2620">· 1935-1967 金价纹丝不动（$34.4-35.1）</text>
    <text x="88" y="346" font-size="13" fill="#8A6D1F" font-weight="600">表面是黄金时代，实际是美元接管货币霸权的过渡期</text>

    <rect x="648" y="112" width="572" height="270" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="676" y="146" font-size="15.5" font-weight="700" fill="#B3541E">裂缝：特里芬难题的十年倒计时</text>
    <text x="676" y="180" font-size="13" fill="#2B2620">· 越战+伟大社会计划 → 美元超发</text>
    <text x="676" y="206" font-size="13" fill="#2B2620">· 海外美元 >> 美国黄金储备可兑量</text>
    <text x="676" y="232" font-size="13" fill="#2B2620">· 1961 伦敦黄金池成立救价，1968 崩溃</text>
    <text x="676" y="258" font-size="13" fill="#2B2620">· 1968 双轨制：官价$35/市价分离</text>
    <text x="676" y="284" font-size="13" fill="#2B2620">· 市价 1968 $39.31 → 1969 $41.28 → 1970 回落 $36</text>
    <rect x="676" y="302" width="516" height="58" rx="8" fill="#F8E8E0"/>
    <text x="934" y="326" text-anchor="middle" font-size="13" fill="#B3541E" font-weight="600">1971.8.15 尼克松：暂停美元兑黄金</text>
    <text x="934" y="348" text-anchor="middle" font-size="12.5" fill="#B3541E">「暂时」成了永远——纯信用货币时代开启</text>
  </g>

  <!-- 数据条 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="400" width="1160" height="120" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="90" y="432" font-size="14.5" font-weight="600" fill="#8A6D1F">$35 时代的隐性通胀（美元的第一次背离）</text>
    <text x="90" y="462" font-size="13.5" fill="#2B2620">1934-1971 美国CPI累计上涨约 2.3 倍（$35 的实际购买力只相当于 1934 年的约 $15）——金价名义固定，实际已腰斩：</text>
    <text x="90" y="490" font-size="13.5" fill="#2B2620">黄金在被「冻结」的名义价格下，默默承受了 37 年的法币稀释。1971 年后的暴涨，是对这 37 年压制的总清算。</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="536" width="1160" height="90" rx="12" fill="#2B2620"/>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F5F0E4">本页结论：布雷顿森林的崩溃不是意外，是设计缺陷的必然——全球需要美元流动性，就要美国逆差；逆差累积，锚就要断。</text>
  <text x="90" y="602" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F0C98A" font-weight="600">理解了 1971，才能理解黄金此后 50 年的一切：金价 = 法币信用的实时公投。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：NMA(A-)/BLS CPI(A)/特里芬难题：经济学通识(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">06 / 19</text>
</svg>
