<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">对比① 黄金 vs 美元：同一枚硬币的两面</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">把金价曲线翻转，就是美元购买力曲线——百年相关性近乎镜像</text>

  <!-- 双轴镜像图 -->
  <g>
    <g stroke="#E5DCC8" stroke-width="1">
      <line x1="100" y1="430" x2="720" y2="430"/>
      <line x1="100" y1="340" x2="720" y2="340" stroke-dasharray="4,4"/>
      <line x1="100" y1="250" x2="720" y2="250" stroke-dasharray="4,4"/>
      <line x1="100" y1="160" x2="720" y2="160" stroke-dasharray="4,4"/>
    </g>
    <!-- 金价(对数上升): 20.67→35→850→252→1921→2075→5589/4454 -->
    <polyline points="120,425 240,400 340,398 420,330 480,300 540,352 620,205 680,225 700,180 720,150" fill="none" stroke="#8A6D1F" stroke-width="3.5"/>
    <!-- 美元购买力(持续下行) -->
    <polyline points="120,165 240,230 340,290 420,335 480,360 540,380 620,398 680,408 700,412 720,415" fill="none" stroke="#1F3A5C" stroke-width="3.5" stroke-dasharray="8,5"/>
    <g font-family="'PingFang SC', sans-serif" font-size="12">
      <rect x="490" y="130" width="14" height="4" fill="#8A6D1F"/><text x="510" y="136">金价（对数·左升）</text>
      <rect x="490" y="152" width="14" height="4" fill="#1F3A5C"/><text x="510" y="158">美元购买力（右降）</text>
    </g>
    <text x="140" y="150" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">镜像：一条的每个台阶，都对应另一条的滑坡</text>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9184" text-anchor="middle">
      <text x="120" y="450">1920</text><text x="270" y="450">1945</text><text x="420" y="450">1971</text>
      <text x="540" y="450">1990</text><text x="660" y="450">2010</text><text x="720" y="450">26</text>
    </g>
  </g>

  <!-- 数字对表 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="760" y="112" width="460" height="342" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="788" y="144" font-size="15" font-weight="700" fill="#8A6D1F">同一时点，两种记法</text>
    <rect x="788" y="160" width="404" height="34" fill="#F6F1E6"/>
    <text x="796" y="183" font-size="12.5" font-weight="600" fill="#2B2620">时点</text>
    <text x="950" y="183" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8A6D1F">金价</text>
    <text x="1110" y="183" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F3A5C">$1 购买力残值</text>
    <g font-size="12.5" fill="#2B2620">
      <text x="796" y="216">1920</text><text x="950" y="216" text-anchor="middle" fill="#8A6D1F">$20.67</text><text x="1110" y="216" text-anchor="middle" fill="#1F3A5C">$1.00</text>
      <text x="796" y="248">1934</text><text x="950" y="248" text-anchor="middle" fill="#8A6D1F">$35</text><text x="1110" y="248" text-anchor="middle" fill="#1F3A5C">$0.81</text>
      <text x="796" y="280">1971</text><text x="950" y="280" text-anchor="middle" fill="#8A6D1F">$40.6</text><text x="1110" y="280" text-anchor="middle" fill="#1F3A5C">$0.42</text>
      <text x="796" y="312">1980</text><text x="950" y="312" text-anchor="middle" fill="#8A6D1F">$615(峰850)</text><text x="1110" y="312" text-anchor="middle" fill="#1F3A5C">$0.36</text>
      <text x="796" y="344">2000</text><text x="950" y="344" text-anchor="middle" fill="#8A6D1F">$279</text><text x="1110" y="344" text-anchor="middle" fill="#1F3A5C">$0.20</text>
      <text x="796" y="376">2011</text><text x="950" y="376" text-anchor="middle" fill="#8A6D1F">$1,572(峰1921)</text><text x="1110" y="376" text-anchor="middle" fill="#1F3A5C">$0.15</text>
      <text x="796" y="408">2026.8</text><text x="950" y="408" text-anchor="middle" fill="#8A6D1F">$4,454</text><text x="1110" y="408" text-anchor="middle" fill="#1F3A5C">$0.0297</text>
    </g>
    <text x="788" y="440" font-size="12" fill="#6E655A">金价百年 ×216；同期美元购买力 ÷34</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="476" width="1160" height="150" rx="12" fill="#2B2620"/>
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F0C98A">但镜像不是完全对称——三个不对称</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">① 金价有急跌（1980-2000 -70%），美元购买力几乎从不回升——贬值是单向棘轮，黄金是双向市场；</text>
  <text x="90" y="574" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">② 短期金价常超调（恐慌溢价），美元贬值从不过冲（CPI 粘性）；③ 2000-2026 金价 +1,500% 远超累计通胀 +86%——</text>
  <text x="90" y="604" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0C98A" font-weight="600">本世纪黄金的超额收益来自「信用溢价」：市场为美元体系的不确定性支付的保险费。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：NMA/BLS（A-/A）·图为对数示意</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">11 / 19</text>
</svg>
