<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">黄金的命门：实际利率的百年实证</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">黄金不生息 → 持金的成本 = 有息资产的实际收益率——这是唯一稳定穿越百年的定价锚</text>

  <!-- 机制图 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="1160" height="110" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="90" y="146" font-size="15" font-weight="700" fill="#8A6D1F">机制链条</text>
    <rect x="90" y="162" width="250" height="40" rx="8" fill="#1F3A5C"/>
    <text x="215" y="188" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">实际利率 = 名义利率 − 通胀</text>
    <text x="356" y="188" font-size="16" fill="#8A96A3">↑正→</text>
    <rect x="410" y="162" width="250" height="40" rx="8" fill="#B3541E" opacity="0.85"/>
    <text x="535" y="188" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">持金机会成本高 → 金价承压</text>
    <text x="676" y="188" font-size="14" fill="#8A96A3">/</text>
    <rect x="700" y="162" width="250" height="40" rx="8" fill="#277653" opacity="0.9"/>
    <text x="825" y="188" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">实际利率↓或负 → 金价走牛</text>
    <text x="970" y="188" font-size="14" fill="#8A96A3">＋</text>
    <rect x="990" y="162" width="206" height="40" rx="8" fill="#8A6D1F"/>
    <text x="1093" y="188" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">恐慌/央行购金加成</text>
  </g>

  <!-- 两组实证 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="242" width="572" height="290" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="88" y="276" font-size="15.5" font-weight="700" fill="#1F3A5C">实证A：1980-1984 沃尔克实验（熊市）</text>
    <g stroke="#E5DCC8" stroke-width="1">
      <line x1="110" y1="440" x2="600" y2="440"/>
      <line x1="110" y1="380" x2="600" y2="380" stroke-dasharray="4,4"/>
      <line x1="110" y1="320" x2="600" y2="320" stroke-dasharray="4,4"/>
    </g>
    <!-- 实际利率从负转正+8% (上行线) -->
    <polyline points="140,452 240,420 340,360 440,316 540,300" fill="none" stroke="#1F3A5C" stroke-width="3"/>
    <!-- 金价下行 -->
    <polyline points="140,290 240,340 340,370 440,390 540,404" fill="none" stroke="#8A6D1F" stroke-width="3" stroke-dasharray="7,4"/>
    <g font-size="11.5" fill="#6E655A">
      <rect x="120" y="470" width="14" height="4" fill="#1F3A5C"/><text x="142" y="477">实际利率（→+8%）</text>
      <rect x="320" y="470" width="14" height="4" fill="#8A6D1F"/><text x="342" y="477">金价（$850→$300s）</text>
    </g>
    <text x="88" y="506" font-size="12.5" fill="#2B2620">联邦基金利率 ~20%，通胀被压回 → 实际利率 +8%：</text>
    <text x="88" y="526" font-size="12.5" fill="#2B2620">黄金 20 年熊市的全部逻辑就在这一条线里。</text>

    <rect x="648" y="242" width="572" height="290" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="676" y="276" font-size="15.5" font-weight="700" fill="#277653">实证B：2019-2026 负利率实验（牛市）</text>
    <g stroke="#E5DCC8" stroke-width="1">
      <line x1="700" y1="440" x2="1190" y2="440"/>
      <line x1="700" y1="380" x2="1190" y2="380" stroke-dasharray="4,4"/>
      <line x1="700" y1="320" x2="1190" y2="320" stroke-dasharray="4,4"/>
    </g>
    <!-- 实际利率下行转负 -->
    <polyline points="730,400 830,420 930,436 1030,430 1130,410" fill="none" stroke="#1F3A5C" stroke-width="3"/>
    <!-- 金价陡升 -->
    <polyline points="730,420 830,380 930,330 1030,300 1130,270" fill="none" stroke="#8A6D1F" stroke-width="3" stroke-dasharray="7,4"/>
    <g font-size="11.5" fill="#6E655A">
      <rect x="710" y="470" width="14" height="4" fill="#1F3A5C"/><text x="732" y="477">实际利率（→负区间）</text>
      <rect x="910" y="470" width="14" height="4" fill="#8A6D1F"/><text x="932" y="477">金价（$1,300→$4,400+）</text>
    </g>
    <text x="676" y="506" font-size="12.5" fill="#2B2620">QE+疫情财政化 → 实际利率 2020-2021 深负；2022-23 加息</text>
    <text x="676" y="526" font-size="12.5" fill="#2B2620">实际利率转正金价却续涨——央行购金改写了旧公式（右图叠加项）。</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="548" width="1160" height="78" rx="12" fill="#2B2620"/>
  <text x="90" y="580" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F5F0E4">本页结论：实际利率解释了黄金百年大部分走势，但 2022 后出现罕见的「实际利率正 × 金价涨」背离——增量变量是央行购金。旧锚未死，但船多了一只引擎。</text>
  <text x="90" y="610" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F0C98A" font-weight="600">给投资者的翻译：盯实际利率做黄金的旧打法需要叠加一个新问题——「央行还在买吗？」</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">机制：宏观经济学通识(B+)·实证数据点：FRED/NMA/LBMA(A-/B+)·图为示意</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">09 / 19</text>
</svg>
