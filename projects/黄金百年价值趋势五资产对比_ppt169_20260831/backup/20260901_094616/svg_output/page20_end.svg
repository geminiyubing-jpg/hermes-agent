<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F"/>
  <!-- 金色曲线装饰 -->
  <g fill="none" stroke="#8A6D1F" stroke-width="3">
    <path opacity="0.3" d="M820,720 C920,690 980,600 1040,520 C1100,440 1160,400 1240,380"/>
  </g>
  <circle opacity="0.6" cx="1240" cy="380" r="6" fill="#B3541E"/>

  <text x="60" y="110" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8A6D1F" letter-spacing="5">EPILOGUE · 百年启示录</text>
  <text x="60" y="175" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="34" font-weight="800" fill="#2B2620">黄金百年史的五条定律</text>

  <!-- 五定律 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="210" width="740" height="56" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="84" y="244" font-size="15" font-weight="700" fill="#8A6D1F">①</text>
    <text x="110" y="236" font-size="13.5" fill="#2B2620" font-weight="600">金价是法币信用的实时公投</text>
    <text x="110" y="256" font-size="12" fill="#6E655A">+21,700% 与美元 -97% 是同一故事——盯金价先盯央行资产负债表</text>

    <rect x="60" y="274" width="740" height="56" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="84" y="308" font-size="15" font-weight="700" fill="#8A6D1F">②</text>
    <text x="110" y="300" font-size="13.5" fill="#2B2620" font-weight="600">实际利率定方向，恐慌与央行定幅度</text>
    <text x="110" y="320" font-size="12" fill="#6E655A">1980 与 2026 两次顶峰，都是负利率/信用危机与主权买家的合谋</text>

    <rect x="60" y="338" width="740" height="56" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="84" y="372" font-size="15" font-weight="700" fill="#8A6D1F">③</text>
    <text x="110" y="364" font-size="13.5" fill="#2B2620" font-weight="600">黄金的代价是时间，股票的代价是回撤</text>
    <text x="110" y="384" font-size="12" fill="#6E655A">1980 顶部买金者等了 46 年才「实际回本」——避险资产也有择时风险</text>

    <rect x="60" y="402" width="740" height="56" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="84" y="436" font-size="15" font-weight="700" fill="#8A6D1F">④</text>
    <text x="110" y="428" font-size="13.5" fill="#2B2620" font-weight="600">用黄金计价，戳破一切法币幻觉</text>
    <text x="110" y="448" font-size="12" fill="#6E655A">曼哈顿百年 +10,000% 缩水成 +25%——「保值资产」多数只是法币的影子</text>

    <rect x="60" y="466" width="740" height="56" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="84" y="500" font-size="15" font-weight="700" fill="#8A6D1F">⑤</text>
    <text x="110" y="492" font-size="13.5" fill="#2B2620" font-weight="600">没有全能冠军，只有各司其职</text>
    <text x="110" y="512" font-size="12" fill="#6E655A">美元付账、股票生息、房产安身、黄金锚信、比特币下注——组合优于单押</text>
  </g>

  <!-- 右侧:2026站位 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="830" y="210" width="390" height="312" rx="12" fill="#2B2620"/>
    <text x="858" y="246" font-size="15.5" font-weight="700" fill="#F0C98A">2026 的冷静站位</text>
    <text x="858" y="280" font-size="13" fill="#F5F0E4">· 金价 $4,400+：实际历史新高</text>
    <text x="858" y="308" font-size="13" fill="#F5F0E4">· Dow/Gold ~10：偏金未至极值</text>
    <text x="858" y="336" font-size="13" fill="#F5F0E4">· 央行年购千吨：结构性买盘仍在</text>
    <text x="858" y="364" font-size="13" fill="#F5F0E4">· 但 $5,589→$4,454 已回撤 20%：</text>
    <text x="858" y="390" font-size="13" fill="#F5F0E4">　 追高者同样在承受波动学费</text>
    <rect x="858" y="410" width="334" height="90" rx="8" fill="#3A342B"/>
    <text x="1025" y="442" text-anchor="middle" font-size="13" fill="#F0C98A" font-weight="600">历史只给韵脚，不给台词</text>
    <text x="1025" y="468" text-anchor="middle" font-size="12" fill="#C7BFA8">本报告为数据研究，非投资建议</text>
    <text x="1025" y="488" text-anchor="middle" font-size="12" fill="#C7BFA8">配置决策请结合自身风险承受力</text>
  </g>

  <text x="60" y="572" font-family="'PingFang SC', serif" font-size="15" fill="#8A6D1F" font-weight="600">「黄金不是让人变富的资产，是让人不变穷的资产。」——百年数据最朴素的一句总结</text>
  <text x="60" y="600" font-family="'PingFang SC', sans-serif" font-size="13" fill="#6E655A">—— 完 · 感谢阅读 ——</text>
  <text x="60" y="700" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9184">小爱研究 · 2026-08-31 · 全部关键数字两源验证，来源分级见各页页脚</text>
<text x="1220" y="694" text-anchor="end" font-family="Helvetica Neue, sans-serif" font-size="13" fill="#8A6D1F">19 / 19</text>
</svg>
