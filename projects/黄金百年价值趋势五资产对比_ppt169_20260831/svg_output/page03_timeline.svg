<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">百年十大里程碑：黄金的四个时代</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">1920-2026 · 每个转折点都是一次货币制度的改写</text>

  <!-- 时间轴 -->
  <line x1="70" y1="360" x2="1210" y2="360" stroke="#8A6D1F" stroke-width="3"/>
  <!-- 时代底色 -->
  <rect x="70" y="340" width="150" height="40" fill="#1F3A5C" opacity="0.15"/>
  <rect x="220" y="340" width="300" height="40" fill="#8A6D1F" opacity="0.15"/>
  <rect x="520" y="340" width="330" height="40" fill="#B3541E" opacity="0.15"/>
  <rect x="850" y="340" width="360" height="40" fill="#277653" opacity="0.15"/>

  <g font-family="'PingFang SC', sans-serif">
    <!-- 时代标签 -->
    <text x="145" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F3A5C">金本位</text>
    <text x="370" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8A6D1F">管制与布雷顿森林</text>
    <text x="685" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B3541E">自由市场·牛熊交替</text>
    <text x="1030" y="418" text-anchor="middle" font-size="12.5" font-weight="700" fill="#277653">新纪元·央行购金</text>

    <!-- 上方事件 1925/1934/1944 -->
    <circle cx="110" cy="360" r="7" fill="#1F3A5C"/>
    <text x="110" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F3A5C">1925</text>
    <text x="110" y="300" text-anchor="middle" font-size="11" fill="#6E655A">$20.67/oz</text>
    <text x="110" y="282" text-anchor="middle" font-size="11" fill="#6E655A">金本位·价由法定</text>

    <circle cx="270" cy="360" r="7" fill="#8A6D1F"/>
    <text x="270" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8A6D1F">1933-34</text>
    <text x="270" y="300" text-anchor="middle" font-size="11" fill="#6E655A">6102令没收民间金</text>
    <text x="270" y="282" text-anchor="middle" font-size="11" fill="#6E655A">重估$35（美元贬值41%）</text>

    <circle cx="440" cy="360" r="7" fill="#8A6D1F"/>
    <text x="440" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8A6D1F">1944</text>
    <text x="440" y="300" text-anchor="middle" font-size="11" fill="#6E655A">布雷顿森林体系</text>
    <text x="440" y="282" text-anchor="middle" font-size="11" fill="#6E655A">$35锚定全球货币</text>

    <!-- 下方事件 1971/1980/1999 -->
    <circle cx="560" cy="360" r="8" fill="#B3541E"/>
    <text x="560" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#B3541E">1971.8.15 ★分水岭</text>
    <text x="560" y="470" text-anchor="middle" font-size="11" fill="#6E655A">尼克松关闭黄金窗口</text>
    <text x="560" y="488" text-anchor="middle" font-size="11" fill="#6E655A">黄金开始自由定价</text>

    <circle cx="690" cy="360" r="7" fill="#B3541E"/>
    <text x="690" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B3541E">1980.1</text>
    <text x="690" y="300" text-anchor="middle" font-size="11" fill="#6E655A">峰值$850</text>
    <text x="690" y="282" text-anchor="middle" font-size="11" fill="#6E655A">通胀+地缘恐慌顶点</text>

    <circle cx="800" cy="360" r="7" fill="#B3541E"/>
    <text x="800" y="450" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B3541E">1999.8</text>
    <text x="800" y="470" text-anchor="middle" font-size="11" fill="#6E655A">谷底$252</text>
    <text x="800" y="488" text-anchor="middle" font-size="11" fill="#6E655A">沃尔克高利率+央行售金20年熊市终</text>

    <!-- 上方 2011/2020 下方 2022/2026 -->
    <circle cx="900" cy="360" r="7" fill="#277653"/>
    <text x="900" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#277653">2011.9</text>
    <text x="900" y="300" text-anchor="middle" font-size="11" fill="#6E655A">$1,921</text>
    <text x="900" y="282" text-anchor="middle" font-size="11" fill="#6E655A">QE时代第一峰</text>

    <circle cx="980" cy="360" r="7" fill="#277653"/>
    <text x="980" y="450" text-anchor="middle" font-size="12.5" font-weight="700" fill="#277653">2020.8</text>
    <text x="980" y="470" text-anchor="middle" font-size="11" fill="#6E655A">$2,075 新高</text>
    <text x="980" y="488" text-anchor="middle" font-size="11" fill="#6E655A">疫情大放水</text>

    <circle cx="1080" cy="360" r="7" fill="#277653"/>
    <text x="1080" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#277653">2022</text>
    <text x="1080" y="300" text-anchor="middle" font-size="11" fill="#6E655A">俄储备被冻结$3000亿+</text>
    <text x="1080" y="282" text-anchor="middle" font-size="11" fill="#6E655A">央行购金1081吨创纪录</text>

    <circle cx="1180" cy="360" r="8" fill="#B3541E"/>
    <text x="1180" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#B3541E">2026.1</text>
    <text x="1180" y="470" text-anchor="middle" font-size="11" fill="#6E655A">ATH $5,589</text>
    <text x="1180" y="488" text-anchor="middle" font-size="11" fill="#6E655A">超1980实际高点→8月$4,454</text>
  </g>

  <!-- 底部结论 -->
  <rect x="60" y="516" width="1160" height="110" rx="12" fill="#2B2620"/>
  <text x="90" y="552" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F0C98A">本页结论</text>
  <text x="90" y="582" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">百年金价史 = 一部货币制度变迁史：金本位（价由法定）→ 管制（$35双轨）→ 自由市场（850→252→1921）→ 新纪元（央行去美元化购金）。</text>
  <text x="90" y="610" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">金价的三次历史性峰值 1980/2011/2026，对应法币信用的三次危机：滞胀 / 金融危机放水 / 债务货币化+储备武器化。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：NMA历史金价表(引WGC/Kitco)(A-)·LBMA 2026(A)·WGC央行购金(A)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">03 / 19</text>
</svg>
