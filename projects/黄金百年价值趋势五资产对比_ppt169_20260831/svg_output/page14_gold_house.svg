<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">对比③ 黄金 vs 核心城市房产：法币幻觉</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">以全球最硬核的资产——曼哈顿住宅——为标本：美元计价 +10,000%，黄金计价百年仅 +25%</text>

  <!-- 双计价条 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="80" y="130" font-size="15" font-weight="600" fill="#B3541E">同一批房子，两种货币计价（~1920s → 2020s，曼哈顿住宅）</text>
    <!-- 美元计价 -->
    <rect x="100" y="152" width="640" height="46" rx="8" fill="#1F3A5C"/>
    <text x="420" y="182" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">美元计价：+10,000%（百倍）</text>
    <text x="760" y="182" font-size="12.5" fill="#6E655A">纸面巨大增值</text>
    <!-- 黄金计价 -->
    <rect x="100" y="210" width="230" height="46" rx="8" fill="#8A6D1F"/>
    <text x="215" y="240" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">黄金计价：仅 +25%</text>
    <rect x="340" y="210" width="500" height="46" rx="8" fill="#E5DCC8"/>
    <text x="590" y="240" text-anchor="middle" font-size="12.5" fill="#6E655A">← 差距的全部秘密：房子没变贵，美元变薄了</text>
    <text x="80" y="292" font-size="12.5" fill="#6E655A">来源：gold-eagle/dynamicwealthresearch 基于百年曼哈顿住宅价格序列的两源一致结论（B+）</text>
  </g>

  <!-- 三城市卡 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="316" width="373" height="230" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="88" y="350" font-size="15" font-weight="700" fill="#B3541E">曼哈顿（百年标本）</text>
    <text x="88" y="382" font-size="12.5" fill="#2B2620">· 地球最受追捧的住宅市场之一</text>
    <text x="88" y="408" font-size="12.5" fill="#2B2620">· 美元 +10,000% vs 黄金 +25%</text>
    <text x="88" y="434" font-size="12.5" fill="#2B2620">· 减去百年房产税+维护费后，</text>
    <text x="88" y="458" font-size="12.5" fill="#2B2620">  黄金计价大概率净亏</text>
    <rect x="88" y="476" width="317" height="50" rx="8" fill="#F8E8E0"/>
    <text x="246" y="497" text-anchor="middle" font-size="12" fill="#B3541E" font-weight="600">最顶配房产也只是「追平黄金」</text>
    <text x="246" y="516" text-anchor="middle" font-size="11.5" fill="#B3541E">且流动性/维护成本远劣</text>

    <rect x="453" y="316" width="373" height="230" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="481" y="350" font-size="15" font-weight="700" fill="#8A6D1F">美国全国（Case-Shiller）</text>
    <text x="481" y="382" font-size="12.5" fill="#2B2620">· 1890 以来实际房价（剔通胀）几乎横盘</text>
    <text x="481" y="408" font-size="12.5" fill="#2B2620">  （Shiller 百年研究）</text>
    <text x="481" y="434" font-size="12.5" fill="#2B2620">· 2001 后美元房价大涨，黄金计价 2011</text>
    <text x="481" y="458" font-size="12.5" fill="#2B2620">  年反而创新低</text>
    <rect x="481" y="476" width="317" height="50" rx="8" fill="#F0EAD8"/>
    <text x="639" y="497" text-anchor="middle" font-size="12" fill="#8A6D1F" font-weight="600">1970-2011 黄金计价房价 -80% 量级</text>
    <text x="639" y="516" text-anchor="middle" font-size="11.5" fill="#8A6D1F">买房「稳赚」的经验只有 50 年历史</text>

    <rect x="846" y="316" width="373" height="230" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="874" y="350" font-size="15" font-weight="700" fill="#277653">伦敦核心区（Prime London）</text>
    <text x="874" y="382" font-size="12.5" fill="#2B2620">· 以黄金计价：2024 前后回到 1987</text>
    <text x="874" y="408" font-size="12.5" fill="#2B2620">  年以来最便宜（Property Chronicle）</text>
    <text x="874" y="434" font-size="12.5" fill="#2B2620">· 美元买家视角：回到 2011 前价格</text>
    <text x="874" y="458" font-size="12.5" fill="#2B2620">· 38 年维度「全球最贵城区」跑输黄金</text>
    <rect x="874" y="476" width="317" height="50" rx="8" fill="#EFF7F2"/>
    <text x="1032" y="497" text-anchor="middle" font-size="12" fill="#277653" font-weight="600">要么黄金太贵，要么核心房产太便宜</text>
    <text x="1032" y="516" text-anchor="middle" font-size="11.5" fill="#277653">这正是黄金计价视角的价值</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="566" width="1160" height="60" rx="12" fill="#2B2620"/>
  <text x="90" y="590" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">「房地产保值」的诚实拆解 = 法币贬值（大部分）+ 杠杆放大 + 租金现金流（真实收益来源）+ 城市化红利（一次性）。</text>
  <text x="90" y="614" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0C98A" font-weight="600">用黄金计价后，只剩租金和选城能力是真的——这是百年数据给出的冷静答案。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：gold-eagle/dynamicwealth(B+)·Shiller序列(B+)·propertychronicle(B+)·pricedingold(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">14 / 19</text>
</svg>
