<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F"/>
  <!-- 金价曲线装饰 -->
  <g fill="none" stroke="#8A6D1F" stroke-width="3">
    <path opacity="0.5" d="M780,640 C880,630 940,600 980,560 C1030,510 1050,440 1090,380 C1130,320 1180,300 1230,290"/>
    <path opacity="0.2" d="M800,660 C900,650 960,620 1000,580 C1050,530 1070,460 1110,400"/>
  </g>
  <circle opacity="0.7" cx="780" cy="640" r="5" fill="#8A6D1F"/>
  <circle opacity="0.9" cx="1230" cy="290" r="7" fill="#B3541E"/>
  <text x="1160" y="272" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#B3541E">$5,589 ATH</text>

  <text x="60" y="120" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8A6D1F" letter-spacing="5">GOLD · ONE HUNDRED YEARS · 1926-2026</text>
  <text x="60" y="200" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="52" font-weight="800" fill="#8A6D1F">黄金百年</text>
  <text x="60" y="258" font-family="'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#2B2620">价值趋势深度分析 × 五资产世纪对比</text>
  <text x="60" y="298" font-family="'PingFang SC', sans-serif" font-size="15" fill="#6E655A">对手盘：美元 · 美股 · 核心城市房地产 · 比特币</text>

  <!-- 五资产色标 -->
  <g font-family="'PingFang SC', sans-serif" font-size="13">
    <circle cx="80" cy="340" r="6" fill="#8A6D1F"/><text x="96" y="345" fill="#2B2620">黄金</text>
    <circle cx="160" cy="340" r="6" fill="#1F3A5C"/><text x="176" y="345" fill="#2B2620">美元</text>
    <circle cx="240" cy="340" r="6" fill="#277653"/><text x="256" y="345" fill="#2B2620">美股</text>
    <circle cx="320" cy="340" r="6" fill="#B3541E"/><text x="336" y="345" fill="#2B2620">核心城市房产</text>
    <circle cx="450" cy="340" r="6" fill="#F7931A"/><text x="466" y="345" fill="#2B2620">比特币</text>
  </g>

  <!-- 数字卡 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="386" width="212" height="104" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="166" y="426" text-anchor="middle" font-size="24" font-weight="700" fill="#8A6D1F" font-family="'Helvetica Neue', sans-serif">+21,700%</text>
    <text x="166" y="454" text-anchor="middle" font-size="12" fill="#6E655A">金价百年涨幅($20.67→$4,538)</text>
    <rect x="292" y="386" width="212" height="104" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="398" y="426" text-anchor="middle" font-size="24" font-weight="700" fill="#1F3A5C" font-family="'Helvetica Neue', sans-serif">-97%</text>
    <text x="398" y="454" text-anchor="middle" font-size="12" fill="#6E655A">美元购买力(1913-2026)</text>
    <rect x="524" y="386" width="212" height="104" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="630" y="426" text-anchor="middle" font-size="24" font-weight="700" fill="#277653" font-family="'Helvetica Neue', sans-serif">7,550×</text>
    <text x="630" y="454" text-anchor="middle" font-size="12" fill="#6E655A">美股百年含股息(1924-2024)</text>
    <rect x="756" y="386" width="212" height="104" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="862" y="426" text-anchor="middle" font-size="24" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">+25%</text>
    <text x="862" y="454" text-anchor="middle" font-size="12" fill="#6E655A">曼哈顿房价·黄金计价·百年</text>
    <rect x="988" y="386" width="212" height="104" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="1094" y="426" text-anchor="middle" font-size="24" font-weight="700" fill="#F7931A" font-family="'Helvetica Neue', sans-serif">+74,241%</text>
    <text x="1094" y="454" text-anchor="middle" font-size="12" fill="#6E655A">比特币全史(2013-2026)</text>
  </g>

  <text x="60" y="540" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#2B2620" font-weight="600">核心命题：黄金百年 +21,700% 与美元购买力 -97%，是同一个故事的两种讲法。</text>
  <text x="60" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">数据截至 2026-08-31 · 全部来源见页脚分级标注 · 关键数字均两源交叉验证</text>

  <text x="60" y="700" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9184">小爱研究 · LBMA/WGC/BLS/NYU-Stern/CoinMarketCap 多源</text>
</svg>
