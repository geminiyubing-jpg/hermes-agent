<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#277653"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">时代四 2000-2026：三轮牛市与新王加冕</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">$252 → $5,589：法币信用时代的黄金复权</text>

  <!-- 三幕 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="373" height="300" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <rect x="60" y="112" width="373" height="44" rx="12" fill="#277653"/>
    <text x="246" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">第一幕 2001-2011（+659%）</text>
    <text x="88" y="184" font-size="13.5" fill="#2B2620" font-weight="600">互联网泡沫破裂开启</text>
    <text x="88" y="212" font-size="12.5" fill="#6E655A">· 2001 谷 $255 → 2008.3 首破 $1,000</text>
    <text x="88" y="236" font-size="12.5" fill="#6E655A">· 雷曼倒塌，QE 时代开启</text>
    <text x="88" y="260" font-size="12.5" fill="#6E655A">· 实际利率深负 → 2011.9 峰 $1,921</text>
    <rect x="88" y="280" width="317" height="50" rx="8" fill="#EFF7F2"/>
    <text x="246" y="302" text-anchor="middle" font-size="12.5" fill="#277653" font-weight="600">WGC 口径十年 +659%</text>
    <text x="246" y="321" text-anchor="middle" font-size="11.5" fill="#6E655A">美元信用第一次系统性动摇</text>
    <text x="88" y="356" font-size="12" fill="#6E655A">尾声：2013 -28%（1981 来最差年）</text>
    <text x="88" y="378" font-size="12" fill="#6E655A">2015.12 谷 $1,046——仍高于</text>
    <text x="88" y="398" font-size="12" fill="#6E655A">2008 前所有水平（底部抬升）</text>

    <rect x="453" y="112" width="373" height="300" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <rect x="453" y="112" width="373" height="44" rx="12" fill="#8A6D1F"/>
    <text x="639" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">第二幕 2016-2020（+103%）</text>
    <text x="481" y="184" font-size="13.5" fill="#2B2620" font-weight="600">缩表与疫情的先抑后扬</text>
    <text x="481" y="212" font-size="12.5" fill="#6E655A">· 2018 加息压制，年末股市崩跌救金</text>
    <text x="481" y="236" font-size="12.5" fill="#6E655A">· 2019 贸易战+降息转向，+21.2%</text>
    <text x="481" y="260" font-size="12.5" fill="#6E655A">· 2020 疫情天量刺激 → 8月 $2,075 新高</text>
    <rect x="481" y="280" width="317" height="50" rx="8" fill="#F0EAD8"/>
    <text x="639" y="302" text-anchor="middle" font-size="12.5" fill="#8A6D1F" font-weight="600">史上最大和平时期财政货币扩张</text>
    <text x="639" y="321" text-anchor="middle" font-size="11.5" fill="#6E655A"> Fed 零利率 + 无限 QE</text>
    <text x="481" y="356" font-size="12" fill="#6E655A">2021-22 年加息阵痛：2022.10</text>
    <text x="481" y="378" font-size="12" fill="#6E655A">回落 $1,615——但强势美元下</text>
    <text x="481" y="398" font-size="12" fill="#6E655A">韧性已非 1980 年代可比</text>

    <rect x="846" y="112" width="373" height="300" rx="12" fill="#FFFFFF" stroke="#B3541E" stroke-width="1.5"/>
    <rect x="846" y="112" width="373" height="44" rx="12" fill="#B3541E"/>
    <text x="1032" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">第三幕 2022-2026（新王）★</text>
    <text x="874" y="184" font-size="13.5" fill="#2B2620" font-weight="600">去美元化 + 债务货币化</text>
    <text x="874" y="212" font-size="12.5" fill="#6E655A">· 2022 俄储备被冻 $3000亿+ → 央行年购</text>
    <text x="874" y="236" font-size="12.5" fill="#6E655A">　 金 1,081 吨创百年纪录（连续3年千吨+）</text>
    <text x="874" y="260" font-size="12.5" fill="#6E655A">· 2025.3 破$3,000 → 10月破$4,000（+46%/年）</text>
    <text x="874" y="284" font-size="12.5" fill="#6E655A">· 2026.1.28 ATH $5,589 → 8月 $4,454</text>
    <rect x="874" y="300" width="317" height="64" rx="8" fill="#F8E8E0"/>
    <text x="1032" y="326" text-anchor="middle" font-size="12.5" fill="#B3541E" font-weight="600">结构性不同：买家是央行而非散户</text>
    <text x="1032" y="348" text-anchor="middle" font-size="11.5" fill="#B3541E">本轮是主权级去美元化投票</text>
    <text x="874" y="386" font-size="12" fill="#6E655A">2026 回撤 ~20% 后仍站稳 $4,400+</text>
    <text x="874" y="404" font-size="12" fill="#6E655A">实际价格超 1980 峰——百年最强</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="430" width="1160" height="196" rx="12" fill="#277653"/>
  <text x="90" y="466" font-family="'PingFang SC', sans-serif" font-size="15.5" font-weight="700" fill="#F0E8D8">三轮牛市的共同语法（记住这个框架）</text>
  <text x="90" y="500" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F2EA">危机（科技泡沫/金融海啸/疫情+制裁）→ 法币大扩容 → 实际利率下行/转负 → 黄金重估 → 高位等待下一轮。</text>
  <text x="90" y="530" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F2EA">差异在买家结构：第一轮散户与ETF、第二轮机构、第三轮央行——对手盘越来越「主权化」，2000-2026 金价年化的 8.5% 里藏着一部美元信用史。</text>
  <text x="90" y="576" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#FFFFFF" font-weight="600">2000-2026：金价 $279→$4,454（+1,500%），同期美股含股息约 +500%——本世纪迄今黄金跑赢股票。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：goldsilver.com梳理(LBMA/WGC/FRED)(A-/B+)·Macrotrends月度(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">08 / 19</text>
</svg>
