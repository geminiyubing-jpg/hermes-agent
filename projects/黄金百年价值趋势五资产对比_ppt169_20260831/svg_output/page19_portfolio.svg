<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#277653"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">五资产配置光谱：没有全能冠军</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">把百年数据放到同一张「收益-波动」地图上，各就各位</text>

  <!-- 定位散点图 -->
  <g>
    <rect x="90" y="112" width="700" height="420" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <line x1="150" y1="480" x2="740" y2="480" stroke="#9B9184" stroke-width="2"/>
    <line x1="150" y1="480" x2="150" y2="140" stroke="#9B9184" stroke-width="2"/>
    <text x="445" y="510" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13" fill="#6E655A">长期名义年化收益 →</text>
    <text x="112" y="310" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13" fill="#6E655A" transform="rotate(-90 112 310)">最大回撤/风险 →</text>
    <!-- 美元: 低收益低波动 -->
    <circle cx="240" cy="430" r="24" fill="#1F3A5C"/>
    <text x="240" y="427" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">美元</text>
    <text x="240" y="443" text-anchor="middle" font-size="10" fill="#D5DEE8">-3.2%实际</text>
    <!-- 房产 -->
    <circle cx="380" cy="330" r="26" fill="#B3541E"/>
    <text x="380" y="327" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">核心房产</text>
    <text x="380" y="343" text-anchor="middle" font-size="10" fill="#F5D9CB">~5%+租金</text>
    <!-- 黄金 -->
    <circle cx="450" cy="240" r="26" fill="#8A6D1F"/>
    <text x="450" y="237" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">黄金</text>
    <text x="450" y="253" text-anchor="middle" font-size="10" fill="#F0E8D4">5.4%·-70%</text>
    <!-- 美股 -->
    <circle cx="620" cy="200" r="30" fill="#277653"/>
    <text x="620" y="197" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">美股</text>
    <text x="620" y="214" text-anchor="middle" font-size="10" fill="#D2E9DC">9.5%·-89%</text>
    <!-- 比特币 -->
    <circle cx="700" cy="140" r="28" fill="#F7931A"/>
    <text x="700" y="137" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">比特币</text>
    <text x="700" y="153" text-anchor="middle" font-size="10" fill="#FDEBD2">极高·-94%</text>
  </g>

  <!-- 右侧组合 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="820" y="112" width="400" height="420" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="848" y="144" font-size="15" font-weight="700" fill="#277653">三个示例组合（示意）</text>
    <rect x="848" y="160" width="344" height="106" rx="8" fill="#EFF3F8"/>
    <text x="864" y="188" font-size="13.5" font-weight="600" fill="#1F3A5C">保守型 · 保购买力</text>
    <rect x="864" y="200" width="120" height="14" fill="#1F3A5C"/><text x="992" y="212" font-size="11" fill="#1F3A5C">现金/债 40%</text>
    <rect x="864" y="218" width="90" height="14" fill="#8A6D1F"/><text x="962" y="230" font-size="11" fill="#8A6D1F">金 30%</text>
    <rect x="864" y="236" width="75" height="14" fill="#277653"/><text x="947" y="248" font-size="11" fill="#277653">股 25%</text>
    <text x="864" y="262" font-size="11" fill="#6E655A">房产 5% · 目标：跑赢通胀</text>

    <rect x="848" y="278" width="344" height="106" rx="8" fill="#F0EAD8"/>
    <text x="864" y="306" font-size="13.5" font-weight="600" fill="#8A6D1F">均衡型 · 全天候思路</text>
    <rect x="864" y="318" width="110" height="14" fill="#277653"/><text x="982" y="330" font-size="11" fill="#277653">股 35%</text>
    <rect x="864" y="336" width="94" height="14" fill="#8A6D1F"/><text x="966" y="348" font-size="11" fill="#8A6D1F">金 25%</text>
    <rect x="864" y="354" width="94" height="14" fill="#1F3A5C"/><text x="966" y="366" font-size="11" fill="#1F3A5C">债 25%</text>
    <rect x="864" y="372" width="55" height="14" fill="#B3541E"/><text x="927" y="384" font-size="11" fill="#B3541E">房15%</text>
    <text x="864" y="398" font-size="11" fill="#6E655A">（Dalio 全天候为原型）</text>

    <rect x="848" y="396" width="344" height="118" rx="8" fill="#FDF6E9"/>
    <text x="864" y="424" font-size="13.5" font-weight="600" fill="#B8860B">进取型 · 高波动容忍</text>
    <rect x="864" y="436" width="150" height="14" fill="#277653"/><text x="1022" y="448" font-size="11" fill="#277653">股 50%</text>
    <rect x="864" y="454" width="80" height="14" fill="#F7931A"/><text x="952" y="466" font-size="11" fill="#B8860B">BTC 15%</text>
    <rect x="864" y="472" width="70" height="14" fill="#8A6D1F"/><text x="942" y="484" font-size="11" fill="#8A6D1F">金 20%</text>
    <rect x="864" y="490" width="55" height="14" fill="#B3541E"/><text x="927" y="502" font-size="11" fill="#B3541E">房15%</text>
    <text x="864" y="520" font-size="11" fill="#6E655A">需能承受组合 -40% 级回撤</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="552" width="1160" height="74" rx="12" fill="#277653"/>
  <text x="90" y="584" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F0E8D8">配置的本质：黄金对冲「货币信用风险」，股票对冲「增长错失风险」，两者相关性低——百年数据里黄金的最好年份（1973-74/2008/2022）恰是股票的坏年份。</text>
  <text x="90" y="612" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#FFFFFF" font-weight="600">「金股平衡」不是折中，是让组合在两种宏观剧本下都不被消灭。（本页为教育示意，非投资建议）</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">定位基于前文数据·组合为教育示意(C)·全天候原型引Dalio(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">18 / 19</text>
</svg>
