<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#FAF8F2"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">时代三 1971-1999：狂喜与幻灭的完整周期</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">$35 → $850 → $252：一轮完整的自由市场定价实验</text>

  <!-- 牛市段 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="572" height="300" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="88" y="146" font-size="15.5" font-weight="700" fill="#B3541E">牛市 1971-1980（9年 ×24倍）</text>
    <!-- 年度柱 1971-1980 (40.62 58.42 97.39 154 160.86 124.74 147.84 193.4 306 615) -->
    <g stroke="#E5DCC8" stroke-width="1">
      <line x1="100" y1="330" x2="620" y2="330"/>
      <line x1="100" y1="270" x2="620" y2="270" stroke-dasharray="4,4"/>
      <line x1="100" y1="210" x2="620" y2="210" stroke-dasharray="4,4"/>
      <line x1="100" y1="150" x2="620" y2="150" stroke-dasharray="4,4"/>
    </g>
    <rect x="120" y="322" width="34" height="8" fill="#8A6D1F"/>
    <rect x="168" y="318" width="34" height="12" fill="#8A6D1F"/>
    <rect x="216" y="310" width="34" height="20" fill="#8A6D1F"/>
    <rect x="264" y="298" width="34" height="32" fill="#8A6D1F"/>
    <rect x="312" y="297" width="34" height="33" fill="#8A6D1F"/>
    <rect x="360" y="304" width="34" height="26" fill="#8A6D1F"/>
    <rect x="408" y="299" width="34" height="31" fill="#8A6D1F"/>
    <rect x="456" y="290" width="34" height="40" fill="#8A6D1F"/>
    <rect x="504" y="266" width="34" height="64" fill="#B3541E"/>
    <rect x="552" y="204" width="34" height="126" fill="#B3541E"/>
    <g font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#6E655A" text-anchor="middle">
      <text x="137" y="346">71</text><text x="185" y="346">72</text><text x="233" y="346">73</text><text x="281" y="346">74</text>
      <text x="329" y="346">75</text><text x="377" y="346">76</text><text x="425" y="346">77</text><text x="473" y="346">78</text>
      <text x="521" y="346">79</text><text x="569" y="346">80</text>
    </g>
    <text x="569" y="196" font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="700" fill="#B3541E" text-anchor="middle">$615(年均)/850(峰)</text>
    <text x="88" y="380" font-size="12.5" fill="#2B2620">驱动：石油危机×2（73/79）+ 美国通胀 13.5%（1980）+</text>
    <text x="88" y="402" font-size="12.5" fill="#2B2620">伊朗人质事件+苏联入侵阿富汗——滞胀与恐慌的完美风暴</text>

    <rect x="648" y="112" width="572" height="300" rx="12" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text x="676" y="146" font-size="15.5" font-weight="700" fill="#1F3A5C">熊市 1980-1999（20年 -70%）</text>
    <!-- 下行折线 850 460(81) 317(85) 384(90) 388(96) 279(99) 252(谷) -->
    <polyline points="700,160 770,255 840,318 900,300 960,299 1030,309 1090,318" fill="none" stroke="#1F3A5C" stroke-width="3"/>
    <g fill="#1F3A5C">
      <circle cx="700" cy="160" r="5"/><circle cx="770" cy="255" r="4"/><circle cx="840" cy="318" r="4"/>
      <circle cx="900" cy="300" r="4"/><circle cx="960" cy="299" r="4"/><circle cx="1030" cy="309" r="4"/>
      <circle cx="1090" cy="318" r="5" fill="#B3541E"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="10.5" fill="#6E655A">
      <text x="688" y="150">$850</text><text x="756" y="245">$460'81</text><text x="826" y="336">$317'85</text>
      <text x="1042" y="336" fill="#B3541E">$252'99</text>
    </g>
    <text x="676" y="380" font-size="12.5" fill="#2B2620">驱动：沃尔克加息至 ~20%（1981）→ 实际利率转正 →</text>
    <text x="676" y="402" font-size="12.5" fill="#2B2620">持金机会成本高企；欧洲央行持续售金；互联网牛市虹吸资金</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="430" width="1160" height="196" rx="12" fill="#2B2620"/>
  <text x="90" y="466" font-family="'PingFang SC', sans-serif" font-size="15.5" font-weight="700" fill="#F0C98A">这 28 年教给后世的两件事</text>
  <text x="90" y="500" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">① 黄金不产生现金流，它的对手是有息资产：当国债实际收益率 5%+ 时，黄金必须跌——1980-2000 不是黄金失效，是美元信用的最强时刻；</text>
  <text x="90" y="530" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">② 恐慌驱动的价格尖峰必然回归：1980 年 $850 的实际价值要到 2026 年才被超越——追高黄金的最坏代价是 46 年的名义等待。</text>
  <text x="90" y="576" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F0C98A" font-weight="600">1980 年顶部买入者：名义回本等了 28 年（2008），实际回本等到 2026——「避险资产」的择时风险不输股票。</text>
<text x="1220" y="694" text-anchor="end" font-family="Helvetica Neue, sans-serif" font-size="13" fill="#8A6D1F">07 / 19</text>
</svg>
