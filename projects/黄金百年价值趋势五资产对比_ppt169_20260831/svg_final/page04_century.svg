<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAF8F2" />
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">百年金价全景（对数刻度）</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">$20.67 → $4,454：一条被制度断点重塑的曲线（对数轴上每等高=同倍数）</text>

  
  <g>
    
    
    <g stroke="#E5DCC8" stroke-width="1">
      <line x1="100" y1="660" x2="1180" y2="660" />
      <line x1="100" y1="520" x2="1180" y2="520" stroke-dasharray="4,4" />
      <line x1="100" y1="422" x2="1180" y2="422" stroke-dasharray="4,4" />
      <line x1="100" y1="298" x2="1180" y2="298" stroke-dasharray="4,4" />
      <line x1="100" y1="150" x2="1180" y2="150" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9184" text-anchor="end">
      <text x="94" y="664">$20</text><text x="94" y="524">$100</text><text x="94" y="426">$200</text>
      <text x="94" y="302">$850</text><text x="94" y="154">$2,000+</text>
    </g>
    
    <line x1="268" y1="130" x2="268" y2="660" stroke="#8A6D1F" stroke-width="1.5" stroke-dasharray="6,4" />
    <line x1="430" y1="130" x2="430" y2="660" stroke="#B3541E" stroke-width="1.5" stroke-dasharray="6,4" />
    <line x1="760" y1="130" x2="760" y2="660" stroke="#277653" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="184" y="122" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#1F3A5C">金本位 1920-33</text>
    <text x="349" y="122" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#8A6D1F">$35管制 1934-71</text>
    <text x="595" y="122" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#B3541E">自由市场 1971-99</text>
    <text x="970" y="122" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#277653">三轮牛市 2000-2026</text>

    
    <polyline points="100,657 200,656 268,573 350,573 430,573 500,520 560,430 590,330 640,298 690,360 760,381 820,440 880,214 940,340 1000,209 1060,272 1100,175 1160,101 1180,150" fill="none" stroke="#8A6D1F" stroke-width="3.5" stroke-linejoin="round" />

    
    <g font-family="'PingFang SC', sans-serif" font-size="11" fill="#2B2620">
      <circle cx="100" cy="657" r="4" fill="#1F3A5C" />
      <text x="112" y="678">$20.67 (1920)</text>
      <circle cx="268" cy="573" r="4" fill="#8A6D1F" />
      <text x="240" y="560">$35 (1934)</text>
      <circle cx="430" cy="573" r="5" fill="#B3541E" />
      <text x="400" y="596">1971 尼克松冲击</text>
      <circle cx="640" cy="298" r="5" fill="#B3541E" />
      <text x="600" y="290">$850 (1980.1)</text>
      <circle cx="760" cy="381" r="5" fill="#B3541E" />
      <text x="742" y="404">$252 (1999)</text>
      <circle cx="880" cy="214" r="5" fill="#277653" />
      <text x="845" y="206">$1,921 (2011)</text>
      <circle cx="1000" cy="209" r="5" fill="#277653" />
      <text x="968" y="232">$2,075 (2020)</text>
      <circle cx="1160" cy="101" r="6" fill="#B3541E" />
      <text x="1064" y="95">$5,589 (2026.1)</text>
      <circle cx="1180" cy="150" r="4" fill="#277653" />
      <text x="1105" y="168">$4,454 (2026.8)</text>
    </g>
    <text x="640" y="690" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">横轴为年代进程（示意等距）；纵轴对数——1971前后的「平台」是法定价格，不是市场平静</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#2B2620" d="M72,510 H1208 A12,12 0 0 1 1220,522 V618 A12,12 0 0 1 1208,630 H72 A12,12 0 0 1 60,618 V522 A12,12 0 0 1 72,510 Z" />
    <text x="90" y="544" font-size="15" font-weight="600" fill="#F0C98A">读图三要点</text>
    <text x="90" y="574" font-size="14" fill="#F5F0E4">① 1971 年前的直线不是稳定，是「无市场」——价格被法律固定，曲线只是制度的外形；② 1980 与 2011 两个峰之间隔着 28 年——黄金的世纪由少数几段爆发构成，其余是漫长等待；</text>
    <text x="90" y="602" font-size="14" fill="#F5F0E4">③ 2026.1 的 $5,589 已超过 1980 峰值的通胀调整值（~$3,200）——本轮牛市在「实际」意义上也是百年最强。</text>
  </g>

  <text x="60" y="712" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：NMA年度均价(1920-2004)+Kitco/LBMA(2005-2026)·峰值月份点为当月极值(A-/A)</text>
  <text x="1220" y="712" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">04 / 19</text>
</svg>