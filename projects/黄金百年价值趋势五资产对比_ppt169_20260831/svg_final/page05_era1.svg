<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAF8F2" />
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">时代一 1920-1933：黄金不是商品，是价格的定义</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">金本位下没有「金价」，只有「美元的定义」</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DCC8" d="M72,112 H620 A12,12 0 0 1 632,124 V380 A12,12 0 0 1 620,392 H72 A12,12 0 0 1 60,380 V124 A12,12 0 0 1 72,112 Z" />
    <text x="88" y="146" font-size="15.5" font-weight="700" fill="#1F3A5C">金本位的运行逻辑</text>
    <text x="88" y="180" font-size="13.5" fill="#2B2620">1900年金本位法案：1美元 = 1/20.67 金衡盎司黄金</text>
    <path fill="#F0EAD8" d="M96,196 H596 A8,8 0 0 1 604,204 V240 A8,8 0 0 1 596,248 H96 A8,8 0 0 1 88,240 V204 A8,8 0 0 1 96,196 Z" />
    <text x="346" y="220" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" fill="#8A6D1F" font-weight="600">1 oz Gold = $20.67（1834年定，近百年未变）</text>
    <text x="346" y="240" text-anchor="middle" font-size="11.5" fill="#9B9184">牛顿1717年为英国定金价£3.17s.10d.，维持两百年——金本位的耐久是制度史奇观</text>
    <text x="88" y="282" font-size="13" fill="#2B2620">· 纸币是黄金的「仓单」，央行须随时兑付</text>
    <text x="88" y="308" font-size="13" fill="#2B2620">· 1920年代年均金价 $20.64-21.32，波动&lt;3%</text>
    <text x="88" y="334" font-size="13" fill="#2B2620">· 「通胀」在金本位下是百年尺度±1%的微澜</text>
    <text x="88" y="366" font-size="13" fill="#8A6D1F" font-weight="600">代价：政府不能印钞救危机——这正是大萧条的火药</text>

    <path fill="#FFFFFF" stroke="#E5DCC8" d="M660,112 H1208 A12,12 0 0 1 1220,124 V380 A12,12 0 0 1 1208,392 H660 A12,12 0 0 1 648,380 V124 A12,12 0 0 1 660,112 Z" />
    <text x="676" y="146" font-size="15.5" font-weight="700" fill="#B3541E">1931-1933：金本位的死亡时刻</text>
    <text x="676" y="180" font-size="13" fill="#2B2620">· 1931 英国弃金本位，全球链式脱钩</text>
    <text x="676" y="206" font-size="13" fill="#2B2620">· 1931 美国年均金价跌至 $17.06（通缩紧咬）</text>
    <text x="676" y="232" font-size="13" fill="#2B2620">· 1933.4 罗斯福 6102 行政令：禁止民间持金，</text>
    <text x="676" y="256" font-size="13" fill="#2B2620">　 全民按 $20.67 上缴金币金条</text>
    <text x="676" y="282" font-size="13" fill="#2B2620">· 1934 黄金储备法：官价重估 $35</text>
    <path fill="#F8E8E0" d="M684,298 H1184 A8,8 0 0 1 1192,306 V360 A8,8 0 0 1 1184,368 H684 A8,8 0 0 1 676,360 V306 A8,8 0 0 1 684,298 Z" />
    <text x="934" y="324" text-anchor="middle" font-size="13" fill="#B3541E" font-weight="600">一步之差：上缴时收 $20.67，政府转手值 $35</text>
    <text x="934" y="346" text-anchor="middle" font-size="12.5" fill="#B3541E">美元对黄金一次性贬值 41%——「合法违约」的教科书案例</text>
  </g>

  
  <path fill="#1F3A5C" d="M72,412 H1208 A12,12 0 0 1 1220,424 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V424 A12,12 0 0 1 72,412 Z" />
  <text x="90" y="450" font-family="'PingFang SC', sans-serif" font-size="15.5" font-weight="700" fill="#F0C98A">为什么这一段决定了对黄金的百年认知</text>
  <text x="90" y="484" font-family="'PingFang SC', sans-serif" font-size="14" fill="#D5DEE8">· 金本位给人留下的记忆是「绝对稳定」——此后每一次法币动荡，这个记忆都被重新唤醒，成为黄金需求的心理学底层；</text>
  <text x="90" y="514" font-family="'PingFang SC', sans-serif" font-size="14" fill="#D5DEE8">· 1933 年的没收证明：即使是美国，「持金权」也可以被行政令终结——黄金的「绝对安全」自始就带着主权风险的对价；</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#D5DEE8">· $20.67 → $35 的重估，是理解后面 21,700% 涨幅的原点：金价史的第一课不是市场课，是制度课。</text>
  <text x="90" y="590" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F0C98A" font-weight="600">给今天的读者：黄金的「信用」不是金属属性，是金本位五千年制度记忆的残响。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：NMA金价年表/Wikipedia金本位法案(1900)/6102行政令原文(A-/B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">05 / 19</text>
</svg>