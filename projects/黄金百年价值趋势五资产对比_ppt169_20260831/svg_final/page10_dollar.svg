<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAF8F2" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F3A5C" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">美元百年：-97% 的购买力衰减史</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">1913 年的 $100 = 2026 年的 $3,364（BLS CPI-U 官方口径）</text>

  
  <g>
    <text x="80" y="126" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#1F3A5C">$100（1913年币值）的实际购买力</text>
    <g stroke="#E5DCC8" stroke-width="1">
      <line x1="100" y1="420" x2="700" y2="420" />
      <line x1="100" y1="350" x2="700" y2="350" stroke-dasharray="4,4" />
      <line x1="100" y1="280" x2="700" y2="280" stroke-dasharray="4,4" />
      <line x1="100" y1="210" x2="700" y2="210" stroke-dasharray="4,4" />
      <line x1="100" y1="150" x2="700" y2="150" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9184" text-anchor="end">
      <text x="94" y="424">$0</text><text x="94" y="354">$25</text><text x="94" y="284">$50</text>
      <text x="94" y="214">$75</text><text x="94" y="154">$100</text>
    </g>
    
    <polyline points="110,150 190,231 280,266 370,296 440,319 500,378 550,405 600,413 650,421 680,425 700,427" fill="none" stroke="#1F3A5C" stroke-width="3.5" />
    <g fill="#1F3A5C">
      <circle cx="110" cy="150" r="5" /><circle cx="440" cy="319" r="4" /><circle cx="500" cy="378" r="5" fill="#B3541E" />
      <circle cx="700" cy="427" r="5" fill="#B3541E" />
    </g>
    <g font-family="'PingFang SC', sans-serif" font-size="11" fill="#6E655A">
      <text x="104" y="140">1913: $100</text>
      <text x="410" y="308">1971: $26</text>
      <text x="470" y="400" fill="#B3541E">1980: $12.5</text>
      <text x="620" y="445" fill="#B3541E">2026: $2.97</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9184" text-anchor="middle">
      <text x="110" y="442">1913</text><text x="250" y="442">1940</text><text x="390" y="442">1965</text>
      <text x="500" y="442">1980</text><text x="620" y="442">2005</text><text x="700" y="442">2026</text>
    </g>
    <text x="400" y="470" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">累计通胀 +3,264%，年均 3.16%——温水式贬值的复利力量</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DCC8" d="M752,112 H1208 A12,12 0 0 1 1220,124 V480 A12,12 0 0 1 1208,492 H752 A12,12 0 0 1 740,480 V124 A12,12 0 0 1 752,112 Z" />
    <text x="768" y="146" font-size="15.5" font-weight="700" fill="#1F3A5C">贬值的三个速度档</text>
    <path fill="#EFF3F8" d="M776,164 H1184 A8,8 0 0 1 1192,172 V244 A8,8 0 0 1 1184,252 H776 A8,8 0 0 1 768,244 V172 A8,8 0 0 1 776,164 Z" />
    <text x="786" y="192" font-size="13.5" font-weight="600" fill="#277653">慢档 1913-1971（金本位余晖）</text>
    <text x="786" y="216" font-size="12.5" fill="#6E655A">年均通胀 ~2%，58 年购买力 -74%</text>
    <text x="786" y="238" font-size="12.5" fill="#6E655A">锚的残存：央行仍名义上可兑金</text>
    <path fill="#FDF6E9" d="M776,262 H1184 A8,8 0 0 1 1192,270 V342 A8,8 0 0 1 1184,350 H776 A8,8 0 0 1 768,342 V270 A8,8 0 0 1 776,262 Z" />
    <text x="786" y="290" font-size="13.5" font-weight="600" fill="#B8860B">快档 1971-2000（信用本位初建）</text>
    <text x="786" y="314" font-size="12.5" fill="#6E655A">年均通胀 ~5%，两次石油危机冲顶 13.5%</text>
    <text x="786" y="336" font-size="12.5" fill="#6E655A">沃尔克 20% 利率的代价：衰退换锚定</text>
    <path fill="#F8E8E0" d="M776,360 H1184 A8,8 0 0 1 1192,368 V460 A8,8 0 0 1 1184,468 H776 A8,8 0 0 1 768,460 V368 A8,8 0 0 1 776,360 Z" />
    <text x="786" y="388" font-size="13.5" font-weight="600" fill="#B3541E">稳态档 2000-2026（2% 通胀目标制）</text>
    <text x="786" y="412" font-size="12.5" fill="#6E655A">年均 ~2.6%，但 2021-22 冲至 9% 四十年峰值</text>
    <text x="786" y="434" font-size="12.5" fill="#6E655A">「温和通胀」是政策目标而非意外——</text>
    <text x="786" y="456" font-size="12.5" fill="#6E655A">贬值的制度化：每年目标 -2%</text>
  </g>

  
  <path fill="#1F3A5C" d="M72,514 H1208 A12,12 0 0 1 1220,526 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V526 A12,12 0 0 1 72,514 Z" />
  <text x="90" y="550" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F0C98A">关键认知：美元的「强」与「弱」要分开看</text>
  <text x="90" y="582" font-family="'PingFang SC', sans-serif" font-size="14" fill="#D5DEE8">对其他法币，美元百年总体偏强（指数视角）；对实物与黄金，美元百年持续走弱（购买力视角）。两个都真——</text>
  <text x="90" y="610" font-family="'PingFang SC', sans-serif" font-size="14" fill="#D5DEE8">「最不烂的法币」依然是持续变薄的法币：这正是不持有现金的理由，也是黄金 +21,700% 的需求之井。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：BLS CPI-U(A)·officialdata/inflationcalculator交叉(A-)·曲线为官方CPI换算</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">10 / 19</text>
</svg>