<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAF8F2" />
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">央行购金新纪元：黄金的「主权买家」时代</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">2022-2024 连续三年超千吨——1971 年以来首次</text>

  
  <g>
    <text x="80" y="126" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#8A6D1F">全球央行年度净购金量（吨）</text>
    <g stroke="#E5DCC8" stroke-width="1">
      <line x1="100" y1="440" x2="700" y2="440" />
      <line x1="100" y1="370" x2="700" y2="370" stroke-dasharray="4,4" />
      <line x1="100" y1="300" x2="700" y2="300" stroke-dasharray="4,4" />
      <line x1="100" y1="230" x2="700" y2="230" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9184" text-anchor="end">
      <text x="94" y="444">0</text><text x="94" y="374">300</text><text x="94" y="304">600</text><text x="94" y="234">900</text>
    </g>
    
    <rect x="140" y="322" width="46" height="118" fill="#C9B88A" />
    <rect x="230" y="380" width="46" height="60" fill="#C9B88A" />
    <rect x="320" y="327" width="46" height="113" fill="#C9B88A" />
    <rect x="410" y="187" width="46" height="253" fill="#8A6D1F" />
    <rect x="500" y="195" width="46" height="245" fill="#8A6D1F" />
    <rect x="590" y="193" width="46" height="247" fill="#B3541E" />
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#2B2620" text-anchor="middle">
      <text x="163" y="314">~470</text><text x="253" y="372">255</text><text x="343" y="319">450</text>
      <text x="433" y="179" fill="#8A6D1F" font-size="13">1,081</text><text x="523" y="187" fill="#8A6D1F">1,037</text><text x="613" y="185" fill="#B3541E">1,045</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11.5" fill="#9B9184" text-anchor="middle">
      <text x="163" y="460">'10s均值</text><text x="253" y="460">2020</text><text x="343" y="460">2021</text>
      <text x="433" y="460">2022</text><text x="523" y="460">2023</text><text x="613" y="460">2024</text>
    </g>
    <text x="400" y="486" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">来源：World Gold Council（A 级）·2022 为 1967 年以来最高</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DCC8" d="M752,112 H1208 A12,12 0 0 1 1220,124 V430 A12,12 0 0 1 1208,442 H752 A12,12 0 0 1 740,430 V124 A12,12 0 0 1 752,112 Z" />
    <text x="768" y="146" font-size="15.5" font-weight="700" fill="#B3541E">触发器：2022 的金融武器化</text>
    <path fill="#F8E8E0" d="M776,162 H1184 A8,8 0 0 1 1192,170 V218 A8,8 0 0 1 1184,226 H776 A8,8 0 0 1 768,218 V170 A8,8 0 0 1 776,162 Z" />
    <text x="980" y="188" text-anchor="middle" font-size="13" fill="#B3541E" font-weight="600">俄罗斯央行 ~$3,000 亿储备被冻结</text>
    <text x="980" y="210" text-anchor="middle" font-size="12.5" fill="#B3541E">主权资产首次被「一键扣押」示范</text>
    <text x="768" y="252" font-size="13" fill="#2B2620">储备管理人的新公式：</text>
    <text x="768" y="280" font-size="13" fill="#2B2620">「安全资产 = 不在任何对手资产负债表上」</text>
    <text x="768" y="308" font-size="13" fill="#2B2620">→ 黄金（实物/境内金库）成为唯一合格项</text>
    <path fill="#F0EAD8" d="M776,330 H1184 A8,8 0 0 1 1192,338 V412 A8,8 0 0 1 1184,420 H776 A8,8 0 0 1 768,412 V338 A8,8 0 0 1 776,330 Z" />
    <text x="980" y="358" text-anchor="middle" font-size="12.5" fill="#8A6D1F" font-weight="600">买家结构质变：新兴市场央行主导</text>
    <text x="980" y="380" text-anchor="middle" font-size="12" fill="#6E655A">（波兰/土耳其/印度/中国…），买在西方</text>
    <text x="980" y="400" text-anchor="middle" font-size="12" fill="#6E655A">ETF 流出的同时——价格发现权东移</text>
  </g>

  
  <path fill="#2B2620" d="M72,462 H1208 A12,12 0 0 1 1220,474 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V474 A12,12 0 0 1 72,462 Z" />
  <text x="90" y="498" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F0C98A">为什么这一轮牛市「不一样」（三个结构性理由）</text>
  <text x="90" y="530" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">① 买家是对价格最不敏感的主体——央行购金基于安全逻辑而非收益逻辑，跌了不卖、涨了还买；</text>
  <text x="90" y="560" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">② 实际利率与金价的旧相关性被打破（2022-23 正利率+金价涨）——央行需求成为第二引擎；</text>
  <text x="90" y="590" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5F0E4">③ 去美元化是十年尺度的慢变量——只要储备多元化继续，黄金的需求曲线就持续右移。</text>
</svg>