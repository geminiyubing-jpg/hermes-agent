<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAF8F2" />
  <rect x="0" y="0" width="1280" height="6" fill="#8A6D1F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">执行摘要：五个世纪判断</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">先给结论，再给证据——每一页判断都可在后文找到数据出处</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="108" width="1160" height="36" fill="#2B2620" />
    <text x="140" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">资产</text>
    <text x="350" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">百年名义回报</text>
    <text x="580" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">年化(名义)</text>
    <text x="800" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">最深回撤</text>
    <text x="1090" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F0C98A">一句话定位</text>

    <rect x="60" y="144" width="1160" height="44" fill="#FFFFFF" />
    <circle cx="140" cy="166" r="6" fill="#8A6D1F" /><text x="158" y="171" font-size="13" font-weight="600" fill="#2B2620">黄金</text>
    <text x="350" y="171" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#8A6D1F">+21,700%（100年）</text>
    <text x="580" y="171" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#2B2620">≈5.4%</text>
    <text x="800" y="171" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#B3541E">-70%（1980-99）</text>
    <text x="1090" y="171" text-anchor="middle" font-size="12.5" fill="#6E655A">法币信用的对冲镜像</text>

    <rect x="60" y="188" width="1160" height="44" fill="#F6F1E6" />
    <circle cx="140" cy="210" r="6" fill="#1F3A5C" /><text x="158" y="215" font-size="13" font-weight="600" fill="#2B2620">美元现金</text>
    <text x="350" y="215" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#1F3A5C">-97%（购买力）</text>
    <text x="580" y="215" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#2B2620">≈-3.2%（实际）</text>
    <text x="800" y="215" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#B3541E">持续阴跌</text>
    <text x="1090" y="215" text-anchor="middle" font-size="12.5" fill="#6E655A">流动性换贬值的交易</text>

    <rect x="60" y="232" width="1160" height="44" fill="#FFFFFF" />
    <circle cx="140" cy="254" r="6" fill="#277653" /><text x="158" y="259" font-size="13" font-weight="600" fill="#2B2620">美股(S&amp;P500)</text>
    <text x="350" y="259" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#277653">7,550倍（100年）</text>
    <text x="580" y="259" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#2B2620">≈9.5%</text>
    <text x="800" y="259" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#B3541E">-89%（1929-32）</text>
    <text x="1090" y="259" text-anchor="middle" font-size="12.5" fill="#6E655A">复利之王·增长捕获</text>

    <rect x="60" y="276" width="1160" height="44" fill="#F6F1E6" />
    <circle cx="140" cy="298" r="6" fill="#B3541E" /><text x="158" y="303" font-size="13" font-weight="600" fill="#2B2620">核心城市房产</text>
    <text x="350" y="303" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#B3541E">+10,000%（Manhattan·美元）</text>
    <text x="580" y="303" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#2B2620">≈4.8%（美元）</text>
    <text x="800" y="303" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#B3541E">黄金计价≈+25%/百年</text>
    <text x="1090" y="303" text-anchor="middle" font-size="12.5" fill="#6E655A">法币幻觉的主要载体</text>

    <rect x="60" y="320" width="1160" height="44" fill="#FFFFFF" />
    <circle cx="140" cy="342" r="6" fill="#F7931A" /><text x="158" y="347" font-size="13" font-weight="600" fill="#2B2620">比特币</text>
    <text x="350" y="347" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#F7931A">+74,241%（13年）</text>
    <text x="580" y="347" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#2B2620">年化极高</text>
    <text x="800" y="347" text-anchor="middle" font-size="13" font-family="'Helvetica Neue', sans-serif" fill="#B3541E">-77~-94%×5轮</text>
    <text x="1090" y="347" text-anchor="middle" font-size="12.5" fill="#6E655A">实验中的数字硬通货</text>
  </g>
  <rect x="60" y="108" width="1160" height="256" fill="none" stroke="#E5DCC8" />

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DCC8" d="M72,386 H620 A12,12 0 0 1 632,398 V614 A12,12 0 0 1 620,626 H72 A12,12 0 0 1 60,614 V398 A12,12 0 0 1 72,386 Z" />
    <text x="88" y="418" font-size="15" font-weight="700" fill="#8A6D1F">世纪判断 ①②③</text>
    <text x="88" y="450" font-size="13.5" fill="#2B2620" font-weight="600">① 黄金是美元的镜像</text>
    <text x="108" y="472" font-size="12.5" fill="#6E655A">+21,700% 与 -97% 是同一枚硬币的两面（P10-11）</text>
    <text x="88" y="502" font-size="13.5" fill="#2B2620" font-weight="600">② 1971 是百年分水岭</text>
    <text x="108" y="524" font-size="12.5" fill="#6E655A">此前黄金是「价格的定义」，此后才有市场定价（P5-7）</text>
    <text x="88" y="554" font-size="13.5" fill="#2B2620" font-weight="600">③ 实际利率是黄金的命门</text>
    <text x="108" y="576" font-size="12.5" fill="#6E655A">1980 沃尔克加息杀死金价；2001/2020 两轮负利率造两轮牛市（P9）</text>
    <text x="88" y="606" font-size="12.5" fill="#8A6D1F" font-weight="600">2026 金价已超 1980 实际高点——这是实际新高，不是名义幻觉</text>

    <path fill="#2B2620" d="M660,386 H1208 A12,12 0 0 1 1220,398 V614 A12,12 0 0 1 1208,626 H660 A12,12 0 0 1 648,614 V398 A12,12 0 0 1 660,386 Z" />
    <text x="676" y="418" font-size="15" font-weight="700" fill="#F0C98A">世纪判断 ④⑤</text>
    <text x="676" y="450" font-size="13.5" fill="#F5F0E4" font-weight="600">④ 房地产保值的真相</text>
    <text x="696" y="472" font-size="12.5" fill="#C7BFA8">曼哈顿百年美元 +10,000%，黄金计价仅 +25%——</text>
    <text x="696" y="492" font-size="12.5" fill="#C7BFA8">「保值」的本质是法币贬值+杠杆+租金（P14-15）</text>
    <text x="676" y="522" font-size="13.5" fill="#F5F0E4" font-weight="600">⑤ 五资产各司其职</text>
    <text x="696" y="544" font-size="12.5" fill="#C7BFA8">美元付账、股票生息、房产安身、黄金锚信、</text>
    <text x="696" y="564" font-size="12.5" fill="#C7BFA8">比特币下注——没有全能冠军，只有组合（P19-20）</text>
    <text x="676" y="606" font-size="13" fill="#F0C98A" font-weight="600">方法论：全部数字两源验证，来源分级标注</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：NMA/LBMA(A-)·BLS(A)·NYU-Stern(A-)·gold-eagle等(B+)·CoinMarketCap归档(A-)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">02 / 19</text>
</svg>