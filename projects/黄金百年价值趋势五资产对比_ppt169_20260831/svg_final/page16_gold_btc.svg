<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAF8F2" />
  <rect x="0" y="0" width="1280" height="6" fill="#F7931A" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">对比④ 黄金 vs 比特币：5000 年 vs 15 年</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">两种「供给刚性货币」的对话——一个是文明的记忆，一个是代码的实验</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="108" width="1160" height="36" fill="#2B2620" />
    <text x="230" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">维度</text>
    <text x="530" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8A6D1F">黄金</text>
    <text x="900" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F7931A">比特币</text>

    <rect x="60" y="144" width="1160" height="44" fill="#FFFFFF" />
    <text x="230" y="172" text-anchor="middle" font-size="13" font-weight="600">供给</text>
    <text x="530" y="172" text-anchor="middle" font-size="12.5">地上存量 ~21万吨，年增 ~1.5%</text>
    <text x="900" y="172" text-anchor="middle" font-size="12.5">2,100万枚硬顶，四年减半</text>

    <rect x="60" y="188" width="1160" height="44" fill="#F6F1E6" />
    <text x="230" y="216" text-anchor="middle" font-size="13" font-weight="600">历史</text>
    <text x="530" y="216" text-anchor="middle" font-size="12.5">5,000+ 年货币史，跨文明共识</text>
    <text x="900" y="216" text-anchor="middle" font-size="12.5">2009 创世，15 年 +74,241%</text>

    <rect x="60" y="232" width="1160" height="44" fill="#FFFFFF" />
    <text x="230" y="260" text-anchor="middle" font-size="13" font-weight="600">最深回撤</text>
    <text x="530" y="260" text-anchor="middle" font-size="12.5" fill="#8A6D1F">-70%（1980-1999，20年）</text>
    <text x="900" y="260" text-anchor="middle" font-size="12.5" fill="#B3541E">-94%（2011），五轮 -50%~-94%</text>

    <rect x="60" y="276" width="1160" height="44" fill="#F6F1E6" />
    <text x="230" y="304" text-anchor="middle" font-size="13" font-weight="600">主权风险</text>
    <text x="530" y="304" text-anchor="middle" font-size="12.5">1933 年被美国行政令没收过</text>
    <text x="900" y="304" text-anchor="middle" font-size="12.5">交易所暴雷(Mt.Gox/FTX)+监管摇摆</text>

    <rect x="60" y="320" width="1160" height="44" fill="#FFFFFF" />
    <text x="230" y="348" text-anchor="middle" font-size="13" font-weight="600">机构接纳</text>
    <text x="530" y="348" text-anchor="middle" font-size="12.5">央行储备资产（千年传统）</text>
    <text x="900" y="348" text-anchor="middle" font-size="12.5">2024.1 现货ETF·市值$1.6-1.9T</text>

    <rect x="60" y="364" width="1160" height="44" fill="#F6F1E6" />
    <text x="230" y="392" text-anchor="middle" font-size="13" font-weight="600">相关性 2024-26</text>
    <text x="530" y="392" text-anchor="middle" font-size="12.5">同涨段「数字黄金」叙事强化</text>
    <text x="900" y="392" text-anchor="middle" font-size="12.5">2026 回撤 -50%：仍远比黄金波动</text>
  </g>
  <rect x="60" y="108" width="1160" height="300" fill="none" stroke="#E5DCC8" />

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#8A6D1F" d="M72,428 H620 A12,12 0 0 1 632,440 V614 A12,12 0 0 1 620,626 H72 A12,12 0 0 1 60,614 V440 A12,12 0 0 1 72,428 Z" />
    <text x="88" y="462" font-size="15" font-weight="700" fill="#FFFFFF">黄金派的论点</text>
    <text x="88" y="494" font-size="13" fill="#F0E8D4">· 千年共识无法被代码复刻——信任的最长回测</text>
    <text x="88" y="522" font-size="13" fill="#F0E8D4">· 央行买的是金条不是私钥：主权接纳差万倍</text>
    <text x="88" y="550" font-size="13" fill="#F0E8D4">· 比特币五次腰斩以上的波动，无法承担「锚」的功能</text>
    <text x="88" y="584" font-size="13" fill="#FFFFFF" font-weight="600">Schiff/Krugman 百年立场：内在价值论</text>

    <path fill="#2B2620" d="M660,428 H1208 A12,12 0 0 1 1220,440 V614 A12,12 0 0 1 1208,626 H660 A12,12 0 0 1 648,614 V440 A12,12 0 0 1 660,428 Z" />
    <text x="676" y="462" font-size="15" font-weight="700" fill="#F7931A">比特币派的论点</text>
    <text x="676" y="494" font-size="13" fill="#F5F0E4">· 可分割/可验证/可自托管——科技属性胜过金属</text>
    <text x="676" y="522" font-size="13" fill="#F5F0E4">· 增发率当前已低于黄金（<tspan font-family="'Helvetica Neue', sans-serif">&lt;1%</tspan>/年）——更「硬」</text>
    <text x="676" y="550" font-size="13" fill="#F5F0E4">· ETF 时代机构持仓起飞：市值 $1.6T ≈ 黄金的 1/12</text>
    <text x="676" y="584" font-size="13" fill="#F7931A" font-weight="600">每轮周期收益递减（+8000%→+22x→+8x）＝走向成熟</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：CoinMarketCap归档(A-)·WGC(A)·评论引述为公开立场(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">15 / 19</text>
</svg>