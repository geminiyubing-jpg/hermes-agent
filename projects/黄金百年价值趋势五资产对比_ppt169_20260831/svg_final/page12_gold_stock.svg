<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAF8F2" />
  <rect x="0" y="0" width="1280" height="6" fill="#277653" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">对比② 黄金 vs 美股：复利之王的含金量</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">百年总回报美股碾压黄金 3 倍——但「分段」看，胜负远非一边倒</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <text x="80" y="126" font-size="15" font-weight="600" fill="#277653">百年总回报（1924/26 → 2024/26，含股息/名义）</text>
    
    <path fill="#8A6D1F" d="M108,146 H422 A8,8 0 0 1 430,154 V178 A8,8 0 0 1 422,186 H108 A8,8 0 0 1 100,178 V154 A8,8 0 0 1 108,146 Z" />
    <text x="250" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">黄金 +21,700%（×217）</text>
    <path fill="#277653" d="M108,198 H672 A8,8 0 0 1 680,206 V230 A8,8 0 0 1 672,238 H108 A8,8 0 0 1 100,230 V206 A8,8 0 0 1 108,198 Z" />
    <text x="390" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">美股 S&amp;P500 含股息 ×7,550（+755,000%）</text>
    <text x="700" y="224" font-size="12.5" fill="#6E655A">← 年化 9.5% vs 黄金 5.4%</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="262" width="1160" height="36" fill="#2B2620" />
    <text x="230" y="286" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">时期</text>
    <text x="530" y="286" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8A6D1F">黄金</text>
    <text x="800" y="286" text-anchor="middle" font-size="13.5" font-weight="600" fill="#277653">美股（含股息）</text>
    <text x="1090" y="286" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F0C98A">赢家</text>

    <rect x="60" y="298" width="1160" height="40" fill="#FFFFFF" />
    <text x="230" y="324" text-anchor="middle" font-size="12.5">1971-1980（滞胀）</text>
    <text x="530" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#8A6D1F">+2,300%</text>
    <text x="800" y="324" text-anchor="middle" font-size="12.5" fill="#2B2620">约 +190%</text>
    <text x="1090" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#8A6D1F">黄金（碾压）</text>

    <rect x="60" y="338" width="1160" height="40" fill="#F6F1E6" />
    <text x="230" y="364" text-anchor="middle" font-size="12.5">1980-2000（大牛市）</text>
    <text x="530" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#B3541E">-70%</text>
    <text x="800" y="364" text-anchor="middle" font-size="12.5" fill="#2B2620">约 +2,500%</text>
    <text x="1090" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#277653">美股（碾压）</text>

    <rect x="60" y="378" width="1160" height="40" fill="#FFFFFF" />
    <text x="230" y="404" text-anchor="middle" font-size="12.5">2000-2011（危机十年）</text>
    <text x="530" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#8A6D1F">+659%</text>
    <text x="800" y="404" text-anchor="middle" font-size="12.5" fill="#2B2620">约 +12%（含两次腰斩）</text>
    <text x="1090" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#8A6D1F">黄金（碾压）</text>

    <rect x="60" y="418" width="1160" height="40" fill="#F6F1E6" />
    <text x="230" y="444" text-anchor="middle" font-size="12.5">2011-2015（QE退潮）</text>
    <text x="530" y="444" text-anchor="middle" font-size="13" font-weight="700" fill="#B3541E">-45%</text>
    <text x="800" y="444" text-anchor="middle" font-size="12.5" fill="#2B2620">约 +85%</text>
    <text x="1090" y="444" text-anchor="middle" font-size="13" font-weight="700" fill="#277653">美股</text>

    <rect x="60" y="458" width="1160" height="40" fill="#FFFFFF" />
    <text x="230" y="484" text-anchor="middle" font-size="12.5">2000-2026（本世纪）</text>
    <text x="530" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#8A6D1F">+1,500%</text>
    <text x="800" y="484" text-anchor="middle" font-size="12.5" fill="#2B2620">约 +500%</text>
    <text x="1090" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#8A6D1F">黄金（领先）</text>
  </g>
  <rect x="60" y="262" width="1160" height="236" fill="none" stroke="#E5DCC8" />

  
  <path fill="#277653" d="M72,516 H1208 A12,12 0 0 1 1220,528 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V528 A12,12 0 0 1 72,516 Z" />
  <text x="90" y="552" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F0E8D8">结论：美股与黄金是「轮动的镜像」，不是永恒的优劣</text>
  <text x="90" y="584" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F2EA">法币信用强（增长+低通胀+高实际利率）→ 美股为王、黄金沉睡；法币信用弱（滞胀/危机/扩表）→ 黄金称雄、股票估值承压。</text>
  <text x="90" y="612" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#FFFFFF" font-weight="600">百年年化差 4 个百分点（9.5% vs 5.4%）——但这 4 点全部来自「选对时代」；两者的冠军期恰好错开，这正是配置的意义。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：NYU-Stern Damodaran数据集(A-)·分段收益多源计算(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8A6D1F">12 / 19</text>
</svg>