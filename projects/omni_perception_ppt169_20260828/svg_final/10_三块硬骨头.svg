<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">空间 · 触觉 · 本体：三块硬骨头</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">连接系列第二、三篇的主题在全模态语境下的位置</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H416 A12,12 0 0 1 428,130 V506 A12,12 0 0 1 416,518 H72 A12,12 0 0 1 60,506 V130 A12,12 0 0 1 72,118 Z" />
    <rect x="60" y="118" width="368" height="4" fill="#C0392B" />
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#C0392B">空间感知：最顽固</text>
    <g font-size="13" fill="#1A2433">
      <text x="84" y="186">现状方案：</text>
      <text x="104" y="212">· Cosmos 3 三参照系空间 QA</text>
      <text x="124" y="236">（自我/世界/物体中心）</text>
      <text x="104" y="262">· Gemini 3 原生 3D 物体理解</text>
      <text x="104" y="288">· 认知地图外挂（BSC-Nav）</text>
      <text x="84" y="336" font-weight="bold" fill="#C0392B">判决未变：</text>
      <text x="104" y="362">SPACE 基准——心理旋转/</text>
      <text x="104" y="386">视角切换仍近随机</text>
      <text x="84" y="430" fill="#51617A" font-size="12.5">系列②已证：这是"结构缺失"</text>
      <text x="84" y="454" fill="#51617A" font-size="12.5">不是"数据不够"——补课</text>
      <text x="84" y="478" fill="#51617A" font-size="12.5">（空间 QA/3D 原生）只能渐进</text>
      <text x="84" y="500" fill="#8494AB" font-size="12">详见系列第二篇</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M468,118 H812 A12,12 0 0 1 824,130 V506 A12,12 0 0 1 812,518 H468 A12,12 0 0 1 456,506 V130 A12,12 0 0 1 468,118 Z" />
    <rect x="456" y="118" width="368" height="4" fill="#6D4FC2" />
    <text x="480" y="152" font-size="16" font-weight="bold" fill="#6D4FC2">触觉：起步但缺基座</text>
    <g font-size="13" fill="#1A2433">
      <text x="480" y="186">现状方案：</text>
      <text x="500" y="212">· Figure 03 指尖 3g 力敏</text>
      <text x="520" y="236">（区分握稳/将滑）</text>
      <text x="500" y="262">· 视触联合模型（研究方向）</text>
      <text x="500" y="288">· 电子皮肤（材料学方向）</text>
      <text x="480" y="336" font-weight="bold" fill="#6D4FC2">核心缺位：</text>
      <text x="500" y="362">视觉有 ViT、音频有 AuT</text>
      <text x="500" y="386">——触觉没有通用基础模型</text>
      <text x="480" y="430" fill="#51617A" font-size="12.5">难点：触觉数据无法从互联网爬取</text>
      <text x="480" y="454" fill="#51617A" font-size="12.5">（必须真机采集），无统一传感器</text>
      <text x="480" y="478" fill="#51617A" font-size="12.5">标准（各家力敏阵列不兼容）</text>
      <text x="480" y="502" fill="#8494AB" font-size="12">详见系列第三篇 Figure 03</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M864,118 H1208 A12,12 0 0 1 1220,130 V506 A12,12 0 0 1 1208,518 H864 A12,12 0 0 1 852,506 V130 A12,12 0 0 1 864,118 Z" />
    <rect x="852" y="118" width="368" height="4" fill="#1E8E3E" />
    <text x="876" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">本体感觉：具身标配</text>
    <g font-size="13" fill="#1A2433">
      <text x="876" y="186">现状方案：</text>
      <text x="896" y="212">· GR00T 本体编码器：按机体</text>
      <text x="916" y="236">ID 索引的 MLP——同一模型</text>
      <text x="916" y="260">控制不同身体</text>
      <text x="896" y="288">· 状态相对动作块（更平滑）</text>
      <text x="876" y="336" font-weight="bold" fill="#1E8E3E">局限：</text>
      <text x="896" y="362">每个新机体仍需单独适配</text>
      <text x="896" y="386">+ 少量演示微调</text>
      <text x="876" y="430" fill="#51617A" font-size="12.5">人类儿童换身体长高 30cm</text>
      <text x="896" y="454" fill="#51617A" font-size="12.5">无需重学走路——AI 的</text>
      <text x="896" y="478" fill="#51617A" font-size="12.5">"身体图式"适应能力仍远逊</text>
      <text x="876" y="502" fill="#8494AB" font-size="12">详见系列第三篇 GR00T</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,544 H1208 A12,12 0 0 1 1220,556 V644 A12,12 0 0 1 1208,656 H72 A12,12 0 0 1 60,644 V556 A12,12 0 0 1 72,544 Z" />
    <text x="84" y="576" font-size="15" font-weight="bold" fill="#C77800">三块骨头的共同点</text>
    <text x="84" y="606" font-size="14" fill="#1A2433">都无法从互联网数据学到——空间要身体经历、触觉要真机接触、本体要拥有身体。</text>
    <text x="84" y="634" font-size="14" fill="#1A2433">这正是系列第二篇"具身是必经之路"判断的输入端印证：<tspan font-weight="bold" fill="#C77800">这三关不过，全模态就只是"视听模态"</tspan></text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">综合：Cosmos 3 空间 QA（系列③）· Figure 03 触觉（系列③）· GR00T N1.6 本体（系列③）· SPACE 基准（系列②）</text>
</svg>