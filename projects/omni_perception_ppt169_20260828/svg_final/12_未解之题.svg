<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">未解之题：四道最后的窄门</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">全模态地图上还亮着红灯的地方——也是下一代机会所在</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V356 A12,12 0 0 1 620,368 H72 A12,12 0 0 1 60,356 V130 A12,12 0 0 1 72,118 Z" />
    <rect x="60" y="118" width="572" height="4" fill="#C0392B" />
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#C0392B">窄门一：空间几何感知</text>
    <g font-size="13.5" fill="#1A2413">
      <text x="84" y="188">心理旋转/视角切换/三维关系仍近随机</text>
      <text x="104" y="214">（SPACE 基准，系列②核心证据）</text>
      <text x="84" y="252">为什么难：文本没有"前后左右"的</text>
      <text x="104" y="278">身体锚点；视频有像素但无深度</text>
      <text x="84" y="330" fill="#C0392B" font-weight="bold">突破口：3D 原生模型 + 具身交互闭环</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M664,118 H1208 A12,12 0 0 1 1220,130 V356 A12,12 0 0 1 1208,368 H664 A12,12 0 0 1 652,356 V130 A12,12 0 0 1 664,118 Z" />
    <rect x="652" y="118" width="568" height="4" fill="#6D4FC2" />
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#6D4FC2">窄门二：通用触觉基座</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188">视觉有 ViT、音频有 AuT，触觉没有对应物</text>
      <text x="696" y="214">——传感器标准不统一，数据无法爬取</text>
      <text x="676" y="252">"感受 3 克的回形针"与"握稳 vs 将滑"</text>
      <text x="696" y="278">的通用表征仍是空白</text>
      <text x="676" y="330" fill="#6D4FC2" font-weight="bold">突破口：视触对照学习（看+摸成对数据）</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,392 H620 A12,12 0 0 1 632,404 V630 A12,12 0 0 1 620,642 H72 A12,12 0 0 1 60,630 V404 A12,12 0 0 1 72,392 Z" />
    <rect x="60" y="392" width="572" height="4" fill="#C77800" />
    <text x="84" y="426" font-size="16" font-weight="bold" fill="#C77800">窄门三：时间与时序定位</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="462">"事件发生在第几秒"——闭源领先开源</text>
      <text x="104" y="488">22.6%（SONIC-O1），最大差距之一</text>
      <text x="84" y="526">与帧级运动同根：需要"时间轴分辨率"</text>
      <text x="104" y="552">而非"一袋图片"式处理</text>
      <text x="84" y="604" fill="#C77800" font-weight="bold">突破口：25fps 对称编码的普及（OmniEncoder）</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M664,392 H1208 A12,12 0 0 1 1220,404 V630 A12,12 0 0 1 1208,642 H664 A12,12 0 0 1 652,630 V404 A12,12 0 0 1 664,392 Z" />
    <rect x="652" y="392" width="568" height="4" fill="#0B6E99" />
    <text x="676" y="426" font-size="16" font-weight="bold" fill="#0B6E99">窄门四：多通道注意力调配</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="462">鸡尾酒会效应的机器版： noisy 环境里</text>
      <text x="696" y="488">主动选择"听谁、看哪"——人天生，AI 没有</text>
      <text x="676" y="526">多人对话（谁在对谁说）、跨模态指代</text>
      <text x="696" y="552">（"把刚才那个调大"的"那个"）</text>
      <text x="676" y="604" fill="#0B6E99" font-weight="bold">突破口：主动感知架构（感知作为行动）</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">四门排序依据：距实用最远（空间）→ 数据最缺（触觉）→ 差距最新被量化（时序）→ 架构最根本（注意力调配）</text>
</svg>