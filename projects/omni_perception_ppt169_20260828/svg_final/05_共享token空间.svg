<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">共享 token 空间：统一的原理</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">"入口换汇"是唯一的承重墙 · 一切原生全模态模型的共同机制</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H748 A12,12 0 0 1 760,130 V386 A12,12 0 0 1 748,398 H72 A12,12 0 0 1 60,386 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">换汇过程：一切模态 → 同一种 token</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="186">① 文本：常规分词器 → token ID</text>
      <text x="84" y="222">② 图像：切成 patch → 向量量化对照码本 → 离散码</text>
      <text x="84" y="258">③ 音频：波形→mel 频谱→帧级编码（Qwen AuT：每帧约 160ms，</text>
      <text x="104" y="284">4000 万小时音频数据训练）</text>
      <text x="84" y="320">④ 视频：逐帧 token 化 + 时间戳插入（Qwen：显式时间戳</text>
      <text x="104" y="346">增强长视频时序感知）</text>
      <text x="84" y="386" fill="#0B6E99" font-weight="bold">→ 汇入同一序列后，注意力一视同仁地处理每个 token</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3" d="M792,118 H1208 A12,12 0 0 1 1220,130 V386 A12,12 0 0 1 1208,398 H792 A12,12 0 0 1 780,386 V130 A12,12 0 0 1 792,118 Z" />
    <text x="804" y="150" font-size="15" font-weight="bold" fill="#0B6E99">一个具体例子（账单走一遍）</text>
    <g font-size="13" fill="#1A2433">
      <text x="804" y="184">短 clip：256×256 × 8 帧</text>
      <text x="804" y="212">→ 每帧 16×16 patch = 256 token/帧</text>
      <text x="804" y="240">→ 256 × 8 = 2,048 视频 token</text>
      <text x="804" y="268">→ + 12 词提示 ≈ 16 文本 token</text>
      <path fill="#FFFFFF" stroke="#0B6E99" stroke-opacity="0.3" d="M812,284 H1188 A8,8 0 0 1 1196,292 V320 A8,8 0 0 1 1188,328 H812 A8,8 0 0 1 804,320 V292 A8,8 0 0 1 812,284 Z" />
      <text x="1000" y="311" text-anchor="middle" font-weight="bold" fill="#0B6E99">= 2,064 token 的同质序列</text>
      <text x="804" y="356" font-size="12" fill="#51617A">无图像模型交接、无投影胶水——注意力均匀覆盖</text>
      <text x="804" y="382" font-size="12" fill="#51617A">更多信号 = 同一空间里更多 token，仅此而已</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,424 H1208 A12,12 0 0 1 1220,436 V656 A12,12 0 0 1 1208,668 H72 A12,12 0 0 1 60,656 V436 A12,12 0 0 1 72,424 Z" />
    <text x="84" y="458" font-size="15" font-weight="bold" fill="#C77800">这张"换汇许可"带来的四个质变</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="494">① 读写对称：旧式编码器只进不出（读图不能画图）；新式同一空间可进可出（任意→任意）</text>
      <text x="84" y="528">② 跨模态记忆连续：多轮对话里第 3 轮的图、第 7 轮的声音、第 12 轮的问题在同一注意力内互相看见</text>
      <text x="84" y="562">③ 扩展变便宜：加新模态 = 给码本添新码，不用重造管道（Cosmos 3 加"动作"就是这么做）</text>
      <text x="84" y="596">④ 提示保真度上升：模型回答"关于视频本身"的问题，而非"关于视频描述"的问题</text>
      <text x="84" y="642" fill="#C77800" font-weight="bold">代价：token 账单暴涨——长上下文效率（如 DeepSeek V4）成为下一个瓶颈</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：learnaivisually 架构解读 · Qwen3.5-Omni 技术报告（arXiv 2604.15804）· 数字为教学示意</text>
</svg>