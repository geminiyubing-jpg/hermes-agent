<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">实时交互：语义级打断与语音克隆</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">对话作为"信息通道"的工程化——从按键对讲机到自然抢话</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V336 A12,12 0 0 1 620,348 H72 A12,12 0 0 1 60,336 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#8494AB">旧式"对讲机"模式</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="184">说完一句 → 等 ASR 转写 → LLM 想 → TTS 念</text>
      <text x="104" y="210">四段接力，延迟 2-5 秒</text>
      <text x="84" y="248">打断 = 停顿检测（VAD）：</text>
      <text x="104" y="274">· 你只是换气 → 误杀</text>
      <text x="104" y="300">· 你真想抢话 → 没听懂意图</text>
    </g>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V336 A12,12 0 0 1 1208,348 H664 A12,12 0 0 1 652,336 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#C77800">Qwen3.5-Omni 全双工模式（2026-03）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="184">流式端到端：边听边想边说</text>
      <text x="696" y="210">第一包延迟：音频 435ms / 视频 651ms</text>
      <text x="676" y="248" font-weight="bold" fill="#C77800">语义级打断：理解"轮替意图"</text>
      <text x="696" y="274">—— 不是"检测到声音停"，是"听懂你要说话"</text>
      <text x="696" y="300">（人如何自然接话的同款机制）</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,374 H1208 A12,12 0 0 1 1220,386 V542 A12,12 0 0 1 1208,554 H72 A12,12 0 0 1 60,542 V386 A12,12 0 0 1 72,374 Z" />
    <text x="84" y="408" font-size="15" font-weight="bold" fill="#0B6E99">语音生成三板斧（Qwen 技术报告）</text>
    <g text-anchor="middle" font-size="13">
      <path fill="#E8F1F8" d="M110,428 H430 A10,10 0 0 1 440,438 V518 A10,10 0 0 1 430,528 H110 A10,10 0 0 1 100,518 V438 A10,10 0 0 1 110,428 Z" />
      <text x="270" y="460" font-weight="bold" fill="#0B6E99">ARIA 流式对齐</text>
      <text x="270" y="486" fill="#1A2433">文本/语音 token 速率动态对齐</text>
      <text x="270" y="510" fill="#51617A">对话语音稳定自然的根基</text>

      <path fill="#E8F1F8" d="M480,428 H800 A10,10 0 0 1 810,438 V518 A10,10 0 0 1 800,528 H480 A10,10 0 0 1 470,518 V438 A10,10 0 0 1 480,428 Z" />
      <text x="640" y="460" font-weight="bold" fill="#0B6E99">多码本编解码器</text>
      <text x="640" y="486" fill="#1A2433">单帧即时合成（不等整句）</text>
      <text x="640" y="510" fill="#51617A">36 语言情感语音</text>

      <path fill="#E8F1F8" d="M850,428 H1170 A10,10 0 0 1 1180,438 V518 A10,10 0 0 1 1170,528 H850 A10,10 0 0 1 840,518 V438 A10,10 0 0 1 850,428 Z" />
      <text x="1010" y="460" font-weight="bold" fill="#0B6E99">零样本语音克隆</text>
      <text x="1010" y="486" fill="#1A2433">用户给一段样本即复刻音色</text>
      <text x="1010" y="510" fill="#51617A">端到端音量/语速/情感控制</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.3" d="M72,578 H1208 A12,12 0 0 1 1220,590 V644 A12,12 0 0 1 1208,656 H72 A12,12 0 0 1 60,644 V590 A12,12 0 0 1 72,578 Z" />
    <text x="84" y="610" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#C0392B">尚未解决：</tspan>多人对话场景（谁在说、对谁说——鸡尾酒会问题）；副语言理解（讽刺/犹豫的语调）；</text>
    <text x="84" y="638" font-size="14.5" fill="#1A2433">跨模态指代（"把刚才那个调大点"的"那个"到底指什么）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2604.15804（Qwen3.5-Omni 技术报告 Thinker-Talker/ARIA 章节）· Alibaba Cloud 定价页</text>
</svg>