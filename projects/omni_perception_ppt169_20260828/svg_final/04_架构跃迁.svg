<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">架构跃迁：从"缝合管道"到"原生感知"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">2022-2026 上半年的主流 → 2026 年的换血 · 机场货币兑换比喻</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.35" d="M72,118 H1208 A12,12 0 0 1 1220,130 V326 A12,12 0 0 1 1208,338 H72 A12,12 0 0 1 60,326 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#C0392B">旧范式：缝合式（bolt-on 接力赛）— GPT-4o / 早期 Gemini</text>
    
    <g text-anchor="middle">
      <path fill="#FFFFFF" stroke="#C0392B" stroke-opacity="0.3" d="M110,172 H270 A10,10 0 0 1 280,182 V226 A10,10 0 0 1 270,236 H110 A10,10 0 0 1 100,226 V182 A10,10 0 0 1 110,172 Z" />
      <text x="190" y="198" font-size="13" fill="#1A2433">视觉编码器</text>
      <text x="190" y="220" font-size="11.5" fill="#51617A">"看图"</text>
      <path fill="#FFFFFF" stroke="#C0392B" stroke-opacity="0.3" d="M340,172 H500 A10,10 0 0 1 510,182 V226 A10,10 0 0 1 500,236 H340 A10,10 0 0 1 330,226 V182 A10,10 0 0 1 340,172 Z" />
      <text x="420" y="198" font-size="13" fill="#1A2433">语言模型</text>
      <text x="420" y="220" font-size="11.5" fill="#51617A">"翻译成文字"</text>
      <path fill="#FFFFFF" stroke="#C0392B" stroke-opacity="0.3" d="M570,172 H730 A10,10 0 0 1 740,182 V226 A10,10 0 0 1 730,236 H570 A10,10 0 0 1 560,226 V182 A10,10 0 0 1 570,172 Z" />
      <text x="650" y="198" font-size="13" fill="#1A2433">文生图/视频模型</text>
      <text x="650" y="220" font-size="11.5" fill="#51617A">"再画出来"</text>
      <path fill="#FFFFFF" stroke="#C0392B" stroke-opacity="0.3" d="M800,172 H960 A10,10 0 0 1 970,182 V226 A10,10 0 0 1 960,236 H800 A10,10 0 0 1 790,226 V182 A10,10 0 0 1 800,172 Z" />
      <text x="880" y="198" font-size="13" fill="#1A2433">语音合成</text>
      <text x="880" y="220" font-size="11.5" fill="#51617A">"再念出来"</text>
    </g>
    <path d="M 280 204 L 330 204" stroke="#C0392B" stroke-width="2" marker-end="url(#o1)" />
    <path d="M 510 204 L 560 204" stroke="#C0392B" stroke-width="2" marker-end="url(#o1)" />
    <path d="M 740 204 L 790 204" stroke="#C0392B" stroke-width="2" marker-end="url(#o1)" />
    <defs>
      <marker id="o1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#C0392B" />
      </marker>
    </defs>
    <text x="1000" y="200" font-size="13" fill="#C0392B" font-weight="bold">= 接力赛</text>
    <text x="1000" y="222" font-size="12" fill="#8494AB">每棒丢信息</text>
    <text x="84" y="278" font-size="13.5" fill="#1A2433">病灶：模型其实在回答"关于图片描述的问题"，不是回答"关于图片本身的问题"——demo 惊艳，产品脆弱</text>
    <text x="84" y="316" font-size="13" fill="#51617A">机场比喻：每种货币一个兑换窗口，各自汇率，排队三次才能换完</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M72,362 H1208 A12,12 0 0 1 1220,374 V580 A12,12 0 0 1 1208,592 H72 A12,12 0 0 1 60,580 V374 A12,12 0 0 1 72,362 Z" />
    <text x="84" y="394" font-size="15" font-weight="bold" fill="#1E8E3E">新范式：原生全模态（一个 token 空间）— Gemini Omni / Qwen3.5-Omni / Cosmos 3</text>
    
    <g text-anchor="middle">
      <path fill="#FFFFFF" stroke="#1E8E3E" stroke-opacity="0.4" d="M120,416 H250 A10,10 0 0 1 260,426 V456 A10,10 0 0 1 250,466 H120 A10,10 0 0 1 110,456 V426 A10,10 0 0 1 120,416 Z" />
      <text x="185" y="446" font-size="13" fill="#1A2433">🖼 图像 token</text>
      <path fill="#FFFFFF" stroke="#1E8E3E" stroke-opacity="0.4" d="M120,478 H250 A10,10 0 0 1 260,488 V518 A10,10 0 0 1 250,528 H120 A10,10 0 0 1 110,518 V488 A10,10 0 0 1 120,478 Z" />
      <text x="185" y="508" font-size="13" fill="#1A2433">🔊 音频 token</text>
      <path fill="#FFFFFF" stroke="#1E8E3E" stroke-opacity="0.4" d="M120,540 H250 A10,10 0 0 1 260,550 V570 A10,10 0 0 1 250,580 H120 A10,10 0 0 1 110,570 V550 A10,10 0 0 1 120,540 Z" />
      <text x="185" y="565" font-size="13" fill="#1A2433">📝 文本 token</text>

      <path d="M 260 441 L 330 500" stroke="#8494AB" stroke-width="2" />
      <path d="M 260 503 L 330 505" stroke="#8494AB" stroke-width="2" />
      <path d="M 260 560 L 330 512" stroke="#8494AB" stroke-width="2" />

      <path fill="#1E8E3E" opacity="0.12" stroke="#1E8E3E" stroke-width="2" d="M342,440 H658 A12,12 0 0 1 670,452 V558 A12,12 0 0 1 658,570 H342 A12,12 0 0 1 330,558 V452 A12,12 0 0 1 342,440 Z" />
      <text x="500" y="490" font-size="15" font-weight="bold" fill="#1E8E3E">一个 Transformer</text>
      <text x="500" y="515" font-size="12.5" fill="#1A2433">同一注意力机制处理所有 token</text>
      <text x="500" y="540" font-size="12.5" fill="#1A2433">不分来源、无需翻译</text>

      <path d="M 670 480 L 740 470" stroke="#1E8E3E" stroke-width="2" marker-end="url(#o2)" />
      <path d="M 670 505 L 740 505" stroke="#1E8E3E" stroke-width="2" marker-end="url(#o2)" />
      <path d="M 670 530 L 740 540" stroke="#1E8E3E" stroke-width="2" marker-end="url(#o2)" />
      <defs>
        <marker id="o2" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
          <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#1E8E3E" />
        </marker>
      </defs>
      <path fill="#FFFFFF" stroke="#1E8E3E" d="M750,450 H880 A10,10 0 0 1 890,460 V484 A10,10 0 0 1 880,494 H750 A10,10 0 0 1 740,484 V460 A10,10 0 0 1 750,450 Z" />
      <text x="815" y="477" font-size="13" fill="#1A2433">出：文字/语音</text>
      <path fill="#FFFFFF" stroke="#1E8E3E" d="M750,504 H880 A10,10 0 0 1 890,514 V538 A10,10 0 0 1 880,548 H750 A10,10 0 0 1 740,538 V514 A10,10 0 0 1 750,504 Z" />
      <text x="815" y="531" font-size="13" fill="#1A2433">出：图像/视频</text>
      <rect x="740" y="558" width="150" height="0" fill="none" />
    </g>
    <text x="920" y="480" font-size="13" fill="#1E8E3E" font-weight="bold">五进五出，一个柜员</text>
    <text x="920" y="504" font-size="12" fill="#8494AB">机场比喻：统一记账货币——</text>
    <text x="920" y="526" font-size="12" fill="#8494AB">什么钱都收、什么钱都付</text>
    <text x="84" y="576" font-size="13.5" fill="#1A2433">质变：注意力不再关心 token 来自像素还是声波——模型直接"看视频本身"而不是"看视频的字幕"</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">关键差异总结：旧式只能读不能写（单向街）；新式同空间读写（任意到任意）；新模态加入=扩码本而非重造管道</text>
</svg>