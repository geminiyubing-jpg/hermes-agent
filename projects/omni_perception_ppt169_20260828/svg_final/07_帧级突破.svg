<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">帧级突破：手语识别 +20 分的秘密</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">OmniEncoder（arXiv 2605.01506）· 暴露当前 Omni 模型的隐藏盲区并给出解法</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4" d="M72,118 H620 A12,12 0 0 1 632,130 V376 A12,12 0 0 1 620,388 H72 A12,12 0 0 1 60,376 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="152" font-size="15" font-weight="bold" fill="#C0392B">实测盲区：前沿模型看不懂动作</text>
    
    <g font-family="'SF Mono','Menlo',monospace" font-size="14">
      <text x="84" y="192" fill="#1A2433">跳水动作 Diving48：</text>
      <text x="84" y="222" fill="#C0392B" font-weight="bold">Gemini-2.5-Pro  4.94%</text>
      <text x="84" y="250" fill="#C0392B" font-weight="bold">Qwen3.5-Omni  6.86%</text>
      <text x="84" y="284" fill="#1A2433">手语 SLR500：</text>
      <text x="300" y="222" fill="#8494AB" font-size="12">（随机猜≈2%）</text>
      <text x="84" y="316" fill="#C0392B" font-weight="bold">Gemini-2.5-Pro  1.2%</text>
      <text x="84" y="344" fill="#C0392B" font-weight="bold">Qwen3.5-Omni  0.8%</text>
    </g>
    <text x="84" y="376" font-size="13" fill="#51617A" font-family="'PingFang SC',sans-serif">根因：视频 1-2fps 抽帧+逐帧独立处理 → 帧间运动信息全丢</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V376 A12,12 0 0 1 1208,388 H664 A12,12 0 0 1 652,376 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="152" font-size="15" font-weight="bold" fill="#1E8E3E">解法：25fps 对称编码</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="186">OmniEncoder：视觉与音频同以 25fps 编码进</text>
      <text x="696" y="212">同一潜空间（人类感知的自然节奏）</text>
      <text x="676" y="248">三大技术：Token 模板 + Omni-RoPE +</text>
      <text x="696" y="274">时间窗移位（解模态纠缠与算力难题）</text>
      <text x="676" y="316" fill="#1E8E3E" font-weight="bold">帧级运动建模 = 连续动作理解的钥匙</text>
      <text x="676" y="352" fill="#51617A" font-size="13">且不增加下游 LLM 的 token 预算</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,414 H1208 A12,12 0 0 1 1220,426 V656 A12,12 0 0 1 1208,668 H72 A12,12 0 0 1 60,656 V426 A12,12 0 0 1 72,414 Z" />
    <text x="84" y="448" font-size="15" font-weight="bold" fill="#1E8E3E">战绩（对比专门领域模型）</text>
    
    <line x1="560" y1="600" x2="1160" y2="600" stroke="#8494AB" stroke-width="1.5" />
    <g font-size="13">
      <text x="84" y="490">手语 NationalCSL（6707 词表）</text>
      <path fill="#8494AB" opacity="0.6" d="M564,474 H760 A4,4 0 0 1 764,478 V494 A4,4 0 0 1 760,498 H564 A4,4 0 0 1 560,494 V478 A4,4 0 0 1 564,474 Z" />
      <text x="772" y="492" font-family="'SF Mono',monospace" fill="#51617A">69.6%（专模型）</text>
      <path fill="#1E8E3E" d="M564,502 H820 A4,4 0 0 1 824,506 V522 A4,4 0 0 1 820,526 H564 A4,4 0 0 1 560,522 V506 A4,4 0 0 1 564,502 Z" />
      <text x="832" y="520" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">90.3%（+20.7pp!）</text>

      <text x="84" y="556">手语 SLR500</text>
      <path fill="#1E8E3E" d="M564,540 H816 A4,4 0 0 1 820,544 V560 A4,4 0 0 1 816,564 H564 A4,4 0 0 1 560,560 V544 A4,4 0 0 1 564,540 Z" />
      <text x="828" y="558" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">97.8%（超专模型）</text>

      <text x="84" y="592">跳水 Diving48</text>
      <path fill="#1E8E3E" d="M564,576 H814 A4,4 0 0 1 818,580 V596 A4,4 0 0 1 814,600 H564 A4,4 0 0 1 560,596 V580 A4,4 0 0 1 564,576 Z" />
      <text x="826" y="594" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">90.8%（超专模型）</text>
    </g>
    <text x="84" y="640" font-size="13.5" fill="#C77800" font-weight="bold">结论：不是模型不够大，是"采样密度"不够——像人类一样连续地看，才看得懂连续的动作</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2605.01506《OmniEncoder: See, Hear, and Feel Continuous Motion Like Humans With One Encoder》</text>
</svg>