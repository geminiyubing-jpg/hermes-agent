<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">系列位置：输入端拼图合上</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">五篇系列的第四块——智能系统的"输入侧"至此完整</text>
  </g>

  <!-- full map -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="380" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1A2433">智能系统的完整拼图（本系列五篇覆盖图）</text>

    <!-- input block -->
    <rect x="100" y="180" width="320" height="290" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-width="2"/>
    <text x="260" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B6E99">输入端：感知</text>
    <text x="260" y="240" text-anchor="middle" font-size="13" fill="#1A2433">五感全模态输入</text>
    <rect x="140" y="258" width="240" height="44" rx="8" fill="#0B6E99" opacity="0.12"/>
    <text x="260" y="286" text-anchor="middle" font-size="13" fill="#0B6E99" font-weight="bold">★ 本篇：全模态感知</text>
    <text x="260" y="330" text-anchor="middle" font-size="12.5" fill="#51617A">视听（已通）· 融合交互（刚通）</text>
    <text x="260" y="356" text-anchor="middle" font-size="12.5" fill="#51617A">空间/触觉/本体（窄门）</text>
    <text x="260" y="400" text-anchor="middle" font-size="12" fill="#8494AB">← 系列第 ② 篇的空间难题</text>
    <text x="260" y="424" text-anchor="middle" font-size="12" fill="#8494AB">在此汇合</text>

    <!-- processing block -->
    <rect x="470" y="180" width="320" height="290" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.5"/>
    <text x="630" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#6D4FC2">处理端：理解</text>
    <text x="630" y="240" text-anchor="middle" font-size="13" fill="#1A2433">智能从何涌现</text>
    <text x="630" y="286" text-anchor="middle" font-size="12.5" fill="#51617A">① 篇：AI 智能的本质</text>
    <text x="630" y="312" text-anchor="middle" font-size="12.5" fill="#51617A">特征/世界模型/相变/模块化</text>
    <text x="630" y="356" text-anchor="middle" font-size="12.5" fill="#51617A">⑤ 篇：生物极简编码</text>
    <text x="630" y="382" text-anchor="middle" font-size="12.5" fill="#51617A">（感知的信息论下限）</text>

    <!-- output block -->
    <rect x="840" y="180" width="340" height="290" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.5"/>
    <text x="1010" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#C77800">输出端：行动</text>
    <text x="1010" y="240" text-anchor="middle" font-size="13" fill="#1A2433">语言与具身执行</text>
    <text x="1010" y="286" text-anchor="middle" font-size="12.5" fill="#51617A">③ 篇：具身泛化路线</text>
    <text x="1010" y="312" text-anchor="middle" font-size="12.5" fill="#51617A">预测·行动·地图三件套</text>
    <text x="1010" y="356" text-anchor="middle" font-size="12.5" fill="#51617A">④ 篇：人形机器人前沿</text>
    <text x="1010" y="382" text-anchor="middle" font-size="12.5" fill="#51617A">WAM/EgoScale/触觉闭环</text>

    <path d="M 420 325 L 470 325" stroke="#8494AB" stroke-width="2.5" marker-end="url(#m1)"/>
    <path d="M 790 325 L 840 325" stroke="#8494AB" stroke-width="2.5" marker-end="url(#m1)"/>
    <defs>
      <marker id="m1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB"/>
      </marker>
    </defs>
  </g>

  <!-- closing -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="524" width="1160" height="130" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="558" font-size="15" font-weight="bold" fill="#0B6E99">本篇的独特贡献</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="590">前几篇讲"理解与行动的难"，本篇补上"输入的易与难"：视听识别为何已通（token 化成熟）、</text>
      <text x="84" y="618">融合交互为何刚通（架构换血）、空间触觉为何难（无身体则无数据）——输入端地图就此完整。</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">五篇系列：①本质（17页）· ②空间（14页）· ③路线（13页）· ④机器人（13页）· ⑤极简编码（14页）· 本篇为感知侧收官</text>
</svg>
