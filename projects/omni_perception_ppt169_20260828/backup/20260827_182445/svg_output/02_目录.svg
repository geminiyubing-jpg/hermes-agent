<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">四部分 · 14 页 · 约 40 分钟 · 系列第四篇</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="140" font-size="15" font-weight="bold" fill="#0B6E99">Ⅰ · 全景：人类八通道 vs AI 现状</text>
    <rect x="80" y="154" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03</tspan>  八通道映射表：哪些解决了，哪些没有</text>
      <text x="80" y="220"><tspan font-family="'SF Mono',monospace" fill="#8494AB">04</tspan>  架构跃迁：从"缝合管道"到"原生感知"</text>
    </g>

    <text x="80" y="280" font-size="15" font-weight="bold" fill="#C0392B">Ⅱ · 三大模型与关键突破</text>
    <rect x="80" y="294" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="328"><tspan font-family="'SF Mono',monospace" fill="#8494AB">05</tspan>  共享 token 空间：统一的原理</text>
      <text x="80" y="360"><tspan font-family="'SF Mono',monospace" fill="#8494AB">06</tspan>  三巨头横评：Gemini Omni / Qwen / GPT-5.5</text>
      <text x="80" y="392"><tspan font-family="'SF Mono',monospace" fill="#8494AB">07</tspan>  帧级突破：手语识别 +20pp 的秘密</text>
      <text x="80" y="424"><tspan font-family="'SF Mono',monospace" fill="#8494AB">08</tspan>  实时交互：语义级打断与语音克隆</text>
    </g>

    <text x="680" y="140" font-size="15" font-weight="bold" fill="#C77800">Ⅲ · 感官通道逐个看</text>
    <rect x="680" y="154" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">09</tspan>  视觉与听觉：强项与盲区</text>
      <text x="680" y="220"><tspan font-family="'SF Mono',monospace" fill="#8494AB">10</tspan>  空间·触觉·本体：三块硬骨头</text>
    </g>

    <text x="680" y="280" font-size="15" font-weight="bold" fill="#1E8E3E">Ⅳ · 格局与趋势</text>
    <rect x="680" y="294" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="328"><tspan font-family="'SF Mono',monospace" fill="#8494AB">11</tspan>  基准饱和事件：竞争转向架构范围</text>
      <text x="680" y="360"><tspan font-family="'SF Mono',monospace" fill="#8494AB">12</tspan>  未解之题：四道最后的窄门</text>
      <text x="680" y="392"><tspan font-family="'SF Mono',monospace" fill="#8494AB">13</tspan>  系列位置：输入端拼图合上</text>
      <text x="680" y="424"><tspan font-family="'SF Mono',monospace" fill="#8494AB">14</tspan>  尾页：清单与观察哨</text>
    </g>
  </g>

  <rect x="80" y="470" width="1140" height="190" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
  <text x="104" y="502" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#C77800">一句话主线</text>
  <text x="104" y="534" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">2026 年多模态 AI 完成了架构换血：从"各感官各走各的管道再拼接"转向"所有感官在同一个</text>
  <text x="104" y="560" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">token 空间被一个注意力机制统一处理"——就像人类大脑，五感进、一识出。</text>
  <text x="104" y="596" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">换血带来三大质变：跨模态记忆连续、帧级运动感知、实时交互——但空间/触觉仍是窄门。</text>
  <text x="104" y="634" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8494AB">与系列关系：第二篇讲空间为何难 → 本篇讲其余通道为何易 · 两篇合成完整的"感知地图"</text>
</svg>
