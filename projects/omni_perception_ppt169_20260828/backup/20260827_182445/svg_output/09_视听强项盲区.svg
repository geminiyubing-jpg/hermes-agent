<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">视觉与听觉：强项与盲区</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">两个最成熟的通道，也有各自的暗角</text>
  </g>

  <!-- vision -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#0B6E99"/>
    <text x="84" y="152" font-size="15.5" font-weight="bold" fill="#0B6E99">视觉：结构性内容已是超人级</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13.5">
      <text x="84" y="188" fill="#1A2433">ChartQA（图表理解）</text>
      <text x="400" y="188" font-weight="bold" fill="#1E8E3E">92.1%</text>
      <text x="84" y="218" fill="#1A2433">AI2D（科学图解）</text>
      <text x="400" y="218" font-weight="bold" fill="#1E8E3E">96.2%</text>
      <text x="84" y="248" fill="#1A2433">DocVQA（文档问答）</text>
      <text x="400" y="248" font-weight="bold" fill="#1E8E3E">91.5%</text>
      <text x="84" y="278" fill="#1A2433">Video-MME（视频理解）</text>
      <text x="400" y="278" font-weight="bold" fill="#C77800">78.4%</text>
    </g>
    <g font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#1A2433">
      <text x="84" y="316">· Gemini 3 Deep Think：60fps 实时视频 +</text>
      <text x="104" y="342">原生 3D 物体理解（机器人/AR 关键）</text>
      <text x="84" y="380" fill="#C0392B" font-weight="bold">盲区：帧级连续运动（P7 已详述）</text>
    </g>
  </g>

  <!-- audio -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="118" width="568" height="4" fill="#C77800"/>
    <text x="676" y="152" font-size="15.5" font-weight="bold" fill="#C77800">听觉：语音已达实用终点</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188">· 识别：113 种语言/方言（Qwen AuT</text>
      <text x="696" y="214">编码器 4000 万小时训练）</text>
      <text x="676" y="250">· 音视频字幕：剧本级结构化输出——</text>
      <text x="696" y="276">自动分段、时间戳、人物关系标注</text>
      <text x="676" y="312">· 视听互补实测：唇读+听写将词错率</text>
      <text x="696" y="338">从 10.2% 降到 7.2%（视觉流真有用）</text>
      <text x="676" y="380" fill="#C0392B" font-weight="bold">盲区：非语音环境声（警报/机械/动物）仍是二线</text>
    </g>
  </g>

  <!-- time perception -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="424" width="1160" height="232" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="458" font-size="15" font-weight="bold" fill="#0B6E99">新前沿：时间感知（"事情发生在第几秒"）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="494">· 音视频时序定位（temporal localization）：在长媒体里指出事件发生的精确时刻</text>
      <text x="84" y="528">· SONIC-O1 基准实测：闭源模型领先开源 <tspan font-family="'SF Mono',monospace" font-weight="bold" fill="#C0392B">22.6%</tspan>——最大的开源差距点之一</text>
      <text x="84" y="562">· 与帧级运动（P7）同根：都要求模型有"时间轴上的分辨率"，而非把视频当一袋图片</text>
      <text x="84" y="620" fill="#0B6E99" font-weight="bold">判断：时间感知是 2026-2027 视觉理解的分水岭指标——谁先做好，谁接管视频时代</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：bestaiweb 基准对比（2026-04）· arXiv 2605.01506（唇读互补）· SONIC-O1 基准报告</text>
</svg>
