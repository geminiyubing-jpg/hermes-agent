<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">八通道映射表：AI 的"五感"现状盘点</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">成熟度评分为编者综合校准（2026-08 时点）</text>
  </g>

  <!-- table -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="112" width="1160" height="30" fill="#EEF2F8" rx="6"/>
    <text x="80" y="133" font-size="13.5" font-weight="bold" fill="#51617A">通道</text>
    <text x="220" y="133" font-size="13.5" font-weight="bold" fill="#51617A">人类机制</text>
    <text x="520" y="133" font-size="13.5" font-weight="bold" fill="#51617A">AI 方案</text>
    <text x="880" y="133" font-size="13.5" font-weight="bold" fill="#51617A">成熟度与短板</text>

    <g font-size="12.5" fill="#1A2433">
      <rect x="60" y="148" width="1160" height="60" fill="#FFFFFF"/>
      <text x="80" y="172" font-weight="bold" fill="#0B6E99">👁 视觉</text>
      <text x="220" y="172">视网膜→视皮层分层处理</text>
      <text x="520" y="172">ViT 编码器：图像切块成 token</text>
      <text x="880" y="164" fill="#1E8E3E" font-weight="bold">★★★★★ 生产级</text>
      <text x="880" y="188" fill="#8494AB">帧级连续运动弱（P7）</text>

      <rect x="60" y="212" width="1160" height="60" fill="#F7F9FC"/>
      <text x="80" y="236" font-weight="bold" fill="#0B6E99">👂 听觉</text>
      <text x="220" y="236">耳蜗频率分解→听皮层</text>
      <text x="520" y="236">mel 频谱→AuT 编码（4000 万小时）</text>
      <text x="880" y="228" fill="#1E8E3E" font-weight="bold">★★★★★ 生产级</text>
      <text x="880" y="252" fill="#8494AB">非语音环境声二线</text>

      <rect x="60" y="276" width="1160" height="60" fill="#FFFFFF"/>
      <text x="80" y="300" font-weight="bold" fill="#C77800">🎬 视听融合</text>
      <text x="220" y="300">天然同步（~25fps 整合）</text>
      <text x="520" y="300">OmniEncoder 25fps 对称编码</text>
      <text x="880" y="292" fill="#C77800" font-weight="bold">★★★★ 突破期</text>
      <text x="880" y="316" fill="#8494AB">主流仍"视频粗音频密"不对称</text>

      <rect x="60" y="340" width="1160" height="60" fill="#F7F9FC"/>
      <text x="80" y="364" font-weight="bold" fill="#C0392B">🧭 空间感知</text>
      <text x="220" y="364">朝向/路径积分/认知地图</text>
      <text x="520" y="364">三参照系空间 QA + 3D 原生模型</text>
      <text x="880" y="356" fill="#C0392B" font-weight="bold">★★★ 攻坚期</text>
      <text x="880" y="380" fill="#8494AB">SPACE 基准近随机（系列②）</text>

      <rect x="60" y="404" width="1160" height="60" fill="#FFFFFF"/>
      <text x="80" y="428" font-weight="bold" fill="#6D4FC2">✋ 触觉</text>
      <text x="220" y="428">机械感受器（3g 级敏感）</text>
      <text x="520" y="428">Figure 03 指尖 3g 力敏 + 视触联合</text>
      <text x="880" y="420" fill="#6D4FC2" font-weight="bold">★★ 机器人初步</text>
      <text x="880" y="444" fill="#8494AB">通用触觉基础模型缺位</text>

      <rect x="60" y="468" width="1160" height="60" fill="#F7F9FC"/>
      <text x="80" y="492" font-weight="bold" fill="#6D4FC2">🦴 本体感觉</text>
      <text x="220" y="492">肌梭/前庭（身体位置感）</text>
      <text x="520" y="492">GR00T 本体编码器（按机体 ID 索引）</text>
      <text x="880" y="484" fill="#6D4FC2" font-weight="bold">★★★ 具身标配</text>
      <text x="880" y="508" fill="#8494AB">每机体需单独适配</text>

      <rect x="60" y="532" width="1160" height="60" fill="#FFFFFF"/>
      <text x="80" y="556" font-weight="bold" fill="#1E8E3E">💬 交互</text>
      <text x="220" y="556">多通道并发/打断/轮替</text>
      <text x="520" y="556">实时流式全双工 + 语义级打断</text>
      <text x="880" y="548" fill="#1E8E3E" font-weight="bold">★★★★ 刚落地</text>
      <text x="880" y="572" fill="#8494AB">情感细腻度/多人场景</text>

      <rect x="60" y="596" width="1160" height="60" fill="#F7F9FC"/>
      <text x="80" y="620" font-weight="bold" fill="#8494AB">👃 嗅味觉</text>
      <text x="220" y="620">化学感受器</text>
      <text x="520" y="620">电子鼻（气体传感+ML）；大模型缺席</text>
      <text x="880" y="612" fill="#8494AB" font-weight="bold">★ 边缘领域</text>
      <text x="880" y="636" fill="#8494AB">数据稀缺，无统一表征</text>
    </g>
    <rect x="60" y="112" width="1160" height="544" fill="none" stroke="#D8E0EC" rx="6"/>
    <line x1="210" y1="148" x2="210" y2="656" stroke="#E4EAF3"/>
    <line x1="510" y1="148" x2="510" y2="656" stroke="#E4EAF3"/>
    <line x1="870" y1="148" x2="870" y2="656" stroke="#E4EAF3"/>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">一览结论：识别类通道（视听）已生产级；融合与交互刚突破；空间触觉本体是具身时代的硬骨头；嗅味觉边缘</text>
</svg>
