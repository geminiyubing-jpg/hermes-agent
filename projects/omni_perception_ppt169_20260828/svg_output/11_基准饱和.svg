<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">基准饱和事件：竞争转向架构范围</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">2026 年 4 月，多模态基准 MMMU-Pro 饱和于 81-83% · 前沿的定义被改写</text>
  </g>

  <!-- saturation -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="270" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="152" font-size="15" font-weight="bold" fill="#0B6E99">什么是"基准饱和"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="186">· MMMU-Pro（多模态理解综合基准）</text>
      <text x="104" y="212">前沿模型集体冲到 81-83%</text>
      <text x="104" y="238">→ 分数挤在一起，不再区分优劣</text>
      <text x="84" y="278">· 类比：考试全班都是 95 分以上</text>
      <text x="104" y="304">——这张卷子失去了选拔功能</text>
      <text x="84" y="356" fill="#0B6E99" font-weight="bold">→ 竞争转移到卷子之外：架构范围、模态深度、单位能力成本</text>
    </g>
  </g>

  <!-- two bets -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="270" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4"/>
    <text x="676" y="152" font-size="15" font-weight="bold" fill="#C77800">两种"多模态"定义之争</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188" font-weight="bold" fill="#C0392B">赌深（GPT-5.5）：</text>
      <text x="696" y="214">把文本+图像两模态做到超人级</text>
      <text x="696" y="240">（文档/图表工作流优先）</text>
      <text x="676" y="282" font-weight="bold" fill="#1E8E3E">赌宽（Qwen/Gemini）：</text>
      <text x="696" y="308">原生音频+视频+实时语音全都要</text>
      <text x="696" y="334">（交互体验优先）</text>
      <text x="676" y="370" fill="#C77800" font-weight="bold">分歧本质：多模态 AI 到底"为理解"还是"为交互"</text>
    </g>
  </g>

  <!-- market judgment -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="414" width="1160" height="242" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="448" font-size="15" font-weight="bold" fill="#1E8E3E">行业判断（bestaiweb 分析，2026-04）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="484">· 基准情形（最可能）：原生 omni 架构在 2026 年底成为前沿模型新发布的默认预期；</text>
      <text x="104" y="510">纯"文本+图像"模型不再被定位为前沿。观察信号：OpenAI 下一代是否加原生音视频（Q4'26）</text>
      <text x="84" y="546">· 乐观情形：Qwen 开源权重催生一批领域微调的语音/视频模型；两大垂直行业（医疗/客服）</text>
      <text x="104" y="572">率先生产部署全模态（图像+音频+文档同上下文）——2027 上半年确立优势</text>
      <text x="84" y="624" fill="#1E8E3E" font-weight="bold">· 架构债警告：任何还在"图像走一个模型、音频走另一个、事后拼接"的系统都在积累架构债</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：bestaiweb.ai《GPT-5.5 vs Omni Models in 2026》基准与市场分析（2026-04 数据）</text>
</svg>
