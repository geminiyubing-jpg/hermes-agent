<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">三年财务推演：三情景对比</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">保守 / 基准 / 乐观三情景的收入、成本与盈亏平衡点（万元）</text>

  <!-- 收入预测表 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="1160" height="36" fill="#2B2B2B"/>
    <text x="170" y="136" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">指标</text>
    <text x="400" y="136" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Y1（2027）</text>
    <text x="640" y="136" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Y2（2028）</text>
    <text x="880" y="136" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Y3（2029）</text>
    <text x="1105" y="136" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C9A227">关键假设</text>

    <rect x="60" y="148" width="1160" height="42" fill="#FFFFFF"/>
    <text x="170" y="175" text-anchor="middle" font-size="13" fill="#2B2B2B">基准·收入</text>
    <text x="400" y="175" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">600</text>
    <text x="640" y="175" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">2,800</text>
    <text x="880" y="175" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">7,500</text>
    <text x="1105" y="175" text-anchor="middle" font-size="11.5" fill="#6B6B6B">付费用户 2/8/22 万</text>

    <rect x="60" y="190" width="1160" height="42" fill="#F2EDE3"/>
    <text x="170" y="217" text-anchor="middle" font-size="13" fill="#2B2B2B">基准·总成本</text>
    <text x="400" y="217" text-anchor="middle" font-size="13.5" font-family="'Helvetica Neue', sans-serif" fill="#B3541E">1,500</text>
    <text x="640" y="217" text-anchor="middle" font-size="13.5" font-family="'Helvetica Neue', sans-serif" fill="#B3541E">3,200</text>
    <text x="880" y="217" text-anchor="middle" font-size="13.5" font-family="'Helvetica Neue', sans-serif" fill="#B3541E">6,600</text>
    <text x="1105" y="217" text-anchor="middle" font-size="11.5" fill="#6B6B6B">团队 15/28/45 人</text>

    <rect x="60" y="232" width="1160" height="42" fill="#FFFFFF"/>
    <text x="170" y="259" text-anchor="middle" font-size="13" fill="#2B2B2B">基准·盈亏</text>
    <text x="400" y="259" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-900</text>
    <text x="640" y="259" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-400</text>
    <text x="880" y="259" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">+900</text>
    <text x="1105" y="259" text-anchor="middle" font-size="11.5" fill="#6B6B6B">Y3 转正（毛利率 62%）</text>

    <rect x="60" y="274" width="1160" height="42" fill="#F2EDE3"/>
    <text x="170" y="301" text-anchor="middle" font-size="13" fill="#2B2B2B">保守·盈亏</text>
    <text x="400" y="301" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-1,100</text>
    <text x="640" y="301" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-900</text>
    <text x="880" y="301" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-500</text>
    <text x="1105" y="301" text-anchor="middle" font-size="11.5" fill="#6B6B6B">付费转化率减半</text>

    <rect x="60" y="316" width="1160" height="42" fill="#FFFFFF"/>
    <text x="170" y="343" text-anchor="middle" font-size="13" fill="#2B2B2B">乐观·盈亏</text>
    <text x="400" y="343" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-700</text>
    <text x="640" y="343" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">+200</text>
    <text x="880" y="343" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">+2,600</text>
    <text x="1105" y="343" text-anchor="middle" font-size="11.5" fill="#6B6B6B">政策东风+爆款内容</text>
  </g>
  <rect x="60" y="112" width="1160" height="246" fill="none" stroke="#E5DED2"/>

  <!-- 资金需求 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="380" width="572" height="150" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="412" font-size="15.5" font-weight="700" fill="#1F5C45">累计资金需求（至盈亏平衡）</text>
    <text x="88" y="444" font-size="13.5" fill="#2B2B2B">基准情景：900+400 = <tspan font-weight="700" fill="#B3541E">1,300 万 + 安全垫 700 万</tspan></text>
    <text x="88" y="472" font-size="13.5" fill="#2B2B2B">保守情景：累计亏 2,500 万 → 需融资 <tspan font-weight="700">3,000 万</tspan></text>
    <text x="88" y="502" font-size="13" fill="#6B6B6B">建议按保守情景融资，按基准情景花钱</text>

    <rect x="648" y="380" width="572" height="150" rx="12" fill="#1F5C45"/>
    <text x="676" y="412" font-size="15.5" font-weight="700" fill="#FFFFFF">对照：钱都花在哪</text>
    <text x="676" y="444" font-size="13.5" fill="#D8E8E0">· 内容与知识库建设 35%（最大头，也是壁垒）</text>
    <text x="676" y="472" font-size="13.5" fill="#D8E8E0">· 团队（技术+编辑+运营）45%</text>
    <text x="676" y="500" font-size="13.5" fill="#D8E8E0">· 算力/牌照/市场 20%（营销克制，靠内容自然流）</text>
  </g>

  <!-- 本页要点 -->
  <rect x="60" y="548" width="1159" height="88" rx="12" fill="#2B2B2B"/>
  <text x="90" y="580" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页要点</text>
  <text x="90" y="608" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">基准情景下 Y3 转正、累计投入约 2,000 万——比问止（3 年烧 3.93 亿）轻一个数量级，核心差异就是内容获客替代投放获客 + 轻资产履约。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">推演：小爱构建（C级，假设在演讲备注）· 对照数据 A-/B+</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">13 / 18</text>
</svg>
