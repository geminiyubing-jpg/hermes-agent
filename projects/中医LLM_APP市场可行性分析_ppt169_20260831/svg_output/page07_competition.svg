<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">竞争格局：22 个中医大模型的三国杀</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">产业派 / 学术派 / 大厂派 —— 谁在做古籍内容？答案是：几乎没人认真做</text>

  <!-- 三阵营 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="373" height="270" rx="12" fill="#FFFFFF" stroke="#B3541E" stroke-width="1.5"/>
    <text x="88" y="146" font-size="16" font-weight="700" fill="#B3541E">产业/平台派（7个）· C端直接竞争</text>
    <text x="88" y="176" font-size="13" fill="#2B2B2B">问止中医「中医大脑」★</text>
    <text x="88" y="198" font-size="12" fill="#6B6B6B">  临床辅助+线上诊疗，递表港交所</text>
    <text x="88" y="224" font-size="13" fill="#2B2B2B">固生堂「国医AI分身」</text>
    <text x="88" y="246" font-size="12" fill="#6B6B6B">  13个名医分身，绑定线下101家店</text>
    <text x="88" y="272" font-size="13" fill="#2B2B2B">岐黄问道/素问/数智岐黄</text>
    <text x="88" y="294" font-size="12" fill="#6B6B6B">  辨证/养生/出海/航天场景各异</text>
    <text x="88" y="322" font-size="12.5" fill="#B3541E" font-weight="600">共性：全部押注临床辨证场景</text>
    <text x="88" y="346" font-size="12.5" fill="#6B6B6B">古籍内容 = 辅助语料，非产品主线</text>

    <rect x="453" y="112" width="373" height="270" rx="12" fill="#FFFFFF" stroke="#1F5C45" stroke-width="1.5"/>
    <text x="481" y="146" font-size="16" font-weight="700" fill="#1F5C45">学术/医院派（9个）· 科研导向</text>
    <text x="481" y="176" font-size="13" fill="#2B2B2B">华佗GPT（港中深）★开源</text>
    <text x="481" y="198" font-size="12" fill="#6B6B6B">  龙岗12医院导诊30万人次</text>
    <text x="481" y="224" font-size="13" fill="#2B2B2B">广医·岐智（广安门+百度华为）</text>
    <text x="481" y="246" font-size="12" fill="#6B6B6B">  407万病例+1400万知识图谱</text>
    <text x="481" y="272" font-size="13" fill="#2B2B2B">海河·岐伯 · 最接近古籍赛道</text>
    <text x="481" y="294" font-size="12" fill="#6B6B6B">  《四库全书》医家类知识图谱</text>
    <text x="481" y="322" font-size="12.5" fill="#1F5C45" font-weight="600">共性：论文导向，无 C 端产品化</text>
    <text x="481" y="346" font-size="12.5" fill="#6B6B6B">海河·岐伯证明技术可行但未商业化</text>

    <rect x="846" y="112" width="373" height="270" rx="12" fill="#FFFFFF" stroke="#C9A227" stroke-width="1.5"/>
    <text x="874" y="146" font-size="16" font-weight="700" fill="#A08318">大厂派（6个）· 生态卡位</text>
    <text x="874" y="176" font-size="13" fill="#2B2B2B">华为「神农大脑」</text>
    <text x="874" y="198" font-size="12" fill="#6B6B6B">  联合云南白药/成中医，全链条</text>
    <text x="874" y="224" font-size="13" fill="#2B2B2B">腾讯混元医疗版/讯飞星火中医</text>
    <text x="874" y="246" font-size="12" fill="#6B6B6B">  亳州107家基层机构落地</text>
    <text x="874" y="272" font-size="13" fill="#2B2B2B">阿里/百度/智谱数字中医</text>
    <text x="874" y="294" font-size="12" fill="#6B6B6B">  挂靠医院项目制合作</text>
    <text x="874" y="322" font-size="12.5" fill="#A08318" font-weight="600">共性：B端/G端生意，不做C端内容</text>
    <text x="874" y="346" font-size="12.5" fill="#6B6B6B">威胁在于随时可降维打击</text>
  </g>

  <!-- 空白地带 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="402" width="750" height="234" rx="12" fill="#1F5C45"/>
    <text x="88" y="440" font-size="17" font-weight="700" fill="#FFFFFF">市场空白：古籍结构化内容 × C 端产品</text>
    <text x="88" y="476" font-size="14" fill="#D8E8E0">· 22 个模型扎堆「辨证遣方」，古籍仅作训练语料，无一做成</text>
    <text x="88" y="500" font-size="14" fill="#D8E8E0">  可检索、可对照、可溯源的知识产品（海河·岐伯停在科研）</text>
    <text x="88" y="528" font-size="14" fill="#D8E8E0">· 现有 C 端中医 APP（大家中医等）有古籍阅读但无 LLM 交互</text>
    <text x="88" y="552" font-size="14" fill="#D8E8E0">· 通用大模型能答常识题，答不了版本学/注家对照深度问题</text>
    <text x="88" y="588" font-size="14.5" fill="#C9A227" font-weight="600">→ 「LLM×古籍×C端」交叉点当前无强者占位，窗口 12-24 个月</text>
    <text x="88" y="616" font-size="12.5" fill="#D8E8E0">  （大厂若入局需重组内容团队，给了先行者建壁垒的时间）</text>

    <rect x="830" y="402" width="390" height="234" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="858" y="438" font-size="15" font-weight="700" fill="#B3541E">竞争的终局判断</text>
    <text x="858" y="470" font-size="13" fill="#2B2B2B">· 模型层无壁垒（开源基座人人可用）</text>
    <text x="858" y="496" font-size="13" fill="#2B2B2B">· 数据层半壁垒（古籍公版+整理可自建）</text>
    <text x="858" y="522" font-size="13" fill="#2B2B2B">· 场景层真壁垒（学习习惯+社群+医生网络）</text>
    <text x="858" y="556" font-size="13" fill="#2B2B2B">· 终局：内容 APP 会被通用 AI 蚕食，</text>
    <text x="858" y="580" font-size="13" fill="#2B2B2B">  「内容+问诊」闭环才有护城河</text>
    <text x="858" y="614" font-size="12.5" fill="#6B6B6B">参照：华佗GPT开源但问止仍在做闭环</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：答魔研究院22模型盘点/各机构官网/招股书（B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">07 / 18</text>
</svg>
