  <text x="84" y="446" font-family="'PingFang SC', sans-serif" font-size="15" fill="#2B2B2B">调研方法：一手政策文件 + 上市公司财报 + 行业报告交叉验证，来源分级 A/B/C</text>
  <text x="84" y="476" font-family="'PingFang SC', sans-serif" font-size="15" fill="#2B2B2B">结论预览：条件可行 —— 内容壁垒可建，变现链路是生死线</text>

