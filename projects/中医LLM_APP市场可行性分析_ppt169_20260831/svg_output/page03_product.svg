<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">产品构想：三支柱与用户旅程</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">「典籍智能」= 古籍知识底座 × LLM 问答 × 医生在线问诊的转诊闭环</text>

  <!-- 三支柱 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="373" height="220" rx="12" fill="#FFFFFF" stroke="#1F5C45" stroke-width="1.5"/>
    <rect x="60" y="112" width="373" height="48" rx="12" fill="#1F5C45"/>
    <text x="246" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">支柱一 · 古籍智能知识库</text>
    <text x="88" y="188" font-size="13.5" fill="#2B2B2B">对 300+ 种核心古籍（内经/伤寒/金匮/温病…）</text>
    <text x="88" y="212" font-size="13.5" fill="#2B2B2B">做三层结构化：</text>
    <text x="88" y="240" font-size="13" fill="#6B6B6B">① 原文层：多版本对勘+异体字规范化</text>
    <text x="88" y="264" font-size="13" fill="#6B6B6B">② 知识层：术语对齐/方证索引/药物配伍图谱</text>
    <text x="88" y="288" font-size="13" fill="#6B6B6B">③ 解读层：现代汉语释义+历代注家对照</text>
    <text x="88" y="316" font-size="12.5" fill="#1F5C45" font-weight="600">壁垒：竞品聚焦临床，古籍内容赛道相对空白</text>

    <rect x="453" y="112" width="373" height="220" rx="12" fill="#FFFFFF" stroke="#C9A227" stroke-width="1.5"/>
    <rect x="453" y="112" width="373" height="48" rx="12" fill="#A08318"/>
    <text x="639" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">支柱二 · LLM 智能问答</text>
    <text x="481" y="188" font-size="13.5" fill="#2B2B2B">RAG 架构：知识库检索 + 生成回答</text>
    <text x="481" y="216" font-size="13" fill="#6B6B6B">· 学习模式：逐条讲条文，像有个师父带读</text>
    <text x="481" y="240" font-size="13" fill="#6B6B6B">· 查询模式：症状→经典方剂线索（附原文出处）</text>
    <text x="481" y="264" font-size="13" fill="#6B6B6B">· 比较模式：历代注家对同一条文的不同解读</text>
    <text x="481" y="292" font-size="12.5" fill="#A08318" font-weight="600">安全设计：十八反/妊娠禁忌硬规则拦截</text>
    <text x="481" y="316" font-size="12.5" fill="#6B6B6B">输出永远标注「教育参考，不构成诊疗建议」</text>

    <rect x="846" y="112" width="373" height="220" rx="12" fill="#FFFFFF" stroke="#B3541E" stroke-width="1.5"/>
    <rect x="846" y="112" width="373" height="48" rx="12" fill="#B3541E"/>
    <text x="1032" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">支柱三 · 医生在线问诊</text>
    <text x="874" y="188" font-size="13.5" fill="#2B2B2B">与实体互联网医院合作挂靠资质</text>
    <text x="874" y="216" font-size="13" fill="#6B6B6B">· AI 预问诊：结构化采集症状/舌象照片</text>
    <text x="874" y="240" font-size="13" fill="#6B6B6B">· 医生接诊：执业医师本人辨证开方</text>
    <text x="874" y="264" font-size="13" fill="#6B6B6B">· 转诊逻辑：AI 讲不清的，正是医生的价值</text>
    <text x="874" y="292" font-size="12.5" fill="#B3541E" font-weight="600">变现核心：问诊费+处方流转+复诊会员</text>
    <text x="874" y="316" font-size="12.5" fill="#6B6B6B">参照固生堂复诊率 70%+ 的会员模型</text>
  </g>

  <!-- 用户旅程 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="368" font-size="16" font-weight="600" fill="#2B2B2B">用户旅程：从好奇到付费的四级火箭</text>
    <rect x="60" y="386" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="195" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#1F5C45">① 发现（免费）</text>
    <text x="195" y="442" text-anchor="middle" font-size="12.5" fill="#6B6B6B">刷到「仲景为什么这样开方」</text>
    <text x="195" y="464" text-anchor="middle" font-size="12.5" fill="#6B6B6B">短视频/公众号 → 下载 APP</text>
    <text x="338" y="444" font-size="22" fill="#9B9B9B">→</text>
    <rect x="364" y="386" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="499" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#1F5C45">② 学习（免费+订阅）</text>
    <text x="499" y="442" text-anchor="middle" font-size="12.5" fill="#6B6B6B">问 LLM 条文/查方剂/读经典解读</text>
    <text x="499" y="464" text-anchor="middle" font-size="12.5" fill="#6B6B6B">会员解锁深度课程（首笔收入）</text>
    <text x="642" y="444" font-size="22" fill="#9B9B9B">→</text>
    <rect x="668" y="386" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="803" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#1F5C45">③ 问诊（付费）</text>
    <text x="803" y="442" text-anchor="middle" font-size="12.5" fill="#6B6B6B">AI 预问诊 → 医生接诊开方</text>
    <text x="803" y="464" text-anchor="middle" font-size="12.5" fill="#6B6B6B">问诊费 30-100 元/次</text>
    <text x="946" y="444" font-size="22" fill="#9B9B9B">→</text>
    <rect x="972" y="386" width="248" height="110" rx="10" fill="#1F5C45"/>
    <text x="1096" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">④ 复购（LTV）</text>
    <text x="1096" y="442" text-anchor="middle" font-size="12.5" fill="#D8E8E0">复诊+代煎配送+体质调理方案</text>
    <text x="1096" y="464" text-anchor="middle" font-size="12.5" fill="#C9A227">会员制锁定长期价值</text>
  </g>

  <!-- 本页要点 -->
  <rect x="60" y="524" width="1159" height="112" rx="12" fill="#2B2B2B"/>
  <text x="90" y="558" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页要点</text>
  <text x="90" y="586" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">① 三支柱互为因果：知识库是获客抓手（免费）、问答是留存引擎（订阅）、问诊是变现出口（付费）——缺一条腿都是纯工具，纯工具已被问止证明难盈利。</text>
  <text x="90" y="614" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">② 与通用大模型的差异化不在模型而在数据：DeepSeek 能答「什么是桂枝汤」，但答不出「成无己 vs 柯琴对桂枝汤病机的分歧及原文依据」——结构化古籍就是护城河。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">产品设计：小爱基于竞品分析构建 · 问诊定价参照市场行情</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">03 / 18</text>
</svg>
