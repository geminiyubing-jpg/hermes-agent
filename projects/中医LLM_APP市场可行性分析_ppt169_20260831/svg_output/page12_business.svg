<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">商业模式：五条收入线与单位经济</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">从免费获客到 LTV 最大化 —— 收入结构与单客模型</text>

  <!-- 收入结构 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="80" y="130" font-size="16" font-weight="600" fill="#1F5C45">第三年目标收入结构（合计 ~1.5 亿）</text>
    <!-- 横向堆叠条 -->
    <rect x="100" y="150" width="270" height="46" fill="#1F5C45"/>
    <rect x="370" y="150" width="230" height="46" fill="#B3541E"/>
    <rect x="600" y="150" width="170" height="46" fill="#C9A227"/>
    <rect x="770" y="150" width="130" height="46" fill="#4A7BA6"/>
    <rect x="900" y="150" width="100" height="46" fill="#8C6F14"/>
    <g font-size="13" font-weight="600" fill="#FFFFFF">
      <text x="235" y="179" text-anchor="middle">问诊分成 36%</text>
      <text x="485" y="179" text-anchor="middle">药材电商 30%</text>
      <text x="685" y="179" text-anchor="middle">会员订阅 23%</text>
      <text x="835" y="179" text-anchor="middle">B端授权 9%</text>
      <text x="950" y="179" text-anchor="middle">课程 6%</text>
    </g>
    <text x="100" y="224" font-size="12.5" fill="#6B6B6B">结构逻辑：参照固生堂（医疗服务99%）+问止（产品线25%）的混合，前期订阅为主、后期问诊电商放量</text>
  </g>

  <!-- 单位经济 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="252" width="572" height="246" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="286" font-size="16" font-weight="700" fill="#1F5C45">单客经济模型（付费用户口径）</text>
    <g font-family="'Helvetica Neue', sans-serif">
      <text x="88" y="320" font-size="13.5" fill="#2B2B2B">LTV（3年）　　<tspan font-weight="700" fill="#1F5C45">¥820</tspan></text>
      <text x="88" y="348" font-size="12.5" fill="#6B6B6B">　= 订阅 198×2.2年 + 问诊分成 120 + 电商毛利 180 + 课程 84</text>
      <text x="88" y="384" font-size="13.5" fill="#2B2B2B">CAC（目标）　<tspan font-weight="700" fill="#A08318">¥180</tspan></text>
      <text x="88" y="412" font-size="12.5" fill="#6B6B6B">　= 内容获客 90（B站/知乎自然流）+ 投放 60 + 裂变 30</text>
      <text x="88" y="448" font-size="15" font-weight="700" fill="#1F5C45">LTV/CAC ≈ 4.6（健康线 &gt;3）</text>
      <text x="88" y="478" font-size="12.5" fill="#B3541E">对照：问止获客失控正是因为 LTV/CAC &lt; 1.5（估算）</text>
    </g>

    <rect x="648" y="252" width="572" height="246" rx="12" fill="#1F5C45"/>
    <text x="676" y="286" font-size="16" font-weight="700" fill="#FFFFFF">问诊闭环的分成设计</text>
    <text x="676" y="318" font-size="13.5" fill="#D8E8E0">· 医生：问诊费 70%（高于平台惯例，换名医入驻）</text>
    <text x="676" y="346" font-size="13.5" fill="#D8E8E0">· 平台：问诊费 30% + 处方流转至合作药房佣金</text>
    <text x="676" y="374" font-size="13.5" fill="#D8E8E0">· AI 预问诊的价值：把 15 分钟问诊压缩到 8 分钟，</text>
    <text x="676" y="398" font-size="13.5" fill="#D8E8E0">  医生时薪提升 → 愿意留在平台（固生堂逻辑）</text>
    <text x="676" y="434" font-size="13.5" fill="#C9A227" font-weight="600">关键依赖：互联网医院牌照（挂靠合作 ¥30-80万/年）</text>
    <text x="676" y="462" font-size="13.5" fill="#D8E8E0">复诊续方是利润奶牛：慢病调理 3 个月一疗程</text>
  </g>

  <!-- 增长飞轮 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="518" width="1160" height="118" rx="12" fill="#2B2B2B"/>
    <text x="90" y="552" font-size="15" font-weight="600" fill="#C9A227">增长飞轮：内容 → 数据 → 体验 → 口碑</text>
    <text x="90" y="582" font-size="13.5" fill="#FFFFFF">古籍内容吸引学习用户 → 提问数据暴露知识盲区 → 定向补标注提升回答质量 → 专业口碑带来医生与患者 → 问诊收入反哺内容建设</text>
    <text x="90" y="610" font-size="13.5" fill="#FFFFFF">飞轮的启动键是内容质量（P10 知识库），润滑剂是数据回流（每万次提问沉淀一次盲区清单）——两者都是时间的朋友，钱买不来捷径。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">模型：小爱构建 · LTV/CAC 数字为 C 级估算（假设见备注）· 分成比例参照行业惯例</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">12 / 18</text>
</svg>
