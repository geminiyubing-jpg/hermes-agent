<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">技术方案：四层架构与安全设计</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">开源基座 + RAG 知识库 + 规则引擎兜底 —— 初始算力投入可控在百万级</text>

  <!-- 架构分层 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="700" height="72" rx="10" fill="#B3541E"/>
    <text x="88" y="140" font-size="14.5" font-weight="700" fill="#FFFFFF">应用层 · APP / 小程序 / API</text>
    <text x="88" y="164" font-size="12.5" fill="#F5D9CB">学习模式 / 查询模式 / 比较模式 / 预问诊表单 / 医生工作台</text>

    <rect x="60" y="192" width="700" height="72" rx="10" fill="#C9A227"/>
    <text x="88" y="220" font-size="14.5" font-weight="700" fill="#FFFFFF">编排层 · Agent + 安全护栏</text>
    <text x="88" y="244" font-size="12.5" fill="#FBF3DC">意图识别 → 检索策略 → 生成约束 → 十八反/剂量/妊娠禁忌硬规则拦截 → 引用回链</text>

    <rect x="60" y="272" width="340" height="72" rx="10" fill="#1F5C45"/>
    <text x="88" y="300" font-size="14.5" font-weight="700" fill="#FFFFFF">模型层 · 开源基座+领域微调</text>
    <text x="88" y="324" font-size="12.5" fill="#D8E8E0">Qwen/GLM 开源底座 + 古籍语料 SFT</text>
    <rect x="420" y="272" width="340" height="72" rx="10" fill="#1F5C45" opacity="0.82"/>
    <text x="448" y="300" font-size="14.5" font-weight="700" fill="#FFFFFF">知识层 · RAG 向量库+知识图谱</text>
    <text x="448" y="324" font-size="12.5" fill="#D8E8E0">三层古籍库向量化 + 方证/药物图谱</text>

    <rect x="60" y="352" width="700" height="60" rx="10" fill="#2B2B2B"/>
    <text x="88" y="376" font-size="14.5" font-weight="700" fill="#FFFFFF">数据层 · 语料流水线</text>
    <text x="88" y="398" font-size="12.5" fill="#C9C9C9">OCR → 异体字规范化 → LLM 预标注 → 中医编辑校对 → 版本对勘入库</text>
  </g>

  <!-- 右侧要点 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="784" y="112" width="436" height="300" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="810" y="144" font-size="15.5" font-weight="700" fill="#1F5C45">四个关键技术决策</text>
    <text x="810" y="176" font-size="13" fill="#2B2B2B" font-weight="600">① 不自训基座模型</text>
    <text x="810" y="198" font-size="12.5" fill="#6B6B6B">   开源底座+SFT+RAG 足够；省下千万级训练费</text>
    <text x="810" y="226" font-size="13" fill="#2B2B2B" font-weight="600">② RAG 优先于微调</text>
    <text x="810" y="248" font-size="12.5" fill="#6B6B6B">   知识更新快、可溯源、幻觉可控（引用原文页码）</text>
    <text x="810" y="276" font-size="13" fill="#2B2B2B" font-weight="600">③ 安全靠规则引擎不靠概率</text>
    <text x="810" y="298" font-size="12.5" fill="#6B6B6B">   配伍禁忌/剂量上限用确定性代码拦截，零容忍</text>
    <text x="810" y="326" font-size="13" fill="#2B2B2B" font-weight="600">④ 多模态留接口</text>
    <text x="810" y="348" font-size="12.5" fill="#6B6B6B">   舌诊拍照分析为 V2 差异化（已有竞品先例可参照）</text>
    <rect x="810" y="362" width="384" height="32" rx="6" fill="#1F5C45" opacity="0.08"/>
    <text x="1002" y="383" text-anchor="middle" font-size="12.5" fill="#1F5C45" font-weight="600">全部组件开源可得，无被卡脖子环节</text>
  </g>

  <!-- 成本 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="432" width="373" height="180" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="464" font-size="15" font-weight="700" fill="#A08318">初始技术投入（首年）</text>
    <text x="88" y="494" font-size="13" fill="#2B2B2B">· SFT 训练（租用算力）：~40 万</text>
    <text x="88" y="518" font-size="13" fill="#2B2B2B">· 向量库+推理 API（按量）：~30 万</text>
    <text x="88" y="542" font-size="13" fill="#2B2B2B">· 技术团队 5 人：~150 万</text>
    <text x="88" y="572" font-size="13" font-weight="600" fill="#1F5C45">合计 ~220 万（毛利率影响可控）</text>

    <rect x="453" y="432" width="373" height="180" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="481" y="464" font-size="15" font-weight="700" fill="#A08318">文言文处理难点与对策</text>
    <text x="481" y="494" font-size="13" fill="#2B2B2B">· 异体字/通假字 → 规范化映射表</text>
    <text x="481" y="518" font-size="13" fill="#2B2B2B">· 版本歧义 → 多版本对勘标记</text>
    <text x="481" y="542" font-size="13" fill="#2B2B2B">· 概念体系鸿沟 → 术语对齐表</text>
    <text x="481" y="572" font-size="12.5" fill="#6B6B6B">参照：华佗GPT蒸馏+真实医生语料融合路线已验证</text>

    <rect x="846" y="432" width="373" height="180" rx="12" fill="#2B2B2B"/>
    <text x="874" y="464" font-size="15" font-weight="700" fill="#C9A227">合规技术设计</text>
    <text x="874" y="494" font-size="13" fill="#FFFFFF">· 输出强制 disclaimer + 处方权限锁死</text>
    <text x="874" y="518" font-size="13" fill="#FFFFFF">· 全链路日志留痕（监管可审计）</text>
    <text x="874" y="542" font-size="13" fill="#FFFFFF">· 数据本地化（医疗数据不出域方案）</text>
    <text x="874" y="572" font-size="12.5" fill="#C9A227">为未来医疗器械备案预留接口</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">技术方案：小爱构建（开源组件均公开可得）· 投入为估算C级</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">11 / 18</text>
</svg>
