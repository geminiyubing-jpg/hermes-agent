<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">市场规模：TAM / SAM / SOM 三层测算</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">从万亿产业到可服务市场，逐层收窄的逻辑与依据</text>

  
  <g>
    <circle cx="380" cy="330" r="230" fill="#1F5C45" opacity="0.10" />
    <circle cx="380" cy="330" r="160" fill="#1F5C45" opacity="0.16" />
    <circle cx="380" cy="330" r="90" fill="#1F5C45" opacity="0.26" />
    <text x="380" y="140" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1F5C45">TAM 中医大健康产业</text>
    <text x="380" y="164" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#1F5C45">1.12 万亿</text>
    <text x="380" y="186" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#6B6B6B">2025E · 含中药/诊疗/养生全链</text>
    <text x="380" y="238" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#1F5C45">SAM 中医数字服务</text>
    <text x="380" y="262" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="19" font-weight="700" fill="#1F5C45">~1500 亿</text>
    <text x="380" y="282" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#6B6B6B">在线问诊+数字疗法+知识付费</text>
    <text x="380" y="316" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF">SOM 三年可获取</text>
    <text x="380" y="342" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">3-5 亿</text>
    <text x="380" y="362" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#D8E8E0">100万付费用户×客单300元</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M692,112 H1208 A12,12 0 0 1 1220,124 V250 A12,12 0 0 1 1208,262 H692 A12,12 0 0 1 680,250 V124 A12,12 0 0 1 692,112 Z" />
    <text x="706" y="144" font-size="15" font-weight="700" fill="#1F5C45">TAM 口径：为什么是 1.12 万亿</text>
    <text x="706" y="172" font-size="13" fill="#2B2B2B">· 中医药产业总规模 2024 实绩 1.05 万亿（+11.6%），2025E 1.12 万亿</text>
    <text x="706" y="196" font-size="13" fill="#2B2B2B">· 中医诊疗服务细分：2019 年 2920 亿 → 2030E 1.8 万亿（F&amp;S，CAGR 18.2%）</text>
    <text x="706" y="220" font-size="13" fill="#2B2B2B">· 药食同源 3700 亿 + 跨界业态（养生饮品/康养文旅）为新增量</text>
    <text x="706" y="246" font-size="12" fill="#9B9B9B">来源：供应链发展报告2025(A) / Frost &amp; Sullivan(B+)</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M692,278 H1208 A12,12 0 0 1 1220,290 V416 A12,12 0 0 1 1208,428 H692 A12,12 0 0 1 680,416 V290 A12,12 0 0 1 692,278 Z" />
    <text x="706" y="310" font-size="15" font-weight="700" fill="#1F5C45">SAM 口径：数字服务切多少</text>
    <text x="706" y="338" font-size="13" fill="#2B2B2B">· 互联网医疗大盘 4769 亿（2025，+13%），其中在线问诊+健康管理约 30%</text>
    <text x="706" y="362" font-size="13" fill="#2B2B2B">· 中医线上渗透率按 10-15% 估（问止线上收入占比 90% 佐证可行性）</text>
    <text x="706" y="386" font-size="13" fill="#2B2B2B">· 叠加中医知识付费/课程市场（问止生活产品线为参照）→ ~1500 亿</text>
    <text x="706" y="412" font-size="12" fill="#9B9B9B">来源：网经社(B+) · 估算标注为 C 级（逻辑链可复核）</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M692,444 H1208 A12,12 0 0 1 1220,456 V582 A12,12 0 0 1 1208,594 H692 A12,12 0 0 1 680,582 V456 A12,12 0 0 1 692,444 Z" />
    <text x="706" y="476" font-size="15" font-weight="700" fill="#1F5C45">SOM 口径：三年目标测算</text>
    <text x="706" y="504" font-size="13" fill="#2B2B2B">· 对标：问止中医 2024 营收 2.36 亿（市占 1.5%）——SOM 3-5 亿 ≈ 摸到行业前五</text>
    <text x="706" y="528" font-size="13" fill="#2B2B2B">· 100 万付费用户：注册用户 800 万 × 付费转化 12.5%（订阅+问诊混合）</text>
    <text x="706" y="552" font-size="13" fill="#2B2B2B">· 客单价 300 元/年：会员 198 × 40% + 问诊 60 元/次 × 1.6 次 × 60%</text>
    <text x="706" y="578" font-size="12" fill="#9B9B9B">估算 C 级 · 敏感性分析见 P14 财务推演</text>
  </g>

  
  <path fill="#1F5C45" d="M70,614 H1209 A10,10 0 0 1 1219,624 V652 A10,10 0 0 1 1209,662 H70 A10,10 0 0 1 60,652 V624 A10,10 0 0 1 70,614 Z" />
  <text x="90" y="644" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">要点：市场不是问题——万亿 TAM 千亿 SAM 都成立；真正的约束是 SOM 的获取成本与转化率，P13-14 用单位经济回答。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：供应链报告/F&amp;S/网经社/招股书（A/B+）· SOM 为测算</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">04 / 18</text>
</svg>