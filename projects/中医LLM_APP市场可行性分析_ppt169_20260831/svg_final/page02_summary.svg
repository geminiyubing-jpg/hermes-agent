<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">执行摘要：条件可行，变现链路是生死线</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">一页看懂：三个判断、三个条件、三个风险</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#1F5C45" stroke-width="1.5" d="M72,112 H421 A12,12 0 0 1 433,124 V280 A12,12 0 0 1 421,292 H72 A12,12 0 0 1 60,280 V124 A12,12 0 0 1 72,112 Z" />
    <text x="88" y="146" font-size="15" font-weight="700" fill="#1F5C45">判断① 需求真实存在 ★★★★</text>
    <text x="88" y="176" font-size="13" fill="#2B2B2B">· 中医药产业 1.05万亿且双位数增长</text>
    <text x="88" y="200" font-size="13" fill="#2B2B2B">· 中医诊疗服务 2030E 1.8万亿</text>
    <text x="88" y="224" font-size="13" fill="#2B2B2B">· Z世代养生+银发慢病双轮驱动</text>
    <text x="88" y="248" font-size="13" fill="#2B2B2B">· 4.11亿互联网医疗用户基本盘</text>
    <text x="88" y="272" font-size="12" fill="#6B6B6B">  唯一隐忧：用户规模首次负增长</text>

    <path fill="#FFFFFF" stroke="#C9A227" stroke-width="1.5" d="M465,112 H814 A12,12 0 0 1 826,124 V280 A12,12 0 0 1 814,292 H465 A12,12 0 0 1 453,280 V124 A12,12 0 0 1 465,112 Z" />
    <text x="481" y="146" font-size="15" font-weight="700" fill="#A08318">判断② 窗口期真实但窄 ★★★</text>
    <text x="481" y="176" font-size="13" fill="#2B2B2B">· 22个中医大模型混战，但多数聚焦</text>
    <text x="481" y="200" font-size="13" fill="#2B2B2B">  临床辨证，「古籍结构化内容」赛道</text>
    <text x="481" y="224" font-size="13" fill="#2B2B2B">  相对空白，是差异化切口</text>
    <text x="481" y="248" font-size="13" fill="#2B2B2B">· 政策明文鼓励数字中医药（2024.6号文）</text>
    <text x="481" y="272" font-size="12" fill="#6B6B6B">  但华为/腾讯/讯飞大厂已下场，窗口 12-24 个月</text>

    <path fill="#FFFFFF" stroke="#B3541E" stroke-width="1.5" d="M858,112 H1207 A12,12 0 0 1 1219,124 V280 A12,12 0 0 1 1207,292 H858 A12,12 0 0 1 846,280 V124 A12,12 0 0 1 858,112 Z" />
    <text x="874" y="146" font-size="15" font-weight="700" fill="#B3541E">判断③ 变现是最大死穴 ★★</text>
    <text x="874" y="176" font-size="13" fill="#2B2B2B">· AI 禁止自动开方 → 知识服务只能</text>
    <text x="874" y="200" font-size="13" fill="#2B2B2B">  做「参考与教育」，不能直接开药</text>
    <text x="874" y="224" font-size="13" fill="#2B2B2B">· 问止中医 3 年亏 3.93 亿证明：</text>
    <text x="874" y="248" font-size="13" fill="#2B2B2B">  纯线上中医难盈利</text>
    <text x="874" y="272" font-size="12" fill="#6B6B6B">  必须走「内容获客 → 问诊转化 → 复购闭环」</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#1F5C45" d="M72,312 H620 A12,12 0 0 1 632,324 V624 A12,12 0 0 1 620,636 H72 A12,12 0 0 1 60,624 V324 A12,12 0 0 1 72,312 Z" />
    <text x="88" y="350" font-size="17" font-weight="700" fill="#FFFFFF">可行的三个前提条件</text>
    <text x="88" y="390" font-size="14" fill="#FFFFFF" font-weight="600">1. 内容壁垒先行</text>
    <text x="88" y="414" font-size="13" fill="#D8E8E0">   先建成 300+ 种核心古籍的结构化知识库（术语对齐+</text>
    <text x="88" y="436" font-size="13" fill="#D8E8E0">   方证索引+现代解读三层），这是 DeepSeek/通用模型抄不走的</text>
    <text x="88" y="472" font-size="14" fill="#FFFFFF" font-weight="600">2. 合规定位「助手」而非「医生」</text>
    <text x="88" y="496" font-size="13" fill="#D8E8E0">   问诊转化必须挂靠实体互联网医院资质；AI 输出永远标注</text>
    <text x="88" y="518" font-size="13" fill="#D8E8E0">   「仅供参考」，处方由执业医师本人完成</text>
    <text x="88" y="554" font-size="14" fill="#FFFFFF" font-weight="600">3. 单位经济跑通再放量</text>
    <text x="88" y="578" font-size="13" fill="#D8E8E0">   参照固生堂模型：复诊率&gt;70%、会员制、单客 LTV/CAC&gt;3</text>
    <text x="88" y="600" font-size="13" fill="#D8E8E0">   三项达标后再扩张，避免重蹈问止覆辙</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M660,312 H1208 A12,12 0 0 1 1220,324 V624 A12,12 0 0 1 1208,636 H660 A12,12 0 0 1 648,624 V324 A12,12 0 0 1 660,312 Z" />
    <text x="676" y="350" font-size="17" font-weight="700" fill="#B3541E">必须盯死的三个风险</text>
    <text x="676" y="390" font-size="14" fill="#2B2B2B" font-weight="600">1. 巨头碾压（概率 高）</text>
    <text x="676" y="414" font-size="13" fill="#6B6B6B">   华为神农大脑/讯飞星火已进基层；内容壁垒窗口只有12-24月</text>
    <text x="676" y="450" font-size="14" fill="#2B2B2B" font-weight="600">2. 合规收紧（概率 中）</text>
    <text x="676" y="474" font-size="13" fill="#6B6B6B">   AI开方禁令若扩大到「AI辨证建议」，产品需降级为纯教育工具</text>
    <text x="676" y="510" font-size="14" fill="#2B2B2B" font-weight="600">3. 版权与数据（概率 中低）</text>
    <text x="676" y="534" font-size="13" fill="#6B6B6B">   整理本古籍有版权；医疗数据出域受限制，需授权+联邦方案</text>
    <text x="676" y="578" font-size="13" fill="#2B2B2B" font-weight="600">结论：Go，但分阶段验证——</text>
    <text x="676" y="602" font-size="13" fill="#B3541E" font-weight="600">先 6 个月 MVP 验证内容壁垒与留存，再决定问诊闭环投入</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">评级与概率为小爱综合判断 · 市场数据 A/B+ 级见后页</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">02 / 18</text>
</svg>