<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">Go / No-Go 决策矩阵</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">六个维度打分 —— 结论：有条件 Go，条件即行动项</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="1160" height="38" fill="#2B2B2B" />
    <text x="200" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">维度</text>
    <text x="560" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">评分依据（一句话）</text>
    <text x="1010" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#C9A227">得分 / 判断</text>

    <rect x="60" y="150" width="1160" height="52" fill="#FFFFFF" />
    <text x="200" y="182" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2B2B2B">市场空间</text>
    <text x="560" y="182" text-anchor="middle" font-size="13" fill="#6B6B6B">万亿 TAM / 千亿 SAM，双位数增长</text>
    <path fill="#1F5C45" d="M934,162 H1086 A14,14 0 0 1 1100,176 V176 A14,14 0 0 1 1086,190 H934 A14,14 0 0 1 920,176 V176 A14,14 0 0 1 934,162 Z" />
    <text x="1010" y="181" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">9/10 · 通过</text>

    <rect x="60" y="202" width="1160" height="52" fill="#F2EDE3" />
    <text x="200" y="234" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2B2B2B">政策环境</text>
    <text x="560" y="234" text-anchor="middle" font-size="13" fill="#6B6B6B">数字中医药东风，但 AI 处方红线硬</text>
    <path fill="#1F5C45" d="M934,214 H1086 A14,14 0 0 1 1100,228 V228 A14,14 0 0 1 1086,242 H934 A14,14 0 0 1 920,228 V228 A14,14 0 0 1 934,214 Z" />
    <text x="1010" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">7/10 · 通过</text>

    <rect x="60" y="254" width="1160" height="52" fill="#FFFFFF" />
    <text x="200" y="286" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2B2B2B">差异化壁垒</text>
    <text x="560" y="286" text-anchor="middle" font-size="13" fill="#6B6B6B">古籍结构化空白带，窗口 12-24 个月</text>
    <path fill="#C9A227" d="M934,266 H1086 A14,14 0 0 1 1100,280 V280 A14,14 0 0 1 1086,294 H934 A14,14 0 0 1 920,280 V280 A14,14 0 0 1 934,266 Z" />
    <text x="1010" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">7/10 · 通过</text>

    <rect x="60" y="306" width="1160" height="52" fill="#F2EDE3" />
    <text x="200" y="338" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2B2B2B">技术可行性</text>
    <text x="560" y="338" text-anchor="middle" font-size="13" fill="#6B6B6B">开源全链路可得，竞品已验证路线</text>
    <path fill="#1F5C45" d="M934,318 H1086 A14,14 0 0 1 1100,332 V332 A14,14 0 0 1 1086,346 H934 A14,14 0 0 1 920,332 V332 A14,14 0 0 1 934,318 Z" />
    <text x="1010" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">8/10 · 通过</text>

    <rect x="60" y="358" width="1160" height="52" fill="#FFFFFF" />
    <text x="200" y="390" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2B2B2B">商业模式</text>
    <text x="560" y="390" text-anchor="middle" font-size="13" fill="#6B6B6B">问止证伪纯线上、固生堂证明闭环，LTV/CAC 4.6 可达</text>
    <path fill="#C9A227" d="M934,370 H1086 A14,14 0 0 1 1100,384 V384 A14,14 0 0 1 1086,398 H934 A14,14 0 0 1 920,384 V384 A14,14 0 0 1 934,370 Z" />
    <text x="1010" y="389" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">6/10 · 谨慎</text>

    <rect x="60" y="410" width="1160" height="52" fill="#F2EDE3" />
    <text x="200" y="442" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2B2B2B">竞争风险</text>
    <text x="560" y="442" text-anchor="middle" font-size="13" fill="#6B6B6B">巨头环伺，但暂无人做 C 端古籍内容</text>
    <path fill="#B3541E" d="M934,422 H1086 A14,14 0 0 1 1100,436 V436 A14,14 0 0 1 1086,450 H934 A14,14 0 0 1 920,436 V436 A14,14 0 0 1 934,422 Z" />
    <text x="1010" y="441" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">5/10 · 须盯防</text>
  </g>
  <rect x="60" y="112" width="1160" height="350" fill="none" stroke="#E5DED2" />

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#1F5C45" d="M72,484 H798 A12,12 0 0 1 810,496 V624 A12,12 0 0 1 798,636 H72 A12,12 0 0 1 60,624 V496 A12,12 0 0 1 72,484 Z" />
    <text x="90" y="520" font-size="19" font-weight="700" fill="#FFFFFF">综合判定：有条件 GO ✚</text>
    <text x="90" y="552" font-size="14" fill="#D8E8E0">加权得分 7.2/10 —— 六维无致命否决项，两个条件：</text>
    <text x="90" y="580" font-size="14" fill="#C9A227" font-weight="600">① 6 个月内 MVP 验证留存 ≥35%（否则转 B 端）</text>
    <text x="90" y="606" font-size="14" fill="#C9A227" font-weight="600">② 首轮融资按保守情景 3,000 万到位</text>

    <path fill="#2B2B2B" d="M838,484 H1208 A12,12 0 0 1 1220,496 V624 A12,12 0 0 1 1208,636 H838 A12,12 0 0 1 826,624 V496 A12,12 0 0 1 838,484 Z" />
    <text x="854" y="520" font-size="15" font-weight="700" fill="#C9A227">立即可做的三件事</text>
    <text x="854" y="552" font-size="13.5" fill="#FFFFFF">1. 签约 2 名中医文献顾问（建库启动）</text>
    <text x="854" y="580" font-size="13.5" fill="#FFFFFF">2. 洽谈互联网医院挂靠意向（合规前置）</text>
    <text x="854" y="608" font-size="13.5" fill="#FFFFFF">3. B站开号发 30 条古籍科普（验证内容）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">决策框架：小爱构建 · 判得有据，改得随时——数据变化重跑此页</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">17 / 18</text>
</svg>