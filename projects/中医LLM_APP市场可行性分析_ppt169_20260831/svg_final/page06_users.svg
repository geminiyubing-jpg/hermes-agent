<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">用户画像：三类人群，三种付费逻辑</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">谁会用古籍问答 APP？谁会为在线问诊付费？——需求与付费意愿矩阵</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,112 H421 A12,12 0 0 1 433,124 V330 A12,12 0 0 1 421,342 H72 A12,12 0 0 1 60,330 V124 A12,12 0 0 1 72,112 Z" />
    <path fill="#1F5C45" d="M72,112 H421 A12,12 0 0 1 433,124 V144 A12,12 0 0 1 421,156 H72 A12,12 0 0 1 60,144 V124 A12,12 0 0 1 72,112 Z" />
    <text x="246" y="140" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">A · 中医学习者/从业者</text>
    <text x="88" y="182" font-size="13" fill="#2B2B2B">规模：中医院校在校生 20万+/年</text>
    <text x="88" y="206" font-size="13" fill="#2B2B2B">      + 师承/确有专长考生 + 基层医生</text>
    <text x="88" y="234" font-size="13" fill="#2B2B2B">需求：条文检索、注家对照、备考</text>
    <text x="88" y="258" font-size="13" fill="#2B2B2B">付费：专业版订阅 ¥399-899/年</text>
    <text x="88" y="288" font-size="12.5" fill="#1F5C45" font-weight="600">价值主张：替代翻十本工具书的效率</text>
    <text x="88" y="312" font-size="12.5" fill="#6B6B6B">对标：大家中医 APP 已验证付费意愿</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M465,112 H814 A12,12 0 0 1 826,124 V330 A12,12 0 0 1 814,342 H465 A12,12 0 0 1 453,330 V124 A12,12 0 0 1 465,112 Z" />
    <path fill="#C9A227" d="M465,112 H814 A12,12 0 0 1 826,124 V144 A12,12 0 0 1 814,156 H465 A12,12 0 0 1 453,144 V124 A12,12 0 0 1 465,112 Z" />
    <text x="639" y="140" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">B · 养生自我药疗者（Z世代）</text>
    <text x="481" y="182" font-size="13" fill="#2B2B2B">规模：16-35 岁食疗滋补人群占</text>
    <text x="481" y="206" font-size="13" fill="#2B2B2B">      35.9%（+4.2pct），基数亿级</text>
    <text x="481" y="234" font-size="13" fill="#2B2B2B">需求：体质测试、食疗方、节气养生</text>
    <text x="481" y="258" font-size="13" fill="#2B2B2B">付费：会员 ¥198/年 + 养生产品电商</text>
    <text x="481" y="288" font-size="12.5" fill="#A08318" font-weight="600">价值主张：比小红书靠谱，比去医院轻</text>
    <text x="481" y="312" font-size="12.5" fill="#6B6B6B">风险：付费意愿最低，需内容锚定</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M858,112 H1207 A12,12 0 0 1 1219,124 V330 A12,12 0 0 1 1207,342 H858 A12,12 0 0 1 846,330 V124 A12,12 0 0 1 858,112 Z" />
    <path fill="#B3541E" d="M858,112 H1207 A12,12 0 0 1 1219,124 V144 A12,12 0 0 1 1207,156 H858 A12,12 0 0 1 846,144 V124 A12,12 0 0 1 858,112 Z" />
    <text x="1032" y="140" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">C · 求诊患者（转化核心）</text>
    <text x="874" y="182" font-size="13" fill="#2B2B2B">规模：年中医诊疗 12 亿人次+</text>
    <text x="874" y="206" font-size="13" fill="#2B2B2B">      慢病/调理人群占七成</text>
    <text x="874" y="234" font-size="13" fill="#2B2B2B">需求：靠谱的在线问诊+复诊续方</text>
    <text x="874" y="258" font-size="13" fill="#2B2B2B">付费：问诊 ¥30-100/次 + 药费</text>
    <text x="874" y="288" font-size="12.5" fill="#B3541E" font-weight="600">价值主张：AI 预问诊省时+名医可及</text>
    <text x="874" y="312" font-size="12.5" fill="#6B6B6B">参照：问止复诊率 70%+ 验证黏性</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="380" font-size="16" font-weight="600" fill="#2B2B2B">需求强度 × 付费意愿矩阵</text>
    <line x1="120" y1="560" x2="700" y2="560" stroke="#9B9B9B" stroke-width="2" />
    <line x1="120" y1="410" x2="120" y2="560" stroke="#9B9B9B" stroke-width="2" />
    <text x="410" y="592" text-anchor="middle" font-size="13" fill="#6B6B6B">需求强度（低 → 高）</text>
    <text x="76" y="485" text-anchor="middle" font-size="13" fill="#6B6B6B" transform="rotate(-90 76 485)">付费意愿（低→高）</text>
    
    <circle cx="590" cy="440" r="34" fill="#1F5C45" opacity="0.85" />
    <text x="590" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">A</text>
    <text x="590" y="454" text-anchor="middle" font-size="10.5" fill="#FFFFFF">学习者</text>
    
    <circle cx="540" cy="500" r="30" fill="#B3541E" opacity="0.85" />
    <text x="540" y="497" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
    <text x="540" y="513" text-anchor="middle" font-size="10.5" fill="#FFFFFF">患者</text>
    
    <circle cx="300" cy="520" r="28" fill="#C9A227" opacity="0.85" />
    <text x="300" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">B</text>
    <text x="300" y="533" text-anchor="middle" font-size="10.5" fill="#FFFFFF">Z世代</text>
    <text x="560" y="425" font-size="12" fill="#1F5C45" font-weight="600">首发种子用户</text>
    <text x="250" y="492" font-size="12" fill="#6B6B6B">内容传播节点</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M752,398 H1208 A12,12 0 0 1 1220,410 V624 A12,12 0 0 1 1208,636 H752 A12,12 0 0 1 740,624 V410 A12,12 0 0 1 752,398 Z" />
    <text x="766" y="430" font-size="15.5" font-weight="700" fill="#1F5C45">人群策略：A 引爆 → B 放大 → C 收割</text>
    <text x="766" y="462" font-size="13" fill="#2B2B2B">① 先做 A（学习者）：专业口碑圈层，B 站/知乎中医区</text>
    <text x="766" y="484" font-size="13" fill="#2B2B2B">   内容冷启动，获客成本最低（CAC &lt; ¥30）</text>
    <text x="766" y="514" font-size="13" fill="#2B2B2B">② B 群体做流量放大：体质测试 H5/节气海报</text>
    <text x="766" y="536" font-size="13" fill="#2B2B2B">   社交裂变，摊薄整体 CAC</text>
    <text x="766" y="566" font-size="13" fill="#2B2B2B">③ C 群体是变现主力：问诊转化发生在 A/B 人群</text>
    <text x="766" y="588" font-size="13" fill="#2B2B2B">   与家人（父母/配偶）的代际推荐中</text>
    <text x="766" y="618" font-size="12.5" fill="#B3541E" font-weight="600">警惕：跳过 A 直接做 B/C 的人群，正是问止亏损的获客陷阱</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：魔镜洞察/网经社/招股书（B+）· 人群策略为小爱构建</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">06 / 18</text>
</svg>