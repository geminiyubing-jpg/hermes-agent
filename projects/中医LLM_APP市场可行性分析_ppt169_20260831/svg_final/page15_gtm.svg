<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">Go-to-Market：三阶段冷启动</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">18 个月路线：内容验证 → 付费验证 → 闭环验证，每阶段一票否决制</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#1F5C45" stroke-width="1.5" d="M72,112 H421 A12,12 0 0 1 433,124 V430 A12,12 0 0 1 421,442 H72 A12,12 0 0 1 60,430 V124 A12,12 0 0 1 72,112 Z" />
    <path fill="#1F5C45" d="M72,112 H421 A12,12 0 0 1 433,124 V148 A12,12 0 0 1 421,160 H72 A12,12 0 0 1 60,148 V124 A12,12 0 0 1 72,112 Z" />
    <text x="246" y="143" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">阶段一 · 内容验证（M1-6）</text>
    <text x="88" y="186" font-size="13.5" fill="#2B2B2B">动作：</text>
    <text x="88" y="210" font-size="13" fill="#6B6B6B">· 建成 50 种核心古籍 L1+L2</text>
    <text x="88" y="234" font-size="13" fill="#6B6B6B">· MVP 上线（问答+条文检索）</text>
    <text x="88" y="258" font-size="13" fill="#6B6B6B">· B站/知乎中医区内容投放</text>
    <text x="88" y="292" font-size="13.5" fill="#2B2B2B">目标：</text>
    <text x="88" y="316" font-size="13" fill="#1F5C45" font-weight="600">· 注册用户 10 万</text>
    <text x="88" y="340" font-size="13" fill="#1F5C45" font-weight="600">· 次月留存 &gt; 35%</text>
    <text x="88" y="364" font-size="13" fill="#1F5C45" font-weight="600">· 自然流量占比 &gt; 60%</text>
    <path fill="#B3541E" opacity="0.08" d="M96,384 H397 A8,8 0 0 1 405,392 V416 A8,8 0 0 1 397,424 H96 A8,8 0 0 1 88,416 V392 A8,8 0 0 1 96,384 Z" />
    <text x="246" y="409" text-anchor="middle" font-size="12.5" fill="#B3541E" font-weight="600">否决线：留存 &lt;20% → 转 B 端工具</text>

    <path fill="#FFFFFF" stroke="#C9A227" stroke-width="1.5" d="M465,112 H814 A12,12 0 0 1 826,124 V430 A12,12 0 0 1 814,442 H465 A12,12 0 0 1 453,430 V124 A12,12 0 0 1 465,112 Z" />
    <path fill="#A08318" d="M465,112 H814 A12,12 0 0 1 826,124 V148 A12,12 0 0 1 814,160 H465 A12,12 0 0 1 453,148 V124 A12,12 0 0 1 465,112 Z" />
    <text x="639" y="143" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">阶段二 · 付费验证（M7-12）</text>
    <text x="481" y="186" font-size="13.5" fill="#2B2B2B">动作：</text>
    <text x="481" y="210" font-size="13" fill="#6B6B6B">· 会员订阅上线（¥198/年）</text>
    <text x="481" y="234" font-size="13" fill="#6B6B6B">· 专业版（¥599）打学习者群体</text>
    <text x="481" y="258" font-size="13" fill="#6B6B6B">· 体质测试 H5 裂变拉新</text>
    <text x="481" y="292" font-size="13.5" fill="#2B2B2B">目标：</text>
    <text x="481" y="316" font-size="13" fill="#A08318" font-weight="600">· 注册 50 万 / 付费 2 万</text>
    <text x="481" y="340" font-size="13" fill="#A08318" font-weight="600">· 付费转化率 &gt; 4%</text>
    <text x="481" y="364" font-size="13" fill="#A08318" font-weight="600">· CAC &lt; ¥120 / LTV/CAC &gt; 3</text>
    <path fill="#B3541E" opacity="0.08" d="M489,384 H790 A8,8 0 0 1 798,392 V416 A8,8 0 0 1 790,424 H489 A8,8 0 0 1 481,416 V392 A8,8 0 0 1 489,384 Z" />
    <text x="639" y="409" text-anchor="middle" font-size="12.5" fill="#B3541E" font-weight="600">否决线：转化 &lt;1.5% → 收缩为</text>
    <text x="639" y="427" text-anchor="middle" font-size="12.5" fill="#B3541E" font-weight="600">专业工具+SaaS</text>

    <path fill="#FFFFFF" stroke="#B3541E" stroke-width="1.5" d="M858,112 H1207 A12,12 0 0 1 1219,124 V430 A12,12 0 0 1 1207,442 H858 A12,12 0 0 1 846,430 V124 A12,12 0 0 1 858,112 Z" />
    <path fill="#B3541E" d="M858,112 H1207 A12,12 0 0 1 1219,124 V148 A12,12 0 0 1 1207,160 H858 A12,12 0 0 1 846,148 V124 A12,12 0 0 1 858,112 Z" />
    <text x="1032" y="143" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">阶段三 · 闭环验证（M13-18）</text>
    <text x="874" y="186" font-size="13.5" fill="#2B2B2B">动作：</text>
    <text x="874" y="210" font-size="13" fill="#6B6B6B">· 挂靠互联网医院牌照落地</text>
    <text x="874" y="234" font-size="13" fill="#6B6B6B">· AI 预问诊 + 50 名合作医生</text>
    <text x="874" y="258" font-size="13" fill="#6B6B6B">· 处方流转合作药房打通</text>
    <text x="874" y="292" font-size="13.5" fill="#2B2B2B">目标：</text>
    <text x="874" y="316" font-size="13" fill="#B3541E" font-weight="600">· 月问诊 8,000 单</text>
    <text x="874" y="340" font-size="13" fill="#B3541E" font-weight="600">· 复诊率 &gt; 50%</text>
    <text x="874" y="364" font-size="13" fill="#B3541E" font-weight="600">· 问诊线毛利率 &gt; 40%</text>
    <path fill="#B3541E" opacity="0.08" d="M882,384 H1183 A8,8 0 0 1 1191,392 V416 A8,8 0 0 1 1183,424 H882 A8,8 0 0 1 874,416 V392 A8,8 0 0 1 882,384 Z" />
    <text x="1032" y="409" text-anchor="middle" font-size="12.5" fill="#B3541E" font-weight="600">否决线：问诊 &lt;3000单/月 →</text>
    <text x="1032" y="427" text-anchor="middle" font-size="12.5" fill="#B3541E" font-weight="600">维持内容业务寻求并购</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#1F5C45" d="M72,462 H1208 A12,12 0 0 1 1220,474 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V474 A12,12 0 0 1 72,462 Z" />
    <text x="88" y="498" font-size="16" font-weight="700" fill="#FFFFFF">融资节奏与里程碑挂钩</text>
    <text x="88" y="530" font-size="14" fill="#D8E8E0">· 种子轮 800 万（M0）：阶段一执行 —— 估值锚：知识库资产 + 种子用户</text>
    <text x="88" y="558" font-size="14" fill="#D8E8E0">· Pre-A 1,500 万（M7，需留存达标）：阶段二执行 —— 估值锚：付费数据</text>
    <text x="88" y="586" font-size="14" fill="#D8E8E0">· A 轮 3,000 万+（M13，需 LTV/CAC 达标）：闭环扩张 —— 估值锚：单位经济</text>
    <text x="88" y="616" font-size="13" fill="#C9A227" font-weight="600">每轮之间的否决线就是投资人的下行保护——不达标不进下一轮，团队规模同步冻结</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">策略：小爱构建 · 阶段目标参照问止/固生堂/大家中医公开数据校准</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">15 / 18</text>
</svg>