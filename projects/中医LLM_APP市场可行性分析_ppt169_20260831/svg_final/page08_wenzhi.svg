    <text x="88" y="544" font-size="16" font-weight="700" fill="#B3541E">问止给我们的三条教训</text>
    <text x="88" y="574" font-size="13.5" fill="#2B2B2B">① 获客成本失控是亏损主因：医疗信任类产品无法纯投流获客，内容获客（古籍科普）恰好是解药</text>
    <text x="88" y="600" font-size="13.5" fill="#2B2B2B">② AI 是效率工具不是产品本身：中医大脑再强，用户付费的是「医生的判断+药到病除」</text>
    <text x="88" y="626" font-size="13.5" fill="#2B2B2B">③ 好消息：它验证了线上中医诊疗的付费意愿与复诊黏性——路是通的，坑是可以绕的</text>
  </g>

