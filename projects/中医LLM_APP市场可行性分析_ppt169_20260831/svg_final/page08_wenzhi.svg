    <text x="726" y="280" font-size="14" fill="#FFFFFF" font-weight="600">关键运营数据（招股书）</text>
    <text x="726" y="308" font-size="13" fill="#D8E8E0">· 线上收入占比 ~90%（重线上模式）</text>
