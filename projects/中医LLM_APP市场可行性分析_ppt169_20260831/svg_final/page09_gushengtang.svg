<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">对标案例 B：固生堂 — 重服务的盈利样本</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">线下连锁 + OMO 复诊闭环的 2025 年报拆解（02273.HK）</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M70,112 H322 A10,10 0 0 1 332,122 V212 A10,10 0 0 1 322,222 H70 A10,10 0 0 1 60,212 V122 A10,10 0 0 1 70,112 Z" />
    <text x="196" y="152" text-anchor="middle" font-size="24" font-weight="700" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">32.5亿</text>
    <text x="196" y="180" text-anchor="middle" font-size="12.5" fill="#6B6B6B">2025营收（+7.5%）</text>
    <path fill="#FFFFFF" stroke="#E5DED2" d="M366,112 H618 A10,10 0 0 1 628,122 V212 A10,10 0 0 1 618,222 H366 A10,10 0 0 1 356,212 V122 A10,10 0 0 1 366,112 Z" />
    <text x="492" y="152" text-anchor="middle" font-size="24" font-weight="700" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">3.5亿</text>
    <text x="492" y="180" text-anchor="middle" font-size="12.5" fill="#6B6B6B">归母净利（+15%）</text>
    <path fill="#FFFFFF" stroke="#E5DED2" d="M662,112 H914 A10,10 0 0 1 924,122 V212 A10,10 0 0 1 914,222 H662 A10,10 0 0 1 652,212 V122 A10,10 0 0 1 662,112 Z" />
    <text x="788" y="152" text-anchor="middle" font-size="24" font-weight="700" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">31.2%</text>
    <text x="788" y="180" text-anchor="middle" font-size="12.5" fill="#6B6B6B">毛利率（+1.1pct）</text>
    <path fill="#FFFFFF" stroke="#E5DED2" d="M958,112 H1210 A10,10 0 0 1 1220,122 V212 A10,10 0 0 1 1210,222 H958 A10,10 0 0 1 948,212 V122 A10,10 0 0 1 958,112 Z" />
    <text x="1084" y="152" text-anchor="middle" font-size="24" font-weight="700" fill="#1F5C45" font-family="'Helvetica Neue', sans-serif">16.1%</text>
    <text x="1084" y="180" text-anchor="middle" font-size="12.5" fill="#6B6B6B">ROE（+3.2pct）</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,244 H620 A12,12 0 0 1 632,256 V488 A12,12 0 0 1 620,500 H72 A12,12 0 0 1 60,488 V256 A12,12 0 0 1 72,244 Z" />
    <text x="88" y="280" font-size="16" font-weight="700" fill="#1F5C45">增长引擎拆解</text>
    <text x="88" y="312" font-size="13.5" fill="#2B2B2B">· 门店 79 → 101 家（+22），覆盖成都/汕头/天津新城市</text>
    <text x="88" y="338" font-size="13.5" fill="#2B2B2B">· 医生 43,220 人（年增 2,978），股权绑定名医合伙制</text>
    <text x="88" y="364" font-size="13.5" fill="#2B2B2B">· 新客 97 万（+9%）/ 累计客户 539 万 / 会员 47.7 万</text>
    <text x="88" y="390" font-size="13.5" fill="#2B2B2B">· 新加坡营收 +228%（中医药出海样本）</text>
    <text x="88" y="420" font-size="13.5" fill="#2B2B2B">· 13 个「国医AI分身」（与清华/北中医联合研发，</text>
    <text x="88" y="444" font-size="13.5" fill="#2B2B2B">  专家模拟一致性 86%）——AI 用来放大名医供给</text>
    <text x="88" y="476" font-size="12.5" fill="#6B6B6B">模式核心：医疗服务占收入 99%+，医生合伙人利益绑定</text>

    <path fill="#1F5C45" d="M660,244 H1208 A12,12 0 0 1 1220,256 V488 A12,12 0 0 1 1208,500 H660 A12,12 0 0 1 648,488 V256 A12,12 0 0 1 660,244 Z" />
    <text x="676" y="280" font-size="16" font-weight="700" fill="#FFFFFF">对我们产品的启示（对照问止）</text>
    <text x="676" y="314" font-size="13.5" fill="#D8E8E0">· 盈利的是「服务闭环」：预约→面诊→开方→煎药配送→</text>
    <text x="676" y="338" font-size="13.5" fill="#D8E8E0">  复诊，每个环节都有收入和黏性</text>
    <text x="676" y="370" font-size="13.5" fill="#D8E8E0">· AI 的正确位置是「名医杠杆」而非「替代医生」——</text>
    <text x="676" y="394" font-size="13.5" fill="#D8E8E0">  国医分身接初诊，名医复核疑难，产能放大 10 倍</text>
    <text x="676" y="426" font-size="13.5" fill="#D8E8E0">· 我们的轻资产版：古籍内容获客（替代门店获客）</text>
    <text x="676" y="450" font-size="13.5" fill="#D8E8E0">  + 合作医馆履约（替代自建门店）+ 复诊会员（同款）</text>
    <text x="676" y="482" font-size="13" fill="#C9A227" font-weight="600">→ 盈利公式可迁移，重资产部分全部外包</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,524 H1208 A12,12 0 0 1 1220,536 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V536 A12,12 0 0 1 72,524 Z" />
  <text x="90" y="558" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">两条路径对照总结</text>
  <text x="90" y="586" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">问止（纯线上+AI 前置）：3 年亏 3.93 亿，验证付费意愿但获客成本失控 —— 内容获客可解此题；</text>
  <text x="90" y="614" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">固生堂（线下+服务闭环）：营收利润双新高，验证服务闭环盈利模型 —— 轻资产版本可借力合作医馆复制。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：固生堂2025年度业绩公告/证券时报（A-）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">09 / 18</text>
</svg>