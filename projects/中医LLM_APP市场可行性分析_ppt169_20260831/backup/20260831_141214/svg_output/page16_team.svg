<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">团队配置与里程碑</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">15 人精益团队起航 + 18 个月关键里程碑时间线</text>

  <!-- 团队 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="572" height="270" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="146" font-size="16" font-weight="700" fill="#1F5C45">首年团队配置（15人，~600万/年）</text>
    <!-- 人形条 -->
    <text x="88" y="184" font-size="13.5" fill="#2B2B2B" font-weight="600">中医内容团队（6人）· 40%</text>
    <rect x="88" y="196" width="516" height="14" rx="7" fill="#1F5C45" opacity="0.85"/>
    <text x="88" y="232" font-size="12.5" fill="#6B6B6B">中医文献编辑4 + 内容运营2 —— 壁垒的施工队</text>
    <text x="88" y="266" font-size="13.5" fill="#2B2B2B" font-weight="600">技术团队（5人）· 33%</text>
    <rect x="88" y="278" width="430" height="14" rx="7" fill="#C9A227" opacity="0.85"/>
    <text x="88" y="314" font-size="12.5" fill="#6B6B6B">全栈2 + LLM工程2 + 数据工程1</text>
    <text x="88" y="348" font-size="13.5" fill="#2B2B2B" font-weight="600">医疗与增长（4人）· 27%</text>
    <rect x="88" y="360" width="345" height="14" rx="7" fill="#B3541E" opacity="0.85"/>
    <text x="88" y="366" font-size="0" fill="#6B6B6B">.</text>
    <text x="88" y="368" font-size="0" fill="#6B6B6B">.</text>
    <text x="88" y="364" font-size="0" fill="#6B6B6B">.</text>
    <text x="88" y="396" font-size="12.5" fill="#6B6B6B">医学顾问1(兼职) + 医疗合作1 + 增长2 · CEO 兼产品</text>
  </g>

  <!-- 里程碑 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="648" y="112" width="572" height="270" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="676" y="146" font-size="16" font-weight="700" fill="#1F5C45">18 个月关键里程碑</text>
    <line x1="700" y1="180" x2="700" y2="360" stroke="#1F5C45" stroke-width="2"/>
    <g>
      <circle cx="700" cy="190" r="6" fill="#1F5C45"/>
      <text x="720" y="195" font-size="13" fill="#2B2B2B" font-weight="600">M2：知识库 V1（20 种古籍 L1 完成）</text>
      <circle cx="700" cy="228" r="6" fill="#1F5C45"/>
      <text x="720" y="233" font-size="13" fill="#2B2B2B" font-weight="600">M4：MVP 内测（500 种子用户）</text>
      <circle cx="700" cy="266" r="6" fill="#C9A227"/>
      <text x="720" y="271" font-size="13" fill="#2B2B2B" font-weight="600">M6：公测 + 阶段一否决线评估</text>
      <circle cx="700" cy="304" r="6" fill="#C9A227"/>
      <text x="720" y="309" font-size="13" fill="#2B2B2B" font-weight="600">M10：订阅上线 + 付费数据验证</text>
      <circle cx="700" cy="342" r="6" fill="#B3541E"/>
      <text x="720" y="347" font-size="13" fill="#2B2B2B" font-weight="600">M14：互联网医院挂靠签约</text>
      <circle cx="700" cy="368" r="6" fill="#B3541E"/>
      <text x="720" y="373" font-size="13" fill="#2B2B2B" font-weight="600">M18：问诊闭环上线 + A 轮决策点</text>
    </g>
  </g>

  <!-- 关键依赖 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="402" width="1160" height="234" rx="12" fill="#2B2B2B"/>
    <text x="90" y="438" font-size="16" font-weight="700" fill="#C9A227">三条不可妥协的军规（写给未来的自己）</text>
    <text x="90" y="474" font-size="14.5" fill="#FFFFFF" font-weight="600">① 内容质量 &gt; 增长速度</text>
    <text x="110" y="500" font-size="13.5" fill="#D0D0D0">宁可 10 万用户用得深，不要 100 万用户用得浅——留存数据是内容产品的唯一真相（阶段一否决线的由来）</text>
    <text x="90" y="534" font-size="14.5" fill="#FFFFFF" font-weight="600">② 现金跑道永不低于 12 个月</text>
    <text x="110" y="560" font-size="13.5" fill="#D0D0D0">中医信任生意是慢生意，问止的教训是烧钱换不来信任；每轮融资提前 6 个月启动</text>
    <text x="90" y="594" font-size="14.5" fill="#FFFFFF" font-weight="600">③ AI 永远不碰处方权</text>
    <text x="110" y="620" font-size="13.5" fill="#D0D0D0">监管红线即产品边界；「AI 讲不通的交给医生」不是妥协，恰是商业模式里医生价值的来源</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">配置与里程碑：小爱构建 · 薪酬按一线城市中位估算</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">16 / 18</text>
</svg>
