<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">政策环境：东风劲吹，红线分明</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">2022-2026 关键政策时间轴 + 利好/约束分类</text>

  <!-- 时间轴 -->
  <line x1="80" y1="170" x2="1220" y2="170" stroke="#1F5C45" stroke-width="3"/>
  <g font-family="'PingFang SC', sans-serif">
    <!-- 2022 -->
    <circle cx="140" cy="170" r="8" fill="#B3541E"/>
    <text x="140" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#B3541E">2022.3</text>
    <rect x="70" y="190" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="160" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B3541E">互联网诊疗监管细则</text>
    <text x="160" y="240" text-anchor="middle" font-size="11.5" fill="#6B6B6B">严禁 AI 自动生成处方</text>
    <text x="160" y="260" text-anchor="middle" font-size="11.5" fill="#6B6B6B">线上线下同质监管</text>
    <text x="160" y="280" text-anchor="middle" font-size="11.5" fill="#6B6B6B">须依托实体医疗机构</text>
    <text x="160" y="298" text-anchor="middle" font-size="10.5" fill="#9B9B9B">🔴 约束（A级）</text>

    <!-- 2024 -->
    <circle cx="360" cy="170" r="8" fill="#1F5C45"/>
    <text x="360" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1F5C45">2024.8</text>
    <rect x="270" y="190" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="360" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F5C45">数字中医药若干意见</text>
    <text x="360" y="240" text-anchor="middle" font-size="11.5" fill="#6B6B6B">国中医药综发〔2024〕6号</text>
    <text x="360" y="260" text-anchor="middle" font-size="11.5" fill="#6B6B6B">中医药+数据局联合发文</text>
    <text x="360" y="280" text-anchor="middle" font-size="11.5" fill="#6B6B6B">鼓励古籍数字化开发</text>
    <text x="360" y="298" text-anchor="middle" font-size="10.5" fill="#1F5C45">🟢 利好（A级）</text>

    <!-- 2025.3 -->
    <circle cx="580" cy="170" r="8" fill="#1F5C45"/>
    <text x="580" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1F5C45">2025.3</text>
    <rect x="490" y="190" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="580" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F5C45">中药质量提升意见</text>
    <text x="580" y="240" text-anchor="middle" font-size="11.5" fill="#6B6B6B">国办 8 方面 21 项</text>
    <text x="580" y="260" text-anchor="middle" font-size="11.5" fill="#6B6B6B">医药工业数智化转型方案</text>
    <text x="580" y="280" text-anchor="middle" font-size="11.5" fill="#6B6B6B">（2025-2030，七部门）</text>
    <text x="580" y="298" text-anchor="middle" font-size="10.5" fill="#1F5C45">🟢 利好（A级）</text>

    <!-- 2025.7 -->
    <circle cx="800" cy="170" r="8" fill="#C9A227"/>
    <text x="800" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#A08318">2025.7</text>
    <rect x="710" y="190" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="800" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#A08318">健康消费专项行动</text>
    <text x="800" y="240" text-anchor="middle" font-size="11.5" fill="#6B6B6B">12 部门联合</text>
    <text x="800" y="260" text-anchor="middle" font-size="11.5" fill="#6B6B6B">培育健康消费新质生产力</text>
    <text x="800" y="280" text-anchor="middle" font-size="11.5" fill="#6B6B6B">药食同源目录扩至106种</text>
    <text x="800" y="298" text-anchor="middle" font-size="10.5" fill="#A08318">🟡 间接利好（A-）</text>

    <!-- 2026.1 -->
    <circle cx="1020" cy="170" r="8" fill="#1F5C45"/>
    <text x="1020" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1F5C45">2026.1</text>
    <rect x="930" y="190" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="1020" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F5C45">中医医保支付改革</text>
    <text x="1020" y="240" text-anchor="middle" font-size="11.5" fill="#6B6B6B">18 地区按病种打包付费试点</text>
    <text x="1020" y="260" text-anchor="middle" font-size="11.5" fill="#6B6B6B">河南：互联网+中医药入医保</text>
    <text x="1020" y="280" text-anchor="middle" font-size="11.5" fill="#6B6B6B">“十五五”中医药战略定位</text>
    <text x="1020" y="298" text-anchor="middle" font-size="10.5" fill="#1F5C45">🟢 利好（A级）</text>

    <!-- 2026.8 -->
    <circle cx="1180" cy="170" r="8" fill="#B3541E"/>
    <text x="1180" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#B3541E">持续</text>
    <rect x="1100" y="190" width="120" height="120" rx="8" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="1160" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B3541E">地方加码</text>
    <text x="1160" y="240" text-anchor="middle" font-size="11.5" fill="#6B6B6B">北京/湖南重申</text>
    <text x="1160" y="260" text-anchor="middle" font-size="11.5" fill="#6B6B6B">AI开方禁令</text>
    <text x="1160" y="280" text-anchor="middle" font-size="11.5" fill="#6B6B6B">监管常态趋严</text>
    <text x="1160" y="298" text-anchor="middle" font-size="10.5" fill="#B3541E">🔴 约束（A级）</text>
  </g>

  <!-- 红绿灯总结 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="340" width="572" height="170" rx="12" fill="#FFFFFF" stroke="#1F5C45" stroke-width="1.5"/>
    <text x="88" y="374" font-size="16" font-weight="700" fill="#1F5C45">🟢 政策东风（可以做）</text>
    <text x="88" y="404" font-size="13" fill="#2B2B2B">· 数字中医药意见明文鼓励「中医药古籍文献数字化开发」</text>
    <text x="88" y="428" font-size="13" fill="#2B2B2B">· 医保为互联网中医开支付通道（河南先行，18 地试点）</text>
    <text x="88" y="452" font-size="13" fill="#2B2B2B">· “十五五”战略定位 + 数智化转型方案（2030 全覆盖）</text>
    <text x="88" y="480" font-size="12.5" fill="#6B6B6B">→ 古籍知识库+AI问答属于「中医药文化数字化」，政策友好度最高</text>

    <rect x="648" y="340" width="572" height="170" rx="12" fill="#FFFFFF" stroke="#B3541E" stroke-width="1.5"/>
    <text x="676" y="374" font-size="16" font-weight="700" fill="#B3541E">🔴 监管红线（不能碰）</text>
    <text x="676" y="404" font-size="13" fill="#2B2B2B">· AI 不得自动生成处方（全国性细则+地方重申，无一例外）</text>
    <text x="676" y="428" font-size="13" fill="#2B2B2B">· 互联网诊疗必须依托实体医疗机构，医师本人接诊开方</text>
    <text x="676" y="452" font-size="13" fill="#2B2B2B">· 涉诊断功能的 AI 软件或需医疗器械备案（三类）</text>
    <text x="676" y="480" font-size="12.5" fill="#6B6B6B">→ 产品定位必须是「教育+辅助」，诊断决策永远留给执业医师</text>
  </g>

  <!-- 本页要点 -->
  <rect x="60" y="530" width="1159" height="106" rx="12" fill="#2B2B2B"/>
  <text x="90" y="564" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页要点</text>
  <text x="90" y="592" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">政策组合的净效应：给「内容与教育」开了最大的门，给「AI 替代医生」上了最重的锁——本产品的三支柱设计恰好骑在门内、锁外。</text>
  <text x="90" y="620" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">若未来监管将「AI 辨证建议」也纳入处方级管理，产品需降级为纯教育工具——这是 P15 风险矩阵中概率×影响双高的头号变量。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">政策原文均 A 级（国中医药局/国办/医保局官网）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">05 / 18</text>
</svg>
