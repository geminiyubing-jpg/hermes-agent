<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">风险矩阵：概率 × 影响的作战地图</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">六大风险按「发生概率 × 致命程度」排布，右上角优先布防</text>

  <!-- 风险矩阵 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="80" y="120" width="620" height="400" rx="8" fill="#FFFFFF" stroke="#E5DED2"/>
    <!-- 背景色带 -->
    <rect x="120" y="400" width="280" height="90" fill="#D8E8E0" opacity="0.5"/>
    <rect x="400" y="150" width="280" height="160" fill="#F5D9CB" opacity="0.5"/>
    <rect x="120" y="150" width="280" height="160" fill="#F5EBCB" opacity="0.5"/>
    <rect x="400" y="400" width="280" height="90" fill="#F5EBCB" opacity="0.5"/>
    <line x1="120" y1="490" x2="680" y2="490" stroke="#9B9B9B" stroke-width="2"/>
    <line x1="120" y1="140" x2="120" y2="490" stroke="#9B9B9B" stroke-width="2"/>
    <text x="400" y="516" text-anchor="middle" font-size="13" fill="#6B6B6B">发生概率（低 → 高）</text>
    <text x="96" y="315" text-anchor="middle" font-size="13" fill="#6B6B6B" transform="rotate(-90 96 315)">影响（低→高）</text>

    <!-- R1 巨头入场 高概率高影响 -->
    <g>
      <circle cx="580" cy="200" r="26" fill="#B3541E"/>
      <text x="580" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">R1</text>
      <text x="580" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#B3541E">巨头降维打击</text>
    </g>
    <!-- R2 合规收紧 高概率中影响 -->
    <g>
      <circle cx="620" cy="380" r="26" fill="#C9A227"/>
      <text x="620" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">R2</text>
      <text x="620" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#A08318">监管扩大AI限制</text>
    </g>
    <!-- R3 获客成本失控 中概率高影响 -->
    <g>
      <circle cx="360" cy="220" r="26" fill="#B3541E"/>
      <text x="360" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">R3</text>
      <text x="360" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#B3541E">获客成本失控</text>
    </g>
    <!-- R4 版权纠纷 中概率中影响 -->
    <g>
      <circle cx="400" cy="420" r="24" fill="#C9A227"/>
      <text x="400" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">R4</text>
      <text x="400" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#A08318">版权/数据纠纷</text>
    </g>
    <!-- R5 医生资源难获 低概率高影响 -->
    <g>
      <circle cx="200" cy="240" r="24" fill="#4A7BA6"/>
      <text x="200" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">R5</text>
      <text x="200" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#33587A">名医不入驻</text>
    </g>
    <!-- R6 技术同质化 低概率低影响 -->
    <g>
      <circle cx="220" cy="440" r="22" fill="#9B9B9B"/>
      <text x="220" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">R6</text>
      <text x="220" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#6B6B6B">技术迭代失效</text>
    </g>
  </g>

  <!-- 右侧对策 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="730" y="120" width="490" height="400" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="756" y="152" font-size="15.5" font-weight="700" fill="#1F5C45">对策略池</text>
    <text x="756" y="184" font-size="13" fill="#B3541E" font-weight="600">R1 巨头（概率高）：</text>
    <text x="756" y="206" font-size="12.5" fill="#6B6B6B">   深耕垂直社群+速度壁垒；被并购也是退出选项</text>
    <text x="756" y="236" font-size="13" fill="#A08318" font-weight="600">R2 监管（概率高）：</text>
    <text x="756" y="258" font-size="12.5" fill="#6B6B6B">   产品双形态预案（教育版/诊疗版一键切换）</text>
    <text x="756" y="288" font-size="13" fill="#B3541E" font-weight="600">R3 获客（影响致命）：</text>
    <text x="756" y="310" font-size="12.5" fill="#6B6B6B">   内容获客为主+CAC 月度熔断线（&gt;250 元停投放）</text>
    <text x="756" y="340" font-size="13" fill="#A08318" font-weight="600">R4 版权（可控）：</text>
    <text x="756" y="362" font-size="12.5" fill="#6B6B6B">   公版自整理+授权双轨；法务前置审查</text>
    <text x="756" y="392" font-size="13" fill="#33587A" font-weight="600">R5 医生（可对冲）：</text>
    <text x="756" y="414" font-size="12.5" fill="#6B6B6B">   高分成(70%)+AI 减负工具先行建立信任</text>
    <text x="756" y="444" font-size="13" fill="#6B6B6B" font-weight="600">R6 技术（低）：</text>
    <text x="756" y="466" font-size="12.5" fill="#6B6B6B">   开源生态跟进即可，不押注单点技术</text>
    <rect x="756" y="480" width="438" height="28" rx="6" fill="#1F5C45" opacity="0.08"/>
    <text x="975" y="499" text-anchor="middle" font-size="12.5" fill="#1F5C45" font-weight="600">最大风险组合：R1+R3 同时发生 = 转型 B 端内容供应商</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="540" width="1159" height="96" rx="12" fill="#2B2B2B"/>
  <text x="90" y="574" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页要点</text>
  <text x="90" y="602" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">六大风险无一为「否决项」——都有对冲手段；真正要敬畏的是 R1+R3 组合：巨头入场叠加获客失控将同时摧毁壁垒与现金流，对策是把 Y1 现金跑道维持在 18 个月以上。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">风险评级：小爱综合判断（C级，供决策参考）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">14 / 18</text>
</svg>
