<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C45"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">古籍语料壁垒：建库路线与版权要点</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">存世 1.3 万种中医古籍——壁垒不在「有没有」，在「结构化深度」</text>

  <!-- 语料现状 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="572" height="256" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="146" font-size="16" font-weight="700" fill="#1F5C45">语料家底盘点</text>
    <text x="88" y="178" font-size="13.5" fill="#2B2B2B">· 存世中医古籍约 1.3 万种（《中国中医古籍总目》）</text>
    <text x="88" y="204" font-size="13.5" fill="#2B2B2B">· 中华经典古籍库（中华书局）：10 期 6,825 种/22.5 亿字，</text>
    <text x="88" y="228" font-size="13.5" fill="#2B2B2B">  含医家类，付费商用授权（年费百万级）</text>
    <text x="88" y="254" font-size="13.5" fill="#2B2B2B">· 核心经典仅 300-500 种（内经/伤寒/金匮/温病四大家/</text>
    <text x="88" y="278" font-size="13.5" fill="#2B2B2B">  本草纲目/历代名医全书），覆盖 90% 学习需求</text>
    <text x="88" y="308" font-size="13.5" fill="#2B2B2B">· 公版原文可自由使用（作者逝世超 50 年）</text>
    <text x="88" y="338" font-size="12.5" fill="#B3541E" font-weight="600">关键：现代整理本（点校/注释）有版权，不能直接爬用</text>

    <rect x="648" y="112" width="572" height="256" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="676" y="146" font-size="16" font-weight="700" fill="#1F5C45">三层结构化建库路线</text>
    <rect x="676" y="164" width="516" height="56" rx="8" fill="#1F5C45" opacity="0.10"/>
    <text x="690" y="188" font-size="13.5" font-weight="600" fill="#1F5C45">L1 原文层（3个月）</text>
    <text x="690" y="208" font-size="12.5" fill="#6B6B6B">公版底本 OCR+异体字规范化+多版本对勘标记</text>
    <rect x="676" y="230" width="516" height="56" rx="8" fill="#1F5C45" opacity="0.18"/>
    <text x="690" y="254" font-size="13.5" font-weight="600" fill="#1F5C45">L2 知识层（6个月，核心壁垒）</text>
    <text x="690" y="274" font-size="12.5" fill="#6B6B6B">术语对齐表/方证索引/药物配伍图谱/历代注家关系网</text>
    <rect x="676" y="296" width="516" height="56" rx="8" fill="#1F5C45" opacity="0.28"/>
    <text x="690" y="320" font-size="13.5" font-weight="600" fill="#FFFFFF">L3 解读层（持续迭代）</text>
    <text x="690" y="340" font-size="12.5" fill="#F0F5F2">现代汉语释义/临床注释/AI 生成+中医专家双审校</text>
  </g>

  <!-- 成本与团队 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="388" width="373" height="180" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="422" font-size="15" font-weight="700" fill="#A08318">建库成本估算</text>
    <text x="88" y="452" font-size="13" fill="#2B2B2B">· 中医文献编辑 3-5 人 × 12 个月</text>
    <text x="88" y="476" font-size="13" fill="#2B2B2B">· LLM 预标注 + 人工校对流水线</text>
    <text x="88" y="500" font-size="13" fill="#2B2B2B">· 首年 L1+L2 投入约 150-250 万</text>
    <text x="88" y="528" font-size="12.5" fill="#6B6B6B">对比：海河·岐伯四库医家类图谱证明技术可行</text>
    <text x="88" y="550" font-size="12.5" fill="#6B6B6B">对比：整理本授权年费百万级→自建更划算</text>

    <rect x="453" y="388" width="373" height="180" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="481" y="422" font-size="15" font-weight="700" fill="#A08318">版权合规三条路</text>
    <text x="481" y="452" font-size="13" fill="#2B2B2B">① 公版原文自整理（最干净，首选）</text>
    <text x="481" y="476" font-size="13" fill="#2B2B2B">② 与中华书局古联等谈商用授权</text>
    <text x="481" y="500" font-size="13" fill="#2B2B2B">③ 高校古籍所合作共建（出成果+出数据）</text>
    <text x="481" y="528" font-size="12.5" fill="#6B6B6B">红线：不爬取收费数据库、不用整理本文本训练</text>

    <rect x="846" y="388" width="373" height="180" rx="12" fill="#1F5C45"/>
    <text x="874" y="422" font-size="15" font-weight="700" fill="#FFFFFF">壁垒的可防御性</text>
    <text x="874" y="452" font-size="13" fill="#D8E8E0">· LLM 能读原文，但「注家分歧标注」</text>
    <text x="874" y="476" font-size="13" fill="#D8E8E0">  「方证对应网络」是人工判断沉淀</text>
    <text x="874" y="504" font-size="13" fill="#D8E8E0">· 数据飞轮：用户提问→暴露知识盲区→</text>
    <text x="874" y="528" font-size="13" fill="#D8E8E0">  定向补标注——越用越厚</text>
    <text x="874" y="552" font-size="12.5" fill="#C9A227" font-weight="600">18 个月后壁垒 = 300种×三层×持续迭代</text>
  </g>

  <!-- 本页要点 -->
  <rect x="60" y="588" width="1159" height="48" rx="10" fill="#2B2B2B"/>
  <text x="90" y="618" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">要点：古籍壁垒的本质是「中医专家判断的结构化沉淀」——钱能加速，但竞争对手同样需要中医编辑团队+时间，这就是 12-24 个月窗口的来源。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：《中国中医古籍总目》/中华书局古籍库公开资料（A/B+）· 成本为估算C级</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C45">10 / 18</text>
</svg>
