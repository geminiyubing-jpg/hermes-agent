<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">出题人是谁：命题的「宪法」与「指挥棒」</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">读懂官方文件，才能从「猜题」升级到「理解命题」</text>

  <!-- 评价体系 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="572" height="250" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="88" y="146" font-size="15.5" font-weight="700" fill="#1A3A5C">中国高考评价体系（命题宪法）</text>
    <text x="88" y="178" font-size="13.5" fill="#1F2A33">「一核四层四翼」：</text>
    <rect x="88" y="192" width="150" height="40" rx="8" fill="#1A3A5C"/>
    <text x="163" y="217" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">一核：为什么考</text>
    <rect x="250" y="192" width="150" height="40" rx="8" fill="#277653"/>
    <text x="325" y="217" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">四层：考什么</text>
    <rect x="412" y="192" width="190" height="40" rx="8" fill="#C0392B"/>
    <text x="507" y="217" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">四翼：怎么考（怎么出题）</text>
    <text x="88" y="260" font-size="13" fill="#5A6874">四层 = 核心价值 / 学科素养 / 关键能力 / 必备知识</text>
    <text x="88" y="288" font-size="13" fill="#5A6874">四翼 = <tspan font-weight="600" fill="#C0392B">基础性 · 综合性 · 应用性 · 创新性</tspan></text>
    <text x="88" y="322" font-size="13" fill="#1F2A33">压轴题 = 「四翼」的集大成：一道题同时考四性</text>
    <text x="88" y="348" font-size="12.5" fill="#8A96A3">（基础模型+综合多过程+真实情境+创新设问）</text>

    <rect x="648" y="112" width="572" height="250" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="676" y="146" font-size="15.5" font-weight="700" fill="#1A3A5C">教育部考试院 2022 全国卷评析（A级）</text>
    <rect x="676" y="162" width="516" height="76" rx="8" fill="#F0F4F9"/>
    <text x="694" y="190" font-size="13" fill="#1F2A33" font-weight="600">定调一：深化基础性，减少「机械刷题」</text>
    <text x="694" y="216" font-size="12.5" fill="#5A6874">「避免将学生导向细枝末节知识的过度辨析、典型题套路」</text>
    <rect x="676" y="248" width="516" height="50" rx="8" fill="#F0F4F9"/>
    <text x="694" y="270" font-size="13" fill="#1F2A33" font-weight="600">定调二：真实情境，理论联系实际</text>
    <text x="694" y="290" font-size="12.5" fill="#5A6874">冬奥会/天宫/检流计/磁控管——情境年年更新</text>
    <rect x="676" y="308" width="516" height="40" rx="8" fill="#FDF0EE"/>
    <text x="694" y="334" font-size="13" fill="#C0392B" font-weight="600">定调三：考通用方法，不考奇技淫巧</text>
  </g>

  <!-- 命题流程 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="400" font-size="15" font-weight="600" fill="#1A3A5C">一道压轴题的诞生（命题流程）</text>
    <rect x="60" y="416" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="165" y="448" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A3A5C">① 立意</text>
    <text x="165" y="472" text-anchor="middle" font-size="12" fill="#5A6874">定考查目标</text>
    <text x="165" y="492" text-anchor="middle" font-size="12" fill="#5A6874">（素养+能力点）</text>
    <text x="285" y="465" font-size="18" fill="#8A96A3">→</text>
    <rect x="310" y="416" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="415" y="448" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A3A5C">② 情境</text>
    <text x="415" y="472" text-anchor="middle" font-size="12" fill="#5A6874">选真实/科技背景</text>
    <text x="415" y="492" text-anchor="middle" font-size="12" fill="#5A6874">（仪器/航天/体育）</text>
    <text x="535" y="465" font-size="18" fill="#8A96A3">→</text>
    <rect x="560" y="416" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="665" y="448" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A3A5C">③ 设卡</text>
    <text x="665" y="472" text-anchor="middle" font-size="12" fill="#5A6874">埋临界/多过程/</text>
    <text x="665" y="492" text-anchor="middle" font-size="12" fill="#5A6874">几何陷阱</text>
    <text x="785" y="465" font-size="18" fill="#8A96A3">→</text>
    <rect x="810" y="416" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="915" y="448" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1A3A5C">④ 磨题</text>
    <text x="915" y="472" text-anchor="middle" font-size="12" fill="#5A6874">控制难度梯度</text>
    <text x="915" y="492" text-anchor="middle" font-size="12" fill="#5A6874">（三问递进）</text>
    <text x="1035" y="465" font-size="18" fill="#8A96A3">→</text>
    <rect x="1060" y="416" width="160" height="90" rx="10" fill="#1A3A5C"/>
    <text x="1140" y="448" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">⑤ 入卷</text>
    <text x="1140" y="472" text-anchor="middle" font-size="12" fill="#C7D4E2">匿名审题</text>
    <text x="1140" y="492" text-anchor="middle" font-size="12" fill="#C7D4E2">试做校准</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="528" width="1160" height="108" rx="12" fill="#1A3A5C"/>
  <text x="90" y="564" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#E8EDF3">对考生的意义：</text>
  <text x="90" y="594" font-family="'PingFang SC', sans-serif" font-size="14" fill="#C7D4E2">官方明牌「不考套路」——所以刷题的正确姿势不是背题型，而是把每个模型吃透到能应对「情境换皮」；</text>
  <text x="90" y="622" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8EDF3" font-weight="600">压轴题的「新」永远新在情境和组合，不新在物理定律——定律就那几十条，情境无限。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">评价体系：教育部（A）· 2022 评析：考试院经中国教育在线转载（A）· 命题流程为通行做法概述（B）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">03 / 13</text>
</svg>
