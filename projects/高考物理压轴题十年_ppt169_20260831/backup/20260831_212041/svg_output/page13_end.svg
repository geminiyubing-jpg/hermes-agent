<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C"/>
  <!-- 粒子轨迹装饰 -->
  <g fill="none" stroke="#1A3A5C" stroke-width="2">
    <path opacity="0.18" d="M980,720 A 150,150 0 0 1 1230,600"/>
    <path opacity="0.25" d="M1040,720 A 100,100 0 0 1 1200,640"/>
  </g>
  <circle opacity="0.4" cx="980" cy="720" r="6" fill="#C0392B"/>

  <text x="60" y="130" font-family="'PingFang SC', sans-serif" font-size="14" fill="#C0392B" letter-spacing="4">EPILOGUE · 写给 2026 届考生</text>
  <text x="60" y="210" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="38" font-weight="800" fill="#1A3A5C">压轴题的本质：用新情境考旧物理</text>

  <rect x="60" y="248" width="4" height="120" fill="#C0392B"/>
  <text x="90" y="286" font-family="'PingFang SC', serif" font-size="17" fill="#1F2A33">十年 20+ 道题，物理定律没变过一条：F=ma、qvB=mv²/r、</text>
  <text x="90" y="318" font-family="'PingFang SC', serif" font-size="17" fill="#1F2A33">能量守恒、开普勒第二定律……变的是包装它们的情境与组合方式。</text>
  <text x="90" y="350" font-family="'PingFang SC', serif" font-size="17" fill="#1F2A33">所以压轴题从来不是「新知识」的考试，而是「认出旧朋友」的考试。</text>

  <!-- 三句话 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="410" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="88" y="448" font-size="26" font-weight="700" fill="#1A3A5C" font-family="'Georgia', serif">❶</text>
    <text x="88" y="486" font-size="15" font-weight="600" fill="#1A3A5C">定律是有限的</text>
    <text x="88" y="516" font-size="13" fill="#5A6874">高中物理的核心方程两只手</text>
    <text x="88" y="538" font-size="13" fill="#5A6874">数得过来——把它们吃到</text>
    <text x="88" y="560" font-size="13" fill="#5A6874">「换任何衣服都认得」的深度</text>

    <rect x="453" y="410" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="481" y="448" font-size="26" font-weight="700" fill="#277653" font-family="'Georgia', serif">❷</text>
    <text x="481" y="486" font-size="15" font-weight="600" fill="#277653">情境是无限的</text>
    <text x="481" y="516" font-size="13" fill="#5A6874">检流计会老，磁控管会新，</text>
    <text x="481" y="538" font-size="13" fill="#5A6874">明年还有你没见过的仪器——</text>
    <text x="481" y="560" font-size="13" fill="#5A6874">别追情境，追模型</text>

    <rect x="846" y="410" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="874" y="448" font-size="26" font-weight="700" fill="#C0392B" font-family="'Georgia', serif">❸</text>
    <text x="874" y="486" font-size="15" font-weight="600" fill="#C0392B">方法是可以练的</text>
    <text x="874" y="516" font-size="13" fill="#5A6874">五步法（画图→临界→分段</text>
    <text x="874" y="538" font-size="13" fill="#5A6874">→选视角→验证）每题必走，</text>
    <text x="874" y="560" font-size="13" fill="#5A6874">流程即冷静，冷静即分数</text>
  </g>

  <text x="60" y="668" font-family="'PingFang SC', sans-serif" font-size="13" fill="#5A6874">—— 完 · 祝 2026 届考生考场上认出每一位「老朋友」 ——</text>
  <text x="60" y="700" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#8A96A3">小爱教研 · 真题来源见各页页脚 · 建议配合原卷使用</text>
</svg>
