<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C0392B"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">套路④ 方法迁移：用开普勒定律解电磁场题</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">2025 黑吉辽蒙压轴——十年最惊艳的一道：天体物理方法空降微观粒子</text>

  <!-- 原题卡 -->
  <rect x="60" y="112" width="760" height="200" rx="10" fill="#FFFFFF" stroke="#DDE4EC"/>
  <rect x="60" y="112" width="4" height="200" fill="#C0392B"/>
  <text x="92" y="140" font-family="'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#C0392B">【原题】2025 · 新课标 II 卷（黑吉辽蒙）· 压轴 ★十年创新巅峰</text>
  <text x="92" y="170" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">xOy 平面第一、四象限存在垂直纸面向里的匀强磁场 B。带正电粒子（电荷量 q、质量 m）</text>
  <text x="92" y="194" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">从 M(0,-y₀) 射入，速度与 y 轴正向夹角 θ，从 N(0,y₀) 射出磁场。</text>
  <text x="92" y="218" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">(1) 求入射速度大小及磁场中运动时间；(2) 若圆心 O 处固定负点电荷 -Q（k 为静电力常量），</text>
  <text x="92" y="242" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">粒子仍沿原轨迹 M→N，求入射速度；(3) 在(2)条件下，粒子从 N 射出后经时间 t₂ 速度</text>
  <text x="92" y="266" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">方向首次与 N 点速度方向相反，求 t₂。</text>
  <text x="92" y="296" font-size="11.5" fill="#8A96A3">来源：人人文库 2025 汇编+张朝阳物理课讲解（B+/A-）</text>

  <!-- 三问难度阶梯 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="840" y="112" width="380" height="200" rx="10" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="868" y="142" font-size="13.5" font-weight="700" fill="#1A3A5C">三问的「断崖式」设计</text>
    <rect x="868" y="158" width="324" height="40" rx="8" fill="#EFF7F2"/>
    <text x="880" y="178" font-size="12.5" fill="#277653" font-weight="600">第(1)问：常规磁场几何（送分）</text>
    <text x="880" y="194" font-size="11.5" fill="#5A6874">r = y₀/cosθ → v = qBy₀/(m·cosθ)</text>
    <rect x="868" y="206" width="324" height="40" rx="8" fill="#F0F4F9"/>
    <text x="880" y="226" font-size="12.5" fill="#1A3A5C" font-weight="600">第(2)问：库仑力接管（中档）</text>
    <text x="880" y="242" font-size="11.5" fill="#5A6874">kQq/r² = mv²/r → v′（舍负根）</text>
    <rect x="868" y="254" width="324" height="44" rx="8" fill="#FDF0EE"/>
    <text x="880" y="274" font-size="12.5" fill="#C0392B" font-weight="700">第(3)问：椭圆+开普勒（封神）</text>
    <text x="880" y="290" font-size="11.5" fill="#C0392B">速度首次反向 = 走到椭圆「另一端」</text>
  </g>

  <!-- 关键洞察 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="348" font-size="15" font-weight="600" fill="#C0392B">第(3)问为什么难倒众生：它需要两次「认出」</text>
    <rect x="60" y="364" width="560" height="160" rx="10" fill="#FDF0EE"/>
    <text x="88" y="394" font-size="13.5" font-weight="600" fill="#C0392B">认出①：这不是圆，是椭圆</text>
    <text x="88" y="420" font-size="12.5" fill="#5A6874">出磁场后仅受中心 -Q 的库仑力。</text>
    <text x="88" y="442" font-size="12.5" fill="#5A6874">在 N 点：需要的向心力 mv²/r_N > 提供的 kQq/r_N²</text>
    <text x="88" y="464" font-size="12.5" fill="#5A6874">→ 引力不足以维持圆周 → 粒子做椭圆轨道（-Q 在焦点）</text>
    <text x="88" y="496" font-size="12.5" fill="#5A6874">类比：卫星在近地点加速 → 转移椭圆轨道</text>

    <rect x="640" y="364" width="580" height="160" rx="10" fill="#F0F4F9"/>
    <text x="668" y="394" font-size="13.5" font-weight="600" fill="#1A3A5C">认出②：开普勒第二定律是救命稻草</text>
    <text x="668" y="420" font-size="12.5" fill="#5A6874">「面积速度守恒」在万有引力场成立 ⇔ 在库仑场同样成立</text>
    <text x="668" y="442" font-size="12.5" fill="#5A6874">（同为平方反比有心力）——物理学的深层统一</text>
    <text x="668" y="470" font-family="'Times New Roman', serif" font-size="13" fill="#1F2A33">N点(近点)：½r_N·v_N = 面积速度　→ 远点同律</text>
    <text x="668" y="496" font-size="12.5" fill="#5A6874">能量守恒(库仑势能) + 面积定律 → 远点速度 → t₂ = 半周期</text>
  </g>

  <!-- 命题人视角 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="542" width="1160" height="94" rx="12" fill="#1F2A33"/>
    <text x="90" y="576" font-size="15" font-weight="700" fill="#F0C98A">🔍 出题人在想什么（本题的历史地位）</text>
    <text x="90" y="606" font-size="14" fill="#E8EDF3">考纲里「开普勒定律」在天体章、「库仑场」在静电章——命题人把两章焊死：考的不是知识，是「平方反比有心力」这个统一结构能不能被认出。机械刷题者死于第(3)问，</text>
    <text x="90" y="628" font-size="14" fill="#F0C98A" font-weight="600">真正理解物理的人会心一笑。这就是「创新性」的天花板形态：新组合，旧定律。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">原题：2025 黑吉辽蒙卷（公开真题）· 解析参照汇编+张朝阳课 · 命题分析：小爱（C）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C0392B">07 / 13</text>
</svg>
