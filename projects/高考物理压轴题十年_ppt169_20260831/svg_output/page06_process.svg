<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">套路③ 过程拆解：绳断了之后发生什么？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">多过程题的核心功夫：把一条复杂运动切成几段「标准模型」串起来</text>

  <!-- 原题卡 -->
  <rect x="60" y="112" width="740" height="170" rx="10" fill="#FFFFFF" stroke="#DDE4EC"/>
  <rect x="60" y="112" width="4" height="170" fill="#1A3A5C"/>
  <text x="92" y="140" font-family="'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#1A3A5C">【原题】2025 · 湖南卷 · 压轴（张朝阳物理课同款讲解）</text>
  <text x="92" y="170" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">轻杆与绳系统：小球 m 系于绳端，绳另端连一可沿水平杆滑动的物块（或固定杆 M 系统）。</text>
  <text x="92" y="194" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">系统在竖直平面内运动，当摆角 θ=37° 时绳中张力达到极限而断裂，小球此后做抛体运动。</text>
  <text x="92" y="218" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">已知 sin37°=0.6，cos37°=0.8，求绳断瞬间速度、落点位置等（三问递进）。</text>
  <text x="92" y="246" font-size="11.5" fill="#8A96A3">来源：搜狐/张朝阳物理课第250期官方讲解（B+）· 题干为要点转述，细节以原卷为准</text>

  <!-- 过程分段图 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="820" y="112" width="400" height="170" rx="10" fill="#FFFFFF" stroke="#DDE4EC"/>
    <text x="848" y="142" font-size="13.5" font-weight="700" fill="#1A3A5C">过程拆解图</text>
    <rect x="848" y="158" width="100" height="44" rx="8" fill="#1A3A5C"/>
    <text x="898" y="178" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">阶段Ⅰ</text>
    <text x="898" y="194" text-anchor="middle" font-size="10.5" fill="#C7D4E2">圆周摆动</text>
    <text x="958" y="182" font-size="14" fill="#8A96A3">→</text>
    <rect x="978" y="158" width="100" height="44" rx="8" fill="#C0392B"/>
    <text x="1028" y="178" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">断！θ=37°</text>
    <text x="1028" y="194" text-anchor="middle" font-size="10.5" fill="#F5D0CA">张力极限</text>
    <text x="1088" y="182" font-size="14" fill="#8A96A3">→</text>
    <rect x="1108" y="158" width="88" height="44" rx="8" fill="#277653"/>
    <text x="1152" y="178" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">阶段Ⅱ</text>
    <text x="1152" y="194" text-anchor="middle" font-size="10.5" fill="#D2E9DC">平抛</text>
    <text x="848" y="228" font-size="12" fill="#5A6874">每段一个标准模型：Ⅰ=圆周动力学+能量；</text>
    <text x="848" y="248" font-size="12" fill="#5A6874">Ⅱ=平抛运动的合成分解（水平匀速+竖直加速）</text>
    <text x="848" y="270" font-size="12" fill="#C0392B" font-weight="600">衔接点 = 断裂瞬间的速度（大小+方向）</text>
  </g>

  <!-- 思路链 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="316" font-size="15" font-weight="600" fill="#1A3A5C">解题思路链（张朝阳讲法精髓）</text>
    <rect x="60" y="332" width="370" height="150" rx="10" fill="#F0F4F9"/>
    <text x="84" y="362" font-size="13.5" font-weight="600" fill="#1A3A5C">① 断前：能量+动力学双轨</text>
    <text x="84" y="388" font-size="12.5" fill="#5A6874">能量守恒定速率（重力势能→动能+杆动能）</text>
    <text x="84" y="410" font-size="12.5" fill="#5A6874">圆周动力学定张力（T-mg·sinθ = mv²/L）</text>
    <text x="84" y="436" font-size="12.5" fill="#5A6874">联立得断裂条件 → 解出 v(θ=37°)</text>
    <text x="84" y="462" font-size="12" fill="#8A96A3">矢量分解：v 沿绳/垂直绳、切向/法向</text>

    <rect x="450" y="332" width="370" height="150" rx="10" fill="#F0F4F9"/>
    <text x="474" y="362" font-size="13.5" font-weight="600" fill="#1A3A5C">② 断后：平抛标准操作</text>
    <text x="474" y="388" font-size="12.5" fill="#5A6874">水平：匀速 x = v·cos37°·t</text>
    <text x="474" y="410" font-size="12.5" fill="#5A6874">竖直：自由落体 y = v·sin37°·t + ½gt²</text>
    <text x="474" y="436" font-size="12.5" fill="#5A6874">几何关系回定位移（由 x₁ 往回 L·cosθ 等）</text>
    <text x="474" y="462" font-size="12" fill="#8A96A3">张朝阳亮点：相对运动+矢量微积分思想</text>

    <rect x="840" y="332" width="380" height="150" rx="10" fill="#FDF0EE"/>
    <text x="864" y="362" font-size="13.5" font-weight="600" fill="#C0392B">③ 易错点清单</text>
    <text x="864" y="388" font-size="12.5" fill="#5A6874">· 断裂瞬间速度方向沿圆周切向（不是水平！）</text>
    <text x="864" y="410" font-size="12.5" fill="#5A6874">· 平抛初速度 = 断裂速度全量继承</text>
    <text x="864" y="436" font-size="12.5" fill="#5A6874">· 杆/物块是否动决定能量分配（审题核心）</text>
    <text x="864" y="462" font-size="12" fill="#C0392B">37° 数值是礼物（3-4-5 三角形），别算错</text>
  </g>

  <!-- 命题人视角 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="502" width="1160" height="134" rx="12" fill="#1A3A5C"/>
    <text x="90" y="536" font-size="15" font-weight="700" fill="#E8EDF3">🔍 出题人在想什么</text>
    <text x="90" y="566" font-size="14" fill="#C7D4E2">· 「断裂」是天然的进程切换器：一段圆周（动力学+能量）+ 一段平抛（运动学）——两个章节的知识焊在一题，这就是「综合性」</text>
    <text x="90" y="594" font-size="14" fill="#C7D4E2">· 37° 不是随便选的：0.6/0.8 让几何计算干净，把考查时间留给物理判断而非算术——出题人的善意藏在数值里</text>
    <text x="90" y="620" font-size="14" fill="#E8EDF3" font-weight="600">· 同款套路十年谱系：2024 各省板块题（板块分离）→ 2025 全国 T25（板块「动静」）——「切换点」永远是题眼</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">原题：2025 湖南卷（转述版 B+）· 讲法参考张朝阳物理课 · 命题分析：小爱（C）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">06 / 13</text>
</svg>
