<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">备考策略：三轮打法与资源分配</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">把十年规律转译成可执行的时间表</text>

  <!-- 三轮 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="373" height="330" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <rect x="60" y="112" width="373" height="44" rx="12" fill="#1A3A5C"/>
    <text x="246" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">一轮（9月-2月）：模型库</text>
    <text x="88" y="182" font-size="13" font-weight="600" fill="#1A3A5C">核心任务：17个压轴模型全覆盖</text>
    <text x="88" y="208" font-size="12.5" fill="#5A6874">磁场：圆周/临界/复合场/边界几何</text>
    <text x="88" y="230" font-size="12.5" fill="#5A6874">感应：单杆/双杆/图像/有效值</text>
    <text x="88" y="252" font-size="12.5" fill="#5A6874">力学：板块/弹簧/碰撞/传送带</text>
    <text x="88" y="274" font-size="12.5" fill="#5A6874">复合：等效场/天体类比/仪器情境</text>
    <text x="88" y="306" font-size="12.5" fill="#1F2A33" font-weight="600">达标标准：</text>
    <text x="88" y="330" font-size="12.5" fill="#5A6874">· 每个模型能默画轨迹/受力图</text>
    <text x="88" y="352" font-size="12.5" fill="#5A6874">· 一题多解（力/能/动量）</text>
    <text x="88" y="374" font-size="12.5" fill="#5A6874">· 能给别人讲明白</text>
    <rect x="88" y="392" width="317" height="36" rx="8" fill="#F0F4F9"/>
    <text x="246" y="415" text-anchor="middle" font-size="12" fill="#1A3A5C">费曼检验：讲不清=没懂透</text>

    <rect x="453" y="112" width="373" height="330" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <rect x="453" y="112" width="373" height="44" rx="12" fill="#277653"/>
    <text x="639" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">二轮（3月-4月）：跨章节连线</text>
    <text x="481" y="182" font-size="13" font-weight="600" fill="#277653">核心任务：专题整合训练</text>
    <text x="481" y="208" font-size="12.5" fill="#5A6874">物理D世界建议的三大高频专题：</text>
    <text x="481" y="232" font-size="12.5" fill="#1F2A33">① 天体运动×电磁场（2025新王）</text>
    <text x="481" y="254" font-size="12.5" fill="#1F2A33">② 电磁感应×功能动量</text>
    <text x="481" y="276" font-size="12.5" fill="#1F2A33">③ 功能关系×多过程</text>
    <text x="481" y="306" font-size="12.5" fill="#5A6874">方法：同模型不同情境对照练</text>
    <text x="481" y="328" font-size="12.5" fill="#5A6874">（圆周磁场→椭圆库仑场一组）</text>
    <rect x="481" y="350" width="317" height="78" rx="8" fill="#EFF7F2"/>
    <text x="639" y="378" text-anchor="middle" font-size="12.5" fill="#277653" font-weight="600">连线清单（自查）</text>
    <text x="639" y="400" text-anchor="middle" font-size="11.5" fill="#5A6874">开普勒↔库仑 | 等效重力↔复合场</text>
    <text x="639" y="418" text-anchor="middle" font-size="11.5" fill="#5A6874">交流有效值↔电磁感应 | 板块↔动量</text>

    <rect x="846" y="112" width="373" height="330" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <rect x="846" y="112" width="373" height="44" rx="12" fill="#C0392B"/>
    <text x="1032" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">三轮（5月-6月）：真题限时</text>
    <text x="874" y="182" font-size="13" font-weight="600" fill="#C0392B">核心任务：五道必做+限时仿真</text>
    <text x="874" y="208" font-size="12.5" fill="#5A6874">优先级（P9 表）：2025黑吉辽蒙</text>
    <text x="874" y="230" font-size="12.5" fill="#5A6874">→2025陕晋青宁→2022甲T25</text>
    <text x="874" y="252" font-size="12.5" fill="#5A6874">→2017II→2025山东</text>
    <text x="874" y="284" font-size="12.5" fill="#1F2A33" font-weight="600">限时规则：</text>
    <text x="874" y="308" font-size="12.5" fill="#5A6874">· 压轴题预算 20-25 分钟</text>
    <text x="874" y="330" font-size="12.5" fill="#5A6874">· 拿下(1)(2)问=赢一半</text>
    <text x="874" y="352" font-size="12.5" fill="#5A6874">· (3)问写思路也能抢步骤分</text>
    <rect x="874" y="374" width="317" height="54" rx="8" fill="#FDF0EE"/>
    <text x="1032" y="396" text-anchor="middle" font-size="12" fill="#C0392B" font-weight="600">策略性放弃也是策略：</text>
    <text x="1032" y="416" text-anchor="middle" font-size="12" fill="#C0392B">前面全对>压轴硬啃</text>
  </g>

  <!-- 底部 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="462" width="1160" height="174" rx="12" fill="#1F2A33"/>
    <text x="90" y="498" font-size="16" font-weight="700" fill="#F0C98A">时间分配的「二八法则」</text>
    <text x="90" y="532" font-size="14" fill="#E8EDF3">· 80% 的时间给「能拿的分」：压轴题(1)(2)问大多是标准模型——2025 黑吉辽蒙第(1)问就是基础几何</text>
    <text x="90" y="564" font-size="14" fill="#E8EDF3">· 20% 的时间给「登顶训练」：每周一道压轴(3)问精做（五步法走全流程），比每天三道浅题有效</text>
    <text x="90" y="602" font-size="14.5" fill="#F0C98A" font-weight="600">数据点：2025 全国卷容易题占 66%（官方口径）——压轴题是选拔层，不是及格层。认清目标，节奏自定。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">策略框架：小爱构建（C）· 官方数据点引考试院/physicalw（A/A-）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">12 / 13</text>
</svg>
