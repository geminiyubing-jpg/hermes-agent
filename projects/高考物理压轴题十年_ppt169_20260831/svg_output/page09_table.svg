<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">题库精选：十年压轴真题速览表</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">20+ 道压轴题的「一句话档案」——考前快速复盘用</text>

  <!-- 表格 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="108" width="1160" height="36" fill="#1A3A5C"/>
    <text x="150" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">年份·卷别</text>
    <text x="400" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">情境/模型</text>
    <text x="780" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">核心考法</text>
    <text x="1090" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#F0C98A">难度/价值</text>

    <rect x="60" y="144" width="1160" height="38" fill="#FFFFFF"/>
    <text x="150" y="169" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2025 黑吉辽蒙</text>
    <text x="400" y="169" text-anchor="middle" font-size="12" fill="#1F2A33">磁场→库仑场→椭圆轨道</text>
    <text x="780" y="169" text-anchor="middle" font-size="12" fill="#5A6874">开普勒第二定律迁移</text>
    <text x="1090" y="169" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">★★★★★ 必做</text>

    <rect x="60" y="182" width="1160" height="38" fill="#F2F5F9"/>
    <text x="150" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2025 陕晋青宁</text>
    <text x="400" y="207" text-anchor="middle" font-size="12" fill="#1F2A33">磁控管测比荷（真仪器）</text>
    <text x="780" y="207" text-anchor="middle" font-size="12" fill="#5A6874">临界相切+螺旋线+面积</text>
    <text x="1090" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">★★★★★ 必做</text>

    <rect x="60" y="220" width="1160" height="38" fill="#FFFFFF"/>
    <text x="150" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2025 山东</text>
    <text x="400" y="245" text-anchor="middle" font-size="12" fill="#1F2A33">电磁感生交流电</text>
    <text x="780" y="245" text-anchor="middle" font-size="12" fill="#5A6874">非常规有效值（定义级理解）</text>
    <text x="1090" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">★★★★</text>

    <rect x="60" y="258" width="1160" height="38" fill="#F2F5F9"/>
    <text x="150" y="283" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2025 全国卷</text>
    <text x="400" y="283" text-anchor="middle" font-size="12" fill="#1F2A33">板块模型「动静」设计</text>
    <text x="780" y="283" text-anchor="middle" font-size="12" fill="#5A6874">功能+动量·视角选择</text>
    <text x="1090" y="283" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">★★★★</text>

    <rect x="60" y="296" width="1160" height="38" fill="#FFFFFF"/>
    <text x="150" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2025 湖南</text>
    <text x="400" y="321" text-anchor="middle" font-size="12" fill="#1F2A33">绳杆系统·绳断平抛</text>
    <text x="780" y="321" text-anchor="middle" font-size="12" fill="#5A6874">多过程+相对运动矢量法</text>
    <text x="1090" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">★★★★</text>

    <rect x="60" y="334" width="1160" height="38" fill="#F2F5F9"/>
    <text x="150" y="359" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2024 湖北</text>
    <text x="400" y="359" text-anchor="middle" font-size="12" fill="#1F2A33">圆形磁场·内外等大反向</text>
    <text x="780" y="359" text-anchor="middle" font-size="12" fill="#5A6874">径向入径向出+周期叠加</text>
    <text x="1090" y="359" text-anchor="middle" font-size="12" font-weight="700" fill="#277653">★★★★</text>

    <rect x="60" y="372" width="1160" height="38" fill="#FFFFFF"/>
    <text x="150" y="397" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2023 全国甲/乙</text>
    <text x="400" y="397" text-anchor="middle" font-size="12" fill="#1F2A33">绝缘筒碰撞/磁场加电场</text>
    <text x="780" y="397" text-anchor="middle" font-size="12" fill="#5A6874">碰撞法则/力平衡比荷</text>
    <text x="1090" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#277653">★★★</text>

    <rect x="60" y="410" width="1160" height="38" fill="#F2F5F9"/>
    <text x="150" y="435" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2022 全国甲 T25</text>
    <text x="400" y="435" text-anchor="middle" font-size="12" fill="#1F2A33">光点式检流计</text>
    <text x="780" y="435" text-anchor="middle" font-size="12" fill="#5A6874">磁力矩vs弹力矩·仪器思想</text>
    <text x="1090" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">★★★★ 必做</text>

    <rect x="60" y="448" width="1160" height="38" fill="#FFFFFF"/>
    <text x="150" y="473" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2021 北京</text>
    <text x="400" y="473" text-anchor="middle" font-size="12" fill="#1F2A33">第一象限磁场 60°入射</text>
    <text x="780" y="473" text-anchor="middle" font-size="12" fill="#5A6874">「什么可求」的元认知</text>
    <text x="1090" y="473" text-anchor="middle" font-size="12" font-weight="700" fill="#277653">★★★</text>

    <rect x="60" y="486" width="1160" height="38" fill="#F2F5F9"/>
    <text x="150" y="511" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2017 全国 II</text>
    <text x="400" y="511" text-anchor="middle" font-size="12" fill="#1F2A33">同速粒子·出射点分布</text>
    <text x="780" y="511" text-anchor="middle" font-size="12" fill="#5A6874">1/6与1/3圆周几何</text>
    <text x="1090" y="511" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">★★★★ 经典</text>

    <rect x="60" y="524" width="1160" height="38" fill="#FFFFFF"/>
    <text x="150" y="549" text-anchor="middle" font-size="12" font-weight="600" fill="#1A3A5C">2016 全国 III</text>
    <text x="400" y="549" text-anchor="middle" font-size="12" fill="#1F2A33">30°边界·轨迹相切</text>
    <text x="780" y="549" text-anchor="middle" font-size="12" fill="#5A6874">等边三角形几何</text>
    <text x="1090" y="549" text-anchor="middle" font-size="12" font-weight="700" fill="#277653">★★★ 几何祖师</text>
  </g>
  <rect x="60" y="108" width="1160" height="454" fill="none" stroke="#DDE4EC"/>

  <!-- 底部 -->
  <rect x="60" y="582" width="1159" height="50" rx="10" fill="#1A3A5C"/>
  <text x="90" y="613" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8EDF3">优先级建议：时间紧张只做 ★★★★★+必做 五道（2025黑吉辽蒙/陕晋青宁/2022甲T25/2017II/2025山东），覆盖十年全部创新点。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">题库：公开真题经汇编收录（B+/A-）· 难度星级为教研通行评级+小爱校准（C）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">09 / 13</text>
</svg>
