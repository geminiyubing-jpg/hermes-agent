<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1280" height="6" fill="#277653"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">解题方法论：压轴题通用五步法</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">从 20+ 道真题中提炼的操作流程——把「难题」变成「流程」</text>

  <!-- 五步流程 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="216" height="240" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <rect x="60" y="112" width="216" height="44" rx="12" fill="#1A3A5C"/>
    <text x="168" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">① 画图</text>
    <text x="84" y="184" font-size="12.5" fill="#1F2A33" font-weight="600">先画再算</text>
    <text x="84" y="210" font-size="12" fill="#5A6874">· 受力图（力学题）</text>
    <text x="84" y="232" font-size="12" fill="#5A6874">· 轨迹图（场题）</text>
    <text x="84" y="254" font-size="12" fill="#5A6874">· 电路图（感应题）</text>
    <rect x="84" y="272" width="168" height="60" rx="8" fill="#F0F4F9"/>
    <text x="168" y="296" text-anchor="middle" font-size="11.5" fill="#1A3A5C">磁场题 80% 信息</text>
    <text x="168" y="316" text-anchor="middle" font-size="11.5" fill="#1A3A5C">在几何关系里</text>

    <rect x="296" y="112" width="216" height="240" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <rect x="296" y="112" width="216" height="44" rx="12" fill="#1A3A5C"/>
    <text x="404" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">② 找临界</text>
    <text x="320" y="184" font-size="12.5" fill="#1F2A33" font-weight="600">圈出关键词</text>
    <text x="320" y="210" font-size="12" fill="#5A6874">·「恰好/刚好」</text>
    <text x="320" y="232" font-size="12" fill="#5A6874">·「首次/最大/最小」</text>
    <text x="320" y="254" font-size="12" fill="#5A6874">·「不脱离/不打滑」</text>
    <rect x="320" y="272" width="168" height="60" rx="8" fill="#FDF0EE"/>
    <text x="404" y="296" text-anchor="middle" font-size="11.5" fill="#C0392B">全部翻译成等式</text>
    <text x="404" y="316" text-anchor="middle" font-size="11.5" fill="#C0392B">（相切/等值/边界）</text>

    <rect x="532" y="112" width="216" height="240" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <rect x="532" y="112" width="216" height="44" rx="12" fill="#277653"/>
    <text x="640" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">③ 分阶段</text>
    <text x="556" y="184" font-size="12.5" fill="#1F2A33" font-weight="600">切过程串模型</text>
    <text x="556" y="210" font-size="12" fill="#5A6874">· 每段一个标准模型</text>
    <text x="556" y="232" font-size="12" fill="#5A6874">· 衔接点=状态量继承</text>
    <text x="556" y="254" font-size="12" fill="#5A6874">  （速度大小+方向）</text>
    <rect x="556" y="272" width="168" height="60" rx="8" fill="#EFF7F2"/>
    <text x="640" y="296" text-anchor="middle" font-size="11.5" fill="#277653">绳断/碰/共速</text>
    <text x="640" y="316" text-anchor="middle" font-size="11.5" fill="#277653">= 天然切割点</text>

    <rect x="768" y="112" width="216" height="240" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <rect x="768" y="112" width="216" height="44" rx="12" fill="#277653"/>
    <text x="876" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">④ 选视角</text>
    <text x="792" y="184" font-size="12.5" fill="#1F2A33" font-weight="600">力/能量/动量</text>
    <text x="792" y="210" font-size="12" fill="#5A6874">· 问 a、t → 力</text>
    <text x="792" y="232" font-size="12" fill="#5A6874">· 问 s、Q、W → 能量</text>
    <text x="792" y="254" font-size="12" fill="#5A6874">· 问 v、I → 动量</text>
    <rect x="792" y="272" width="168" height="60" rx="8" fill="#EFF7F2"/>
    <text x="876" y="296" text-anchor="middle" font-size="11.5" fill="#277653">2025 全国卷明示：</text>
    <text x="876" y="316" text-anchor="middle" font-size="11.5" fill="#277653">「视角选择」即考点</text>

    <rect x="1004" y="112" width="216" height="240" rx="12" fill="#FFFFFF" stroke="#DDE4EC"/>
    <rect x="1004" y="112" width="216" height="44" rx="12" fill="#C0392B"/>
    <text x="1112" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">⑤ 验证</text>
    <text x="1028" y="184" font-size="12.5" fill="#1F2A33" font-weight="600">三查习惯</text>
    <text x="1028" y="210" font-size="12" fill="#5A6874">· 量纲检查</text>
    <text x="1028" y="232" font-size="12" fill="#5A6874">· 极限情形（B→0？θ→90°？）</text>
    <text x="1028" y="254" font-size="12" fill="#5A6874">· 对称性/特殊值</text>
    <rect x="1028" y="272" width="168" height="60" rx="8" fill="#FDF0EE"/>
    <text x="1112" y="296" text-anchor="middle" font-size="11.5" fill="#C0392B">2025黑吉辽蒙(2)问</text>
    <text x="1112" y="316" text-anchor="middle" font-size="11.5" fill="#C0392B">舍负根就是验证环节</text>
  </g>

  <!-- 底部:实战检验 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="376" width="1160" height="260" rx="12" fill="#1F2A33"/>
    <text x="90" y="412" font-size="16" font-weight="700" fill="#F0C98A">五步法实战回放（用 2025 黑吉辽蒙压轴走一遍）</text>
    <text x="90" y="448" font-size="14" fill="#E8EDF3">① 画轨迹：M(0,-y₀)入→N(0,y₀)出，对称过 y 轴 → 圆心在 y 轴上，r=y₀/cosθ（图一画，第(1)问答案已在路上）</text>
    <text x="90" y="480" font-size="14" fill="#E8EDF3">② 找临界：第(3)问「速度首次反向」→ 椭圆远点（速度反向=到达轨道另一端）——关键词圈出来，方向就定了</text>
    <text x="90" y="512" font-size="14" fill="#E8EDF3">③ 分阶段：磁场段（圆周）→ 出磁场段（椭圆），衔接点 N 的速度全量继承</text>
    <text x="90" y="544" font-size="14" fill="#E8EDF3">④ 选视角：椭圆段用能量守恒（动能+电势能）+开普勒第二定律（面积速度）——不是「力方程硬算」</text>
    <text x="90" y="576" font-size="14" fill="#E8EDF3">⑤ 验证：v′>0 舍负根；θ→0 时退化为直线穿越（极限自检）</text>
    <text x="90" y="616" font-size="14.5" fill="#F0C98A" font-weight="600">→ 五步走完，十年最难的题也就成了流程题。这就是方法论的意义。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">方法论：小爱基于 20+ 真题归纳（C 级教研产出，欢迎实践检验）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#277653">10 / 13</text>
</svg>
