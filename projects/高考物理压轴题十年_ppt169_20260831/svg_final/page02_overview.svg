<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F5F7FA" />
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">十年全景：压轴题都考了什么？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">2016-2025 全国卷+省卷压轴题（计算大题末题+选择末题）按知识版块分布</text>

  
  <g>
    <text x="80" y="130" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#1A3A5C">各年份压轴题版块构成（道数）</text>
    <g stroke="#DDE4EC" stroke-width="1">
      <line x1="100" y1="430" x2="680" y2="430" />
      <line x1="100" y1="360" x2="680" y2="360" stroke-dasharray="4,4" />
      <line x1="100" y1="290" x2="680" y2="290" stroke-dasharray="4,4" />
      <line x1="100" y1="220" x2="680" y2="220" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#8A96A3">
      <text x="94" y="434" text-anchor="end">0</text>
      <text x="94" y="364" text-anchor="end">1</text>
      <text x="94" y="294" text-anchor="end">2</text>
      <text x="94" y="224" text-anchor="end">3</text>
    </g>
    
    
    <rect x="120" y="290" width="36" height="140" fill="#1A3A5C" />
    <rect x="120" y="220" width="36" height="70" fill="#C0392B" />
    
    <rect x="180" y="290" width="36" height="140" fill="#1A3A5C" />
    <rect x="180" y="220" width="36" height="70" fill="#C0392B" />
    
    <rect x="240" y="290" width="36" height="70" fill="#1A3A5C" />
    <rect x="240" y="220" width="36" height="70" fill="#C0392B" />
    <rect x="240" y="150" width="36" height="70" fill="#277653" />
    
    <rect x="300" y="290" width="36" height="70" fill="#1A3A5C" />
    <rect x="300" y="220" width="36" height="140" fill="#C0392B" />
    
    <rect x="360" y="290" width="36" height="70" fill="#1A3A5C" />
    <rect x="360" y="220" width="36" height="140" fill="#C0392B" />
    
    <rect x="420" y="290" width="36" height="140" fill="#1A3A5C" />
    <rect x="420" y="220" width="36" height="70" fill="#277653" />
    
    <rect x="480" y="290" width="36" height="70" fill="#1A3A5C" />
    <rect x="480" y="220" width="36" height="70" fill="#C0392B" />
    <rect x="480" y="150" width="36" height="70" fill="#277653" />
    
    <rect x="540" y="220" width="36" height="210" fill="#1A3A5C" />
    <rect x="540" y="150" width="36" height="70" fill="#277653" />
    
    <rect x="600" y="290" width="36" height="140" fill="#1A3A5C" />
    <rect x="600" y="220" width="36" height="70" fill="#277653" />
    
    <rect x="655" y="220" width="36" height="70" fill="#1A3A5C" />
    <rect x="655" y="150" width="36" height="70" fill="#C0392B" />
    <rect x="655" y="80" width="36" height="70" fill="#277653" />
    <rect x="655" y="40" width="36" height="40" fill="#B8860B" />

    <g font-family="'Helvetica Neue', sans-serif" font-size="11.5" fill="#5A6874" text-anchor="middle">
      <text x="138" y="450">'16</text><text x="198" y="450">'17</text><text x="258" y="450">'18</text>
      <text x="318" y="450">'19</text><text x="378" y="450">'20</text><text x="438" y="450">'21</text>
      <text x="498" y="450">'22</text><text x="558" y="450">'23</text><text x="618" y="450">'24</text>
      <text x="673" y="450">'25</text>
    </g>
    <g font-family="'PingFang SC', sans-serif" font-size="12">
      <rect x="120" y="470" width="14" height="14" fill="#1A3A5C" /><text x="142" y="482">磁场/带电粒子</text>
      <rect x="260" y="470" width="14" height="14" fill="#C0392B" /><text x="282" y="482">电磁感应</text>
      <rect x="380" y="470" width="14" height="14" fill="#277653" /><text x="402" y="482">力学综合</text>
      <rect x="500" y="470" width="14" height="14" fill="#B8860B" /><text x="522" y="482">复合创新</text>
    </g>
    <text x="390" y="516" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">示意统计（主流卷别每年2-3道压轴，本图为版块构成概览）</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DDE4EC" d="M732,112 H1208 A12,12 0 0 1 1220,124 V520 A12,12 0 0 1 1208,532 H732 A12,12 0 0 1 720,520 V124 A12,12 0 0 1 732,112 Z" />
    <text x="748" y="146" font-size="15.5" font-weight="700" fill="#1A3A5C">十年三条主线</text>
    <path fill="#F0F4F9" d="M756,164 H1184 A8,8 0 0 1 1192,172 V256 A8,8 0 0 1 1184,264 H756 A8,8 0 0 1 748,256 V172 A8,8 0 0 1 756,164 Z" />
    <text x="766" y="192" font-size="13.5" font-weight="600" fill="#1A3A5C">主线一：磁场常青（约40%）</text>
    <text x="766" y="216" font-size="12.5" fill="#5A6874">带电粒子圆周运动年年出现，考的是几何功夫：</text>
    <text x="766" y="238" font-size="12.5" fill="#5A6874">2017 II 卷 1/6 圆周 → 2025 黑吉辽蒙椭圆迁移，一脉相承</text>

    <path fill="#FDF0EE" d="M756,278 H1184 A8,8 0 0 1 1192,286 V370 A8,8 0 0 1 1184,378 H756 A8,8 0 0 1 748,370 V286 A8,8 0 0 1 756,278 Z" />
    <text x="766" y="306" font-size="13.5" font-weight="600" fill="#C0392B">主线二：电磁感应起伏（约25%）</text>
    <text x="766" y="330" font-size="12.5" fill="#5A6874">2016-2019 导轨双杆高峰 → 2020 后让位磁场，但一出现就考新意：</text>
    <text x="766" y="352" font-size="12.5" fill="#5A6874">2025 山东「非常规交流电有效值」</text>

    <path fill="#EFF7F2" d="M756,392 H1184 A8,8 0 0 1 1192,400 V504 A8,8 0 0 1 1184,512 H756 A8,8 0 0 1 748,504 V400 A8,8 0 0 1 756,392 Z" />
    <text x="766" y="420" font-size="13.5" font-weight="600" fill="#277653">主线三：复合创新崛起（2018→2025）</text>
    <text x="766" y="444" font-size="12.5" fill="#5A6874">从仪器情境（2022 甲卷检流计）到天体方法迁移</text>
    <text x="766" y="466" font-size="12.5" fill="#5A6874">（2025 开普勒第二定律解椭圆）——</text>
    <text x="766" y="488" font-size="12.5" fill="#277653" font-weight="600">难度重心从「算得深」转向「想得新」</text>
  </g>

  
  <path fill="#1F2A33" d="M72,552 H1208 A12,12 0 0 1 1220,564 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V564 A12,12 0 0 1 72,552 Z" />
  <text x="90" y="586" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#E8EDF3">读图结论：磁场是压轴题的「基本盘」（十年从未缺席），电磁感应是「变量」（考则必新），力学综合是「稳压器」，</text>
  <text x="90" y="614" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#E8EDF3">复合创新是 2023 年后的「新王」——2025 年四版块全部出现在压轴位，是十年最「满」的一年。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">统计口径：主流卷别压轴位（末道计算+末道选择）；分布为小爱整理（B+/C）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">02 / 13</text>
</svg>