    <text x="320" y="254" font-size="12" fill="#5A6874">·「不脱离/不打滑」</text>
    <path fill="#FDF0EE" d="M328,272 H480 A8,8 0 0 1 488,280 V324 A8,8 0 0 1 480,332 H328 A8,8 0 0 1 320,324 V280 A8,8 0 0 1 328,272 Z" />
