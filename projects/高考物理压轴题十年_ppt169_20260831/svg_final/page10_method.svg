  <g font-family="'PingFang SC', sans-serif">
    <path fill="#1F2A33" d="M72,376 H1208 A12,12 0 0 1 1220,388 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V388 A12,12 0 0 1 72,376 Z" />
    <text x="90" y="412" font-size="16" font-weight="700" fill="#F0C98A">五步法实战回放（用 2025 黑吉辽蒙压轴走一遍）</text>
    <text x="90" y="448" font-size="14" fill="#E8EDF3">① 画轨迹：M(0,-y₀)入→N(0,y₀)出，对称过 y 轴 → 圆心在 y 轴上，r=y₀/cosθ（图一画，第(1)问答案已在路上）</text>
    <text x="90" y="480" font-size="14" fill="#E8EDF3">② 找临界：第(3)问「速度首次反向」→ 椭圆远点（速度反向=到达轨道另一端）——关键词圈出来，方向就定了</text>
    <text x="90" y="512" font-size="14" fill="#E8EDF3">③ 分阶段：磁场段（圆周）→ 出磁场段（椭圆），衔接点 N 的速度全量继承</text>
    <text x="90" y="544" font-size="14" fill="#E8EDF3">④ 选视角：椭圆段用能量守恒（动能+电势能）+开普勒第二定律（面积速度）——不是「力方程硬算」</text>
    <text x="90" y="576" font-size="14" fill="#E8EDF3">⑤ 验证：v′&gt;0 舍负根；θ→0 时退化为直线穿越（极限自检）</text>
    <text x="90" y="616" font-size="14.5" fill="#F0C98A" font-weight="600">→ 五步走完，十年最难的题也就成了流程题。这就是方法论的意义。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">方法论：小爱基于 20+ 真题归纳（C 级教研产出，欢迎实践检验）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#277653">10 / 13</text>
</svg>