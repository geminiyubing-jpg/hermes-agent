<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F5F7FA" />
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">套路② 临界条件：「恰好」「刚好」「首次」</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">压轴题最锋利的三个字——把不等式世界变成等式世界的开关</text>

  
  <path fill="#FFFFFF" stroke="#DDE4EC" d="M70,112 H790 A10,10 0 0 1 800,122 V292 A10,10 0 0 1 790,302 H70 A10,10 0 0 1 60,292 V122 A10,10 0 0 1 70,112 Z" />
  <rect x="60" y="112" width="4" height="190" fill="#1A3A5C" />
  <text x="92" y="140" font-family="'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#1A3A5C">【原题】2025 · 陕晋青宁卷 · 压轴：磁控管测电子比荷</text>
  <text x="92" y="170" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">理想二极管电极结构为圆筒面+中心轴构成的圆柱体系统，圆筒足够长。O 点电子源向各方向</text>
  <text x="92" y="194" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">发射速度大小均为 v₀ 的电子。某时刻起筒内加沿中心轴向下的匀强磁场（大小可调）。</text>
  <text x="92" y="218" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">(1) 当磁感应强度调至 B₁ 时，<tspan font-weight="700" fill="#C0392B">恰好没有电子落到筒壁上</tspan>，求电子比荷；</text>
  <text x="92" y="242" font-family="'PingFang SC', serif" font-size="13.5" fill="#1F2A33">(2) 当调至 B₂ 时，求筒壁上落有电子的区域面积 S。（R、v₀、B₁、B₂ 均已知）</text>
  <text x="92" y="274" font-size="11.5" fill="#8A96A3">来源：人人文库 2025 分类汇编收录（B+/A-）· 磁控管=真实物理仪器（Vacuum tube 磁控法测 e/m）</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DDE4EC" d="M830,112 H1210 A10,10 0 0 1 1220,122 V292 A10,10 0 0 1 1210,302 H830 A10,10 0 0 1 820,292 V122 A10,10 0 0 1 830,112 Z" />
    <text x="848" y="142" font-size="13.5" font-weight="700" fill="#1A3A5C">临界相切图（截面示意）</text>
    <circle cx="950" cy="216" r="58" fill="none" stroke="#1A3A5C" stroke-width="2" />
    <circle cx="950" cy="216" r="3" fill="#1A3A5C" />
    <text x="958" y="212" font-size="10.5" fill="#5A6874">O(轴)</text>
    
    <circle cx="1008" cy="216" r="29" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,3" />
    <circle cx="1008" cy="216" r="3" fill="#C0392B" />
    <line x1="1008" y1="216" x2="1037" y2="216" stroke="#C0392B" stroke-width="1.5" />
    <text x="1012" y="238" font-size="11" fill="#C0392B">r₁=R/2</text>
    <text x="855" y="288" font-size="12" fill="#5A6874">「恰好不到筒壁」= 最大圆(垂直轴分量)与筒壁</text>
    <text x="855" y="288" font-size="0" fill="#5A6874">.</text>
    <text x="890" y="292" font-size="0">.</text>
    <text x="855" y="290" font-size="0">.</text>
    <text x="855" y="294" font-size="0">.</text>
    <text x="855" y="296" font-size="0">.</text>
    <text x="1024" y="200" font-size="11" fill="#C0392B">相切</text>
    <text x="855" y="266" font-size="12" fill="#5A6874">发射方向各异 → 取垂直轴速度分量最大的电子</text>
    <text x="855" y="286" font-size="12" fill="#5A6874">（沿垂直轴方向发射，v⊥=v₀）为临界设计对象</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="336" font-size="15" font-weight="600" fill="#1A3A5C">解题思路链</text>
    <path fill="#F0F4F9" d="M70,352 H420 A10,10 0 0 1 430,362 V462 A10,10 0 0 1 420,472 H70 A10,10 0 0 1 60,462 V362 A10,10 0 0 1 70,352 Z" />
    <text x="84" y="382" font-size="13.5" font-weight="600" fill="#1A3A5C">(1) 第一步：翻译「恰好」</text>
    <text x="84" y="406" font-size="12.5" fill="#5A6874">恰好无电子到壁 = 最危险电子的轨迹圆</text>
    <text x="84" y="426" font-size="12.5" fill="#5A6874">与筒壁相切 → 几何：r₁ = R/2</text>
    <text x="84" y="452" font-family="'Times New Roman', serif" font-size="14" fill="#C0392B" font-weight="700">e/m = 2v₀/(B₁R)² 型解出</text>
    <text x="450" y="416" font-size="18" fill="#8A96A3">→</text>
    <path fill="#F0F4F9" d="M484,352 H834 A10,10 0 0 1 844,362 V462 A10,10 0 0 1 834,472 H484 A10,10 0 0 1 474,462 V362 A10,10 0 0 1 484,352 Z" />
    <text x="498" y="382" font-size="13.5" font-weight="600" fill="#1A3A5C">(2) 第二步：降磁场后的螺旋线</text>
    <text x="498" y="406" font-size="12.5" fill="#5A6874">B₂ &lt; B₁ → 垂直轴圆周半径变大但不到壁？</text>
    <text x="498" y="426" font-size="12.5" fill="#5A6874">不：平行轴分量让它「边转边走」螺旋前进</text>
    <text x="498" y="452" font-size="12.5" fill="#5A6874">运动分解：v∥ 匀速 + v⊥ 圆周</text>
    <text x="864" y="416" font-size="18" fill="#8A96A3">→</text>
    <path fill="#FDF0EE" d="M898,352 H1210 A10,10 0 0 1 1220,362 V462 A10,10 0 0 1 1210,472 H898 A10,10 0 0 1 888,462 V362 A10,10 0 0 1 898,352 Z" />
    <text x="912" y="382" font-size="13.5" font-weight="600" fill="#C0392B">第三步：半周期+对称性求面积</text>
    <text x="912" y="406" font-size="12.5" fill="#5A6874">击中最远点时恰转半圈（再相切），</text>
    <text x="912" y="426" font-size="12.5" fill="#5A6874">结合旋转对称 → 环形区域面积 S</text>
    <text x="912" y="452" font-size="12.5" fill="#C0392B" font-weight="600">（积分/对称思想，卷面写几何推导）</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#1A3A5C" d="M72,492 H1208 A12,12 0 0 1 1220,504 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V504 A12,12 0 0 1 72,492 Z" />
    <text x="90" y="526" font-size="15" font-weight="700" fill="#E8EDF3">🔍 出题人在想什么</text>
    <text x="90" y="556" font-size="14" fill="#C7D4E2">· 「恰好」二字价值千金：它把连续变化的 B 焊死在一个确定值上——考生的任务是从模糊情境里提炼出那一个等式</text>
    <text x="90" y="584" font-size="14" fill="#C7D4E2">· 三维压二维：电子实际走螺旋线（三维），但截面分析（二维）足够定临界——考查「降维建模」的物理直觉</text>
    <text x="90" y="612" font-size="14" fill="#E8EDF3" font-weight="600">· 情境是真的：磁控法测比荷是经典实验物理方法——仪器即物理，答案可以真的去用</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">原题：2025 陕晋青宁卷（公开真题）· 解法参照汇编解析 · 命题分析：小爱（C）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">05 / 13</text>
</svg>