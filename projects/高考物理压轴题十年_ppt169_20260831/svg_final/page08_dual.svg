<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F5F7FA" />
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">套路⑤⑥ 能量动量双视角 + 真实情境包装</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">力学压轴的左右互搏 · 仪器情境的十年谱系</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DDE4EC" d="M72,112 H620 A12,12 0 0 1 632,124 V380 A12,12 0 0 1 620,392 H72 A12,12 0 0 1 60,380 V124 A12,12 0 0 1 72,112 Z" />
    <text x="88" y="146" font-size="15.5" font-weight="700" fill="#1A3A5C">套路⑤ 双视角：2025 全国卷 T25「板块动静」</text>
    <path fill="#F0F4F9" d="M96,162 H596 A8,8 0 0 1 604,170 V218 A8,8 0 0 1 596,226 H96 A8,8 0 0 1 88,218 V170 A8,8 0 0 1 96,162 Z" />
    <text x="104" y="186" font-size="12.5" fill="#1F2A33">【情境】熟悉的板块模型，巧妙设计「动静」——何时不滑？何时共速？</text>
    <text x="104" y="208" font-size="12.5" fill="#5A6874">官方评析（physicalw）：「引导学生通过能量变化角度分析物理过程，注重解决问题视角的选择」</text>
    <text x="88" y="252" font-size="13.5" font-weight="600" fill="#1A3A5C">三个视角，各有最佳适用场景：</text>
    <path fill="#EFF7F2" d="M96,266 H240 A8,8 0 0 1 248,274 V354 A8,8 0 0 1 240,362 H96 A8,8 0 0 1 88,354 V274 A8,8 0 0 1 96,266 Z" />
    <text x="168" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#277653">力视角</text>
    <text x="168" y="316" text-anchor="middle" font-size="11.5" fill="#5A6874">求加速度/时间</text>
    <text x="168" y="336" text-anchor="middle" font-size="11.5" fill="#5A6874">牛顿定律+摩擦分析</text>
    <path fill="#F0F4F9" d="M266,266 H410 A8,8 0 0 1 418,274 V354 A8,8 0 0 1 410,362 H266 A8,8 0 0 1 258,354 V274 A8,8 0 0 1 266,266 Z" />
    <text x="338" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#1A3A5C">能量视角</text>
    <text x="338" y="316" text-anchor="middle" font-size="11.5" fill="#5A6874">求位移/热量/功</text>
    <text x="338" y="336" text-anchor="middle" font-size="11.5" fill="#5A6874">Q=f·Δs（相对位移）</text>
    <path fill="#FDF0EE" d="M436,266 H596 A8,8 0 0 1 604,274 V354 A8,8 0 0 1 596,362 H436 A8,8 0 0 1 428,354 V274 A8,8 0 0 1 436,266 Z" />
    <text x="516" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">动量视角</text>
    <text x="516" y="316" text-anchor="middle" font-size="11.5" fill="#5A6874">求速度/冲击</text>
    <text x="516" y="336" text-anchor="middle" font-size="11.5" fill="#5A6874">系统守恒（外力=0时）</text>
    <text x="88" y="384" font-size="12.5" fill="#C0392B" font-weight="600">命题点：让「该用哪个视角」本身成为考点</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DDE4EC" d="M660,112 H1208 A12,12 0 0 1 1220,124 V380 A12,12 0 0 1 1208,392 H660 A12,12 0 0 1 648,380 V124 A12,12 0 0 1 660,112 Z" />
    <text x="676" y="146" font-size="15.5" font-weight="700" fill="#1A3A5C">套路⑥ 仪器即物理：情境十年谱系</text>
    <g>
      <path fill="#F0F4F9" d="M684,166 H908 A8,8 0 0 1 916,174 V208 A8,8 0 0 1 908,216 H684 A8,8 0 0 1 676,208 V174 A8,8 0 0 1 684,166 Z" />
      <text x="690" y="188" font-size="12.5" font-weight="600" fill="#1A3A5C">2022 甲卷 T25</text>
      <text x="690" y="206" font-size="11.5" fill="#5A6874">光点式检流计（测微电流）</text>
      <path fill="#F0F4F9" d="M684,224 H908 A8,8 0 0 1 916,232 V266 A8,8 0 0 1 908,274 H684 A8,8 0 0 1 676,266 V232 A8,8 0 0 1 684,224 Z" />
      <text x="690" y="246" font-size="12.5" font-weight="600" fill="#1A3A5C">2023 福建压轴</text>
      <text x="690" y="264" font-size="11.5" fill="#5A6874">阿斯顿质谱仪（同位素）</text>
      <path fill="#F0F4F9" d="M684,282 H908 A8,8 0 0 1 916,290 V324 A8,8 0 0 1 908,332 H684 A8,8 0 0 1 676,324 V290 A8,8 0 0 1 684,282 Z" />
      <text x="690" y="304" font-size="12.5" font-weight="600" fill="#1A3A5C">2025 陕晋青宁</text>
      <text x="690" y="322" font-size="11.5" fill="#5A6874">磁控管测电子比荷</text>
      <path fill="#FDF0EE" d="M684,340 H908 A8,8 0 0 1 916,348 V372 A8,8 0 0 1 908,380 H684 A8,8 0 0 1 676,372 V348 A8,8 0 0 1 684,340 Z" />
      <text x="690" y="358" font-size="12.5" font-weight="600" fill="#C0392B">共同点 ↓</text>
    </g>
    <g>
      <path fill="#F0F4F9" d="M944,166 H1184 A8,8 0 0 1 1192,174 V252 A8,8 0 0 1 1184,260 H944 A8,8 0 0 1 936,252 V174 A8,8 0 0 1 944,166 Z" />
      <text x="950" y="192" font-size="12.5" font-weight="600" fill="#1A3A5C">2022 乙卷 T21</text>
      <text x="950" y="212" font-size="11.5" fill="#5A6874">卫星带电粒子探测装置</text>
      <text x="950" y="230" font-size="11.5" fill="#5A6874">（航天科技）</text>
      <path fill="#F0F4F9" d="M944,270 H1184 A8,8 0 0 1 1192,278 V322 A8,8 0 0 1 1184,330 H944 A8,8 0 0 1 936,322 V278 A8,8 0 0 1 944,270 Z" />
      <text x="950" y="294" font-size="12.5" font-weight="600" fill="#1A3A5C">2022 甲卷 T14</text>
      <text x="950" y="314" font-size="11.5" fill="#5A6874">首钢滑雪大跳台（冬奥）</text>
      <text x="936" y="362" font-size="12" fill="#5A6874" transform="translate(0,-6)">情境全是真仪器/真事件——</text>
      <text x="936" y="384" font-size="12" fill="#C0392B" font-weight="600">答案能真的去用</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#1A3A5C" d="M72,412 H1208 A12,12 0 0 1 1220,424 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V424 A12,12 0 0 1 72,412 Z" />
    <text x="90" y="448" font-size="16" font-weight="700" fill="#E8EDF3">🔍 两个套路的合流：为什么压轴题越来越「情境化」？</text>
    <text x="90" y="482" font-size="14" fill="#C7D4E2">评价体系「四翼」的应用性+创新性要求题目有真实外壳。但拆开看，检流计=线圈在磁场中受力矩，</text>
    <text x="90" y="510" font-size="14" fill="#C7D4E2">质谱仪=电场加速+磁场偏转，磁控管=螺旋线运动——仪器只是模型的制服。</text>
    <text x="90" y="548" font-size="14.5" fill="#F0C98A" font-weight="600">备考心法：每见一个新仪器，问一句「它底下是哪个老模型？」——这就是「情境换皮」的本质。</text>
    <text x="90" y="588" font-size="13" fill="#8A96A3">（2025 全国卷 T22 完全非弹性碰撞实验、2025 湖南绳杆系统同属此理）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">原题出处见各题卡 · 评析引 physicalw/教育部考试院（A-/A）· 命题分析：小爱（C）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">08 / 13</text>
</svg>