<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F5F7FA" />
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">十年难度演变：从「算得深」到「想得新」</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">压轴题难度结构的三次范式转移（2016-2025）</text>

  
  <g>
    <text x="80" y="130" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#1A3A5C">计算量 vs 思维量（相对指数，示意）</text>
    <g stroke="#DDE4EC" stroke-width="1">
      <line x1="100" y1="420" x2="700" y2="420" />
      <line x1="100" y1="350" x2="700" y2="350" stroke-dasharray="4,4" />
      <line x1="100" y1="280" x2="700" y2="280" stroke-dasharray="4,4" />
      <line x1="100" y1="210" x2="700" y2="210" stroke-dasharray="4,4" />
      <line x1="100" y1="140" x2="700" y2="140" stroke-dasharray="4,4" />
    </g>
    
    <polyline points="120,200 190,190 260,205 330,215 400,235 470,250 540,265 610,275 680,285" fill="none" stroke="#1A3A5C" stroke-width="3" />
    
    <polyline points="120,300 190,290 260,275 330,255 400,235 470,210 540,185 610,160 680,140" fill="none" stroke="#C0392B" stroke-width="3" />
    
    <ellipse cx="435" cy="235" rx="50" ry="24" fill="#B8860B" opacity="0.15" />
    <text x="435" y="230" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11" fill="#B8860B" font-weight="600">≈2020 交叉点</text>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#5A6874" text-anchor="middle">
      <text x="120" y="442">2016</text><text x="190" y="442">2017</text><text x="260" y="442">2018</text>
      <text x="330" y="442">2019</text><text x="400" y="442">2020</text><text x="470" y="442">2021</text>
      <text x="540" y="442">2022</text><text x="610" y="442">2023</text><text x="680" y="442">2024-25</text>
    </g>
    <g font-family="'PingFang SC', sans-serif" font-size="12">
      <line x1="480" y1="150" x2="510" y2="168" stroke="#1A3A5C" stroke-width="2" />
      <text x="515" y="154" fill="#1A3A5C">计算量（多步代数/解方程）</text>
      <line x1="480" y1="330" x2="510" y2="312" stroke="#C0392B" stroke-width="2" />
      <text x="515" y="336" fill="#C0392B">思维量（建模/迁移/视角）</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DDE4EC" d="M752,112 H1208 A12,12 0 0 1 1220,124 V418 A12,12 0 0 1 1208,430 H752 A12,12 0 0 1 740,418 V124 A12,12 0 0 1 752,112 Z" />
    <text x="768" y="144" font-size="15" font-weight="700" fill="#1A3A5C">三个时代</text>
    <path fill="#F0F4F9" d="M776,160 H1184 A8,8 0 0 1 1192,168 V228 A8,8 0 0 1 1184,236 H776 A8,8 0 0 1 768,228 V168 A8,8 0 0 1 776,160 Z" />
    <text x="784" y="186" font-size="13.5" font-weight="600" fill="#1A3A5C">2016-2018 · 模型计算时代</text>
    <text x="784" y="210" font-size="12" fill="#5A6874">导轨双杆+碰撞+能量链，拼多步计算准确度</text>
    <path fill="#FDF6E9" d="M776,246 H1184 A8,8 0 0 1 1192,254 V314 A8,8 0 0 1 1184,322 H776 A8,8 0 0 1 768,314 V254 A8,8 0 0 1 776,246 Z" />
    <text x="784" y="272" font-size="13.5" font-weight="600" fill="#B8860B">2019-2021 · 情境化转型期</text>
    <text x="784" y="296" font-size="12" fill="#5A6874">仪器/航天入题，选择题压轴崛起，「四翼」落地</text>
    <path fill="#FDF0EE" d="M776,332 H1184 A8,8 0 0 1 1192,340 V410 A8,8 0 0 1 1184,418 H776 A8,8 0 0 1 768,410 V340 A8,8 0 0 1 776,332 Z" />
    <text x="784" y="358" font-size="13.5" font-weight="600" fill="#C0392B">2022-2025 · 思维创新时代</text>
    <text x="784" y="382" font-size="12" fill="#5A6874">复合场+方法迁移成为主角：2025 开普勒解椭圆、</text>
    <text x="784" y="404" font-size="12" fill="#5A6874">非常规有效值、板块动静反转——计算瘦身，思维加磅</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#1A3A5C" d="M72,448 H1208 A12,12 0 0 1 1220,460 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V460 A12,12 0 0 1 72,448 Z" />
    <text x="90" y="484" font-size="16" font-weight="700" fill="#F0C98A">对 2026 届考生的含义</text>
    <text x="90" y="518" font-size="14" fill="#E8EDF3">· 「刷难题」的策略权重下降，「吃透模型+练迁移」的权重上升——一道题问自己「换个情境还会吗？」</text>
    <text x="90" y="550" font-size="14" fill="#E8EDF3">· 计算基本功仍是门槛（不是得分点）：37°、√3、0.6/0.8 这些数字设计说明命题人默认你算得快</text>
    <text x="90" y="582" font-size="14" fill="#E8EDF3">· 天体章与静电章、能量与动量、圆周与椭圆——跨章节连接处就是命题富矿，复习时主动「连线」</text>
    <text x="90" y="618" font-size="14.5" fill="#F0C98A" font-weight="600">一句话：未来的压轴题不考「你练没练过」，考「你能不能现场认出新衣服里的老朋友」。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">趋势判断：小爱基于题库纵向比较（C 级分析，曲线为示意）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">11 / 13</text>
</svg>