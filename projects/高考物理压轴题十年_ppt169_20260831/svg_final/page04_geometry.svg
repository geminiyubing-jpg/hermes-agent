<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F5F7FA" />
  <rect x="0" y="0" width="1280" height="6" fill="#1A3A5C" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#1F2A33">套路① 几何为王：磁场题其实是平面几何题</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#5A6874">十年磁场压轴的底层代码：弦、切线、对称、临界相切——全在圆里</text>

  
  <path fill="#FFFFFF" stroke="#DDE4EC" d="M70,112 H790 A10,10 0 0 1 800,122 V282 A10,10 0 0 1 790,292 H70 A10,10 0 0 1 60,282 V122 A10,10 0 0 1 70,112 Z" />
  <rect x="60" y="112" width="4" height="180" fill="#1A3A5C" />
  <text x="92" y="140" font-family="'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#1A3A5C">【原题】2017 · 全国 II 卷 · 末题（十年几何经典）</text>
  <text x="92" y="170" font-family="'PingFang SC', serif" font-size="14" fill="#1F2A33">虚线所示圆形区域内存在垂直纸面的匀强磁场，P 为边界上一点。大量相同带电粒子以相同</text>
  <text x="92" y="194" font-family="'PingFang SC', serif" font-size="14" fill="#1F2A33">速率经 P 点沿不同方向射入磁场。若射入速率为 v₁，出射点分布在六分之一圆周上；</text>
  <text x="92" y="218" font-family="'PingFang SC', serif" font-size="14" fill="#1F2A33">若射入速率为 v₂，出射点分布在三分之一圆周上。不计重力及相互作用，则 v₁:v₂ =？</text>
  <text x="92" y="250" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#C0392B" font-weight="700">A. 1:2　　B. 1:3　　C. √3:3　　D. 1:√3</text>
  <text x="92" y="278" font-size="11.5" fill="#8A96A3">来源：人人文库五年汇编收录原题（B+/A-，真题为公开材料）</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DDE4EC" d="M830,112 H1210 A10,10 0 0 1 1220,122 V282 A10,10 0 0 1 1210,292 H830 A10,10 0 0 1 820,282 V122 A10,10 0 0 1 830,112 Z" />
    <text x="848" y="142" font-size="13.5" font-weight="700" fill="#1A3A5C">核心几何图（示意）</text>
    
    <circle cx="920" cy="210" r="52" fill="none" stroke="#1A3A5C" stroke-width="1.8" />
    <circle cx="920" cy="210" r="4" fill="#1A3A5C" />
    <text x="932" y="206" font-size="10.5" fill="#5A6874">O</text>
    
    <line x1="966" y1="210" x2="946" y2="255" stroke="#C0392B" stroke-width="2.2" />
    <circle cx="966" cy="210" r="3.5" fill="#C0392B" />
    <circle cx="946" cy="255" r="3.5" fill="#C0392B" />
    <text x="975" y="207" font-size="10" fill="#C0392B">P</text>
    <text x="905" y="268" font-size="10" fill="#C0392B">1/6 圆周端点</text>
    
    <line x1="966" y1="210" x2="894" y2="282" stroke="#277653" stroke-width="2.2" stroke-dasharray="5,3" />
    <circle cx="894" cy="282" r="3.5" fill="#277653" />
    <text x="845" y="278" font-size="10" fill="#277653">1/3 圆周端点</text>
    
    <text x="1010" y="186" font-family="'Times New Roman', serif" font-size="13" fill="#1F2A33">v₁: 弦 = 2r₁ = R</text>
    <text x="1010" y="210" font-family="'Times New Roman', serif" font-size="13" fill="#1F2A33">→ r₁ = R/2 ... = R·sin30°</text>
    <text x="1010" y="240" font-family="'Times New Roman', serif" font-size="13" fill="#1F2A33">v₂: 弦 = 2r₂ = √3R</text>
    <text x="1010" y="264" font-family="'Times New Roman', serif" font-size="13" fill="#1F2A33">→ r₂ = R·sin60°</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="326" font-size="15" font-weight="600" fill="#1A3A5C">解题思路链（三步拿下）</text>
    <path fill="#F0F4F9" d="M70,342 H410 A10,10 0 0 1 420,352 V436 A10,10 0 0 1 410,446 H70 A10,10 0 0 1 60,436 V352 A10,10 0 0 1 70,342 Z" />
    <text x="84" y="372" font-size="13.5" font-weight="600" fill="#1A3A5C">第一步：认出「最远出射点」</text>
    <text x="84" y="396" font-size="12.5" fill="#5A6874">同速粒子从 P 各方向入射，出射点离 P</text>
    <text x="84" y="416" font-size="12.5" fill="#5A6874">最远 = 距离恰为轨迹圆直径（2r）</text>
    <text x="440" y="398" font-size="18" fill="#8A96A3">→</text>
    <path fill="#F0F4F9" d="M474,342 H814 A10,10 0 0 1 824,352 V436 A10,10 0 0 1 814,446 H474 A10,10 0 0 1 464,436 V352 A10,10 0 0 1 474,342 Z" />
    <text x="488" y="372" font-size="13.5" font-weight="600" fill="#1A3A5C">第二步：把圆周分布翻译成弦长</text>
    <text x="488" y="396" font-size="12.5" fill="#5A6874">1/6 圆周 → 圆心角60° → 弦 = R（30°半角）</text>
    <text x="488" y="416" font-size="12.5" fill="#5A6874">1/3 圆周 → 圆心角120° → 弦 = √3R</text>
    <text x="844" y="398" font-size="18" fill="#8A96A3">→</text>
    <path fill="#FDF0EE" d="M878,342 H1210 A10,10 0 0 1 1220,352 V436 A10,10 0 0 1 1210,446 H878 A10,10 0 0 1 868,436 V352 A10,10 0 0 1 878,342 Z" />
    <text x="892" y="372" font-size="13.5" font-weight="600" fill="#C0392B">第三步：r ∝ v 一锤定音</text>
    <text x="892" y="398" font-family="'Times New Roman', serif" font-size="14.5" fill="#1F2A33">r = mv/(qB) ⇒ v₁:v₂ = r₁:r₂</text>
    <text x="892" y="424" font-family="'Times New Roman', serif" font-size="14.5" fill="#C0392B" font-weight="700">= sin30°:sin60° = 1:√3　（选C）</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#1A3A5C" d="M72,466 H1208 A12,12 0 0 1 1220,478 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V478 A12,12 0 0 1 72,466 Z" />
    <text x="90" y="500" font-size="15" font-weight="700" fill="#E8EDF3">🔍 出题人在想什么（命题密码）</text>
    <text x="90" y="532" font-size="14" fill="#C7D4E2">· 这道题一个公式都不超纲（r=mv/qB 初学者都会），杀伤力全在「出射点分布」这句话的翻译——把统计描述变成几何对象</text>
    <text x="90" y="560" font-size="14" fill="#C7D4E2">· 干扰项设计：1:2（以为弧长比=半径比）、1:3（面积思维）、√3:3（化简失误）——每个错 option 对应一种典型错误思维</text>
    <text x="90" y="588" font-size="14" fill="#E8EDF3" font-weight="600">· 这就是「几何为王」：2016 III 卷切线题、2024 湖北内外反向磁场、2025 黑吉辽蒙——十年都在这个框架里加码</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#8A96A3">原题：2017 全国 II 卷（公开真题）· 解法为通行教学解 · 命题分析为小爱归纳（C）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1A3A5C">04 / 13</text>
</svg>