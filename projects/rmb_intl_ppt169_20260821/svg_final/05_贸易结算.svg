<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#FFB300" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">支柱 ① 贸易结算：最扎实的基本盘</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">PILLAR 1 · TRADE SETTLEMENT · 货物贸易人民币结算占比演进</text>
  </g>

  
  <g id="trend">
    <text x="100" y="132" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E0E6ED">货物贸易人民币跨境结算占比（%）</text>
    <line x1="100" y1="420" x2="700" y2="420" stroke="#22304A" stroke-width="1.5" />
    <line x1="100" y1="160" x2="100" y2="420" stroke="#22304A" stroke-width="1.5" />
    <g stroke="#1A2438" stroke-dasharray="3,5">
      <line x1="100" y1="340" x2="700" y2="340" />
      <line x1="100" y1="260" x2="700" y2="260" />
      <line x1="100" y1="180" x2="700" y2="180" />
    </g>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#5A6B85">
      <text x="92" y="424" text-anchor="end">0</text>
      <text x="92" y="344" text-anchor="end">10</text>
      <text x="92" y="264" text-anchor="end">20</text>
      <text x="92" y="184" text-anchor="end">30</text>
    </g>
    
    <path d="M 130 415 L 230 300 L 330 348 L 430 316 L 530 260 L 630 180" fill="none" stroke="#E53935" stroke-width="3.5" />
    <g fill="#E53935">
      <circle cx="130" cy="415" r="4" />
      <circle cx="230" cy="300" r="4" />
      <circle cx="330" cy="348" r="4" />
      <circle cx="430" cy="316" r="4" />
      <circle cx="530" cy="260" r="4" />
      <circle cx="630" cy="180" r="5.5" fill="#FFB300" stroke="#0A0E1A" stroke-width="2" />
    </g>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13">
      <text x="130" y="400" text-anchor="middle" fill="#8FA3BF">2012</text>
      <text x="230" y="285" text-anchor="middle" fill="#8FA3BF">2015 ~25%</text>
      <text x="330" y="368" text-anchor="middle" fill="#FF5252">2017 ~13%</text>
      <text x="430" y="301" text-anchor="middle" fill="#8FA3BF">2021</text>
      <text x="530" y="245" text-anchor="middle" fill="#8FA3BF">2023</text>
      <text x="630" y="165" text-anchor="middle" fill="#FFB300" font-weight="bold">2024 ~30%</text>
    </g>
    
    <path d="M 230 300 L 330 348" fill="none" stroke="#FF5252" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="280" y="392" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#FF5252">811 汇改后回撤</text>
    <text x="480" y="200" font-family="'PingFang SC',sans-serif" font-size="12" fill="#00C853">2022 起二次加速</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#131B2E" stroke="#22304A" d="M792,120 H1208 A12,12 0 0 1 1220,132 V268 A12,12 0 0 1 1208,280 H792 A12,12 0 0 1 780,268 V132 A12,12 0 0 1 792,120 Z" />
    <rect x="780" y="120" width="440" height="4" fill="#E53935" />
    <text x="804" y="154" font-size="15" font-weight="bold" fill="#E53935">驱动一：大宗商品本币计价</text>
    <text x="804" y="182" font-size="13.5" fill="#E0E6ED">· 俄油人民币结算已成主流通道之一</text>
    <text x="804" y="204" font-size="13.5" fill="#E0E6ED">· 中东：沙特/阿联酋 石油人民币试点推进</text>
    <text x="804" y="226" font-size="13.5" fill="#E0E6ED">· 上海原油期货（INE）人民币计价交割</text>
    <text x="804" y="252" font-size="13" fill="#8FA3BF">大宗=贸易结算的"锚场景"：单笔金额大、频次高</text>

    <path fill="#131B2E" stroke="#22304A" d="M792,300 H1208 A12,12 0 0 1 1220,312 V448 A12,12 0 0 1 1208,460 H792 A12,12 0 0 1 780,448 V312 A12,12 0 0 1 792,300 Z" />
    <rect x="780" y="300" width="440" height="4" fill="#FFB300" />
    <text x="804" y="334" font-size="15" font-weight="bold" fill="#FFB300">驱动二：一带一路与东盟</text>
    <text x="804" y="362" font-size="13.5" fill="#E0E6ED">· 中国前三大贸易伙伴中东盟居首，</text>
    <text x="804" y="384" font-size="13.5" fill="#E0E6ED">  本币结算协议密集落地</text>
    <text x="804" y="406" font-size="13.5" fill="#E0E6ED">· 与俄/巴/蒙/老/柬 等双边本币结算安排</text>
    <text x="804" y="432" font-size="13" fill="#8FA3BF">地缘敏感区域率先形成"人民币结算圈"</text>

    <path fill="#131B2E" stroke="#22304A" d="M792,480 H1208 A12,12 0 0 1 1220,492 V628 A12,12 0 0 1 1208,640 H792 A12,12 0 0 1 780,628 V492 A12,12 0 0 1 792,480 Z" />
    <rect x="780" y="480" width="440" height="4" fill="#00D4FF" />
    <text x="804" y="514" font-size="15" font-weight="bold" fill="#00D4FF">边界：结算 ≠ 沉淀</text>
    <text x="804" y="542" font-size="13.5" fill="#E0E6ED">· 出口收人民币 → 企业多即刻换回美元</text>
    <text x="804" y="564" font-size="13.5" fill="#E0E6ED">· 闭环未成：缺少"留在境外投资增值"出口</text>
    <text x="804" y="586" font-size="13.5" fill="#E0E6ED">· 修正 2015 教训：汇率预期决定结算意愿</text>
    <text x="804" y="612" font-size="13" fill="#8FA3BF">这指向支柱②：没有投资功能，结算份额是租来的</text>
  </g>

  
  <path fill="#131B2E" stroke="#22304A" d="M112,450 H688 A12,12 0 0 1 700,462 V628 A12,12 0 0 1 688,640 H112 A12,12 0 0 1 100,628 V462 A12,12 0 0 1 112,450 Z" />
  <text x="124" y="482" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#00D4FF">规模感：以 2024 年计</text>
  <g font-family="'SF Mono','Menlo',monospace" font-size="14">
    <text x="124" y="514" fill="#E0E6ED">· 货物贸易人民币结算额 ≈ 17 万亿元</text>
    <text x="124" y="544" fill="#E0E6ED">· 全口径跨境人民币收付 ≈ 40 万亿元级</text>
    <text x="124" y="574" fill="#E0E6ED">· 全球贸易人民币计价份额 &gt;40%？——</text>
    <text x="124" y="600" fill="#5A6B85" font-size="13" font-family="'PingFang SC',sans-serif">（注：本币结算占比按中国外贸口径，非全球）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：PBOC《人民币国际化报告 2024》· 历年占比为报告披露口径的近似值 · 2025-2026 年度数据尚未发布</text>
</svg>