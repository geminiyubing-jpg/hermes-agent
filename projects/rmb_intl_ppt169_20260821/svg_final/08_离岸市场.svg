<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#FFB300" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">支柱 ④ 离岸市场：香港枢纽与清算行网络</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">PILLAR 4 · OFFSHORE MARKET · CNH 生态</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="134" font-size="16" font-weight="bold" fill="#E0E6ED">香港：全球离岸人民币枢纽</text>

    <path fill="#131B2E" stroke="#22304A" d="M92,152 H608 A12,12 0 0 1 620,164 V250 A12,12 0 0 1 608,262 H92 A12,12 0 0 1 80,250 V164 A12,12 0 0 1 92,152 Z" />
    <g font-family="'SF Mono','Menlo',monospace">
      <text x="104" y="186" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">CNH 存款规模（2026 年中）</text>
      <text x="104" y="224" font-size="30" font-weight="bold" fill="#E53935">~9000 亿+</text>
      <text x="320" y="216" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">历史峰值区</text>
      <text x="320" y="240" font-size="12.5" fill="#5A6B85" font-family="'PingFang SC',sans-serif">2015 低谷 ~7000 亿 → 十年爬坡</text>
    </g>

    <path fill="#131B2E" stroke="#22304A" d="M92,282 H608 A12,12 0 0 1 620,294 V380 A12,12 0 0 1 608,392 H92 A12,12 0 0 1 80,380 V294 A12,12 0 0 1 92,282 Z" />
    <g font-family="'SF Mono','Menlo',monospace">
      <text x="104" y="316" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">人民币 RTGS 日均清算额</text>
      <text x="104" y="354" font-size="30" font-weight="bold" fill="#00D4FF">~2.2 万亿/日</text>
      <text x="380" y="346" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">全球最大</text>
      <text x="380" y="370" font-size="12.5" fill="#5A6B85" font-family="'PingFang SC',sans-serif">香港处理全球 ~75% 离岸人民币支付</text>
    </g>

    <path fill="#131B2E" stroke="#22304A" d="M92,412 H608 A12,12 0 0 1 620,424 V510 A12,12 0 0 1 608,522 H92 A12,12 0 0 1 80,510 V424 A12,12 0 0 1 92,412 Z" />
    <g font-family="'SF Mono','Menlo',monospace">
      <text x="104" y="446" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">点心债 + 熊猫债年发行</text>
      <text x="104" y="484" font-size="30" font-weight="bold" fill="#FFB300">双万辆级</text>
      <text x="330" y="476" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">2024-2025 创记录</text>
      <text x="330" y="500" font-size="12.5" fill="#5A6B85" font-family="'PingFang SC',sans-serif">熊猫债：境外机构境内发人民币债</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="680" y="134" font-size="16" font-weight="bold" fill="#E0E6ED">人民币清算行网络（全球 30+ 家）</text>
    <path fill="#131B2E" stroke="#22304A" d="M692,152 H1208 A12,12 0 0 1 1220,164 V510 A12,12 0 0 1 1208,522 H692 A12,12 0 0 1 680,510 V164 A12,12 0 0 1 692,152 Z" />
    <g font-size="13.5">
      <text x="704" y="186" fill="#FFB300" font-weight="bold">亚洲（12+）</text>
      <text x="824" y="186" fill="#8FA3BF">香港·澳门·台北·新加坡·东京·首尔</text>
      <text x="1044" y="186" fill="#5A6B85">曼谷·吉隆坡·马尼拉…</text>

      <text x="704" y="222" fill="#00D4FF" font-weight="bold">欧洲（8+）</text>
      <text x="824" y="222" fill="#8FA3BF">伦敦·法兰克福·巴黎·卢森堡·马德里</text>
      <text x="1044" y="222" fill="#5A6B85">布达佩斯·苏黎世…</text>

      <text x="704" y="258" fill="#00C853" font-weight="bold">中东（3）</text>
      <text x="824" y="258" fill="#8FA3BF">多哈·迪拜·利雅得（2023 新设）</text>

      <text x="704" y="294" fill="#E53935" font-weight="bold">美洲（4）</text>
      <text x="824" y="294" fill="#8FA3BF">多伦多·墨西哥城·圣地亚哥·布宜诺斯</text>
      <text x="1044" y="294" fill="#5A6B85">艾利斯</text>

      <text x="704" y="330" fill="#8B5CF6" font-weight="bold">非洲/大洋洲（4）</text>
      <text x="824" y="330" fill="#8FA3BF">约翰内斯堡·卡萨布兰卡·悉尼·</text>
      <text x="1044" y="330" fill="#5A6B85">奥克兰</text>
    </g>
    <line x1="704" y1="356" x2="1196" y2="356" stroke="#22304A" />
    <text x="704" y="386" font-size="13.5" fill="#E0E6ED">功能：境外人民币"存汇贷"的本地锚点——</text>
    <text x="704" y="410" font-size="13.5" fill="#E0E6ED">所在国银行体系经清算行接入 CIPS/大额系统，</text>
    <text x="704" y="434" font-size="13.5" fill="#E0E6ED">形成"清算行 + CIPS 直参"双轨覆盖</text>
    <text x="704" y="470" font-size="13" fill="#8FA3BF">趋势：2024-2026 新增集中在东盟与中东——</text>
    <text x="704" y="492" font-size="13" fill="#8FA3BF">与贸易结算扩展的地理节奏完全同步</text>
  </g>

  
  <path fill="#131B2E" stroke="#FFB300" stroke-opacity="0.5" d="M92,548 H1208 A12,12 0 0 1 1220,560 V648 A12,12 0 0 1 1208,660 H92 A12,12 0 0 1 80,648 V560 A12,12 0 0 1 92,548 Z" />
  <text x="104" y="580" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#FFB300">枢纽的护城河与天花板</text>
  <text x="104" y="610" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E0E6ED">护城河：香港同时拥有最大的 CNH 池子、最深的衍生品市场（CNH 远期/期权/期货）、与在岸的互联互通管道（三通）。</text>
  <text x="104" y="636" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E0E6ED">天花板：CNH 池子总量只有的在岸存款的 ~3%——离岸深度决定"想配人民币配不够"的硬约束，做大池子=做大回流管道。</text>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：HKMA 月度统计 · PBOC 清算行授权名单 · 量为公开披露口径近似值</text>
</svg>