<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#FFB300" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">结论：管道先于水流，水流先于储备</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">CONCLUSION · 一张图收束六大支柱</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    
    <path fill="#131B2E" stroke="#00D4FF" stroke-opacity="0.7" d="M132,130 H528 A12,12 0 0 1 540,142 V268 A12,12 0 0 1 528,280 H132 A12,12 0 0 1 120,268 V142 A12,12 0 0 1 132,130 Z" />
    <text x="144" y="164" font-size="16" font-weight="bold" fill="#00D4FF">管道层（已成的）</text>
    <text x="144" y="194" font-size="13.5" fill="#E0E6ED">CIPS（175 万亿/年、单日万亿）</text>
    <text x="144" y="216" font-size="13.5" fill="#E0E6ED">mBridge（$555 亿）+ 数币达（26 家直连）</text>
    <text x="144" y="238" font-size="13.5" fill="#E0E6ED">清算行 30+ 家 + 互换 4.1 万亿</text>
    <text x="144" y="264" font-size="12.5" fill="#00C853">进度：超前于需求——"管道已铺好等水来"</text>

    
    <path fill="#131B2E" stroke="#FFB300" stroke-opacity="0.7" d="M132,306 H528 A12,12 0 0 1 540,318 V444 A12,12 0 0 1 528,456 H132 A12,12 0 0 1 120,444 V318 A12,12 0 0 1 132,306 Z" />
    <text x="144" y="340" font-size="16" font-weight="bold" fill="#FFB300">水流层（在涨的）</text>
    <text x="144" y="370" font-size="13.5" fill="#E0E6ED">贸易结算 ~30% 本币占比</text>
    <text x="144" y="392" font-size="13.5" fill="#E0E6ED">SWIFT 支付 3.1%（第五）</text>
    <text x="144" y="414" font-size="13.5" fill="#E0E6ED">离岸池子 ~9000 亿（峰值区）</text>
    <text x="144" y="440" font-size="12.5" fill="#8FA3BF">约束：顺周期——汇率预期决定快慢</text>

    
    <path fill="#131B2E" stroke="#E53935" stroke-opacity="0.7" d="M132,482 H528 A12,12 0 0 1 540,494 V620 A12,12 0 0 1 528,632 H132 A12,12 0 0 1 120,620 V494 A12,12 0 0 1 132,482 Z" />
    <text x="144" y="516" font-size="16" font-weight="bold" fill="#E53935">储备层（最慢的）</text>
    <text x="144" y="546" font-size="13.5" fill="#E0E6ED">COFER 1.99%（2026Q1 企稳）</text>
    <text x="144" y="568" font-size="13.5" fill="#E0E6ED">峰值 2.83%（2022Q1）尚未收复</text>
    <text x="144" y="590" font-size="13.5" fill="#E0E6ED">配置者：制裁敏感型央行为主</text>
    <text x="144" y="616" font-size="12.5" fill="#8FA3BF">约束：信心 + 可兑换性 + 市场深度</text>

    
    <path d="M 330 280 L 330 306" stroke="#5A6B85" stroke-width="2" marker-end="url(#arr)" />
    <path d="M 330 456 L 330 482" stroke="#5A6B85" stroke-width="2" marker-end="url(#arr)" />
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M 0 0 L 8 4 L 0 8 Z" fill="#5A6B85" />
      </marker>
    </defs>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#131B2E" stroke="#22304A" d="M612,130 H1208 A12,12 0 0 1 1220,142 V358 A12,12 0 0 1 1208,370 H612 A12,12 0 0 1 600,358 V142 A12,12 0 0 1 612,130 Z" />
    <text x="624" y="164" font-size="16" font-weight="bold" fill="#E0E6ED">三个"不要"</text>
    <text x="624" y="196" font-size="14" fill="#E0E6ED">1. 不要用 SWIFT 份额线性外推国际化速度</text>
    <text x="644" y="218" font-size="13" fill="#8FA3BF">（口径偏差 + 顺周期，2015/2022 两次教训）</text>
    <text x="624" y="248" font-size="14" fill="#E0E6ED">2. 不要把 mBridge 理解为"去美元化武器"</text>
    <text x="644" y="270" font-size="13" fill="#8FA3BF">（它是保险通道，主流流量仍在旧体系里）</text>
    <text x="624" y="300" font-size="14" fill="#E0E6ED">3. 不要忽视利差这个最大单一变量</text>
    <text x="644" y="322" font-size="13" fill="#8FA3BF">（中美 10Y 转正之日，才是储备份额趋势性拐点）</text>
    <text x="624" y="352" font-size="13" fill="#5A6B85">——对分享对象最可操作的三个提醒</text>

    <path fill="#0F2A1A" stroke="#00C853" stroke-opacity="0.6" d="M612,394 H1208 A12,12 0 0 1 1220,406 V620 A12,12 0 0 1 1208,632 H612 A12,12 0 0 1 600,620 V406 A12,12 0 0 1 612,394 Z" />
    <text x="624" y="428" font-size="16" font-weight="bold" fill="#00C853">给不同角色的一句话</text>
    <g font-size="13.5">
      <text x="624" y="460" fill="#FFB300" font-weight="bold">研究者：</text>
      <text x="712" y="460" fill="#E0E6ED">盯 COFER 季度值与利差，其余皆噪音</text>
      <text x="624" y="492" fill="#00D4FF" font-weight="bold">银行从业者：</text>
      <text x="736" y="492" fill="#E0E6ED">管道即业务——清算/托管/数币直参的卡位窗口</text>
      <text x="624" y="524" fill="#E53935" font-weight="bold">内审：</text>
      <text x="692" y="524" fill="#E0E6ED">制裁穿透与清算集中度，是人民币业务的两颗雷</text>
      <text x="624" y="556" fill="#8B5CF6" font-weight="bold">政策观察者：</text>
      <text x="736" y="556" fill="#E0E6ED">"稳慎"二字 = 基准情景就是稳步推进（50%）</text>
    </g>
    <text x="624" y="600" font-size="13" fill="#8FA3BF">国际化的终点不是取代美元，而是成为多极体系中</text>
    <text x="624" y="620" font-size="13" fill="#8FA3BF">不可绕过的一极——这个定位本身已是战略成功。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">全篇数据截至 2026-08-21 · 详见尾页数据源声明</text>
</svg>