<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#FFB300"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">支柱 ② 金融投资：资本项目的三道门</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">PILLAR 2 · FINANCIAL INVESTMENT · 债券通/互换通/CIBM 直投通道</text>
  </g>

  <!-- three doors diagram -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="134" font-size="16" font-weight="bold" fill="#E0E6ED">境外主体投资人民币资产的三道门</text>

    <!-- door 1 -->
    <rect x="80" y="152" width="360" height="200" rx="12" fill="#131B2E" stroke="#00C853" stroke-opacity="0.6"/>
    <rect x="80" y="152" width="360" height="4" fill="#00C853"/>
    <text x="104" y="186" font-size="15" font-weight="bold" fill="#00C853">门 ① CIBM 直投（2016）</text>
    <text x="104" y="214" font-size="13.5" fill="#E0E6ED">央行类机构 + 商业银行直接入市的</text>
    <text x="104" y="236" font-size="13.5" fill="#E0E6ED">备案制通道，面向长线配置资金</text>
    <text x="104" y="268" font-size="13" fill="#8FA3BF">现状：全球 110+ 央行与主权基金</text>
    <text x="104" y="288" font-size="13" fill="#8FA3BF">已获额度入市，是储备配置主通道</text>
    <text x="104" y="324" font-size="13.5" fill="#FFB300">痛点：额度与汇出限制仍在</text>

    <!-- door 2 -->
    <rect x="460" y="152" width="360" height="200" rx="12" fill="#131B2E" stroke="#00D4FF" stroke-opacity="0.6"/>
    <rect x="460" y="152" width="360" height="4" fill="#00D4FF"/>
    <text x="484" y="186" font-size="15" font-weight="bold" fill="#00D4FF">门 ② 债券通（2017）北向</text>
    <text x="484" y="214" font-size="13.5" fill="#E0E6ED">通过香港多级托管投资银行间债市，</text>
    <text x="484" y="236" font-size="13.5" fill="#E0E6ED">免回购、免预缴税，境外最主流通道</text>
    <text x="484" y="268" font-size="13" fill="#8FA3BF">现状：境外持债 ~4 万亿元量级，</text>
    <text x="484" y="288" font-size="13" fill="#8FA3BF">国债持仓占比稳定但增速放缓</text>
    <text x="484" y="324" font-size="13.5" fill="#FFB300">痛点：对冲工具深度不足（支柱⑤的根）</text>

    <!-- door 3 -->
    <rect x="840" y="152" width="360" height="200" rx="12" fill="#131B2E" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <rect x="840" y="152" width="360" height="4" fill="#8B5CF6"/>
    <text x="864" y="186" font-size="15" font-weight="bold" fill="#8B5CF6">门 ③ 互换通（2023）</text>
    <text x="864" y="214" font-size="13.5" fill="#E0E6ED">境外机构经香港做利率互换对冲，</text>
    <text x="864" y="236" font-size="13.5" fill="#E0E6ED">2024 扩容至利率互换+远期</text>
    <text x="864" y="268" font-size="13" fill="#8FA3BF">现状：名义本金快速上量，</text>
    <text x="864" y="288" font-size="13" fill="#8FA3BF">但对冲成本仍高于美元/欧元市场</text>
    <text x="864" y="324" font-size="13.5" fill="#FFB300">痛点：衍生品流动性是最后一块短板</text>
  </g>

  <!-- paradox panel -->
  <rect x="80" y="386" width="700" height="250" rx="12" fill="#131B2E" stroke="#22304A"/>
  <text x="104" y="420" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#FFB300">核心矛盾：收益高、配得浅</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#E0E6ED">
    <text x="104" y="452">· 10Y 国债收益率 ~1.8%（2026-08）低于美债 4.7%，</text>
    <text x="104" y="476">  纯票息吸引力弱——与 2022 前的利差优势彻底反转</text>
    <text x="104" y="508">· 境外持债占银行间债市比重仅 ~3%，远低于</text>
    <text x="104" y="532">  美债外资持有比例（~30%）</text>
    <text x="104" y="564">· 结论：投资功能的短板不在"门"的数量，</text>
    <text x="104" y="588">  而在回报率周期 + 对冲成本 + 制度信任三重叠加</text>
  </g>

  <!-- stock connect mini -->
  <rect x="812" y="386" width="388" height="250" rx="12" fill="#131B2E" stroke="#22304A"/>
  <text x="836" y="420" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#00D4FF">股票通道：北向的降温</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#E0E6ED">
    <text x="836" y="452">· 沪深港通 2014 开通，曾单年净流入</text>
    <text x="836" y="474">  4000 亿+（2021）</text>
    <text x="836" y="506">· 2024 起改为季度披露、2025-2026</text>
    <text x="836" y="528">  净流入节奏显著放缓</text>
    <text x="836" y="560" font-size="13" fill="#8FA3BF">权益通道的政策弹性大于债券通道，</text>
    <text x="836" y="580" font-size="13" fill="#8FA3BF">是"可控开放"的调节阀</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：PBOC · CFETS · HKMA · 上清所/中债登境外持债统计（量级为公开披露近似值）</text>
</svg>
