<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#E53935"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">CONTENTS · 四部分十五章</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Part 1 -->
    <text x="80" y="140" font-size="15" font-weight="bold" fill="#00D4FF">Ⅰ · 格局与现状</text>
    <rect x="80" y="154" width="540" height="2" fill="#22304A"/>
    <g font-size="15" fill="#E0E6ED">
      <text x="80" y="186"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">03</tspan>  执行摘要：三高一低 + 三大判断</text>
      <text x="80" y="218"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">04</tspan>  全球格局：美元 57% 的裂缝与分散化</text>
    </g>

    <!-- Part 2 -->
    <text x="80" y="274" font-size="15" font-weight="bold" fill="#FFB300">Ⅱ · 六大支柱拆解</text>
    <rect x="80" y="288" width="540" height="2" fill="#22304A"/>
    <g font-size="15" fill="#E0E6ED">
      <text x="80" y="320"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">05</tspan>  贸易结算：基本盘与石油人民币</text>
      <text x="80" y="352"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">06</tspan>  金融投资：资本项目的三道门</text>
      <text x="80" y="384"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">07</tspan>  储备货币：1.99% 新高的含金量</text>
      <text x="80" y="416"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">08</tspan>  离岸市场：香港枢纽与清算行网络</text>
      <text x="80" y="448"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">09</tspan>  基础设施：CIPS vs SWIFT</text>
      <text x="80" y="480"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">10</tspan>  政策协作：4.1 万亿互换网络</text>
    </g>

    <!-- Part 3 -->
    <text x="680" y="140" font-size="15" font-weight="bold" fill="#E53935">Ⅲ · 数字新赛道</text>
    <rect x="680" y="154" width="540" height="2" fill="#22304A"/>
    <g font-size="15" fill="#E0E6ED">
      <text x="680" y="186"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">11</tspan>  e-CNY 2.0：mBridge 与数币达</text>
    </g>

    <!-- Part 4 -->
    <text x="680" y="274" font-size="15" font-weight="bold" fill="#00C853">Ⅳ · 趋势与含义</text>
    <rect x="680" y="288" width="540" height="2" fill="#22304A"/>
    <g font-size="15" fill="#E0E6ED">
      <text x="680" y="320"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">12</tspan>  趋势推演：三情景与观察哨</text>
      <text x="680" y="352"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">13</tspan>  对银行的含义：内审视角</text>
      <text x="680" y="384"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">14</tspan>  结论：管道先于水流</text>
      <text x="680" y="416"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">15</tspan>  尾页</text>
    </g>
  </g>

  <!-- bottom narrative -->
  <rect x="80" y="500" width="1120" height="140" rx="12" fill="#131B2E" stroke="#22304A"/>
  <text x="110" y="538" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#FFB300">阅读主线</text>
  <text x="110" y="568" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">先看全球货币格局的裂缝在哪里（Ⅰ），再逐一拆解人民币国际化的六大支柱各自的真实进度（Ⅱ），</text>
  <text x="110" y="594" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">然后评估数字人民币这条新赛道的战略权重（Ⅲ），最后落到趋势推演和对银行从业者（内审）的操作含义（Ⅳ）。</text>
  <text x="110" y="624" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8FA3BF">数据源：IMF COFER · SWIFT · 中国人民银行 / CIPS · HKMA · Atlantic Council · WGC，采集时点 2026-08-21。</text>
</svg>
