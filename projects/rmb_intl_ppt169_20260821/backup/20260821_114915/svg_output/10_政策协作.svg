<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00C853"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">支柱 ⑥ 政策协作：4.1 万亿互换网络</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">PILLAR 6 · POLICY COOPERATION · 央行互换 + 动用余额的秘密</text>
  </g>

  <!-- Left: network overview -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="80" y="120" width="540" height="200" rx="12" fill="#131B2E" stroke="#22304A"/>
    <g font-family="'SF Mono','Menlo',monospace">
      <text x="104" y="154" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">双边本币互换网络（截至 2026）</text>
      <text x="104" y="200" font-size="34" font-weight="bold" fill="#00C853">32 国/地区</text>
      <text x="330" y="196" font-size="22" font-weight="bold" fill="#FFB300">4.1 万亿元</text>
      <text x="104" y="238" font-size="13.5" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">累计签约 42 家 · 有效 32 份</text>
      <text x="104" y="262" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">2026 年续签：加拿大 2000 亿 · 埃及 300 亿 · 蒙古 150 亿</text>
      <text x="104" y="286" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">老挝 60 亿 · 塞尔维亚 50 亿 —— 新兴市场为主、G7 仅加拿大</text>
    </g>
  </g>

  <!-- Left bottom: meaning -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="80" y="340" width="540" height="300" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="104" y="374" font-size="15" font-weight="bold" fill="#00D4FF">互换网络的真正作用</text>
    <text x="104" y="404" font-size="13.5" fill="#E0E6ED">1. 危机流动性阀：动用互换 = 央行主动"借人民币"</text>
    <text x="124" y="426" font-size="13" fill="#8FA3BF">（阿根廷/斯里兰卡/巴基斯坦危机期均用过）</text>
    <text x="104" y="456" font-size="13.5" fill="#E0E6ED">2. 贸易结算的信心保障：对方央行知道随时能</text>
    <text x="124" y="478" font-size="13.5" fill="#E0E6ED">拿到人民币，银行才敢报价做市</text>
    <text x="104" y="508" font-size="13.5" fill="#E0E6ED">3. 人民币版"美联储互换线"的雏形——</text>
    <text x="124" y="530" font-size="13" fill="#8FA3BF">但美联储 5 家常设 vs 我们 32 家广而浅</text>
    <text x="104" y="566" font-size="13.5" fill="#FFB300">观察点：动用余额是"压力表"——</text>
    <text x="124" y="588" font-size="13" fill="#8FA3BF">平时几十亿趴着，危机时跳升（右图）</text>
    <text x="124" y="612" font-size="13" fill="#8FA3BF">2026Q1 跳到 1116 亿 = 中东冲突后的真实需求</text>
  </g>

  <!-- Right: utilization chart -->
  <g id="utilization">
    <text x="700" y="134" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E0E6ED">境外央行动用互换余额（亿元）</text>
    <line x1="720" y1="560" x2="1220" y2="560" stroke="#22304A" stroke-width="1.5"/>
    <line x1="720" y1="170" x2="720" y2="560" stroke="#22304A" stroke-width="1.5"/>
    <g stroke="#1A2438" stroke-dasharray="3,5">
      <line x1="720" y1="465" x2="1220" y2="465"/>
      <line x1="720" y1="370" x2="1220" y2="370"/>
      <line x1="720" y1="275" x2="1220" y2="275"/>
      <line x1="720" y1="180" x2="1220" y2="180"/>
    </g>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#5A6B85">
      <text x="712" y="564" text-anchor="end">0</text>
      <text x="712" y="469" text-anchor="end">400</text>
      <text x="712" y="374" text-anchor="end">800</text>
      <text x="712" y="279" text-anchor="end">1200</text>
    </g>
    <!-- data: 2022Q3 ~540 (peak?), 2023 ~400, 2024Q1 ~1000, 2024Q3 916, 2025Q3 793, 2026Q1 1116 (2y high, record 1171) -->
    <!-- y(v) = 560 - v*0.2375: 540→432, 400→465, 1000→322, 916→342, 793→372, 1116→295, 1171→282 -->
    <path d="M 745 432 L 830 465 L 915 322 L 1000 342 L 1085 372 L 1170 295"
          fill="none" stroke="#00D4FF" stroke-width="3.5"/>
    <g fill="#00D4FF">
      <circle cx="745" cy="432" r="4"/>
      <circle cx="830" cy="465" r="4"/>
      <circle cx="915" cy="322" r="4"/>
      <circle cx="1000" cy="342" r="4"/>
      <circle cx="1085" cy="372" r="4"/>
      <circle cx="1170" cy="295" r="5.5" fill="#FFB300" stroke="#0A0E1A" stroke-width="2"/>
    </g>
    <!-- record dashed line at 1171 -->
    <line x1="720" y1="282" x2="1220" y2="282" stroke="#FF5252" stroke-dasharray="5,5" stroke-width="1.5"/>
    <text x="1214" y="274" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="12" fill="#FF5252">历史峰值 1171（2022）</text>
    <g font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#8FA3BF" text-anchor="middle">
      <text x="745" y="584">2022Q3</text><text x="830" y="584">2023Q3</text><text x="915" y="584">2024Q1</text>
      <text x="1000" y="584">2024Q3</text><text x="1085" y="584">2025Q3</text><text x="1170" y="584">2026Q1</text>
    </g>
    <text x="1170" y="320" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="bold" fill="#FFB300">1116</text>
    <text x="970" y="620" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8FA3BF">2026Q1 单季新增动用 174 亿，三年最大增幅——中东冲突后的流动性需求</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：PBOC 货币政策执行报告（各季度）· 21 经济网 · 互换规模为协议上限，非实际动用</text>
</svg>
