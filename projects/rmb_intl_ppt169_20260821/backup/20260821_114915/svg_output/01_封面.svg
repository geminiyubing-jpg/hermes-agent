<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" data-pptx-pattern="lgGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#0A0E1A"/>
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E53935" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- background CNY curve deco -->
  <g>
    <path d="M -20 640 L 100 620 L 200 640 L 320 590 L 430 610 L 540 560 L 660 580 L 780 520 L 900 545 L 1020 490 L 1140 515 L 1300 460"
