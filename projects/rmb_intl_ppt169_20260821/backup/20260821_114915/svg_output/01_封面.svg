    <path d="M -20 680 L 100 668 L 200 678 L 320 650 L 430 658 L 540 630 L 660 638 L 780 600 L 900 612 L 1020 578 L 1140 588 L 1300 560"
          fill="none" stroke="#FFB300" stroke-width="2" stroke-opacity="0.3"/>
  </g>
  <rect x="0" y="0" width="1280" height="540" fill="url(#grid)"/>

  <!-- ticker strip top -->
  <rect x="0" y="0" width="1280" height="46" fill="#101626" opacity="0.92"/>
  <line x1="0" y1="46" x2="1280" y2="46" stroke="#22304A" stroke-width="1"/>
  <g font-family="'SF Mono','Menlo',monospace" font-size="15">
    <text x="60" y="29" fill="#8FA3BF">COFER储备</text><text x="160" y="29" fill="#E53935">1.99%</text>
    <text x="225" y="29" fill="#8FA3BF">SWIFT支付</text><text x="325" y="29" fill="#00D4FF">3.1%</text>
    <text x="385" y="29" fill="#8FA3BF">贸易结算</text><text x="465" y="29" fill="#00C853">~30%</text>
    <text x="535" y="29" fill="#8FA3BF">互换网络</text><text x="620" y="29" fill="#FFB300">4.1万亿</text>
    <text x="700" y="29" fill="#8FA3BF">CIPS</text><text x="750" y="29" fill="#00D4FF">单日破万亿</text>
    <text x="870" y="29" fill="#8FA3BF">mBridge</text><text x="940" y="29" fill="#FFB300">$555亿</text>
    <text x="1020" y="29" fill="#5A6B85" font-size="12">DATA @ 2026-08</text>
  </g>

  <!-- main title -->
  <text x="90" y="240" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#8FA3BF" letter-spacing="6">RMB INTERNATIONALIZATION · 2026</text>
  <text x="86" y="310" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="bold" fill="#E0E6ED">人民币国际化</text>
  <text x="86" y="380" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="bold" fill="url(#titleGlow)">战略分析</text>

  <rect x="90" y="415" width="4" height="56" fill="#FFB300"/>
  <text x="112" y="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#E0E6ED">"三高一低"的不对称国际化</text>
  <text x="112" y="468" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8FA3BF">结算高 · 数字通道高 · 政策协同高 —— 储备低</text>

  <!-- data source badges -->
  <g font-family="'SF Mono','Menlo',monospace" font-size="13">
