    <text x="101" y="658" fill="#8FA3BF">IMF</text>
    <rect x="162" y="640" width="76" height="26" rx="4" fill="none" stroke="#22304A"/>
    <text x="172" y="658" fill="#8FA3BF">SWIFT</text>
    <rect x="246" y="640" width="88" height="26" rx="4" fill="none" stroke="#22304A"/>
    <text x="256" y="658" fill="#8FA3BF">PBOC/CIPS</text>
  </g>
  <text x="348" y="658" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5A6B85">官方实盘数据 · 采集于 2026-08-21</text>

  <!-- corner deco -->
  <path d="M 1280 720 L 1220 720 L 1280 660 Z" fill="#E53935" opacity="0.18"/>
  <path d="M 1280 720 L 1245 720 L 1280 685 Z" fill="#E53935" opacity="0.4"/>
