<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#E53935"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">支柱 ③ 储备货币：1.99% 新高的含金量</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">PILLAR 3 · RESERVE CURRENCY · COFER 人民币份额季度序列</text>
  </g>

  <!-- COFER CNY trend -->
  <g id="cofer-cny">
    <line x1="120" y1="500" x2="1000" y2="500" stroke="#22304A" stroke-width="1.5"/>
    <line x1="120" y1="150" x2="120" y2="500" stroke="#22304A" stroke-width="1.5"/>
    <g stroke="#1A2438" stroke-dasharray="3,5">
      <line x1="120" y1="440" x2="1000" y2="440"/>
      <line x1="120" y1="380" x2="1000" y2="380"/>
      <line x1="120" y1="320" x2="1000" y2="320"/>
      <line x1="120" y1="260" x2="1000" y2="260"/>
      <line x1="120" y1="200" x2="1000" y2="200"/>
    </g>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#5A6B85">
      <text x="112" y="504" text-anchor="end">1.0</text>
      <text x="112" y="444" text-anchor="end">1.2</text>
      <text x="112" y="384" text-anchor="end">1.4</text>
      <text x="112" y="324" text-anchor="end">1.6</text>
      <text x="112" y="264" text-anchor="end">1.8</text>
      <text x="112" y="204" text-anchor="end">2.0</text>
    </g>
    <!-- data: 2016Q4 1.08, 2018 1.1-1.2, 2020 1.9(peak1), 2021 2.8(peak2!), 2022 2.7→2.3, 2023 2.3-2.7, 2024 2.2-2.3, 2025 ~2.0, 2026Q1 1.99 -->
    <!-- Actually documented: 2022Q1 peak 2.83%, then declined to ~2.1-2.2 in 2024, 2026Q1 1.99 "new high"? Correction: 1.99 is NOT a record — 2.83% in 2022 was the record. Fix narrative: 1.99 is a REBOUND/ stabilization after decline. Adjust chart to show this honestly. -->
    <!-- y(v) = 500 - (v-1.0)/0.2*60 : 1.08→476, 1.4→380, 2.0→200, 2.83→-49? No: 2.83 → 500-(1.83*300)= -49. Scale wrong. Use y(v)=560-(v)*200 → 1.08→344, 2.83→-6 still off. Use domain 1.0-3.0: y(v) = 500 - (v-1.0)*175: 1.08→486, 2.0→328, 2.83→183 -->
    <path d="M 150 486 L 240 470 L 330 440 L 400 210 L 470 195 L 540 225 L 610 260 L 680 245 L 750 270 L 820 300 L 890 330 L 960 328"
          fill="none" stroke="#E53935" stroke-width="3.5"/>
    <g fill="#E53935">
      <circle cx="150" cy="486" r="4"/>
      <circle cx="400" cy="210" r="5"/>
      <circle cx="470" cy="195" r="5.5" fill="#FFB300" stroke="#0A0E1A" stroke-width="2"/>
      <circle cx="610" cy="260" r="4"/>
      <circle cx="820" cy="300" r="4"/>
      <circle cx="960" cy="328" r="5.5" fill="#00D4FF" stroke="#0A0E1A" stroke-width="2"/>
    </g>
    <g font-family="'PingFang SC',sans-serif" font-size="12.5">
      <text x="150" y="510" text-anchor="middle" fill="#5A6B85">2016Q4</text>
      <text x="150" y="526" text-anchor="middle" fill="#5A6B85" font-family="'SF Mono',monospace">1.08</text>
      <text x="400" y="188" text-anchor="middle" fill="#8FA3BF">2020Q4</text>
      <text x="400" y="174" text-anchor="middle" fill="#8FA3BF" font-family="'SF Mono',monospace">1.94</text>
      <text x="470" y="170" text-anchor="middle" fill="#FFB300" font-weight="bold">历史峰值 2022Q1</text>
      <text x="470" y="154" text-anchor="middle" fill="#FFB300" font-weight="bold" font-family="'SF Mono',monospace">2.83%</text>
      <text x="750" y="248" text-anchor="middle" fill="#FF5252">回落期 2023-2025</text>
      <text x="960" y="312" text-anchor="middle" fill="#00D4FF" font-weight="bold">2026Q1</text>
      <text x="960" y="510" text-anchor="middle" fill="#5A6B85">（初值）</text>
    </g>
    <text x="960" y="296" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="bold" fill="#00D4FF">1.99</text>
  </g>

  <!-- right panel: honest interpretation -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="1040" y="130" width="180" height="420" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="1064" y="162" font-size="14" font-weight="bold" fill="#00D4FF">诚实解读</text>
    <text x="1064" y="192" font-size="12.5" fill="#E0E6ED">1.99% 不是</text>
    <text x="1064" y="212" font-size="12.5" fill="#E0E6ED">历史新高——</text>
    <text x="1064" y="236" font-size="12.5" fill="#FFB300">2022Q1 峰值</text>
    <text x="1064" y="256" font-size="12.5" fill="#FFB300">2.83% 才是</text>
    <text x="1064" y="288" font-size="12.5" fill="#E0E6ED">真实轨迹：</text>
    <text x="1064" y="308" font-size="12.5" fill="#E0E6ED">2020-2022 快速</text>
    <text x="1064" y="328" font-size="12.5" fill="#E0E6ED">冲高 → 2023 起</text>
    <text x="1064" y="348" font-size="12.5" fill="#E0E6ED">连续回落三年</text>
    <text x="1064" y="380" font-size="12.5" fill="#00C853">2026Q1 企稳回升</text>
    <text x="1064" y="400" font-size="12.5" fill="#00C853">至 1.99%，走出</text>
    <text x="1064" y="420" font-size="12.5" fill="#00C853">阴跌通道</text>
    <text x="1064" y="452" font-size="12" fill="#8FA3BF">回落主因：中美利差</text>
    <text x="1064" y="472" font-size="12" fill="#8FA3BF">倒挂 + 汇率贬值预期</text>
    <text x="1064" y="492" font-size="12" fill="#8FA3BF">——储备意愿是顺周期</text>
    <text x="1064" y="512" font-size="12" fill="#8FA3BF">的，不是线性的</text>
  </g>

  <!-- bottom: who holds -->
  <rect x="80" y="580" width="1140" height="80" rx="12" fill="#131B2E" stroke="#22304A"/>
  <text x="104" y="612" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">谁在配置人民币储备：全球 110+ 央行获批 CIBM，但重仓者集中在俄罗斯（储备中人民币占比 ~1/3）、</text>
  <text x="104" y="638" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">白俄罗斯、巴基斯坦等制裁敏感型经济体——"朋友圈储备"先行，中性央行仍在观望。这是份额的天花板形状。</text>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：IMF COFER 各季度（2026Q1 为初值，随迟报者提交而修订）· 序列节点为代表性季度近似值</text>
</svg>
