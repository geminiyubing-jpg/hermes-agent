<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">支柱 ⑤ 基础设施：CIPS 的替代之路</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">PILLAR 5 · INFRASTRUCTURE · CIPS vs SWIFT 的真实关系</text>
  </g>

  <!-- Left: CIPS growth -->
  <g>
    <text x="80" y="134" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E0E6ED">CIPS 年处理量（万亿元）</text>
    <line x1="100" y1="460" x2="640" y2="460" stroke="#22304A" stroke-width="1.5"/>
    <line x1="100" y1="170" x2="100" y2="460" stroke="#22304A" stroke-width="1.5"/>
    <g stroke="#1A2438" stroke-dasharray="3,5">
      <line x1="100" y1="390" x2="640" y2="390"/>
      <line x1="100" y1="320" x2="640" y2="320"/>
      <line x1="100" y1="250" x2="640" y2="250"/>
      <line x1="100" y1="180" x2="640" y2="180"/>
    </g>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#5A6B85">
      <text x="92" y="464" text-anchor="end">0</text>
      <text x="92" y="394" text-anchor="end">50</text>
      <text x="92" y="324" text-anchor="end">100</text>
      <text x="92" y="254" text-anchor="end">150</text>
      <text x="92" y="184" text-anchor="end">200</text>
    </g>
    <!-- data: 2015 3 (launch), 2018 26, 2020 45, 2022 96, 2023 123, 2024 175 -->
    <path d="M 130 440 L 230 405 L 330 329 L 430 192 L 530 102 L 610 61"
          fill="none" stroke="#E53935" stroke-width="3.5"/>
    <g fill="#E53935">
      <circle cx="130" cy="440" r="4"/>
      <circle cx="230" cy="405" r="4"/>
      <circle cx="330" cy="329" r="4"/>
      <circle cx="430" cy="192" r="4"/>
      <circle cx="530" cy="102" r="4"/>
      <circle cx="610" cy="61" r="5.5" fill="#FFB300" stroke="#0A0E1A" stroke-width="2"/>
    </g>
    <g font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#8FA3BF" text-anchor="middle">
      <text x="130" y="484">2015</text><text x="230" y="484">2018</text><text x="330" y="484">2020</text>
      <text x="430" y="484">2022</text><text x="530" y="484">2023</text><text x="610" y="484">2024</text>
    </g>
    <g font-family="'SF Mono','Menlo',monospace" font-size="12.5" fill="#8FA3BF" text-anchor="middle">
      <text x="130" y="428">3</text><text x="230" y="393">26</text><text x="330" y="317">45</text>
      <text x="430" y="180">96</text><text x="530" y="90">123</text>
    </g>
    <text x="610" y="46" text-anchor="middle" font-family="'SF Mono',monospace" font-size="14" font-weight="bold" fill="#FFB300">175</text>
    <text x="610" y="614" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13" fill="#00D4FF">2026-04 单日破 1 万亿</text>
  </g>

  <!-- Right: SWIFT relationship -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="700" y="120" width="520" height="180" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="724" y="152" font-size="15" font-weight="bold" fill="#00D4FF">CIPS 与 SWIFT：互补而非取代（现状）</text>
    <text x="724" y="182" font-size="13.5" fill="#E0E6ED">· 报文层：CIPS 大部分交易仍借用 SWIFT 报文</text>
    <text x="724" y="204" font-size="13.5" fill="#E0E6ED">  传递（渐进替换中，专线/ISO20022 并行）</text>
    <text x="724" y="232" font-size="13.5" fill="#E0E6ED">· 清算层：CIPS 独立清算结算，不依赖 CHIPS</text>
    <text x="724" y="254" font-size="13.5" fill="#E0E6ED">· 制裁含义：报文若断，直参行间仍可清算——</text>
    <text x="724" y="276" font-size="13.5" fill="#FFB300">  这才是"去 SWIFT 风险"的真正防线</text>

    <rect x="700" y="320" width="520" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="724" y="352" font-size="15" font-weight="bold" fill="#E53935">参与机构（2026）</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="14">
      <text x="724" y="384" fill="#E0E6ED">直接参与  168+ 家</text>
      <text x="960" y="384" fill="#8FA3BF">（境外 60%+）</text>
      <text x="724" y="414" fill="#E0E6ED">间接参与  1500+ 家</text>
      <text x="960" y="414" fill="#8FA3BF">覆盖 200 国家/地区</text>
      <text x="724" y="444" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">较 SWIFT 11000+ 机构仍有数量级差距</text>
    </g>

    <rect x="700" y="490" width="520" height="140" rx="12" fill="#131B2E" stroke="#FFB300" stroke-opacity="0.5"/>
    <text x="724" y="522" font-size="15" font-weight="bold" fill="#FFB300">2026 制度升级</text>
    <text x="724" y="550" font-size="13.5" fill="#E0E6ED">· 央行《CIPS 业务规则（征求意见稿）》</text>
    <text x="724" y="572" font-size="13.5" fill="#E0E6ED">  2025-07 发布：参与者分级管理</text>
    <text x="724" y="600" font-size="13.5" fill="#E0E6ED">· 目标：吸引更多外资行做直参——</text>
    <text x="724" y="620" font-size="13.5" fill="#8FA3BF">  报文自给率提升是下一个里程碑</text>
  </g>

  <!-- bottom -->
  <rect x="80" y="648" width="600" height="0" fill="none"/>
  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：CIPS 官网年报 · PBOC 披露 · 2015-2024 为年度累计，2026-04 为单日峰值</text>
</svg>
