<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#E53935"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">全球格局：美元 57% 的裂缝与"分散化"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">GLOBAL RESERVE LANDSCAPE · IMF COFER 2026Q1</text>
  </g>

  <!-- Left: currency share bars -->
  <g font-family="'SF Mono','Menlo',monospace">
    <text x="100" y="132" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E0E6ED">全球外汇储备货币构成（2026Q1）</text>
    <line x1="250" y1="150" x2="250" y2="530" stroke="#22304A"/>

    <!-- USD 57.13 -->
    <text x="235" y="185" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">美元 USD</text>
    <rect x="250" y="162" width="514" height="36" rx="4" fill="#4A6B8A" opacity="0.9"/>
    <text x="774" y="186" font-size="17" font-weight="bold" fill="#8FA3BF">57.13%</text>

    <!-- EUR 20.03 -->
    <text x="235" y="249" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">欧元 EUR</text>
    <rect x="250" y="226" width="180" height="36" rx="4" fill="#8B5CF6" opacity="0.75"/>
    <text x="440" y="250" font-size="17" font-weight="bold" fill="#8B5CF6">20.03%</text>

    <!-- JPY 5.44 -->
    <text x="235" y="313" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">日元 JPY</text>
    <rect x="250" y="290" width="49" height="36" rx="4" fill="#00C853" opacity="0.65"/>
    <text x="309" y="314" font-size="17" font-weight="bold" fill="#00C853">5.44%</text>

    <!-- GBP 4.40 -->
    <text x="235" y="377" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">英镑 GBP</text>
    <rect x="250" y="354" width="40" height="36" rx="4" fill="#00D4FF" opacity="0.65"/>
    <text x="300" y="378" font-size="17" font-weight="bold" fill="#00D4FF">4.40%</text>

    <!-- CNY 1.99 -->
    <text x="235" y="441" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">人民币 CNY</text>
    <rect x="250" y="418" width="18" height="36" rx="4" fill="#E53935"/>
    <text x="278" y="442" font-size="17" font-weight="bold" fill="#E53935">1.99%</text>

    <!-- Other 11.01 -->
    <text x="235" y="505" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">其他合计</text>
    <rect x="250" y="482" width="99" height="36" rx="4" fill="#5A6B85" opacity="0.6"/>
    <text x="359" y="506" font-size="17" font-weight="bold" fill="#8FA3BF">11.01%</text>

    <text x="250" y="556" font-size="12" fill="#5A6B85" font-family="'PingFang SC',sans-serif">全球已分配储备 13.14 万亿美元 · 人民币绝对额 ≈ 2617 亿美元</text>
  </g>

  <!-- Right: USD 30y downtrend + interpretation -->
  <g>
    <rect x="850" y="120" width="370" height="230" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="874" y="152" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#E0E6ED">美元储备份额 30 年趋势</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13" fill="#5A6B85">
      <text x="890" y="196">1999</text>
      <text x="1120" y="196">71.2%</text>
      <text x="890" y="228">2015</text>
      <text x="1120" y="228">66.0%</text>
      <text x="890" y="260">2021</text>
      <text x="1120" y="260">58.8%</text>
      <text x="890" y="292">2025Q4</text>
      <text x="1120" y="292">56.8%</text>
      <text x="890" y="324" fill="#8FA3BF">2026Q1</text>
      <text x="1120" y="324" font-weight="bold" fill="#00D4FF">57.13%</text>
      <rect x="890" y="182" width="210" height="4" rx="2" fill="#4A6B8A" opacity="0.4"/>
      <rect x="890" y="274" width="210" height="4" rx="2" fill="#E53935" opacity="0.6"/>
    </g>

    <rect x="850" y="370" width="370" height="250" rx="12" fill="#131B2E" stroke="#FFB300" stroke-opacity="0.5"/>
    <text x="874" y="402" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#FFB300">定性：分散化 ≠ 替代</text>
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#E0E6ED">
      <text x="874" y="432">· 流失的美元份额主要流向：</text>
      <text x="890" y="456">黄金（央行连购 3 年 1000 吨+）、</text>
      <text x="890" y="478">加元/澳元/瑞郎等"其他货币"</text>
      <text x="874" y="510">· 美元仍在支付（~50%）、贸易金融</text>
      <text x="874" y="532">  （80%+）、计价安全资产上绝对主导</text>
      <text x="874" y="564">· 对人民币的启示：真空地带在</text>
      <text x="890" y="588">  "制裁敏感型经济体"的结算与储备，</text>
      <text x="890" y="610">  不在全球核心市场的正面对决</text>
    </g>
  </g>

  <!-- bottom note -->
  <rect x="100" y="580" width="700" height="80" rx="12" fill="#131B2E" stroke="#22304A"/>
  <text x="124" y="612" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">人民币 1.99% 的位置感：仅相当于日元的 37%、欧元的 1/10；</text>
  <text x="124" y="638" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">但趋势方向连续 10 个季度向上——这是一场以"十年"为单位的马拉松。</text>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：IMF COFER（2026Q1 初值）· WGC 央行购金统计 · 份额为已分配储备口径</text>
</svg>
