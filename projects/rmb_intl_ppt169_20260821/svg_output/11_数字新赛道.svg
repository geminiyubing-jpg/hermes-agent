<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#E53935"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">数字新赛道：e-CNY 2.0 与 mBridge</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">DIGITAL TRACK · 数字人民币 2.0 时代（2026-01-01 起）· mBridge · 数币达</text>
  </g>

  <!-- KPI row -->
  <g font-family="'SF Mono','Menlo',monospace">
    <rect x="60" y="118" width="280" height="130" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="84" y="148" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8FA3BF">e-CNY 累计交易</text>
    <text x="84" y="192" font-size="30" font-weight="bold" fill="#E53935">34 亿笔</text>
    <text x="84" y="220" font-size="15" fill="#E0E6ED">16.7 万亿元</text>
    <text x="84" y="240" font-size="12" fill="#5A6B85">较 2023 增长超 800%</text>

    <rect x="356" y="118" width="280" height="130" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="380" y="148" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8FA3BF">mBridge 累计结算</text>
    <text x="380" y="192" font-size="30" font-weight="bold" fill="#FFB300">$555 亿</text>
    <text x="380" y="220" font-size="15" fill="#E0E6ED">4000+ 笔 · e-CNY 占 95%</text>
    <text x="380" y="240" font-size="12" fill="#5A6B85">较 2022 试点增长 2500 倍</text>

    <rect x="652" y="118" width="280" height="130" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="676" y="148" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8FA3BF">数币达 CBETS 直连机构</text>
    <text x="676" y="192" font-size="30" font-weight="bold" fill="#00D4FF">26 家</text>
    <text x="676" y="220" font-size="15" fill="#E0E6ED">2026-06-16 上线</text>
    <text x="676" y="240" font-size="12" fill="#5A6B85">工银亚洲/渣打中国/工行万象…</text>

    <rect x="948" y="118" width="272" height="130" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="972" y="148" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8FA3BF">香港数币钱包/商户</text>
    <text x="972" y="192" font-size="30" font-weight="bold" fill="#00C853">8 万/5200</text>
    <text x="972" y="220" font-size="15" fill="#E0E6ED">商户一年增 16 倍</text>
    <text x="972" y="240" font-size="12" fill="#5A6B85">18 家本地银行接 FPS 充值</text>
  </g>

  <!-- e-CNY 2.0 explanation -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="272" width="572" height="250" rx="12" fill="#131B2E" stroke="#E53935" stroke-opacity="0.6"/>
    <rect x="60" y="272" width="572" height="4" fill="#E53935"/>
    <text x="84" y="306" font-size="16" font-weight="bold" fill="#E53935">e-CNY 2.0：从数字现金到数字存款货币</text>
    <text x="84" y="338" font-size="13.5" fill="#E0E6ED">· 2026-01-01《行动方案》实施：新一代计量框架，</text>
    <text x="84" y="360" font-size="13.5" fill="#E0E6ED">  商业银行可对 e-CNY 钱包付息（陆磊披露）</text>
    <text x="84" y="390" font-size="13.5" fill="#E0E6ED">· 质变：数字现金（M0）→ 具价值储藏功能的</text>
    <text x="84" y="412" font-size="13.5" fill="#E0E6ED">  "数字存款"——从支付工具升格为计息资产</text>
    <text x="84" y="442" font-size="13.5" fill="#E0E6ED">· 境内 28 城试点 + 跨境 12 城 + 上海国际运营中心</text>
    <text x="84" y="470" font-size="13" fill="#8FA3BF">战略含义：为境外央行/机构持有人民币提供</text>
    <text x="84" y="490" font-size="13" fill="#8FA3BF">"不经过代理行体系"的新通道——储备功能实验</text>
  </g>

  <!-- mBridge -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="648" y="272" width="572" height="250" rx="12" fill="#131B2E" stroke="#FFB300" stroke-opacity="0.6"/>
    <rect x="648" y="272" width="572" height="4" fill="#FFB300"/>
    <text x="672" y="306" font-size="16" font-weight="bold" fill="#FFB300">mBridge：绕开报文体系的跨境桥</text>
    <text x="672" y="338" font-size="13.5" fill="#E0E6ED">· 成员：中国内地 + 香港 + 泰国 + 阿联酋 + 沙特</text>
    <text x="672" y="360" font-size="13.5" fill="#E0E6ED">  （+澳门 2026-06 开通）；BIS 2024 退出</text>
    <text x="672" y="390" font-size="13.5" fill="#E0E6ED">· 技术：分布式账本上做央行间 PvP 结算，</text>
    <text x="672" y="412" font-size="13.5" fill="#E0E6ED">  不依赖 SWIFT 报文、不受 CHIPS 制裁约束</text>
    <text x="672" y="442" font-size="13.5" fill="#E0E6ED">· 实战：中行百亿港元汇入（福建）、113 亿</text>
    <text x="672" y="464" font-size="13.5" fill="#E0E6ED">  人民币汇出（深圳）——单笔量级已达商业级</text>
    <text x="672" y="492" font-size="13" fill="#8FA3BF">Atlantic Council 评价：中国建的不是替代美元</text>
    <text x="672" y="512" font-size="13" fill="#8FA3BF">的体系，而是"平行的第二通道"</text>
  </g>

  <!-- bottom: critical view -->
  <rect x="60" y="544" width="1160" height="116" rx="12" fill="#131B2E" stroke="#22304A"/>
  <text x="84" y="576" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#FF5252">冷静面：数字赛道的三个约束</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#E0E6ED">
    <text x="84" y="604">① 16.7 万亿累计交易中跨境占比极小——数字人民币仍是"内贸为主、跨境试水"</text>
    <text x="84" y="628">② BIS 退出后 mBridge 地缘标签加重，西方央行参与意愿降低；③ 与港币稳定币/其他 CBDC 互联仍在早期</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：PBOC · 数字人民币国际运营中心 · Atlantic Council CBDC 追踪 · 证券时报 2026-07-23 · 新华网 2026-03-27</text>
</svg>
