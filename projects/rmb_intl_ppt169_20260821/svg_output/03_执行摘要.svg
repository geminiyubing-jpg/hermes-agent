<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#E53935"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">执行摘要："三高一低"的不对称国际化</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">EXECUTIVE SUMMARY · 截至 2026-08 最新官方数据</text>
  </g>

  <!-- Four KPI cards -->
  <g font-family="'SF Mono','Menlo',monospace">
    <rect x="60" y="120" width="278" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="84" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8FA3BF">全球储备份额（COFER）</text>
    <text x="84" y="200" font-size="38" font-weight="bold" fill="#E53935">1.99%</text>
    <text x="84" y="228" font-size="16" fill="#00C853">▲ 走出三年阴跌</text>
    <text x="84" y="252" font-size="12" fill="#5A6B85">2016 首次单列时 1.08%</text>

    <rect x="354" y="120" width="278" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="378" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8FA3BF">SWIFT 支付份额（7 月）</text>
    <text x="378" y="200" font-size="38" font-weight="bold" fill="#00D4FF">3.1%</text>
    <text x="378" y="228" font-size="16" fill="#8FA3BF">全球第五 · 口径偏低</text>
    <text x="378" y="252" font-size="12" fill="#5A6B85">CIPS 流量不计入 SWIFT</text>

    <rect x="648" y="120" width="278" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="672" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8FA3BF">CIPS 单日处理量</text>
    <text x="672" y="200" font-size="38" font-weight="bold" fill="#FFB300">万亿+</text>
    <text x="672" y="228" font-size="16" fill="#00C853">▲ 2026-04 首破</text>
    <text x="672" y="252" font-size="12" fill="#5A6B85">2024 全年 175 万亿元</text>

    <rect x="942" y="120" width="278" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="966" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8FA3BF">互换动用余额</text>
    <text x="966" y="200" font-size="38" font-weight="bold" fill="#00D4FF">1116亿</text>
    <text x="966" y="228" font-size="16" fill="#00C853">▲ 两年新高</text>
    <text x="966" y="252" font-size="12" fill="#5A6B85">32 国协议 · 总额 4.1 万亿</text>
  </g>

  <!-- one-line verdict -->
  <rect x="60" y="300" width="1160" height="56" rx="8" fill="#161E32" stroke="#FFB300" stroke-opacity="0.5"/>
  <text x="84" y="335" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFB300">一句话：管道先于水流——支付与基础设施突飞猛进，但储备份额和资本流动仍被信心与管制锁住，国际化是一场"基建先行"的持久战。</text>

  <!-- Three judgments -->
  <text x="60" y="402" font-family="'PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="#E0E6ED">三大判断</text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="420" width="368" height="240" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="60" y="420" width="368" height="4" fill="#00D4FF"/>
    <text x="84" y="456" font-size="16" font-weight="bold" fill="#00D4FF">① 基础设施驱动阶段</text>
    <text x="84" y="486" font-size="14" fill="#E0E6ED">CIPS 单日破万亿、mBridge 555 亿美元、</text>
    <text x="84" y="508" font-size="14" fill="#E0E6ED">数币达 26 家机构直连——2026 年的</text>
    <text x="84" y="530" font-size="14" fill="#E0E6ED">主题词是"管道建设"而非"份额冲刺"</text>
    <text x="84" y="566" font-size="13" fill="#8FA3BF">战略逻辑：先有可替代的清算网络，</text>
    <text x="84" y="586" font-size="13" fill="#8FA3BF">份额是网络的涌现结果，不是目标本身</text>

    <rect x="456" y="420" width="368" height="240" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="456" y="420" width="368" height="4" fill="#E53935"/>
    <text x="480" y="456" font-size="16" font-weight="bold" fill="#E53935">② 裂口 = 信心缺口</text>
    <text x="480" y="486" font-size="14" fill="#E0E6ED">支付 3.1% vs 储备 1.99%：</text>
    <text x="480" y="508" font-size="14" fill="#E0E6ED">用人民币做生意可以，</text>
    <text x="480" y="530" font-size="14" fill="#E0E6ED">把人民币当储备资产还犹豫</text>
    <text x="480" y="566" font-size="13" fill="#8FA3BF">缺口来自：资本管制（想用不能换）、</text>
    <text x="480" y="586" font-size="13" fill="#8FA3BF">市场深度（想配配不够）、透明度疑虑</text>

    <rect x="852" y="420" width="368" height="240" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="852" y="420" width="368" height="4" fill="#FFB300"/>
    <text x="876" y="456" font-size="16" font-weight="bold" fill="#FFB300">③ 制裁半径 = 历史窗口</text>
    <text x="876" y="486" font-size="14" fill="#E0E6ED">美国年新增制裁 3000+ 项（2017 年</text>
    <text x="876" y="508" font-size="14" fill="#E0E6ED">仅 880），冻结储备先例驱动</text>
    <text x="876" y="530" font-size="14" fill="#E0E6ED">"去美元化对冲"需求外溢</text>
    <text x="876" y="566" font-size="13" fill="#8FA3BF">窗口是双刃剑：推动被动采用人民币，</text>
    <text x="876" y="586" font-size="13" fill="#8FA3BF">但也让 mBridge 承压（BIS 已退出）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：IMF COFER 2026Q1 · SWIFT 2026-07 · PBOC / CIPS · 互换数据截至 2026Q1</text>
</svg>
