<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00C853"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">趋势推演：三情景与观察哨</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">SCENARIOS 2026-2030 · 概率为主观校准，非官方预测</text>
  </g>

  <!-- three scenario columns -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Scenario A -->
    <rect x="60" y="118" width="368" height="400" rx="12" fill="#131B2E" stroke="#00C853" stroke-opacity="0.7"/>
    <rect x="60" y="118" width="368" height="52" rx="12" fill="#0F2A1A"/>
    <text x="84" y="151" font-size="17" font-weight="bold" fill="#00C853">A · 加速国际化（30%）</text>
    <g font-size="13" fill="#E0E6ED">
      <text x="84" y="200" font-weight="bold" fill="#00D4FF">触发条件</text>
      <text x="84" y="224">· 制裁再加码（台海/俄油二级制裁）</text>
      <text x="84" y="246">· 石油人民币批量落地（沙特扩容）</text>
      <text x="84" y="268">· 中美利差转正（美联储续降息）</text>
      <text x="84" y="306" font-weight="bold" fill="#00D4FF">2028-2030 里程碑</text>
      <text x="84" y="330">· COFER 份额 2.8-3.2%</text>
      <text x="84" y="352">· SWIFT 支付 4.5-5%</text>
      <text x="84" y="374">· CIPS 年处理 250 万亿+</text>
      <text x="84" y="412" font-weight="bold" fill="#00D4FF">资产含义</text>
      <text x="84" y="436">CNH 资产重估、汇率中枢 6.5-6.8、</text>
      <text x="84" y="458">港股中资股受益、黄金继续强</text>
      <text x="84" y="486" font-size="12" fill="#5A6B85">风险：过快开放引发投机冲击</text>
    </g>

    <!-- Scenario B -->
    <rect x="456" y="118" width="368" height="400" rx="12" fill="#131B2E" stroke="#FFB300" stroke-opacity="0.7"/>
    <rect x="456" y="118" width="368" height="52" rx="12" fill="#2A2210"/>
    <text x="480" y="151" font-size="17" font-weight="bold" fill="#FFB300">B · 稳步推进（50%）· 基准</text>
    <g font-size="13" fill="#E0E6ED">
      <text x="480" y="200" font-weight="bold" fill="#00D4FF">触发条件</text>
      <text x="480" y="224">· 地缘不恶化，制裁半径稳定</text>
      <text x="480" y="246">· 资本项目渐进开放（不出大招）</text>
      <text x="480" y="268">· 数字通道按现有节奏扩容</text>
      <text x="480" y="306" font-weight="bold" fill="#00D4FF">2028-2030 里程碑</text>
      <text x="480" y="330">· COFER 份额 2.2-2.5%</text>
      <text x="480" y="352">· SWIFT 支付 3.5% 上下</text>
      <text x="480" y="374">· CIPS 年处理 200 万亿量级</text>
      <text x="480" y="412" font-weight="bold" fill="#00D4FF">资产含义</text>
      <text x="480" y="436">区间震荡、结构性机会在基础设施</text>
      <text x="480" y="458">与清算行产业链（银行 IT/支付）</text>
      <text x="480" y="486" font-size="12" fill="#5A6B85">这是政策表述"稳慎"的真实含义</text>
    </g>

    <!-- Scenario C -->
    <rect x="852" y="118" width="368" height="400" rx="12" fill="#131B2E" stroke="#FF5252" stroke-opacity="0.7"/>
    <rect x="852" y="118" width="368" height="52" rx="12" fill="#2A1015"/>
    <text x="876" y="151" font-size="17" font-weight="bold" fill="#FF5252">C · 波折回摆（20%）</text>
    <g font-size="13" fill="#E0E6ED">
      <text x="876" y="200" font-weight="bold" fill="#00D4FF">触发条件</text>
      <text x="876" y="224">· 台海/贸易冲突升级至金融战</text>
      <text x="876" y="246">· 汇率贬值预期再起（利差再阔）</text>
      <text x="876" y="268">· 离岸流动性事件（参考 2016/2022）</text>
      <text x="876" y="306" font-weight="bold" fill="#00D4FF">2028-2030 里程碑</text>
      <text x="876" y="330">· COFER 回落至 1.5% 以下</text>
      <text x="876" y="352">· SWIFT 支付跌破 2.5%</text>
      <text x="876" y="374">· mBridge 扩员停滞</text>
      <text x="876" y="412" font-weight="bold" fill="#00D4FF">资产含义</text>
      <text x="876" y="436">CNH 流动性收缩、点心债发行冻结、</text>
      <text x="876" y="458">管制回摆（额度收紧）</text>
      <text x="876" y="486" font-size="12" fill="#5A6B85">教训样本：2015-2017 份额腰斩重演</text>
    </g>
  </g>

  <!-- watchlist -->
  <rect x="60" y="540" width="1160" height="120" rx="12" fill="#131B2E" stroke="#00D4FF" stroke-opacity="0.5"/>
  <text x="84" y="572" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#00D4FF">观察哨（每季度校验情景概率）</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#E0E6ED">
    <text x="84" y="600">① COFER 季度值（连续两季 &gt;2.1% → 升 A 档）  ② CIPS 月度量与直参行数  ③ mBridge 扩员（印尼/马来转正?）</text>
    <text x="84" y="626">④ 中美 10Y 利差（转正 = 最大单一变量）  ⑤ 沙特石油人民币结算量  ⑥ 境外持债余额变化（北向债市通月度）</text>
    <text x="84" y="650" font-size="12.5" fill="#8FA3BF">口径注意：SWIFT 份额月度波动大（假期效应），看 3 个月移动平均而非单月。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">方法论：情景概率基于当前数据外推 + 历史类比（2015-2017 回摆、2020-2022 冲高），主观校准</text>
</svg>
