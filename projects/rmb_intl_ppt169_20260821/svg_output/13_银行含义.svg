<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">对银行的含义：内审视角</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">IMPLICATIONS FOR BANKS · 境外机构内审/合规的落点</text>
  </g>

  <!-- table -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- header row -->
    <rect x="60" y="118" width="1160" height="44" rx="6" fill="#161E32"/>
    <text x="84" y="146" font-size="14" font-weight="bold" fill="#00D4FF">风险/业务领域</text>
    <text x="380" y="146" font-size="14" font-weight="bold" fill="#00D4FF">审计关注点</text>
    <text x="880" y="146" font-size="14" font-weight="bold" fill="#00D4FF">观察指标</text>

    <!-- row 1 -->
    <line x1="60" y1="200" x2="1220" y2="200" stroke="#22304A"/>
    <text x="84" y="180" font-size="13.5" fill="#FFB300" font-weight="bold">清算行/代理行模式</text>
    <text x="380" y="180" font-size="13" fill="#E0E6ED">境外清算行集中度风险；CIPS 直参 vs 间参</text>
    <text x="880" y="180" font-size="13" fill="#8FA3BF">单一清算行依赖度、结算失败率</text>

    <!-- row 2 -->
    <line x1="60" y1="252" x2="1220" y2="252" stroke="#22304A"/>
    <text x="84" y="232" font-size="13.5" fill="#FFB300" font-weight="bold">制裁合规</text>
    <text x="380" y="232" font-size="13" fill="#E0E6ED">CIPS/mBridge 交易是否穿透筛查制裁名单；</text>
    <text x="380" y="250" font-size="13" fill="#E0E6ED">二级制裁敞口（俄油/伊朗相关人民币流量）</text>
    <text x="880" y="232" font-size="13" fill="#8FA3BF">高危对手方占比、筛查漏报率</text>

    <!-- row 3 -->
    <line x1="60" y1="304" x2="1220" y2="304" stroke="#22304A"/>
    <text x="84" y="284" font-size="13.5" fill="#FFB300" font-weight="bold">反洗钱（AML）</text>
    <text x="380" y="284" font-size="13" fill="#E0E6ED">跨境人民币贸易背景真实性核查；转口贸易</text>
    <text x="380" y="302" font-size="13" fill="#E0E6ED">洗钱通道（历史案例：边境行转口业务）</text>
    <text x="880" y="284" font-size="13" fill="#8FA3BF">可疑交易报告量/质量、误报率</text>

    <!-- row 4 -->
    <line x1="60" y1="356" x2="1220" y2="356" stroke="#22304A"/>
    <text x="84" y="336" font-size="13.5" fill="#FFB300" font-weight="bold">汇率与流动性</text>
    <text x="380" y="336" font-size="13" fill="#E0E6ED">CNH/CNY 价差异常（离岸做空信号）；</text>
    <text x="380" y="354" font-size="13" fill="#E0E6ED">互换动用余额骤增 = 对手国流动性压力</text>
    <text x="880" y="336" font-size="13" fill="#8FA3BF">CNH-CNY 基差、互换动用季度值</text>

    <!-- row 5 -->
    <line x1="60" y1="408" x2="1220" y2="408" stroke="#22304A"/>
    <text x="84" y="388" font-size="13.5" fill="#FFB300" font-weight="bold">数字人民币业务</text>
    <text x="380" y="388" font-size="13" fill="#E0E6ED">数币达直参资格的运营连续性；钱包 KYC；</text>
    <text x="380" y="406" font-size="13" fill="#E0E6ED">可编程智能合约的权限审计</text>
    <text x="880" y="388" font-size="13" fill="#8FA3BF">跨境数币交易占比、离线支付差错率</text>

    <!-- row 6 -->
    <line x1="60" y1="460" x2="1220" y2="460" stroke="#22304A"/>
    <text x="84" y="440" font-size="13.5" fill="#FFB300" font-weight="bold">数据与跨境传输</text>
    <text x="380" y="440" font-size="13" fill="#E0E6ED">CIPS 报文数据留存合规（数据出境评估）；</text>
    <text x="380" y="458" font-size="13" fill="#E0E6ED">与 SWIFT 报文双轨的数据一致性</text>
    <text x="880" y="440" font-size="13" fill="#8FA3BF">数据出境备案状态、对账差异</text>
  </g>

  <!-- bottom: three priorities -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="510" font-size="16" font-weight="bold" fill="#E0E6ED">内审 2026-2027 三大优先级</text>
    <rect x="60" y="528" width="368" height="120" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="60" y="528" width="368" height="4" fill="#E53935"/>
    <text x="84" y="560" font-size="14.5" font-weight="bold" fill="#E53935">① 制裁穿透测试</text>
    <text x="84" y="588" font-size="13" fill="#E0E6ED">对 CIPS/mBridge 通道做专项穿透，</text>
    <text x="84" y="608" font-size="13" fill="#E0E6ED">模拟 OFAC 二级制裁场景下的暴露面</text>

    <rect x="456" y="528" width="368" height="120" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="456" y="528" width="368" height="4" fill="#FFB300"/>
    <text x="480" y="560" font-size="14.5" font-weight="bold" fill="#FFB300">② 清算集中度压力测试</text>
    <text x="480" y="588" font-size="13" fill="#E0E6ED">单一清算行/单一通道中断情景下</text>
    <text x="480" y="608" font-size="13" fill="#E0E6ED">的替代路径演练（CIPS vs SWIFT 双轨）</text>

    <rect x="852" y="528" width="368" height="120" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="852" y="528" width="368" height="4" fill="#00D4FF"/>
    <text x="876" y="560" font-size="14.5" font-weight="bold" fill="#00D4FF">③ 数币业务内控前置</text>
    <text x="876" y="588" font-size="13" fill="#E0E6ED">直参与钱包运营的制度先行——</text>
    <text x="876" y="608" font-size="13" fill="#E0E6ED">业务规模起来前建好三道防线</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">视角来源：内审反洗钱境外机构审计实务 · 巴塞尔原则 XXII（贸易融资）· OFAC 二级制裁框架</text>
</svg>
