<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F6F8F7"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">年龄结构 I：14 年，老龄化翻倍</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">60+ 常住人口 2010-2024：数量与占比双升的完整序列</text>

  <!-- 双轴图 -->
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="440" x2="780" y2="440"/>
      <line x1="100" y1="370" x2="780" y2="370" stroke-dasharray="4,4"/>
      <line x1="100" y1="300" x2="780" y2="300" stroke-dasharray="4,4"/>
      <line x1="100" y1="230" x2="780" y2="230" stroke-dasharray="4,4"/>
      <line x1="100" y1="170" x2="780" y2="170" stroke-dasharray="4,4"/>
    </g>
    <!-- 60+数量(万人,柱): 2010:246 2013:292.9 2019:371.3 2020:429.9 2021:441.6 2023:494.8 2024:514 -->
    <rect x="140" y="366" width="44" height="74" fill="#B3541E" opacity="0.75"/>
    <rect x="230" y="352" width="44" height="88" fill="#B3541E" opacity="0.75"/>
    <rect x="410" y="328" width="44" height="112" fill="#B3541E" opacity="0.85"/>
    <rect x="500" y="311" width="44" height="129" fill="#B3541E" opacity="0.85"/>
    <rect x="560" y="308" width="44" height="132" fill="#B3541E" opacity="0.9"/>
    <rect x="660" y="292" width="44" height="148" fill="#B3541E"/>
    <rect x="720" y="286" width="44" height="154" fill="#8C3A1A"/>
    <!-- 占比线(%,右轴): 12.5 13.9 17.2 19.6 20.2 22.6 23.5 -->
    <polyline points="162,402 252,393 432,375 522,363 582,359 682,347 742,342" fill="none" stroke="#1F5C4D" stroke-width="3" stroke-dasharray="7,4"/>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11.5" font-weight="600" fill="#2B2B2B" text-anchor="middle">
      <text x="162" y="358">246</text><text x="252" y="344">293</text><text x="432" y="320">371</text>
      <text x="522" y="303">430</text><text x="582" y="300">442</text><text x="682" y="284">495</text><text x="742" y="278">514</text>
    </g>
    <g font-family="'PingFang SC', sans-serif" font-size="11" fill="#1F5C4D">
      <circle cx="162" cy="402" r="3.5" fill="#1F5C4D"/><text x="120" y="418">12.5%</text>
      <circle cx="522" cy="363" r="3.5" fill="#1F5C4D"/><text x="496" y="352">19.6%</text>
      <circle cx="742" cy="342" r="4" fill="#1F5C4D"/><text x="716" y="330">23.5%</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="162" y="458">2010</text><text x="252" y="458">2013</text><text x="342" y="458">2016</text>
      <text x="432" y="458">2019</text><text x="522" y="458">2020七普</text><text x="612" y="458">2022</text>
      <text x="682" y="458">2023</text><text x="742" y="458">2024</text>
    </g>
    <text x="440" y="480" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">柱=60+人口（万人）· 虚线=占常住人口比重</text>
  </g>

  <!-- 右侧:65+与阶段 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="820" y="110" width="400" height="348" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <text x="848" y="142" font-size="15" font-weight="700" fill="#B3541E">老龄化的三个刻度</text>
    <text x="848" y="174" font-size="13" fill="#2B2B2B" font-weight="600">· 65+ 占比：13.3%(2020)→16.5%(2024)</text>
    <text x="868" y="196" font-size="12.5" fill="#6E6E6E">  359.6 万人——已越过 14% 深度老龄化线</text>
    <text x="848" y="226" font-size="13" fill="#2B2B2B" font-weight="600">· 60+ 绝对量十年 +268 万</text>
    <text x="868" y="248" font-size="12.5" fill="#6E6E6E">  相当于每年新增一座中等城市的老龄人口</text>
    <text x="848" y="278" font-size="13" fill="#2B2B2B" font-weight="600">· 户籍口径更老</text>
    <text x="868" y="300" font-size="12.5" fill="#6E6E6E">  户籍 60+ 占比约 27-28%（2023，民政口径）</text>
    <text x="868" y="322" font-size="12.5" fill="#6E6E6E">  常住口径被年轻外来人口"稀释"后仍达 23.5%</text>
    <rect x="848" y="344" width="344" height="96" rx="10" fill="#F8EDE8"/>
    <text x="1020" y="374" text-anchor="middle" font-size="13" fill="#B3541E" font-weight="600">速度对比：北京 12.5%→23.5% 用了 14 年</text>
    <text x="1020" y="398" text-anchor="middle" font-size="12" fill="#6E6E6E">日本同幅度走了 ~24 年（1980s-2000s）</text>
    <text x="1020" y="422" text-anchor="middle" font-size="12" fill="#B3541E">——北京在"压缩式老龄化"</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="478" width="1160" height="148" rx="12" fill="#2B2B2B"/>
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页结论</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">北京已进入"深度老龄化"社会（65+ >14%），且速度罕见——成因见 P9：婴儿潮队列到期 + 寿命全国之冠（82.5 岁）+ 年轻人流入锐减三力叠加。</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">这不是北京独有，但北京的特殊性在于：它同时是全国最"老"的一线城市和最"富"的城市——养老支付能力强，劳动力供给压力也最大。</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">户籍口径数据来源：北京民政/老龄事业发展报告（A-/B+）</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京统计局公报(A)·六普/七普(A)·人口变动抽样调查推算(A-)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">05 / 20</text>
</svg>
