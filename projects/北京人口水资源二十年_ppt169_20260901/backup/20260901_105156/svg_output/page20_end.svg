<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F6F8F7"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C4D"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">结论：2030 三情景与数据声明</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">全部推演的收口——把二十年数据变成一张决策地图</text>

  <!-- 三情景 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="373" height="290" rx="12" fill="#FFFFFF" stroke="#1F5C4D" stroke-width="1.5"/>
    <rect x="60" y="112" width="373" height="44" rx="12" fill="#1F5C4D"/>
    <text x="246" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">基准 · 结构优化情景</text>
    <text x="246" y="192" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="34" font-weight="700" fill="#1F5C4D">60%</text>
    <text x="88" y="226" font-size="13" fill="#2B2B2B">· 常住人口 2100-2200 震荡</text>
    <text x="88" y="252" font-size="13" fill="#2B2B2B">· 60+ 占比 2030 达 ~29%</text>
    <text x="88" y="278" font-size="13" fill="#2B2B2B">· 落户维持精准、服务同权落地</text>
    <text x="88" y="304" font-size="13" fill="#2B2B2B">· 水资源冗余度保持</text>
    <text x="88" y="342" font-size="12.5" fill="#6E6E6E">触发：政策延续当前轨道，</text>
    <text x="88" y="364" font-size="12.5" fill="#6E6E6E">外无强冲击</text>

    <rect x="453" y="112" width="373" height="290" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <rect x="453" y="112" width="373" height="44" rx="12" fill="#C9A227"/>
    <text x="639" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">乐观 · 抢人转向情景</text>
    <text x="639" y="192" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="34" font-weight="700" fill="#A08318">25%</text>
    <text x="481" y="226" font-size="13" fill="#2B2B2B">· 劳动短缺倒逼落户放宽</text>
    <text x="481" y="252" font-size="13" fill="#2B2B2B">· 常住人口回升至 2250+</text>
    <text x="481" y="278" font-size="13" fill="#2B2B2B">· 年轻人占比止跌回 13%+</text>
    <text x="481" y="304" font-size="13" fill="#2B2B2B">· 水约束测试通过</text>
    <text x="481" y="342" font-size="12.5" fill="#6E6E6E">触发：GDP 目标压力+人才</text>
    <text x="481" y="364" font-size="12.5" fill="#6E6E6E">争夺战升级（学上海）</text>

    <rect x="846" y="112" width="373" height="290" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <rect x="846" y="112" width="373" height="44" rx="12" fill="#B3541E"/>
    <text x="1032" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">压力 · 双重挤压情景</text>
    <text x="1032" y="192" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="34" font-weight="700" fill="#B3541E">15%</text>
    <text x="874" y="226" font-size="13" fill="#2B2B2B">· 连枯年+南水受限</text>
    <text x="874" y="252" font-size="13" fill="#2B2B2B">· 人口跌破 2100 万</text>
    <text x="874" y="278" font-size="13" fill="#2B2B2B">· 老龄化超 30% 且财政承压</text>
    <text x="874" y="304" font-size="13" fill="#2B2B2B">· 收缩型城市管理启动</text>
    <text x="874" y="342" font-size="12.5" fill="#6E6E6E">触发：气候持续偏枯+</text>
    <text x="874" y="364" font-size="12.5" fill="#6E6E6E">宏观增速下台阶</text>
  </g>

  <!-- 一句话总结 -->
  <rect x="60" y="422" width="1160" height="80" rx="12" fill="#1F5C4D"/>
  <text x="90" y="454" font-family="'PingFang SC', sans-serif" font-size="15.5" font-weight="600" fill="#F5E9C8">二十年一句话：北京用一场主动的"减量实验"，把水资源的死结解成了活棋，</text>
  <text x="90" y="484" font-family="'PingFang SC', sans-serif" font-size="15.5" font-weight="600" fill="#F5E9C8">下一程的全部难题都集中在"人"上——从"给多少人供水"变成"从哪里要人"。</text>

  <!-- 数据声明 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="520" width="572" height="106" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <text x="88" y="550" font-size="13.5" font-weight="700" fill="#1F5C4D">数据可靠性声明</text>
    <text x="88" y="576" font-size="12" fill="#6E6E6E">· 人口：北京统计局历年公报/普查（A）</text>
    <text x="88" y="598" font-size="12" fill="#6E6E6E">· 水：水资源公报/水务局/发改委（A-/A）</text>
    <text x="88" y="618" font-size="12" fill="#6E6E6E">· 地下水 2024、降水 2024 为快报口径（B+）</text>

    <rect x="648" y="520" width="572" height="106" rx="12" fill="#2B2B2B"/>
    <text x="676" y="550" font-size="13.5" font-weight="700" fill="#C9A227">口径提醒（诚实条款）</text>
    <text x="676" y="576" font-size="12" fill="#C7C7C7">· 2020 前后人口数据含普查衔接调整</text>
    <text x="676" y="598" font-size="12" fill="#C7C7C7">· 用水/水资源各年公报口径有演进，跨年比较须如本报告逐页标注</text>
    <text x="676" y="618" font-size="12" fill="#C7C7C7">· 全部预测（P17-19）为 C 级推演，供决策参考非官方立场</text>
  </g>

  <text x="60" y="668" font-family="'PingFang SC', sans-serif" font-size="13" fill="#6E6E6E">—— 完 · 小爱研究 · 2026-09-01 ——</text>
  <text x="60" y="700" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">调研底稿存 sources/source.md，欢迎逐项复核</text>
</svg>
