<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F6F8F7"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C4D"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">地下水的复活：16 年连降的终结</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">平原区地下水埋深 26.7m(2015最低) → ~14.5m：累计回升 13.1 米、储量 +67 亿 m³</text>

  <!-- 主图:埋深(越小越好) -->
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="420" x2="800" y2="420"/>
      <line x1="100" y1="350" x2="800" y2="350" stroke-dasharray="4,4"/>
      <line x1="100" y1="280" x2="800" y2="280" stroke-dasharray="4,4"/>
      <line x1="100" y1="210" x2="800" y2="210" stroke-dasharray="4,4"/>
      <line x1="100" y1="160" x2="800" y2="160" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="424">10m</text><text x="94" y="354">15m</text><text x="94" y="284">20m</text>
      <text x="94" y="214">25m</text><text x="94" y="164">28m</text>
    </g>
    <!-- 曲线(埋深): 2010:24.9 2014:25.7 2015:26.7 2016:26.2 2017:25.7 2018:23.8 2019:23 2020:22.5 2021:19.5 2022:16.04 2023:15.7 2024:~14.5 -->
    <polyline points="130,222 240,211 300,190 360,198 420,204 480,248 540,262 600,270 660,306 720,347 770,351 790,360" fill="none" stroke="#1F5C4D" stroke-width="3.5"/>
    <!-- 分界注: 2015前下降 -->
    <line x1="300" y1="150" x2="300" y2="420" stroke="#B3541E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="200" y="146" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#B3541E">←1999-2015 连降16年</text>
    <text x="420" y="146" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#1F5C4D">2015.7 首次止降回升→连升9年→</text>
    <g font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#2B2B2B">
      <circle cx="300" cy="190" r="5" fill="#B3541E"/><text x="270" y="180" font-weight="600">26.7m 最深(2015)</text>
      <circle cx="720" cy="347" r="5" fill="#1F5C4D"/><text x="688" y="340">16.04m(2022.11)</text>
      <circle cx="790" cy="360" r="6" fill="#1F5C4D"/><text x="712" y="378" font-weight="700" fill="#1F5C4D">~14.5m(2024)</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="130" y="440">2010</text><text x="300" y="440">2015</text><text x="480" y="440">2018</text>
      <text x="600" y="440">2020</text><text x="720" y="440">2022</text><text x="790" y="440">24</text>
    </g>
    <text x="450" y="462" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">埋深=水面距地面距离，数值越小水位越高（纵轴已反转方向感）</text>
  </g>

  <!-- 右侧驱动 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="860" y="110" width="360" height="348" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <text x="888" y="142" font-size="15" font-weight="700" fill="#1F5C4D">回升的三股推力</text>
    <text x="888" y="174" font-size="13" fill="#2B2B2B" font-weight="600">① 南水替代压采</text>
    <text x="908" y="196" font-size="12.5" fill="#6E6E6E">城区供水南水占比 7 成+，</text>
    <text x="908" y="218" font-size="12.5" fill="#6E6E6E">年减采地下水 ~4 亿 m³</text>
    <text x="888" y="248" font-size="13" fill="#2B2B2B" font-weight="600">② 降水偏丰</text>
    <text x="908" y="270" font-size="12.5" fill="#6E6E6E">2021/2024 丰水年入渗补给</text>
    <text x="888" y="300" font-size="13" fill="#2B2B2B" font-weight="600">③ 生态补水</text>
    <text x="908" y="322" font-size="12.5" fill="#6E6E6E">潮白河/永定河常态化补水，</text>
    <text x="908" y="344" font-size="12.5" fill="#6E6E6E">河湖渗漏反哺地下</text>
    <rect x="888" y="364" width="304" height="76" rx="8" fill="#F0F5F3"/>
    <text x="1040" y="390" text-anchor="middle" font-size="12.5" fill="#1F5C4D" font-weight="600">清华研究：南水中线贡献了</text>
    <text x="1040" y="412" text-anchor="middle" font-size="12.5" fill="#1F5C4D" font-weight="600">北京地下水位回升的主导份额</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="478" width="1160" height="148" rx="12" fill="#1F5C4D"/>
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F5E9C8">本页结论</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F2EE">地下水回升是"供水结构换血"的总成绩单：13.1 米回升=67 亿 m³ 储量回归，相当于北京两年多的用水量从地下"银行"重新存回。</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F2EE">但工程界共识是：回升到 1980s 水平（~10m 以浅）不现实也不必要——目标是从" overdraft 危机"回到"战略储备"状态，这一步已基本达成。</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#F5E9C8" font-weight="600">历史注脚：2015.7.31 那次 15 厘米的回升，是 16 年来第一次——人民日报当时用了"惊喜"二字。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京市水务局(A)·人民日报(A-)·清华大学水利系研究(A-)·2024为快报口径</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">15 / 20</text>
</svg>
