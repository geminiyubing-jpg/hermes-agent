<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F6F8F7"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">政策前瞻 I：2300 万红线的内涵之变</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">总量目标大概率不动，但管理逻辑正在从「控增量」转向「调结构」</text>

  <!-- 红线演变 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="1160" height="190" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <text x="88" y="144" font-size="15" font-weight="700" fill="#1F5C4D">红线的历史与现状</text>
    <rect x="88" y="160" width="340" height="56" rx="8" fill="#F0F5F3"/>
    <text x="258" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2B2B">2013：明确 2300 万天花板</text>
    <text x="258" y="204" text-anchor="middle" font-size="11.5" fill="#6E6E6E">人口调控纳入政府考核</text>
    <rect x="450" y="160" width="340" height="56" rx="8" fill="#F0F5F3"/>
    <text x="620" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2B2B">2017 版总规：2020-2035 锚定 2300 万</text>
    <text x="620" y="204" text-anchor="middle" font-size="11.5" fill="#6E6E6E">"减量发展"成为首都关键词</text>
    <rect x="812" y="160" width="380" height="56" rx="8" fill="#F8EDE8"/>
    <text x="1002" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#B3541E">2024 实况：2183 万（红线内 117 万空间）</text>
    <text x="1002" y="204" text-anchor="middle" font-size="11.5" fill="#6E6E6E">实际约束力已从"顶格压力"变"安全余量"</text>
    <text x="88" y="252" font-size="13" fill="#2B2B2B">· 2017-2024 连续七年不增：控总量目标历史性达成——但代价是劳动年龄 -92 万、年轻人占比腰斩（P6-7）</text>
    <text x="88" y="282" font-size="13" fill="#B3541E" font-weight="600">· 小爱判断（概率 70%）：红线数字保留，考核内涵从"人口数"转向"人口质量/结构"指标——就像 GDP 从总量考核转向质量考核</text>
  </g>

  <!-- 三种可能 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="322" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <rect x="60" y="322" width="373" height="42" rx="12" fill="#1F5C4D"/>
    <text x="246" y="349" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">路径A 维持红线·调内涵</text>
    <text x="88" y="392" font-size="13" fill="#2B2B2B">· 2300 万名义保留</text>
    <text x="88" y="418" font-size="13" fill="#2B2B2B">· 实际运行 2150-2250 区间</text>
    <text x="88" y="444" font-size="13" fill="#2B2B2B">· 结构指标纳入考核</text>
    <text x="88" y="482" font-size="13.5" font-weight="700" fill="#1F5C4D">概率 ~70%</text>
    <text x="88" y="508" font-size="11.5" fill="#6E6E6E">（与当前政策语言最连贯）</text>

    <rect x="453" y="322" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <rect x="453" y="322" width="373" height="42" rx="12" fill="#C9A227"/>
    <text x="639" y="349" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">路径B 悄悄上修·弹性区间</text>
    <text x="481" y="392" font-size="13" fill="#2B2B2B">· 水资源冗余给出技术依据</text>
    <text x="481" y="418" font-size="13" fill="#2B2B2B">· 下轮总规（2035 修编）</text>
    <text x="481" y="444" font-size="13" fill="#2B2B2B">　 或提"2350-2400 弹性"</text>
    <text x="481" y="482" font-size="13.5" font-weight="700" fill="#A08318">概率 ~20%</text>
    <text x="481" y="508" font-size="11.5" fill="#6E6E6E">（需要劳动短缺压力倒逼）</text>

    <rect x="846" y="322" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <rect x="846" y="322" width="373" height="42" rx="12" fill="#B3541E"/>
    <text x="1032" y="349" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">路径C 进一步收缩</text>
    <text x="874" y="392" font-size="13" fill="#2B2B2B">· 资源环境压力再现</text>
    <text x="874" y="418" font-size="13" fill="#2B2B2B">　（连枯年+南水波动）</text>
    <text x="874" y="444" font-size="13" fill="#2B2B2B">· 红线下调至 2100 万</text>
    <text x="874" y="482" font-size="13.5" font-weight="700" fill="#B3541E">概率 ~10%</text>
    <text x="874" y="508" font-size="11.5" fill="#6E6E6E">（与老龄化劳动力需求矛盾）</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="542" width="1160" height="84" rx="12" fill="#2B2B2B"/>
  <text x="90" y="576" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F0F0F0">证据链：① 水务部门公开测算供水能力已超 2300 万对应需求；② 2023 人口报告强调"机会窗口期"而非"调控压力"；③ 三大科学城/自贸区持续争取人才指标——</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#C9A227" font-weight="600">总量管理正在从目的变成背景板，结构管理走向台前。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">政策推演：小爱基于官方文件+数据推演(C)；概率为主观校准</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">17 / 20</text>
</svg>
