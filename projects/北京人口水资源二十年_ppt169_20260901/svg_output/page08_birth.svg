<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F6F8F7"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">出生率：二孩脉冲与自然增长转负</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">户籍出生率 17‰(2016) → 自然增长率 -0.05‰(2022 首次转负)</text>

  <!-- 主图 -->
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="420" x2="800" y2="420"/>
      <line x1="100" y1="350" x2="800" y2="350" stroke-dasharray="4,4"/>
      <line x1="100" y1="280" x2="800" y2="280" stroke-dasharray="4,4"/>
      <line x1="100" y1="210" x2="800" y2="210" stroke-dasharray="4,4"/>
      <line x1="100" y1="150" x2="800" y2="150" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="424">0</text><text x="94" y="354">5‰</text><text x="94" y="284">10‰</text>
      <text x="94" y="214">15‰</text><text x="94" y="154">20‰</text>
    </g>
    <!-- 出生率线(常住): 2013:8.93 2015:7.96? 用户籍: 2016:17.07峰 2017:12.1 2018:9.9 2019:6.9(常住8.12) 2020:7.5? 2021:6.35 2022:5.67 2023:5.63 2024:6.09 -->
    <polyline points="130,255 190,152 250,212 310,244 370,270 430,276 490,292 550,301 610,302 670,286" fill="none" stroke="#B3541E" stroke-width="3.5"/>
    <!-- 自然增长率: 2016:9.4 2019:2.63(常住) 2021:0.96 2022:-0.05 2023:-0.5 2024:0.01 -->
    <polyline points="130,254 250,250 370,326 490,357 550,361 610,365 670,358" fill="none" stroke="#2E6E8E" stroke-width="3" stroke-dasharray="7,4"/>
    <g font-family="'PingFang SC', sans-serif" font-size="11.5">
      <circle cx="190" cy="152" r="5" fill="#B3541E"/><text x="130" y="142" font-weight="700" fill="#B3541E">2016 二孩峰值 ~17‰</text>
      <circle cx="550" cy="361" r="5" fill="#2E6E8E"/><text x="515" y="384" fill="#2E6E8E" font-weight="600">2022: -0.05‰ 首次转负</text>
      <circle cx="670" cy="286" r="4" fill="#B3541E"/><text x="636" y="278" fill="#B3541E">2024: 6.09‰</text>
      <rect x="440" y="120" width="14" height="4" fill="#B3541E"/><text x="460" y="127">出生率</text>
      <rect x="540" y="120" width="14" height="4" fill="#2E6E8E"/><text x="560" y="127">自然增长率</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="130" y="440">2013</text><text x="190" y="440">2016</text><text x="310" y="440">2018</text>
      <text x="430" y="440">2020</text><text x="550" y="440">2022</text><text x="610" y="440">23</text><text x="670" y="440">24</text>
    </g>
  </g>

  <!-- 右侧解读 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="860" y="110" width="360" height="348" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <text x="888" y="142" font-size="15" font-weight="700" fill="#B3541E">出生塌陷的三层原因</text>
    <text x="888" y="174" font-size="13" fill="#2B2B2B" font-weight="600">① 育龄妇女锐减</text>
    <text x="908" y="196" font-size="12.5" fill="#6E6E6E">80后/90后女性基数小于70后</text>
    <text x="908" y="218" font-size="12.5" fill="#6E6E6E">+外来年轻女性流出</text>
    <text x="888" y="248" font-size="13" fill="#2B2B2B" font-weight="600">② 生育意愿全国最低档</text>
    <text x="908" y="270" font-size="12.5" fill="#6E6E6E">北京户籍 TFR ~0.87（七普）</text>
    <text x="908" y="292" font-size="12.5" fill="#6E6E6E">教育/住房/机会成本三高</text>
    <text x="888" y="322" font-size="13" fill="#2B2B2B" font-weight="600">③ 二孩脉冲透支</text>
    <text x="908" y="344" font-size="12.5" fill="#6E6E6E">2016-17 集中释放后持续回落</text>
    <rect x="888" y="366" width="304" height="74" rx="8" fill="#F8EDE8"/>
    <text x="1040" y="392" text-anchor="middle" font-size="12.5" fill="#B3541E" font-weight="600">2024 小幅回正（+0.01‰）</text>
    <text x="1040" y="414" text-anchor="middle" font-size="12" fill="#6E6E6E">龙年效应+生育支持政策，</text>
    <text x="1040" y="432" text-anchor="middle" font-size="12" fill="#6E6E6E">趋势性转正仍缺证据</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="478" width="1160" height="148" rx="12" fill="#2B2B2B"/>
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页结论</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">北京已跨过"自然增长由正转负"的历史分界（2022），这意味着未来常住人口想不缩量，必须完全依赖机械增长（迁入）——</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">而迁入端又受控人口红线约束。两个约束的夹角，就是北京人口政策的全部操作空间（P17-19 的分析起点）。</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">对照全国：全国人口 2022 年起负增长，北京比全国趋势早进入结构困境但晚两年总量转负（外来流入缓冲）。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京统计局公报(A)·七普(B+/A-)·TFR 为七普推算</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">08 / 20</text>
</svg>
