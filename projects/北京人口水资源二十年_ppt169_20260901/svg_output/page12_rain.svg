<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F6F8F7"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">水资源 II：从丰枯震荡到历史破纪录</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">2025 年超 900mm 创 1961 年以来新高——近 5 年三年挤进历史前四（暖湿转型实锤）</text>

  <!-- 降水柱 2015-2025 -->
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="420" x2="790" y2="420"/>
      <line x1="100" y1="355" x2="790" y2="355" stroke-dasharray="4,4"/>
      <line x1="100" y1="290" x2="790" y2="290" stroke-dasharray="4,4"/>
      <line x1="100" y1="225" x2="790" y2="225" stroke-dasharray="4,4"/>
      <line x1="100" y1="160" x2="790" y2="160" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="424">0</text><text x="94" y="294">500</text><text x="94" y="229">750</text><text x="94" y="164">1000</text>
    </g>
    <!-- 柱: 558 648 620 578 463 532 698 498 583 ~700 920 -->
    <rect x="118" y="275" width="44" height="145" fill="#4A9BC8"/>
    <rect x="172" y="251" width="44" height="169" fill="#4A9BC8"/>
    <rect x="226" y="259" width="44" height="161" fill="#4A9BC8"/>
    <rect x="280" y="270" width="44" height="150" fill="#4A9BC8"/>
    <rect x="334" y="300" width="44" height="120" fill="#B3541E"/>
    <rect x="388" y="282" width="44" height="138" fill="#4A9BC8"/>
    <rect x="442" y="239" width="44" height="181" fill="#1F5C4D"/>
    <rect x="496" y="291" width="44" height="129" fill="#B3541E"/>
    <rect x="550" y="268" width="44" height="152" fill="#4A9BC8"/>
    <rect x="604" y="238" width="44" height="182" fill="#1F5C4D"/>
    <rect x="658" y="181" width="44" height="239" fill="#C9A227"/>
    <!-- 均值线 585 -->
    <line x1="100" y1="268" x2="790" y2="268" stroke="#8A6D1F" stroke-width="2" stroke-dasharray="10,5"/>
    <text x="786" y="260" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="12" fill="#A08318" font-weight="600">常年 ~585mm</text>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2B2B2B" text-anchor="middle">
      <text x="140" y="267">558</text><text x="194" y="243">648</text><text x="248" y="251">620</text><text x="302" y="262">578</text>
      <text x="356" y="292" fill="#B3541E">463</text><text x="410" y="274">532</text><text x="464" y="231" fill="#1F5C4D">698</text>
      <text x="518" y="283" fill="#B3541E">498</text><text x="572" y="260">583</text><text x="626" y="230" fill="#1F5C4D">~700</text>
      <text x="680" y="173" fill="#8A6D1F" font-weight="700">900+</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="10.5" fill="#9B9B9B" text-anchor="middle">
      <text x="140" y="438">15</text><text x="248" y="438">17</text><text x="356" y="438">19</text>
      <text x="464" y="438">21</text><text x="518" y="438">22</text><text x="572" y="438">23</text>
      <text x="626" y="438">24</text><text x="680" y="438" font-weight="700" fill="#8A6D1F">25</text>
    </g>
    <!-- 排名标注 -->
    <text x="464" y="216" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="10.5" fill="#1F5C4D">历史第2</text>
    <text x="626" y="216" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="10.5" fill="#1F5C4D">历史第4</text>
    <text x="680" y="158" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#8A6D1F">★ 历史第1 ★</text>
    <text x="445" y="460" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">红=枯水年；绿=历史排名前四的丰水年；2025 金柱=1961 年以来最多</text>
  </g>

  <!-- 右侧: 2026 YTD -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="860" y="110" width="360" height="348" rx="12" fill="#FFFFFF" stroke="#DFE7E4"/>
    <text x="888" y="140" font-size="15" font-weight="700" fill="#2E6E8E">2026 年至今（官方逐节点）</text>
    <rect x="888" y="154" width="304" height="56" rx="8" fill="#F0F5F3"/>
    <text x="898" y="176" font-size="12" fill="#6E6E6E">1月1日—5月31日：<tspan font-weight="700" fill="#1F5C4D">126.8mm +66%</tspan></text>
    <text x="898" y="196" font-size="11.5" fill="#1F5C4D">5月降水为 1961 年以来同期最多</text>
    <rect x="888" y="218" width="304" height="56" rx="8" fill="#F0F5F3"/>
    <text x="898" y="240" font-size="12" fill="#6E6E6E">至 7 月 12 日累计：<tspan font-weight="700" fill="#1F5C4D">366.3mm +73%</tspan></text>
    <text x="898" y="260" font-size="11.5" fill="#6E6E6E">前汛期异常偏多（财联社引气象台）</text>
    <rect x="888" y="282" width="304" height="56" rx="8" fill="#F8EDE8"/>
    <text x="898" y="304" font-size="12" fill="#6E6E6E">入汛至 8 月 7 日：<tspan font-weight="700" fill="#B3541E">307.3mm 仅+4.9%</tspan></text>
    <text x="898" y="324" font-size="11.5" fill="#B3541E">同比去年偏少 36.1% —— 7 月中旬后转少</text>
    <text x="888" y="360" font-size="12.5" fill="#2B2B2B" font-weight="600">走势："前多后少"</text>
    <text x="888" y="382" font-size="11.5" fill="#6E6E6E">汛期预测 510-590mm（+2~4 成，少于去年）</text>
    <text x="888" y="404" font-size="11.5" fill="#6E6E6E">华北雨季 7 月 10 日开始（早 8 天）但北京段偏弱</text>
    <text x="888" y="434" font-size="11.5" fill="#8A6D1F">→ 全年能否偏多，看 9 月收官（尚未定局）</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="478" width="1160" height="148" rx="12" fill="#2B2B2B"/>
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页结论（2025-26 修订版）</text>
  <text x="90" y="542" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#F0F0F0">① 暖湿转型不再是争议：2021/2024/2025 排名历史第 2/4/1，近十年均值较常年增两成——"降水带北移"从假说变为统计事实；</text>
  <text x="90" y="570" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#F0F0F0">② 但波动同样在放大：2026 年前汛期 +73% → 主汛期同比 -36%，同一年的首尾都在"破表"——极端化才是新常态；</text>
  <text x="90" y="604" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">③ 水安全启示：丰水年解决不了枯水年——2025 破纪录后 2026 主汛期立刻转少，多水源互备逻辑（P14）反而被再次验证。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：中国气象局(A)·市气象局官网(A)·市气候中心(A-)·2024为快报·2025为光明日报引市气候中心口径·2026为逐节点快报</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">12 / 20</text>
</svg>
