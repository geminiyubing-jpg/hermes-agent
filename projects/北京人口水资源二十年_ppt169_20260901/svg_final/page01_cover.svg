  <text x="60" y="486" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#2B2B2B" font-weight="600">核心悖论：水多了，人少了——承载力约束松绑的同时，人口结构成为新约束。</text>
  <text x="60" y="516" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">本报告五大板块：人口20年全景 → 年龄结构三重变奏 → 水资源与地下水 → 承载力再评估 → 政策前瞻</text>

  <text x="60" y="700" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">小爱研究 · 2026-09-01 · 数据源：北京统计局公报(A)/水务局(A)/水资源公报(A-/B+)</text>
</svg>