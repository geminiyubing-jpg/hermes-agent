  <text x="60" y="118" font-family="'PingFang SC', sans-serif" font-size="14" fill="#1F5C4D" letter-spacing="5">BEIJING · POPULATION × WATER · 2005-2025</text>
  <text x="60" y="196" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="48" font-weight="800" fill="#1F5C4D">北京人口与水资源二十年变局</text>
  <text x="60" y="252" font-family="'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#2B2B2B">人口结构 · 降雨与水资源 · 地下水位 · 承载力 · 政策前瞻</text>
  <text x="60" y="290" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#6E6E6E">严格数据版：全部关键数字来自官方统计公报/水务局，两源交叉验证，逐页标级</text>

  
  <g font-family="'PingFang SC', sans-serif">
