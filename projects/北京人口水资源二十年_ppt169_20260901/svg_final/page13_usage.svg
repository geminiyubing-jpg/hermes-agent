<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">水资源 III：用水的结构性瘦身</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">总用水量 36-38 亿 → 26-30 亿 m³——"节水即开源"的北京样本</text>

  
  <g font-family="'PingFang SC', sans-serif">
    
    <text x="80" y="128" font-size="15" font-weight="600" fill="#2E6E8E">总用水量（亿m³）</text>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="400" x2="620" y2="400" />
      <line x1="100" y1="340" x2="620" y2="340" stroke-dasharray="4,4" />
      <line x1="100" y1="280" x2="620" y2="280" stroke-dasharray="4,4" />
      <line x1="100" y1="220" x2="620" y2="220" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="404">20</text><text x="94" y="344">25</text><text x="94" y="284">30</text><text x="94" y="224">35</text>
    </g>
    
    
    <rect x="140" y="212" width="52" height="188" fill="#4A9BC8" />
    <rect x="240" y="206" width="52" height="194" fill="#4A9BC8" />
    <rect x="340" y="188" width="52" height="212" fill="#C96A3D" />
    <rect x="440" y="212" width="52" height="188" fill="#4A9BC8" />
    <rect x="540" y="240" width="52" height="160" fill="#1F5C4D" />
    <g font-family="'Helvetica Neue', sans-serif" font-size="12.5" font-weight="600" fill="#2B2B2B" text-anchor="middle">
      <text x="166" y="204">~36</text><text x="266" y="198">~38</text><text x="366" y="180" fill="#C96A3D">~41(含生态)</text>
      <text x="466" y="204">~36</text><text x="566" y="232" fill="#1F5C4D">~26.6</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="166" y="420">2011</text><text x="266" y="420">2015</text><text x="366" y="420">2019</text>
      <text x="466" y="420">2021</text><text x="566" y="420">2023</text>
    </g>
    <text x="360" y="444" text-anchor="middle" font-size="11.5" fill="#9B9B9B">口径注：2019 含生态补水；2023 为生产生活+生态分列后总口径</text>

    
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M672,112 H1208 A12,12 0 0 1 1220,124 V400 A12,12 0 0 1 1208,412 H672 A12,12 0 0 1 660,400 V124 A12,12 0 0 1 672,112 Z" />
    <text x="688" y="146" font-size="15" font-weight="700" fill="#1F5C4D">效率革命：万元 GDP 水耗</text>
    <text x="688" y="190" font-family="'Helvetica Neue', sans-serif" font-size="36" font-weight="700" fill="#1F5C4D">14.1 <tspan font-size="18">m³/万元（2017）</tspan></text>
    <text x="688" y="222" font-size="13" fill="#6E6E6E">且按可比价格连年下降 4%+——2023 年已降至 ~9-10 m³</text>
    <path fill="#F0F5F3" d="M696,244 H1184 A8,8 0 0 1 1192,252 V306 A8,8 0 0 1 1184,314 H696 A8,8 0 0 1 688,306 V252 A8,8 0 0 1 696,244 Z" />
    <text x="940" y="272" text-anchor="middle" font-size="13" fill="#1F5C4D" font-weight="600">全国最优梯队：约为全国均值（43.9 m³）的 1/5</text>
    <text x="940" y="296" text-anchor="middle" font-size="12" fill="#6E6E6E">（全国数据：2024 中国水资源公报）</text>
    <text x="688" y="340" font-size="13" fill="#2B2B2B" font-weight="600">用水结构变化：</text>
    <text x="688" y="366" font-size="12.5" fill="#6E6E6E">· 农业用水大减（灌溉退地+节水）</text>
    <text x="688" y="390" font-size="12.5" fill="#6E6E6E">· 工业用水随产业外迁收缩</text>
    <text x="688" y="414" font-size="12.5" fill="#6E6E6E">· 生活+生态用水占比过半（刚性）</text>
  </g>

  
  <path fill="#1F5C4D" d="M72,478 H1208 A12,12 0 0 1 1220,490 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V490 A12,12 0 0 1 72,478 Z" />
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F5E9C8">本页结论</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F2EE">用水量的下降不是"需求消失"而是三重压缩：产业疏解（农业工业退量）+ 节水技术（循环率/再生利用率全国领先）+ 价格机制（阶梯水价）。</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F2EE">本质：北京用"减需求"配合"增供给"（南水），双管齐下才让水账从赤字转平衡——这是承载力翻盘的第一条支柱（第二条在 P14-15）。</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#F5E9C8" font-weight="600">口径提示：用水数据 2019 前后含生态补水与否差异大，本页按公报原口径逐年标注，不跨口径直接比较。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京水资源公报(A-/B+)·2017统计公报(A)·中国水资源公报2024(A)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">13 / 20</text>
</svg>