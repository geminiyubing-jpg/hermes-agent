<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">政策前瞻 II：户籍的两条腿走路</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">落户指标收紧（精准化）与公共服务同权扩面（普惠化）并行——"户口含金量稀释"</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M72,112 H620 A12,12 0 0 1 632,124 V400 A12,12 0 0 1 620,412 H72 A12,12 0 0 1 60,400 V124 A12,12 0 0 1 72,112 Z" />
    <path fill="#B3541E" d="M72,112 H620 A12,12 0 0 1 632,124 V144 A12,12 0 0 1 620,156 H72 A12,12 0 0 1 60,144 V124 A12,12 0 0 1 72,112 Z" />
    <text x="346" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">轨道一：积分落户·收紧且精准</text>
    <text x="88" y="184" font-size="13" fill="#2B2B2B" font-weight="600">现状：2024 落户 13.94 万人</text>
    <text x="108" y="208" font-size="12.5" fill="#6E6E6E">= 2018-2024 七年最低（对照上海 27.6 万）</text>
    <text x="88" y="240" font-size="13" fill="#2B2B2B" font-weight="600">方向：指标向"三城一区"倾斜</text>
    <text x="108" y="264" font-size="12.5" fill="#6E6E6E">中关村科学城/怀柔/未来科学城/经开区——</text>
    <text x="108" y="286" font-size="12.5" fill="#6E6E6E">学历+职住+纳税的积分权重持续校准</text>
    <path fill="#F8EDE8" d="M96,306 H596 A8,8 0 0 1 604,314 V380 A8,8 0 0 1 596,388 H96 A8,8 0 0 1 88,380 V314 A8,8 0 0 1 96,306 Z" />
    <text x="346" y="334" text-anchor="middle" font-size="13" fill="#B3541E" font-weight="600">小爱预测（概率 35%）：</text>
    <text x="346" y="358" text-anchor="middle" font-size="12.5" fill="#6E6E6E">10 年内"大幅放宽落户门槛"仍难出现——</text>
    <text x="346" y="380" text-anchor="middle" font-size="12.5" fill="#6E6E6E">总量红线与疏解遗产双重锁定，但结构性通道（人才/随迁）会加宽</text>

    <path fill="#FFFFFF" stroke="#DFE7E4" d="M660,112 H1208 A12,12 0 0 1 1220,124 V400 A12,12 0 0 1 1208,412 H660 A12,12 0 0 1 648,400 V124 A12,12 0 0 1 660,112 Z" />
    <path fill="#1F5C4D" d="M660,112 H1208 A12,12 0 0 1 1220,124 V144 A12,12 0 0 1 1208,156 H660 A12,12 0 0 1 648,144 V124 A12,12 0 0 1 660,112 Z" />
    <text x="934" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">轨道二：公共服务·同权扩面</text>
    <text x="676" y="184" font-size="13" fill="#2B2B2B" font-weight="600">方向：常住地提供基本公共服务</text>
    <text x="696" y="208" font-size="12.5" fill="#6E6E6E">国家"十四五"规划原文方向 + 居住证条例升级</text>
    <text x="676" y="240" font-size="13" fill="#2B2B2B" font-weight="600">内容：教育/医疗/住房保障按常住覆盖</text>
    <text x="696" y="264" font-size="12.5" fill="#6E6E6E">· 随迁子女入学材料简化、学位扩容</text>
    <text x="696" y="286" font-size="12.5" fill="#6E6E6E">· 保障房/公租房覆盖常住人口</text>
    <path fill="#F0F5F3" d="M684,306 H1184 A8,8 0 0 1 1192,314 V380 A8,8 0 0 1 1184,388 H684 A8,8 0 0 1 676,380 V314 A8,8 0 0 1 684,306 Z" />
    <text x="934" y="334" text-anchor="middle" font-size="13" fill="#1F5C4D" font-weight="600">小爱预测（概率 75%）：</text>
    <text x="934" y="358" text-anchor="middle" font-size="12.5" fill="#6E6E6E">5-10 年"户口-服务"绑定实质性松动——</text>
    <text x="934" y="380" text-anchor="middle" font-size="12.5" fill="#6E6E6E">先于户籍放开发生，"北京户口"的溢价被稀释</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,430 H1208 A12,12 0 0 1 1220,442 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V442 A12,12 0 0 1 72,430 Z" />
  <text x="90" y="466" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">为什么是"两条腿"？制度逻辑拆解</text>
  <text x="90" y="500" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">· 户籍的真实价值 = 附着服务（教育/医疗/购房资格）——若服务先均等化，户口本身就不必放开：这是成本最低的改革路径；</text>
  <text x="90" y="528" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">· 对照组：上海选择"放量落户"（年 27 万+）抢人才，北京选择"精准滴灌+服务同权"——两种路线五年内可见分晓；</text>
  <text x="90" y="556" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">· 风险点：若年轻人占比继续下滑（P7），北京可能在 2028-2030 被迫转向"上海模式"——概率当前评估 30%，随数据滚动上调。</text>
  <text x="90" y="596" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">观察哨：每年落户人数（跌破 12 万=收紧信号，突破 18 万=转向信号）；随迁子女高考政策（实质突破=同权落地信号）。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">政策推演：小爱(C)；现状数据：经济观察报引统计年鉴(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">18 / 20</text>
</svg>