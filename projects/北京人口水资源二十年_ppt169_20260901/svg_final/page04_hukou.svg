<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C4D" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">户籍 · 常住 · 外来：三条线的大分野</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">疏解政策的作用面：外来人口首当其冲，户籍人口反而在涨</text>

  
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="440" x2="760" y2="440" />
      <line x1="100" y1="370" x2="760" y2="370" stroke-dasharray="4,4" />
      <line x1="100" y1="300" x2="760" y2="300" stroke-dasharray="4,4" />
      <line x1="100" y1="230" x2="760" y2="230" stroke-dasharray="4,4" />
      <line x1="100" y1="170" x2="760" y2="170" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="444">1200</text><text x="94" y="374">1400</text><text x="94" y="304">1600</text>
      <text x="94" y="234">1800</text><text x="94" y="174">2000</text>
    </g>
    
    <polyline points="130,394 250,380 350,373 450,357 550,348 620,330 690,330" fill="none" stroke="#C9A227" stroke-width="3.5" />
    
    <polyline points="130,211 250,204 330,211 400,217 480,229 590,196 690,205" fill="none" stroke="#B3541E" stroke-width="3.5" stroke-dasharray="8,4" />
    <g font-family="'PingFang SC', sans-serif" font-size="12">
      <rect x="480" y="146" width="14" height="4" fill="#C9A227" /><text x="500" y="152">户籍人口（右轴升）</text>
      <rect x="480" y="168" width="14" height="4" fill="#B3541E" /><text x="500" y="174">常住外来人口</text>
    </g>
    <g font-family="'PingFang SC', sans-serif" font-size="11" fill="#2B2B2B">
      <circle cx="350" cy="373" r="4" fill="#C9A227" /><text x="300" y="392">2017: 1359.2</text>
      <circle cx="690" cy="330" r="4" fill="#C9A227" /><text x="628" y="320">2023: ~1427</text>
      <circle cx="480" cy="229" r="4" fill="#B3541E" /><text x="440" y="250">2019: 745.6(低点)</text>
      <circle cx="130" cy="211" r="4" fill="#B3541E" /><text x="100" y="202">2013: 802.7</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="130" y="460">2013</text><text x="280" y="460">2015</text><text x="440" y="460">2017</text>
      <text x="560" y="460">2019</text><text x="660" y="460">2021</text><text x="740" y="460">23</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M812,110 H1208 A12,12 0 0 1 1220,122 V446 A12,12 0 0 1 1208,458 H812 A12,12 0 0 1 800,446 V122 A12,12 0 0 1 812,110 Z" />
    <text x="828" y="142" font-size="15" font-weight="700" fill="#1F5C4D">分野的三重含义</text>
    <text x="828" y="174" font-size="13" fill="#2B2B2B" font-weight="600">① 疏解的对象是"人户分离"</text>
    <text x="848" y="198" font-size="12.5" fill="#6E6E6E">外来人口 2015 峰值 822.6万 → 2019</text>
    <text x="848" y="220" font-size="12.5" fill="#6E6E6E">745.6万（-77万）：批发市场外迁、</text>
    <text x="848" y="242" font-size="12.5" fill="#6E6E6E">一般制造业退出、违建拆除</text>
    <text x="828" y="272" font-size="13" fill="#2B2B2B" font-weight="600">② 户籍人口稳增：政策保护层</text>
    <text x="848" y="296" font-size="12.5" fill="#6E6E6E">1316→1427万（+111万/十年），</text>
    <text x="848" y="318" font-size="12.5" fill="#6E6E6E">积分落户+人才引进+自然增长</text>
    <text x="828" y="348" font-size="13" fill="#2B2B2B" font-weight="600">③ 落户口在收紧</text>
    <text x="848" y="372" font-size="12.5" fill="#6E6E6E">2024 落户 13.94 万 = 2018-2024</text>
    <text x="848" y="394" font-size="12.5" fill="#6E6E6E">最低值（经观/统计年鉴）——</text>
    <text x="848" y="416" font-size="12.5" fill="#6E6E6E">总量控制下指标化分配</text>
    <path fill="#F0F5F3" d="M834,428 H1186 A6,6 0 0 1 1192,434 V444 A6,6 0 0 1 1186,450 H834 A6,6 0 0 1 828,444 V434 A6,6 0 0 1 834,428 Z" />
    <text x="1010" y="443" text-anchor="middle" font-size="11.5" fill="#1F5C4D" font-weight="600">外来占比 38%→34.6%→38%的V型</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,478 H1208 A12,12 0 0 1 1220,490 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V490 A12,12 0 0 1 72,478 Z" />
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页结论</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">北京人口调控的精妙之处：从未直接"驱赶户籍人口"，而是控制外来增量——常住外来从 38% 峰值压回，同时户籍人口稳步扩张，</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">城市"含京量"悄然提升。这决定了后续户籍政策的基本盘：指标紧、结构准（P18 展开）。</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">注：2021 年外来数据回升含七普基数调整因素，两口径衔接处以公报为准。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京统计局公报(A)·经济观察报引统计年鉴(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">04 / 20</text>
</svg>