<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C4D" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">成因分析：三股力量的叠加</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">人口结构巨变不是单一原因——是三条独立趋势线在同一十年的交汇</text>

  
  <g font-family="'PingFang SC', sans-serif">
    
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M72,112 H620 A12,12 0 0 1 632,124 V276 A12,12 0 0 1 620,288 H72 A12,12 0 0 1 60,276 V124 A12,12 0 0 1 72,112 Z" />
    <path fill="#B3541E" d="M64,112 H64 A4,4 0 0 1 68,116 V284 A4,4 0 0 1 64,288 H64 A4,4 0 0 1 60,284 V116 A4,4 0 0 1 64,112 Z" />
    <text x="96" y="146" font-size="15.5" font-weight="700" fill="#B3541E">力① 生育塌陷（慢变量）</text>
    <text x="96" y="176" font-size="13" fill="#2B2B2B">TFR 从 1990s 的 ~1.0 降至 2020 的 0.87</text>
    <text x="96" y="202" font-size="13" fill="#2B2B2B">——低于全国（1.3）更低于更替线（2.1）</text>
    <text x="96" y="230" font-size="12.5" fill="#6E6E6E">作用机制：少子化 20 年累积 → 育龄基数萎缩 →</text>
    <text x="96" y="252" font-size="12.5" fill="#6E6E6E">出生量被动下降（即便意愿不变）</text>
    <text x="96" y="278" font-size="12" fill="#9B9B9B">时间尺度：不可逆，作用 30 年+</text>

    
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M660,112 H1208 A12,12 0 0 1 1220,124 V276 A12,12 0 0 1 1208,288 H660 A12,12 0 0 1 648,276 V124 A12,12 0 0 1 660,112 Z" />
    <path fill="#2E6E8E" d="M652,112 H652 A4,4 0 0 1 656,116 V284 A4,4 0 0 1 652,288 H652 A4,4 0 0 1 648,284 V116 A4,4 0 0 1 652,112 Z" />
    <text x="684" y="146" font-size="15.5" font-weight="700" fill="#2E6E8E">力② 疏解政策（政策变量）</text>
    <text x="684" y="176" font-size="13" fill="#2B2B2B">2014 疏解非首都功能 → 一般制造业退出、</text>
    <text x="684" y="202" font-size="13" fill="#2B2B2B">批发市场外迁、违建拆除 → 外来人口 -77 万</text>
    <text x="684" y="230" font-size="12.5" fill="#6E6E6E">作用机制：直接压减年轻劳动力供给</text>
    <text x="684" y="252" font-size="12.5" fill="#6E6E6E">（20-39 岁占比降幅最大段）</text>
    <text x="684" y="278" font-size="12" fill="#9B9B9B">时间尺度：2017-2020 集中释放，现趋缓</text>

    
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M72,300 H620 A12,12 0 0 1 632,312 V464 A12,12 0 0 1 620,476 H72 A12,12 0 0 1 60,464 V312 A12,12 0 0 1 72,300 Z" />
    <path fill="#C9A227" d="M64,300 H64 A4,4 0 0 1 68,304 V472 A4,4 0 0 1 64,476 H64 A4,4 0 0 1 60,472 V304 A4,4 0 0 1 64,300 Z" />
    <text x="96" y="334" font-size="15.5" font-weight="700" fill="#A08318">力③ 婴儿潮变老（人口惯性）</text>
    <text x="96" y="364" font-size="13" fill="#2B2B2B">1962-1975 出生高峰队列 2022-2035 年</text>
    <text x="96" y="390" font-size="13" fill="#2B2B2B">陆续进入 60+——每年"制造" 25-30 万新老人</text>
    <text x="96" y="418" font-size="12.5" fill="#6E6E6E">叠加寿命 82.5 岁（全国之冠）：老人存量</text>
    <text x="96" y="440" font-size="12.5" fill="#6E6E6E">既快增又长存</text>
    <text x="96" y="466" font-size="12" fill="#9B9B9B">时间尺度：2025-2035 最陡峭段</text>

    
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M660,300 H1208 A12,12 0 0 1 1220,312 V464 A12,12 0 0 1 1208,476 H660 A12,12 0 0 1 648,464 V312 A12,12 0 0 1 660,300 Z" />
    <path fill="#1F5C4D" d="M652,300 H652 A4,4 0 0 1 656,304 V472 A4,4 0 0 1 652,476 H652 A4,4 0 0 1 648,472 V304 A4,4 0 0 1 652,300 Z" />
    <text x="684" y="334" font-size="15.5" font-weight="700" fill="#1F5C4D">力④ 竞争分流（市场变量）</text>
    <text x="684" y="364" font-size="13" fill="#2B2B2B">新一线城市抢人（杭州/成都落户即补贴）+</text>
    <text x="684" y="390" font-size="13" fill="#2B2B2B">上海 2021 落户放宽（+78%）——年轻人</text>
    <text x="684" y="416" font-size="13" fill="#2B2B2B">"用脚投票"的选项变多</text>
    <text x="684" y="444" font-size="12.5" fill="#6E6E6E">作用机制：压低北京年轻人口净流入</text>
    <text x="684" y="466" font-size="12" fill="#9B9B9B">时间尺度：持续作用，弹性最大</text>
  </g>

  
  <path fill="#1F5C4D" d="M72,496 H1208 A12,12 0 0 1 1220,508 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V508 A12,12 0 0 1 72,496 Z" />
  <text x="90" y="530" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F5E9C8">四力合成的数学：老龄化率变化 ≈ (新老人-新出生-离开的年轻人) / 总人口</text>
  <text x="90" y="562" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F2EE">分子端四力同向（老人多生得少走得动），分母端总量封顶——北京 14 年老龄化翻倍是"分子膨胀×分母冻结"的必然算术。</text>
  <text x="90" y="594" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#F5E9C8" font-weight="600">政策含义：力①③不可逆，力②已完成，唯一可调的是力④——这正是 P18-19 政策预测的核心逻辑。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">分析框架：小爱基于公报数据构建（C）；各分力数据点均 A/B+ 级</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">09 / 20</text>
</svg>