<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">水资源 II：近十年降雨的丰枯震荡</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">年降水量 463-698mm 剧烈波动——气候变化下的"过山车"</text>

  
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="420" x2="800" y2="420" />
      <line x1="100" y1="350" x2="800" y2="350" stroke-dasharray="4,4" />
      <line x1="100" y1="280" x2="800" y2="280" stroke-dasharray="4,4" />
      <line x1="100" y1="210" x2="800" y2="210" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="424">0</text><text x="94" y="354">250</text><text x="94" y="284">500</text><text x="94" y="214">750</text>
    </g>
    
    <rect x="130" y="259" width="40" height="161" fill="#4A9BC8" />
    <rect x="190" y="234" width="40" height="186" fill="#2E6E8E" />
    <rect x="250" y="242" width="40" height="178" fill="#4A9BC8" />
    <rect x="310" y="254" width="40" height="166" fill="#4A9BC8" />
    <rect x="370" y="287" width="40" height="133" fill="#B3541E" />
    <rect x="430" y="267" width="40" height="153" fill="#4A9BC8" />
    <rect x="490" y="219" width="40" height="201" fill="#1F5C4D" />
    <rect x="550" y="277" width="40" height="143" fill="#B3541E" />
    <rect x="610" y="252" width="40" height="168" fill="#4A9BC8" />
    <rect x="670" y="219" width="40" height="201" fill="#1F5C4D" />
    
    <line x1="100" y1="252" x2="800" y2="252" stroke="#C9A227" stroke-width="2" stroke-dasharray="10,5" />
    <text x="740" y="244" font-family="'PingFang SC', sans-serif" font-size="12" fill="#A08318" font-weight="600">多年均值 ~585mm</text>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11.5" font-weight="600" fill="#2B2B2B" text-anchor="middle">
      <text x="150" y="250">558</text><text x="210" y="226">648</text><text x="270" y="234">620</text><text x="330" y="246">578</text>
      <text x="390" y="279" fill="#B3541E">463</text><text x="450" y="259">532</text><text x="510" y="211" fill="#1F5C4D">698</text>
      <text x="570" y="269" fill="#B3541E">498</text><text x="630" y="244">583</text><text x="690" y="211" fill="#1F5C4D">~700</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="150" y="440">2015</text><text x="270" y="440">2017</text><text x="390" y="440">2019</text>
      <text x="510" y="440">2021</text><text x="630" y="440">2023</text><text x="690" y="440">24</text>
    </g>
    <text x="450" y="462" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">红柱=枯水年（2019/2022）；绿柱=丰水年（2021/2024）</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M872,110 H1208 A12,12 0 0 1 1220,122 V446 A12,12 0 0 1 1208,458 H872 A12,12 0 0 1 860,446 V122 A12,12 0 0 1 872,110 Z" />
    <text x="888" y="142" font-size="15" font-weight="700" fill="#2E6E8E">波动背后的两个事实</text>
    <text x="888" y="174" font-size="13" fill="#2B2B2B" font-weight="600">① 丰枯交替在加剧</text>
    <text x="908" y="198" font-size="12.5" fill="#6E6E6E">最大年际差 235mm（698 vs 463）</text>
    <text x="908" y="220" font-size="12.5" fill="#6E6E6E">——极端降水事件占比升高</text>
    <text x="908" y="242" font-size="12.5" fill="#6E6E6E">（2023"23·7"流域性洪水）</text>
    <text x="888" y="274" font-size="13" fill="#2B2B2B" font-weight="600">② 但十年均值略高于常年</text>
    <text x="908" y="298" font-size="12.5" fill="#6E6E6E">2015-2024 均值 ~595mm &gt; 585mm：</text>
    <text x="908" y="320" font-size="12.5" fill="#6E6E6E">北方降水带北移的争议性利好</text>
    <path fill="#F0F5F3" d="M898,340 H1182 A10,10 0 0 1 1192,350 V430 A10,10 0 0 1 1182,440 H898 A10,10 0 0 1 888,430 V350 A10,10 0 0 1 898,340 Z" />
    <text x="1040" y="370" text-anchor="middle" font-size="12.5" fill="#1F5C4D" font-weight="600">2023 年汛期降雨形成水资源 26.83 亿 m³</text>
    <text x="1040" y="392" text-anchor="middle" font-size="12" fill="#6E6E6E">（北京数据平台官方口径）——</text>
    <text x="1040" y="412" text-anchor="middle" font-size="12" fill="#6E6E6E">降水→资源的转化率约 30-40%</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,478 H1208 A12,12 0 0 1 1220,490 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V490 A12,12 0 0 1 72,478 Z" />
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页结论</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">降水不再是"稳定的供给"而是"波动的输入"——北京水安全的正确问法已从"年均多少"变成"枯水年+检修期+需求峰值"三重叠加时够不够。</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">这决定了基础设施逻辑：多水源（南水+再生+雨洪）互备是唯一答案——单一依赖（无论依赖降雨还是依赖南水）都是脆弱的。</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">注：2024 为汛期/全年快报口径，最终以水资源公报为准。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京市水资源公报历年(A-/B+)·气象局(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">12 / 20</text>
</svg>