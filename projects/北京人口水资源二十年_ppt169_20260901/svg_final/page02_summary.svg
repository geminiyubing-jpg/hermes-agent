<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C4D" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">执行摘要：五个核心发现</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">先结论后证据——每条都可回溯到后文 A 级数据页</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M72,110 H620 A12,12 0 0 1 632,122 V388 A12,12 0 0 1 620,400 H72 A12,12 0 0 1 60,388 V122 A12,12 0 0 1 72,110 Z" />
    <text x="88" y="142" font-size="15.5" font-weight="700" fill="#1F5C4D">人口三发现</text>
    <text x="88" y="176" font-size="13.5" fill="#2B2B2B" font-weight="600">① 总量：从狂飙到平台</text>
    <text x="108" y="200" font-size="12.5" fill="#6E6E6E">2000-2016 年均+50万 → 2017 起连续三年下降</text>
    <text x="108" y="222" font-size="12.5" fill="#6E6E6E">→ 2020 七普修正后 2183-2189 平台震荡（P3）</text>
    <text x="88" y="252" font-size="13.5" fill="#2B2B2B" font-weight="600">② 结构：14 年老龄化翻倍</text>
    <text x="108" y="276" font-size="12.5" fill="#6E6E6E">60+ 占比 12.5%(2010)→23.5%(2024)；劳动年龄</text>
    <text x="108" y="298" font-size="12.5" fill="#6E6E6E">82.7%→64.5%；抚养比 20.9%→38.7%（P5-6）</text>
    <text x="88" y="328" font-size="13.5" fill="#2B2B2B" font-weight="600">③ 年轻人：占比腰斩</text>
    <text x="108" y="352" font-size="12.5" fill="#6E6E6E">20-29 岁 21.3%(2015)→11.4%(2024)，已回归</text>
    <text x="108" y="374" font-size="12.5" fill="#6E6E6E">全国均值——人才争夺战北京在退潮（P7）</text>

    <path fill="#FFFFFF" stroke="#DFE7E4" d="M660,110 H1208 A12,12 0 0 1 1220,122 V388 A12,12 0 0 1 1208,400 H660 A12,12 0 0 1 648,388 V122 A12,12 0 0 1 660,110 Z" />
    <text x="676" y="142" font-size="15.5" font-weight="700" fill="#2E6E8E">水与政策两发现</text>
    <text x="676" y="176" font-size="13.5" fill="#2B2B2B" font-weight="600">④ 水资源：从危机到反转</text>
    <text x="696" y="200" font-size="12.5" fill="#6E6E6E">南水北调百亿 m³ 进京 + 压采 + 偏丰降水 →</text>
    <text x="696" y="222" font-size="12.5" fill="#6E6E6E">地下水位 16 年连降终结，累计回升 13.1 米、</text>
    <text x="696" y="244" font-size="12.5" fill="#6E6E6E">储量+67亿m³（P14-15）</text>
    <text x="88" y="0" font-size="0">.</text>
    <text x="676" y="274" font-size="13.5" fill="#2B2B2B" font-weight="600">⑤ 政策：从控总量到调结构</text>
    <text x="696" y="298" font-size="12.5" fill="#6E6E6E">2300万红线不变但内涵转向：2024 落户 13.94万</text>
    <text x="696" y="320" font-size="12.5" fill="#6E6E6E">为七年最低（精准引进）；公共服务同权扩面</text>
    <text x="696" y="342" font-size="12.5" fill="#6E6E6E">先行概率 75%；应对老龄化定向引才（P17-19）</text>
    <path fill="#F0F5F3" d="M684,356 H1184 A8,8 0 0 1 1192,364 V382 A8,8 0 0 1 1184,390 H684 A8,8 0 0 1 676,382 V364 A8,8 0 0 1 684,356 Z" />
    <text x="934" y="378" text-anchor="middle" font-size="12.5" fill="#1F5C4D" font-weight="600">2030 三情景推演见 P20</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="416" width="1160" height="34" fill="#2B2B2B" />
    <text x="200" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">指标</text>
    <text x="480" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">2005/2010</text>
    <text x="740" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">2015/2020</text>
    <text x="1060" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#C9A227">2024</text>
    <rect x="60" y="450" width="1160" height="38" fill="#FFFFFF" />
    <text x="200" y="474" text-anchor="middle" font-size="12.5">常住人口(万)</text>
    <text x="480" y="474" text-anchor="middle" font-size="12.5">1538 / 1961.2</text>
    <text x="740" y="474" text-anchor="middle" font-size="12.5">2170.5 / 2189.3</text>
    <text x="1060" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#1F5C4D">2183.2</text>
    <rect x="60" y="488" width="1160" height="38" fill="#F0F5F3" />
    <text x="200" y="512" text-anchor="middle" font-size="12.5">60+占比(%)</text>
    <text x="480" y="512" text-anchor="middle" font-size="12.5">— / 12.5</text>
    <text x="740" y="512" text-anchor="middle" font-size="12.5">14.4 / 19.6</text>
    <text x="1060" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#B3541E">23.5</text>
    <rect x="60" y="526" width="1160" height="38" fill="#FFFFFF" />
    <text x="200" y="550" text-anchor="middle" font-size="12.5">人均水资源(m³)</text>
    <text x="480" y="550" text-anchor="middle" font-size="12.5">~100（多年平均）</text>
    <text x="740" y="550" text-anchor="middle" font-size="12.5">~150（南水后）</text>
    <text x="1060" y="550" text-anchor="middle" font-size="13" font-weight="700" fill="#2E6E8E">~150</text>
    <rect x="60" y="564" width="1160" height="38" fill="#F0F5F3" />
    <text x="200" y="588" text-anchor="middle" font-size="12.5">平原地下水埋深(米)</text>
    <text x="480" y="588" text-anchor="middle" font-size="12.5">— / ~24.9</text>
    <text x="740" y="588" text-anchor="middle" font-size="12.5">26.7(最低) / ~22.5</text>
    <text x="1060" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#2E6E8E">~14.5</text>
  </g>
  <rect x="60" y="416" width="1160" height="186" fill="none" stroke="#DFE7E4" />

  <text x="60" y="640" font-family="'PingFang SC', sans-serif" font-size="13" fill="#6E6E6E">一句话：二十年把「以水定人」的水约束松了绑，却把「人」本身变成了新变量——北京的故事从扩张管控进入结构管理。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京统计局公报(A)·水务局(A)·水资源公报(A-/B+)；地下水为年度口径</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">02 / 20</text>
</svg>