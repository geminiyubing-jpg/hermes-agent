<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">水资源 I：北京到底有多缺水？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">人均 100-150 m³：低于国际极度缺水线的 1/3——世界级特大城市中的极端样本</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <text x="80" y="130" font-size="15" font-weight="600" fill="#2E6E8E">人均水资源量对比（m³/人/年）</text>
    
    <path fill="#B3541E" d="M246,150 H364 A6,6 0 0 1 370,156 V182 A6,6 0 0 1 364,188 H246 A6,6 0 0 1 240,182 V156 A6,6 0 0 1 246,150 Z" />
    <text x="390" y="176" font-size="13" fill="#B3541E" font-weight="700">北京·南水进京前：~100</text>
    <path fill="#C96A3D" d="M246,198 H430 A6,6 0 0 1 436,204 V230 A6,6 0 0 1 430,236 H246 A6,6 0 0 1 240,230 V204 A6,6 0 0 1 246,198 Z" />
    <text x="456" y="224" font-size="13" fill="#C96A3D" font-weight="600">北京·南水进京后：~150</text>
    <path fill="#2E6E8E" d="M246,246 H889 A6,6 0 0 1 895,252 V278 A6,6 0 0 1 889,284 H246 A6,6 0 0 1 240,278 V252 A6,6 0 0 1 246,246 Z" />
    <text x="915" y="272" font-size="13" fill="#2E6E8E" font-weight="600">国际极度缺水警戒线：500</text>
    <path fill="#1F5C4D" d="M246,294 H1054 A6,6 0 0 1 1060,300 V326 A6,6 0 0 1 1054,332 H246 A6,6 0 0 1 240,326 V300 A6,6 0 0 1 246,294 Z" />
    <text x="1080" y="320" font-size="13" fill="#1F5C4D" font-weight="600">全国平均：~2,100</text>
    <path fill="#4A9B7A" d="M246,342 H1154 A6,6 0 0 1 1160,348 V374 A6,6 0 0 1 1154,380 H246 A6,6 0 0 1 240,374 V348 A6,6 0 0 1 246,342 Z" />
    <text x="1176" y="368" font-size="13" fill="#4A9B7A" font-weight="600">世界平均：~6,000+</text>
    <text x="80" y="408" font-size="12.5" fill="#6E6E6E">结论：即便南水进京，北京人均仍只有警戒线的 30%——"远水"永远只是缓冲，不是解药</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M72,432 H620 A12,12 0 0 1 632,444 V614 A12,12 0 0 1 620,626 H72 A12,12 0 0 1 60,614 V444 A12,12 0 0 1 72,432 Z" />
    <text x="88" y="464" font-size="15" font-weight="700" fill="#2E6E8E">先天不足 × 后天超载</text>
    <text x="88" y="496" font-size="13" fill="#2B2B2B">· 半湿润气候+人口从 800 万涨到 2180 万：人均资源被 2.7 倍稀释</text>
    <text x="88" y="524" font-size="13" fill="#2B2B2B">· 1999-2014 连续枯水年：年均水资源 ~21 亿 m³ vs 用水 36 亿</text>
    <text x="88" y="552" font-size="13" fill="#2B2B2B">· 缺口靠超采地下水填：地下水位 1999-2015 累计下降 ~12 米</text>
    <text x="88" y="586" font-size="12.5" fill="#6E6E6E">——"以水定城"成为 2017 版总规的底层约束（P16 展开）</text>

    <path fill="#2B2B2B" d="M660,432 H1208 A12,12 0 0 1 1220,444 V614 A12,12 0 0 1 1208,626 H660 A12,12 0 0 1 648,614 V444 A12,12 0 0 1 660,432 Z" />
    <text x="676" y="464" font-size="15" font-weight="700" fill="#F5E9C8">历史刻度：2013 年的科学网报道</text>
    <text x="676" y="496" font-size="13" fill="#F0F0F0">「北京水资源年均 21 亿 m³，用水 36 亿——</text>
    <text x="676" y="522" font-size="13" fill="#F0F0F0">　年均缺水 15 亿 m³，人均不如北非」</text>
    <text x="676" y="556" font-size="13" fill="#F5E9C8" font-weight="600">十年后的今天：缺口靠南水+再生水+压采补齐——</text>
    <text x="676" y="582" font-size="13" fill="#F5E9C8" font-weight="600">这是 P12-15 要讲的反转故事</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：发改委/水利部(A)·北京市水资源公报(A-/B+)·科学网2013(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">11 / 20</text>
</svg>