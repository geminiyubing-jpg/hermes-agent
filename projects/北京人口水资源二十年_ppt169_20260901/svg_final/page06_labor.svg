<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">年龄结构 II：劳动年龄的塌陷</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">15-59 岁常住人口：占比 82.7% → 64.5%，抚养比翻近一倍</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <text x="80" y="126" font-size="15" font-weight="600" fill="#1F5C4D">年龄结构占比的三个快照（%）</text>
    
    <text x="90" y="168" font-size="13.5" font-weight="600" fill="#2B2B2B">2010（六普）</text>
    <rect x="90" y="178" width="164" height="44" fill="#4A9B7A" />
    <rect x="254" y="178" width="776" height="44" fill="#1F5C4D" />
    <rect x="1030" y="178" width="173" height="44" fill="#B3541E" />
    <text x="172" y="205" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">0-14: 8.6%</text>
    <text x="642" y="205" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">15-59 岁：82.7%（1621.8万）</text>
    <text x="1116" y="205" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">60+: 12.5%</text>
    
    <text x="90" y="262" font-size="13.5" font-weight="600" fill="#2B2B2B">2019</text>
    <rect x="90" y="272" width="201" height="44" fill="#4A9B7A" />
    <rect x="291" y="272" width="678" height="44" fill="#1F5C4D" />
    <rect x="969" y="272" width="234" height="44" fill="#B3541E" />
    <text x="190" y="299" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">10.5%</text>
    <text x="630" y="299" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">72.3%（1555.6万）</text>
    <text x="1086" y="299" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">17.2%</text>
    
    <text x="90" y="356" font-size="13.5" font-weight="600" fill="#2B2B2B">2024</text>
    <rect x="90" y="366" width="230" height="44" fill="#4A9B7A" />
    <rect x="320" y="366" width="605" height="44" fill="#1F5C4D" />
    <rect x="925" y="366" width="278" height="44" fill="#B3541E" />
    <text x="205" y="393" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">12.0%</text>
    <text x="622" y="393" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">64.5%（1408万）</text>
    <text x="1064" y="393" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="600">23.5%</text>
    <g font-size="12">
      <rect x="480" y="428" width="14" height="14" fill="#4A9B7A" /><text x="502" y="440">少儿</text>
      <rect x="560" y="428" width="14" height="14" fill="#1F5C4D" /><text x="582" y="440">劳动年龄</text>
      <rect x="670" y="428" width="14" height="14" fill="#B3541E" /><text x="692" y="440">老年</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M832,112 H1208 A12,12 0 0 1 1220,124 V422 A12,12 0 0 1 1208,434 H832 A12,12 0 0 1 820,422 V124 A12,12 0 0 1 832,112 Z" />
    <text x="848" y="144" font-size="15" font-weight="700" fill="#B3541E">总抚养比：20.9% → 38.7%</text>
    
    <path d="M 880,300 A 120,120 0 0 1 1120,300" fill="none" stroke="#DFE7E4" stroke-width="26" />
    <path d="M 880,300 A 120,120 0 0 1 1010,187" fill="none" stroke="#B3541E" stroke-width="26" />
    <text x="1000" y="272" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="30" font-weight="700" fill="#B3541E">38.7%</text>
    <text x="1000" y="298" text-anchor="middle" font-size="11.5" fill="#6E6E6E">2023 年（北京人口蓝皮书口径）</text>
    <text x="848" y="344" font-size="12.5" fill="#2B2B2B">· 2010 年仅 20.9%——每 5 个劳动年龄</text>
    <text x="848" y="366" font-size="12.5" fill="#2B2B2B">　 人抚养 1 人；如今不到 3 人抚养 1 人</text>
    <text x="848" y="394" font-size="12.5" fill="#6E6E6E">· 仍处于"人口机会窗口期"尾声</text>
    <text x="848" y="416" font-size="12.5" fill="#6E6E6E">　（总抚养比 &lt;50%）——蓝皮书判断</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,466 H1208 A12,12 0 0 1 1220,478 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V478 A12,12 0 0 1 72,466 Z" />
  <text x="90" y="500" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页结论</text>
  <text x="90" y="532" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">劳动年龄人口 2020-2024 四年减少约 92 万（1500→1408万），降幅集中在制造业与一般服务业岗位人群——与疏解政策方向一致；</text>
  <text x="90" y="560" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">但同期的 GDP 仍保持 5%+ 增长（人均 GDP 全国省级第一）——北京用"提质"对冲"减量"，劳动生产率是最後防线。</text>
  <text x="90" y="600" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">0-14 占比稳定（10.5→12.0%）说明少儿端有二孩脉冲托底，真正的塌陷在劳动年龄端。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京统计局公报(A)·六普/七普(A)·人口蓝皮书2024(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">06 / 20</text>
</svg>