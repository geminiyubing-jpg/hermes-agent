<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">南水北调：百亿立方米的十年账本</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">2014.12.27 通水 → 2024.6.12 累计进京 100 亿 m³——北京供水的第二支柱</text>

  
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="400" x2="760" y2="400" />
      <line x1="100" y1="340" x2="760" y2="340" stroke-dasharray="4,4" />
      <line x1="100" y1="280" x2="760" y2="280" stroke-dasharray="4,4" />
      <line x1="100" y1="220" x2="760" y2="220" stroke-dasharray="4,4" />
      <line x1="100" y1="160" x2="760" y2="160" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="404">0</text><text x="94" y="344">20亿</text><text x="94" y="284">40亿</text>
      <text x="94" y="224">60亿</text><text x="94" y="164">80亿</text>
    </g>
    
    <polyline points="130,385 200,355 270,310 340,274 410,244 480,215 550,185 620,155 690,135 750,124" fill="none" stroke="#2E6E8E" stroke-width="3.5" />
    <g fill="#2E6E8E">
      <circle cx="270" cy="310" r="5" /><circle cx="410" cy="244" r="5" /><circle cx="750" cy="124" r="7" fill="#B3541E" />
    </g>
    <g font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#2B2B2B">
      <text x="230" y="298">2017: 30亿</text>
      <text x="375" y="232">2019: 52亿</text>
      <text x="668" y="112" font-weight="700" fill="#B3541E">2024.6: 100亿 ★</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="130" y="420">2014</text><text x="270" y="420">2017</text><text x="410" y="420">2019</text>
      <text x="550" y="420">2021</text><text x="690" y="420">2023</text><text x="750" y="420">24</text>
    </g>
    <text x="430" y="444" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">年均净进京 ~11-12 亿 m³ ≈ 北京全年用水的 40%</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M832,110 H1208 A12,12 0 0 1 1220,122 V446 A12,12 0 0 1 1208,458 H832 A12,12 0 0 1 820,446 V122 A12,12 0 0 1 832,110 Z" />
    <text x="848" y="142" font-size="15" font-weight="700" fill="#2E6E8E">这 100 亿 m³ 改变了什么</text>
    <text x="848" y="174" font-size="13" fill="#2B2B2B" font-weight="600">① 供水结构再造</text>
    <text x="868" y="196" font-size="12.5" fill="#6E6E6E">城市供水"五水联调"：外调水/地表水/</text>
    <text x="868" y="218" font-size="12.5" fill="#6E6E6E">地下水/再生水/雨洪水</text>
    <text x="848" y="248" font-size="13" fill="#2B2B2B" font-weight="600">② 密云水库复活</text>
    <text x="868" y="270" font-size="12.5" fill="#6E6E6E">蓄水从不足 10 亿 m³ → 35.81 亿</text>
    <text x="868" y="292" font-size="12.5" fill="#6E6E6E">（2024，历史新高）——南水反向补水</text>
    <text x="848" y="322" font-size="13" fill="#2B2B2B" font-weight="600">③ 直接受益人口 1100 万+</text>
    <text x="868" y="344" font-size="12.5" fill="#6E6E6E">自来水硬度下降、水质提升</text>
    <path fill="#F0F5F3" d="M856,364 H1184 A8,8 0 0 1 1192,372 V432 A8,8 0 0 1 1184,440 H856 A8,8 0 0 1 848,432 V372 A8,8 0 0 1 856,364 Z" />
    <text x="1020" y="390" text-anchor="middle" font-size="12.5" fill="#1F5C4D" font-weight="600">全国棋局：东中线一期累计调水 900亿+ m³</text>
    <text x="1020" y="414" text-anchor="middle" font-size="12" fill="#6E6E6E">生态补水 131 亿 m³ 复苏华北河湖</text>
  </g>

  
  <path fill="#2E6E8E" d="M72,478 H1208 A12,12 0 0 1 1220,490 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V490 A12,12 0 0 1 72,478 Z" />
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F5E9C8">本页结论</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F0F5">南水把北京从"自产水 21 亿 vs 用水 36 亿"的死账中解出来——但依赖度也变成结构性风险：丹江口来水波动、干线检修、沿线省份需求增长都在同一根管道上排队。</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F0F5">因此官方表述始终是"多水源互备"而非"南水依赖"——二期工程（引江补汉）在建，属于把鸡蛋再添一个篮子。</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#F5E9C8" font-weight="600">密云 35.81 亿新高是最有说服力的"水库级"证据：本地水+外调水第一次同时充盈。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：发改委(A)·北京市水务局(A)·新华网(A-)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">14 / 20</text>
</svg>