<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">寿命之冠与老龄化前景推演</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">预期寿命 82.5 岁（2020）全国最高——把老龄化"既推快又拉长"</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <text x="80" y="130" font-size="15" font-weight="600" fill="#2E6E8E">北京人均预期寿命（岁）</text>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="380" x2="620" y2="380" />
      <line x1="100" y1="320" x2="620" y2="320" stroke-dasharray="4,4" />
      <line x1="100" y1="260" x2="620" y2="260" stroke-dasharray="4,4" />
      <line x1="100" y1="200" x2="620" y2="200" stroke-dasharray="4,4" />
      <line x1="100" y1="150" x2="620" y2="150" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="384">70</text><text x="94" y="324">75</text><text x="94" y="264">80</text><text x="94" y="204">84</text>
    </g>
    
    <polyline points="140,364 260,358 380,323 500,281 600,262" fill="none" stroke="#2E6E8E" stroke-width="3.5" />
    <g fill="#2E6E8E">
      <circle cx="140" cy="364" r="5" /><circle cx="260" cy="358" r="5" /><circle cx="380" cy="323" r="5" />
      <circle cx="500" cy="281" r="5" /><circle cx="600" cy="262" r="6" fill="#1F5C4D" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#2B2B2B" text-anchor="middle">
      <text x="140" y="348">71.9</text><text x="260" y="342">72.9</text><text x="380" y="307">76.1</text>
      <text x="500" y="265">80.2</text><text x="600" y="246" fill="#1F5C4D">82.5</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="140" y="398">1982</text><text x="260" y="398">1990</text><text x="380" y="398">2000</text>
      <text x="500" y="398">2010</text><text x="600" y="398">2020</text>
    </g>
    <text x="360" y="420" text-anchor="middle" font-size="12" fill="#9B9B9B">40 年 +10.6 岁——全球大都市最快改善之一</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M672,110 H1208 A12,12 0 0 1 1220,122 V406 A12,12 0 0 1 1208,418 H672 A12,12 0 0 1 660,406 V122 A12,12 0 0 1 672,110 Z" />
    <text x="688" y="142" font-size="15" font-weight="700" fill="#B3541E">2030 推演（小爱测算，C 级）</text>
    <path fill="#F0F5F3" d="M696,158 H1184 A8,8 0 0 1 1192,166 V196 A8,8 0 0 1 1184,204 H696 A8,8 0 0 1 688,196 V166 A8,8 0 0 1 696,158 Z" />
    <text x="940" y="186" text-anchor="middle" font-size="13" fill="#2B2B2B">60+ 占比：23.5%(2024) → <tspan font-weight="700" fill="#B3541E">~28-30%(2030)</tspan></text>
    <text x="688" y="230" font-size="12.5" fill="#6E6E6E">· 驱动：1963-1970 出生队列（年均 ~30 万）跨入 60+</text>
    <text x="688" y="254" font-size="12.5" fill="#6E6E6E">· 缓冲：1970s 生人仍处劳动年龄；外来补充假设不变</text>
    <text x="688" y="278" font-size="12.5" fill="#6E6E6E">· 65+ 占比将达 ~20%：进入"超级老龄化"（&gt;21% 为超）</text>
    <path fill="#F8EDE8" d="M696,294 H1184 A8,8 0 0 1 1192,302 V332 A8,8 0 0 1 1184,340 H696 A8,8 0 0 1 688,332 V302 A8,8 0 0 1 696,294 Z" />
    <text x="940" y="316" text-anchor="middle" font-size="13" fill="#2B2B2B">劳动年龄：1408 万(2024) → <tspan font-weight="700" fill="#B3541E">~1300-1340 万(2030)</tspan></text>
    <text x="940" y="334" text-anchor="middle" font-size="11.5" fill="#6E6E6E">每年再减 10-18 万</text>
    <text x="688" y="368" font-size="12.5" fill="#6E6E6E">· 高龄化（80+）加速：2030 约 70-80 万 → 养老照护</text>
    <text x="688" y="392" font-size="12.5" fill="#6E6E6E">  压力从"钱"转向"人"（照护劳动力缺口）</text>
  </g>

  
  <path fill="#2E6E8E" d="M72,436 H1208 A12,12 0 0 1 1220,448 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V448 A12,12 0 0 1 72,436 Z" />
  <text x="90" y="472" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F5E9C8">长寿是把双刃剑</text>
  <text x="90" y="504" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F0F5">· 82.5 岁寿命 = 全国最长的健康资本存量——"长寿红利"（低龄老人再就业/消费）是全国最富开采价值的矿；</text>
  <text x="90" y="532" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F0F5">· 但同一数字也意味着：退休后平均 20+ 年的养老金/医疗支付期——在 TFR 0.87 的缴费人口基础上，现收现付制的压力全国最大；</text>
  <text x="90" y="560" font-family="'PingFang SC', sans-serif" font-size="14" fill="#E8F0F5">· 北京的特殊缓冲：养老金给付能力全国最强（人均 GDP 第一+财政转移承受力），真正的短板是照护人力而非资金。</text>
  <text x="90" y="600" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#F5E9C8" font-weight="600">与日本对照：北京 2024 年的老龄化水平 ≈ 东京 2005 年前后——但北京富得更快、老得更快，"未富先老"在全国范围内北京最不典型，压力形态最典型。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京统计局(A)·推演为小爱测算(C，方法与假设见备注)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">10 / 20</text>
</svg>