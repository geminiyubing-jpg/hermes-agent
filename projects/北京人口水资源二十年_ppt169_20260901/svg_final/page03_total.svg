<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C4D" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">人口总量二十年：狂飙 → 疏解 → 平台</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">2000-2024 常住人口完整序列（万人，北京统计局历年公报）</text>

  
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="460" x2="1180" y2="460" />
      <line x1="100" y1="390" x2="1180" y2="390" stroke-dasharray="4,4" />
      <line x1="100" y1="320" x2="1180" y2="320" stroke-dasharray="4,4" />
      <line x1="100" y1="250" x2="1180" y2="250" stroke-dasharray="4,4" />
      <line x1="100" y1="180" x2="1180" y2="180" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="464">1400</text><text x="94" y="394">1600</text><text x="94" y="324">1800</text>
      <text x="94" y="254">2000</text><text x="94" y="184">2200</text>
    </g>
    
    <rect x="100" y="170" width="470" height="290" fill="#C9A227" opacity="0.08" />
    <rect x="570" y="170" width="300" height="290" fill="#B3541E" opacity="0.08" />
    <rect x="870" y="170" width="310" height="290" fill="#1F5C4D" opacity="0.08" />
    <text x="335" y="192" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12.5" fill="#A08318" font-weight="600">扩张期 2000-2016（+807万）</text>
    <text x="720" y="192" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12.5" fill="#B3541E" font-weight="600">疏解期 2017-2019</text>
    <text x="1025" y="192" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12.5" fill="#1F5C4D" font-weight="600">平台期 2020-2024</text>
    
    <polyline points="110,431 190,405 280,352 350,322 420,300 450,299 480,299 520,308 550,308 600,281 650,281 700,282 750,282 780,282" fill="none" stroke="#1F5C4D" stroke-width="3.5" stroke-linejoin="round" />
    
    <g font-family="'PingFang SC', sans-serif" font-size="11" fill="#2B2B2B">
      <circle cx="110" cy="431" r="4" fill="#1F5C4D" /><text x="102" y="452">2000: 1363.6</text>
      <circle cx="280" cy="352" r="4" fill="#1F5C4D" /><text x="252" y="374">2010六普: 1961.2</text>
      <circle cx="450" cy="299" r="5" fill="#A08318" /><text x="415" y="288">2016峰值: 2172.9</text>
      <circle cx="550" cy="308" r="4" fill="#B3541E" /><text x="518" y="330">2019: 2153.6</text>
      <circle cx="600" cy="281" r="5" fill="#1F5C4D" /><text x="565" y="272">2020七普: 2189.3</text>
      <circle cx="780" cy="282" r="5" fill="#B3541E" /><text x="700" y="270">2024: 2183.2</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="110" y="478">2000</text><text x="190" y="478">2005</text><text x="280" y="478">2010</text>
      <text x="380" y="478">2013</text><text x="480" y="478">2016</text><text x="570" y="478">2018</text>
      <text x="660" y="478">2020</text><text x="760" y="478">2022</text><text x="850" y="478">2024</text>
    </g>
    <text x="640" y="500" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">2020 年跳升 35.7 万为七普口径修正（普查覆盖更全），非真实增长</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#2B2B2B" d="M72,516 H1208 A12,12 0 0 1 1220,528 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V528 A12,12 0 0 1 72,516 Z" />
    <text x="90" y="550" font-size="15" font-weight="600" fill="#C9A227">本页结论</text>
    <text x="90" y="580" font-size="14" fill="#F0F0F0">① 扩张期 16 年 +807 万（年均 50 万）由外来人口驱动——首都磁极效应；疏解期三年 -17 万（主动减量，疏解非首都功能）；</text>
    <text x="90" y="608" font-size="14" fill="#F0F0F0">② 平台期本质：机械增长归零 + 自然增长趋零（2022 户籍首次 -0.05‰）——北京主动选择停止扩张，全国少见的"逆增长一线"。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京市统计局历年统计公报、六普/七普公报（A 级）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">03 / 20</text>
</svg>