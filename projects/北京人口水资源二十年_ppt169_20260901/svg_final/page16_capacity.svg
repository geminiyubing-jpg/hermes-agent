<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">承载力再评估：「水多了，人少了」的悖论</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">"以水定人"的水约束松了绑，人口结构却成了新约束——北京的战略位置悄然调换</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M72,112 H1208 A12,12 0 0 1 1220,124 V370 A12,12 0 0 1 1208,382 H72 A12,12 0 0 1 60,370 V124 A12,12 0 0 1 72,112 Z" />
    
    <line x1="640" y1="150" x2="640" y2="330" stroke="#9B9B9B" stroke-width="4" />
    <line x1="240" y1="180" x2="1040" y2="180" stroke="#9B9B9B" stroke-width="5" />
    <circle cx="640" cy="150" r="10" fill="#C9A227" />
    
    <line x1="240" y1="180" x2="240" y2="230" stroke="#9B9B9B" stroke-width="2" />
    <path fill="#2E6E8E" d="M147,230 H333 A7,7 0 0 1 340,237 V237 A7,7 0 0 1 333,244 H147 A7,7 0 0 1 140,237 V237 A7,7 0 0 1 147,230 Z" />
    <path fill="#E8F0F5" d="M158,244 H322 A8,8 0 0 1 330,252 V312 A8,8 0 0 1 322,320 H158 A8,8 0 0 1 150,312 V252 A8,8 0 0 1 158,244 Z" />
    <text x="240" y="272" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E6E8E">水约束 ↓ 松绑</text>
    <text x="240" y="294" text-anchor="middle" font-size="11.5" fill="#6E6E6E">五水联调+储备回升</text>
    <text x="240" y="312" text-anchor="middle" font-size="11.5" fill="#6E6E6E">支撑 2300 万有余</text>
    
    <line x1="1040" y1="180" x2="1040" y2="230" stroke="#9B9B9B" stroke-width="2" />
    <path fill="#B3541E" d="M947,230 H1133 A7,7 0 0 1 1140,237 V237 A7,7 0 0 1 1133,244 H947 A7,7 0 0 1 940,237 V237 A7,7 0 0 1 947,230 Z" />
    <path fill="#F8EDE8" d="M958,244 H1122 A8,8 0 0 1 1130,252 V312 A8,8 0 0 1 1122,320 H958 A8,8 0 0 1 950,312 V252 A8,8 0 0 1 958,244 Z" />
    <text x="1040" y="272" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B3541E">人约束 ↑ 收紧</text>
    <text x="1040" y="294" text-anchor="middle" font-size="11.5" fill="#6E6E6E">劳动年龄 4 年 -92 万</text>
    <text x="1040" y="312" text-anchor="middle" font-size="11.5" fill="#6E6E6E">自然增长转负</text>
    <text x="640" y="368" text-anchor="middle" font-size="13" fill="#6E6E6E">十年前：水是紧约束、人是增长项 —— 现在：水有余量、人成稀缺</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M72,400 H620 A12,12 0 0 1 632,412 V614 A12,12 0 0 1 620,626 H72 A12,12 0 0 1 60,614 V412 A12,12 0 0 1 72,400 Z" />
    <text x="88" y="432" font-size="15" font-weight="700" fill="#2E6E8E">水账：约束松了多少</text>
    <text x="88" y="464" font-size="13" fill="#2B2B2B">· 调水前自产水 ~21亿 + 超采 15亿 = 勉强 36亿</text>
    <text x="88" y="490" font-size="13" fill="#2B2B2B">· 调水后：自产 21 + 南水 12 + 再生水 ~12 + 雨洪</text>
    <text x="88" y="516" font-size="13" fill="#2B2B2B">　 → 可持续供给 40亿+，且地下水停止透支</text>
    <path fill="#F0F5F3" d="M96,534 H596 A8,8 0 0 1 604,542 V598 A8,8 0 0 1 596,606 H96 A8,8 0 0 1 88,598 V542 A8,8 0 0 1 96,534 Z" />
    <text x="346" y="560" text-anchor="middle" font-size="13" fill="#1F5C4D" font-weight="600">按人均 150-180 m³ 的超大城市标准</text>
    <text x="346" y="586" text-anchor="middle" font-size="13.5" fill="#1F5C4D" font-weight="700">2400-2600 万人的供水能力（有冗余）</text>

    <path fill="#2B2B2B" d="M660,400 H1208 A12,12 0 0 1 1220,412 V614 A12,12 0 0 1 1208,626 H660 A12,12 0 0 1 648,614 V412 A12,12 0 0 1 660,400 Z" />
    <text x="676" y="432" font-size="15" font-weight="700" fill="#F5E9C8">人账：稀缺到什么程度</text>
    <text x="676" y="464" font-size="13" fill="#F0F0F0">· 劳动年龄人口：1500 万(2020)→1408 万(2024)</text>
    <text x="676" y="490" font-size="13" fill="#F0F0F0">· 每年新增 60+：25-30 万（婴儿潮到期）</text>
    <text x="676" y="516" font-size="13" fill="#F0F0F0">· 养老照护缺口：全国性难题在北京更尖锐</text>
    <text x="676" y="546" font-size="13.5" fill="#F5E9C8" font-weight="600">悖论的实质：北京第一次需要"抢人"</text>
    <text x="676" y="572" font-size="13" fill="#F0F0F0">而不是"控人"——但制度惯性还在控人轨道上</text>
    <text x="676" y="598" font-size="12.5" fill="#C7C7C7">（政策转折的推理见 P17-19）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">账本口径：小爱基于公报数据测算(C)；供水能力为水务系统通行估算方法</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">16 / 20</text>
</svg>