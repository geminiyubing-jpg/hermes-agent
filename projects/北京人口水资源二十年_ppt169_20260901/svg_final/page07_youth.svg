<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">年轻人的出走：占比腰斩的真相</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">20-29 岁常住人口 21.3% → 11.4%（2015-2024）——北京人才磁极在退潮</text>

  
  <g>
    <g stroke="#DFE7E4" stroke-width="1">
      <line x1="100" y1="430" x2="740" y2="430" />
      <line x1="100" y1="370" x2="740" y2="370" stroke-dasharray="4,4" />
      <line x1="100" y1="310" x2="740" y2="310" stroke-dasharray="4,4" />
      <line x1="100" y1="250" x2="740" y2="250" stroke-dasharray="4,4" />
      <line x1="100" y1="190" x2="740" y2="190" stroke-dasharray="4,4" />
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="end">
      <text x="94" y="434">0%</text><text x="94" y="374">5%</text><text x="94" y="314">10%</text>
      <text x="94" y="254">15%</text><text x="94" y="194">20%</text>
    </g>
    
    <polyline points="130,198 190,214 250,226 310,239 370,241 430,275 490,282 550,298 610,308 670,314" fill="none" stroke="#B3541E" stroke-width="3.5" />
    
    <line x1="130" y1="322" x2="670" y2="322" stroke="#1F5C4D" stroke-width="2" stroke-dasharray="10,5" />
    <text x="580" y="344" font-family="'PingFang SC', sans-serif" font-size="12" fill="#1F5C4D">全国平均 ~10.56%（2024）</text>
    <g font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#2B2B2B">
      <circle cx="130" cy="198" r="5" fill="#B3541E" /><text x="110" y="188">2015: 21.3%</text>
      <circle cx="430" cy="275" r="5" fill="#B3541E" /><text x="382" y="266">2020: 14.9%</text>
      <circle cx="670" cy="314" r="6" fill="#8C3A1A" /><text x="628" y="306">2024: 11.4%</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="130" y="450">2015</text><text x="250" y="450">2017</text><text x="370" y="450">2019</text>
      <text x="490" y="450">2021</text><text x="610" y="450">2023</text><text x="670" y="450">24</text>
    </g>
    
    <line x1="430" y1="185" x2="430" y2="275" stroke="#8C3A1A" stroke-width="1" stroke-dasharray="3,3" />
    <text x="445" y="196" font-family="'PingFang SC', sans-serif" font-size="11" fill="#8C3A1A">2020 年单年 -55 万人</text>
    <text x="445" y="212" font-family="'PingFang SC', sans-serif" font-size="11" fill="#8C3A1A">（380.5→325.5 万）</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M812,110 H1208 A12,12 0 0 1 1220,122 V446 A12,12 0 0 1 1208,458 H812 A12,12 0 0 1 800,446 V122 A12,12 0 0 1 812,110 Z" />
    <text x="828" y="142" font-size="15" font-weight="700" fill="#B3541E">为什么年轻人离开？</text>
    <text x="828" y="174" font-size="13" fill="#2B2B2B" font-weight="600">① 疏解的副作用</text>
    <text x="848" y="196" font-size="12.5" fill="#6E6E6E">批发零售/制造/建筑业的年轻岗位</text>
    <text x="848" y="218" font-size="12.5" fill="#6E6E6E">随产业外迁（2017-2020 主力）</text>
    <text x="828" y="248" font-size="13" fill="#2B2B2B" font-weight="600">② 户籍与成本门槛</text>
    <text x="848" y="270" font-size="12.5" fill="#6E6E6E">落户难+居住成本全国顶级——</text>
    <text x="848" y="292" font-size="12.5" fill="#6E6E6E">"北漂性价比"十年持续下降</text>
    <text x="828" y="322" font-size="13" fill="#2B2B2B" font-weight="600">③ 竞争城市的虹吸</text>
    <text x="848" y="344" font-size="12.5" fill="#6E6E6E">杭州/成都/长沙新一线崛起+</text>
    <text x="848" y="366" font-size="12.5" fill="#6E6E6E">沪上落户放宽（2021-24 年均 27 万+）</text>
    <path fill="#F8EDE8" d="M836,386 H1184 A8,8 0 0 1 1192,394 V436 A8,8 0 0 1 1184,444 H836 A8,8 0 0 1 828,436 V394 A8,8 0 0 1 836,386 Z" />
    <text x="1010" y="410" text-anchor="middle" font-size="12.5" fill="#B3541E" font-weight="600">对照：上海落户 2021 年骤增 78%</text>
    <text x="1010" y="432" text-anchor="middle" font-size="12" fill="#6E6E6E">北京同期反而收紧（13.94 万/2024）</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,478 H1208 A12,12 0 0 1 1220,490 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V490 A12,12 0 0 1 72,478 Z" />
  <text x="90" y="512" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">本页结论</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">年轻人占比从"大幅高于全国"回落到"全国平均水平"，意味着北京失去了年龄结构的独特优势——这是老龄化加速的另一半真相：</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">分子（老人）在涨的同时，分母端的年轻血液补给被掐住。未来政策的全部张力就在这里：既要总量不破线，又要留住年轻生产力（P18-19）。</text>
  <text x="90" y="606" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">其他年龄段（19-/30-39/40-49）占比十年基本平稳——变动的就是"两端"。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：经济观察报引《北京统计年鉴》2015-2024(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">07 / 20</text>
</svg>