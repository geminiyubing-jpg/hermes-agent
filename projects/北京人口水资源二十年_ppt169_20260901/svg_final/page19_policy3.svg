<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F8F7" />
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">政策前瞻 III：应对老龄化与区域协同</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E6E6E">养老应对 × 引才争夺 × 京津冀分流的组合拳</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#DFE7E4" d="M72,112 H421 A12,12 0 0 1 433,124 V410 A12,12 0 0 1 421,422 H72 A12,12 0 0 1 60,410 V124 A12,12 0 0 1 72,112 Z" />
    <path fill="#C9A227" d="M72,112 H421 A12,12 0 0 1 433,124 V144 A12,12 0 0 1 421,156 H72 A12,12 0 0 1 60,144 V124 A12,12 0 0 1 72,112 Z" />
    <text x="246" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">支柱一 · 养老组合拳</text>
    <text x="88" y="184" font-size="13" fill="#2B2B2B" font-weight="600">钱：全国统筹+财政缓冲</text>
    <text x="108" y="208" font-size="12.5" fill="#6E6E6E">北京养老基金积累全国最厚，</text>
    <text x="108" y="230" font-size="12.5" fill="#6E6E6E">资金端风险最小</text>
    <text x="88" y="260" font-size="13" fill="#2B2B2B" font-weight="600">人：延迟退休+银发就业</text>
    <text x="108" y="284" font-size="12.5" fill="#6E6E6E">2025 起全国渐进式延迟；</text>
    <text x="108" y="306" font-size="12.5" fill="#6E6E6E">低龄老人（60-69）再开发</text>
    <text x="88" y="336" font-size="13" fill="#2B2B2B" font-weight="600">照护：最大缺口项</text>
    <text x="108" y="360" font-size="12.5" fill="#6E6E6E">养老护理员缺口以十万计——</text>
    <text x="108" y="382" font-size="12.5" fill="#6E6E6E">可能倒逼照护类落户/用工开放</text>

    <path fill="#FFFFFF" stroke="#DFE7E4" d="M465,112 H814 A12,12 0 0 1 826,124 V410 A12,12 0 0 1 814,422 H465 A12,12 0 0 1 453,410 V124 A12,12 0 0 1 465,112 Z" />
    <path fill="#1F5C4D" d="M465,112 H814 A12,12 0 0 1 826,124 V144 A12,12 0 0 1 814,156 H465 A12,12 0 0 1 453,144 V124 A12,12 0 0 1 465,112 Z" />
    <text x="639" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">支柱二 · 精准引才</text>
    <text x="481" y="184" font-size="13" fill="#2B2B2B" font-weight="600">对象：青年+高技能</text>
    <text x="501" y="208" font-size="12.5" fill="#6E6E6E">三大科学城/自贸区/亦庄——</text>
    <text x="501" y="230" font-size="12.5" fill="#6E6E6E">定向人才指标（已施行）</text>
    <text x="481" y="260" font-size="13" fill="#2B2B2B" font-weight="600">工具：落户+住房+服务包</text>
    <text x="501" y="284" font-size="12.5" fill="#6E6E6E">人才公寓/共有产权倾斜/</text>
    <text x="501" y="306" font-size="12.5" fill="#6E6E6E">子女教育配套</text>
    <text x="481" y="336" font-size="13" fill="#2B2B2B" font-weight="600">生育支持：加码中</text>
    <text x="501" y="360" font-size="12.5" fill="#6E6E6E">多子女家庭购房/入学倾斜——</text>
    <text x="501" y="382" font-size="12.5" fill="#6E6E6E">对冲 TFR 0.87（效果待验）</text>

    <path fill="#FFFFFF" stroke="#DFE7E4" d="M858,112 H1207 A12,12 0 0 1 1219,124 V410 A12,12 0 0 1 1207,422 H858 A12,12 0 0 1 846,410 V124 A12,12 0 0 1 858,112 Z" />
    <path fill="#2E6E8E" d="M858,112 H1207 A12,12 0 0 1 1219,124 V144 A12,12 0 0 1 1207,156 H858 A12,12 0 0 1 846,144 V124 A12,12 0 0 1 858,112 Z" />
    <text x="1032" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">支柱三 · 区域协同分流</text>
    <text x="874" y="184" font-size="13" fill="#2B2B2B" font-weight="600">雄安：国家级分流阀</text>
    <text x="894" y="208" font-size="12.5" fill="#6E6E6E">央属机构/高校/医院疏解——</text>
    <text x="894" y="230" font-size="12.5" fill="#6E6E6E">"人随产业走"的第二增长极</text>
    <text x="874" y="260" font-size="13" fill="#2B2B2B" font-weight="600">通州：市属分流</text>
    <text x="894" y="284" font-size="12.5" fill="#6E6E6E">行政办公区外迁带动东部</text>
    <text x="894" y="306" font-size="12.5" fill="#6E6E6E">人口带（通州+北三县）</text>
    <text x="874" y="336" font-size="13" fill="#2B2B2B" font-weight="600">通勤圈：功能外溢</text>
    <text x="894" y="360" font-size="12.5" fill="#6E6E6E">环京通勤圈承接居住功能——</text>
    <text x="894" y="382" font-size="12.5" fill="#6E6E6E">"北京减量"与"城市群扩容"并行</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,440 H1208 A12,12 0 0 1 1220,452 V614 A12,12 0 0 1 1208,626 H72 A12,12 0 0 1 60,614 V452 A12,12 0 0 1 72,440 Z" />
  <text x="90" y="476" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C9A227">组合拳的内在时序（小爱推演）</text>
  <text x="90" y="510" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">2025-2027：养老与照护政策加码期（老龄化率冲 25%+）；服务同权试点扩围（居住证升级）——存量改革为主；</text>
  <text x="90" y="538" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">2028-2030：劳动力压力显性化期——若 20-39 岁人口再降 50 万+，引才政策大概率实质加码（落户通道放宽概率上修至 50%）；</text>
  <text x="90" y="566" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F0F0F0">2030+：京津冀"功能-人口"再平衡成型——北京中心城区人口或稳定在 1100 万内，城市圈总人口（含环京）持续增长。</text>
  <text x="90" y="602" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">关键监测指标：科学城就业人口 / 养老护理员缺口数据 / 雄安人口净迁入 —— 三条数据线决定推演修正方向。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">政策推演：小爱基于官方文件与公开数据(C)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#1F5C4D">19 / 20</text>
</svg>