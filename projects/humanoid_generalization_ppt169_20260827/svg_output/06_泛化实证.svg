<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">泛化实证：架构先验值多少钱</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Cosmos 3 技术报告的对照实验——同数据 · 同算力 · 不同起点</text>
  </g>

  <!-- controlled experiment -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="240" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="152" font-size="15" font-weight="bold" fill="#0B6E99">实验设计：排除一切混杂因素</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="188">两组 DROID 机器人策略，用<tspan font-weight="bold">完全相同的训练配方、数据、算力</tspan>，唯一区别是起点：</text>
    </g>
    <!-- comparison bars -->
    <line x1="480" y1="320" x2="1080" y2="320" stroke="#8494AB" stroke-width="1.5"/>
    <g font-size="13.5">
      <text x="84" y="246">A 组：从普通基座检查点出发</text>
      <rect x="480" y="228" width="253" height="26" rx="4" fill="#8494AB" opacity="0.6"/>
      <text x="741" y="247" font-family="'SF Mono',monospace" fill="#51617A">28.1%</text>

      <text x="84" y="292">B 组：从全模态世界模型检查点出发</text>
      <rect x="480" y="274" width="331" height="26" rx="4" fill="#1E8E3E"/>
      <text x="819" y="293" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">36.8%</text>
    </g>
    <text x="84" y="348" font-size="14.5" fill="#1E8E3E" font-weight="bold">+8.7 个百分点 —— 纯粹来自"骨架吃过物理数据"的架构先验，与规模无关</text>
  </g>

  <!-- what this means -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="384" width="572" height="274" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="84" y="418" font-size="15" font-weight="bold" fill="#1E8E3E">这个数字的含金量</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="452">· 在机器人领域，+8.7pp 意味着每 12 次尝试</text>
      <text x="104" y="478">多成功 1 次——工厂产线上就是盈亏分界</text>
      <text x="84" y="518">· "零额外数据零额外算力"获得——</text>
      <text x="104" y="544">等于白送了一个预训练红利</text>
      <text x="84" y="584" fill="#1E8E3E" font-weight="bold">首次定量证明：物理先验可以"继承"，</text>
      <text x="104" y="610" fill="#1E8E3E" font-weight="bold">不必每个任务从零学</text>
    </g>

    <rect x="652" y="384" width="568" height="274" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="676" y="418" font-size="15" font-weight="bold" fill="#C77800">配套战绩（公开榜单）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="452">· RoboArena：策略模型排名第一</text>
      <text x="676" y="486">· Physics-IQ：视频模型"真懂物理"榜第一</text>
      <text x="676" y="520">· R-Bench：机器人视频生成第一</text>
      <text x="676" y="554">· PAI-Bench：物理 AI 综合第一</text>
      <text x="676" y="588" fill="#C77800" font-weight="bold">· Artificial Analysis：开源文生图/图生视频第一</text>
      <text x="676" y="624" fill="#51617A" font-size="13">（开源组别；闭源 Sora/Veo 不参评）</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Cosmos 3 技术报告（arXiv 2606.02800）对照实验章节 · RoboArena/Physics-IQ/R-Bench/PAI-Bench 公开榜单</text>
</svg>
