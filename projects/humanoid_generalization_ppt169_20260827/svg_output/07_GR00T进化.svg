<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">GR00T N 系列：人形专用大脑的进化线</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">NVIDIA · 17 个月四代 · 双系统架构一脉相承（Kahneman 快慢认知）</text>
  </g>

  <!-- evolution timeline -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="330" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">四代进化（2025-03 → 2026-04）</text>
    <line x1="120" y1="190" x2="1200" y2="190" stroke="#0B6E99" stroke-width="2.5"/>
    <g>
      <circle cx="180" cy="190" r="7" fill="#0B6E99"/>
      <text x="180" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B6E99">N1</text>
      <text x="180" y="222" text-anchor="middle" font-size="11.5" fill="#8494AB">2025-03</text>
      <rect x="105" y="240" width="150" height="120" rx="8" fill="#E8F1F8"/>
      <text x="180" y="266" text-anchor="middle" font-size="12" fill="#1A2433">首个开放人形基座</text>
      <text x="180" y="290" text-anchor="middle" font-size="12" fill="#1A2433">双系统架构奠基：</text>
      <text x="180" y="312" text-anchor="middle" font-size="12" fill="#1A2433">System2 VLM 慢思考 10Hz</text>
      <text x="180" y="334" text-anchor="middle" font-size="12" fill="#1A2433">System1 DiT 快反射 120Hz</text>

      <circle cx="440" cy="190" r="7" fill="#C77800"/>
      <text x="440" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#C77800">N1.5</text>
      <text x="440" y="222" text-anchor="middle" font-size="11.5" fill="#8494AB">2025-05</text>
      <rect x="365" y="240" width="150" height="120" rx="8" fill="#FBF3E4"/>
      <text x="440" y="266" text-anchor="middle" font-size="12" fill="#1A2433">FLARE 目标函数：</text>
      <text x="440" y="290" text-anchor="middle" font-size="12" fill="#1A2433">从人类第一人称视频学习</text>
      <text x="440" y="312" text-anchor="middle" font-size="12" fill="#1A2433">GR00T-Dreams 合成蓝图</text>
      <text x="440" y="334" text-anchor="middle" font-size="12" fill="#1A2433">语言指令理解跃升</text>

      <circle cx="700" cy="190" r="7" fill="#6D4FC2"/>
      <text x="700" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#6D4FC2">N1.6</text>
      <text x="700" y="222" text-anchor="middle" font-size="11.5" fill="#8494AB">2025-12</text>
      <rect x="625" y="240" width="150" height="120" rx="8" fill="#EFEBF8"/>
      <text x="700" y="266" text-anchor="middle" font-size="12" fill="#1A2433">DiT 翻倍（32 层）</text>
      <text x="700" y="290" text-anchor="middle" font-size="12" fill="#1A2433">全身控制（行走+操作）</text>
      <text x="700" y="312" text-anchor="middle" font-size="12" fill="#1A2433">跨机体数据：G1/Genie1/</text>
      <text x="700" y="334" text-anchor="middle" font-size="12" fill="#1A2433">双臂 YAM</text>

      <circle cx="960" cy="190" r="8" fill="#C0392B"/>
      <text x="960" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">N1.7 ★</text>
      <text x="960" y="222" text-anchor="middle" font-size="11.5" fill="#8494AB">2026-04</text>
      <rect x="885" y="240" width="150" height="120" rx="8" fill="#FBECEA"/>
      <text x="960" y="266" text-anchor="middle" font-size="12" fill="#1A2433">Cosmos-Reason2 骨干</text>
      <text x="960" y="290" text-anchor="middle" font-size="12" fill="#1A2433">（Qwen3-VL 系）</text>
      <text x="960" y="312" text-anchor="middle" font-size="12" fill="#1A2433">EgoScale 登场</text>
      <text x="960" y="334" text-anchor="middle" font-size="12" fill="#C0392B" font-weight="bold">→ 灵巧性缩放律</text>
    </g>
  </g>

  <!-- dual system diagram -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="472" width="1160" height="186" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="504" font-size="15" font-weight="bold" fill="#0B6E99">贯穿四代的核心设计：双系统（人脑认知分工的工程化）</text>
    <g text-anchor="middle">
      <rect x="140" y="524" width="440" height="100" rx="10" fill="#FFFFFF" stroke="#0B6E99"/>
      <text x="360" y="556" font-size="14.5" font-weight="bold" fill="#0B6E99">System 2 · 慢思考（VLM，10Hz）</text>
      <text x="360" y="582" font-size="12.5" fill="#1A2433">看场景、理解指令、拆解任务</text>
      <text x="360" y="606" font-size="12" fill="#51617A">"先想清楚要干什么"</text>

      <rect x="660" y="524" width="440" height="100" rx="10" fill="#FFFFFF" stroke="#C77800"/>
      <text x="880" y="556" font-size="14.5" font-weight="bold" fill="#C77800">System 1 · 快反射（DiT，120Hz）</text>
      <text x="880" y="582" font-size="12.5" fill="#1A2433">连续动作块生成，平滑执行</text>
      <text x="880" y="606" font-size="12" fill="#51617A">"手上功夫不过脑子"</text>
    </g>
    <path d="M 580 574 L 660 574" stroke="#8494AB" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#g1)"/>
    <defs>
      <marker id="g1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB"/>
      </marker>
    </defs>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2503.14734（N1 论文）· research.nvidia.com/labs/gear/gr00t-n1_6（N1.6 官方页）· GitHub NVIDIA/Isaac-GR00T</text>
</svg>
