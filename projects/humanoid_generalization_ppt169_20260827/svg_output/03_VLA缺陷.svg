<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">VLA 的根本缺陷：会描述 ≠ 会预测</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Vision-Language-Action 范式的天花板 · 2022-2025 时代的主流设计</text>
  </g>

  <!-- what is VLA -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="700" height="230" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">VLA 怎么工作（过去三年的标准答案）</text>
    <!-- pipeline -->
    <g text-anchor="middle">
      <rect x="100" y="172" width="150" height="70" rx="10" fill="#E8F1F8"/>
      <text x="175" y="202" font-size="13.5" font-weight="bold" fill="#0B6E99">视觉编码</text>
      <text x="175" y="224" font-size="11.5" fill="#51617A">看到场景</text>
      <rect x="280" y="172" width="150" height="70" rx="10" fill="#E8F1F8"/>
      <text x="355" y="202" font-size="13.5" font-weight="bold" fill="#0B6E99">语言理解</text>
      <text x="355" y="224" font-size="11.5" fill="#51617A">"把杯子放架子上"</text>
      <rect x="460" y="172" width="150" height="70" rx="10" fill="#FBF3E4"/>
      <text x="535" y="202" font-size="13.5" font-weight="bold" fill="#C77800">动作头</text>
      <text x="535" y="224" font-size="11.5" fill="#51617A">输出关节/轨迹</text>
    </g>
    <path d="M 250 207 L 280 207" stroke="#8494AB" stroke-width="2" marker-end="url(#v1)"/>
    <path d="M 430 207 L 460 207" stroke="#8494AB" stroke-width="2" marker-end="url(#v1)"/>
    <defs>
      <marker id="v1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB"/>
      </marker>
    </defs>
    <text x="84" y="278" font-size="13.5" fill="#1A2433">= 给预训练的 VLM（视觉语言模型）外挂一个动作模块</text>
    <text x="84" y="310" font-size="13.5" fill="#1A2433">代表：RT-2 / OpenVLA / GR00T N1 / π0 —— 把 ChatGPT 的架构</text>
    <text x="84" y="336" font-size="13.5" fill="#1A2433">搬到机器人：输出从"词"换成"航点"</text>
  </g>

  <!-- the flaw -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="780" y="118" width="440" height="230" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4"/>
    <text x="804" y="150" font-size="15" font-weight="bold" fill="#C0392B">致命缺陷（NVIDIA 官方博客诊断）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="184">"VLM 骨干学会的是<tspan font-weight="bold" fill="#C0392B">描述世界</tspan>，</text>
      <text x="804" y="212">而不是<tspan font-weight="bold" fill="#C0392B">预测世界怎么演化</tspan>"</text>
      <text x="804" y="256">· 任务依赖"预判场景变化"时直接失效</text>
      <text x="804" y="292">· 需要近乎相同的任务演示（数据贵）</text>
      <text x="804" y="328">· 换场景/换物体 = 重新收集数据</text>
    </g>
  </g>

  <!-- the manifesto -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="378" width="1160" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="412" font-size="15" font-weight="bold" fill="#6D4FC2">2026 年的范式宣言（Jim Fan，Robotics' End Game 演讲）</text>
    <text x="84" y="452" font-size="24" font-weight="bold" fill="#1A2433">"VLAs are dead, long live World Action Models."</text>
    <text x="84" y="486" font-size="14" fill="#51617A">VLA 已死，世界-行动模型万岁。</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="528">翻译成工程语言：骨架要从"语言模型"换成"视频世界模型"——</text>
      <text x="104" y="556">机器人需要的心脏，不是会聊天的，是会<tspan font-weight="bold" fill="#6D4FC2">脑内预演物理后果</tspan>的</text>
      <text x="84" y="598" fill="#C77800" font-weight="bold">与上篇的连接：这正是"预测·行动·地图"内核中"预测"那一环的产业级兑现——</text>
      <text x="104" y="624" fill="#C77800">WAM = 把 LeCun 一直主张的世界模型先验，做成可训练的开源底座</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：NVIDIA Technical Blog《Beyond VLAs: How World Action Models Reshape Robot Manipulation》· 论文《World Action Models are Zero-shot Policies》</text>
</svg>
