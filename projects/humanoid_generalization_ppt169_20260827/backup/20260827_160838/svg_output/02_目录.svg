<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">四部分 · 13 页 · 约 40 分钟 · 承接《空间智能与具身泛化》的续篇</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="140" font-size="15" font-weight="bold" fill="#C0392B">Ⅰ · 范式革命：VLA → WAM</text>
    <rect x="80" y="154" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03</tspan>  VLA 的根本缺陷：会描述世界 ≠ 会预测世界</text>
      <text x="80" y="220"><tspan font-family="'SF Mono',monospace" fill="#8494AB">04</tspan>  WAM 三大优势：杂食数据 · 开放泛化 · 少样本适配</text>
      <text x="80" y="252"><tspan font-family="'SF Mono',monospace" fill="#8494AB">05</tspan>  Cosmos 3：全模态双塔架构详解</text>
      <text x="80" y="284"><tspan font-family="'SF Mono',monospace" fill="#8494AB">06</tspan>  泛化实证：架构先验值多少钱（28.1→36.8）</text>
    </g>

    <text x="80" y="344" font-size="15" font-weight="bold" fill="#C77800">Ⅱ · 三巨头竞速与经验定律</text>
    <rect x="80" y="358" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="392"><tspan font-family="'SF Mono',monospace" fill="#8494AB">07</tspan>  GR00T N 系列进化线：从 N1 到 N1.7</text>
      <text x="80" y="424"><tspan font-family="'SF Mono',monospace" fill="#8494AB">08</tspan>  EgoScale：史上首个机器人灵巧性缩放律</text>
      <text x="80" y="456"><tspan font-family="'SF Mono',monospace" fill="#8494AB">09</tspan>  三巨头对比：GR00T vs Gemini Robotics vs π</text>
    </g>

    <text x="680" y="140" font-size="15" font-weight="bold" fill="#6D4FC2">Ⅲ · 空间泛化的关键实证</text>
    <rect x="680" y="154" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">10</tspan>  Sim2Real 判决：空间随机化是主导因素</text>
      <text x="680" y="220"><tspan font-family="'SF Mono',monospace" fill="#8494AB">11</tspan>  硬件补丁：Figure 03 的触觉+掌内视觉</text>
    </g>

    <text x="680" y="280" font-size="15" font-weight="bold" fill="#1E8E3E">Ⅳ · 收束</text>
    <rect x="680" y="294" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="328"><tspan font-family="'SF Mono',monospace" fill="#8494AB">12</tspan>  全景图：通用泛化的配方</text>
      <text x="680" y="360"><tspan font-family="'SF Mono',monospace" fill="#8494AB">13</tspan>  尾页：清单与观察哨</text>
    </g>
  </g>

  <rect x="80" y="500" width="1140" height="160" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
  <text x="104" y="534" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#C77800">一句话主线</text>
  <text x="104" y="566" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">机器人通用泛化的竞赛，已经从"更大的视觉-语言-动作模型"转向"物理先验的世界模型底座"；</text>
  <text x="104" y="592" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">两条新经验定律（EgoScale 缩放律 + 空间随机化主导律）+ 一个硬件新补丁（触觉闭环）构成当前配方。</text>
  <text x="104" y="630" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8494AB">与上篇《空间智能与具身泛化》呼应：那篇讲"为什么空间更本源"，本篇讲"产业界正在怎么兑现它"</text>
</svg>
