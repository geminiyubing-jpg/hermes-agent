<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">三巨头对比：三条路线的哲学差异</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">GR00T N1.6/N1.7 vs Gemini Robotics 1.5 vs π0.7 · 2026-08 时点</text>
  </g>

  <!-- comparison table -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="380" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <!-- header row -->
    <rect x="84" y="136" width="200" height="44" fill="#EEF2F8" rx="6"/>
    <text x="100" y="164" font-size="14" font-weight="bold" fill="#51617A">维度</text>
    <rect x="292" y="136" width="290" height="44" fill="#EAF5EE" rx="6"/>
    <text x="308" y="164" font-size="14" font-weight="bold" fill="#1E8E3E">NVIDIA GR00T</text>
    <rect x="590" y="136" width="290" height="44" fill="#E8F1F8" rx="6"/>
    <text x="606" y="164" font-size="14" font-weight="bold" fill="#0B6E99">Google Gemini Robotics</text>
    <rect x="888" y="136" width="308" height="44" fill="#EFEBF8" rx="6"/>
    <text x="904" y="164" font-size="14" font-weight="bold" fill="#6D4FC2">Physical Intelligence π</text>

    <g font-size="12.5" fill="#1A2433">
      <text x="100" y="212" font-weight="bold" fill="#51617A" font-size="13">骨干</text>
      <text x="308" y="212">Cosmos Reason + DiT 扩散头</text>
      <text x="606" y="212">Gemini 多模态 LLM</text>
      <text x="904" y="212">PaliGemma 3B + 流匹配</text>

      <text x="100" y="252" font-weight="bold" fill="#51617A" font-size="13">动作生成</text>
      <text x="308" y="252">扩散去噪（连续轨迹）</text>
      <text x="606" y="252">自回归 token（像说话一样）</text>
      <text x="904" y="252">双专家流匹配（VLM+动作共享注意力）</text>

      <text x="100" y="292" font-weight="bold" fill="#51617A" font-size="13">哲学</text>
      <text x="308" y="292">双系统：快慢脑分离（Kahneman）</text>
      <text x="606" y="292">统一模型：先用语言想，再动</text>
      <text x="904" y="292">扩散派：动作是去噪过程非序列</text>

      <text x="100" y="332" font-weight="bold" fill="#51617A" font-size="13">数据策略</text>
      <text x="308" y="332">2 万小时人类视频 + 遥操作 + Isaac 合成</text>
      <text x="606" y="332">Motion Transfer 统一异构平台数据</text>
      <text x="904" y="332">多平台灵巧操作 + DCP 三段式经验</text>

      <text x="100" y="372" font-weight="bold" fill="#51617A" font-size="13">开放度</text>
      <text x="308" y="372" fill="#1E8E3E" font-weight="bold">全开源（商业许可）</text>
      <text x="606" y="372">API 闭源 + On-Device 版</text>
      <text x="904" y="372">OpenPI 研究检查点开放</text>

      <text x="100" y="412" font-weight="bold" fill="#51617A" font-size="13">独门绝技</text>
      <text x="308" y="412">EgoScale 缩放律；跨机体；仿真生态</text>
      <text x="606" y="412">仪器读数（与波士顿动力合作）</text>
      <text x="904" y="412">π0.7 组合泛化（2026-04-16）</text>

      <text x="100" y="452" font-weight="bold" fill="#51617A" font-size="13">微调成本</text>
      <text x="308" y="452">LeRobot 格式 + FLARE 视频后训</text>
      <text x="606" y="452">On-Device：50-100 条演示</text>
      <text x="904" y="452">小样例集（openpi 配方）</text>
    </g>
    <line x1="84" y1="228" x2="1196" y2="228" stroke="#E4EAF3"/>
    <line x1="84" y1="268" x2="1196" y2="268" stroke="#E4EAF3"/>
    <line x1="84" y1="308" x2="1196" y2="308" stroke="#E4EAF3"/>
    <line x1="84" y1="348" x2="1196" y2="348" stroke="#E4EAF3"/>
    <line x1="84" y1="388" x2="1196" y2="388" stroke="#E4EAF3"/>
    <line x1="84" y1="428" x2="1196" y2="428" stroke="#E4EAF3"/>
  </g>

  <!-- pi0.7 highlight -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="524" width="1160" height="134" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.35"/>
    <text x="84" y="556" font-size="15" font-weight="bold" fill="#6D4FC2">π0.7 的"组合泛化"值得单独看（零样本竞赛领跑者）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="588">把不同情境学到的技能<tspan font-weight="bold" fill="#6D4FC2">组合</tspan>起来，解决从未训练过的任务（如"把 X 放进 Y 再关上"从未见过但技能都有）</text>
      <text x="84" y="620">配合 DCP 范式（示范→纠正教练→自主经验）：咖啡机滤芯插入 / 叠没见过的衣物 / 纸箱组装，吞吐量全部翻倍</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：iotdigitaltwinplm 三巨头对比 · blog.pebblous.ai 架构对比 · marktechpost Top-10 · 各官方发布页（2026-04~08）</text>
</svg>
