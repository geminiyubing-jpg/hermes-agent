<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">EgoScale：史上首个机器人灵巧性缩放律</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">GR00T N1.7 的核心发现 · 机器人领域的"Chinchilla 时刻"</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4" d="M72,118 H1208 A12,12 0 0 1 1220,130 V256 A12,12 0 0 1 1208,268 H72 A12,12 0 0 1 60,256 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="154" font-size="17" font-weight="bold" fill="#C0392B">定律内容</text>
    <text x="84" y="190" font-size="15.5" fill="#1A2433">人类第一人称（egocentric）视频数据从 <tspan font-family="'SF Mono',monospace" font-weight="bold" fill="#C0392B">1,000 小时</tspan> 增加到 <tspan font-family="'SF Mono',monospace" font-weight="bold" fill="#C0392B">20,000 小时</tspan>，</text>
    <text x="84" y="222" font-size="15.5" fill="#1A2433">机器人平均任务完成率<tspan font-weight="bold" fill="#C0392B">翻倍以上</tspan> —— 灵巧性随人类视频数据规模可预测地增长。</text>
    <text x="84" y="252" font-size="13" fill="#51617A">N1.7 实际使用 20,854 小时 · 覆盖 20+ 任务类别 · 类比 LLM 的 Chinchilla 缩放律，但对象是"手上功夫"</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,296 H688 A12,12 0 0 1 700,308 V644 A12,12 0 0 1 688,656 H72 A12,12 0 0 1 60,644 V308 A12,12 0 0 1 72,296 Z" />
    <text x="84" y="328" font-size="15" font-weight="bold" fill="#0B6E99">缩放曲线（示意）</text>
    <line x1="140" y1="590" x2="660" y2="590" stroke="#8494AB" stroke-width="1.5" />
    <line x1="140" y1="360" x2="140" y2="590" stroke="#8494AB" stroke-width="1.5" />
    <g font-family="'SF Mono','Menlo',monospace" font-size="11" fill="#8494AB">
      <text x="134" y="594" text-anchor="end">0</text>
      <text x="134" y="415" text-anchor="end">50</text>
      <text x="134" y="364" text-anchor="end">100%</text>
    </g>
    
    <path d="M 160 560 C 260 540 300 520 380 480 C 460 440 520 430 640 420" fill="none" stroke="#C0392B" stroke-width="3.5" />
    <circle cx="160" cy="560" r="5" fill="#C0392B" />
    <text x="160" y="612" text-anchor="middle" font-size="11.5" fill="#51617A" font-family="'PingFang SC',sans-serif">1k h</text>
    <circle cx="640" cy="420" r="6" fill="#1E8E3E" />
    <text x="640" y="612" text-anchor="middle" font-size="11.5" fill="#51617A" font-family="'PingFang SC',sans-serif">20k h</text>
    <text x="640" y="402" text-anchor="middle" font-family="'SF Mono',monospace" font-size="13" font-weight="bold" fill="#1E8E3E">2×+</text>
    <text x="360" y="370" font-size="13" fill="#1A2433" font-family="'PingFang SC',sans-serif">人类第一人称视频（小时，log 轴感）</text>
    <text x="480" y="640" font-size="12" fill="#8494AB" font-family="'PingFang SC',sans-serif">任务完成率随数据量持续爬升，未见饱和</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M732,296 H1208 A12,12 0 0 1 1220,308 V644 A12,12 0 0 1 1208,656 H732 A12,12 0 0 1 720,644 V308 A12,12 0 0 1 732,296 Z" />
    <text x="744" y="328" font-size="15" font-weight="bold" fill="#C77800">为什么这是大事</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="744" y="364">① 数据源革命：人类第一人称视频</text>
      <text x="764" y="390">（头戴相机/Vlog/AR 眼镜）几乎无限，</text>
      <text x="764" y="416">遥操作数据昂贵稀缺——瓶颈被绕开</text>
      <text x="744" y="456">② 可预测性：像 LLM 时代"加卡加数据"</text>
      <text x="764" y="482">一样，机器人第一次有了明确的</text>
      <text x="764" y="508">投入产出公式（多少小时→多少灵巧度）</text>
      <text x="744" y="548">③ 印证上篇论断：人类动作视频承载的</text>
      <text x="764" y="574">正是"前语言的运动智能"——</text>
      <text x="764" y="600" fill="#C77800" font-weight="bold">喂更本源的数据，得到更本源的能力</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：marktechpost Top-10 Physical AI 2026 · NVIDIA GR00T N1.7 发布资料（2026-04-17）· 曲线为示意（论文数据点为 1k 与 20k 两端）</text>
</svg>