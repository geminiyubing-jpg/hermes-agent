<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">Cosmos 3：全模态双塔架构</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">GTC 台北/COMPUTEX 发布 · 一个模型统一四类角色 · arXiv 2606.02800</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H748 A12,12 0 0 1 760,130 V406 A12,12 0 0 1 748,418 H72 A12,12 0 0 1 60,406 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">Mixture-of-Transformers：先想，后动</text>
    
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.4" d="M110,172 H380 A10,10 0 0 1 390,182 V312 A10,10 0 0 1 380,322 H110 A10,10 0 0 1 100,312 V182 A10,10 0 0 1 110,172 Z" />
    <text x="245" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B6E99">推理塔（Reasoner）</text>
    <text x="245" y="230" text-anchor="middle" font-size="12.5" fill="#1A2433">自回归 Transformer</text>
    <text x="245" y="254" text-anchor="middle" font-size="12.5" fill="#1A2433">语言 · 多模态理解</text>
    <text x="245" y="284" text-anchor="middle" font-size="12" fill="#51617A">"现在场上发生了什么"</text>
    <text x="245" y="308" text-anchor="middle" font-size="12" fill="#51617A">离散 token 输出</text>

    
    <path fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4" d="M440,172 H710 A10,10 0 0 1 720,182 V312 A10,10 0 0 1 710,322 H440 A10,10 0 0 1 430,312 V182 A10,10 0 0 1 440,172 Z" />
    <text x="575" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#C77800">生成塔（Generator）</text>
    <text x="575" y="230" text-anchor="middle" font-size="12.5" fill="#1A2433">扩散 Transformer</text>
    <text x="575" y="254" text-anchor="middle" font-size="12.5" fill="#1A2433">图像 · 视频 · 音频 · <tspan font-weight="bold">动作</tspan></text>
    <text x="575" y="284" text-anchor="middle" font-size="12" fill="#51617A">"接下来世界会怎样"</text>
    <text x="575" y="308" text-anchor="middle" font-size="12" fill="#51617A">迭代去噪生成</text>

    <path d="M 390 247 L 430 247" stroke="#8494AB" stroke-width="2.5" marker-end="url(#c1)" />
    <defs>
      <marker id="c1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#8494AB" />
      </marker>
    </defs>
    <text x="84" y="354" font-size="13.5" fill="#1A2433">推理塔可独立调用；生成塔工作时两塔联动——理解引导生成，生成反哺理解</text>
    <text x="84" y="390" font-size="13.5" fill="#0B6E99" font-weight="bold">四合一：VLM + 视频生成器 + 世界模拟器 + 世界-行动模型，无需多模型编排</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M792,118 H1208 A12,12 0 0 1 1220,130 V406 A12,12 0 0 1 1208,418 H792 A12,12 0 0 1 780,406 V130 A12,12 0 0 1 792,118 Z" />
    <text x="804" y="150" font-size="15" font-weight="bold" fill="#6D4FC2">三档部署（同一底座）</text>
    <g font-size="13.5">
      <path fill="#EAF5EE" d="M812,170 H1188 A8,8 0 0 1 1196,178 V226 A8,8 0 0 1 1188,234 H812 A8,8 0 0 1 804,226 V178 A8,8 0 0 1 812,170 Z" />
      <text x="820" y="196" font-weight="bold" fill="#1E8E3E">Edge 4B</text>
      <text x="820" y="220" fill="#1A2433">机载实时控制：Jetson Thor 上 15Hz</text>
      <path fill="#E8F1F8" d="M812,244 H1188 A8,8 0 0 1 1196,252 V300 A8,8 0 0 1 1188,308 H812 A8,8 0 0 1 804,300 V252 A8,8 0 0 1 812,244 Z" />
      <text x="820" y="270" font-weight="bold" fill="#0B6E99">Nano 16B</text>
      <text x="820" y="294" fill="#1A2433">工作站级：RTX PRO 6000 旁路服务</text>
      <path fill="#EFEBF8" d="M812,318 H1188 A8,8 0 0 1 1196,326 V374 A8,8 0 0 1 1188,382 H812 A8,8 0 0 1 804,374 V326 A8,8 0 0 1 812,318 Z" />
      <text x="820" y="344" font-weight="bold" fill="#6D4FC2">Super 64B</text>
      <text x="820" y="368" fill="#1A2433">数据中心：大规模合成数据+推理</text>
    </g>
    <text x="804" y="406" font-size="12.5" fill="#51617A">开源可商用（Linux Foundation OpenMDW-1.1）</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,446 H1208 A12,12 0 0 1 1220,458 V646 A12,12 0 0 1 1208,658 H72 A12,12 0 0 1 60,646 V458 A12,12 0 0 1 72,446 Z" />
    <text x="84" y="478" font-size="15" font-weight="bold" fill="#C77800">训练底料 + 空间专项补课</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="512">· 数据：7.67 亿图像 + 3.48 亿真实动态视频 + 800 万动作样本（操作/驾驶/第一人称运动）</text>
      <text x="84" y="546">· 合成数据五类：物理交互（碰撞/铰接/流体）/ 机器人场景 / 驾驶 / 数字人 / 仓储安全</text>
      <text x="84" y="596" fill="#0B6E99" font-weight="bold">空间理解专项 SFT（对上篇主题的直接回应）：</text>
      <text x="104" y="622">指涉定位（指向目标/自由空间）· 三参照系空间 QA（自我/世界/物体中心的可达性判断）· 跨视角对应 · 透视替换</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2606.02800（Cosmos 3 技术报告）· NVIDIA 官方博客 · 开源：github.com/nvidia/cosmos + HuggingFace nvidia/cosmos3</text>
</svg>