<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">Sim2Real 判决：空间随机化是主导</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">灵巧操作 VLA 的系统实证（arXiv 2603.22876）· 上篇"空间本源"判断的实验级确认</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V386 A12,12 0 0 1 620,398 H72 A12,12 0 0 1 60,386 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">实验设计：给随机化变量"分锅"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="184">Sim2Real 鸿沟 = 仿真与现实的差异导致</text>
      <text x="84" y="212">机器人真机性能暴跌。随机化是对策，</text>
      <text x="84" y="240">但随机化什么？两派变量：</text>
      <path fill="#EAF5EE" d="M112,258 H596 A8,8 0 0 1 604,266 V306 A8,8 0 0 1 596,314 H112 A8,8 0 0 1 104,306 V266 A8,8 0 0 1 112,258 Z" />
      <text x="120" y="282" fill="#1E8E3E" font-weight="bold">空间随机化：</text>
      <text x="240" y="282" fill="#1A2433">物体位置/朝向/布局每次都变</text>
      <text x="120" y="302" fill="#8494AB" font-size="12.5">（几何结构层面）</text>
      <path fill="#EEF2F8" d="M112,324 H596 A8,8 0 0 1 604,332 V372 A8,8 0 0 1 596,380 H112 A8,8 0 0 1 104,372 V332 A8,8 0 0 1 112,324 Z" />
      <text x="120" y="348" fill="#51617A" font-weight="bold">外观随机化：</text>
      <text x="230" y="348" fill="#1A2433">纹理/光照/背景颜色变化</text>
      <text x="120" y="368" fill="#8494AB" font-size="12.5">（视觉渲染层面）</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V386 A12,12 0 0 1 1208,398 H664 A12,12 0 0 1 652,386 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#1E8E3E">判决（论文结论原文）</text>
    <text x="676" y="196" font-size="19" font-weight="bold" fill="#1A2433">"空间域随机化在提升鲁棒性上</text>
    <text x="676" y="228" font-size="19" font-weight="bold" fill="#1E8E3E">扮演主导角色（dominant role）"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="272">外观随机化只提供互补性收益</text>
      <text x="676" y="316" fill="#1E8E3E" font-weight="bold">→ 泛化的瓶颈在几何/空间理解，</text>
      <text x="696" y="342" fill="#1E8E3E" font-weight="bold">不在视觉外观逼真度</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,428 H1208 A12,12 0 0 1 1220,440 V646 A12,12 0 0 1 1208,658 H72 A12,12 0 0 1 60,646 V440 A12,12 0 0 1 72,428 Z" />
    <text x="84" y="462" font-size="15" font-weight="bold" fill="#C77800">三重印证链：空间几何是那道窄门</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="498">① 上篇 SPACE 基准：LLM 空间测试近随机——语言模型缺空间（能力侧证据）</text>
      <text x="84" y="534">② 本实验：让机器人变鲁棒，随机化"空间布局"比随机化"外观"有效得多（对策侧证据）</text>
      <text x="84" y="570">③ Cosmos 3 的 SFT 补课重点：三参照系空间 QA / 可达性判断 / 跨视角对应（产业侧证据）</text>
      <text x="84" y="624" fill="#C77800" font-weight="bold">三个独立来源指向同一结论——通用泛化的钥匙在几何空间理解，与上篇"本源"判断闭环</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2603.22876《Grounding Sim-to-Real Generalization in Dexterous Manipulation》· VLA 实证研究</text>
</svg>