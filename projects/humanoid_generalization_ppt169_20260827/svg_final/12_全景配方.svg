<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">全景：通用泛化的当前配方</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">把 11 页浓缩成一张配方卡 · 每味药都对应前面的实证</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H1208 A12,12 0 0 1 1220,130 V486 A12,12 0 0 1 1208,498 H72 A12,12 0 0 1 60,486 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">通用泛化 = 底座 × 数据 × 训练法 × 感官</text>
    <g text-anchor="middle">
      <path fill="#EFEBF8" d="M110,180 H350 A10,10 0 0 1 360,190 V450 A10,10 0 0 1 350,460 H110 A10,10 0 0 1 100,450 V190 A10,10 0 0 1 110,180 Z" />
      <text x="230" y="216" font-size="15" font-weight="bold" fill="#6D4FC2">底座：世界模型</text>
      <text x="230" y="252" font-size="13" fill="#1A2433">Cosmos 3 双塔</text>
      <text x="230" y="280" font-size="13" fill="#1A2433">物理先验可继承</text>
      <text x="230" y="308" font-size="13" fill="#1A2433">边想象边行动</text>
      <text x="230" y="360" font-size="12" fill="#8494AB">架构先验 = +8.7pp</text>
      <text x="230" y="386" font-size="12" fill="#8494AB">(P5-6)</text>

      <path fill="#FBF3E4" d="M390,180 H630 A10,10 0 0 1 640,190 V450 A10,10 0 0 1 630,460 H390 A10,10 0 0 1 380,450 V190 A10,10 0 0 1 390,180 Z" />
      <text x="510" y="216" font-size="15" font-weight="bold" fill="#C77800">数据：人类视频</text>
      <text x="510" y="252" font-size="13" fill="#1A2433">EgoScale 缩放律</text>
      <text x="510" y="280" font-size="13" fill="#1A2433">2 万小时第一人称</text>
      <text x="510" y="308" font-size="13" fill="#1A2433">遥操作瓶颈被绕开</text>
      <text x="510" y="360" font-size="12" fill="#8494AB">1k→20k 小时翻倍</text>
      <text x="510" y="386" font-size="12" fill="#8494AB">(P7-8)</text>

      <path fill="#E8F1F8" d="M670,180 H910 A10,10 0 0 1 920,190 V450 A10,10 0 0 1 910,460 H670 A10,10 0 0 1 660,450 V190 A10,10 0 0 1 670,180 Z" />
      <text x="790" y="216" font-size="15" font-weight="bold" fill="#0B6E99">训练：空间随机化</text>
      <text x="790" y="252" font-size="13" fill="#1A2433">位置/朝向/布局</text>
      <text x="790" y="280" font-size="13" fill="#1A2433">空间主导律</text>
      <text x="790" y="308" font-size="13" fill="#1A2433">+ 组合泛化（π0.7）</text>
      <text x="790" y="360" font-size="12" fill="#8494AB">几何 &gt; 外观</text>
      <text x="790" y="386" font-size="12" fill="#8494AB">(P9-10)</text>

      <path fill="#EAF5EE" d="M950,180 H1186 A10,10 0 0 1 1196,190 V450 A10,10 0 0 1 1186,460 H950 A10,10 0 0 1 940,450 V190 A10,10 0 0 1 950,180 Z" />
      <text x="1068" y="216" font-size="15" font-weight="bold" fill="#1E8E3E">感官：触觉+冗余</text>
      <text x="1068" y="252" font-size="13" fill="#1A2433">Figure 03 指尖 3g 力敏</text>
      <text x="1068" y="280" font-size="13" fill="#1A2433">掌内相机防遮挡</text>
      <text x="1068" y="308" font-size="13" fill="#1A2433">力觉空间维度</text>
      <text x="1068" y="360" font-size="12" fill="#8494AB">预判滑落</text>
      <text x="1068" y="386" font-size="12" fill="#8494AB">(P11)</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3" d="M72,524 H1208 A12,12 0 0 1 1220,536 V646 A12,12 0 0 1 1208,658 H72 A12,12 0 0 1 60,646 V536 A12,12 0 0 1 72,524 Z" />
    <text x="84" y="556" font-size="15" font-weight="bold" fill="#0B6E99">一年内的路线迁移（本报告的时间跨度）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="590">VLA 堆规模（2025）→ 世界模型底座（2026 上半年）→ 全模态+缩放律+触觉（当前）</text>
      <text x="84" y="624" fill="#0B6E99" font-weight="bold">与上篇预测吻合：四营会战中"生成式世界模型 + 显式空间课"暂时领跑，JEPA 纯抽象路线仍在追赶</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">本页为编者综合配方提炼，各成分证据见对应页；"×"表示乘法关系（缺任何一味都显著削弱泛化）</text>
</svg>