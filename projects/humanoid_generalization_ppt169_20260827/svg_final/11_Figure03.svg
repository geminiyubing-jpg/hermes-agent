<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">硬件补丁：Figure 03 的触觉 + 掌内视觉</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">2026 年发布 · 为 Helix VLA 打造 · 空间泛化不只靠算法——感知通道的增维</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V376 A12,12 0 0 1 620,388 H72 A12,12 0 0 1 60,376 V130 A12,12 0 0 1 72,118 Z" />
    <rect x="60" y="118" width="572" height="4" fill="#0B6E99" />
    <text x="84" y="152" font-size="15.5" font-weight="bold" fill="#0B6E99">掌内嵌入式摄像头</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="188">· 每只手：广视角 + 低延迟的掌内相机</text>
      <text x="84" y="224">· 解决的场景：主相机被遮挡时——</text>
      <text x="104" y="250">伸手进橱柜、狭窄空间作业</text>
      <text x="84" y="286">· 价值：<tspan font-weight="bold" fill="#0B6E99">视觉冗余</tspan>——遮挡发生时</text>
      <text x="104" y="312">近距离视觉不断流，实时自适应控制持续</text>
      <text x="84" y="360" fill="#51617A" font-size="13">= 把"盲操作"变成"掌中有眼"</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V376 A12,12 0 0 1 1208,388 H664 A12,12 0 0 1 652,376 V130 A12,12 0 0 1 664,118 Z" />
    <rect x="652" y="118" width="568" height="4" fill="#1E8E3E" />
    <text x="676" y="152" font-size="15.5" font-weight="bold" fill="#1E8E3E">指尖触觉传感器</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188">· 灵敏度：<tspan font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">3 克</tspan>力——</text>
      <text x="696" y="214">能感知"一根手指上放了枚回形针"</text>
      <text x="676" y="250">· 核心能力：区分<tspan font-weight="bold">"握稳了"</tspan>与<tspan font-weight="bold">"即将滑落"</tspan></text>
      <text x="696" y="276">——在滑落发生之前预判</text>
      <text x="676" y="312">· 应用：易碎品/不规则物/动态物的精细操控</text>
      <text x="676" y="360" fill="#1E8E3E" font-weight="bold" font-size="13">= 力觉空间感知，补视觉看不到的维度</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,418 H1208 A12,12 0 0 1 1220,430 V646 A12,12 0 0 1 1208,658 H72 A12,12 0 0 1 60,646 V430 A12,12 0 0 1 72,418 Z" />
    <text x="84" y="452" font-size="15" font-weight="bold" fill="#C77800">设计哲学：空间泛化的感知增维</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="488">算法路线（WAM/缩放律/随机化）解决"脑"，Figure 03 补的是"感官"：</text>
      <text x="104" y="520">视觉空间（看到哪） + 力觉空间（摸到哪） + 遮挡冗余（看不到时也知道）</text>
      <text x="84" y="568">与人呼应：人手的空间智能同样依赖指尖触觉与本体感觉——纯视觉永远不够</text>
      <text x="84" y="624" fill="#C77800" font-weight="bold">定位：量产就绪 + 家用安全设计——从实验室原型走向可部署产品的第三代样本</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：figure.ai/news/introducing-figure-03 · robotics247 报道 · Figure 03 为 Helix VLA 的配套硬件平台（2026）</text>
</svg>