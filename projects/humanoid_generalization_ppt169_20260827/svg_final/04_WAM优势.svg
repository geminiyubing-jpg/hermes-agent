<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">WAM 三大优势：为什么世界模型骨架更强</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">《World Action Models are Zero-shot Policies》· NVIDIA 论文实证</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H428 A12,12 0 0 1 440,130 V426 A12,12 0 0 1 428,438 H72 A12,12 0 0 1 60,426 V130 A12,12 0 0 1 72,118 Z" />
    <rect x="60" y="118" width="380" height="4" fill="#1E8E3E" />
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">① 吃杂食数据</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="190">VLA：需要"近乎相同的任务演示"，</text>
      <text x="104" y="216">一条演示不匹配就白采集</text>
      <text x="84" y="258">WAM：学的是物理本身——</text>
      <text x="104" y="284">"任何交互数据都能教它点什么"</text>
      <text x="84" y="326">推、抓、放、掉——全是教材</text>
      <text x="84" y="382" fill="#1E8E3E" font-weight="bold">→ 数据采集成本断崖式下降</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M472,118 H828 A12,12 0 0 1 840,130 V426 A12,12 0 0 1 828,438 H472 A12,12 0 0 1 460,426 V130 A12,12 0 0 1 472,118 Z" />
    <rect x="460" y="118" width="380" height="4" fill="#C77800" />
    <text x="484" y="152" font-size="16" font-weight="bold" fill="#C77800">② 开放世界泛化</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="484" y="190">核心洞察：<tspan font-weight="bold">物理比语义更通用</tspan></text>
      <text x="504" y="216">"物体下落、滑动的方式，</text>
      <text x="504" y="242">不随物体是什么而改变"</text>
      <text x="484" y="284">学过 100 种物体动力学的模型，</text>
      <text x="504" y="310">遇到第 101 种自动迁移</text>
      <text x="484" y="382" fill="#C77800" font-weight="bold">→ 从未训练过的场景也能应对</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M872,118 H1208 A12,12 0 0 1 1220,130 V426 A12,12 0 0 1 1208,438 H872 A12,12 0 0 1 860,426 V130 A12,12 0 0 1 872,118 Z" />
    <rect x="860" y="118" width="360" height="4" fill="#6D4FC2" />
    <text x="884" y="152" font-size="16" font-weight="bold" fill="#6D4FC2">③ 少样本适配新机体</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="884" y="190">已懂物理交互的底座，</text>
      <text x="904" y="216">适配新机械臂/新夹爪/新人形</text>
      <text x="884" y="258">只需要<tspan font-weight="bold">极少量演示</tspan></text>
      <text x="884" y="300">（对照：Gemini On-Device 版</text>
      <text x="904" y="326">宣称 50-100 条演示可用）</text>
      <text x="884" y="382" fill="#6D4FC2" font-weight="bold">→ 换硬件不再推倒重来</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.35" d="M72,466 H1208 A12,12 0 0 1 1220,478 V646 A12,12 0 0 1 1208,658 H72 A12,12 0 0 1 60,646 V478 A12,12 0 0 1 72,466 Z" />
    <text x="84" y="500" font-size="15" font-weight="bold" fill="#6D4FC2">杀手级特性：边想象边行动（Imagine-while-Acting）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="534">WAM 输出动作的同时，能输出"如果执行这些动作，相机接下来会看到什么"的<tspan font-weight="bold">预测视频</tspan>——</text>
      <text x="84" y="566">动作与后果预测来自同一个模型、同一时刻生成。</text>
      <text x="84" y="616" fill="#6D4FC2" font-weight="bold">= 机器人版的"出门前心里过一遍"（上篇心理导航的产业实现）——行动前先在脑内彩排物理后果</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">注：三大优势均有 NVIDIA 论文实验支撑；"零样本策略"指无需任务微调直接执行新任务</text>
</svg>