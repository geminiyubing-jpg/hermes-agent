<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">李飞飞的 5 亿年故事：World Labs</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">10 亿美元融资 · "动物智能始于看见和移动物理世界" · 空间智能的 3D 原住民路线</text>
  </g>

  <!-- the thesis -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="1160" height="130" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">核心论点（Bloomberg 访谈原话）</text>
    <text x="84" y="184" font-size="15" fill="#1A2433">"The case for us is a 500 million year story — animal intelligence starts with seeing and moving in the physical world."</text>
    <text x="84" y="214" font-size="14" fill="#51617A">译：我们的赌注是一个五亿年的故事——动物智能始于看见和移动物理世界。语言只有几万年，是后来者。</text>
  </g>

  <!-- three pillars -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="272" width="380" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="272" width="380" height="4" fill="#1E8E3E"/>
    <text x="84" y="306" font-size="15.5" font-weight="bold" fill="#1E8E3E">产品：Marble 世界模型</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="340">· 文本/图像/视频 → 可编辑持久 3D 世界</text>
      <text x="84" y="370">· 2025-09 预览 → 11 月正式商用</text>
      <text x="84" y="400">· 持久（关掉再开还在）、可精确控相机、</text>
      <text x="104" y="424">可交互编辑场景</text>
      <text x="84" y="458">· 用途：游戏/影视/VR/机器人仿真</text>
      <text x="84" y="530" fill="#51617A" font-size="13">评价：领先 Google Genie / Decart 一代</text>
    </g>

    <rect x="460" y="272" width="380" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="460" y="272" width="380" height="4" fill="#C77800"/>
    <text x="484" y="306" font-size="15.5" font-weight="bold" fill="#C77800">引擎：R2S2R 训练闭环</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="484" y="340">Real → Sim → Real：</text>
      <text x="504" y="366">· 真实世界扫进 Marble 重建</text>
      <text x="504" y="392">· 在仿真里海量训练机器人策略</text>
      <text x="504" y="418">· 再部署回真实机器人</text>
      <text x="484" y="456" fill="#C77800" font-weight="bold">2026-07-21 收购 SceniX</text>
      <text x="484" y="484">补强场景仿真技术</text>
      <text x="484" y="530" fill="#51617A" font-size="13">解决机器人训练数据稀缺的死结</text>
    </g>

    <rect x="860" y="272" width="360" height="280" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="860" y="272" width="360" height="4" fill="#6D4FC2"/>
    <text x="884" y="306" font-size="15.5" font-weight="bold" fill="#6D4FC2">论断：机器人 ≠ LLM</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="884" y="340">2026-07-28 访谈（a16z 对谈）：</text>
      <text x="904" y="368">"训练机器人不像训练 LLM"</text>
      <text x="884" y="404">· LLM 有互联网全文可爬</text>
      <text x="884" y="430">· 机器人没有"互联网级动作数据"</text>
      <text x="884" y="456">· 出路：模拟层自己造数据</text>
      <text x="884" y="530" fill="#6D4FC2" font-weight="bold" font-size="13">空间智能 = LLM 之后的下一前沿</text>
    </g>
  </g>

  <!-- bottom -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="576" width="1160" height="80" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="608" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#1E8E3E">与 JEPA 派的异同：</tspan>同——都认为空间/物理理解是根、语言不是；异——World Labs 直接建显式 3D 表示（几何优先），</text>
    <text x="84" y="636" font-size="14.5" fill="#1A2433">JEPA 学隐式潜在结构（端到端优先）。两条路线在"具身泛化"终点会师，路径不同。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：worldlabs.ai 官网与博客 · Bloomberg/chipstrat 访谈 · latent.space 播客 · Indian Express 产品报道（2025-11 至 2026-07）</text>
</svg>
