<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">认知地图派：给 AI 外挂一个"海马体"</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">BSC-Nav（Nature Communications，2026-08）· 不换大脑，补器官</text>
  </g>

  <!-- diagnosis -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="190" rx="12" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.35"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#C0392B">诊断：现有具身代理是"反应式无状态"的</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="182">· MLLM 逐帧看图 → 立刻决策 → 下一帧</text>
      <text x="84" y="210">· 没有持久的空间记忆——走过的走廊转头就忘</text>
      <text x="84" y="238">· 后果：知识碎片化、规划短视、换环境就崩</text>
      <text x="84" y="288" fill="#C0392B" font-weight="bold">= 没有"海马体"的视觉皮层，再大也不成地图</text>
    </g>
  </g>

  <!-- architecture -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="652" y="118" width="568" height="190" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.4"/>
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#0B6E99">处方：三层结构化空间记忆（仿生物）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="182">① 路标记忆：显著线索 ↔ 3D 位置绑定</text>
      <text x="676" y="210">② 认知地图：第一人称轨迹 → 体素化 → 鸟瞰地图</text>
      <text x="676" y="238">③ 工作记忆：按语义目标动态检索组合</text>
      <text x="676" y="288" fill="#0B6E99" font-weight="bold">DINOv2 管感知 + GPT-4V 管语义——MLLM 只是插件</text>
    </g>
  </g>

  <!-- results chart -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="332" width="700" height="324" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="364" font-size="15" font-weight="bold" fill="#1E8E3E">战绩：补上器官后跳升（%）</text>
    <!-- bars -->
    <line x1="300" y1="590" x2="700" y2="590" stroke="#8494AB" stroke-width="1.5"/>
    <g font-size="13">
      <text x="84" y="424">实例级导航 SPL</text>
      <rect x="300" y="404" width="140" height="24" rx="4" fill="#C0392B" opacity="0.55"/>
      <text x="448" y="422" font-family="'SF Mono',monospace" fill="#C0392B">17.6</text>
      <rect x="300" y="432" width="358" height="24" rx="4" fill="#1E8E3E"/>
      <text x="664" y="450" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">44.9</text>

      <text x="84" y="492">零样本长程指令跟随</text>
      <rect x="300" y="472" width="342" height="24" rx="4" fill="#C0392B" opacity="0.55"/>
      <text x="648" y="490" font-family="'SF Mono',monospace" fill="#C0392B">42.7</text>
      <rect x="300" y="500" width="425" height="24" rx="4" fill="#1E8E3E"/>
      <text x="731" y="518" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">53.1</text>

      <text x="84" y="576">VLN-CE 零样本成功率</text>
      <rect x="300" y="556" width="308" height="24" rx="4" fill="#1E8E3E"/>
      <text x="614" y="574" font-family="'SF Mono',monospace" font-weight="bold" fill="#1E8E3E">38.5</text>
      <text x="84" y="616" fill="#51617A" font-size="12.5">距监督训练 SOTA 仅 8.5 分 · OpenEQA 具身问答 54.6 分全场最高</text>
    </g>
  </g>

  <!-- pigeon bonus -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="780" y="332" width="440" height="324" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4"/>
    <text x="804" y="364" font-size="15" font-weight="bold" fill="#C77800">姊妹篇：学鸽子建认知地图</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="398">信鸽能用高速路当路标、被挪窝后</text>
      <text x="804" y="424">靠地图记忆修正路线（脑科学证据）</text>
      <text x="804" y="462">→ 北邮团队（2606.02459）据此设计：</text>
      <text x="824" y="488">· 动态认知地图参数化场景布局</text>
      <text x="824" y="514">· 空间断言代码 SAC 用 Python 表达</text>
      <text x="844" y="538">空间关系 → 中间步可验证 → 密集奖励</text>
      <text x="804" y="578" fill="#C77800" font-weight="bold">MindCube 基准 80.5%</text>
      <text x="824" y="602">旋转子集超 SOTA 29.5 分（+53.2%）</text>
      <text x="804" y="638" fill="#51617A" font-size="12.5">CVPR26 LASAR 双记忆方案同族（VSI-Bench +3.5%）</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Nature Communications s41467-026-74358-5（BSC-Nav）· arXiv 2606.02459（鸽子方案）· CVPR 2026（LASAR）</text>
</svg>
