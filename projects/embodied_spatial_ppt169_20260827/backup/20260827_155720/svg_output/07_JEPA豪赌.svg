<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">LeCun 的豪赌：JEPA 潜空间预测</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">AMI Labs · 10.3 亿美元种子轮（欧洲史上最大）· "LLM 是统计幻觉"</text>
  </g>

  <!-- core idea -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="700" height="260" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#6D4FC2">核心思想：预测"抽象"，不预测"像素"</text>
    <g text-anchor="middle">
      <rect x="100" y="172" width="180" height="80" rx="10" fill="#EEF2F8"/>
      <text x="190" y="204" font-size="13.5" font-weight="bold" fill="#1A2433">当前帧（观察）</text>
      <text x="190" y="228" font-size="12" fill="#51617A">编码为抽象表示 sx</text>
      <rect x="340" y="172" width="180" height="80" rx="10" fill="#EFEBF8"/>
      <text x="430" y="204" font-size="13.5" font-weight="bold" fill="#6D4FC2">预测器</text>
      <text x="430" y="228" font-size="12" fill="#51617A">sx → 预测 sy'</text>
      <rect x="580" y="172" width="160" height="80" rx="10" fill="#EEF2F8"/>
      <text x="660" y="204" font-size="13.5" font-weight="bold" fill="#1A2433">下一帧（未来）</text>
      <text x="660" y="228" font-size="12" fill="#51617A">编码为抽象表示 sy</text>
    </g>
    <path d="M 280 212 L 340 212" stroke="#6D4FC2" stroke-width="2" marker-end="url(#j1)"/>
    <path d="M 520 212 L 580 212" stroke="#6D4FC2" stroke-width="2" marker-end="url(#j1)"/>
    <defs>
      <marker id="j1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
        <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#6D4FC2"/>
      </marker>
    </defs>
    <text x="84" y="292" font-size="13.5" fill="#1A2433">训练目标：让"预测的抽象"和"真实的抽象"一致——</text>
    <text x="84" y="318" font-size="13.5" fill="#1A2433"><tspan font-weight="bold" fill="#6D4FC2">只保留对行动重要的结构</tspan>（车在刹车/杯子快掉了），</text>
    <text x="84" y="344" font-size="13.5" fill="#1A2433">丢弃无关噪声（树叶纹理/水面反光/传感器噪点）</text>
  </g>

  <!-- timeline -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="780" y="118" width="440" height="260" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="804" y="150" font-size="15" font-weight="bold" fill="#6D4FC2">一年一版的进化节奏</text>
    <line x1="820" y1="180" x2="820" y2="350" stroke="#6D4FC2" stroke-width="2"/>
    <g font-size="13" fill="#1A2433">
      <circle cx="820" cy="195" r="5" fill="#6D4FC2"/>
      <text x="838" y="199">2023 · I-JEPA（图像，潜空间预测可行）</text>
      <circle cx="820" cy="235" r="5" fill="#6D4FC2"/>
      <text x="838" y="239">2024 · V-JEPA（视频）</text>
      <circle cx="820" cy="275" r="5" fill="#6D4FC2"/>
      <text x="838" y="279">2025-06 · V-JEPA 2（机器人动作预测）</text>
      <circle cx="820" cy="315" r="5" fill="#C0392B"/>
      <text x="838" y="319">2025-11 · LeCun 离开 Meta 创办 AMI</text>
      <circle cx="820" cy="350" r="5" fill="#C77800"/>
      <text x="838" y="354">2026-03 · V-JEPA 2.1 + 10.3 亿美元</text>
    </g>
  </g>

  <!-- 2026 theory -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="402" width="1160" height="254" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.35"/>
    <text x="84" y="436" font-size="15" font-weight="bold" fill="#6D4FC2">2026 年的理论补完（从"灵巧架构"到"可证明科学"）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="470">① LeJEPA（LeCun &amp; Balestriero）：解决自监督老大难"表示坍塌"——SIGReg 高斯正则化，</text>
      <text x="104" y="496">无需任何启发式技巧，理论可证、跨架构可扩展</text>
      <text x="84" y="532">② When Does LeJEPA Learn a World Model?（2026-05）：证明在一大类平稳加噪转移的世界中，</text>
      <text x="104" y="558">JEPA 能从非线性观测中<tspan font-weight="bold" fill="#6D4FC2">线性恢复隐世界变量</tspan>——"学到世界模型"第一次有了数学条件</text>
      <text x="84" y="594">③ LeWorldModel（2603.19312）：首个从原始像素端到端稳定训练的 JEPA——15M 参数、单卡、数小时收敛，</text>
      <text x="104" y="620">去掉了全部辅助损失——"JEPA 只是一张漂亮架构图"的质疑被关闭</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">生态：96 家初创基于世界模型路线做物理 AI（工业自动化/人形机器人/自动驾驶/医疗）· LeCun 任 AMI 执行主席兼 NYU 教授</text>
</svg>
