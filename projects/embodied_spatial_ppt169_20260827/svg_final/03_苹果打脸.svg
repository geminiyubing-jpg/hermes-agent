<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">证据一：苹果"打脸"实验</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">SPACE 基准（Apple，arXiv 2410.06468）· 用几十年动物认知研究考前沿模型</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H748 A12,12 0 0 1 760,130 V376 A12,12 0 0 1 748,388 H72 A12,12 0 0 1 60,376 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">考题从动物认知实验室搬来</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="184">大尺度（环境级）：走完环境后估计到地标的距离方向、</text>
      <text x="104" y="208">画出地图、重走路线、发现抄近路</text>
      <text x="84" y="244">小尺度（物体级）：心理旋转、视角切换、迷宫补全、</text>
      <text x="104" y="268">明尼苏达形状板拼合</text>
      <text x="84" y="304" fill="#51617A">对照物种：小鼠、大鼠、蝙蝠、鸽子、乌鸦、狗、狼、</text>
      <text x="104" y="328">大象、狨猴、吼猴、狒狒、黑猩猩、人类——全做过这些题</text>
      <text x="84" y="366" fill="#C0392B" font-weight="bold">结果：前沿模型多项"接近随机"（碰运气水平）</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4" d="M792,118 H1208 A12,12 0 0 1 1220,130 V376 A12,12 0 0 1 1208,388 H792 A12,12 0 0 1 780,376 V130 A12,12 0 0 1 792,118 Z" />
    <text x="804" y="150" font-size="15" font-weight="bold" fill="#C0392B">史无前例的"偏科"生物</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="186">能赢奥数的数学、能写生产级代码，</text>
      <text x="804" y="212">但心理旋转、视角切换、迷宫补全</text>
      <text x="804" y="238">这类"动物都会"的题接近随机</text>
      <text x="804" y="286" fill="#C0392B" font-weight="bold">论文原话：</text>
      <text x="804" y="312">"生物智能中，空间认知是高级认知的</text>
      <text x="804" y="338"><tspan font-weight="bold">前提</tspan>，空间障碍是高级疾病的诊断指标</text>
      <text x="804" y="364">——前沿模型把顺序<tspan font-weight="bold">倒过来</tspan>了"</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,412 H1208 A12,12 0 0 1 1220,424 V644 A12,12 0 0 1 1208,656 H72 A12,12 0 0 1 60,644 V424 A12,12 0 0 1 72,412 Z" />
    <text x="84" y="446" font-size="15" font-weight="bold" fill="#0B6E99">这对"本源之争"意味着什么</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="480">① 语言智能 ≠ 空间智能：两者可以完全脱钩——5 亿年演化把空间放在底层，语言只有几万年，</text>
      <text x="104" y="506">LLM 是"只长上层、没长底层"的独特智能形态</text>
      <text x="84" y="542">② Brooks 第一定律的完美例证："AI 系统一项任务表现好，观察者立刻高估其相邻领域的能力——</text>
      <text x="104" y="568">而那个估计通常是 wildly overinflated（ wildly 高估）"</text>
      <text x="84" y="604" fill="#C77800" font-weight="bold">③ 论文留下的开放问题（正是本次议题的学术版）：空间缺陷是否因果性地导致高级任务诡异失败？</text>
      <text x="104" y="630">具身是不是必要条件，还是机器智能可以走另一条路？</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2410.06468（Apple ml-space-benchmark）· 注意：给模型提供了文本和图像双通道测试，LLM 与 VLM 都考了</text>
</svg>