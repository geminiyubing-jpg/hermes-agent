<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#6D4FC2" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">心理导航派：不会自然涌现的地图能力</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">NavMind / Video2Mental（arXiv 2603.21577）· 对"规模化信仰"的直接检验</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V356 A12,12 0 0 1 620,368 H72 A12,12 0 0 1 60,356 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">考试设计：像人一样"脑内导航"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="182">给模型看一段长第一人称视频（走过一遍环境）</text>
      <text x="84" y="212">然后要求：① 从记忆重建分层认知地图</text>
      <text x="104" y="238">② 逐步生成路标导航方案 ③ 模拟器物理验证</text>
      <text x="84" y="274">规模：23,700 高难样本（含 2,300 测试）</text>
      <text x="84" y="344" fill="#51617A" font-size="13">考的不是"看得见"（感知），是"记得住、画得出、</text>
      <text x="104" y="366" fill="#51617A" font-size="13">想得清"（结构化空间推理）</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V356 A12,12 0 0 1 1208,368 H664 A12,12 0 0 1 652,356 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#C0392B">判决：前沿模型近乎全军覆没</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="14">
      <text x="676" y="186" fill="#1A2433">导航成功率      <tspan font-weight="bold" fill="#C0392B">3.76–5.54%</tspan></text>
      <text x="676" y="218" fill="#1A2433">地标 IoU       <tspan font-weight="bold" fill="#C0392B">&lt; 5%</tspan></text>
      <text x="676" y="250" fill="#1A2433">地标 F1        <tspan font-weight="bold" fill="#C0392B">&lt; 35%</tspan></text>
    </g>
    <g font-size="13.5" fill="#1A2433" font-family="'PingFang SC',sans-serif">
      <text x="676" y="288">· 最新 Qwen3.5 / 闭源前沿模型均远低于实用线</text>
      <text x="676" y="316" fill="#C0392B" font-weight="bold">· 给了真值地图照样规划错——瓶颈不在感知在推理</text>
      <text x="676" y="344" fill="#51617A" font-size="13">结论：心理导航不能从视觉-语言预训练中自然涌现</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.35" d="M72,392 H748 A12,12 0 0 1 760,404 V644 A12,12 0 0 1 748,656 H72 A12,12 0 0 1 60,644 V404 A12,12 0 0 1 72,392 Z" />
    <text x="84" y="426" font-size="15" font-weight="bold" fill="#6D4FC2">NavMind 的补法：显式教，不指望涌现</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="460">① 细粒度认知地图作为"可学习中间表示"——不许跳步直接答题</text>
      <text x="84" y="494">② 难度分层渐进训练 + 拒绝采样过滤简单样本（逼模型深度推理，</text>
      <text x="104" y="520">防"背轨迹模式"作弊）</text>
      <text x="84" y="554">③ 基于 Qwen3-VL 微调 → 显著反超商业前沿模型</text>
      <text x="84" y="600" fill="#6D4FC2" font-weight="bold">方法论信号：与 LLM 的"涌现叙事"分道扬镳——空间推理要显式脚手架</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3" d="M792,392 H1208 A12,12 0 0 1 1220,404 V644 A12,12 0 0 1 1208,656 H792 A12,12 0 0 1 780,644 V404 A12,12 0 0 1 792,392 Z" />
    <text x="804" y="426" font-size="15" font-weight="bold" fill="#0B6E99">为什么叫"心理导航"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="804" y="460">认知科学的启示：生物智能靠</text>
      <text x="824" y="486">"先在脑内构建空间表征，</text>
      <text x="824" y="512">再在心里模拟走一遍"，</text>
      <text x="824" y="538">然后才迈第一步</text>
      <text x="804" y="578" fill="#0B6E99" font-weight="bold">= 出门前的"心里过一遍"</text>
      <text x="804" y="624" fill="#51617A" font-size="13">AI 缺的就是这个"心里过一遍"</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2603.21577 · 根因归为两点：缺推理为中心的长程空间整合数据 + 端到端范式把记忆与规划纠缠在自回归里</text>
</svg>