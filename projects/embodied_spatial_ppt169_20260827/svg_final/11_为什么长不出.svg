<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C0392B" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">深层拆解：为什么"预测下一词"长不出空间智能</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">四个结构性原因——每个都对应前面某页的实验证据</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,118 H620 A12,12 0 0 1 632,130 V362 A12,12 0 0 1 620,374 H72 A12,12 0 0 1 60,362 V130 A12,12 0 0 1 72,118 Z" />
    <rect x="60" y="118" width="572" height="4" fill="#C0392B" />
    <text x="84" y="152" font-size="15.5" font-weight="bold" fill="#C0392B">① 数据形态：语言是"别人嚼过的世界"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="186">语言是人类感知与文化的"压缩符号记录"——</text>
      <text x="84" y="214">LLM 学的是世界的"转述"，不是世界本身</text>
      <text x="84" y="252">空间知识的关键部分从未进入文本：</text>
      <text x="104" y="278">惯性/摩擦/遮挡/时机/力度——写不出来</text>
      <text x="84" y="336" fill="#51617A" font-size="13">证据呼应：脚手架倒置（P4）——语言是挂在</text>
      <text x="104" y="358" fill="#51617A" font-size="13">世界模型上的晚近表壳</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M664,118 H1208 A12,12 0 0 1 1220,130 V362 A12,12 0 0 1 1208,374 H664 A12,12 0 0 1 652,362 V130 A12,12 0 0 1 664,118 Z" />
    <rect x="652" y="118" width="568" height="4" fill="#C77800" />
    <text x="676" y="152" font-size="15.5" font-weight="bold" fill="#C77800">② 信号结构：一维序列 vs 三维空间</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="186">语言天然是一维序列（一个词接一个词）；</text>
      <text x="676" y="214">空间是三维并联结构（前后/左右/上下同时存在）</text>
      <text x="676" y="252">"前后左右"在文本里只是词，模型没有</text>
      <text x="696" y="278">把它们锚定到任何"身体"上（无具身锚点）</text>
      <text x="676" y="336" fill="#51617A" font-size="13">证据呼应：SPACE 心理旋转/视角切换近随机（P3）</text>
      <text x="696" y="358" fill="#51617A" font-size="13">——纯文本学到的只是"方向词的用法"</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,394 H620 A12,12 0 0 1 632,406 V638 A12,12 0 0 1 620,650 H72 A12,12 0 0 1 60,638 V406 A12,12 0 0 1 72,394 Z" />
    <rect x="60" y="394" width="572" height="4" fill="#6D4FC2" />
    <text x="84" y="428" font-size="15.5" font-weight="bold" fill="#6D4FC2">③ 学习闭环：没有行动反馈的世界</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="462">空间认知在生物界靠"行动-后果"闭环锻造：</text>
      <text x="104" y="488">碰倒的杯子、走通的近路、拐错的弯</text>
      <text x="84" y="526">LLM 的训练是"旁观者"式的——只读不试，</text>
      <text x="104" y="552">永远收不到"你的空间预测错了"的物理回执</text>
      <text x="84" y="612" fill="#51617A" font-size="13">证据呼应：心理导航不自然涌现（P10）——</text>
      <text x="104" y="634" fill="#51617A" font-size="13">Video2Mental 的模拟器物理验证正是补这个闭环</text>
    </g>

    <path fill="#FFFFFF" stroke="#D8E0EC" d="M664,394 H1208 A12,12 0 0 1 1220,406 V638 A12,12 0 0 1 1208,650 H664 A12,12 0 0 1 652,638 V406 A12,12 0 0 1 664,394 Z" />
    <rect x="652" y="394" width="568" height="4" fill="#0B6E99" />
    <text x="676" y="428" font-size="15.5" font-weight="bold" fill="#0B6E99">④ 状态持久：自回归没有"我在这"</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="462">导航需要一个持续更新的"当前位置+已走路径"</text>
      <text x="696" y="488">状态；自回归的隐状态是为"下一词"服务的，</text>
      <text x="696" y="514">不为"整个环境"服务</text>
      <text x="676" y="552">环境越大、时间越长，空间信息衰减越狠</text>
      <text x="676" y="612" fill="#51617A" font-size="13">证据呼应：BSC-Nav"反应式无状态"诊断（P9）</text>
      <text x="696" y="634" fill="#51617A" font-size="13">——外挂地图记忆后成绩跳升 2.5 倍</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">注：四个原因相互独立又相互放大——这正是"给 LLM 加数据/加参数"解决不了空间问题的机理</text>
</svg>