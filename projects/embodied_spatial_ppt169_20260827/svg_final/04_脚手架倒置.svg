<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">证据二：脚手架倒置</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">Grounded World Models in Biological Organisms（arXiv 2607.13560，2026-07）· 谁是根，谁是枝</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4" d="M72,118 H620 A12,12 0 0 1 632,130 V356 A12,12 0 0 1 620,368 H72 A12,12 0 0 1 60,356 V130 A12,12 0 0 1 72,118 Z" />
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#C0392B">当前 AI 的盖楼方式（语言为根）</text>
    <g text-anchor="middle">
      <path fill="#FFFFFF" stroke="#C0392B" stroke-opacity="0.3" d="M188,170 H502 A8,8 0 0 1 510,178 V208 A8,8 0 0 1 502,216 H188 A8,8 0 0 1 180,208 V178 A8,8 0 0 1 188,170 Z" />
      <text x="345" y="199" font-size="13.5" fill="#1A2433">视觉/听觉/动作 ··· 挂在语言上</text>
      <path fill="#FFFFFF" stroke="#C0392B" stroke-opacity="0.5" d="M238,226 H452 A8,8 0 0 1 460,234 V264 A8,8 0 0 1 452,272 H238 A8,8 0 0 1 230,264 V234 A8,8 0 0 1 238,226 Z" />
      <text x="345" y="255" font-size="13.5" fill="#1A2433">语言规律（脚手架）</text>
      <path fill="#FBECEA" stroke="#C0392B" d="M288,282 H402 A8,8 0 0 1 410,290 V316 A8,8 0 0 1 402,324 H288 A8,8 0 0 1 280,316 V290 A8,8 0 0 1 288,282 Z" />
      <text x="345" y="309" font-size="13" fill="#C0392B" font-weight="bold">被动训练数据</text>
    </g>
    <text x="84" y="352" font-size="12.5" fill="#51617A">多模态 = 把其他模态"钉"到语言的脚手架上</text>

    <path fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4" d="M664,118 H1208 A12,12 0 0 1 1220,130 V356 A12,12 0 0 1 1208,368 H664 A12,12 0 0 1 652,356 V130 A12,12 0 0 1 664,118 Z" />
    <text x="676" y="150" font-size="15" font-weight="bold" fill="#1E8E3E">生物智能的盖楼方式（世界为根）</text>
    <g text-anchor="middle">
      <path fill="#FFFFFF" stroke="#1E8E3E" stroke-opacity="0.3" d="M780,170 H1094 A8,8 0 0 1 1102,178 V208 A8,8 0 0 1 1094,216 H780 A8,8 0 0 1 772,208 V178 A8,8 0 0 1 780,170 Z" />
      <text x="937" y="199" font-size="13.5" fill="#1A2433">语言 ··· 挂在世界模型上</text>
      <path fill="#FFFFFF" stroke="#1E8E3E" stroke-opacity="0.5" d="M830,226 H1044 A8,8 0 0 1 1052,234 V264 A8,8 0 0 1 1044,272 H830 A8,8 0 0 1 822,264 V234 A8,8 0 0 1 830,226 Z" />
      <text x="937" y="255" font-size="13.5" fill="#1A2433">交互获得的世界模型（脚手架）</text>
      <path fill="#EAF5EE" stroke="#1E8E3E" d="M880,282 H994 A8,8 0 0 1 1002,290 V316 A8,8 0 0 1 994,324 H880 A8,8 0 0 1 872,316 V290 A8,8 0 0 1 880,282 Z" />
      <text x="937" y="309" font-size="13" fill="#1E8E3E" font-weight="bold">主动行动经验</text>
    </g>
    <text x="676" y="352" font-size="12.5" fill="#51617A">先会感知行动，语言后挂——儿童发育顺序也是如此</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#FFFFFF" stroke="#D8E0EC" d="M72,392 H1208 A12,12 0 0 1 1220,404 V644 A12,12 0 0 1 1208,656 H72 A12,12 0 0 1 60,644 V404 A12,12 0 0 1 72,392 Z" />
    <text x="84" y="424" font-size="15" font-weight="bold" fill="#0B6E99">论文列举的五个生物神经回路（当前 AI 基本没有对应物）</text>
    <g font-size="13">
      <path fill="#E8F1F8" d="M92,442 H292 A8,8 0 0 1 300,450 V534 A8,8 0 0 1 292,542 H92 A8,8 0 0 1 84,534 V450 A8,8 0 0 1 92,442 Z" />
      <text x="100" y="470" font-weight="bold" fill="#0B6E99" font-size="13.5">① 空间导航回路</text>
      <text x="100" y="494" fill="#1A2433">物理与概念空间的</text>
      <text x="100" y="516" fill="#1A2433">定位与寻路</text>

      <path fill="#FBF3E4" d="M324,442 H524 A8,8 0 0 1 532,450 V534 A8,8 0 0 1 524,542 H324 A8,8 0 0 1 316,534 V450 A8,8 0 0 1 324,442 Z" />
      <text x="332" y="470" font-weight="bold" fill="#C77800" font-size="13.5">② Affordance 感知</text>
      <text x="332" y="494" fill="#1A2433">"这东西能怎么用"</text>
      <text x="332" y="516" fill="#1A2433">的物体交互感知</text>

      <path fill="#EFEBF8" d="M556,442 H756 A8,8 0 0 1 764,450 V534 A8,8 0 0 1 756,542 H556 A8,8 0 0 1 548,534 V450 A8,8 0 0 1 556,442 Z" />
      <text x="564" y="470" font-weight="bold" fill="#6D4FC2" font-size="13.5">③ 主动感知与探索</text>
      <text x="564" y="494" fill="#1A2433">主动看、主动摸的</text>
      <text x="564" y="516" fill="#1A2433">开放式学习</text>

      <path fill="#FBECEA" d="M788,442 H988 A8,8 0 0 1 996,450 V534 A8,8 0 0 1 988,542 H788 A8,8 0 0 1 780,534 V450 A8,8 0 0 1 788,442 Z" />
      <text x="796" y="470" font-weight="bold" fill="#C0392B" font-size="13.5">④ 稳态与情绪</text>
      <text x="796" y="494" fill="#1A2433">维持内部平衡的</text>
      <text x="796" y="516" fill="#1A2433">价值与动机系统</text>

      <path fill="#EAF5EE" d="M1020,442 H1212 A8,8 0 0 1 1220,450 V534 A8,8 0 0 1 1212,542 H1020 A8,8 0 0 1 1012,534 V450 A8,8 0 0 1 1020,442 Z" />
      <text x="1028" y="470" font-weight="bold" fill="#1E8E3E" font-size="13.5">⑤ 自我/世界区分</text>
      <text x="1028" y="494" fill="#1A2433">"这是我造成的</text>
      <text x="1028" y="516" fill="#1A2433">还是世界造成的"</text>
    </g>
    <text x="84" y="580" font-size="14" fill="#1A2433">生物智能四特征（当前 AI 全缺）：<tspan font-weight="bold" fill="#0B6E99">内在动力学为基础 · 行动为中心 · 自主经验开放学习 · 早期预测控制为高级认知搭台</tspan></text>
    <text x="84" y="616" font-size="13.5" fill="#C77800">→ 论文主张：具身 AI 应从"被动喂数据"转向"社会交互中构建共享世界模型"</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：arXiv 2607.13560 · 神经科学+认知科学视角的具身 AI 路线图，五个回路均有脑科学文献支撑</text>
</svg>