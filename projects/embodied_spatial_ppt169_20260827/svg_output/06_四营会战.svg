<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">四营会战：让 AI 懂物理世界的路线之争</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">2026 夏 · 世界模型成为最热概念，路线分化也最尖锐</text>
  </g>

  <!-- 2x2 camps -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="200" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="572" height="4" fill="#8494AB"/>
    <text x="84" y="152" font-size="15.5" font-weight="bold" fill="#51617A">营一：视觉生成派（Sora / Veo）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="184">思路：把世界"画"出来——生成逼真视频即理解世界</text>
      <text x="84" y="216">软肋：像画得像 ≠ 懂物理；无交互、无因果</text>
      <text x="84" y="258" fill="#8494AB" font-size="13">评价：惊艳的"世界模拟器"演示，离可用泛化最远</text>
    </g>

    <rect x="652" y="118" width="568" height="200" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="652" y="118" width="568" height="4" fill="#0B6E99"/>
    <text x="676" y="152" font-size="15.5" font-weight="bold" fill="#0B6E99">营二：下一帧预测派（Genie / Gaia-1）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="184">思路：像 LLM 预测下一词一样预测下一帧</text>
      <text x="676" y="216">软肋：暴露偏差——训练吃高清素材，推理吃自己生成的</text>
      <text x="700" y="240">残次品，误差沿时间轴滚雪球直至画面崩坏</text>
      <text x="676" y="272" fill="#0B6E99" font-size="13">评价：与 LLM 同源的思路在视频域的延伸</text>
    </g>

    <rect x="60" y="338" width="572" height="200" rx="12" fill="#EFEBF8" stroke="#6D4FC2" stroke-opacity="0.4"/>
    <rect x="60" y="338" width="572" height="4" fill="#6D4FC2"/>
    <text x="84" y="372" font-size="15.5" font-weight="bold" fill="#6D4FC2">营三：抽象潜空间派（JEPA / AMI Labs）★</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="404">思路：不预测像素，在抽象嵌入空间预测未来状态——</text>
      <text x="108" y="428">只学对行动重要的结构，丢弃噪声</text>
      <text x="84" y="464">领军：LeCun（2025-11 离开 Meta 创办 AMI Labs）</text>
      <text x="84" y="496" fill="#6D4FC2" font-weight="bold">弹药：2026-03 融资 10.3 亿美元（欧洲史上最大种子轮）</text>
    </g>

    <rect x="652" y="338" width="568" height="200" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <rect x="652" y="338" width="568" height="4" fill="#1E8E3E"/>
    <text x="676" y="372" font-size="15.5" font-weight="bold" fill="#1E8E3E">营四：3D 空间物理派（World Labs / 物理引擎）★</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="404">思路：空间智能是 5 亿年的故事——直接在 3D 里建</text>
      <text x="700" y="428">世界模型，不做 2D→3D 的补丁</text>
      <text x="676" y="464">领军：李飞飞（World Labs，NVIDIA/AMD/Autodesk 投）</text>
      <text x="676" y="496" fill="#1E8E3E" font-weight="bold">弹药：10 亿美元融资 + Marble 商用世界模型</text>
    </g>
  </g>

  <!-- note -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="560" width="1160" height="96" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4"/>
    <text x="84" y="592" font-size="14.5" fill="#1A2433"><tspan font-weight="bold" fill="#C77800">值得注意：</tspan>营三、营四正是"空间智能更本源"判断的两个最大资本下注（合计超 20 亿美元）；</text>
    <text x="84" y="622" font-size="14.5" fill="#1A2433">另有第三股力量（营外）：脑科学派直接给现有 AI 外挂生物式空间记忆——不动架构，补器官（下两页详述）。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：aiweekly 世界模型专题 · aiautomationglobal 四营分析 · 各公司公开信息（截至 2026-08）</text>
</svg>
