<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">证据三：动物的导航工具箱</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">英国皇家学会《导航工具箱》框架（Proc R Soc B）· 无语言物种的完整空间智能</text>
  </g>

  <!-- toolbox pyramid -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="640" height="300" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="150" font-size="15" font-weight="bold" fill="#0B6E99">跨物种的四层空间表征（自下而上生长）</text>
    <!-- layers -->
    <g text-anchor="middle">
      <rect x="180" y="356" width="400" height="42" rx="6" fill="#E8F1F8"/>
      <text x="380" y="383" font-size="13.5" fill="#1A2433">L1 感觉输入（光流/气味/磁场/视觉流）</text>
      <rect x="220" y="304" width="320" height="42" rx="6" fill="#E8F1F8"/>
      <text x="380" y="331" font-size="13.5" fill="#1A2433">L2 路标记忆（显著线索↔位置绑定）</text>
      <rect x="260" y="252" width="240" height="42" rx="6" fill="#FBF3E4"/>
      <text x="380" y="279" font-size="13.5" fill="#1A2433">L3 路线知识（向量序列）</text>
      <rect x="300" y="200" width="160" height="42" rx="6" fill="#EFEBF8"/>
      <text x="380" y="227" font-size="13.5" fill="#1A2433">L4 认知地图</text>
      <rect x="490" y="200" width="130" height="42" rx="21" fill="#FBECEA" stroke="#C0392B" stroke-opacity="0.4"/>
      <text x="555" y="227" font-size="12.5" fill="#C0392B" font-weight="bold">L5 符号层</text>
    </g>
    <path d="M 380 200 L 380 356" stroke="#8494AB" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="84" y="418" font-size="12.5" fill="#51617A">L4=度量化内部模型（任意两点可估计距离方向）；L5=语言/地图/蜜蜂摇摆舞——只在顶层</text>
  </g>

  <!-- species evidence -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="720" y="118" width="500" height="300" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="744" y="150" font-size="15" font-weight="bold" fill="#1E8E3E">哪些物种有完整 L1-L4？（全部没有语言）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="744" y="186">· 小鼠/大鼠：海马位置细胞、网格细胞</text>
      <text x="744" y="216">· 蝙蝠：三维回声定位导航（三维空间认知）</text>
      <text x="744" y="246">· 鸽子/乌鸦：路标+太阳罗盘整合，跨大陆返巢</text>
      <text x="744" y="276">· 蜜蜂：摇摆舞传递距离方向——"前语言符号"</text>
      <text x="744" y="306">· 狗/狼/大象/狒狒/黑猩猩：捷径发现、地图重排</text>
    </g>
    <text x="744" y="356" font-size="13.5" fill="#1E8E3E" font-weight="bold">结论：空间智能不需要语言，语言反而是它的客人</text>
    <text x="744" y="384" font-size="12.5" fill="#51617A">人类婴儿先有空间认知，后随发育获得语言（发展心理学）</text>
  </g>

  <!-- bidirectional + cognitive graph -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="442" width="572" height="214" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="474" font-size="15" font-weight="bold" fill="#C77800">框架的两处关键更新（2026 视角）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="508">① 层级是<tspan font-weight="bold">双向</tspan>的：高层反馈影响低层</text>
      <text x="104" y="532">（语言会反过来塑造空间注意——但不创造它）</text>
      <text x="84" y="572">② 认知地图 vs 认知图（graph）之争：</text>
      <text x="104" y="596">拓扑关系+局部度量，未必全域度量一致</text>
      <text x="104" y="624" fill="#51617A">→ 对 AI 的启示：不必强求完美度量地图</text>
    </g>

    <rect x="652" y="442" width="568" height="214" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="676" y="474" font-size="15" font-weight="bold" fill="#0B6E99">给具身 AI 的三张图纸</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="510">① 分层建图：路标→路线→地图逐层积累（BSC-Nav 照此实现）</text>
      <text x="676" y="546">② 双自我/非自我中心：第一人称轨迹 → 鸟瞰地图转换</text>
      <text x="676" y="582">③ 符号层最后加：空间底座稳固后再挂语言接口</text>
      <text x="676" y="624" fill="#0B6E99" font-weight="bold">→ 与 LLM 的"符号优先"路线正好相反</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">来源：Proc R Soc B 291:20231304（Wiener 等"导航工具箱"框架修订版）· 比较认知学跨物种证据综述</text>
</svg>
