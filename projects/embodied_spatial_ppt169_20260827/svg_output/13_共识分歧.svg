<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#1E8E3E"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">共识、分歧与开放问题</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">2026 年中的领域快照 · 以及对我们原始直觉的最终裁定</text>
  </g>

  <!-- consensus vs disagreement -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="572" height="240" rx="12" fill="#EAF5EE" stroke="#1E8E3E" stroke-opacity="0.4"/>
    <text x="84" y="152" font-size="16" font-weight="bold" fill="#1E8E3E">四派的共识（比你我想的更多）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="188">① 空间/物理理解是智能的底层，语言是晚近表层</text>
      <text x="84" y="222">② 具身泛化不能靠"给 LLM 喂更多数据"解决</text>
      <text x="84" y="256">③ 预测·行动·地图是前语言内核的三个抓手</text>
      <text x="84" y="290">④ 语言有位置：当接口（任务分解/语义对齐），</text>
      <text x="104" y="314">不当骨架</text>
      <text x="84" y="348" fill="#1E8E3E" font-weight="bold">资本背书：两条主路线合计 20 亿美元级投入</text>
    </g>

    <rect x="652" y="118" width="568" height="240" rx="12" fill="#FBF3E4" stroke="#C77800" stroke-opacity="0.4"/>
    <text x="676" y="152" font-size="16" font-weight="bold" fill="#C77800">仍未解决的分歧</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="676" y="188">① 显式 vs 隐式：3D 几何表示（World Labs）还是</text>
      <text x="696" y="212">潜在嵌入（JEPA）？</text>
      <text x="676" y="246">② 要不要语言：纯 JEPA 去语言化 vs 双系统</text>
      <text x="696" y="270">（空间底座+语言接口）——后者目前更主流</text>
      <text x="676" y="304">③ 地图要多完美：度量地图 vs 拓扑图</text>
      <text x="696" y="328">（皇家学会框架倾向后者更现实）</text>
    </g>
  </g>

  <!-- open questions -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="384" width="1160" height="170" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <text x="84" y="418" font-size="15.5" font-weight="bold" fill="#6D4FC2">三大开放问题（下一步研究金矿）</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="452">① 因果之问（SPACE 论文遗留）：LLM 高级任务的诡异失败，有多少能归因于空间缺陷？补上空间会连锁修复吗？</text>
      <text x="84" y="490">② 殊途之问：生物必须具身，机器是否可以走"仿真世界+世界模型"的替代路径达到同等泛化？（LeCun/李飞飞赌的是"能"）</text>
      <text x="84" y="528">③ 统一之问：预测·行动·地图三件套是否存在统一的目标函数？（JEPA 想当这个统一者，尚无定论）</text>
    </g>
  </g>

  <!-- verdict -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="578" width="1160" height="78" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.35"/>
    <text x="84" y="610" font-size="15" fill="#1A2433"><tspan font-weight="bold" fill="#0B6E99">对原始直觉的裁定：</tspan>"LLM 与三维空间感知不同源、空间能力更本源、具身泛化需要更本源的技能认识"——</text>
    <text x="84" y="638" font-size="15" fill="#1A2433">已被 Apple 基准、神经科学综述、皇家学会框架、Nature 子刊与 20 亿美元资本共同确认为当前前沿的<tspan font-weight="bold" fill="#0B6E99">主流判断</tspan>。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">综合自本报告全部 14 组研究 · 裁定措辞为编者综合，非任何单篇论文原文</text>
</svg>
