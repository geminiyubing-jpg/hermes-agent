<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#C77800"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">泛化的本源候选：预测 · 行动 · 地图</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">"比 LLM 更本源的技能"的三个具体候选——四条路线各自的注解</text>
  </g>

  <!-- three pillars -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="118" width="368" height="310" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="60" y="118" width="368" height="4" fill="#6D4FC2"/>
    <text x="84" y="152" font-size="17" font-weight="bold" fill="#6D4FC2">候选一：抽象预测</text>
    <text x="84" y="180" font-size="12.5" fill="#8494AB">（JEPA 派的全部赌注）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="84" y="216">在"只留行动相关信息"的潜空间里</text>
      <text x="84" y="242">预测世界下一步</text>
      <text x="84" y="284">· 生物对应：小脑与前向模型</text>
      <text x="84" y="310">（接球前手臂已预判）</text>
      <text x="84" y="352">· 2026 突破：可证明恢复隐世界</text>
      <text x="104" y="376">变量的数学条件（LeJEPA 理论）</text>
      <text x="84" y="414" fill="#6D4FC2" font-weight="bold" font-size="13">预言世界 = 理解世界</text>
    </g>

    <rect x="456" y="118" width="368" height="310" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="456" y="118" width="368" height="4" fill="#C77800"/>
    <text x="480" y="152" font-size="17" font-weight="bold" fill="#C77800">候选二：行动闭环</text>
    <text x="480" y="180" font-size="12.5" fill="#8494AB">（脚手架论文的核心主张）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="480" y="216">感知-行动-后果的闭环中，</text>
      <text x="480" y="242">"自我 vs 世界"被区分开</text>
      <text x="480" y="284">· 生物对应：运动皮层 + 感觉</text>
      <text x="480" y="310">预测的误差校正回路</text>
      <text x="480" y="352">· 工程形态：R2S2R 模拟训练</text>
      <text x="480" y="378">（World Labs）/ 机器人 RLVR</text>
      <text x="480" y="414" fill="#C77800" font-weight="bold" font-size="13">互动出真知（交互中区分因果）</text>
    </g>

    <rect x="852" y="118" width="368" height="310" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
    <rect x="852" y="118" width="368" height="4" fill="#0B6E99"/>
    <text x="876" y="152" font-size="17" font-weight="bold" fill="#0B6E99">候选三：认知地图</text>
    <text x="876" y="180" font-size="12.5" fill="#8494AB">（脑科学派 + 皇家学会框架）</text>
    <g font-size="13.5" fill="#1A2433">
      <text x="876" y="216">把碎片经验组织成持久、可查询</text>
      <text x="876" y="242">的空间结构（不必完美度量）</text>
      <text x="876" y="284">· 生物对应：海马位置细胞/</text>
      <text x="876" y="310">网格细胞（2014 诺奖）</text>
      <text x="876" y="352">· 工程形态：BSC-Nav 三层</text>
      <text x="876" y="378">记忆 / NavMind 显式地图监督</text>
      <text x="876" y="414" fill="#0B6E99" font-weight="bold" font-size="13">组织化的经验才能迁移</text>
    </g>
  </g>

  <!-- synthesis -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="454" width="1160" height="198" rx="12" fill="#E8F1F8" stroke="#0B6E99" stroke-opacity="0.3"/>
    <text x="84" y="488" font-size="15.5" font-weight="bold" fill="#0B6E99">三者的关系：不是三选一，是一个内核的三面</text>
    <g font-size="14" fill="#1A2433">
      <text x="84" y="522">预测提供"世界会怎样"的模型 → 行动提供"我能否改变它"的检验 → 地图提供"经验如何沉淀"的组织</text>
      <text x="84" y="556">三者闭环 = 动物 5 亿年演化出的前语言智能内核；语言（LLM）只是这个内核之上晚近长出的"快捷通讯层"</text>
      <text x="84" y="608" fill="#0B6E99" font-weight="bold">给具身泛化开的三张药方恰好各补一角：JEPA 补预测、R2S2R/RLVR 补行动、认知地图派补组织</text>
    </g>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8494AB">定位说明：本页是对四条路线证据的综合提炼（综合判断，非单篇论文结论），各候选的论文支撑见 P7-P10</text>
</svg>
