<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7F9FC"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#0B6E99"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1A2433">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#51617A">四部分 · 14 页 · 约 40 分钟</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="140" font-size="15" font-weight="bold" fill="#0B6E99">Ⅰ · 一个直觉的三重验证：空间智能更本源</text>
    <rect x="80" y="154" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">03</tspan>  苹果打脸实验：LLM 空间测试近随机</text>
      <text x="80" y="220"><tspan font-family="'SF Mono',monospace" fill="#8494AB">04</tspan>  脚手架倒置：语言和世界，谁是根</text>
      <text x="80" y="252"><tspan font-family="'SF Mono',monospace" fill="#8494AB">05</tspan>  动物导航工具箱：无语言的认知地图</text>
    </g>

    <text x="80" y="312" font-size="15" font-weight="bold" fill="#C77800">Ⅱ · 四条世界前沿路线（谁能跑出具身泛化）</text>
    <rect x="80" y="326" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="80" y="360"><tspan font-family="'SF Mono',monospace" fill="#8494AB">06</tspan>  路线图总览：四营会战</text>
      <text x="80" y="392"><tspan font-family="'SF Mono',monospace" fill="#8494AB">07</tspan>  LeCun 豪赌：JEPA 潜空间预测（$10.3亿）</text>
      <text x="80" y="424"><tspan font-family="'SF Mono',monospace" fill="#8494AB">08</tspan>  李飞飞：5 亿年故事的 World Labs</text>
      <text x="80" y="456"><tspan font-family="'SF Mono',monospace" fill="#8494AB">09</tspan>  认知地图派：给 AI 外挂"海马体"</text>
      <text x="80" y="488"><tspan font-family="'SF Mono',monospace" fill="#8494AB">10</tspan>  心理导航派：不会自然涌现的地图能力</text>
    </g>

    <text x="680" y="140" font-size="15" font-weight="bold" fill="#6D4FC2">Ⅲ · 深层问题拆解</text>
    <rect x="680" y="154" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="188"><tspan font-family="'SF Mono',monospace" fill="#8494AB">11</tspan>  为什么"预测下一词"长不出空间智能</text>
      <text x="680" y="220"><tspan font-family="'SF Mono',monospace" fill="#8494AB">12</tspan>  泛化的本源候选：预测·行动·地图</text>
    </g>

    <text x="680" y="280" font-size="15" font-weight="bold" fill="#1E8E3E">Ⅳ · 判断与展望</text>
    <rect x="680" y="294" width="540" height="2" fill="#D8E0EC"/>
    <g font-size="14.5" fill="#1A2433">
      <text x="680" y="328"><tspan font-family="'SF Mono',monospace" fill="#8494AB">13</tspan>  共识、分歧与开放问题</text>
      <text x="680" y="360"><tspan font-family="'SF Mono',monospace" fill="#8494AB">14</tspan>  尾页：研究清单与观察哨</text>
    </g>
  </g>

  <rect x="80" y="530" width="1140" height="130" rx="12" fill="#FFFFFF" stroke="#D8E0EC"/>
  <text x="104" y="562" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#C77800">一句话主线</text>
  <text x="104" y="592" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">动物不需要语言就有完整空间认知，LLM 有语言却没有空间——智能的两条根不同源；</text>
  <text x="104" y="618" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#1A2433">具身泛化的突破口在"预测·行动·地图"这个前语言内核，四条路线正在殊途同归地逼近它。</text>
  <text x="104" y="644" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8494AB">全部内容基于 2023-2026 顶刊顶会 + 资本动向交叉验证，采集时点 2026-08-27</text>
</svg>
