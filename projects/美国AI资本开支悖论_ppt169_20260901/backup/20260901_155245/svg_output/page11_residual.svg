<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">折旧战争 II：二手市场的血腥实证</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">H100 时租 $8→$1 · A100 $0.66/hr · 利用率 80% 假设 vs 60% 现实——折旧争论的市场裁决</text>

  <!-- 左：租金崩塌 -->
  <g>
    <rect x="60" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="142" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#D97B4A">GPU 租赁价格：一代之王两年跌 87%</text>
    <g stroke="#232D42" stroke-width="1">
      <line x1="100" y1="420" x2="610" y2="420"/>
      <line x1="100" y1="350" x2="610" y2="350" stroke-dasharray="4,4"/>
      <line x1="100" y1="280" x2="610" y2="280" stroke-dasharray="4,4"/>
      <line x1="100" y1="210" x2="610" y2="210" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#5A6474" text-anchor="end">
      <text x="94" y="424">$0</text><text x="94" y="354">$3</text><text x="94" y="284">$6</text><text x="94" y="214">$9</text>
    </g>
    <!-- H100: 8 -> 4 -> 1  A100: 2.5 -> 1.2 -> 0.7 -->
    <polyline points="150,203 330,270 510,395" fill="none" stroke="#D97B4A" stroke-width="3.5"/>
    <polyline points="150,362 330,377 510,404" fill="none" stroke="#4A9BC8" stroke-width="2.5" stroke-dasharray="7,4"/>
    <g fill="#E85A3A"><circle cx="150" cy="203" r="5"/><circle cx="510" cy="395" r="6"/></g>
    <g fill="#4A9BC8"><circle cx="150" cy="362" r="4"/><circle cx="510" cy="404" r="4"/></g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="600">
      <text x="160" y="195" fill="#E85A3A">H100 $8/hr</text>
      <text x="430" y="380" fill="#E85A3A" font-weight="700">$1-2/hr</text>
      <text x="160" y="352" fill="#4A9BC8">A100 $2.5</text>
      <text x="430" y="428" fill="#4A9BC8">$0.66-0.78</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="10.5" fill="#5A6474" text-anchor="middle">
      <text x="150" y="442">2023</text><text x="330" y="442">2024</text><text x="510" y="442">2025-26</text>
    </g>
    <text x="355" y="470" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#5A6474">预算型供应商口径（最激进降价）；云大厂溢价仍在</text>
    <!-- 但注意反例 -->
    <rect x="88" y="486" width="504" height="74" rx="8" fill="#1A1428"/>
    <text x="108" y="510" font-family="'PingFang SC', sans-serif" font-size="12.5" fill="#C9A227" font-weight="600">⚠ 反例（Nvidia CFO 口径）</text>
    <text x="108" y="532" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">2026 至今 H100 租金 +20% YTD、A100 +15%——短缺期老卡也吃香</text>
    <text x="108" y="552" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">（两种口径并存 = 市场分层：顶级集群稀缺 vs 尾部产能过剩）</text>
  </g>

  <!-- 右：利用率与回收模型 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="660" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="688" y="142" font-size="15" font-weight="700" fill="#4A9BC8">回收模型：一台 H100 服务器的生死簿</text>
    <g font-size="12.5">
      <rect x="688" y="160" width="504" height="180" rx="8" fill="#0D1321"/>
      <text x="708" y="186" fill="#C7C7C7">投入：8×H100 服务器 ≈ <tspan fill="#E8C55A" font-weight="700">$300K</tspan></text>
      <text x="708" y="212" fill="#C7C7C7">情景A（多头）：6 年·80% 利用率·$2.2/hr 均价 → 回收 <tspan fill="#6FBF9B" font-weight="700">✓</tspan></text>
      <text x="708" y="238" fill="#C7C7C7">情景B（空头）：4 年·60% 利用率·$1.2/hr 均价 → 回收 44% <tspan fill="#D97B4A" font-weight="700">✗</tspan></text>
      <text x="708" y="264" fill="#C7C7C7">情景C（崩溃）：3 年·50%·$0.8/hr → 回收 24% <tspan fill="#E85A3A" font-weight="700">✗✗</tspan></text>
      <text x="708" y="296" fill="#9B9B9B">＋电力/运维/融资成本未计——B/C 情景净回报为负</text>
      <text x="708" y="322" fill="#9B9B9B">＋SPV 债权人先于股东受偿——残值风险在债市不在股市</text>
    </g>
    <rect x="688" y="352" width="504" height="100" rx="8" fill="#1A1428"/>
    <text x="708" y="380" font-size="13.5" font-weight="700" fill="#C9A227">1990s 电信的前车之鉴（已在重演的部分）</text>
    <text x="708" y="406" font-size="12" fill="#9B9B9B">当年：拉长折旧+capex 暴增 → 需求落空 → 减记 &gt;$100B</text>
    <text x="708" y="430" font-size="12" fill="#9B9B9B">今天：Amazon 已缩短部分服务器年限（$920M 加速折旧）</text>
    <text x="708" y="454" font-size="12" fill="#D97B4A">——第一块多米诺已倒，但方向是"渐进诚实"而非崩塌</text>
    <text x="688" y="484" font-size="13" font-weight="700" fill="#E8E4D8">什么信号说明 6 年假设破产？</text>
    <text x="708" y="508" font-size="12" fill="#C7C7C7">· 第二代 Blackwell 量产后 H100 利用率跌破 60%</text>
    <text x="708" y="532" font-size="12" fill="#C7C7C7">· 大厂集体改回 4-5 年（Amazon 已开头）</text>
    <text x="708" y="556" font-size="12" fill="#C7C7C7">· SPV 债券违约/重组案例出现</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="600" width="1152" height="52" rx="10" fill="#1A1428"/>
  <text x="90" y="632" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">本质：折旧年限不是会计技术问题，是对"AI 推理需求曲线斜率"的下注——需求指数增长，6 年成立；需求线性增长，3 年才是真的。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：byteiota/introl 租赁市场追踪(B)·Nvidia FY27Q1 电话会(A-)·beancount 测算(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">11 / 20</text>
</svg>
