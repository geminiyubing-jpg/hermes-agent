<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">折旧战争 I：一条会计假设，$176B 利润</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">GPU 按 6 年折旧还是 3 年？——整个行业利润表的悬案（Burry vs Nvidia 七页备忘录）</text>

  <!-- 左：两种时间表 -->
  <g>
    <rect x="60" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="142" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#C9A227">同一台 $30 万 GPU 服务器，两种命运</text>
    <!-- 6年 -->
    <g font-family="'PingFang SC', sans-serif">
      <rect x="88" y="164" width="504" height="130" rx="10" fill="#0D1321"/>
      <text x="108" y="192" font-size="14" font-weight="700" fill="#6FBF9B">按 6 年折旧（现行：AMZN/MSFT/GOOG/CoreWeave）</text>
      <!-- 时间条 -->
      <rect x="108" y="206" width="464" height="26" rx="6" fill="#1F5C4D"/>
      <g fill="#E8F2EE" font-family="'Helvetica Neue', sans-serif" font-size="10.5" text-anchor="middle">
        <text x="147" y="223">Y1</text><text x="224" y="223">Y2</text><text x="301" y="223">Y3</text>
        <text x="378" y="223">Y4</text><text x="455" y="223">Y5</text><text x="532" y="223">Y6</text>
      </g>
      <text x="108" y="256" font-size="12.5" fill="#C7C7C7">年折旧 $5 万 · 6 年合计覆盖 $30 万</text>
      <text x="108" y="280" font-size="11.5" fill="#9B9B9B">→ 报表利润高、资产账面价值高——但 Y4 起芯片性能已落后两代</text>
    </g>
    <!-- 3年 -->
    <g font-family="'PingFang SC', sans-serif">
      <rect x="88" y="310" width="504" height="130" rx="10" fill="#0D1321"/>
      <text x="108" y="338" font-size="14" font-weight="700" fill="#D97B4A">按 3 年折旧（Burry 主张的真实经济寿命）</text>
      <rect x="108" y="352" width="232" height="26" rx="6" fill="#B3541E"/>
      <rect x="348" y="352" width="224" height="26" rx="6" fill="none" stroke="#5A3A2E" stroke-dasharray="4,4"/>
      <g font-family="'Helvetica Neue', sans-serif" font-size="10.5" text-anchor="middle">
        <text x="147" y="369" fill="#FFE0CC">Y1</text><text x="224" y="369" fill="#FFE0CC">Y2</text><text x="301" y="369" fill="#FFE0CC">Y3</text>
        <text x="424" y="369" fill="#5A6474">Y4-Y6 减记风险区</text>
      </g>
      <text x="108" y="402" font-size="12.5" fill="#C7C7C7">年折旧 $10 万 · 3 年计提完毕</text>
      <text x="108" y="426" font-size="11.5" fill="#9B9B9B">→ Nvidia 新架构 18-24 个月一代：Hopper→Blackwell→Rubin，性能 2.5-11 倍跳</text>
    </g>
    <rect x="88" y="456" width="504" height="104" rx="10" fill="#1A1428"/>
    <text x="108" y="484" font-size="13.5" font-weight="700" fill="#E8C55A">行业总账（Cerno/byteiota 测算）</text>
    <text x="108" y="510" font-size="12.5" fill="#C7C7C7">2023-24 集体延寿 3-4→6 年：年折旧 $39B→$21B（<tspan fill="#D97B4A" font-weight="700">-46%</tspan>，省 $18B/年）</text>
    <text x="108" y="536" font-size="12.5" fill="#C7C7C7">Burry：若改 3 年 → 2026-28 少提折旧 <tspan fill="#D97B4A" font-weight="700">$176B</tspan></text>
    <text x="108" y="558" font-size="12" fill="#9B9B9B">Oracle 利润或虚增 26.9% · Meta 20.8%</text>
  </g>

  <!-- 右：各方操作 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="660" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="688" y="142" font-size="15" font-weight="700" fill="#4A9BC8">真实世界的选择：同一年，两个方向</text>
    <g font-size="12.5" fill="#C7C7C7">
      <rect x="688" y="160" width="504" height="44" rx="8" fill="#0D1321"/>
      <text x="708" y="180" fill="#D97B4A" font-weight="600">Amazon 2025：部分服务器 6→5 年</text>
      <text x="708" y="196" fill="#9B9B9B">理由"AI 硬件迭代加速"·计 $920M 加速折旧（诚实信号）</text>
      <rect x="688" y="214" width="504" height="44" rx="8" fill="#0D1321"/>
      <text x="708" y="234" fill="#6FBF9B" font-weight="600">Meta 2025：3→5.5 年（反向延长）</text>
      <text x="708" y="250" fill="#9B9B9B">减少年折旧 $2.9B——同期 FCF 压到 $784M（动机耐人寻味）</text>
      <rect x="688" y="268" width="504" height="44" rx="8" fill="#0D1321"/>
      <text x="708" y="288" fill="#D97B4A" font-weight="600">Microsoft FY27：数据中心 15→25 年折旧</text>
      <text x="708" y="304" fill="#9B9B9B">建筑部分有理（混凝土寿命长），但与设备混披露降低可信度</text>
      <rect x="688" y="322" width="504" height="44" rx="8" fill="#0D1321"/>
      <text x="708" y="342" fill="#C7C7C7" font-weight="600">Neocloud 三家三个答案</text>
      <text x="708" y="358" fill="#9B9B9B">CoreWeave 6 年 / Lambda 5 年 / Nebius 4 年——同业分歧本身就是不确定性</text>
    </g>
    <rect x="688" y="380" width="504" height="180" rx="8" fill="#1A1428"/>
    <text x="708" y="408" font-size="13.5" font-weight="700" fill="#C9A227">Nadella 亲口承认的核心矛盾</text>
    <text x="708" y="436" font-size="12.5" fill="#E8E4D8">"I didn't want to get stuck with four or five</text>
    <text x="708" y="456" font-size="12.5" fill="#E8E4D8">　years of depreciation on one generation."</text>
    <text x="708" y="484" font-size="12.5" fill="#9B9B9B">翻译：连买家 CEO 都知道单代芯片吃 4-5 年折旧很危险</text>
    <text x="708" y="510" font-size="12.5" fill="#9B9B9B">——那报表上的 6 年是谁在赌？赌的是"价值级联"成立：</text>
    <text x="708" y="536" font-size="12.5" fill="#C9A227">训练→推理→内部负载，旧卡降级续命（A100 至今在租）</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="600" width="1152" height="52" rx="10" fill="#1A1428"/>
  <text x="90" y="632" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">折旧是非现金费用——但 6 年表与 3 年表的差额就是当期利润：会计利润≠经济利润，这 3 年赚的是"时间差"。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：Cerno Capital(B+)·CNBC(A-)·SEC 10-K/10-Q(A)·byteiota 汇总(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">10 / 20</text>
</svg>
