<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">回收算术 I：收入的天花板在哪里？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">全行业 AI 收入 ~$60-70B vs 2026 capex $730B——缺口不是"差一点"，是差一个数量级</text>

  <!-- 主图：收入 vs capex -->
  <g>
    <g stroke="#232D42" stroke-width="1">
      <line x1="100" y1="430" x2="740" y2="430"/>
      <line x1="100" y1="360" x2="740" y2="360" stroke-dasharray="4,4"/>
      <line x1="100" y1="290" x2="740" y2="290" stroke-dasharray="4,4"/>
      <line x1="100" y1="220" x2="740" y2="220" stroke-dasharray="4,4"/>
      <line x1="100" y1="150" x2="740" y2="150" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#5A6474" text-anchor="end">
      <text x="94" y="434">0</text><text x="94" y="364">$200B</text><text x="94" y="294">$400B</text><text x="94" y="224">$600B</text><text x="94" y="154">$800B</text>
    </g>
    <!-- capex 柱 -->
    <rect x="200" y="174.5" width="80" height="255.5" fill="#C9A227"/>
    <text x="240" y="162" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="15" font-weight="700" fill="#E8C55A">$730B</text>
    <text x="240" y="452" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">2026 capex</text>
    <!-- 收入柱 -->
    <rect x="380" y="407.6" width="80" height="22.4" fill="#4A9BC8"/>
    <text x="420" y="398" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="700" fill="#4A9BC8">~$65B</text>
    <text x="420" y="452" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">全行业 AI 收入</text>
    <!-- 有机需求柱 -->
    <rect x="560" y="421.5" width="80" height="8.5" fill="#6FBF9B"/>
    <text x="600" y="412" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="700" fill="#6FBF9B">$30-50B</text>
    <text x="600" y="452" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">剔除循环后的终端需求</text>
    <!-- 差距箭头 -->
    <path d="M 300 200 L 360 400" stroke="#D97B4A" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
    <text x="430" y="260" font-family="'PingFang SC', sans-serif" font-size="13" fill="#D97B4A" font-weight="700">11× 差距</text>
    <text x="450" y="284" font-family="'PingFang SC', sans-serif" font-size="13" fill="#E85A3A" font-weight="700">15-24×（对终端需求）</text>
    <!-- 参照线 -->
    <line x1="100" y1="184" x2="740" y2="184" stroke="#5A6474" stroke-width="1" stroke-dasharray="3,4"/>
    <text x="736" y="176" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="11" fill="#5A6474">盈亏平衡线（台账框架 0.5×capex≈$365B）</text>
  </g>

  <!-- 右侧：分层数据 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="790" y="110" width="430" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="818" y="142" font-size="15" font-weight="700" fill="#4A9BC8">收入侧的真数据（2026 最新）</text>
    <g font-size="12.5" fill="#C7C7C7">
      <text x="818" y="176" font-weight="700" fill="#E8C55A">云与应用层</text>
      <text x="838" y="200">Microsoft AI ARR $37B（+123%）</text>
      <text x="838" y="224">　Copilot 15M 席位（+160%）·GitHub 4.7M 付费</text>
      <text x="838" y="248">OpenAI $25B · Anthropic $65B（年化）</text>
      <text x="838" y="272">　——但两家合计亏损 &gt;$24B/年</text>
      <text x="818" y="306" font-weight="700" fill="#E8C55A">使用量（未来收入的先行指标）</text>
      <text x="838" y="330">Google 3 quadrillion tokens/月（+20× YoY）</text>
      <text x="838" y="354">Gemini 650M MAU · OpenAI 400M+ 用户</text>
      <text x="818" y="388" font-weight="700" fill="#E8C55A">结构问题</text>
      <text x="838" y="412">· MSFT AI 收入 ~70% 依赖 OpenAI</text>
      <text x="838" y="436">· AWS AI 收入 59-73% 来自 OpenAI+Anthropic</text>
      <text x="838" y="460">· 大量"AI 收入"由 VC 输血的创业公司消费</text>
      <text x="838" y="484">　（= 资本市场给自己发收入）</text>
    </g>
    <rect x="818" y="504" width="374" height="60" rx="8" fill="#1A1428"/>
    <text x="1005" y="528" text-anchor="middle" font-size="12.5" fill="#C9A227" font-weight="600">Allianz：capex-收入发散度 46%</text>
    <text x="1005" y="550" text-anchor="middle" font-size="12.5" fill="#C9A227" font-weight="600">＞ 2001 电信周期崩塌前的 32%</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="600" width="1152" height="52" rx="10" fill="#1A1428"/>
  <text x="90" y="632" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">口径注：AI"收入"含云端 AI 服务+订阅+API；不同机构口径 $40-70B 不等——但无论哪个口径，与 capex 的数量级差距都是本报告的核心事实。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：公司财报(A)·Steve Hsu 测算(B+)·Allianz Research(B+)·Geometric Investor 框架(C)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">14 / 20</text>
</svg>
