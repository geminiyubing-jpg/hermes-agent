<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">钱的循环：$879B 承诺之网</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">同一美元在网中流转可在多家公司记为收入——Bloomberg 图谱 + SEC 文件逐笔可查</text>

  <!-- 网络图 -->
  <g font-family="'PingFang SC', sans-serif">
    <!-- 节点: 云厂商上排 AI Labs 中排 芯片商下排 -->
    <!-- 上排 -->
    <rect x="80" y="120" width="150" height="52" rx="10" fill="#1E2A44" stroke="#4A9BC8"/>
    <text x="155" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#9BC1DE">Microsoft</text>
    <text x="155" y="162" text-anchor="middle" font-size="10.5" fill="#7A8494">承诺~$250B</text>
    <rect x="300" y="120" width="150" height="52" rx="10" fill="#1E2A44" stroke="#4A9BC8"/>
    <text x="375" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#9BC1DE">Oracle</text>
    <text x="375" y="162" text-anchor="middle" font-size="10.5" fill="#7A8494">承诺 $300B</text>
    <rect x="520" y="120" width="150" height="52" rx="10" fill="#1E2A44" stroke="#4A9BC8"/>
    <text x="595" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#9BC1DE">Amazon</text>
    <text x="595" y="162" text-anchor="middle" font-size="10.5" fill="#7A8494">投资 $8B→$33B</text>
    <rect x="740" y="120" width="150" height="52" rx="10" fill="#1E2A44" stroke="#4A9BC8"/>
    <text x="815" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#9BC1DE">Google</text>
    <text x="815" y="162" text-anchor="middle" font-size="10.5" fill="#7A8494">TPU 百万片订单</text>
    <rect x="960" y="120" width="150" height="52" rx="10" fill="#1E2A44" stroke="#4A9BC8"/>
    <text x="1035" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#9BC1DE">Meta</text>
    <text x="1035" y="162" text-anchor="middle" font-size="10.5" fill="#7A8494">租赁+SPV</text>

    <!-- 中排 labs -->
    <rect x="190" y="300" width="170" height="56" rx="10" fill="#2B1F3A" stroke="#C9A227"/>
    <text x="275" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#E8C55A">OpenAI</text>
    <text x="275" y="344" text-anchor="middle" font-size="10.5" fill="#B8A87A">ARR $25B · 亏 $20.9B</text>
    <rect x="560" y="300" width="170" height="56" rx="10" fill="#2B1F3A" stroke="#C9A227"/>
    <text x="645" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#E8C55A">Anthropic</text>
    <text x="645" y="344" text-anchor="middle" font-size="10.5" fill="#B8A87A">ARR $65B · 亏 $3B+</text>
    <rect x="930" y="300" width="170" height="56" rx="10" fill="#2B1F3A" stroke="#C9A227"/>
    <text x="1015" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#E8C55A">xAI / CoreWeave</text>
    <text x="1015" y="344" text-anchor="middle" font-size="10.5" fill="#B8A87A">Nv 投 CRWV/押注租赁</text>

    <!-- 下排芯片 -->
    <rect x="380" y="480" width="200" height="60" rx="10" fill="#33211A" stroke="#B3541E"/>
    <text x="480" y="506" text-anchor="middle" font-size="16" font-weight="800" fill="#D97B4A">NVIDIA</text>
    <text x="480" y="526" text-anchor="middle" font-size="10.5" fill="#C9885F">持股 $42.3B · $5.4T 市值</text>
    <rect x="700" y="480" width="160" height="60" rx="10" fill="#33211A" stroke="#B3541E"/>
    <text x="780" y="506" text-anchor="middle" font-size="14" font-weight="700" fill="#D97B4A">AMD</text>
    <text x="780" y="526" text-anchor="middle" font-size="10.5" fill="#C9885F">OpenAI 认购 $90B</text>

    <!-- 连线 -->
    <g stroke="#4A9BC8" stroke-width="2" opacity="0.75" fill="none" >
      <path d="M 155 172 Q 220 240 250 300"/>
      <path d="M 375 172 Q 330 240 290 300"/>
      <path d="M 595 172 Q 620 240 630 300"/>
      <path d="M 815 172 Q 730 240 690 300"/>
    </g>
    <g stroke="#C9A227" stroke-width="2" opacity="0.8" fill="none" >
      <path d="M 300 356 Q 380 430 420 480"/>
      <path d="M 560 356 Q 510 430 480 480"/>
      <path d="M 640 356 Q 700 430 730 480"/>
      <path d="M 930 330 Q 700 420 560 480"/>
    </g>
    <g stroke="#D97B4A" stroke-width="2.5" opacity="0.9" fill="none" >
      <path d="M 460 480 Q 300 430 280 356"/>
    </g>
    <text x="330" y="230" font-size="10.5" fill="#7A8494">股权投资→</text>
    <text x="330" y="246" font-size="10.5" fill="#7A8494">→采购回流</text>
    <text x="580" y="430" font-size="10.5" fill="#B8A87A">算力采购 $879B 承诺网</text>
    <text x="240" y="430" font-size="10.5" fill="#D97B4A">Nv→OpenAI ≤$100B(LOI)</text>
  </g>

  <!-- 右侧注释 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="564" width="1152" height="92" rx="12" fill="#1A1428"/>
    <text x="90" y="594" font-size="14.5" font-weight="700" fill="#C9A227">这张网到底可不可怕？——正反两方各有一半道理</text>
    <text x="90" y="620" font-size="12.5" fill="#E8E4D8">可怕面（Burry/BIS）：同一美元多站记收入；MSFT AI 收入 ~70% 依赖 OpenAI；AWS AI 收入 59-73% 来自 OpenAI+Anthropic——需求端高度自指循环；</text>
    <text x="90" y="644" font-size="12.5" fill="#9B9B9B">不可怕面（FT Lex）：多为股权（损失有上限不入营收）+第三方资本独立承销；与 Qwest 产能互换造假有本质区别——但 NewStreet 每 $10B 投资撬 $35B 采购的估算法未公开。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：Bloomberg 循环融资图谱(A-)·SEC 文件(A)·Steve Hsu 测算(B+)·NewStreet(C)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">07 / 20</text>
</svg>
