<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">投资者在想什么：三层信念的定价地图</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">回答老板的问题："我看不懂资本市场怎么想的"——因为市场自己也在分裂</text>

  <!-- 分层定价 -->
  <g font-family="'PingFang SC', sans-serif">
    <!-- 层1 -->
    <rect x="60" y="110" width="1152" height="126" rx="12" fill="#161D30" stroke="#D97B4A"/>
    <text x="88" y="140" font-size="15" font-weight="700" fill="#D97B4A">第一层 · 供应商层信念：现金已到账（定价最满）</text>
    <text x="88" y="168" font-size="13" fill="#C7C7C7">Nvidia 单季营收 $96.2B/净利 $59.6B(+100%)、FCF $48B——利润是今天的，故事都不用讲</text>
    <text x="88" y="194" font-size="13" fill="#C7C7C7">Micron +242% YTD（HBM4）、SOXX +74%——市场逻辑："卖铲子的先收钱"</text>
    <text x="88" y="222" font-size="12.5" fill="#9B9B9B">隐含假设：下游 capex 不断——这正是该层的软肋（牛鞭效应：Nv 供给承诺 $145B=TTM 营收 47%）</text>

    <!-- 层2 -->
    <rect x="60" y="248" width="1152" height="126" rx="12" fill="#161D30" stroke="#E8C55A"/>
    <text x="88" y="278" font-size="15" font-weight="700" fill="#E8C55A">第二层 · 算力层信念：RPO/积压即未来收入（定价分歧最大）</text>
    <text x="88" y="306" font-size="13" fill="#C7C7C7">同一天财报的两种命运：MSFT RPO $678B(+84%) 股价 +8% vs Meta FCF $784M 股价 -10%</text>
    <text x="88" y="332" font-size="13" fill="#C7C7C7">Amazon AWS +37% 加速 → 市值破 $3T——"需求信号"与"现金流信号"打架时，市场选前者</text>
    <text x="88" y="360" font-size="12.5" fill="#9B9B9B">隐含假设：RPO 不会取消+折旧 6 年成立——两个假设都在 P09-11 被质疑中</text>

    <!-- 层3 -->
    <rect x="60" y="386" width="1152" height="126" rx="12" fill="#161D30" stroke="#6FBF9B"/>
    <text x="88" y="416" font-size="15" font-weight="700" fill="#6FBF9B">第三层 · 应用层信念：亏损=投资（定价最信仰）</text>
    <text x="88" y="444" font-size="13" fill="#C7C7C7">OpenAI $852B / Anthropic $965B 估值，合计 $1.8T——两家合计年亏 &gt;$24B</text>
    <text x="88" y="470" font-size="13" fill="#C7C7C7">VC：Q1 2026 单季 $297B（+150%），81% 投 AI——Slok：VC 87% 押注 AI（1999 年 &lt;40%）</text>
    <text x="88" y="498" font-size="12.5" fill="#9B9B9B">隐含假设：赢家通吃+60-90% 年增速到 2030——互联网历史上只有极少数公司做到过</text>
  </g>

  <!-- 底部：分裂解释 -->
  <rect x="60" y="528" width="1152" height="124" rx="12" fill="#1A1428"/>
  <text x="90" y="560" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#C9A227">为什么"看不懂"？——因为定价逻辑正在换轨</text>
  <text x="90" y="588" font-family="'PingFang SC', sans-serif" font-size="13" fill="#E8E4D8">旧轨：capex-as-proof（财报资本开支越高=信心越足=股价越涨）——2023-25 上半年的单边逻辑；</text>
  <text x="90" y="614" font-family="'PingFang SC', sans-serif" font-size="13" fill="#E8E4D8">新轨：returns-as-proof（要求 token 毛利/FCF 证据）——2026 年起每次财报都在两轨间震荡；</text>
  <text x="90" y="640" font-family="'PingFang SC', sans-serif" font-size="13" fill="#C9A227" font-weight="600">换轨期的波动不是"市场疯了"，是两套信念在打架——理解这一点，就看得懂了。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：公司财报(A)·Slok/Apollo(B+)·Convergences(B+)·BofA 调查(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">17 / 20</text>
</svg>
