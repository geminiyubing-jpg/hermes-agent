<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227"/>
  <!-- 装饰 -->
  <g>
    <circle cx="1100" cy="160" r="80" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.2"/>
    <circle cx="1100" cy="160" r="50" fill="none" stroke="#4A9BC8" stroke-width="1" opacity="0.2"/>
    <circle cx="1100" cy="160" r="24" fill="#1A1428" opacity="0.2"/>
  </g>
  <text x="60" y="100" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="34" font-weight="800" fill="#F5E9C8">结论：一场对"时间"的杠杆收购</text>
  <text x="60" y="140" font-family="'PingFang SC', sans-serif" font-size="16" fill="#E8E4D8">—— 美国科技巨头用债务购买的，其实是"中国追平之前 + 芯片过时之后"的那段窗口期</text>

  <!-- 核心论断 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="170" width="1152" height="120" rx="12" fill="#161D30" stroke="#C9A227"/>
    <text x="90" y="206" font-size="16" font-weight="700" fill="#C9A227">全报告压缩成三句话</text>
    <text x="90" y="238" font-size="14" fill="#E8E4D8">① 钱的来路已经变了：经营现金流 99% 被吃掉+债券发行 5 倍+表外 $1.65T——这场竞赛从"自我造血"变成"资本市场供血"；</text>
    <text x="90" y="266" font-size="14" fill="#E8E4D8">② 钱的回路还没闭合：终端收入 $30-50B vs capex $730B，回收依赖五张牌+折旧假设成立+窗口期足够长——三者环环相扣皆有空头质疑；</text>
    <text x="90" y="294" font-size="14" fill="#E8E4D8">③ 但"崩盘论"同样不严谨：买家半数有真实现金流、需求使用量指数级验证、估值 32.9× 非泡沫定价——这不是 1999 的复刻。</text>
  </g>

  <!-- 对老板问题的直接回答 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="310" width="566" height="230" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="342" font-size="15" font-weight="700" fill="#4A9BC8">"投资者到底怎么想的？"——直接回答</text>
    <text x="88" y="374" font-size="13" fill="#C7C7C7">他们不是傻，是在分层下注：</text>
    <text x="108" y="400" font-size="12.5" fill="#C7C7C7">· 被动资金：指数化被动持有，别无选择；</text>
    <text x="108" y="424" font-size="12.5" fill="#C7C7C7">· 供应商层信徒：现金已到账，何须信仰；</text>
    <text x="108" y="448" font-size="12.5" fill="#C7C7C7">· RPO 信徒：$678B 积压订单=未来收入的期票；</text>
    <text x="108" y="472" font-size="12.5" fill="#C7C7C7">· 应用层信徒：赌下一个万亿营收平台；</text>
    <text x="108" y="496" font-size="12.5" fill="#C7C7C7">· 空头（Burry 等）：赌窗口期比定价的短。</text>
    <text x="88" y="526" font-size="12.5" fill="#C9A227" font-weight="600">看不懂=市场在两轨定价间震荡——现在你知道轨道在哪了</text>

    <rect x="646" y="310" width="566" height="230" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="674" y="342" font-size="15" font-weight="700" fill="#6FBF9B">对中国的启示（老板视角的额外一层）</text>
    <text x="674" y="374" font-size="13" fill="#C7C7C7">· 美国的债务狂潮反证了中国路线的成本优势：</text>
    <text x="694" y="398" font-size="12.5" fill="#9B9B9B">　 用 1/40 的成本追平智力=让对手的资本回收模型失效；</text>
    <text x="674" y="426" font-size="13" fill="#C7C7C7">· 开放权重生态=全球开发者的免费 R&amp;D 部门；</text>
    <text x="674" y="454" font-size="13" fill="#C7C7C7">· 若美国软着陆：中国压力在高端市场定价权；</text>
    <text x="674" y="482" font-size="13" fill="#C7C7C7">· 若美国消化不良：全球 AI capex 收缩反而缓解</text>
    <text x="694" y="506" font-size="12.5" fill="#9B9B9B">　 中国算力进口与自主替代的紧迫性错位；</text>
    <text x="674" y="530" font-size="12.5" fill="#C9A227" font-weight="600">→ 无论哪个情景，"效率路线"的下行风险都更小</text>
  </g>

  <!-- 尾部 -->
  <rect x="60" y="558" width="1152" height="82" rx="12" fill="#1A1428"/>
  <text x="90" y="590" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F5E9C8" font-weight="600">最后一问：这场豪赌荒谬吗？</text>
  <text x="90" y="618" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">从单个公司看是理性最优解（囚徒困境），从系统看是资本结构对技术时间表的豪赌——历史上这类赌注多数以"资产留存、资本湮灭"收场，但推动世界前进的恰是它们。</text>

  <text x="60" y="668" font-family="'PingFang SC', sans-serif" font-size="13" fill="#6E7684">—— 完 · 小爱研究 · 2026-09-01 · 数据截至 2026-08 ——</text>
  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#5A6474">全部来源与等级标注见各页页脚；底稿 sources/source.md 可逐项复核 · 不构成投资建议</text>
</svg>
