<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">军备竞赛 II：五家分账——谁最激进？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">2025 实际 → 2026 指引（亿美元）· 附每家最硬的"回款证据"与最痛的"失血点"</text>

  <!-- 表格 -->
  <g font-family="'PingFang SC', sans-serif">
    <!-- 表头 -->
    <rect x="60" y="110" width="1152" height="40" rx="8" fill="#1E2A44"/>
    <text x="80" y="136" font-size="13" font-weight="700" fill="#F5E9C8">公司</text>
    <text x="240" y="136" font-size="13" font-weight="700" fill="#F5E9C8">2025</text>
    <text x="330" y="136" font-size="13" font-weight="700" fill="#F5E9C8">2026E</text>
    <text x="450" y="136" font-size="13" font-weight="700" fill="#F5E9C8">YoY</text>
    <text x="540" y="136" font-size="13" font-weight="700" fill="#4A9BC8">回款证据（多头弹药）</text>
    <text x="880" y="136" font-size="13" font-weight="700" fill="#D97B4A">失血点（空头弹药）</text>

    <!-- Amazon -->
    <rect x="60" y="156" width="1152" height="58" rx="8" fill="#161D30"/>
    <text x="80" y="182" font-size="14" font-weight="700" fill="#E8C55A">Amazon</text>
    <text x="80" y="202" font-size="11" fill="#7A8494">现金 capex</text>
    <text x="240" y="190" font-size="15" font-family="'Helvetica Neue', sans-serif" fill="#C7C7C7">1318</text>
    <text x="330" y="190" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="700" fill="#E8C55A">~2200</text>
    <text x="450" y="190" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#D97B4A">+67%</text>
    <text x="540" y="182" font-size="12" fill="#C7C7C7">AWS +37%（18 季最快）· backlog $496B</text>
    <text x="540" y="202" font-size="11.5" fill="#7A8494">自研芯片年化收入 >$25B</text>
    <text x="880" y="182" font-size="12" fill="#C7C7C7">TTM FCF <tspan fill="#D97B4A" font-weight="700">-$7.6B</tspan>（去年 +$18.2B）</text>
    <text x="880" y="202" font-size="11.5" fill="#7A8494">内存涨价被迫上调 $200→220B</text>

    <!-- Alphabet -->
    <rect x="60" y="220" width="1152" height="58" rx="8" fill="#161D30"/>
    <text x="80" y="246" font-size="14" font-weight="700" fill="#E8C55A">Alphabet</text>
    <text x="80" y="266" font-size="11" fill="#7A8494">capex</text>
    <text x="240" y="254" font-size="15" font-family="'Helvetica Neue', sans-serif" fill="#C7C7C7">914</text>
    <text x="330" y="254" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="700" fill="#E8C55A">1950-2050</text>
    <text x="450" y="254" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#D97B4A">+117%</text>
    <text x="540" y="246" font-size="12" fill="#C7C7C7">Google Cloud +82% · TPU 对外输出</text>
    <text x="540" y="266" font-size="11.5" fill="#7A8494">拿下 Anthropic 百万级 TPU 订单</text>
    <text x="880" y="246" font-size="12" fill="#C7C7C7">Q2 FCF <tspan fill="#D97B4A" font-weight="700">-$5.9B</tspan>（2004 IPO 以来首次单季转负）</text>
    <text x="880" y="266" font-size="11.5" fill="#7A8494">被迫发百年债+$84.75B 股权融资</text>

    <!-- Microsoft -->
    <rect x="60" y="284" width="1152" height="58" rx="8" fill="#161D30"/>
    <text x="80" y="310" font-size="14" font-weight="700" fill="#E8C55A">Microsoft</text>
    <text x="80" y="330" font-size="11" fill="#7A8494">CY 口径</text>
    <text x="240" y="318" font-size="15" font-family="'Helvetica Neue', sans-serif" fill="#C7C7C7">~1006</text>
    <text x="330" y="318" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="700" fill="#E8C55A">~1750</text>
    <text x="450" y="318" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#D97B4A">+74%</text>
    <text x="540" y="310" font-size="12" fill="#C7C7C7">RPO $678B(+84%)·剔 OpenAI 后 $344B</text>
    <text x="540" y="330" font-size="11.5" fill="#7A8494">单季 FCF 仍 +$19.6B（全场唯一）</text>
    <text x="880" y="310" font-size="12" fill="#C7C7C7">数据中心折旧 15→25 年（会计美化争议）</text>
    <text x="880" y="330" font-size="11.5" fill="#7A8494">$190B→$175B "下调"实为租赁重分类</text>

    <!-- Meta -->
    <rect x="60" y="348" width="556" height="58" rx="8" fill="#161D30"/>
    <text x="80" y="374" font-size="14" font-weight="700" fill="#E8C55A">Meta</text>
    <text x="240" y="382" font-size="15" font-family="'Helvetica Neue', sans-serif" fill="#C7C7C7">722</text>
    <text x="330" y="382" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="700" fill="#E8C55A">1300-1450</text>
    <text x="450" y="382" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#D97B4A">+90%</text>
    <text x="80" y="434" font-size="11" fill="#7A8494">回款：广告 AI 提效（隐性）· 失血：Q2 FCF 剩 $784M；EPS miss 14% 当日 -10%</text>

    <!-- Oracle -->
    <rect x="628" y="348" width="584" height="58" rx="8" fill="#161D30"/>
    <text x="648" y="374" font-size="14" font-weight="700" fill="#E8C55A">Oracle</text>
    <text x="790" y="382" font-size="15" font-family="'Helvetica Neue', sans-serif" fill="#C7C7C7">212</text>
    <text x="880" y="382" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="700" fill="#E8C55A">557(FY26)→950(FY27E)</text>
    <text x="648" y="434" font-size="11" fill="#7A8494">回款：RPO $638B(+438%) · 失血：S&amp;P 降至 BBB- · CDS 40→200bp · FCF 深负</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="470" width="1152" height="168" rx="12" fill="#1A1428"/>
  <text x="90" y="504" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#F5E9C8">格局判读：同一场竞赛，三种体质</text>
  <text x="90" y="534" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">· 印钞机型（MSFT/AMZN/GOOG）：主业现金流 $50-160B/年托底，透支的是"余量"——即使 AI 归零也死不了，跌的是估值；</text>
  <text x="90" y="560" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">· 押上全部身家型（Meta）：广告现金牛独扛 $145B capex，FCF 已压到 3 位数（百万）——市场用 -10% 单日投票；</text>
  <text x="90" y="586" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">· 借壳赌命型（Oracle）：主业增长撑不起 $95B capex，全靠债券市场+OpenAI 承诺——CDS 200bp 说明债市已在定价违约风险。</text>
  <text x="90" y="620" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">投资者看懂的关键：同样是 capex，"印钞机透支"与"借壳赌命"的估值含义完全不同——P17 展开分层定价。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：各公司财报/电话会（A）· 中值口径，各家 capex 定义不同（现金/含租赁/财年错位）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">04 / 20</text>
</svg>
