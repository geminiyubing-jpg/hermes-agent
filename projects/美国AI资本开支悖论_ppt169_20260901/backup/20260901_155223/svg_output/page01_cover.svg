<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227" opacity="0.25"/>
  <!-- 装饰: 上升柱+下坠曲线 -->
  <g>
    <rect x="900" y="560" width="60" height="120" fill="#1F5C4D" opacity="0.25"/>
    <rect x="970" y="480" width="60" height="200" fill="#2E6E8E" opacity="0.25"/>
    <rect x="1040" y="360" width="60" height="320" fill="#C9A227" opacity="0.25"/>
    <rect x="1110" y="240" width="60" height="440" fill="#B3541E" opacity="0.25"/>
    <path d="M 900 520 Q 1010 460 1180 180" stroke="#F5E9C8" stroke-width="2" opacity="0.25" fill="none" stroke-dasharray="6,5"/>
  </g>
  <text x="60" y="130" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="46" font-weight="800" fill="#F5E9C8">7300 亿美元的豪赌</text>
  <text x="60" y="186" font-family="'PingFang SC', sans-serif" font-size="24" fill="#E8E4D8">美国科技巨头的 AI 资本开支悖论</text>
  <text x="60" y="240" font-family="'PingFang SC', sans-serif" font-size="15" fill="#9B9B9B">巨量投入 · 长期债务 · 加速贬值的算力 · 追不开的智力差距 · 资本市场在想什么</text>
  <!-- 四个数字卡 -->
  <g font-family="'Helvetica Neue', sans-serif">
    <rect x="60" y="290" width="270" height="150" rx="12" fill="#161D30" stroke="#2E6E8E"/>
    <text x="84" y="330" font-size="34" font-weight="700" fill="#4A9BC8">$730B</text>
    <text x="84" y="360" font-size="13" fill="#C7C7C7" font-family="'PingFang SC', sans-serif">2026 四巨头 capex 指引</text>
    <text x="84" y="384" font-size="12" fill="#7A8494" font-family="'PingFang SC', sans-serif">≈ 2025 年的 1.78 倍</text>
    <text x="84" y="408" font-size="12" fill="#7A8494" font-family="'PingFang SC', sans-serif">≈ 瑞士全年 GDP</text>

    <rect x="350" y="290" width="270" height="150" rx="12" fill="#161D30" stroke="#B3541E"/>
    <text x="374" y="330" font-size="34" font-weight="700" fill="#D97B4A">$725B+</text>
    <text x="374" y="360" font-size="13" fill="#C7C7C7" font-family="'PingFang SC', sans-serif">2025-26 新发债券+股权</text>
    <text x="374" y="384" font-size="12" fill="#7A8494" font-family="'PingFang SC', sans-serif">Meta $30B 史上最大 IG</text>
    <text x="374" y="408" font-size="12" fill="#7A8494" font-family="'PingFang SC', sans-serif">BIS: 表外 $1.65T&gt;表内</text>

    <rect x="640" y="290" width="270" height="150" rx="12" fill="#161D30" stroke="#C9A227"/>
    <text x="664" y="330" font-size="34" font-weight="700" fill="#E8C55A">$176B</text>
    <text x="664" y="360" font-size="13" fill="#C7C7C7" font-family="'PingFang SC', sans-serif">Burry: 2026-28 或虚增利润</text>
    <text x="664" y="384" font-size="12" fill="#7A8494" font-family="'PingFang SC', sans-serif">GPU 折旧 6 年 vs 真实 2-3 年</text>
    <text x="664" y="408" font-size="12" fill="#7A8494" font-family="'PingFang SC', sans-serif">Oracle +26.9% / Meta +20.8%</text>

    <rect x="930" y="290" width="270" height="150" rx="12" fill="#161D30" stroke="#1F5C4D"/>
    <text x="954" y="330" font-size="34" font-weight="700" fill="#6FBF9B">15-24×</text>
    <text x="954" y="360" font-size="13" fill="#C7C7C7" font-family="'PingFang SC', sans-serif">capex 对真实终端收入错配</text>
    <text x="954" y="384" font-size="12" fill="#7A8494" font-family="'PingFang SC', sans-serif">终端需求 $30-50B vs $730B</text>
    <text x="954" y="408" font-size="12" fill="#7A8494" font-family="'PingFang SC', sans-serif">中美智力差距始终未拉开</text>
  </g>
  <text x="60" y="500" font-family="'PingFang SC', sans-serif" font-size="15" fill="#E8E4D8" font-weight="600">核心问题：钱从哪来、到哪去、怎么回来？——一张图看懂 2026 年最大资本谜题</text>
  <text x="60" y="536" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#9B9B9B">全部数据来自公司财报/SEC/BIS/Bloomberg/审计泄露文件，逐页标注来源等级（A/A-/B+/C）</text>
  <rect x="60" y="560" width="560" height="64" rx="10" fill="#161D30"/>
  <text x="84" y="586" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">作图：小爱 · 2026-09-01 · 数据截至 2026-08</text>
  <text x="84" y="608" font-family="'PingFang SC', sans-serif" font-size="12" fill="#7A8494">调研底稿 sources/source.md 可逐项复核</text>
  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#5A6474">本报告为独立研究，不构成投资建议</text>
</svg>
