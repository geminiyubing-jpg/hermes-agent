<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">网的外援：Nvidia 的 $500B 融资平台与信用敞口</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">卖芯片的开始当"银行"——vendor financing 的 2026 版</text>

  <!-- 左：三层结构 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="142" font-size="15" font-weight="700" fill="#D97B4A">2026-08-11 六大金融机构联手</text>
    <g font-size="12.5" fill="#C7C7C7">
      <rect x="88" y="160" width="504" height="46" rx="8" fill="#0D1321"/>
      <text x="108" y="180" fill="#E8C55A" font-weight="700">BlackRock · Apollo · Goldman Sachs</text>
      <text x="108" y="198" fill="#9B9B9B">Blackstone · Brookfield · KKR</text>
      <rect x="88" y="216" width="504" height="66" rx="8" fill="#1A1428"/>
      <text x="340" y="242" text-anchor="middle" fill="#F5E9C8" font-weight="700">$500B AI 基础设施融资平台</text>
      <text x="340" y="264" text-anchor="middle" fill="#9B9B9B">"独立承销每个项目：客户/需求/利用率/现金流/残值"</text>
      <rect x="88" y="292" width="504" height="46" rx="8" fill="#0D1321"/>
      <text x="340" y="320" text-anchor="middle" fill="#D97B4A" font-weight="600">Nvidia 提供平台 + 可能担保部分项目残值 ≤25%</text>
    </g>
    <g stroke="#232D42"><line x1="88" y1="360" x2="632" y2="360"/></g>
    <text x="88" y="388" font-size="13" font-weight="700" fill="#E8E4D8">信用敞口知多少</text>
    <text x="108" y="414" font-size="12.5" fill="#C7C7C7">· 持股 AI 生态：$3.2B → <tspan fill="#D97B4A" font-weight="700">$42.3B</tspan>（一年 13 倍）</text>
    <text x="108" y="440" font-size="12.5" fill="#C7C7C7">· 单季投资 $18.6B ≈ 单季营收 22.8%（上限口径）</text>
    <text x="108" y="466" font-size="12.5" fill="#C7C7C7">· 供给承诺 $145B（FY27Q1，TTM 营收的 47%）</text>
    <text x="108" y="492" font-size="12.5" fill="#C7C7C7">· MS 估算总信用敞口 2028 或达 <tspan fill="#D97B4A" font-weight="700">$200B</tspan></text>
    <text x="108" y="518" font-size="12.5" fill="#C7C7C7">· 5Y CDS 两个月翻倍（Burry 引用）</text>
    <text x="88" y="552" font-size="11.5" fill="#9B9B9B">→ 走的正是 1999 电信设备商 vendor financing 的老路，</text>
    <text x="88" y="572" font-size="11.5" fill="#9B9B9B">　 但结构以股权+第三方资本为主（FT Lex: "背靠背"而非循环）</text>
  </g>

  <!-- 右：对比 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="660" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="688" y="142" font-size="15" font-weight="700" fill="#C9A227">1999 电信 vs 2026 AI：vendor financing 对照</text>
    <g font-size="12.5">
      <rect x="688" y="160" width="504" height="30" rx="6" fill="#1E2A44"/>
      <text x="700" y="180" fill="#9BC1DE" font-weight="600">1999：Lucent/Nortel/Cisco 贷款给 CLEC 买家</text>
      <text x="700" y="212" fill="#C7C7C7">· 贸易信贷+贷款：$7-8B(Lucent)/$3.1B(Nortel)/$2.4B(Cisco)</text>
      <text x="700" y="238" fill="#C7C7C7">· 买家 CLEC EBITDA 率 -30%~-918%（根本没有现金流）</text>
      <text x="700" y="264" fill="#C7C7C7">· 崩塌：买家破产 → 减记 &gt;$100B → SEC 罚单</text>
      <rect x="688" y="284" width="504" height="30" rx="6" fill="#33211A"/>
      <text x="700" y="304" fill="#D97B4A" font-weight="600">2026：Nvidia 投资客户 + 撮合华尔街资本</text>
      <text x="700" y="336" fill="#C7C7C7">· 主要形式：股权（损失封顶、不冲回收入）</text>
      <text x="700" y="362" fill="#C7C7C7">· ~50% 买家是超大规模厂商（有真实经营现金流）</text>
      <text x="700" y="388" fill="#C7C7C7">· neocloud（CoreWeave 等）信用风险更接近 CLEC</text>
      <text x="700" y="420" fill="#C7C7C7">· H100 时租 $8→$1、利用率 80% 假设 vs 60% 现实</text>
    </g>
    <rect x="688" y="440" width="504" height="120" rx="8" fill="#1A1428"/>
    <text x="708" y="468" font-size="13.5" font-weight="700" fill="#C9A227">裁决（LDSTN 五腿评分：空头论点 2/5 分）</text>
    <text x="708" y="494" font-size="12" fill="#9B9B9B">存活：牛鞭效应（供给承诺是真风险）</text>
    <text x="708" y="518" font-size="12" fill="#9B9B9B">半存活：循环规模+买家集中度；死掉：折旧论/电信类比/欺诈指控</text>
    <text x="708" y="544" font-size="12" fill="#C9A227">→ 真正的风险不是"造假"，是"真实但脆弱"</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="600" width="1152" height="52" rx="10" fill="#1A1428"/>
  <text x="90" y="632" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">观察哨①：融资条款是否开始向更弱对手方、更弱抵押下沉——那是 2001 电信崩塌前的第一信号（目前"条款尚稳"）。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：Nvidia 公告(A)·Morgan Stanley(B+)·Yahoo Finance(B+)·LDSTN 分析(C)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">09 / 20</text>
</svg>
