<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">执行摘要：五个数字读懂这场豪赌</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">先看全景再看细节——每一页都回答老板的一个疑问</text>

  <!-- 五发现卡 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="566" height="100" rx="12" fill="#161D30" stroke="#2E6E8E"/>
    <text x="84" y="144" font-size="15" font-weight="700" fill="#4A9BC8">发现① 军备竞赛规模：$238B(2024)→$410B(2025)→$730B(2026E)</text>
    <text x="84" y="170" font-size="12.5" fill="#C7C7C7">四巨头单季 capex 已吃掉经营现金流的 99.0%——历史最快基建狂潮，无先例可循</text>
    <text x="84" y="194" font-size="12" fill="#7A8494">Amazon $220B / Alphabet $195-205B / Microsoft ~$175B / Meta $130-145B（P03-04）</text>

    <rect x="646" y="112" width="566" height="100" rx="12" fill="#161D30" stroke="#B3541E"/>
    <text x="670" y="144" font-size="15" font-weight="700" fill="#D97B4A">发现② 债务化转折：自有现金时代结束了</text>
    <text x="670" y="170" font-size="12.5" fill="#C7C7C7">2025 债券发行 $20B→$109B（一年 5 倍）；表外 SPV 债务 $1.65T 已超表内 $1.35T（BIS）</text>
    <text x="670" y="194" font-size="12" fill="#7A8494">Oracle 被降至 BBB- 距垃圾级一步；Alphabet 发百年债+史上最大 $84.75B 股权融资（P05-06）</text>

    <rect x="60" y="228" width="566" height="100" rx="12" fill="#161D30" stroke="#C9A227"/>
    <text x="84" y="260" font-size="15" font-weight="700" fill="#E8C55A">发现③ 折旧战争：$176B 利润悬在一条会计假设上</text>
    <text x="84" y="286" font-size="12.5" fill="#C7C7C7">GPU 折旧 6 年 vs 真实经济寿命 2-3 年——若 Burry 对，2026-28 全行业利润虚增 $176B</text>
    <text x="84" y="310" font-size="12" fill="#7A8494">价值级联反驳：训练→推理→内部负载降级使用，A100 至今服役（P10-11）</text>

    <rect x="646" y="228" width="566" height="100" rx="12" fill="#161D30" stroke="#1F5C4D"/>
    <text x="670" y="260" font-size="15" font-weight="700" fill="#6FBF9B">发现④ 智力差距：算力堆不出护城河</text>
    <text x="670" y="286" font-size="12.5" fill="#C7C7C7">Kimi K3 几乎追平 Anthropic 最强模型（成本零头）；OpenRouter 中国模型占消费多数</text>
    <text x="670" y="310" font-size="12" fill="#7A8494">DeepSeek 成本可达 OpenAI 1/40——买不来代差，只能买时间差（P12-13）</text>

    <rect x="60" y="344" width="1152" height="100" rx="12" fill="#161D30" stroke="#8A6D1F"/>
    <text x="84" y="376" font-size="15" font-weight="700" fill="#C9A227">发现⑤ 回收算术：终端收入 ~$30-50B vs capex $730B（15-24× 错配）</text>
    <text x="84" y="402" font-size="12.5" fill="#C7C7C7">投资者在赌什么：一条 required-returns 链——供应商层已盈利→云层在透支→应用层尚待验证</text>
    <text x="84" y="426" font-size="12" fill="#7A8494">台账框架：变现收入须达 capex 的 0.35-0.6x/年 才能覆盖折旧+电力+融资+过时风险（P14-17）</text>
  </g>

  <!-- 底部结论 -->
  <rect x="60" y="464" width="1152" height="170" rx="12" fill="#1A1428"/>
  <text x="90" y="500" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#F5E9C8">一句话总览</text>
  <text x="90" y="532" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#E8E4D8">这不是"AI 有没有用"的问题，而是"资本结构能不能撑到 AI 变现有用"的问题——</text>
  <text x="90" y="560" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#E8E4D8">四巨头用 99% 的现金流+千亿美元级新债+表外 SPV 押注一条尚未闭合的收入回路，</text>
  <text x="90" y="588" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#C9A227" font-weight="600">而芯片 2-3 年过时、中国模型追平——两条时间赛跑，是理解全部乱象的钥匙。</text>
  <text x="90" y="616" font-family="'PingFang SC', sans-serif" font-size="12.5" fill="#7A8494">最可能结局（历史框架裁决）：数据中心建起来+被使用，但建造它们的资本很多回不来（P18-19）</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">来源：各公司财报/SEC·BIS·Bloomberg·Cerno·审计泄露(FT验证)（A/A-/B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">02 / 20</text>
</svg>
