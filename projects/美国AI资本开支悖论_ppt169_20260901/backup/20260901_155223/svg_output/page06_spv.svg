<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">债务洪流 II：表外的冰山——SPV 隐形杠杆</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">BIS：五大厂表外债务 $1.65T &gt; 表内 $1.35T——杠杆藏在标准报表之外，四年膨胀 8 倍</text>

  <!-- 冰山图 -->
  <g>
    <rect x="60" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="142" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#4A9BC8">一座冰山：看得见 vs 看不见</text>
    <!-- 水线 -->
    <line x1="100" y1="300" x2="580" y2="300" stroke="#4A9BC8" stroke-width="2" stroke-dasharray="8,5"/>
    <text x="560" y="290" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="11" fill="#4A9BC8">── 报表水线 ──</text>
    <!-- 表内 -->
    <rect x="180" y="190" width="320" height="110" rx="8" fill="#2E6E8E" opacity="0.9"/>
    <text x="340" y="230" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="26" font-weight="700" fill="#F5E9C8">$1.35T</text>
    <text x="340" y="258" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12.5" fill="#CFE4F5">表内报告债务（五大厂合计）</text>
    <text x="340" y="280" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11" fill="#9BC1DE">评级机构/投资者看得到</text>
    <!-- 表外 -->
    <rect x="150" y="312" width="380" height="240" rx="8" fill="#B3541E" opacity="0.85"/>
    <text x="340" y="368" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="32" font-weight="700" fill="#FFF3E8">$1.65T</text>
    <text x="340" y="398" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13" fill="#FFE0CC">表外 SPV/租赁/采购承诺（Nikkei 测算）</text>
    <text x="340" y="424" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#F5C9A8">SPV 债务不上杠杆率报表——</text>
    <text x="340" y="444" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#F5C9A8">只体现在 CDS 利差里</text>
    <text x="340" y="480" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11" fill="#D9986E">Meta: 表外 ~$420B vs 表内 $140B</text>
    <text x="340" y="502" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11" fill="#D9986E">Oracle: $273B（四年涨 30 倍）</text>
    <text x="340" y="530" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11" fill="#D9986E">四年整体膨胀 ~8 倍</text>
  </g>

  <!-- 右侧案例 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="660" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="688" y="142" font-size="15" font-weight="700" fill="#D97B4A">解剖一只 SPV：Meta × Blue Owl "Beignet"</text>
    <rect x="688" y="160" width="504" height="132" rx="8" fill="#0D1321"/>
    <text x="708" y="188" font-size="13" fill="#C7C7C7">结构：$27.3B 抵押债 + $2.5B 股权（Blue Owl 控 80%）</text>
    <text x="708" y="214" font-size="13" fill="#C7C7C7">Meta 持 20% + 独家承租运营——数据中心的"REITs 化"</text>
    <text x="708" y="244" font-size="13" fill="#F5C9A8">诡异点：S&amp;P 给 A+ 评级，收益率却 6.58%</text>
    <text x="708" y="268" font-size="12.5" fill="#9B9B9B">（投机级水平的定价 = 市场不信评级）</text>
    <text x="688" y="320" font-size="14" font-weight="700" fill="#E8E4D8">为什么这么干？三重动机</text>
    <text x="708" y="348" font-size="12.5" fill="#C7C7C7">① 报表瘦身：SPV 债务不计入 Meta 资产负债表——腾出空间</text>
    <text x="708" y="372" font-size="12.5" fill="#C7C7C7">② 随即在公开市场再发 $30B IG 债（双线融资）</text>
    <text x="708" y="396" font-size="12.5" fill="#C7C7C7">③ 出表后 capex/现金流比率"好看"——支撑股价叙事</text>
    <rect x="688" y="416" width="504" height="140" rx="8" fill="#1A1428"/>
    <text x="708" y="444" font-size="13.5" font-weight="700" fill="#C9A227">2008 回声 vs 关键差异</text>
    <text x="708" y="470" font-size="12" fill="#9B9B9B">回声：SPV+表外+CDS 飙升——Burry 称"2008 重演,shenanigans"</text>
    <text x="708" y="494" font-size="12" fill="#9B9B9B">差异：底层资产是真实创收设备（GPU/电力/建筑），</text>
    <text x="708" y="518" font-size="12" fill="#9B9B9B">不是没现金流的三层 CDO——但残值取决于 3 年后芯片还值钱吗</text>
    <text x="708" y="544" font-size="12" fill="#C9A227">→ 表外结构把"芯片贬值风险"转移给了 SPV 债权人</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="600" width="1152" height="52" rx="10" fill="#1A1428"/>
  <text x="90" y="632" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">BofA 调查：34% 基金经理认为超大规模厂商 capex 是最可能引发<tspan fill="#D97B4A" font-weight="700">系统性信用事件</tspan>的源头（环比翻倍）——BIS 已在 2026 年报正式警告。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：BIS 年报(A)·Nikkei Asia(B+)·edgen/BofA 调查(B+)·S&amp;P(A-)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">06 / 20</text>
</svg>
