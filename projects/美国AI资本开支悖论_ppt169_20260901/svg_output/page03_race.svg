<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">军备竞赛 I：史上最大基建狂潮</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">$238B(2024) → $410B(2025) → ~$730B(2026E)——三年翻三倍，超瑞士 GDP</text>

  <!-- 主柱图 -->
  <g>
    <g stroke="#232D42" stroke-width="1">
      <line x1="100" y1="440" x2="700" y2="440"/>
      <line x1="100" y1="370" x2="700" y2="370" stroke-dasharray="4,4"/>
      <line x1="100" y1="300" x2="700" y2="300" stroke-dasharray="4,4"/>
      <line x1="100" y1="230" x2="700" y2="230" stroke-dasharray="4,4"/>
      <line x1="100" y1="160" x2="700" y2="160" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#5A6474" text-anchor="end">
      <text x="94" y="444">0</text><text x="94" y="374">$200B</text><text x="94" y="304">$400B</text><text x="94" y="234">$600B</text><text x="94" y="164">$800B</text>
    </g>
    <!-- 柱: 238 410 730 -->
    <rect x="160" y="356.7" width="90" height="83.3" fill="#2E6E8E"/>
    <rect x="310" y="296.5" width="90" height="143.5" fill="#4A9BC8"/>
    <rect x="460" y="184.5" width="90" height="255.5" fill="#C9A227"/>
    <g font-family="'Helvetica Neue', sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      <text x="205" y="342" fill="#4A9BC8">$238B</text>
      <text x="355" y="282" fill="#4A9BC8">$410B</text>
      <text x="505" y="170" fill="#E8C55A">$730B</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#9B9B9B" text-anchor="middle">
      <text x="205" y="462">2024</text><text x="355" y="462">2025</text><text x="505" y="462">2026E</text>
    </g>
    <text x="330" y="490" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#5A6474">YoY: — → +72% → +78%（中值口径，各家定义略有差异）</text>
    <!-- 参照 -->
    <g font-family="'PingFang SC', sans-serif">
      <line x1="580" y1="160" x2="580" y2="440" stroke="#B3541E" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="590" y="180" font-size="11.5" fill="#D97B4A">瑞士 GDP ~$900B</text>
      <text x="590" y="200" font-size="11.5" fill="#7A8494">→ 2026 一年 capex ≈ 81%</text>
    </g>
  </g>

  <!-- 右侧：单季吸收比 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="760" y="110" width="460" height="380" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="788" y="142" font-size="15" font-weight="700" fill="#4A9BC8">2026 Q2 单季：现金流几乎全被吃掉</text>
    <rect x="788" y="160" width="404" height="70" rx="8" fill="#0D1321"/>
    <text x="808" y="188" font-size="13" fill="#C7C7C7">四家单季 capex <tspan font-weight="700" fill="#E8C55A">$170.1B</tspan></text>
    <text x="808" y="212" font-size="13" fill="#C7C7C7">四家单季经营现金流 <tspan font-weight="700" fill="#4A9BC8">$171.7B</tspan></text>
    <text x="990" y="262" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#D97B4A">99.0%</text>
    <text x="990" y="286" text-anchor="middle" font-size="12.5" fill="#9B9B9B">Capex Absorption Ratio（Axis Intelligence）</text>
    <g stroke="#232D42"><line x1="788" y1="300" x2="1192" y2="300"/></g>
    <text x="788" y="326" font-size="13" fill="#C7C7C7">分家看（capex / 经营现金流）：</text>
    <text x="808" y="352" font-size="12.5" fill="#C7C7C7">Alphabet  <tspan fill="#D97B4A" font-weight="600">115.0%</tspan>　Amazon  <tspan fill="#D97B4A" font-weight="600">116.9%</tspan></text>
    <text x="808" y="378" font-size="12.5" fill="#C7C7C7">Meta  <tspan fill="#D97B4A" font-weight="600">97.5%</tspan>　　Microsoft  <tspan fill="#4A9BC8" font-weight="600">74.0%</tspan></text>
    <text x="788" y="410" font-size="12.5" fill="#9B9B9B">→ 三家单季超支，全靠 MSFT 一家盈余撑住门面</text>
    <text x="788" y="440" font-size="12.5" fill="#9B9B9B">→ PIMCO：未来两年将升至 ~94%（2023 年仅 40%）</text>
    <text x="788" y="468" font-size="12" fill="#5A6474">摩根士丹利/GS：2027 全行业将破 $1T</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="510" width="1152" height="128" rx="12" fill="#1A1428"/>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#F5E9C8">为什么停不下来？——囚徒困境的三重锁定</text>
  <text x="90" y="574" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">① 竞争锁定：谁先停建谁就把云市场份额让给对手——AWS 增速 18 季最快(37%)、Google Cloud +82% 证明"建了就有人买"；</text>
  <text x="90" y="600" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">② 契约锁定：MSFT RPO $678B(+84%)、Oracle RPO $638B(+438%)——天量订单在手，停建=违约；</text>
  <text x="90" y="626" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">③ 政治锁定：Slok (Apollo)：数据中心建设已成 GDP 增长的关键引擎——大到不能停。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：各公司 2026 Q2 财报/电话会（A）·Axis Intelligence 汇总（A-）·PIMCO/BIS（A-）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">03 / 20</text>
</svg>
