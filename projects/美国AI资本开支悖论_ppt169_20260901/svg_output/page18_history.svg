<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">历史裁决：三次基建狂潮的对照组</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">光纤(1996-2001) · 铁路(1865-1873) · 思科(1999)——"资产留存，资本湮灭"是基建泡沫的通史</text>

  <!-- 三案例卡 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="110" width="372" height="300" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="140" font-size="15" font-weight="700" fill="#4A9BC8">光纤泡沫 1996-2001</text>
    <g font-size="12" fill="#C7C7C7">
      <text x="88" y="170">投了什么：$500B+ 骨干网（全球）</text>
      <text x="88" y="196">结局：仅 ~2.7% 光纤被点亮（2002）</text>
      <text x="88" y="222">　电信公司破产潮（世通/环球电讯）</text>
      <text x="88" y="248">资产命运：光纤留下来了——</text>
      <text x="88" y="274">　 YouTube/Netflix/云计算全靠它起飞</text>
      <text x="88" y="304" fill="#D97B4A">资本命运：股东归零、债券减记</text>
      <text x="88" y="330" fill="#D97B4A">　 $100B IG 债 2002 年变垃圾（Burry 警示）</text>
    </g>
    <text x="88" y="376" font-size="12.5" fill="#C9A227" font-weight="600">教训：基建真实有用 ≠ 投资者赚钱</text>

    <rect x="448" y="110" width="372" height="300" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="476" y="140" font-size="15" font-weight="700" fill="#4A9BC8">铁路狂潮 1865-1873</text>
    <g font-size="12" fill="#C7C7C7">
      <text x="476" y="170">投了什么：英国 ~£250M（GDP 的份额</text>
      <text x="476" y="196">　远超今日 AI 占比）</text>
      <text x="476" y="222">结局：1873 维也纳/纽约股灾</text>
      <text x="476" y="248">　多家铁路公司破产重组</text>
      <text x="476" y="274">资产命运：路网留存，运价暴跌 90%</text>
      <text x="476" y="300">　——消费者拿到全部红利</text>
      <text x="476" y="330" fill="#D97B4A">资本命运：债券投资人血本无归</text>
    </g>
    <text x="476" y="376" font-size="12.5" fill="#C9A227" font-weight="600">教训：过量基建的终局是价格战</text>

    <rect x="836" y="110" width="384" height="300" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="864" y="140" font-size="15" font-weight="700" fill="#4A9BC8">思科 1999-2001</text>
    <g font-size="12" fill="#C7C7C7">
      <text x="864" y="170">定位："卖铲子"完美对标 Nvidia</text>
      <text x="864" y="196">结局：客户（电信）削减 capex →</text>
      <text x="864" y="222">　 营收 -36%（六个季度内反转）</text>
      <text x="864" y="248">　 减记 $2.5B 库存</text>
      <text x="864" y="274">股价命运：-85%，15 年未回 2000 高点</text>
      <text x="864" y="300">　（2025-12 才收复）</text>
      <text x="864" y="330" fill="#D97B4A">Burry："Nvidia is clearly Cisco"</text>
    </g>
    <text x="864" y="376" font-size="12.5" fill="#C9A227" font-weight="600">差异：思科 P/E 235× vs Nvidia 32.9×</text>
  </g>

  <!-- 对照表 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="426" width="1152" height="164" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="456" font-size="14.5" font-weight="700" fill="#E8E4D8">2026 AI 与三次狂潮的关键异同（Andy综合，C 级判断）</text>
    <g font-size="12.5" fill="#C7C7C7">
      <text x="88" y="486" fill="#6FBF9B">✓ 相似：capex/GDP 比例、发行人质量下沉、vendor financing、"需求永远在"叙事、产能过剩前兆</text>
      <text x="88" y="514" fill="#6FBF9B">✓ 相似：财富从债券/股权投资人转移到设备商与未来用户（价格暴跌的受益者）</text>
      <text x="88" y="542" fill="#D97B4A">✗ 不同：今天买家 ~50% 是有真实现金流的大厂（当年 CLEC EBITDA -30%~-918%）；Nv 估值 32.9× 非泡沫定价</text>
      <text x="88" y="570" fill="#D97B4A">✗ 不同：需求侧已验证（token 20×/年、Copilot 席位翻倍）——1999 年没有"使用量"证明</text>
    </g>
  </g>

  <!-- 底部 -->
  <rect x="60" y="604" width="1152" height="48" rx="10" fill="#1A1428"/>
  <text x="90" y="634" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">历史基线预测：数据中心会建成并被使用（like 光纤）——但相当一部分建设资本永远回不来（like 光纤）。两个判断同时为真。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：历史记录(公开史料,A-/B+)·Burry 引用(A-)·LDSTN 对照分析(C)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">18 / 20</text>
</svg>
