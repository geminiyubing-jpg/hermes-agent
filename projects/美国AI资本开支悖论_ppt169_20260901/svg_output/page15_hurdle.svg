<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">回收算术 II：需要多少收入才能回本？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">台账框架（required-returns 链）：变现收入须达 capex 的 0.35-0.6×/年——三个情景推演 2030</text>

  <!-- 左：三层台账 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="142" font-size="15" font-weight="700" fill="#C9A227">AI 是一条"要求回报链"</text>
    <!-- 三层 -->
    <rect x="88" y="160" width="504" height="100" rx="10" fill="#33211A"/>
    <text x="108" y="188" font-size="14" font-weight="700" fill="#D97B4A">第一层 · 供应商（Nvidia/台积电/海力士）</text>
    <text x="108" y="212" font-size="12" fill="#C7C7C7">已盈利兑现：Nv 单季净利 $59.6B(+100%)、FCF $48B</text>
    <text x="108" y="236" font-size="12" fill="#6FBF9B">市场定价最充分的一层——但收入=下一层的 capex</text>
    <rect x="88" y="272" width="504" height="100" rx="10" fill="#1E2A44"/>
    <text x="108" y="300" font-size="14" font-weight="700" fill="#4A9BC8">第二层 · 算力层（云厂商/neocloud）</text>
    <text x="108" y="324" font-size="12" fill="#C7C7C7">在透支：FCF 转负/压线；须卖 token 覆盖折旧+电力+融资</text>
    <text x="108" y="348" font-size="12" fill="#D97B4A">hurdle：变现收入 0.35-0.6× capex/年（4-6 年资产寿命）</text>
    <rect x="88" y="384" width="504" height="100" rx="10" fill="#2B1F3A"/>
    <text x="108" y="412" font-size="14" font-weight="700" fill="#E8C55A">第三层 · 应用层（LABS+SaaS+企业）</text>
    <text x="108" y="436" font-size="12" fill="#C7C7C7">尚未证明：OpenAI/Anthropic 高增长高亏损</text>
    <text x="108" y="460" font-size="12" fill="#9B9B9B">价值分配：半导体层吃走 ~$225B 毛利/73%毛利</text>
    <rect x="88" y="496" width="504" height="64" rx="10" fill="#1A1428"/>
    <text x="340" y="522" text-anchor="middle" font-size="12.5" fill="#C9A227" font-weight="600">链条法则：任何一层断供/断需，上下两层同震——</text>
    <text x="340" y="544" text-anchor="middle" font-size="12.5" fill="#C9A227" font-weight="600">现在的市场在给第一层定价，还没审计第二三层</text>
  </g>

  <!-- 右：2030 三情景 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="660" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="688" y="142" font-size="15" font-weight="700" fill="#4A9BC8">2030 收入需求三情景（Andy测算，C 级）</text>
    <g font-size="12.5">
      <rect x="688" y="160" width="504" height="88" rx="8" fill="#0D1321"/>
      <text x="708" y="186" fill="#6FBF9B" font-weight="700">基准（概率 50%）：收入 $400-600B</text>
      <text x="708" y="210" fill="#C7C7C7">路径：企业渗透从 12%→40%，token 用量 10×，价格降 70%</text>
      <text x="708" y="234" fill="#9B9B9B">结果：2026-28 累计 capex 大部分回收，但股权回报平庸</text>
      <rect x="688" y="258" width="504" height="88" rx="8" fill="#0D1321"/>
      <text x="708" y="284" fill="#E8C55A" font-weight="700">乐观（概率 25%）：收入 $800B-1.1T</text>
      <text x="708" y="308" fill="#C7C7C7">路径：Agent 经济成型，AI 原生工作流重构 SaaS（+10% 全球 GDP 生产率红利）</text>
      <text x="708" y="332" fill="#9B9B9B">结果：全网回收+赢家通吃——1995 互联网叙事重演</text>
      <rect x="688" y="356" width="504" height="88" rx="8" fill="#0D1321"/>
      <text x="708" y="382" fill="#D97B4A" font-weight="700">悲观（概率 25%）：收入 $150-250B</text>
      <text x="708" y="406" fill="#C7C7C7">路径：企业渗透 plateau 在 20%，中国开源压制定价权，VC 断供</text>
      <text x="708" y="430" fill="#9B9B9B">结果：2027-28 减记潮+SPV 违约——2001 电信式出清（资产留存资本湮灭）</text>
    </g>
    <text x="688" y="478" font-size="13" font-weight="700" fill="#E8E4D8">估值锚：OpenAI+Anthropic 合计 $1.8T 估值</text>
    <text x="708" y="502" font-size="12" fill="#9B9B9B">需 2030 年 $300-500B 年收入（Steve Hsu）→ 年增速 60-90%</text>
    <text x="708" y="526" font-size="12" fill="#9B9B9B">当前有机需求 $30-50B → 须连续四年每年翻倍</text>
    <text x="708" y="556" font-size="12.5" fill="#C9A227" font-weight="600">→ 乐观情景不是"可能"，是"必须"——这就是市场的赌注</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="600" width="1152" height="52" rx="10" fill="#1A1428"/>
  <text x="90" y="632" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">一句话：现在的 AI 收入增速（+100%/年）其实惊人地好——问题只在于 capex 增速（+78%）×资产折旧（3 年）×中国降价三条曲线同时压着它。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：Geometric Investor 框架(C)·Steve Hsu(B+)·公司财报(A)·情景为Andy测算(C)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">15 / 20</text>
</svg>
