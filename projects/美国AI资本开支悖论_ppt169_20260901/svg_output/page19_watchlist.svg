<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#C9A227"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">观察哨：未来 12-18 个月的五个信号</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">不用预测崩盘或牛市——盯住这五个可证伪的信号，方向自会显现</text>

  <!-- 五信号 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="110" width="566" height="128" rx="12" fill="#161D30" stroke="#D97B4A"/>
    <text x="88" y="142" font-size="15" font-weight="700" fill="#D97B4A">信号① 融资条款是否下沉信用曲线</text>
    <text x="88" y="170" font-size="12.5" fill="#C7C7C7">警戒：融资扩展到更弱对手方/更弱抵押（GPU 二押/收益权重复质押）</text>
    <text x="88" y="196" font-size="12.5" fill="#C7C7C7">当前：条款"尚稳"（第三方资本独立承销）——2001 崩塌前此信号先行</text>
    <text x="88" y="224" font-size="12" fill="#9B9B9B">监测：neocloud 新发债利率/抵押率/LTV</text>

    <rect x="646" y="110" width="574" height="128" rx="12" fill="#161D30" stroke="#D97B4A"/>
    <text x="674" y="142" font-size="15" font-weight="700" fill="#D97B4A">信号② capex-收入缺口方向</text>
    <text x="674" y="170" font-size="12.5" fill="#C7C7C7">警戒：发散度从 46% 继续走阔（&gt;2001 的 32% 已破）</text>
    <text x="674" y="196" font-size="12.5" fill="#C7C7C7">安全：2027 收入增速 &gt; capex 增速（缺口收敛）</text>
    <text x="674" y="224" font-size="12" fill="#9B9B9B">监测：季度 AI 收入 ARR vs capex guidance</text>

    <rect x="60" y="252" width="566" height="128" rx="12" fill="#161D30" stroke="#E8C55A"/>
    <text x="88" y="284" font-size="15" font-weight="700" fill="#E8C55A">信号③ 股权融资是否让位于债务</text>
    <text x="88" y="312" font-size="12.5" fill="#C7C7C7">警戒：GPU 抵押贷款/担保/私人信贷占比上升——损失从"封顶"变"串联"</text>
    <text x="88" y="338" font-size="12.5" fill="#C7C7C7">当前：Nv 残值担保 ≤25% 已是苗头；MS 测 2028 敞口 $200B</text>
    <text x="88" y="366" font-size="12" fill="#9B9B9B">监测：SPV 发行量 vs IPO/股权融资量</text>

    <rect x="646" y="252" width="574" height="128" rx="12" fill="#161D30" stroke="#E8C55A"/>
    <text x="674" y="284" font-size="15" font-weight="700" fill="#E8C55A">信号④ 折旧假设的官方裁决</text>
    <text x="674" y="312" font-size="12.5" fill="#C7C7C7">警戒：第二家大厂效仿 Amazon 缩短年限（6→5→4 连锁）</text>
    <text x="674" y="338" font-size="12.5" fill="#C7C7C7">安全：Blackwell 二代量产后 H100 利用率仍 &gt;70%</text>
    <text x="674" y="366" font-size="12" fill="#9B9B9B">监测：10-K useful life 附注+加速折旧科目</text>

    <rect x="60" y="394" width="1152" height="128" rx="12" fill="#161D30" stroke="#6FBF9B"/>
    <text x="88" y="426" font-size="15" font-weight="700" fill="#6FBF9B">信号⑤ 宣布的交易是否实际交割（最重要的"纸上数字"检验）</text>
    <text x="88" y="454" font-size="12.5" fill="#C7C7C7">Nvidia→OpenAI $100B 仅为 LOI 意向书；媒体盛传的"$750B"是记者加总的非签约数字</text>
    <text x="88" y="480" font-size="12.5" fill="#C7C7C7">已交割验证：Oracle RPO 里 $75B 预付/自带硬件款是真实现金流——跟踪其转化率</text>
    <text x="88" y="508" font-size="12" fill="#9B9B9B">监测：各"战略合作"从 announce 到 definitive agreement 的落差</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="538" width="1152" height="114" rx="12" fill="#1A1428"/>
  <text x="90" y="570" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#F5E9C8">Andy 的三情景概率（2026-09 时点，滚动修正）</text>
  <g font-family="'PingFang SC', sans-serif" font-size="13" fill="#E8E4D8">
    <text x="90" y="598">① 软着陆（45%）：2027 收入加速+capex 增速回落——缺口收敛，估值消化，无系统性事件；</text>
    <text x="90" y="624">② 消化不良（40%）：2027-28 减记潮+部分 neocloud/SPV 违约——信贷事件但大厂无恙（2001 式局部出清）；</text>
    <text x="90" y="650" fill="#C9A227" font-weight="600">③ 硬着陆（15%）：终端需求证伪+中国压制+流动性逆转——指数级传染（2008 式）。信号①③恶化时上调②③概率。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">框架来源：brendonbeebe 五问(C)·Geometric Investor(C)·Andy综合(C)——全部可证伪、可跟踪</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">19 / 20</text>
</svg>
