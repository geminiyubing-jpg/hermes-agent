<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E6E8E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">回收路径 A/B/C：钱到底怎么回来？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">除了"卖 token"，巨头手里其实还有五张回收牌——每张都有先例可循</text>

  <!-- 五张牌 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="110" width="372" height="196" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="140" font-size="15" font-weight="700" fill="#6FBF9B">牌A · 云毛利（已验证）</text>
    <text x="88" y="168" font-size="12" fill="#C7C7C7">AWS Q2 营收 $42.2B、经营利润 $16.6B（率 39%）</text>
    <text x="88" y="192" font-size="12" fill="#C7C7C7">Azure +43% · Google Cloud +82%</text>
    <text x="88" y="216" font-size="12" fill="#9B9B9B">机制：算力转租赁，capex→经营租赁收入</text>
    <text x="88" y="240" font-size="12" fill="#9B9B9B">先例：AWS 十年从 0 到 $115B run-rate</text>
    <text x="88" y="270" font-size="12" fill="#6FBF9B" font-weight="600">确定性 ★★★★☆</text>

    <rect x="448" y="110" width="372" height="196" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="476" y="140" font-size="15" font-weight="700" fill="#4A9BC8">牌B · 订阅嵌入（进行中）</text>
    <text x="476" y="168" font-size="12" fill="#C7C7C7">M365 Copilot 15M 席位×$30/月 ≈ $5.4B ARR</text>
    <text x="476" y="192" font-size="12" fill="#C7C7C7">GitHub Copilot 4.7M 付费（+75%）</text>
    <text x="476" y="216" font-size="12" fill="#9B9B9B">机制：把推理成本摊进既有订阅价——</text>
    <text x="476" y="240" font-size="12" fill="#9B9B9B">用户感知"免费升级"，财务上 AI 变现</text>
    <text x="476" y="270" font-size="12" fill="#4A9BC8" font-weight="600">确定性 ★★★☆☆</text>

    <rect x="836" y="110" width="384" height="196" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="864" y="140" font-size="15" font-weight="700" fill="#E8C55A">牌C · 广告与分发（Meta 路线）</text>
    <text x="864" y="168" font-size="12" fill="#C7C7C7">Meta 广告 AI：推荐提效→ARPU 增长</text>
    <text x="864" y="192" font-size="12" fill="#C7C7C7">2026 Q2 广告收入创新高支撑 $145B capex</text>
    <text x="864" y="216" font-size="12" fill="#9B9B9B">机制：AI 不直接收费，而是提升</text>
    <text x="864" y="240" font-size="12" fill="#9B9B9B">"卖注意力"的效率——间接回收</text>
    <text x="864" y="270" font-size="12" fill="#E8C55A" font-weight="600">确定性 ★★★☆☆</text>

    <rect x="60" y="320" width="568" height="196" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="350" font-size="15" font-weight="700" fill="#D97B4A">牌D · 内部提效（隐性但巨大）</text>
    <text x="88" y="378" font-size="12" fill="#C7C7C7">Google 代码 30%+ 由 AI 生成；客服/搜索成本下降</text>
    <text x="88" y="402" font-size="12" fill="#C7C7C7">机制：capex 换 opex 下降——利润率改善即回收</text>
    <text x="88" y="426" font-size="12" fill="#9B9B9B">问题：不体现在"AI 收入"科目里，难以审计</text>
    <text x="88" y="450" font-size="12" fill="#9B9B9B">（这也解释了为何巨头"有恃无恐"）</text>
    <text x="88" y="482" font-size="12" fill="#D97B4A" font-weight="600">确定性 ★★★★☆ / 可见度 ★☆☆☆☆</text>

    <rect x="640" y="320" width="580" height="196" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="668" y="350" font-size="15" font-weight="700" fill="#C9A227">牌E · 国家与地缘（最后的买家）</text>
    <text x="668" y="378" font-size="12" fill="#C7C7C7">主权 AI：各国政府建本地 AI（沙特/日本/欧盟）</text>
    <text x="668" y="402" font-size="12" fill="#C7C7C7">机制：把过剩算力卖给国家——"AI 版一带一路"</text>
    <text x="668" y="426" font-size="12" fill="#9B9B9B">Nvidia："countries building AI services" 是需求支柱</text>
    <text x="668" y="450" font-size="12" fill="#9B9B9B">风险：主权买家同样受预算约束+当地人力缺口</text>
    <text x="668" y="482" font-size="12" fill="#C9A227" font-weight="600">确定性 ★★☆☆☆ / 规模上限不明确</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="534" width="1152" height="118" rx="12" fill="#1A1428"/>
  <text x="90" y="568" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#F5E9C8">Andy裁决：五张牌加起来够不够？</text>
  <text x="90" y="596" font-family="'PingFang SC', sans-serif" font-size="13" fill="#E8E4D8">A+B 可见收入（$60-70B）+ D 隐性提效（不可见但真实）——按台账 hurdle $255-440B/年（0.35-0.6×capex）仍差 3-6 倍；</text>
  <text x="90" y="622" font-family="'PingFang SC', sans-serif" font-size="13" fill="#C9A227" font-weight="600">结论：靠现有五张牌回收 2026 一年的 capex 都勉强，回收三年累计 $1.5T 需要"AI 原生经济"真的成型——这是市场的核心分歧。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：公司财报(A)·The Information(B+)·Andy综合测算(C)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">16 / 20</text>
</svg>
