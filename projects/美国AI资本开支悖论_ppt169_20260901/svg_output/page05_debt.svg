<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">债务洪流 I：从"不差钱"到"发债狂魔"</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">超大规模厂商债券发行：$20B → $109B → 前 4.5 个月 $152B——四年完成从轻债到重债的转身</text>

  <!-- 主图：债券发行 -->
  <g>
    <g stroke="#232D42" stroke-width="1">
      <line x1="100" y1="420" x2="640" y2="420"/>
      <line x1="100" y1="350" x2="640" y2="350" stroke-dasharray="4,4"/>
      <line x1="100" y1="280" x2="640" y2="280" stroke-dasharray="4,4"/>
      <line x1="100" y1="210" x2="640" y2="210" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#5A6474" text-anchor="end">
      <text x="94" y="424">0</text><text x="94" y="354">$50B</text><text x="94" y="284">$100B</text><text x="94" y="214">$150B</text>
    </g>
    <!-- 五年均值 28 / 2024 20 / 2025 109 / 2026 4.5mo 152 -->
    <rect x="140" y="391" width="70" height="29" fill="#2E6E8E"/>
    <rect x="260" y="392" width="70" height="28" fill="#2E6E8E"/>
    <rect x="380" y="267.4" width="70" height="152.6" fill="#B3541E"/>
    <rect x="500" y="207.2" width="70" height="212.8" fill="#D97B4A"/>
    <g font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <text x="175" y="383" fill="#4A9BC8">$28B</text>
      <text x="295" y="384" fill="#4A9BC8">$20B</text>
      <text x="415" y="259" fill="#D97B4A">$109B</text>
      <text x="535" y="199" fill="#D97B4A">$152B</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B" text-anchor="middle">
      <text x="175" y="442">五年均值</text><text x="295" y="442">2024</text><text x="415" y="442">2025 全年</text><text x="535" y="442">2026 前4.5月</text>
    </g>
    <text x="370" y="470" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#5A6474">2026 年未过半已超 2025 全年纪录</text>
  </g>

  <!-- 右侧：破纪录发行 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="700" y="110" width="520" height="380" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="728" y="142" font-size="15" font-weight="700" fill="#D97B4A">纪录粉碎机：2025-26 的十笔超级发行</text>
    <g font-size="12.5" fill="#C7C7C7">
      <text x="728" y="172">2025-09　Oracle <tspan font-weight="700" fill="#E8C55A">$18B</tspan>　CDS 应声创五年新高</text>
      <text x="728" y="198">2025-10　Meta <tspan font-weight="700" fill="#E8C55A">$30B</tspan>　史上最大非并购 IG 债（$125B 订单）</text>
      <text x="728" y="224">2025-11　Alphabet <tspan font-weight="700" fill="#E8C55A">$25B</tspan>　长期债务一年翻 4 倍至 $46.5B</text>
      <text x="728" y="250">2025-11　Amazon <tspan font-weight="700" fill="#E8C55A">$15B</tspan></text>
      <text x="728" y="276">2026-02　Oracle <tspan font-weight="700" fill="#E8C55A">$30B</tspan>　Bloomberg: 史上最大公司债</text>
      <text x="728" y="302">2026-02　Alphabet <tspan font-weight="700" fill="#E8C55A">百年期债</tspan>　数十年来首家科技发行人</text>
      <text x="728" y="328">2026-06　Nvidia <tspan font-weight="700" fill="#E8C55A">$25B</tspan>　自家最大规模发债</text>
      <text x="728" y="354">2026-06　Alphabet 股权 <tspan font-weight="700" fill="#E8C55A">$84.75B</tspan>　史上最大单笔股权融资</text>
    </g>
    <rect x="728" y="372" width="464" height="100" rx="8" fill="#0D1321"/>
    <text x="748" y="400" font-size="13" fill="#C7C7C7">信号意义：</text>
    <text x="748" y="424" font-size="12.5" fill="#9B9B9B">· 30 年期 98bp / 40 年期 110bp——债市仍给"准主权"定价</text>
    <text x="748" y="448" font-size="12.5" fill="#9B9B9B">· 但 IG 新增供给 ~30% 是 AI 债——被动债基被迫全员上车</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="500" width="1152" height="138" rx="12" fill="#1A1428"/>
  <text x="90" y="534" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#F5E9C8">性质判断：这不是普通扩表，是融资范式切换</text>
  <text x="90" y="564" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">2024 年前：科技巨头是 IG 市场最轻的借款人——经营现金流覆盖 capex+分红回购绰绰有余；</text>
  <text x="90" y="590" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">2025 起：capex 增速（+78%）远超现金流增速（~30%）——缺口只能靠债市+股权+表外 SPV 三管齐下；</text>
  <text x="90" y="622" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">巴克莱：2026 美国公司债总发行将达 $2.46T(+11.8%)，驱动力就是科技——AI 已绑架整个信用市场。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：IESE Business School(A-)·Bloomberg(A-)·SEC filings(A)·巴克莱(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">05 / 20</text>
</svg>
