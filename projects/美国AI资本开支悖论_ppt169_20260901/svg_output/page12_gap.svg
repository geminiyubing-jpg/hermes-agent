<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C4D"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">智力差距 I：Kimi K3 与追赶的时间线</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">Bloomberg（2026-08-19）：美国领先优势"快速收窄"——买不来代差，只能买时间差</text>

  <!-- 左：追赶曲线 -->
  <g>
    <rect x="60" y="110" width="600" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="88" y="142" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#6FBF9B">前沿模型智能指数（Artificial Analysis v4.1.1 谱系）</text>
    <g stroke="#232D42" stroke-width="1">
      <line x1="100" y1="480" x2="620" y2="480"/>
      <line x1="100" y1="400" x2="620" y2="400" stroke-dasharray="4,4"/>
      <line x1="100" y1="320" x2="620" y2="320" stroke-dasharray="4,4"/>
      <line x1="100" y1="240" x2="620" y2="240" stroke-dasharray="4,4"/>
      <line x1="100" y1="180" x2="620" y2="180" stroke-dasharray="4,4"/>
    </g>
    <!-- US 前沿 -->
    <polyline points="130,466 230,430 330,352 430,300 530,250 590,222" fill="none" stroke="#4A9BC8" stroke-width="3.5"/>
    <!-- CN 追赶 -->
    <polyline points="230,472 330,460 430,420 490,372 550,330 600,300" fill="none" stroke="#E8C55A" stroke-width="3.5"/>
    <g fill="#4A9BC8"><circle cx="130" cy="466" r="4"/><circle cx="330" cy="352" r="5"/><circle cx="590" cy="222" r="6" fill="#4A9BC8"/></g>
    <g fill="#E8C55A"><circle cx="230" cy="472" r="4"/><circle cx="490" cy="372" r="5"/><circle cx="600" cy="300" r="6"/></g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="600">
      <text x="560" y="210" fill="#4A9BC8">美国前沿</text>
      <text x="150" y="448" fill="#7A8494">GPT-3.5</text>
      <text x="300" y="336" fill="#7A8494">GPT-4/o1</text>
      <text x="440" y="288" fill="#7A8494">GPT-5.4</text>
      <text x="560" y="290" fill="#E8C55A">Kimi K3</text>
      <text x="380" y="410" fill="#B8A87A">DeepSeek R1</text>
      <text x="470" y="360" fill="#B8A87A">GLM-5</text>
    </g>
    <!-- 差距标注 -->
    <line x1="590" y1="222" x2="600" y2="300" stroke="#D97B4A" stroke-width="2"/>
    <text x="530" y="336" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#D97B4A">差距≈月级</text>
    <g font-family="'Helvetica Neue', sans-serif" font-size="10.5" fill="#5A6474" text-anchor="middle">
      <text x="130" y="498">2022</text><text x="330" y="498">2024</text><text x="530" y="498">2025</text><text x="600" y="498">2026</text>
    </g>
    <text x="360" y="524" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#5A6474">曾"落后 6-18 个月" → 2026 顶级任务上几乎并驾（Vals Index）</text>
    <rect x="88" y="536" width="544" height="30" rx="6" fill="#1A1428"/>
    <text x="360" y="556" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#C9A227">Kimi K3 以 Anthropic 最强模型几分之一的成本近乎追平</text>
  </g>

  <!-- 右：证据列表 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="690" y="110" width="530" height="470" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="718" y="142" font-size="15" font-weight="700" fill="#4A9BC8">收窄的四个硬证据</text>
    <g font-size="12.5" fill="#C7C7C7">
      <text x="738" y="176" font-weight="700" fill="#E8C55A">① 基准测试</text>
      <text x="738" y="198" fill="#9B9B9B">Kimi K3 金融/编码/法律任务≈美国最强；编码推理显著提升</text>
      <text x="738" y="232" font-weight="700" fill="#E8C55A">② 使用量（更致命）</text>
      <text x="738" y="254" fill="#9B9B9B">OpenRouter（20T tokens/周）：中国模型 18 个月内从零到多数</text>
      <text x="738" y="276" fill="#9B9B9B">Qwen=全球下载最多开放模型家族</text>
      <text x="738" y="310" font-weight="700" fill="#E8C55A">③ 价格战</text>
      <text x="738" y="332" fill="#9B9B9B">DeepSeek 成本可达 OpenAI 1/40——API 价格低一个数量级</text>
      <text x="738" y="366" font-weight="700" fill="#E8C55A">④ 出口管制反效果</text>
      <text x="738" y="388" fill="#9B9B9B">算力受限倒逼算法/架构效率创新（MoE/长文本/蒸馏）</text>
      <text x="738" y="410" fill="#9B9B9B">USCC：开放模型降低部署算力需求→工业数据飞轮不靠尖端硬件</text>
    </g>
    <rect x="718" y="430" width="474" height="130" rx="8" fill="#1A1428"/>
    <text x="738" y="458" font-size="13" font-weight="700" fill="#D97B4A">反方声音（必须诚实呈现）</text>
    <text x="738" y="482" font-size="12" fill="#9B9B9B">Semi Fundamental（2026-05）：基准分之下真实差距六个月反而拉大；</text>
    <text x="738" y="506" font-size="12" fill="#9B9B9B">几乎无人靠模型本身盈利；美实验室在高溢价企业市场仍主导</text>
    <text x="738" y="534" font-size="12" fill="#C9A227">→ Andy裁决：能力"接近"已是共识，"超越"未有共识——</text>
    <text x="738" y="554" font-size="12" fill="#C9A227">　 但对资本开支论而言，"接近"本身就足够致命</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="600" width="1152" height="52" rx="10" fill="#1A1428"/>
  <text x="90" y="632" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#E8E4D8">关键推论：算力军备买到的不是"永远领先"，而是"窗口期"——窗口期长短=美国 AI 垄断租金的现值。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：Bloomberg(A-)·Artificial Analysis(A-)·OpenRouter(B+)·USCC 报告(A-)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">12 / 20</text>
</svg>
