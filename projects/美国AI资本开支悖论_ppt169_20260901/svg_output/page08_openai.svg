<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#B3541E"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">网眼解剖：OpenAI 的账本——亏损比营收还大</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">2026-06 泄露的审计财报（FT/Fortune 验证）——整个循环网最大节点的真实体质</text>

  <!-- 左：瀑布图 -->
  <g>
    <text x="80" y="128" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#D97B4A">2025 年损益（十亿美元）</text>
    <!-- 营收 13.07 / 成本 7.5 / R&D 19.18 / S&M 5.73 / G&A 1.57 → 亏 20.92 -->
    <g font-family="'Helvetica Neue', sans-serif" text-anchor="middle">
      <rect x="90" y="300" width="80" height="91.5" fill="#2E6E8E"/>
      <text x="130" y="290" font-size="14" font-weight="700" fill="#4A9BC8">+13.1</text>
      <text x="130" y="414" font-size="10.5" fill="#9B9B9B" font-family="'PingFang SC', sans-serif">营收</text>

      <rect x="200" y="352.5" width="80" height="52.5" fill="#8A4A3A"/>
      <text x="240" y="342" font-size="13" fill="#D97B4A">-7.5</text>
      <text x="240" y="414" font-size="10.5" fill="#9B9B9B" font-family="'PingFang SC', sans-serif">营业成本</text>

      <rect x="310" y="218.2" width="80" height="134.3" fill="#8A4A3A"/>
      <text x="350" y="208" font-size="13" fill="#D97B4A">-19.2</text>
      <text x="350" y="414" font-size="10.5" fill="#9B9B9B" font-family="'PingFang SC', sans-serif">研发</text>

      <rect x="420" y="359.9" width="80" height="45.1" fill="#8A4A3A"/>
      <text x="460" y="350" font-size="13" fill="#D97B4A">-5.7</text>
      <text x="460" y="414" font-size="10.5" fill="#9B9B9B" font-family="'PingFang SC', sans-serif">销售</text>

      <rect x="530" y="369.0" width="80" height="36.0" fill="#8A4A3A"/>
      <text x="570" y="359" font-size="13" fill="#D97B4A">-1.6</text>
      <text x="570" y="414" font-size="10.5" fill="#9B9B9B" font-family="'PingFang SC', sans-serif">管理</text>

      <rect x="640" y="153.9" width="80" height="146.1" fill="#B3541E"/>
      <text x="680" y="144" font-size="15" font-weight="800" fill="#E85A3A">-20.9</text>
      <text x="680" y="414" font-size="10.5" fill="#9B9B9B" font-family="'PingFang SC', sans-serif">经营亏损</text>
    </g>
    <text x="400" y="450" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12.5" fill="#C9A227" font-weight="600">亏损（$20.9B）＞ 营收（$13.1B）——每收 1 美元亏 1.6 美元</text>
    <text x="400" y="476" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#5A6474">其中付给微软 $17.2B（Azure 算力）——比全年营收还多</text>
  </g>

  <!-- 右侧 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="770" y="110" width="450" height="380" rx="12" fill="#161D30" stroke="#232D42"/>
    <text x="798" y="142" font-size="15" font-weight="700" fill="#E8C55A">增长是真的，盈利是没的</text>
    <!-- ARR 曲线 -->
    <g stroke="#232D42" stroke-width="1">
      <line x1="798" y1="340" x2="1190" y2="340"/>
      <line x1="798" y1="280" x2="1190" y2="280" stroke-dasharray="4,4"/>
      <line x1="798" y1="220" x2="1190" y2="220" stroke-dasharray="4,4"/>
      <line x1="798" y1="160" x2="1190" y2="160" stroke-dasharray="4,4"/>
    </g>
    <polyline points="830,328 910,316 990,290 1070,236 1150,232" fill="none" stroke="#C9A227" stroke-width="3"/>
    <g fill="#E8C55A">
      <circle cx="830" cy="328" r="4"/><circle cx="910" cy="316" r="4"/><circle cx="990" cy="290" r="4"/>
      <circle cx="1070" cy="236" r="5"/><circle cx="1150" cy="232" r="5"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="10.5" fill="#9B9B9B" text-anchor="middle">
      <text x="830" y="352">'24底</text><text x="910" y="352">年中</text><text x="990" y="352">'25底</text>
      <text x="1070" y="352">'26-02</text><text x="1150" y="352">年中</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#C7C7C7">
      <text x="826" y="320">$10B</text><text x="986" y="282">$21.4B</text>
      <text x="1050" y="224" font-weight="700" fill="#E8C55A">$25B</text>
    </g>
    <text x="990" y="384" text-anchor="middle" font-size="12" fill="#C9A227" font-weight="600">ARR：两年 2.5 倍——但 2026-02 后曲线走平</text>
    <text x="798" y="414" font-size="12.5" fill="#C7C7C7">· 推理成本：2025 $8.4B → 2026E $14.1B（越大越亏）</text>
    <text x="798" y="438" font-size="12.5" fill="#C7C7C7">· 微软重签（2026-04）：付款上限 $38B（原或达 $97B）</text>
    <text x="798" y="462" font-size="12.5" fill="#C7C7C7">· 2026 Q1：营收 $5.7B，经营利润率 -122%，烧钱 $3.7B/季</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="504" width="1152" height="134" rx="12" fill="#1A1428"/>
  <text x="90" y="538" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#F5E9C8">这张账本回答了什么？——"需求真实"与"商业模式未证明"同时成立</text>
  <text x="90" y="566" font-family="'PingFang SC', sans-serif" font-size="13" fill="#E8E4D8">· 消费者真金白银：5000 万+ 付费席位、企业收入占 40%——需求不是伪造的（与 Qwest 造假的本质区别）；</text>
  <text x="90" y="592" font-family="'PingFang SC', sans-serif" font-size="13" fill="#E8E4D8">· 但每美元收入对应 1.6 美元亏损+$17B 付给微软——OpenAI 的"需求"同时是微软的"收入"：网的两面；</text>
  <text x="90" y="618" font-family="'PingFang SC', sans-serif" font-size="13" fill="#C9A227" font-weight="600">· 关键问题不是 OpenAI 能否活，而是它的收入能否增长到覆盖 $300-500B 级承诺——这是全网的锚。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：泄露审计财报（FT/Fortune 验证，A-）·The Information/Reuters(B+)·公司声明(A)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">08 / 20</text>
</svg>
