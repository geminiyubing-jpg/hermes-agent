<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0D1321"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1F5C4D"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#F5E9C8">智力差距 II：两种路线的经济学对撞</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#9B9B9B">美国：算力密集前沿垄断 vs 中国：开放生态+成本屠刀——token 经济学的两条道路</text>

  <!-- 左右对照 -->
  <g font-family="'PingFang SC', sans-serif">
    <!-- 美国路线 -->
    <rect x="60" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#4A9BC8"/>
    <rect x="60" y="110" width="560" height="44" rx="12" fill="#1E3A5C"/>
    <text x="340" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#9BC1DE">美国路线：资本密集型冲刺</text>
    <g font-size="12.5" fill="#C7C7C7">
      <text x="88" y="184" font-weight="700" fill="#4A9BC8">打法</text>
      <text x="108" y="208">· 前沿模型=护城河：GPT-5.4/Opus 5 顶级任务仍领先</text>
      <text x="108" y="232">· 天量 capex 换训练算力+推理产能</text>
      <text x="108" y="256">· 闭源+高价：API 溢价、企业订阅、独家云绑定</text>
      <text x="88" y="292" font-weight="700" fill="#4A9BC8">账本</text>
      <text x="108" y="316">· OpenAI 营收 $25B ARR（真实且增长）</text>
      <text x="108" y="340">· 但亏损 $20.9B&gt;营收；靠资本输血续命</text>
      <text x="108" y="364">· 垄断租金假设：窗口期内收高价</text>
      <text x="88" y="400" font-weight="700" fill="#4A9BC8">软肋</text>
      <text x="108" y="424">· 窗口期=中国追平速度的函数（P12）</text>
      <text x="108" y="448">· $730B/年 capex 须在窗口内回收</text>
      <text x="108" y="472">· 降价则回收模型全线崩（P11 情景C）</text>
    </g>
    <rect x="88" y="496" width="504" height="64" rx="8" fill="#0D1321"/>
    <text x="340" y="522" text-anchor="middle" font-size="13" fill="#E8E4D8" font-weight="600">本质：用金融手段（债务+循环投资）</text>
    <text x="340" y="544" text-anchor="middle" font-size="13" fill="#E8E4D8">购买技术领先的时间窗口</text>

    <!-- 中国路线 -->
    <rect x="660" y="110" width="560" height="470" rx="12" fill="#161D30" stroke="#C9A227"/>
    <rect x="660" y="110" width="560" height="44" rx="12" fill="#3A2E14"/>
    <text x="940" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#E8C55A">中国路线：效率密集型扩散</text>
    <g font-size="12.5" fill="#C7C7C7">
      <text x="688" y="184" font-weight="700" fill="#E8C55A">打法</text>
      <text x="708" y="208">· 开放权重：Qwen/DeepSeek/GLM 全家桶免费商用</text>
      <text x="708" y="232">· 成本屠刀：token 价格低 1-2 个数量级</text>
      <text x="708" y="256">· 嵌入实体经济：工厂/物流/机器人（GAI 路线）</text>
      <text x="688" y="292" font-weight="700" fill="#E8C55A">账本</text>
      <text x="708" y="316">· DeepSeek 年化收入 ~$0.5B（mid-2026）</text>
      <text x="708" y="340">· 赚钱少但花钱更少——训练成本仅美零头</text>
      <text x="708" y="364">· 国家战略托底：电力/工程师/供应链纵深</text>
      <text x="688" y="400" font-weight="700" fill="#E8C55A">优势</text>
      <text x="708" y="424">· 商品化对手的 token：用量已占多数</text>
      <text x="708" y="448">· 不需要回收 $730B——只需持续迭代</text>
      <text x="708" y="472">· 出口管制=输入变量的约束,非终点</text>
    </g>
    <rect x="688" y="496" width="504" height="64" rx="8" fill="#0D1321"/>
    <text x="940" y="522" text-anchor="middle" font-size="13" fill="#E8E4D8" font-weight="600">本质：用制造业逻辑（降本+放量）</text>
    <text x="940" y="544" text-anchor="middle" font-size="13" fill="#E8E4D8">把 AI 变成水电一样的公共品</text>
  </g>

  <!-- 底部对撞结论 -->
  <rect x="60" y="600" width="1152" height="52" rx="10" fill="#1A1428"/>
  <text x="90" y="632" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227" font-weight="600">对撞结果：闭源溢价的半衰期被中国开放生态不断缩短——美国巨额 capex 的"垄断租金回收模型"面对的是一个持续降价的镜像对手。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#5A6474">数据：Bloomberg(A-)·USCC(A-)·Data Gravity(B+)·Semi Fundamental(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#C9A227">13 / 20</text>
</svg>
