<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226" />
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E8B84B">π = 3.14159265…　圆的灵魂</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">所有圆共享同一个「周长 ÷ 直径」——这个比是谁定的？</text>

  
  <path fill="#1A2140" stroke="#2A3358" d="M84,135 H556 A14,14 0 0 1 570,149 V521 A14,14 0 0 1 556,535 H84 A14,14 0 0 1 70,521 V149 A14,14 0 0 1 84,135 Z" />
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">公元前 250 年：阿基米德的夹逼法</text>
  <text x="95" y="194" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">用正多边形从内外两侧「钳住」圆</text>
  
  <circle cx="320" cy="360" r="115" fill="none" stroke="#E8B84B" stroke-width="2.5" />
  
  <polygon points="320,245 419.6,302.5 419.6,417.5 320,475 220.4,417.5 220.4,302.5" fill="#4FC3F7" fill-opacity="0.12" stroke="#4FC3F7" stroke-width="1.6" />
  
  <polygon points="320,199.3 459.2,279.7 459.2,440.3 320,520.7 180.8,440.3 180.8,279.7" fill="none" stroke="#F06292" stroke-width="1.6" stroke-dasharray="6,4" />
  <text x="320" y="240" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#4FC3F7">内接正六边形 → 3.0000</text>
  <text x="320" y="545" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#F06292">外切正六边形 → 3.4641</text>
  <text x="95" y="490" font-family="'STIX Two Math','Times New Roman',serif" font-size="15" font-style="italic" fill="#E6EAF2">3 + 10/71 &lt; π &lt; 3 + 1/7</text>
  <text x="95" y="516" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">阿基米德手算到 96 边形，夹出 π 的两位小数</text>

  
  <path fill="#1A2140" stroke="#2A3358" d="M614,135 H1196 A14,14 0 0 1 1210,149 V371 A14,14 0 0 1 1196,385 H614 A14,14 0 0 1 600,371 V149 A14,14 0 0 1 614,135 Z" />
  <text x="625" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">四千年接力：从泥板到超算</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <circle cx="640" cy="200" r="4" fill="#E8B84B" /><text x="656" y="205" fill="#E6EAF2">公元前 1900 巴比伦泥板：π ≈ 3.125</text>
    <circle cx="640" cy="232" r="4" fill="#E8B84B" /><text x="656" y="237" fill="#E6EAF2">公元前 250 阿基米德：96 边形夹逼，2 位</text>
    <circle cx="640" cy="264" r="4" fill="#E8B84B" /><text x="656" y="269" fill="#E8B84B" font-weight="bold">公元 480 祖冲之：3.1415926 ~ 3.1415927</text>
    <text x="676" y="291" fill="#8A93A8">世界纪录保持约 900 年（《隋书·律历志》）</text>
    <circle cx="640" cy="318" r="4" fill="#E8B84B" /><text x="656" y="323" fill="#E6EAF2">1610 鲁道夫·范·休伦：35 位（刻上墓碑）</text>
    <circle cx="640" cy="350" r="4" fill="#E8B84B" /><text x="656" y="355" fill="#E6EAF2">2024 Google 超算：31.4 万亿位（≈π·10¹³）</text>
  </g>

  
  <path fill="#121838" stroke="#2A3358" d="M614,405 H1196 A14,14 0 0 1 1210,419 V521 A14,14 0 0 1 1196,535 H614 A14,14 0 0 1 600,521 V419 A14,14 0 0 1 614,405 Z" />
  <text x="625" y="440" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E8B84B">为什么值得花四千年？</text>
  <text x="625" y="470" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">每一次精度飞跃，都伴随数学工具的革命：几何 → 代数 →</text>
  <text x="625" y="492" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">分析(级数) → 计算机。π 是数学引擎的「试车赛道」——</text>
  <text x="625" y="514" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">今天算 π 还用于测试超算与检验伪随机数质量。</text>

  
  <path fill="#121838" stroke="#2A3358" d="M84,555 H1196 A14,14 0 0 1 1210,569 V641 A14,14 0 0 1 1196,655 H84 A14,14 0 0 1 70,641 V569 A14,14 0 0 1 84,555 Z" />
  <text x="640" y="595" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="17" fill="#E6EAF2">π 的第一重身份：它不属于任何圆，却属于<tspan fill="#E8B84B" font-weight="bold">所有</tspan>圆——</text>
  <text x="640" y="625" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="17" fill="#E6EAF2">「完美圆形」这个理念世界派驻物理世界的<tspan fill="#E8B84B" font-weight="bold">常驻大使</tspan>。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">03 / 16</text>
</svg>