<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226" />
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E8B84B">π 的深刻性：无理、超越、无处不在</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">「π 不写成分数」为什么值得全欧洲激动两百年？</text>

  
  <path fill="#1A2140" stroke="#2A3358" d="M84,135 H626 A14,14 0 0 1 640,149 V361 A14,14 0 0 1 626,375 H84 A14,14 0 0 1 70,361 V149 A14,14 0 0 1 84,135 Z" />
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">第一击：无理数（1761，兰伯特）</text>
  <text x="95" y="200" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">π ≠ p/q（任何整数之比）。写成小数，各位数字</text>
  <text x="95" y="224" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">永不循环、永不终止——且符合均匀随机分布</text>
  <text x="95" y="248" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">（正常数猜想，验证至数十万亿位仍成立）。</text>
  <text x="95" y="286" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8A93A8">哲学冲击：人类符号（分数）无法完全捕获</text>
  <text x="95" y="310" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8A93A8">一个纯粹几何对象。圆携带着「写不完的</text>
  <text x="95" y="334" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8A93A8">信息量」超出了有理数系统的表达能力。</text>

  
  <path fill="#1A2140" stroke="#2A3358" d="M674,135 H1196 A14,14 0 0 1 1210,149 V361 A14,14 0 0 1 1196,375 H674 A14,14 0 0 1 660,361 V149 A14,14 0 0 1 674,135 Z" />
  <text x="685" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">第二击：超越数（1882，林德曼）</text>
  <text x="685" y="200" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">π 不是任何整系数多项式方程的根——</text>
  <text x="685" y="224" font-family="'STIX Two Math','Times New Roman',serif" font-size="15" font-style="italic" fill="#4FC3F7">aₙxⁿ + … + a₁x + a₀ = 0　对 π 永远无解</text>
  <text x="685" y="262" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E8B84B" font-weight="bold">千年悬案就地了结：化圆为方不可能。</text>
  <text x="685" y="290" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">只用量规（画圆）+ 直尺（画线），永远拼不出</text>
  <text x="685" y="312" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">与给定圆等面积的正方形。古希腊三大几何难题</text>
  <text x="685" y="334" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">中最后存续的一个，被 π 的「超越身份」终结。</text>

  
  <path fill="#121838" stroke="#2A3358" d="M84,395 H626 A14,14 0 0 1 640,409 V641 A14,14 0 0 1 626,655 H84 A14,14 0 0 1 70,641 V409 A14,14 0 0 1 84,395 Z" />
  <text x="95" y="430" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">π 藏在概率里：蒲丰投针（1777）</text>
  <g stroke="#2A3358" stroke-width="1.5">
    <line x1="110" y1="460" x2="600" y2="460" /><line x1="110" y1="510" x2="600" y2="510" />
    <line x1="110" y1="560" x2="600" y2="560" /><line x1="110" y1="610" x2="600" y2="610" />
  </g>
  <g stroke="#E8B84B" stroke-width="2.2">
    <line x1="150" y1="470" x2="195" y2="498" />
    <line x1="260" y1="480" x2="310" y2="478" />
    <line x1="380" y1="525" x2="420" y2="558" />
    <line x1="500" y1="470" x2="540" y2="505" />
    <line x1="200" y1="575" x2="250" y2="592" />
  </g>
  <g stroke="#8A93A8" stroke-width="1.8">
    <line x1="330" y1="465" x2="365" y2="458" />
    <line x1="450" y1="585" x2="495" y2="600" />
  </g>
  <text x="95" y="645" font-family="'STIX Two Math','Times New Roman',serif" font-size="15" font-style="italic" fill="#4FC3F7">P(相交) = 2L / (πd)</text>
  <text x="340" y="645" font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#8A93A8">撒针统计频率 → 反推 π——圆没出场，π 却在场</text>

  
  <path fill="#121838" stroke="#2A3358" d="M674,395 H1196 A14,14 0 0 1 1210,409 V641 A14,14 0 0 1 1196,655 H674 A14,14 0 0 1 660,641 V409 A14,14 0 0 1 674,395 Z" />
  <text x="685" y="430" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">π 的领地远超几何</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <path fill="#1A2140" d="M693,450 H1177 A8,8 0 0 1 1185,458 V484 A8,8 0 0 1 1177,492 H693 A8,8 0 0 1 685,484 V458 A8,8 0 0 1 693,450 Z" />
    <text x="700" y="476" fill="#E6EAF2">📈 正态分布　<tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#E8B84B">f(x) = exp(−x²/2) / √(2π)</tspan>　统计学的地基</text>
    <path fill="#1A2140" d="M693,500 H1177 A8,8 0 0 1 1185,508 V534 A8,8 0 0 1 1177,542 H693 A8,8 0 0 1 685,534 V508 A8,8 0 0 1 693,500 Z" />
    <text x="700" y="526" fill="#E6EAF2">🎵 傅里叶变换　一切声波、图像、信号 = 圆周运动的叠加</text>
    <path fill="#1A2140" d="M693,550 H1177 A8,8 0 0 1 1185,558 V584 A8,8 0 0 1 1177,592 H693 A8,8 0 0 1 685,584 V558 A8,8 0 0 1 693,550 Z" />
    <text x="700" y="576" fill="#E6EAF2">⚛️ 不确定性原理　<tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#E8B84B">Δx·Δp ≥ ħ/2</tspan>　量子世界的天花板</text>
    <path fill="#1A2140" d="M693,600 H1177 A8,8 0 0 1 1185,608 V634 A8,8 0 0 1 1177,642 H693 A8,8 0 0 1 685,634 V608 A8,8 0 0 1 693,600 Z" />
    <text x="700" y="626" fill="#E6EAF2">🌊 河流蜿蜒率、光波衍射、牛顿引力……凡有周期处皆有 π</text>
  </g>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">04 / 16</text>
</svg>