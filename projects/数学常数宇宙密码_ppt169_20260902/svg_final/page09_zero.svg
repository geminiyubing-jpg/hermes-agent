<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226" />
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#66BB6A">0　无中生有</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">最难的一步不是数到很大，而是承认「没有」也是一个数</text>

  
  <path fill="#1A2140" stroke="#2A3358" d="M84,135 H626 A14,14 0 0 1 640,149 V391 A14,14 0 0 1 626,405 H84 A14,14 0 0 1 70,391 V149 A14,14 0 0 1 84,135 Z" />
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">0 的三重身份（三件事，三千年）</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <path fill="#121838" d="M105,190 H605 A10,10 0 0 1 615,200 V240 A10,10 0 0 1 605,250 H105 A10,10 0 0 1 95,240 V200 A10,10 0 0 1 105,190 Z" />
    <text x="115" y="214" fill="#66BB6A" font-weight="bold">① 占位符（公元前 300，巴比伦/玛雅）</text>
    <text x="115" y="236" fill="#8A93A8">「1 的后面补两个空」= 100 —— 位值制的螺丝钉</text>
    <path fill="#121838" d="M105,258 H605 A10,10 0 0 1 615,268 V308 A10,10 0 0 1 605,318 H105 A10,10 0 0 1 95,308 V268 A10,10 0 0 1 105,258 Z" />
    <text x="115" y="282" fill="#66BB6A" font-weight="bold">② 可运算的数（628，印度·婆罗摩笈多）</text>
    <text x="115" y="304" fill="#8A93A8">首次写下规则：0+x=x，0×x=0 —— 0 获得公民权</text>
    <path fill="#121838" d="M105,326 H605 A10,10 0 0 1 615,336 V376 A10,10 0 0 1 605,386 H105 A10,10 0 0 1 95,376 V336 A10,10 0 0 1 105,326 Z" />
    <text x="115" y="350" fill="#66BB6A" font-weight="bold">③ 结构的基石（19 世纪，公理化）</text>
    <text x="115" y="372" fill="#8A93A8">加法幺元、群/环/域公理的锚点——现代代数的地基</text>
  </g>

  
  <path fill="#1A2140" stroke="#2A3358" d="M674,135 H1196 A14,14 0 0 1 1210,149 V391 A14,14 0 0 1 1196,405 H674 A14,14 0 0 1 660,391 V149 A14,14 0 0 1 674,135 Z" />
  <text x="685" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">0 的西游记：从印度到欧洲的 600 年阻力</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <circle cx="700" cy="200" r="4" fill="#66BB6A" /><text x="716" y="205" fill="#E6EAF2">628 年 婆罗摩笈多《婆罗摩历算书》：运算规则</text>
    <circle cx="700" cy="230" r="4" fill="#66BB6A" /><text x="716" y="235" fill="#E6EAF2">9 世纪 花拉子米《代数》——「算法」词源</text>
    <circle cx="700" cy="260" r="4" fill="#66BB6A" /><text x="716" y="265" fill="#E6EAF2">12 世纪 斐波那契《计算之书》带入欧洲</text>
    <circle cx="700" cy="290" r="4" fill="#F06292" /><text x="716" y="295" fill="#F06292">1299 佛罗伦萨禁令：禁用阿拉伯数字！</text>
    <text x="732" y="315" fill="#8A93A8">商人易伪造（0→6/9），「异教符号」遭抵制</text>
    <circle cx="700" cy="340" r="4" fill="#66BB6A" /><text x="716" y="345" fill="#E6EAF2">~1600 终于全面胜出，复式记账法引爆商业革命</text>
    <text x="685" y="385" fill="#8A93A8">→ 0 花了 600 年才被接受——比 π 的无理性证明还曲折</text>
  </g>

  
  <path fill="#121838" stroke="#2A3358" d="M84,425 H626 A14,14 0 0 1 640,439 V641 A14,14 0 0 1 626,655 H84 A14,14 0 0 1 70,641 V439 A14,14 0 0 1 84,425 Z" />
  <text x="95" y="460" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#66BB6A">微积分：把 0 当工具用的艺术</text>
  <text x="95" y="492" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">导数 = Δy/Δx 当 Δx → 0 时的极限：分子分母</text>
  <text x="95" y="514" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">同时奔向 0，比值却奔向确定的数——「0/0 之谜」</text>
  <text x="95" y="546" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">贝克莱主教讥讽其为「消失量的幽灵」。柯西/魏尔</text>
  <text x="95" y="568" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">斯特拉斯用 ε-δ 语言驯服无穷小，分析学才立稳。</text>
  <text x="95" y="606" font-family="'STIX Two Math','Times New Roman',serif" font-size="15" font-style="italic" fill="#66BB6A">lim Δx→0 (sin Δx / Δx) = 1　——0 又牵出了 π（sin 的主场）</text>

  
  <path fill="#121838" stroke="#F06292" stroke-opacity="0.35" d="M674,425 H1196 A14,14 0 0 1 1210,439 V641 A14,14 0 0 1 1196,655 H674 A14,14 0 0 1 660,641 V439 A14,14 0 0 1 674,425 Z" />
  <text x="685" y="460" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#F06292">而 0 也是保护墙：除以 0 被禁止</text>
  <text x="685" y="492" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">若允许 1/0 = a，则 0×a = 1；但 0×任何数 = 0，</text>
  <text x="685" y="514" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">矛盾 → 整个算术体系崩塌。一条「不许」的边界，</text>
  <text x="685" y="536" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">保住了全部数学大厦——0 标记了符号系统的极限。</text>
  <text x="685" y="576" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">物理学的 0 同样锋利：绝对零度不可达（热力学第三</text>
  <text x="685" y="598" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">定律）、真空不空（零点能）——「无」从来不简单。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">09 / 16</text>
</svg>