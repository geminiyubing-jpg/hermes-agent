<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226" />
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">指数函数：一列用自身定义自身的「永动列车」</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">为什么「导数等于自己」如此重要？——因为自然只问「现在有多少」</text>

  
  <path fill="#1A2140" stroke="#2A3358" d="M84,135 H626 A14,14 0 0 1 640,149 V421 A14,14 0 0 1 626,435 H84 A14,14 0 0 1 70,421 V149 A14,14 0 0 1 84,135 Z" />
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#4FC3F7">泰勒级数：e 的 x 次方是自己的「全家福」</text>
  <text x="95" y="215" font-family="'STIX Two Math','Times New Roman',serif" font-size="19" font-style="italic" fill="#E6EAF2">eˣ = 1 + x + x²/2! + x³/3! + x⁴/4! + …</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <text x="95" y="252" fill="#E6EAF2">逐项求导：x³/3! → 3x²/3! = x²/2!——每一项求导</text>
    <text x="95" y="274" fill="#E6EAF2">就「降级」为前一项，整列火车求导后纹丝不动。</text>
    <text x="95" y="308" fill="#8A93A8">反过来读：从 1 出发不断求导再累积，就能凭空</text>
    <text x="95" y="330" fill="#8A93A8">构造出 eˣ——不需要圆、不需要复利，纯逻辑自举。</text>
    <text x="95" y="368" fill="#4FC3F7" font-weight="bold">唯一性：若 f' = f 且 f(0) = 1，则 f = eˣ，别无分店。</text>
    <text x="95" y="402" fill="#8A93A8">「自己的变化率就是自己」——这一定义逼出唯一的数 e。</text>
  </g>

  
  <path fill="#1A2140" stroke="#2A3358" d="M674,135 H1196 A14,14 0 0 1 1210,149 V421 A14,14 0 0 1 1196,435 H674 A14,14 0 0 1 660,421 V149 A14,14 0 0 1 674,135 Z" />
  <text x="685" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">自然界的 e 家族名录</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <path fill="#121838" d="M693,190 H1177 A8,8 0 0 1 1185,198 V234 A8,8 0 0 1 1177,242 H693 A8,8 0 0 1 685,234 V198 A8,8 0 0 1 693,190 Z" />
    <text x="700" y="212" fill="#E6EAF2">☢️ 放射性衰变　<tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#4FC3F7">N(t) = N₀·exp(−λt)</tspan></text>
    <text x="700" y="232" fill="#8A93A8">碳-14 测年、核衰变——考古学与地质学的时钟</text>

    <path fill="#121838" d="M693,250 H1177 A8,8 0 0 1 1185,258 V294 A8,8 0 0 1 1177,302 H693 A8,8 0 0 1 685,294 V258 A8,8 0 0 1 693,250 Z" />
    <text x="700" y="272" fill="#E6EAF2">🧫 种群增长　<tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#4FC3F7">dN/dt = rN</tspan>（资源无限时）</text>
    <text x="700" y="292" fill="#8A93A8">细菌分裂、人口早期膨胀——翻倍再翻倍</text>

    <path fill="#121838" d="M693,310 H1177 A8,8 0 0 1 1185,318 V354 A8,8 0 0 1 1177,362 H693 A8,8 0 0 1 685,354 V318 A8,8 0 0 1 693,310 Z" />
    <text x="700" y="332" fill="#E6EAF2">🌡️ 牛顿冷却 / RC 放电　温差按 e 衰减</text>
    <text x="700" y="352" fill="#8A93A8">咖啡变凉、电容放电——「剩下的」总按同比例减少</text>

    <path fill="#121838" d="M693,370 H1177 A8,8 0 0 1 1185,378 V414 A8,8 0 0 1 1177,422 H693 A8,8 0 0 1 685,414 V378 A8,8 0 0 1 693,370 Z" />
    <text x="700" y="392" fill="#E6EAF2">🎲 概率　泊松分布 P(k) = λᵏ·exp(−λ)/k!</text>
    <text x="700" y="412" fill="#8A93A8">电话呼入、放射性计数、网站访问峰值</text>
  </g>

  
  <path fill="#121838" stroke="#2A3358" d="M84,460 H1196 A14,14 0 0 1 1210,474 V646 A14,14 0 0 1 1196,660 H84 A14,14 0 0 1 70,646 V474 A14,14 0 0 1 84,460 Z" />
  <text x="95" y="498" font-family="'PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#E6EAF2">e 与 π 的分工：宇宙的两种基本节奏</text>
  
  <g transform="translate(130,520)">
    <path d="M 0,95 C 100,95 200,70 380,8" fill="none" stroke="#4FC3F7" stroke-width="2.5" />
    <text x="150" y="40" font-family="'PingFang SC',sans-serif" font-size="13" fill="#4FC3F7">e 型：单向滚雪球（增长/衰减）</text>
    <text x="150" y="62" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8A93A8">未来由现在决定，永不回头</text>
  </g>
  
  <g transform="translate(700,520)">
    <path d="M 0,52 C 40,0 80,0 120,52 C 160,104 200,104 240,52 C 280,0 320,0 360,52" fill="none" stroke="#E8B84B" stroke-width="2.5" />
    <text x="120" y="18" font-family="'PingFang SC',sans-serif" font-size="13" fill="#E8B84B">π 型：往复振动（周期/波动）</text>
    <text x="120" y="112" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8A93A8">现在由历史重复，循环往复</text>
  </g>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">06 / 16</text>
</svg>