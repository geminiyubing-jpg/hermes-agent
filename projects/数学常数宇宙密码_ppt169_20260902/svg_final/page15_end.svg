<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="endNebula" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1A2140" />
      <stop offset="100%" stop-color="#0E1226" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#endNebula)" />
  <g fill="#E6EAF2">
    <circle cx="150" cy="120" r="1.3" opacity="0.6" /><circle cx="480" cy="80" r="1" opacity="0.5" />
    <circle cx="820" cy="130" r="1.5" opacity="0.7" /><circle cx="1130" cy="90" r="1.1" opacity="0.5" />
    <circle cx="100" cy="600" r="1.2" opacity="0.5" /><circle cx="1180" cy="560" r="1.4" opacity="0.6" />
  </g>

  <text x="640" y="110" text-anchor="middle" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="34" font-weight="bold" fill="#E6EAF2">七个常数，一首诗</text>

  
  <g font-family="'PingFang SC',sans-serif" font-size="16.5">
    <path fill="#1A2140" stroke="#66BB6A" stroke-width="1.2" d="M210,150 H1070 A10,10 0 0 1 1080,160 V192 A10,10 0 0 1 1070,202 H210 A10,10 0 0 1 200,192 V160 A10,10 0 0 1 210,150 Z" />
    <text x="240" y="182" fill="#66BB6A" font-weight="bold" font-family="'STIX Two Math',serif" font-style="italic">0 与 1</text>
    <text x="360" y="182" fill="#E6EAF2">逻辑的原子——一切运算的起点与终点</text>

    <path fill="#1A2140" stroke="#4FC3F7" stroke-width="1.2" d="M210,212 H1070 A10,10 0 0 1 1080,222 V254 A10,10 0 0 1 1070,264 H210 A10,10 0 0 1 200,254 V222 A10,10 0 0 1 210,212 Z" />
    <text x="240" y="244" fill="#4FC3F7" font-weight="bold" font-family="'STIX Two Math',serif" font-style="italic">e</text>
    <text x="360" y="244" fill="#E6EAF2">变化的语法——凡增长与衰减，皆有 e</text>

    <path fill="#1A2140" stroke="#E8B84B" stroke-width="1.2" d="M210,274 H1070 A10,10 0 0 1 1080,284 V316 A10,10 0 0 1 1070,326 H210 A10,10 0 0 1 200,316 V284 A10,10 0 0 1 210,274 Z" />
    <text x="240" y="306" fill="#E8B84B" font-weight="bold" font-family="'STIX Two Math',serif" font-style="italic">π</text>
    <text x="360" y="306" fill="#E6EAF2">对称的语法——凡旋转与周期，皆有 π</text>

    <path fill="#1A2140" stroke="#9575CD" stroke-width="1.2" d="M210,336 H1070 A10,10 0 0 1 1080,346 V378 A10,10 0 0 1 1070,388 H210 A10,10 0 0 1 200,378 V346 A10,10 0 0 1 210,336 Z" />
    <text x="240" y="368" fill="#9575CD" font-weight="bold" font-family="'STIX Two Math',serif" font-style="italic">i</text>
    <text x="360" y="368" fill="#E6EAF2">维度的桥梁——变化从此有了「相位」</text>

    <path fill="#1A2140" stroke="#F06292" stroke-width="1.2" d="M210,398 H1070 A10,10 0 0 1 1080,408 V440 A10,10 0 0 1 1070,450 H210 A10,10 0 0 1 200,440 V408 A10,10 0 0 1 210,398 Z" />
    <text x="240" y="430" fill="#F06292" font-weight="bold" font-family="'STIX Two Math',serif" font-style="italic">φ</text>
    <text x="360" y="430" fill="#E6EAF2">自相似的影子——尺度不变处，比例唯一</text>

    <path fill="#1A2140" stroke="#FF8A65" stroke-width="1.2" d="M210,460 H1070 A10,10 0 0 1 1080,470 V502 A10,10 0 0 1 1070,512 H210 A10,10 0 0 1 200,502 V470 A10,10 0 0 1 210,460 Z" />
    <text x="240" y="492" fill="#FF8A65" font-weight="bold" font-family="'STIX Two Math',serif" font-style="italic">γ</text>
    <text x="360" y="492" fill="#E6EAF2">未知的界碑——数学尚在施工的证明</text>
  </g>

  
  <path fill="#121838" stroke="#E8B84B" stroke-opacity="0.5" d="M176,545 H1104 A16,16 0 0 1 1120,561 V629 A16,16 0 0 1 1104,645 H176 A16,16 0 0 1 160,629 V561 A16,16 0 0 1 176,545 Z" />
  <text x="640" y="588" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="19" fill="#E6EAF2">宇宙不停地在用同一套常数写诗——</text>
  <text x="640" y="622" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="19" fill="#E8B84B" font-weight="bold">我们读到的每一行物理定律，都是这首诗的韵脚。</text>

  <g font-family="'STIX Two Math','Times New Roman',serif" font-style="italic" fill="#8A93A8">
    <text x="572" y="685" text-anchor="middle" font-size="20">e</text>
    <text x="586" y="678" text-anchor="middle" font-size="13" fill="#9575CD">iπ</text>
    <text x="610" y="685" text-anchor="middle" font-size="18">+</text>
    <text x="632" y="685" text-anchor="middle" font-size="19">1</text>
    <text x="655" y="685" text-anchor="middle" font-size="18">=</text>
    <text x="678" y="685" text-anchor="middle" font-size="19">0</text>
  </g>
</svg>