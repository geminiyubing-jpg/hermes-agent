<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226" />
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">你真的认识它们吗？五个熟悉符号的陌生故事</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">它们出现在课本、手机、银行、宇宙方程里——但大多数人只见过它们的「名片」</text>

  
  <g font-family="'PingFang SC',sans-serif">
    <path fill="#1A2140" stroke="#E8B84B" stroke-width="1.5" d="M84,140 H416 A14,14 0 0 1 430,154 V376 A14,14 0 0 1 416,390 H84 A14,14 0 0 1 70,376 V154 A14,14 0 0 1 84,140 Z" />
    <text x="95" y="182" font-family="'STIX Two Math','Times New Roman',serif" font-size="34" font-style="italic" fill="#E8B84B">π</text>
    <text x="150" y="180" font-size="16" font-weight="bold" fill="#E6EAF2">你以为：算圆的</text>
    <text x="95" y="222" font-size="13.5" fill="#8A93A8">老师说的：周长面积、背 3.14159</text>
    <line x1="95" y1="244" x2="400" y2="244" stroke="#2A3358" stroke-width="1" />
    <text x="95" y="276" font-size="15" font-weight="bold" fill="#E8B84B">实际还是：</text>
    <text x="95" y="304" font-size="13.5" fill="#E6EAF2">· 概率：往纸上撒针能算出 π</text>
    <text x="95" y="330" font-size="13.5" fill="#E6EAF2">· 你的手机通信、Wi-Fi 波形</text>
    <text x="95" y="356" font-size="13.5" fill="#E6EAF2">· 量子世界的测不准天花板</text>

    <path fill="#1A2140" stroke="#4FC3F7" stroke-width="1.5" d="M464,140 H796 A14,14 0 0 1 810,154 V376 A14,14 0 0 1 796,390 H464 A14,14 0 0 1 450,376 V154 A14,14 0 0 1 464,140 Z" />
    <text x="475" y="182" font-family="'STIX Two Math','Times New Roman',serif" font-size="34" font-style="italic" fill="#4FC3F7">e</text>
    <text x="530" y="180" font-size="16" font-weight="bold" fill="#E6EAF2">你以为：一个字母</text>
    <text x="475" y="222" font-size="13.5" fill="#8A93A8">高数课本里的 2.71828…</text>
    <line x1="475" y1="244" x2="780" y2="244" stroke="#2A3358" stroke-width="1" />
    <text x="475" y="276" font-size="15" font-weight="bold" fill="#4FC3F7">实际还是：</text>
    <text x="475" y="304" font-size="13.5" fill="#E6EAF2">· 你的房贷复利就差它一步</text>
    <text x="475" y="330" font-size="13.5" fill="#E6EAF2">· 碳14测年、细菌繁殖、咖啡变凉</text>
    <text x="475" y="356" font-size="13.5" fill="#E6EAF2">· 招聘/停车「看完 37% 再选」法则</text>

    <path fill="#1A2140" stroke="#F06292" stroke-width="1.5" d="M844,140 H1196 A14,14 0 0 1 1210,154 V376 A14,14 0 0 1 1196,390 H844 A14,14 0 0 1 830,376 V154 A14,14 0 0 1 844,140 Z" />
    <text x="855" y="182" font-family="'STIX Two Math','Times New Roman',serif" font-size="34" font-style="italic" fill="#F06292">φ</text>
    <text x="910" y="180" font-size="16" font-weight="bold" fill="#E6EAF2">你以为：美的密码</text>
    <text x="855" y="222" font-size="13.5" fill="#8A93A8">达芬奇密码、鹦鹉螺、帕特农神庙</text>
    <line x1="855" y1="244" x2="1180" y2="244" stroke="#2A3358" stroke-width="1" />
    <text x="855" y="276" font-size="15" font-weight="bold" fill="#F06292">实际还是：</text>
    <text x="855" y="304" font-size="13.5" fill="#E6EAF2">· 向日葵种子的最优排布角</text>
    <text x="855" y="330" font-size="13.5" fill="#E6EAF2">· 但神庙蒙娜丽莎多是附会——</text>
    <text x="855" y="356" font-size="13.5" fill="#E6EAF2">　 数学界亲自下场辟谣</text>

    <path fill="#1A2140" stroke="#9575CD" stroke-width="1.5" d="M84,410 H611 A14,14 0 0 1 625,424 V646 A14,14 0 0 1 611,660 H84 A14,14 0 0 1 70,646 V424 A14,14 0 0 1 84,410 Z" />
    <text x="95" y="452" font-family="'STIX Two Math','Times New Roman',serif" font-size="34" font-style="italic" fill="#9575CD">i</text>
    <text x="150" y="450" font-size="16" font-weight="bold" fill="#E6EAF2">你以为：假想的、没用的</text>
    <text x="95" y="492" font-size="13.5" fill="#8A93A8">「虚数」嘛，虚构的，考试完就还老师</text>
    <line x1="95" y1="514" x2="600" y2="514" stroke="#2A3358" stroke-width="1" />
    <text x="95" y="546" font-size="15" font-weight="bold" fill="#9575CD">实际还是：</text>
    <text x="95" y="574" font-size="13.5" fill="#E6EAF2">· 交流电、手机信号的全套计算语言</text>
    <text x="95" y="600" font-size="13.5" fill="#E6EAF2">· 量子力学的基本方程必须有它</text>
    <text x="95" y="626" font-size="13.5" fill="#E6EAF2">· 飞机机翼升力设计靠它算</text>

    <path fill="#1A2140" stroke="#66BB6A" stroke-width="1.5" d="M659,410 H1196 A14,14 0 0 1 1210,424 V646 A14,14 0 0 1 1196,660 H659 A14,14 0 0 1 645,646 V424 A14,14 0 0 1 659,410 Z" />
    <text x="670" y="452" font-family="'STIX Two Math','Times New Roman',serif" font-size="34" font-style="italic" fill="#66BB6A">0</text>
    <text x="725" y="450" font-size="16" font-weight="bold" fill="#E6EAF2">你以为：什么都没有</text>
    <text x="670" y="492" font-size="13.5" fill="#8A93A8">幼儿园就会写，最不起眼的数</text>
    <line x1="670" y1="514" x2="1180" y2="514" stroke="#2A3358" stroke-width="1" />
    <text x="670" y="546" font-size="15" font-weight="bold" fill="#66BB6A">实际还是：</text>
    <text x="670" y="574" font-size="13.5" fill="#E6EAF2">· 欧洲人接受它花了 600 年（还下过禁令）</text>
    <text x="670" y="600" font-size="13.5" fill="#E6EAF2">· 没有它：写不了大数、算不了微积分</text>
    <text x="670" y="626" font-size="13.5" fill="#E6EAF2">· 「除以零被禁止」是数学的保护墙</text>
  </g>
  <text x="640" y="694" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8A93A8">这一集：把五个「最熟悉的陌生人」一次性讲透，最后看它们如何一笔相连</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">02 / 16</text>
</svg>