<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226" />
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">常数与物理世界：宇宙写下的参数表（2026 版）</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">当物理学家拆解自然律，口袋里掏出的全是这几位老朋友</text>

  
  <path fill="#1A2140" stroke="#2A3358" d="M84,135 H626 A14,14 0 0 1 640,149 V561 A14,14 0 0 1 626,575 H84 A14,14 0 0 1 70,561 V149 A14,14 0 0 1 84,135 Z" />
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#4FC3F7">数学常数在物理定律中的出场</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <path fill="#121838" d="M105,190 H605 A10,10 0 0 1 615,200 V268 A10,10 0 0 1 605,278 H105 A10,10 0 0 1 95,268 V200 A10,10 0 0 1 105,190 Z" />
    <text x="115" y="216" fill="#E8B84B" font-weight="bold">π · 圆周率</text>
    <text x="115" y="240" fill="#E6EAF2">海森堡不确定性原理 <tspan font-family="'STIX Two Math',serif" font-style="italic">Δx·Δp ≥ ħ/2</tspan></text>
    <text x="115" y="262" fill="#8A93A8">库仑定律、牛顿引力、玻尔模型……凡球对称处必有 π</text>

    <path fill="#121838" d="M105,288 H605 A10,10 0 0 1 615,298 V366 A10,10 0 0 1 605,376 H105 A10,10 0 0 1 95,366 V298 A10,10 0 0 1 105,288 Z" />
    <text x="115" y="314" fill="#4FC3F7" font-weight="bold">e · 自然对数的底</text>
    <text x="115" y="338" fill="#E6EAF2">放射性衰变 <tspan font-family="'STIX Two Math',serif" font-style="italic">N(t) = N₀·exp(−λt)</tspan>、黑体辐射、熵</text>
    <text x="115" y="360" fill="#8A93A8">一切「速率正比于存量」的自然过程都是 e 的曲线</text>

    <path fill="#121838" d="M105,386 H605 A10,10 0 0 1 615,396 V464 A10,10 0 0 1 605,474 H105 A10,10 0 0 1 95,464 V396 A10,10 0 0 1 105,386 Z" />
    <text x="115" y="412" fill="#9575CD" font-weight="bold">i · 虚数单位</text>
    <text x="115" y="436" fill="#E6EAF2">薛定谔方程 <tspan font-family="'STIX Two Math',serif" font-style="italic">iħ ∂ψ/∂t = Ĥψ</tspan> ——波函数必须是复数</text>
    <text x="115" y="458" fill="#8A93A8">量子干涉、规范场论：i 不是方便，是必需</text>

    <path fill="#121838" d="M105,484 H605 A10,10 0 0 1 615,494 V550 A10,10 0 0 1 605,560 H105 A10,10 0 0 1 95,550 V494 A10,10 0 0 1 105,484 Z" />
    <text x="115" y="510" fill="#66BB6A" font-weight="bold">0 与 1 · 结构的原子</text>
    <text x="115" y="532" fill="#E6EAF2">真空零点能、守恒定律的「总量不变 = 常数」</text>
    <text x="115" y="552" fill="#8A93A8">能量守恒 = 大自然对「1」的执着</text>
  </g>

  
  <path fill="#1A2140" stroke="#E8B84B" stroke-opacity="0.5" d="M674,135 H1196 A14,14 0 0 1 1210,149 V561 A14,14 0 0 1 1196,575 H674 A14,14 0 0 1 660,561 V149 A14,14 0 0 1 674,135 Z" />
  <text x="685" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E8B84B">物理自己的常数：与数学常数不同的一类</text>
  <text x="685" y="200" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">光速 c、引力常数 G、普朗克常数 ħ ——数值随单位选择而变。</text>
  <text x="685" y="222" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">真正「超越单位」的是无量纲常数：</text>
  
  <path fill="#0E2A3A" stroke="#E8B84B" stroke-width="1.5" d="M697,240 H1173 A12,12 0 0 1 1185,252 V352 A12,12 0 0 1 1173,364 H697 A12,12 0 0 1 685,352 V252 A12,12 0 0 1 697,240 Z" />
  <text x="935" y="284" text-anchor="middle" font-family="'STIX Two Math','Times New Roman',serif" font-size="29" font-style="italic" fill="#E8B84B">α⁻¹ = 137.035999206(11)</text>
  <text x="935" y="314" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">精细结构常数 —— 电磁力的强度（NIST CODATA）</text>
  <text x="935" y="340" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#8A93A8">Rb 原子干涉测量法（2018 Berkeley + 2020 LKB 双确认）</text>
  
  <path fill="#121838" stroke="#FF8A65" stroke-opacity="0.5" d="M697,380 H1173 A12,12 0 0 1 1185,392 V548 A12,12 0 0 1 1173,560 H697 A12,12 0 0 1 685,548 V392 A12,12 0 0 1 697,380 Z" />
  <text x="705" y="412" font-family="'PingFang SC',sans-serif" font-size="14.5" font-weight="bold" fill="#FF8A65">2026 最新战况（两个方向夹击）</text>
  <text x="705" y="440" font-family="'PingFang SC',sans-serif" font-size="13" fill="#E6EAF2">· Rb 法与 Cs 法（2006 Harvard）结果相差 5.6σ——</text>
  <text x="705" y="462" font-family="'PingFang SC',sans-serif" font-size="13" fill="#E6EAF2">　 实验物理最精确的两把尺子彼此矛盾，至今未解</text>
  <text x="705" y="490" font-family="'PingFang SC',sans-serif" font-size="13" fill="#E6EAF2">· A&amp;A 2026：用 140 亿光年外的类星体光谱给出</text>
  <text x="705" y="512" font-family="'STIX Two Math','Times New Roman',serif" font-style="italic" font-size="14" fill="#E8B84B">　 |Δα/α| &lt; 1.5 ppm（sub-ppm 上限，宇宙学尺度）</text>
  <text x="705" y="540" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">→ 137 亿年内 α 至少稳定到百万分之一点五——</text>
  <text x="705" y="560" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">　 「宇宙源代码」的参数表非同寻常地恒定</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">13 / 16</text>
</svg>