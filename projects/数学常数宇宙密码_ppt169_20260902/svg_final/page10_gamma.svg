<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226" />
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">γ 彩蛋：290 年没人查清户口的数</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">你没听过的欧拉常数 γ=0.5772…——数学界最著名的「三不知道」</text>

  
  <path fill="#1A2140" stroke="#2A3358" d="M84,140 H616 A14,14 0 0 1 630,154 V396 A14,14 0 0 1 616,410 H84 A14,14 0 0 1 70,396 V154 A14,14 0 0 1 84,140 Z" />
  <text x="95" y="178" font-family="'PingFang SC',sans-serif" font-size="16.5" font-weight="bold" fill="#E6EAF2">定义只要一行，小学生能验算</text>
  <path fill="#121838" d="M105,196 H595 A10,10 0 0 1 605,206 V246 A10,10 0 0 1 595,256 H105 A10,10 0 0 1 95,246 V206 A10,10 0 0 1 105,196 Z" />
  <text x="350" y="233" text-anchor="middle" font-family="'STIX Two Math','Times New Roman',serif" font-size="19" font-style="italic" fill="#FF8A65">1 + ½ + ⅓ + ¼ + … + 1/n　和　ln n　的差 → 0.5772…</text>
  <text x="95" y="292" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">左边这串「调和级数」加到无穷大，ln n 也奔向无穷大，</text>
  <text x="95" y="316" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">但它们俩之间永远隔着一条稳定的缝——就是 γ。</text>
  <text x="95" y="352" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">欧拉 1735 年发现它、亲手算到 16 位。之后 290 年，</text>
  <text x="95" y="376" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">人类算到几千亿位，却连最基本的问题都答不上来。</text>

  
  <path fill="#1A1240" stroke="#FF8A65" stroke-opacity="0.5" d="M664,140 H1196 A14,14 0 0 1 1210,154 V396 A14,14 0 0 1 1196,410 H664 A14,14 0 0 1 650,396 V154 A14,14 0 0 1 664,140 Z" />
  <text x="675" y="178" font-family="'PingFang SC',sans-serif" font-size="16.5" font-weight="bold" fill="#FF8A65">对比：邻居们的「户口」全清了</text>
  <g font-family="'PingFang SC',sans-serif" font-size="14">
    <path fill="#121838" d="M683,196 H1177 A8,8 0 0 1 1185,204 V234 A8,8 0 0 1 1177,242 H683 A8,8 0 0 1 675,234 V204 A8,8 0 0 1 683,196 Z" />
    <text x="690" y="225" fill="#E6EAF2"><tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#E8B84B">π</tspan>　无理 ✓（1761）　超越 ✓（1882）</text>
    <path fill="#121838" d="M683,250 H1177 A8,8 0 0 1 1185,258 V288 A8,8 0 0 1 1177,296 H683 A8,8 0 0 1 675,288 V258 A8,8 0 0 1 683,250 Z" />
    <text x="690" y="279" fill="#E6EAF2"><tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#4FC3F7">e</tspan>　无理 ✓（1748）　超越 ✓（1873）</text>
    <path fill="#121838" d="M683,304 H1177 A8,8 0 0 1 1185,312 V342 A8,8 0 0 1 1177,350 H683 A8,8 0 0 1 675,342 V312 A8,8 0 0 1 683,304 Z" />
    <text x="690" y="333" fill="#E6EAF2"><tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#F06292">φ</tspan>　无理 ✓（很容易）　代数数 ✓</text>
    <path fill="#0E2A3A" stroke="#FF8A65" stroke-opacity="0.6" d="M683,358 H1177 A8,8 0 0 1 1185,366 V396 A8,8 0 0 1 1177,404 H683 A8,8 0 0 1 675,396 V366 A8,8 0 0 1 683,358 Z" />
    <text x="690" y="387" fill="#FF8A65" font-weight="bold"><tspan font-family="'STIX Two Math',serif" font-style="italic">γ</tspan>　无理？ 不知道　超越？ 更不知道</text>
  </g>

  
  <path fill="#121838" stroke="#2A3358" d="M84,430 H1196 A14,14 0 0 1 1210,444 V646 A14,14 0 0 1 1196,660 H84 A14,14 0 0 1 70,646 V444 A14,14 0 0 1 84,430 Z" />
  <text x="95" y="468" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">但数学家在合围：证明不了 γ，就证明「它和同伴至少一个超越」</text>
  <g transform="translate(95,490)" font-family="'PingFang SC',sans-serif" font-size="13">
    <line x1="0" y1="60" x2="1050" y2="60" stroke="#2A3358" stroke-width="2" />
    <circle cx="40" cy="60" r="7" fill="#8A93A8" />
    <text x="40" y="34" text-anchor="middle" fill="#8A93A8">1962</text>
    <text x="40" y="90" text-anchor="middle" fill="#8A93A8">至少一个无理</text>
    <circle cx="320" cy="60" r="7" fill="#8A93A8" />
    <text x="320" y="34" text-anchor="middle" fill="#8A93A8">2009</text>
    <text x="320" y="90" text-anchor="middle" fill="#8A93A8">给出显式构造</text>
    <circle cx="600" cy="60" r="7" fill="#FF8A65" />
    <text x="600" y="34" text-anchor="middle" fill="#FF8A65">2012</text>
    <text x="600" y="90" text-anchor="middle" fill="#FF8A65">至少一个超越</text>
    <circle cx="890" cy="60" r="8" fill="#FF8A65" />
    <circle cx="890" cy="60" r="14" fill="none" stroke="#FF8A65" stroke-opacity="0.4" />
    <text x="890" y="26" text-anchor="middle" fill="#FF8A65" font-weight="bold">2026</text>
    <text x="890" y="90" text-anchor="middle" fill="#FF8A65" font-weight="bold">全族超越（清华·新论文）</text>
    <text x="890" y="110" text-anchor="middle" fill="#8A93A8" font-size="11.5">arXiv:2511.01849</text>
  </g>
  <text x="95" y="642" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">→ 网一圈圈收紧，但 γ 本尊仍是自由身。它出现在 ζ 函数、素数分布各处——很可能与黎曼猜想相邻。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">10 / 16</text>
</svg>