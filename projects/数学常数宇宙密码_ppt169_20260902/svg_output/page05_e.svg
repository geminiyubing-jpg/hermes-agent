<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#4FC3F7">e = 2.71828…　增长的极限</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">一个关于「钱生钱」的问题，逼出了宇宙的增长速度上限</text>

  <!-- 左：复利极限 -->
  <rect x="70" y="135" width="620" height="390" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">1683 年，雅各布·伯努利的复利问题</text>
  <text x="95" y="198" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">本金 1 元，年利率 100%，一年后连本带息有多少？</text>
  <!-- 表 -->
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <rect x="95" y="218" width="570" height="34" rx="6" fill="#121838"/>
    <text x="115" y="240" fill="#8A93A8">计息方式</text>
    <text x="420" y="240" fill="#8A93A8">年末余额</text>
    <rect x="95" y="257" width="570" height="30" fill="none"/>
    <text x="115" y="278" fill="#E6EAF2">一年 1 次（100%）</text>
    <text x="420" y="278" font-family="'STIX Two Math',serif" font-style="italic" fill="#E6EAF2">(1+1)¹ = 2.0000</text>
    <text x="115" y="310" fill="#E6EAF2">半年 2 次（50%×2）</text>
    <text x="420" y="310" font-family="'STIX Two Math',serif" font-style="italic" fill="#E6EAF2">(1+½)² = 2.2500</text>
    <text x="115" y="342" fill="#E6EAF2">每月 12 次（8.3%×12）</text>
    <text x="420" y="342" font-family="'STIX Two Math',serif" font-style="italic" fill="#E6EAF2">(1+1/12)¹² ≈ 2.6130</text>
    <text x="115" y="374" fill="#E6EAF2">每天 365 次</text>
    <text x="420" y="374" font-family="'STIX Two Math',serif" font-style="italic" fill="#E6EAF2">(1+1/365)³⁶⁵ ≈ 2.7146</text>
    <text x="115" y="406" fill="#E6EAF2">每秒 3150 万次</text>
    <text x="420" y="406" font-family="'STIX Two Math',serif" font-style="italic" fill="#E6EAF2">(1+1/n)ⁿ → 2.71828…</text>
    <rect x="95" y="424" width="570" height="40" rx="6" fill="#0E2A3A"/>
    <text x="115" y="450" fill="#4FC3F7" font-weight="bold">无限细分割的极限</text>
    <text x="420" y="450" font-family="'STIX Two Math',serif" font-style="italic" font-size="15" fill="#4FC3F7" font-weight="bold">e = 2.7182818284…</text>
  </g>
  <!-- 增长曲线 -->
  <path d="M 95,505 C 300,505 480,470 640,430" fill="none" stroke="#4FC3F7" stroke-width="2.5"/>
  <line x1="95" y1="505" x2="640" y2="505" stroke="#2A3358" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="95" y="495" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8A93A8">余额攀升曲线：越切越细，越接近 2.71828… 却永不越过</text>
  <text x="530" y="445" font-family="'PingFang SC',sans-serif" font-size="13" fill="#4FC3F7" font-weight="bold">天花板 = e</text>
  <text x="95" y="538" font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#8A93A8">欧拉 1748 年正式命名 e 并证明其无理；埃尔米特 1873 年证明它超越。</text>

  <!-- 右上：为什么"自然" -->
  <rect x="710" y="135" width="500" height="250" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="735" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#4FC3F7">为什么叫「自然」对数的底？</text>
  <text x="735" y="202" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">因为 e 的 x 次方是唯一一族「导数 = 自身」的函数：</text>
  <text x="890" y="240" text-anchor="middle" font-family="'STIX Two Math','Times New Roman',serif" font-size="22" font-style="italic" fill="#4FC3F7">d/dx eˣ = eˣ</text>
  <text x="735" y="280" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">增长的速率正比于当前的量——这正是自然界</text>
  <text x="735" y="304" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">一切「滚雪球」现象的共同数学结构：</text>
  <text x="735" y="336" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">种群繁衍 · 放射性衰变 · 温度冷却 · 电容放电 ·</text>
  <text x="735" y="358" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">复利 · 病毒传播 · 链式反应 —— 全是 e 的家族</text>

  <!-- 右下：e 的哲学 -->
  <rect x="710" y="405" width="500" height="120" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="735" y="440" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">e 的哲学</text>
  <text x="735" y="470" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">「现在就复利」——把时间切到无穷细时，增长</text>
  <text x="735" y="492" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">速度的极限。e 不是被选中的，而是被极限</text>
  <text x="735" y="514" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">「逼出来」的——宇宙增长的语法规定。</text>

  <!-- 底部 -->
  <rect x="70" y="545" width="1140" height="110" rx="14" fill="#0E2A3A" stroke="#4FC3F7" stroke-opacity="0.4"/>
  <text x="640" y="588" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="17" fill="#E6EAF2">雅各布·伯努利要求把<tspan fill="#4FC3F7" font-weight="bold">等角螺线</tspan>刻上墓碑，附言「纵然改变，故我仍在」——</text>
  <text x="640" y="620" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="17" fill="#E6EAF2">螺线的方程正是 <tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#4FC3F7">r = exp(aθ)</tspan>：放大它，形状不变。这就是 e 的签名。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">05 / 16</text>
</svg>
