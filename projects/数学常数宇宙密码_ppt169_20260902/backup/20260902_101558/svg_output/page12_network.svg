<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">关系网全景：常数们从未单独存在</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">四个「跨界婚姻」，把看似无关的常数缝进同一张网</text>

  <!-- 左上：高斯积分 -->
  <rect x="70" y="135" width="570" height="250" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">① 高斯积分：e 缝出了 π</text>
  <text x="95" y="215" text-anchor="start" font-family="'STIX Two Math','Times New Roman',serif" font-size="21" font-style="italic" fill="#4FC3F7">∫ e<tspan dy="-9" font-size="14">−x²</tspan><tspan dy="9"> dx = √π　（从 −∞ 到 +∞）</tspan></text>
  <text x="95" y="252" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">钟形曲线的面积——整座统计学的地基——竟然</text>
  <text x="95" y="274" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">由 e 和 π 共同决定？π 的出场费由「旋转对称」</text>
  <text x="95" y="296" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">支付：把一维积分平方变二维，极坐标换元时</text>
  <text x="95" y="318" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">圆面积 π 自然现身。</text>

  <!-- 右上：Gamma -->
  <rect x="660" y="135" width="550" height="250" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="685" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">② Γ 函数：阶乘的推广缝合 e、π</text>
  <text x="685" y="215" font-family="'STIX Two Math','Times New Roman',serif" font-size="21" font-style="italic" fill="#E8B84B">Γ(½) = √π　　n! ≈ √(2πn)·(n/e)ⁿ</text>
  <text x="685" y="252" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">Γ 是阶乘的连续推广（n! = Γ(n+1)）。奇妙的是：</text>
  <text x="685" y="274" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">「半个阶乘」Γ(½) 竟然 = √π；斯特林公式则把 e、π</text>
  <text x="685" y="296" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">一起乘进阶乘的近似。计算「有多少种排列」这个</text>
  <text x="685" y="318" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">最离散的问题，竟同时需要两位连续世界的大使。</text>

  <!-- 左下：phi 与 pi -->
  <rect x="70" y="405" width="570" height="250" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="440" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">③ φ 与 π 的血缘：五角星作证</text>
  <text x="95" y="485" font-family="'STIX Two Math','Times New Roman',serif" font-size="21" font-style="italic" fill="#F06292">φ = 2 cos(π/5)　　e<tspan dy="-8" font-size="14">iπ/5</tspan><tspan dy="8"> 展开含 √5</tspan></text>
  <text x="95" y="522" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">黄金比看似「几何审美数」，实则藏在正五边形的</text>
  <text x="95" y="544" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">对角线里——而正五边形由 2π/5 的角度定义。</text>
  <text x="95" y="566" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">把 e 后接 iπ/5 用欧拉公式展开，√5（φ 的原料）</text>
  <text x="95" y="588" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">自动出现：复指数把 φ 拉进了欧拉家族。</text>

  <!-- 右下：1/e 法则 -->
  <rect x="660" y="405" width="550" height="250" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="685" y="440" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">④ 1/e ≈ 37%：最优停止的魔法比例</text>
  <text x="685" y="485" font-family="'STIX Two Math','Times New Roman',serif" font-size="21" font-style="italic" fill="#66BB6A">最优观察比例 = 1/e = 0.3678…</text>
  <text x="685" y="522" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">招聘（看完前 37% 的候选人后选第一个更好者）、</text>
  <text x="685" y="544" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">停车（路过的前 37% 车位只记不选）、恋爱、卖房</text>
  <text x="685" y="566" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">——凡「边看边决定、过了不再来」的问题，e 都</text>
  <text x="685" y="588" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">在暗中划定最优观望线。常数直接介入人类决策。</text>

  <!-- 底部句 -->
  <rect x="70" y="620" width="1140" height="44" rx="10" fill="#121838"/>
  <text x="640" y="648" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="15" fill="#E6EAF2">这些等式没有一个是「凑」出来的——它们是数学结构深处<tspan fill="#E8B84B" font-weight="bold">同一套 DNA</tspan>在不同器官的表达</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">12 / 16</text>
</svg>
