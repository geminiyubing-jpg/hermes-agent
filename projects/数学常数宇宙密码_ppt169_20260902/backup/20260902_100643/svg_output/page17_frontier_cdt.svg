<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">2025-26 前沿：无理性证明的「新武器」</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">Calegari–Dimitrov–Tang：被 Quanta 称为「数论的清晰突破」</text>

  <!-- 左：Apéry 奇迹到 CDT -->
  <rect x="70" y="135" width="570" height="500" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">从「孤立的奇迹」到「系统的方法」</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <rect x="95" y="190" width="520" height="100" rx="10" fill="#121838"/>
    <text x="115" y="218" fill="#E8B84B" font-weight="bold">1978 · Apéry 的奇迹</text>
    <text x="115" y="244" fill="#E6EAF2">ζ(3) 无理——但证明像「奇迹与神秘的混合物」，</text>
    <text x="115" y="268" fill="#8A93A8">没人知道公式从哪来，四十年无法推广</text>

    <rect x="95" y="302" width="520" height="120" rx="10" fill="#121838"/>
    <text x="115" y="330" fill="#4FC3F7" font-weight="bold">2024-25 · CDT 三人组（芝加哥/Caltech/伯克利）</text>
    <text x="115" y="356" fill="#E6EAF2">「算术全纯界」新判据：证明 <tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#E8B84B">L(2,χ₋₃)</tspan> 无理——</text>
    <text x="115" y="380" fill="#E6EAF2">140 年来第一个新的 L-值无理性；连同 1、π² 三者</text>
    <text x="115" y="404" fill="#8A93A8">Q-线性无关。方法可推广到无穷多 ζ(2) 变体与对数乘积</text>

    <rect x="95" y="434" width="520" height="88" rx="10" fill="#121838"/>
    <text x="115" y="462" fill="#F06292" font-weight="bold">附带战果：π 超越性的全新证明</text>
    <text x="115" y="488" fill="#E6EAF2">2026 SIAM 论文：同一框架给出 π 超越性的新路线，</text>
    <text x="115" y="510" fill="#8A93A8">并算出 2-adic ζ(5) 的无理性测度 ≤ 20.34</text>

    <rect x="95" y="534" width="520" height="80" rx="10" fill="#1A1240"/>
    <text x="115" y="562" fill="#66BB6A" font-weight="bold">2025 · Fischler–Sprang–Zudilin</text>
    <text x="115" y="586" fill="#E6EAF2">细化 Ball–Rivoal：无理 ζ 值在奇数中「均匀分布」</text>
  </g>

  <!-- 右上：为什么难 -->
  <rect x="660" y="135" width="550" height="245" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="685" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">为什么「证明一个数是无理数」这么难？</text>
  <text x="685" y="202" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">有理数是可数的（康托尔），实数不可数——「随机」的实数</text>
  <text x="685" y="224" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">几乎必然无理。但「证明某个特定的数无理」需要构造一组</text>
  <text x="685" y="246" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">分数逼近，逼近速度要快到「分数来不及抓住它」：</text>
  <text x="685" y="284" font-family="'STIX Two Math','Times New Roman',serif" font-size="16" font-style="italic" fill="#E8B84B">|ξ − pₙ/qₙ| &lt; 1/qₙ^(1+δ)，δ&gt;0 → ξ 无理</text>
  <text x="685" y="322" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">CDT 的洞见：不构造新逼近，而是榨干「已知逼近」的算术</text>
  <text x="685" y="344" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">潜力——用复分析+超越数论透视它们的奇点结构。</text>

  <!-- 右下：p进世界 -->
  <rect x="660" y="400" width="550" height="235" rx="14" fill="#121838" stroke="#9575CD" stroke-opacity="0.4"/>
  <text x="685" y="434" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#9575CD">彩蛋：p-进世界的平行突破</text>
  <text x="685" y="466" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">ζ(5)（普通）无理仍是悬案，但它的 2-进影子 <tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#E8B84B">ζ₂(5)</tspan></text>
  <text x="685" y="488" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">已被 CDT（2015 预印→正式发表）与 Lai–Sprang–Zudilin</text>
  <text x="685" y="510" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">（2025，Apéry 式三阶递推）两条独立路径证明无理。</text>
  <text x="685" y="546" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">2025 Springer 论文进一步：对每个素数 p≥5，区间</text>
  <text x="685" y="568" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">[3, p+p/log p+5] 内必有奇数 i 使 ζₚ(i) 无理——</text>
  <text x="685" y="590" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">「p-进版 Zudilin 定理」。影子世界先行，本体还在等。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">17 / 17</text>
</svg>
