<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">终极之问：常数是被发明的，还是被发现的？</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">两千五百年悬案——答案将决定「宇宙的源代码」到底是什么意思</text>

  <!-- 两大阵营 -->
  <rect x="70" y="135" width="555" height="310" rx="14" fill="#1A2140" stroke="#E8B84B" stroke-width="1.5"/>
  <text x="95" y="172" font-family="'PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#E8B84B">柏拉图主义：发现</text>
  <text x="95" y="196" font-family="'STIX Two Math','Times New Roman',serif" font-size="13.5" font-style="italic" fill="#8A93A8">「数学真理独立于人类心灵而存在」</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <text x="95" y="230" fill="#E6EAF2">· π 在人类出现前就是 3.14159…</text>
    <text x="95" y="256" fill="#E6EAF2">· 即使宇宙消失，「2+2=4」依然成立</text>
    <text x="95" y="282" fill="#E6EAF2">· 数学家是探险家，不是工匠——他们</text>
    <text x="115" y="304" fill="#E6EAF2">只是在地图上标注早已存在的山脉</text>
    <text x="95" y="340" fill="#4FC3F7" font-weight="bold">证据方：</text>
    <text x="115" y="364" fill="#8A93A8">不同文明独立发现相同的 π、勾股定理；</text>
    <text x="115" y="386" fill="#8A93A8">数学「不合理地有效」于物理（维格纳之问）；</text>
    <text x="115" y="408" fill="#8A93A8">物理预言常由纯数学结构先行 50 年</text>
  </g>

  <rect x="655" y="135" width="555" height="310" rx="14" fill="#1A2140" stroke="#4FC3F7" stroke-width="1.5"/>
  <text x="680" y="172" font-family="'PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#4FC3F7">形式主义：发明</text>
  <text x="680" y="196" font-family="'STIX Two Math','Times New Roman',serif" font-size="13.5" font-style="italic" fill="#8A93A8">「数学是符号游戏，规则由人制定」</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <text x="680" y="230" fill="#E6EAF2">· 0 与位值制是发明——换套记数法照样活</text>
    <text x="680" y="256" fill="#E6EAF2">· 连「1+1=2」都要从公理推 300 页</text>
    <text x="680" y="282" fill="#E6EAF2">　 （罗素《数学原理》）——规则是人写的，</text>
    <text x="680" y="304" fill="#E6EAF2">　 只是写完后人自己也惊讶于后果</text>
    <text x="680" y="340" fill="#F06292" font-weight="bold">证据方：</text>
    <text x="700" y="364" fill="#8A93A8">非欧几何：改一条公理，得到自洽的新数学</text>
    <text x="700" y="386" fill="#8A93A8">（后来恰好被广义相对论选中——惊不惊喜）；</text>
    <text x="700" y="408" fill="#8A93A8">数学里也存在大量「永不应用于物理」的分支</text>
  </g>

  <!-- 中间桥梁 -->
  <rect x="430" y="460" width="420" height="90" rx="45" fill="#121838" stroke="#E6EAF2" stroke-opacity="0.4"/>
  <text x="640" y="494" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#E6EAF2">现代主流：结构现实主义</text>
  <text x="640" y="522" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">符号是发明的，结构关系是发现的——两者各对一半</text>

  <!-- 底部：人择原理 -->
  <rect x="70" y="575" width="1140" height="90" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="95" y="608" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#FF8A65">延伸：为什么 α = 1/137 恰好允许原子、化学与生命？</text>
  <text x="95" y="636" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">人择原理的回答：若 α 偏离几个百分点，碳无法在恒星内合成、原子不稳定——<tspan fill="#FF8A65">我们只能在一个常数「恰好合适」的宇宙里提问</tspan>。这是谜题，不是答案。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">14 / 17</text>
</svg>
