<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">2025 前沿：AI 正在改写常数的发现方式</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">Ramanujan Machine + 保守矩阵场：从「数学家灵感」到「算法穷举」的范式转移</text>

  <!-- 左上：Ramanujan Machine -->
  <rect x="70" y="135" width="570" height="255" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#4FC3F7">拉马努金机器（PNAS 2024）</text>
  <text x="95" y="198" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">以传奇数学家命名的算法工厂：大规模并行搜索多项式连分数</text>
  <g font-family="'STIX Two Math','Times New Roman',serif" font-size="14" font-style="italic">
    <rect x="95" y="214" width="520" height="52" rx="8" fill="#121838"/>
    <text x="115" y="246" fill="#E8B84B">6ζ(3) = 5 − 117 / (26 − n⁶·17(n³+(n+1)³) / ⋱ )　← Apéry 连分数</text>
  </g>
  <text x="95" y="296" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">算法用数值匹配代替灵感：扫描海量「分子/分母多项式」组合，</text>
  <text x="95" y="318" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">凡收敛到已知常数的就报告——已自动发现 π、ln2、Catalan 常数</text>
  <text x="95" y="340" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">的数百条新公式。NeurIPS 2024：对 176 万条公式自动聚类。</text>

  <!-- 右上：保守矩阵场 -->
  <rect x="660" y="135" width="550" height="255" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="685" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E8B84B">保守矩阵场（CMF）：常数的关系图谱</text>
  <text x="685" y="198" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">同一张「矩阵网格」上行走不同方向，收敛到不同常数</text>
  <!-- 网格示意 -->
  <g transform="translate(700,215)">
    <rect x="0" y="0" width="120" height="120" fill="none" stroke="#2A3358" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="#2A3358"/><line x1="0" y1="60" x2="120" y2="60" stroke="#2A3358"/>
    <circle cx="60" cy="60" r="6" fill="#E8B84B"/>
    <path d="M 60,60 L 60,10" stroke="#4FC3F7" stroke-width="2.5"/>
    <path d="M 60,60 L 110,60" stroke="#F06292" stroke-width="2.5"/>
    <path d="M 60,60 L 10,110" stroke="#9575CD" stroke-width="2.5"/>
    <text x="45" y="-2" font-family="'STIX Two Math',serif" font-style="italic" font-size="14" fill="#4FC3F7">→ π</text>
    <text x="98" y="82" font-family="'STIX Two Math',serif" font-style="italic" font-size="14" fill="#F06292">→ ln2</text>
    <text x="-8" y="116" font-family="'STIX Two Math',serif" font-style="italic" font-size="14" fill="#9575CD">→ ζ(3)</text>
  </g>
  <text x="845" y="245" font-family="'PingFang SC',sans-serif" font-size="13" fill="#E6EAF2">CMF 揭示意外联姻：</text>
  <text x="845" y="270" fill="#E6EAF2" font-family="'PingFang SC',sans-serif" font-size="13">· π 与 ln2 同源（同一矩阵场）</text>
  <text x="845" y="295" fill="#E6EAF2" font-family="'PingFang SC',sans-serif" font-size="13">· e 与 Gompertz 常数同场</text>
  <text x="845" y="320" fill="#8A93A8" font-family="'PingFang SC',sans-serif" font-size="12.5">→ 「几百条孤立公式」原来是同一头大象</text>
  <text x="845" y="345" fill="#8A93A8" font-family="'PingFang SC',sans-serif" font-size="12.5">　 的不同侧面（2025 渐近与算术理论扩展）</text>

  <!-- 左下：From Euler to AI -->
  <rect x="70" y="410" width="570" height="225" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="95" y="444" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#66BB6A">From Euler to AI（arXiv 2502.17533, 2025）</text>
  <text x="95" y="472" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">LLM 收割 arXiv 海量论文中的 π 公式（GPT-4o 提取）→</text>
  <text x="95" y="494" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">符号算法聚类 → 上边缘等价证明：</text>
  <g font-family="'PingFang SC',sans-serif" font-size="14">
    <text x="95" y="530" fill="#E8B84B" font-weight="bold">94% 的已知 π 公式被证明两两等价</text>
    <text x="95" y="560" fill="#E8B84B" font-weight="bold">43% 落入同一个保守矩阵场</text>
  </g>
  <text x="95" y="594" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">欧拉、高斯、Brouncker 的手笔与 2020 年算法发现的新公式，</text>
  <text x="95" y="616" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">被证明是同一数学结构的局部切片——AI 当了回「公证处」。</text>

  <!-- 右下：意义 -->
  <rect x="660" y="410" width="550" height="225" rx="14" fill="#121838" stroke="#4FC3F7" stroke-opacity="0.4"/>
  <text x="685" y="444" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">这对「发明还是发现」之争意味着什么？</text>
  <text x="685" y="476" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">算法穷举出的公式，人类事后才逐步理解——连发现者本人</text>
  <text x="685" y="498" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">（算法）都不「理解」自己在发现什么。但公式是对的、</text>
  <text x="685" y="520" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">可验证的、彼此等价的。</text>
  <text x="685" y="556" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#4FC3F7" font-weight="bold">→ 结构先于理解存在——这是柏拉图主义的最新实验证据。</text>
  <text x="685" y="592" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">CMF 的渐近理论（2025）还把 Apéry 极限、无理性测度</text>
  <text x="685" y="614" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">统一进同一框架——γ 的最终判决可能也埋伏在这里。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">16 / 17</text>
</svg>
