<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#FF8A65">γ = 0.5772156…　最后的谜（与最新战报）</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">定义最简单、身世最不明——但 2026 年，包围圈正在收窄</text>

  <!-- 左：定义与收敛图 -->
  <rect x="70" y="135" width="580" height="340" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">定义：小学算术就能写下的极限</text>
  <text x="95" y="212" font-family="'STIX Two Math','Times New Roman',serif" font-size="18" font-style="italic" fill="#FF8A65">γ = lim ( 1 + ½ + ⅓ + … + 1/n − ln n ) ≈ 0.5772156</text>
  <text x="95" y="244" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">调和级数发散，ln n 也发散，但两者之差收敛到</text>
  <text x="95" y="266" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">一个确定的数——像两条渐近线之间的恒定缝隙。</text>
  <!-- 收敛示意 -->
  <g transform="translate(95,300)">
    <line x1="0" y1="120" x2="500" y2="120" stroke="#2A3358" stroke-width="1"/>
    <line x1="0" y1="120" x2="0" y2="0" stroke="#2A3358" stroke-width="1"/>
    <path d="M 0,118 C 80,60 180,32 500,14" fill="none" stroke="#4FC3F7" stroke-width="2"/>
    <path d="M 0,118 L 40,70 L 60,70 L 90,44 L 105,44 L 130,26 L 145,26 L 170,13 L 185,13 L 500,2" fill="none" stroke="#E8B84B" stroke-width="2"/>
    <line x1="260" y1="20" x2="260" y2="35" stroke="#FF8A65" stroke-width="2.5"/>
    <line x1="360" y1="16" x2="360" y2="26" stroke="#FF8A65" stroke-width="2.5"/>
    <line x1="460" y1="12" x2="460" y2="19" stroke="#FF8A65" stroke-width="2.5"/>
    <text x="385" y="52" font-family="'STIX Two Math',serif" font-style="italic" font-size="14" fill="#FF8A65">差距 → γ</text>
    <text x="405" y="100" font-family="'STIX Two Math',serif" font-style="italic" font-size="13" fill="#4FC3F7">ln n</text>
    <text x="30" y="52" font-family="'STIX Two Math',serif" font-style="italic" font-size="13" fill="#E8B84B">Hₙ</text>
  </g>
  <text x="95" y="460" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">欧拉 1735 年发现并算到 16 位；290 年后我们仍不知它是否无理。</text>

  <!-- 右上：未知三连 -->
  <rect x="670" y="135" width="540" height="180" rx="14" fill="#1A1240" stroke="#FF8A65" stroke-opacity="0.5"/>
  <text x="695" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#FF8A65">290 年悬而未决的三问</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <text x="695" y="204" fill="#E6EAF2">① γ 是无理数吗？——不知道</text>
    <text x="695" y="232" fill="#E6EAF2">② γ 是超越数吗？——更不知道（π、e、φ 户口全清）</text>
    <text x="695" y="260" fill="#E6EAF2">③ 它为何在 ζ 函数、Γ 函数、素数分布里到处出现？</text>
    <text x="695" y="292" fill="#8A93A8">——而这一切可能都通向黎曼猜想（γ 是 ζ 的邻居）</text>
  </g>

  <!-- 右下：2026 前沿战报（新增重点） -->
  <rect x="670" y="335" width="540" height="300" rx="14" fill="#121838" stroke="#FF8A65" stroke-width="1.5"/>
  <text x="695" y="368" font-family="'PingFang SC',sans-serif" font-size="15.5" font-weight="bold" fill="#FF8A65">最新战报：γ 的「析取包围圈」四步收窄</text>
  <text x="695" y="390" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#8A93A8">思路：证不出 γ 自己，就证明「γ 与某常数至少一个超越」</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13">
    <circle cx="705" cy="414" r="4" fill="#8A93A8"/><text x="720" y="419" fill="#E6EAF2">1962 Shidlovski：γ 与 δ 至少一个无理（隐式）</text>
    <circle cx="705" cy="444" r="4" fill="#8A93A8"/><text x="720" y="449" fill="#E6EAF2">2009 Aptekarev：量化该线性形式（显式构造）</text>
    <circle cx="705" cy="474" r="4" fill="#FF8A65"/><text x="720" y="479" fill="#E6EAF2">2012 Rivoal：至少一个<tspan font-weight="bold">超越</tspan></text>
    <rect x="695" y="494" width="490" height="122" rx="10" fill="#1A1240" stroke="#FF8A65" stroke-opacity="0.6"/>
    <text x="710" y="522" fill="#FF8A65" font-weight="bold">2026 · Powers（清华，arXiv:2511.01849）</text>
    <text x="710" y="548" fill="#E6EAF2">定义 Gumbel 分布矩序列 γ⁽ⁿ⁾, δ⁽ⁿ⁾，证明</text>
    <text x="710" y="572" font-family="'STIX Two Math','Times New Roman',serif" font-style="italic" font-size="14" fill="#E8B84B">{ γ⁽ⁿ⁾ + δ⁽ⁿ⁾/e } 全族代数无关 → 每个都超越</text>
    <text x="710" y="598" fill="#8A93A8">对每个 n≥1：(γ⁽ⁿ⁾, δ⁽ⁿ⁾) 析取超越 —— 包围圈又紧一圈</text>
  </g>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">10 / 17</text>
</svg>
