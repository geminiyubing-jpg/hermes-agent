<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#4FC3F7">前沿速览：AI 也在研究常数（一分钟版）</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">三件新鲜事——数学家 + 人工智能，正在合力改写常数的故事</text>

  <!-- 三卡 -->
  <g font-family="'PingFang SC',sans-serif">
    <rect x="70" y="140" width="360" height="430" rx="14" fill="#1A2140" stroke="#E8B84B" stroke-width="1.3"/>
    <text x="95" y="180" font-size="17" font-weight="bold" fill="#E8B84B">① 公式工厂</text>
    <text x="95" y="206" font-size="12.5" fill="#8A93A8">「拉马努金机器」· PNAS 2024</text>
    <text x="95" y="248" font-size="13.5" fill="#E6EAF2">算法大规模穷举「连分数」，</text>
    <text x="95" y="272" font-size="13.5" fill="#E6EAF2">自动发现 π、ln2 的数百条</text>
    <text x="95" y="296" font-size="13.5" fill="#E6EAF2">新公式——没有人类灵感，</text>
    <text x="95" y="320" font-size="13.5" fill="#E6EAF2">纯靠算力碰出来的。</text>
    <line x1="95" y1="350" x2="400" y2="350" stroke="#2A3358"/>
    <text x="95" y="384" font-size="13" fill="#8A93A8">还发现「保守矩阵场」：</text>
    <text x="95" y="408" font-size="13" fill="#8A93A8">π 和 ln2 竟是同一张数学</text>
    <text x="95" y="432" font-size="13" fill="#8A93A8">网格上不同方向走出的</text>
    <text x="95" y="456" font-size="13" fill="#8A93A8">结果——几百条孤立公式</text>
    <text x="95" y="480" font-size="13" fill="#8A93A8">原来是同一头大象。</text>

    <rect x="450" y="140" width="360" height="430" rx="14" fill="#1A2140" stroke="#66BB6A" stroke-width="1.3"/>
    <text x="475" y="180" font-size="17" font-weight="bold" fill="#66BB6A">② AI 当公证处</text>
    <text x="475" y="206" font-size="12.5" fill="#8A93A8">「From Euler to AI」· 2025</text>
    <text x="475" y="248" font-size="13.5" fill="#E6EAF2">用 GPT-4o 翻遍 arXiv 论文</text>
    <text x="475" y="272" font-size="13.5" fill="#E6EAF2">收集 π 的全部公式，再用</text>
    <text x="475" y="296" font-size="13.5" fill="#E6EAF2">符号算法两两比对：</text>
    <line x1="475" y1="326" x2="780" y2="326" stroke="#2A3358"/>
    <text x="475" y="360" font-size="15" fill="#66BB6A" font-weight="bold">94% 被证明互相等价</text>
    <text x="475" y="392" font-size="15" fill="#66BB6A" font-weight="bold">43% 出自同一结构</text>
    <line x1="475" y1="420" x2="780" y2="420" stroke="#2A3358"/>
    <text x="475" y="452" font-size="13" fill="#8A93A8">欧拉、高斯 300 年前的手笔</text>
    <text x="475" y="476" font-size="13" fill="#8A93A8">和 2020 年算法的新发现，</text>
    <text x="475" y="500" font-size="13" fill="#8A93A8">被证明是同一个数学结构</text>
    <text x="475" y="524" font-size="13" fill="#8A93A8">的不同侧面。</text>

    <rect x="830" y="140" width="380" height="430" rx="14" fill="#1A2140" stroke="#9575CD" stroke-width="1.3"/>
    <text x="855" y="180" font-size="17" font-weight="bold" fill="#9575CD">③ 无理性新武器</text>
    <text x="855" y="206" font-size="12.5" fill="#8A93A8">Calegari–Dimitrov–Tang · 2025</text>
    <text x="855" y="248" font-size="13.5" fill="#E6EAF2">「证明一个数写不成分数」</text>
    <text x="855" y="272" font-size="13.5" fill="#E6EAF2">是数学最难的事之一——</text>
    <text x="855" y="296" font-size="13.5" fill="#E6EAF2">1978 年之后 47 年没有</text>
    <text x="855" y="320" font-size="13.5" fill="#E6EAF2">像样的新突破。</text>
    <line x1="855" y1="350" x2="1190" y2="350" stroke="#2A3358"/>
    <text x="855" y="384" font-size="13.5" fill="#E6EAF2">三人组的新方法证明了</text>
    <text x="855" y="408" font-size="13.5" fill="#E6EAF2">一批全新常数的无理性，</text>
    <text x="855" y="432" font-size="13.5" fill="#E6EAF2">还顺手给出 π「超越性」</text>
    <text x="855" y="456" font-size="13.5" fill="#E6EAF2">的一条全新证明路线。</text>
    <text x="855" y="492" font-size="13" fill="#8A93A8">同行评价：数论的清晰突破</text>
    <text x="855" y="516" font-size="13" fill="#8A93A8">（Quanta 杂志专题报道）。</text>
    <text x="855" y="540" font-size="13" fill="#8A93A8">γ 的最终判决也可能用它。</text>
  </g>

  <!-- 底部一句 -->
  <rect x="70" y="590" width="1140" height="70" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="640" y="632" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="15.5" fill="#E6EAF2">共同的问题：AI 穷举出公式时并不「理解」它，但公式是对的、可验证的——<tspan fill="#E8B84B" font-weight="bold">数学结构先于人类理解而存在？</tspan></text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">16 / 16</text>
</svg>
