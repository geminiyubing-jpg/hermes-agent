<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">常数与物理世界：宇宙写下的参数表</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">当物理学家拆解自然律，口袋里掏出的全是这几位老朋友</text>

  <!-- 左列：数学常数在物理 -->
  <rect x="70" y="135" width="570" height="440" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#4FC3F7">数学常数在物理定律中的出场</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <rect x="95" y="190" width="520" height="88" rx="10" fill="#121838"/>
    <text x="115" y="216" fill="#E8B84B" font-weight="bold">π · 圆周率</text>
    <text x="115" y="240" fill="#E6EAF2">海森堡不确定性原理 <tspan font-family="'STIX Two Math',serif" font-style="italic">Δx·Δp ≥ ħ/2</tspan></text>
    <text x="115" y="262" fill="#8A93A8">库仑定律、牛顿引力、玻尔模型……凡球对称处必有 π</text>

    <rect x="95" y="288" width="520" height="88" rx="10" fill="#121838"/>
    <text x="115" y="314" fill="#4FC3F7" font-weight="bold">e · 自然对数的底</text>
    <text x="115" y="338" fill="#E6EAF2">放射性衰变 <tspan font-family="'STIX Two Math',serif" font-style="italic">N(t) = N₀e^(−λt)</tspan>、黑体辐射、熵</text>
    <text x="115" y="360" fill="#8A93A8">一切「速率正比于存量」的自然过程都是 e 的曲线</text>

    <rect x="95" y="386" width="520" height="88" rx="10" fill="#121838"/>
    <text x="115" y="412" fill="#9575CD" font-weight="bold">i · 虚数单位</text>
    <text x="115" y="436" fill="#E6EAF2">薛定谔方程 <tspan font-family="'STIX Two Math',serif" font-style="italic">iħ ∂ψ/∂t = Ĥψ</tspan> ——波函数必须是复数</text>
    <text x="115" y="458" fill="#8A93A8">量子干涉、规范场论：i 不是方便，是必需</text>

    <rect x="95" y="484" width="520" height="76" rx="10" fill="#121838"/>
    <text x="115" y="510" fill="#66BB6A" font-weight="bold">0 与 1 · 结构的原子</text>
    <text x="115" y="532" fill="#E6EAF2">真空零点能、守恒定律的「总量不变 = 常数」</text>
    <text x="115" y="552" fill="#8A93A8">能量守恒 = 大自然对「1」的执着</text>
  </g>

  <!-- 右列：物理自己的常数 -->
  <rect x="660" y="135" width="550" height="440" rx="14" fill="#1A2140" stroke="#E8B84B" stroke-opacity="0.5"/>
  <text x="685" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E8B84B">物理自己的常数：与数学常数不同的一类</text>
  <text x="685" y="200" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">光速 c、引力常数 G、普朗克常数 ħ ——它们有单位，</text>
  <text x="685" y="222" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">数值随单位选择而变（c = 3×10⁸ m/s 或 1 光年/年）。</text>
  <text x="685" y="244" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">真正「超越单位」的是无量纲常数：</text>
  <!-- α 大卡 -->
  <rect x="685" y="264" width="500" height="130" rx="12" fill="#0E2A3A" stroke="#E8B84B" stroke-width="1.5"/>
  <text x="935" y="308" text-anchor="middle" font-family="'STIX Two Math','Times New Roman',serif" font-size="30" font-style="italic" fill="#E8B84B">α ≈ 1 / 137.035999</text>
  <text x="935" y="340" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">精细结构常数 —— 电磁力的强度</text>
  <text x="935" y="366" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#8A93A8">NIST CODATA 2022：不依赖任何单位制的「纯数」</text>
  <text x="685" y="424" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">为什么是 1/137 而不是 1/140？没有人知道。</text>
  <text x="685" y="452" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">泡利临终仍写在黑板上的问题；狄拉克：</text>
  <text x="685" y="476" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">「物理学的大厦还没建好，因为我们还不</text>
  <text x="685" y="500" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">懂这个数从哪来。」</text>
  <text x="685" y="540" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">→ 数学常数（π,e）是逻辑的必然；物理无量纲常数</text>
  <text x="685" y="562" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">　 是宇宙的「自由参数」——两者的分野正是</text>
  <text x="685" y="584" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">　 「发明 or 发现」之争的物理侧证据。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">13 / 15</text>
</svg>
