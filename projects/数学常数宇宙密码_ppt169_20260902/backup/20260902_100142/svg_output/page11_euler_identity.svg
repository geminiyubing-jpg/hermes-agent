<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">欧拉恒等式：五个常数，一笔相连</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">被数学家投票选为「最美公式」——美在哪？美在「翻译」</text>

  <!-- 中央大公式 -->
  <rect x="240" y="130" width="800" height="110" rx="18" fill="#1A2140" stroke="#E8B84B" stroke-width="2"/>
  <text x="640" y="200" text-anchor="middle" font-family="'STIX Two Math','Times New Roman',serif" font-size="44" font-style="italic" fill="#E6EAF2">e<tspan baseline-shift="super" font-size="28" fill="#9575CD">iπ</tspan><tspan fill="#E6EAF2"> + </tspan><tspan fill="#66BB6A">1</tspan><tspan fill="#E6EAF2"> = </tspan><tspan fill="#66BB6A">0</tspan></text>
  <!-- 各常数标注 -->
  <g font-family="'PingFang SC',sans-serif" font-size="12.5">
    <line x1="440" y1="240" x2="400" y2="268" stroke="#4FC3F7" stroke-width="1.2"/>
    <text x="330" y="286" fill="#4FC3F7">e＝增长的语言</text>
    <line x1="560" y1="240" x2="575" y2="268" stroke="#9575CD" stroke-width="1.2"/>
    <text x="530" y="286" fill="#9575CD">i＝旋转的算子</text>
    <line x1="700" y1="240" x2="720" y2="268" stroke="#E8B84B" stroke-width="1.2"/>
    <text x="690" y="286" fill="#E8B84B">π＝半圈的弧度</text>
    <line x1="850" y1="240" x2="840" y2="268" stroke="#66BB6A" stroke-width="1.2"/>
    <text x="800" y="286" fill="#66BB6A">1＝出发点</text>
    <line x1="960" y1="240" x2="990" y2="268" stroke="#66BB6A" stroke-width="1.2"/>
    <text x="950" y="286" fill="#66BB6A">0＝归零的终点</text>
  </g>

  <!-- 左：单位圆几何 -->
  <rect x="70" y="315" width="560" height="290" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="350" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">几何翻译：沿单位圆转半圈</text>
  <g transform="translate(240,480)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#2A3358" stroke-width="1.5"/>
    <line x1="-125" y1="0" x2="125" y2="0" stroke="#2A3358" stroke-width="1"/>
    <line x1="0" y1="95" x2="0" y2="-115" stroke="#2A3358" stroke-width="1"/>
    <!-- 1 出发 -->
    <circle cx="95" cy="0" r="5" fill="#66BB6A"/>
    <text x="102" y="6" font-family="'STIX Two Math',serif" font-style="italic" font-size="14" fill="#66BB6A">1</text>
    <!-- 弧线 e^{iθ} -->
    <path d="M 95,0 A 95,95 0 0 0 -95,0" fill="none" stroke="#9575CD" stroke-width="3"/>
    <path d="M 88,-30 A 95,95 0 0 0 -60,-73" fill="none" stroke="#E8B84B" stroke-width="2" stroke-dasharray="4,3" transform="rotate(30)"/>
    <!-- 终点 -1 -->
    <circle cx="-95" cy="0" r="5" fill="#F06292"/>
    <text x="-118" y="6" font-family="'STIX Two Math',serif" font-style="italic" font-size="14" fill="#F06292">−1</text>
    <text x="10" y="-60" font-family="'STIX Two Math',serif" font-style="italic" font-size="13" fill="#9575CD">e^{iθ}</text>
    <text x="-30" y="118" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8A93A8">「以 e 的速率持续转动 θ 弧度」= 指数增长在复平面的化身</text>
  </g>
  <text x="420" y="420" font-family="'STIX Two Math','Times New Roman',serif" font-size="16" font-style="italic" fill="#E6EAF2">e^{iπ} = cos π + i sin π = −1</text>
  <text x="420" y="452" font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#8A93A8">转 π 弧度（180°）＝从 1 走到 −1</text>

  <!-- 右：为什么深刻 -->
  <rect x="650" y="315" width="560" height="290" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="675" y="350" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">它统一了三个互不相识的世界</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <rect x="675" y="368" width="510" height="60" rx="10" fill="#1A2140"/>
    <text x="695" y="392" fill="#4FC3F7" font-weight="bold">分析（e 的领域）</text>
    <text x="695" y="414" fill="#8A93A8">无穷、极限、连续变化——微积分的地盘</text>
    <rect x="675" y="436" width="510" height="60" rx="10" fill="#1A2140"/>
    <text x="695" y="460" fill="#E8B84B" font-weight="bold">几何（π 的领域）</text>
    <text x="695" y="482" fill="#8A93A8">圆、对称、旋转——空间的秩序</text>
    <rect x="675" y="504" width="510" height="60" rx="10" fill="#1A2140"/>
    <text x="695" y="528" fill="#9575CD" font-weight="bold">代数（i 与 0/1 的领域）</text>
    <text x="695" y="550" fill="#8A93A8">方程、结构、运算规则——符号的秩序</text>
  </g>
  <text x="905" y="592" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">一行等式 = 三大数学分支的<tspan fill="#E8B84B" font-weight="bold">外交条约</tspan></text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">11 / 15</text>
</svg>
