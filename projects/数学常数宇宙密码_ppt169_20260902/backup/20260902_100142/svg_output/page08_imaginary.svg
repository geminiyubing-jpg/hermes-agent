<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#9575CD">i = √−1　虚数的实在</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">被骂了 250 年的「不可能之数」，最终成为描述实在的最深语言</text>

  <!-- 左：数系扩张链 -->
  <rect x="70" y="135" width="600" height="420" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">数系的四次「被迫扩张」——每次都是被方程逼的</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <rect x="95" y="192" width="550" height="66" rx="10" fill="#121838"/>
    <text x="115" y="218" fill="#E6EAF2" font-weight="bold">自然数 → 负数</text>
    <text x="115" y="242" fill="#8A93A8">3 + x = 0 要有解 → 「欠债」抽象成 −3</text>

    <rect x="95" y="268" width="550" height="66" rx="10" fill="#121838"/>
    <text x="115" y="294" fill="#E6EAF2" font-weight="bold">整数 → 分数</text>
    <text x="115" y="318" fill="#8A93A8">2 × x = 1 要有解 → 乘法的逆必须存在</text>

    <rect x="95" y="344" width="550" height="66" rx="10" fill="#121838"/>
    <text x="115" y="370" fill="#E6EAF2" font-weight="bold">有理数 → 无理数</text>
    <text x="115" y="394" fill="#8A93A8">x² = 2 要有解 → 边长 1 的正方形对角线是 √2</text>

    <rect x="95" y="420" width="550" height="66" rx="10" fill="#1A1240" stroke="#9575CD" stroke-width="1.5"/>
    <text x="115" y="446" fill="#9575CD" font-weight="bold">实数 → 复数</text>
    <text x="115" y="470" fill="#8A93A8">x² = −1 要有解 → 卡尔达诺 1545：被迫承认 √−1</text>
  </g>
  <text x="95" y="515" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">奇怪的不是虚数存在，而是「数」从来就是被需要逼出来的工具——</text>
  <text x="95" y="538" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">i 只是把这条原则推到了显而易见的终点。</text>

  <!-- 右上：复平面旋转 -->
  <rect x="690" y="135" width="520" height="280" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="715" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">高斯的解释：乘 i = 逆时针旋转 90°</text>
  <!-- 坐标 -->
  <g transform="translate(950,310)">
    <line x1="-130" y1="0" x2="140" y2="0" stroke="#2A3358" stroke-width="1.5"/>
    <line x1="0" y1="130" x2="0" y2="-150" stroke="#2A3358" stroke-width="1.5"/>
    <!-- 1 -->
    <line x1="0" y1="0" x2="85" y2="0" stroke="#66BB6A" stroke-width="3"/>
    <text x="92" y="5" font-family="'STIX Two Math',serif" font-style="italic" font-size="16" fill="#66BB6A">1</text>
    <!-- ×i 后 -->
    <line x1="0" y1="0" x2="0" y2="-85" stroke="#9575CD" stroke-width="3"/>
    <text x="8" y="-88" font-family="'STIX Two Math',serif" font-style="italic" font-size="16" fill="#9575CD">i</text>
    <!-- 旋转弧 -->
    <path d="M 55,0 A 55,55 0 0 0 0,-55" fill="none" stroke="#F06292" stroke-width="1.8" stroke-dasharray="5,3"/>
    <text x="52" y="-42" font-family="'PingFang SC',sans-serif" font-size="12" fill="#F06292">×i 转过 90°</text>
    <!-- i² = -1 -->
    <line x1="0" y1="0" x2="-85" y2="0" stroke="#FF8A65" stroke-width="3"/>
    <text x="-100" y="5" font-family="'STIX Two Math',serif" font-style="italic" font-size="15" fill="#FF8A65">−1</text>
    <path d="M -50,0 A 50,50 0 0 0 0,-50" fill="none" stroke="#FF8A65" stroke-width="1.4" stroke-dasharray="5,3" opacity="0.6"/>
    <text x="-118" y="-52" font-family="'STIX Two Math',serif" font-style="italic" font-size="13" fill="#FF8A65">再转 90°</text>
  </g>
  <text x="715" y="360" font-family="'STIX Two Math','Times New Roman',serif" font-size="16" font-style="italic" fill="#E6EAF2">i² = −1　＝　转两个 90° = 掉头</text>
  <text x="715" y="390" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">「不可能的运算」在二维平面上只是转身——</text>

  <!-- 右下：i 统治物理 -->
  <rect x="690" y="435" width="520" height="120" rx="14" fill="#121838" stroke="#9575CD" stroke-opacity="0.4"/>
  <text x="715" y="468" font-family="'PingFang SC',sans-serif" font-size="15.5" font-weight="bold" fill="#9575CD">最「虚」的数，统治最「实」的物理</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13">
    <text x="715" y="496" fill="#E6EAF2">⚛️ 薛定谔方程 <tspan font-family="'STIX Two Math',serif" font-style="italic" fill="#9575CD">iħ∂ψ/∂t = Ĥψ</tspan> ——量子态必须是复的</text>
    <text x="715" y="520" fill="#E6EAF2">⚡ 电气工程阻抗 Z = R + iX　🌊 翼型升力(茹科夫斯基变换)</text>
    <text x="715" y="544" fill="#8A93A8"> kırılım：曼德博集合的无限复杂边界，也住在复平面上</text>
  </g>

  <!-- 底部 -->
  <rect x="70" y="575" width="1140" height="80" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="640" y="610" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="16" fill="#E6EAF2">笛卡尔讥讽的「想象出来的数」（imaginary），两百年后被高斯正名为「复数」——</text>
  <text x="640" y="638" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="16" fill="#E6EAF2">它不描述你能摸到的东西，它描述<tspan fill="#9575CD" font-weight="bold">变化本身的相位</tspan>。量子世界的登场券，非 i 莫属。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">08 / 15</text>
</svg>
