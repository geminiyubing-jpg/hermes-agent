<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#FF8A65">γ = 0.5772156…　最后的谜</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">定义最简单、身世最不明——数学已知与未知的分界线</text>

  <!-- 左：定义与收敛图 -->
  <rect x="70" y="135" width="580" height="420" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">定义：小学算术就能写下的极限</text>
  <text x="95" y="212" font-family="'STIX Two Math','Times New Roman',serif" font-size="18" font-style="italic" fill="#FF8A65">γ = lim ( 1 + ½ + ⅓ + … + 1/n − ln n ) ≈ 0.5772156</text>
  <text x="95" y="244" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">调和级数发散（加到无穷大），ln n 也发散，</text>
  <text x="95" y="266" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">但两者之差收敛到一个确定的数——像两条渐近线</text>
  <text x="95" y="288" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">之间的恒定缝隙。</text>
  <!-- 收敛示意 -->
  <g transform="translate(95,320)">
    <line x1="0" y1="120" x2="500" y2="120" stroke="#2A3358" stroke-width="1"/>
    <line x1="0" y1="120" x2="0" y2="0" stroke="#2A3358" stroke-width="1"/>
    <!-- ln n 曲线 -->
    <path d="M 0,118 C 80,60 180,32 500,14" fill="none" stroke="#4FC3F7" stroke-width="2"/>
    <!-- H_n 台阶 -->
    <path d="M 0,118 L 40,70 L 60,70 L 90,44 L 105,44 L 130,26 L 145,26 L 170,13 L 185,13 L 500,2" fill="none" stroke="#E8B84B" stroke-width="2"/>
    <!-- γ 缝隙 -->
    <line x1="260" y1="20" x2="260" y2="35" stroke="#FF8A65" stroke-width="2.5"/>
    <line x1="360" y1="16" x2="360" y2="26" stroke="#FF8A65" stroke-width="2.5"/>
    <line x1="460" y1="12" x2="460" y2="19" stroke="#FF8A65" stroke-width="2.5"/>
    <text x="385" y="52" font-family="'STIX Two Math',serif" font-style="italic" font-size="14" fill="#FF8A65">差距 → γ</text>
    <text x="405" y="100" font-family="'STIX Two Math',serif" font-style="italic" font-size="13" fill="#4FC3F7">ln n</text>
    <text x="30" y="52" font-family="'STIX Two Math',serif" font-style="italic" font-size="13" fill="#E8B84B">Hₙ = 1+½+…+1/n</text>
  </g>
  <text x="95" y="505" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">欧拉 1735 年发现，亲手算到 16 位；此后 290 年，</text>
  <text x="95" y="527" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">人类对它的「身份」几乎一无所知。</text>

  <!-- 右上：未知三连 -->
  <rect x="670" y="135" width="540" height="270" rx="14" fill="#1A1240" stroke="#FF8A65" stroke-opacity="0.5"/>
  <text x="695" y="170" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#FF8A65">290 年悬而未决的三问</text>
  <g font-family="'PingFang SC',sans-serif" font-size="14">
    <text x="695" y="208" fill="#E6EAF2">① γ 是无理数吗？</text>
    <text x="715" y="232" fill="#8A93A8">——不知道。连「不是 a + b√2 形式」都没证明</text>
    <text x="695" y="272" fill="#E6EAF2">② γ 是超越数吗？</text>
    <text x="715" y="296" fill="#8A93A8">——更不知道。π、e、φ 的「户口」都已查清</text>
    <text x="695" y="336" fill="#E6EAF2">③ 它为何到处出现？</text>
    <text x="715" y="360" fill="#8A93A8">——ζ 函数在 s=1 的残差、Γ 函数、素数分布</text>
    <text x="715" y="384" fill="#8A93A8">　  M(x) ~ eᵞ ln x / ln ln x……无处不在却无解释</text>
  </g>

  <!-- 右下：为什么它重要 -->
  <rect x="670" y="425" width="540" height="230" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="695" y="460" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">γ 的哲学价值：一堵诚实的墙</text>
  <text x="695" y="492" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">我们拥有威力惊人的工具：能证明 π 超越、能算</text>
  <text x="695" y="514" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">质数无穷、能把方程分类到毫发毕现——但这些</text>
  <text x="695" y="536" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">工具在 γ 面前集体失声。</text>
  <text x="695" y="572" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">它提醒我们：数学不是已完工的大厦，而是仍在</text>
  <text x="695" y="594" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">施工的工地。黎曼猜想（ζ 函数零点）很可能也</text>
  <text x="695" y="616" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8A93A8">是这个故事的一部分——γ 是它的邻居。</text>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">10 / 15</text>
</svg>
