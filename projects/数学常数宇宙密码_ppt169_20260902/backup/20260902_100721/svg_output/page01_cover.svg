<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1A2140"/>
      <stop offset="55%" stop-color="#121838"/>
      <stop offset="100%" stop-color="#0E1226"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#nebula)"/>
  <!-- 星点 -->
  <g fill="#E6EAF2">
    <circle cx="120" cy="90" r="1.4" opacity="0.7"/><circle cx="340" cy="60" r="1" opacity="0.5"/>
    <circle cx="620" cy="110" r="1.2" opacity="0.6"/><circle cx="900" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="1150" cy="120" r="1" opacity="0.5"/><circle cx="80" cy="300" r="1.2" opacity="0.6"/>
    <circle cx="1190" cy="330" r="1.3" opacity="0.7"/><circle cx="220" cy="620" r="1" opacity="0.5"/>
    <circle cx="1040" cy="600" r="1.4" opacity="0.6"/><circle cx="640" cy="660" r="1" opacity="0.4"/>
  </g>
  <!-- 顶部小字 -->
  <text x="640" y="120" text-anchor="middle" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="16" fill="#8A93A8" letter-spacing="6">深 度 数 学 科 普</text>
  <!-- 主标题 -->
  <text x="640" y="200" text-anchor="middle" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="52" font-weight="bold" fill="#E6EAF2">数学常数：宇宙的源代码</text>
  <text x="640" y="248" text-anchor="middle" font-family="'STIX Two Math','Times New Roman',serif" font-size="20" font-style="italic" fill="#E8B84B">Seven Numbers That Write the Universe</text>
  <!-- 七常数卡 -->
  <g font-family="'STIX Two Math','Times New Roman',serif" text-anchor="middle">
    <rect x="130" y="330" width="130" height="150" rx="14" fill="#1A2140" stroke="#66BB6A" stroke-width="1.5"/>
    <text x="195" y="405" font-size="40" font-style="italic" fill="#66BB6A">0</text>
    <text x="195" y="445" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">无中生有</text>

    <rect x="280" y="330" width="130" height="150" rx="14" fill="#1A2140" stroke="#66BB6A" stroke-width="1.5"/>
    <text x="345" y="405" font-size="40" font-style="italic" fill="#66BB6A">1</text>
    <text x="345" y="445" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">万物之基</text>

    <rect x="430" y="330" width="130" height="150" rx="14" fill="#1A2140" stroke="#4FC3F7" stroke-width="1.5"/>
    <text x="495" y="405" font-size="40" font-style="italic" fill="#4FC3F7">e</text>
    <text x="495" y="445" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">增长的极限</text>

    <rect x="580" y="330" width="130" height="150" rx="14" fill="#1A2140" stroke="#E8B84B" stroke-width="2"/>
    <text x="645" y="405" font-size="40" font-style="italic" fill="#E8B84B">π</text>
    <text x="645" y="445" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">圆的灵魂</text>

    <rect x="730" y="330" width="130" height="150" rx="14" fill="#1A2140" stroke="#9575CD" stroke-width="1.5"/>
    <text x="795" y="405" font-size="40" font-style="italic" fill="#9575CD">i</text>
    <text x="795" y="445" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">虚数的实在</text>

    <rect x="880" y="330" width="130" height="150" rx="14" fill="#1A2140" stroke="#F06292" stroke-width="1.5"/>
    <text x="945" y="405" font-size="40" font-style="italic" fill="#F06292">φ</text>
    <text x="945" y="445" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">完美的假象</text>

    <rect x="1030" y="330" width="130" height="150" rx="14" fill="#1A2140" stroke="#FF8A65" stroke-width="1.5"/>
    <text x="1095" y="405" font-size="40" font-style="italic" fill="#FF8A65">γ</text>
    <text x="1095" y="445" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8A93A8">最后的谜</text>
  </g>
  <!-- 欧拉恒等式横幅 -->
  <rect x="290" y="530" width="700" height="64" rx="32" fill="#1A2140" stroke="#2A3358"/>
  <text x="640" y="570" text-anchor="middle" font-family="'STIX Two Math','Times New Roman',serif" font-size="28" font-style="italic" fill="#E6EAF2">e<tspan baseline-shift="super" font-size="18">iπ</tspan> + 1 = 0　——　五个常数，一笔相连</text>
  <text x="640" y="640" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8A93A8">深入浅出 · 揭示世界的本质奥秘</text>
</svg>
