<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0E1226"/>
  <text x="80" y="72" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="28" font-weight="bold" fill="#E6EAF2">为什么常数是「宇宙的源代码」？</text>
  <text x="80" y="102" font-family="'PingFang SC',sans-serif" font-size="15" fill="#8A93A8">维格纳之问：数学凭什么「不公平地」适用于物理世界？</text>

  <!-- 左：维格纳之问 -->
  <rect x="70" y="140" width="540" height="250" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="95" y="178" font-family="'PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#E8B84B">1960 年，物理学家尤金·维格纳的著名演讲</text>
  <text x="95" y="210" font-family="'STIX Two Math','Times New Roman',serif" font-size="15" font-style="italic" fill="#4FC3F7">《数学在自然科学中不合理的有效性》</text>
  <text x="95" y="244" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">· 数学家凭审美构造的符号体系，为何能精确预言</text>
  <text x="95" y="270" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">  电子磁矩（12 位小数吻合实验）？</text>
  <text x="95" y="298" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">· 麦克斯韦写方程时只为统一电与磁，却「顺手」</text>
  <text x="95" y="324" font-family="'PingFang SC',sans-serif" font-size="14" fill="#E6EAF2">  预言了电磁波的存在与光速。</text>
  <text x="95" y="354" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8A93A8">→ 线索藏在常数里：它们是定律的「不变骨架」。</text>

  <!-- 右：两种常数 -->
  <rect x="640" y="140" width="570" height="250" rx="14" fill="#1A2140" stroke="#2A3358"/>
  <text x="665" y="178" font-family="'PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#F06292">常数的两种身世</text>
  <rect x="665" y="196" width="10" height="76" rx="5" fill="#66BB6A"/>
  <text x="690" y="218" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#66BB6A" font-weight="bold">发明型：人类符号系统的选择</text>
  <text x="690" y="244" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">0 与位值制——没有它，大数运算寸步难行；</text>
  <text x="690" y="266" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">换一套记数法，「十」可以叫别的名字。</text>
  <rect x="665" y="288" width="10" height="76" rx="5" fill="#E8B84B"/>
  <text x="690" y="310" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E8B84B" font-weight="bold">发现型：世界内在的比率</text>
  <text x="690" y="336" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">π 与 e——不管有没有人类、用不用十进制，</text>
  <text x="690" y="358" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E6EAF2">圆周与直径之比、增长的极限，恒定不变。</text>

  <!-- 底部：本片地图 -->
  <rect x="70" y="420" width="1140" height="230" rx="14" fill="#121838" stroke="#2A3358"/>
  <text x="95" y="456" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E6EAF2">本片路线图：七个常数 = 七个世界观切面</text>
  <g font-family="'PingFang SC',sans-serif" font-size="13.5">
    <rect x="95" y="480" width="252" height="60" rx="10" fill="#1A2140" stroke="#E8B84B" stroke-width="1.2"/>
    <text x="110" y="505" fill="#E8B84B" font-weight="bold">π · 圆的灵魂</text>
    <text x="110" y="526" fill="#8A93A8">对称性与周期现象</text>

    <rect x="362" y="480" width="252" height="60" rx="10" fill="#1A2140" stroke="#4FC3F7" stroke-width="1.2"/>
    <text x="377" y="505" fill="#4FC3F7" font-weight="bold">e · 增长的极限</text>
    <text x="377" y="526" fill="#8A93A8">变化与连续性的语法</text>

    <rect x="629" y="480" width="252" height="60" rx="10" fill="#1A2140" stroke="#F06292" stroke-width="1.2"/>
    <text x="644" y="505" fill="#F06292" font-weight="bold">φ · 完美的假象</text>
    <text x="644" y="526" fill="#8A93A8">自相似与确认偏误</text>

    <rect x="896" y="480" width="252" height="60" rx="10" fill="#1A2140" stroke="#9575CD" stroke-width="1.2"/>
    <text x="911" y="505" fill="#9575CD" font-weight="bold">i · 虚数的实在</text>
    <text x="911" y="526" fill="#8A93A8">数系扩张与维度桥梁</text>

    <rect x="95" y="556" width="252" height="60" rx="10" fill="#1A2140" stroke="#66BB6A" stroke-width="1.2"/>
    <text x="110" y="581" fill="#66BB6A" font-weight="bold">0 · 无中生有</text>
    <text x="110" y="602" fill="#8A93A8">「无」如何被数学驯服</text>

    <rect x="362" y="556" width="252" height="60" rx="10" fill="#1A2140" stroke="#FF8A65" stroke-width="1.2"/>
    <text x="377" y="581" fill="#FF8A65" font-weight="bold">γ · 最后的谜</text>
    <text x="377" y="602" fill="#8A93A8">已知与未知的分界线</text>

    <rect x="629" y="556" width="519" height="60" rx="10" fill="#1A2140" stroke="#E6EAF2" stroke-width="1.2"/>
    <text x="644" y="581" fill="#E6EAF2" font-weight="bold">关系网 · 五常数一笔连</text>
    <text x="644" y="602" fill="#8A93A8">欧拉恒等式如何把增长、旋转、起点、终点缝合成一体</text>
  </g>
  <text x="1210" y="700" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A93A8">02 / 17</text>
</svg>
