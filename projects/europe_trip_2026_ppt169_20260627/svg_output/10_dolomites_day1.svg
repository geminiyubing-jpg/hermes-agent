  <text x="70" y="298" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#718096">GPS: 46.6376°N, 11.7380°E · 导航搜索"Parkplatz Bergerplatz"</text>
