  <!-- Santa Giovanni Church -->
  <text x="55" y="225" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B4965">📸 圣约翰教堂 Chiesa di San Giovanni (孤独教堂)</text>
  <text x="55" y="245" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#2D3748">18世纪巴洛克小教堂 · 翠绿草地+锯齿状奥德勒山群 · 美到词穷</text>

