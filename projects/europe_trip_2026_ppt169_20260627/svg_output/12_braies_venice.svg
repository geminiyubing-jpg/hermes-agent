  <rect x="55" y="505" width="470" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="70" y="526" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#5FA8D3">🅿️ 威尼斯停车: Piazzale Roma 停车楼 · GPS: 45.4410°N, 12.3210°E</text>

  <rect x="545" y="465" width="400" height="74" rx="6" fill="#FFF8F0" stroke="#E8983F" stroke-width="1"/>
  <text x="560" y="488" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8983F">⚠️ 威尼斯自驾Tips</text>
  <text x="560" y="506" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#718096">威尼斯是禁车岛！车只能停在Piazzale Roma</text>
  <text x="560" y="522" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#718096">或Tronchetto停车楼(€25-30/天) · 然后坐船进岛</text>

