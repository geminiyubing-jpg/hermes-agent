  <text x="665" y="293" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B4965">💧 米苏里纳湖 Lago di Misurina</text>
  <text x="665" y="313" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#2D3748">不只停停车场旁观景点 · 沿湖西侧走隐秘小路</text>
  <text x="665" y="333" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#2D3748">走10分钟豁然开朗 · 湖边长椅看风从山脊滑过水面</text>

  <rect x="665" y="346" width="560" height="42" rx="8" fill="#FFF8F0" stroke="#E8983F" stroke-width="1.5"/>
  <text x="680" y="366" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8983F">🅿️ 停车: Lago di Misurina 湖边停车场</text>
  <text x="680" y="382" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#718096">GPS: 46.5980°N, 12.2540°E · 湖南侧 · 停车后沿湖西侧步道走</text>

  <!-- Drone -->
  <rect x="665" y="396" width="560" height="22" rx="4" fill="#F8D7DA"/>
