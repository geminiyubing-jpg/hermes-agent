  <text x="665" y="180" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B4965">⛰️ 三峰山 Tre Cime di Lavaredo (远观)</text>
  <text x="665" y="200" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#2D3748">自驾路过远观 · 感受三座标志性尖峰的震撼</text>
  <text x="665" y="220" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#718096">不进入环线(需3-4h徒步) · 路边观景点停车拍照</text>

  <rect x="665" y="232" width="560" height="42" rx="8" fill="#FFF8F0" stroke="#E8983F" stroke-width="1.5"/>
  <text x="680" y="252" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8983F">🅿️ 停车: Tre Cime观景路边 · SS48沿途观景点</text>
  <text x="680" y="268" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#718096">GPS: 46.6180°N, 12.3090°E · 从Misurina沿收费路上山</text>

