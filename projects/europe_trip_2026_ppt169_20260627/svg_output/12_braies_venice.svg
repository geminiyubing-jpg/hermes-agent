  <text x="1220" y="50" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#F0F4F8">Day 12 · 水与石的对话</text>

  <!-- Drone badge -->
  <rect x="40" y="88" width="380" height="24" rx="4" fill="#F8D7DA"/>
