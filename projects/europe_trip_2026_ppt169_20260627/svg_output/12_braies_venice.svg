  <text x="55" y="610" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#F0FFF4">6:30出发→7:30布莱埃斯湖划船→10:00三峰山远观→11:00米苏里纳湖午餐→13:00出发威尼斯→16:30到威尼斯停车</text>

