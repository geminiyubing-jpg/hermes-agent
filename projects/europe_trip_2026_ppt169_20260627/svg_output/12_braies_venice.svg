  <rect x="55" y="175" width="560" height="36" rx="6" fill="#48BB78"/>
  <text x="70" y="197" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">🚗 导航: Lago di Braies · 从Ortisei约1.5h车程</text>

  <!-- Parking -->
  <rect x="55" y="218" width="560" height="58" rx="8" fill="#FFF8F0" stroke="#E8983F" stroke-width="1.5"/>
  <text x="70" y="240" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#E8983F">🅿️ 停车: Lago di Braies 大型停车场 (P1/P2)</text>
  <text x="70" y="258" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#718096">GPS: 46.6940°N, 12.0930°E · 旺季€5-8/天 · 早起抢位</text>
  <text x="70" y="272" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#718096">💡 必须赶在大巴到达前到！8:00前最佳</text>

  <text x="55" y="295" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B4965">🛶 划船体验</text>
  <text x="55" y="315" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#2D3748">提前预订木船 · 划到湖心最安静的地方听船桨声</text>
  <text x="55" y="335" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="12" fill="#2D3748">湖水翡翠色 · 雪山倒影 · 早晨雾气最梦幻</text>

  <rect x="55" y="348" width="560" height="28" rx="6" fill="#D4EDDA" stroke="#28A745" stroke-width="1"/>
