<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1920" height="8" fill="#2E7D46"/>
  <text x="100" y="110" font-family="PingFang SC" font-size="52" font-weight="800" fill="#1A2E22">佳琦现状：架子已搭 60%，最强的是规格表</text>
  <text x="100" y="158" font-family="PingFang SC" font-size="24" fill="#5E7568">对照作业本 19 页逐项盘点（2026-10-08）· 总评 B+ 的架子，缺的是中段和收尾</text>
  <!-- 进度环 -->
  <g transform="translate(300,460)">
    <circle r="150" fill="none" stroke="#E3DED4" stroke-width="34"/>
    <circle r="150" fill="none" stroke="#2E7D46" stroke-width="34" stroke-dasharray="565 942" transform="rotate(-90)"/>
    <text y="-8" text-anchor="middle" font-family="PingFang SC" font-size="72" font-weight="800" fill="#2E7D46">60%</text>
    <text y="48" text-anchor="middle" font-family="PingFang SC" font-size="24" fill="#5E7568">A 研究段完成度</text>
  </g>
  <!-- 已完成清单 -->
  <g>
    <rect x="560" y="220" width="630" height="380" rx="16" fill="#FFFFFF" stroke="#E3DED4"/>
    <text x="600" y="272" font-family="PingFang SC" font-size="28" font-weight="700" fill="#2E7D46">✅ 已完成（真迹）</text>
    <text x="600" y="325" font-family="PingFang SC" font-size="23" fill="#1A2E22">· A1 问题陈述（P10 模板五句已填）</text>
    <text x="600" y="373" font-family="PingFang SC" font-size="23" fill="#1A2E22">· A2 研究计划 6 问（2 高 4 中，有优先级）</text>
    <text x="600" y="421" font-family="PingFang SC" font-size="23" fill="#1A2E22">· A3 保时捷 7 维对标（28.6 万新币起）</text>
    <text x="600" y="469" font-family="PingFang SC" font-size="23" fill="#1A2E22">· A4 设计简报（四叶草主题贯穿）</text>
    <rect x="600" y="495" width="550" height="80" rx="10" fill="#F0F6F1"/>
    <text x="620" y="528" font-family="PingFang SC" font-size="22" font-weight="700" fill="#2E7D46">★ B4 规格表 12 条全带理由 = 全文档最强段</text>
    <text x="620" y="558" font-family="PingFang SC" font-size="19" fill="#5E7568">"四叶草=幸运"的理由链是她的原创，保留不动</text>
  </g>
  <!-- 空白清单 -->
  <g>
    <rect x="1220" y="220" width="600" height="380" rx="16" fill="#FFFFFF" stroke="#E3DED4"/>
    <text x="1260" y="272" font-family="PingFang SC" font-size="28" font-weight="700" fill="#C77D2E">⬜ 空白 / 薄弱</text>
    <text x="1260" y="325" font-family="PingFang SC" font-size="23" fill="#1A2E22">· Biii 论证表（P18 三列表）整页空白</text>
    <text x="1260" y="373" font-family="PingFang SC" font-size="23" fill="#1A2E22">· B2 多方案草图（三形对比）未画</text>
    <text x="1260" y="421" font-family="PingFang SC" font-size="23" fill="#1A2E22">· Moodboard 灵感板 10-15 张未收集</text>
    <text x="1260" y="469" font-family="PingFang SC" font-size="23" fill="#1A2E22">· C 制作记录（照片+步骤）未开始</text>
    <text x="1260" y="517" font-family="PingFang SC" font-size="23" fill="#1A2E22">· D 测试评估（赛后才有数据）</text>
    <rect x="1260" y="540" width="520" height="44" rx="8" fill="#FFF4E8"/>
    <text x="1278" y="569" font-family="PingFang SC" font-size="20" fill="#C77D2E">注意：空白集中在 B 中段——恰是 rubric 权重最重处</text>
  </g>
  <!-- 底部：三个行动 -->
  <rect x="100" y="660" width="1720" height="320" rx="16" fill="#FFFFFF" stroke="#E3DED4"/>
  <text x="140" y="720" font-family="PingFang SC" font-size="30" font-weight="700" fill="#1A2E22">家长最该知道的三件事</text>
  <g font-family="PingFang SC">
    <rect x="140" y="750" width="530" height="190" rx="12" fill="#F0F6F1"/>
    <text x="170" y="800" font-size="24" font-weight="700" fill="#2E7D46">① 9/9 有一次 AI 代写</text>
    <text x="170" y="840" font-size="20" fill="#1A2E22">Research 121 词是小爱代写（已纠正）。</text>
    <text x="170" y="872" font-size="20" fill="#1A2E22">对策=内化四问：drag 是什么/为何快/</text>
    <text x="170" y="904" font-size="20" fill="#1A2E22">数据哪来/换你会选吗——面谈不穿帮。</text>
    <rect x="700" y="750" width="530" height="190" rx="12" fill="#F0F4F8"/>
    <text x="730" y="800" font-size="24" font-weight="700" fill="#1D6FA5">② 英文错句要清零</text>
    <text x="730" y="840" font-size="20" fill="#1A2E22">notice→noticed · purposed→serves the</text>
    <text x="730" y="872" font-size="20" fill="#1A2E22">purpose · 4.2 亚克力≠fibreboard（事实错）</text>
    <text x="730" y="904" font-size="20" fill="#1A2E22">——誊写时顺手改，5 分钟的事。</text>
    <rect x="1260" y="750" width="530" height="190" rx="12" fill="#FBF4EE"/>
    <text x="1290" y="800" font-size="24" font-weight="700" fill="#C77D2E">③ 本周末 2 小时定生死</text>
    <text x="1290" y="840" font-size="20" fill="#1A2E22">问老师三问（打印/气罐位/轮子供应）→</text>
    <text x="1290" y="872" font-size="20" fill="#1A2E22">补 Bii 草图 + Biii 论证表 → Onshape 建模。</text>
    <text x="1290" y="904" font-size="20" fill="#1A2E22">这三步做完，B 段就从空白变最强。</text>
  </g>
  <text x="1820" y="1040" font-family="PingFang SC" font-size="18" fill="#8AA093" text-anchor="end">03 / 07</text>
</svg>
