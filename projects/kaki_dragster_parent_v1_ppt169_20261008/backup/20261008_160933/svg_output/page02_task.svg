<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1920" height="8" fill="#2E7D46"/>
  <text x="100" y="110" font-family="PingFang SC" font-size="52" font-weight="800" fill="#1A2E22">作业是什么：一辆 CO₂ 动力的 25 米直线赛车</text>
  <text x="100" y="160" font-family="PingFang SC" font-size="26" fill="#5E7568">F1 Dragster Car Project · NLCS Grade 6 Design &amp; Engineering · 约 20 新币预算</text>
  <!-- 左：赛道示意 -->
  <g>
    <rect x="100" y="220" width="800" height="420" rx="16" fill="#FFFFFF" stroke="#E3DED4"/>
    <text x="140" y="270" font-family="PingFang SC" font-size="28" font-weight="700" fill="#2E7D46">比赛形式</text>
    <line x1="160" y1="470" x2="820" y2="470" stroke="#4A5D50" stroke-width="4"/>
    <g transform="translate(160,430)">
      <path d="M0,32 C2,16 12,6 30,5 L70,7 C100,10 125,16 143,19 L150,20 C154,21 154,25 154,28 L154,35 C154,37 152,38 149,38 L12,38 C4,37 0,35 0,32 Z" fill="#2E7D46"/>
      <circle cx="30" cy="33" r="8" fill="#12241A"/><circle cx="118" cy="34" r="9" fill="#12241A"/>
    </g>
    <text x="330" y="420" font-family="PingFang SC" font-size="22" fill="#B3402E">CO₂ 气罐爆破 → 全班推力相同</text>
    <text x="160" y="530" font-family="PingFang SC" font-size="24" fill="#1A2E22">直线 25 m · 比最快 · 引导绳防跑偏</text>
    <text x="160" y="575" font-family="PingFang SC" font-size="24" fill="#1A2E22">胜负 = 减阻力 + 减重量 + 走直线</text>
    <text x="160" y="615" font-family="PingFang SC" font-size="20" fill="#8AA093">（推力是常量——这是这道题的物理内核）</text>
  </g>
  <!-- 右：硬约束 -->
  <g>
    <rect x="950" y="220" width="870" height="420" rx="16" fill="#FFFFFF" stroke="#E3DED4"/>
    <text x="990" y="270" font-family="PingFang SC" font-size="28" font-weight="700" fill="#1D6FA5">老师的硬约束（说明书口径）</text>
    <line x1="990" y1="300" x2="1780" y2="300" stroke="#E3DED4" stroke-width="2"/>
    <text x="990" y="350" font-family="PingFang SC" font-size="26" fill="#1A2E22">车身长度 200 – 300 mm</text>
    <text x="990" y="410" font-family="PingFang SC" font-size="26" fill="#1A2E22">整车重量 45 – 170 g</text>
    <text x="990" y="470" font-family="PingFang SC" font-size="26" fill="#1A2E22">动力：8 g CO₂ 气罐（尾舱发射）</text>
    <text x="990" y="530" font-family="PingFang SC" font-size="26" fill="#1A2E22">预算 约 20 新币</text>
    <rect x="990" y="560" width="790" height="56" rx="10" fill="#FFF4E8"/>
    <text x="1010" y="596" font-family="PingFang SC" font-size="22" fill="#C77D2E">约束不是限制——约束就是设计本身（气罐孔定了，形状才能长出来）</text>
  </g>
  <!-- 底：MYP 四准则 -->
  <rect x="100" y="680" width="1720" height="300" rx="16" fill="#1A2E22"/>
  <text x="140" y="740" font-family="PingFang SC" font-size="30" font-weight="700" fill="#F7F5F0">MYP 四把尺子（每个准则 8 分制 · 顶档关键词）</text>
  <g font-family="PingFang SC">
    <rect x="140" y="775" width="390" height="80" rx="10" fill="#2E7D46"/><text x="165" y="810" font-size="26" font-weight="700" fill="#fff">A · 探索研究</text><text x="165" y="842" font-size="19" fill="#DFEDE3">详细研究并说明优先级</text>
    <rect x="555" y="775" width="390" height="80" rx="10" fill="#1D6FA5"/><text x="580" y="810" font-size="26" font-weight="700" fill="#fff">B · 发展想法</text><text x="580" y="842" font-size="19" fill="#DFEDE3">多个可行方案 + 逐条论证</text>
    <rect x="970" y="775" width="390" height="80" rx="10" fill="#C77D2E"/><text x="995" y="810" font-size="26" font-weight="700" fill="#fff">C · 创造解决</text><text x="995" y="842" font-size="19" fill="#FFF4E8">正确工具 + 熟练技术</text>
    <rect x="1385" y="775" width="390" height="80" rx="10" fill="#7A5BA6"/><text x="1410" y="810" font-size="26" font-weight="700" fill="#fff">D · 测试评估</text><text x="1410" y="842" font-size="19" fill="#EFE9F7">真实测试 + 数据 + 改进</text>
  </g>
  <text x="140" y="930" font-family="PingFang SC" font-size="22" fill="#B9C9BF">口诀：选过、比过、测过、说得出为什么 —— 四个准则都在奖励"想清楚了再做"</text>
  <text x="1820" y="1040" font-family="PingFang SC" font-size="18" fill="#8AA093" text-anchor="end">02 / 07</text>
</svg>
