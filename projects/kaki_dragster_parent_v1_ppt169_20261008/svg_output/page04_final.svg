<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1920" height="8" fill="#2E7D46"/>
  <text x="100" y="110" font-family="PingFang SC" font-size="52" font-weight="800" fill="#1A2E22">最终方案：所有论证落地后的样子</text>
  <text x="100" y="158" font-family="PingFang SC" font-size="24" fill="#5E7568">混合形 · PLA 镂空 · 亚克力轮 · 绿白金 + 车顶四叶草（平面喷绘）</text>
  <!-- 侧视 (比例 250×75 简化) -->
  <g>
    <rect x="100" y="210" width="1060" height="330" rx="16" fill="#FFFFFF" stroke="#E3DED4"/>
    <text x="140" y="260" font-family="PingFang SC" font-size="26" font-weight="700" fill="#2E7D46">侧视图（250 × 高 65 · 轮 Ø34 / Ø36）</text>
    <line x1="150" y1="470" x2="1110" y2="470" stroke="#4A5D50" stroke-width="3"/>
    <path d="M190,448 C194,408 216,380 258,377 L420,382 C540,390 640,406 710,418 L780,424 C792,426 792,434 792,444 L792,462 C792,467 788,468 782,468 L220,466 C202,465 190,460 190,448 Z" fill="#2E7D46"/>
    <path d="M200,448 C212,416 248,392 320,388 L640,404 L780,424 L780,432 L320,424 C250,418 214,436 200,448 Z" fill="#F2F6F3" opacity="0.9"/>
    <rect x="716" y="428" width="40" height="36" rx="5" fill="#C77D2E"/>
    <text x="736" y="452" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#fff" font-weight="800">CO₂</text>
    <circle cx="300" cy="452" r="24" fill="#12241A"/><circle cx="300" cy="452" r="12" fill="#2E4A3A"/><circle cx="300" cy="452" r="4" fill="#DFEDE3"/>
    <circle cx="680" cy="452" r="26" fill="#12241A"/><circle cx="680" cy="452" r="13" fill="#2E4A3A"/><circle cx="680" cy="452" r="4" fill="#DFEDE3"/>
    <text x="190" y="360" font-family="PingFang SC" font-size="20" fill="#2E7D46" font-weight="700">水滴鼻（空气最优）</text>
    <text x="640" y="360" font-family="PingFang SC" font-size="20" fill="#C77D2E" font-weight="700">方形尾（装气罐+后轴）</text>
    <text x="150" y="510" font-family="PingFang SC" font-size="19" fill="#8AA093">头管空气 · 尾管硬件 —— form follows function，外形服从功能</text>
  </g>
  <!-- 俯视 + 四叶草 -->
  <g>
    <rect x="1200" y="210" width="620" height="330" rx="16" fill="#FFFFFF" stroke="#E3DED4"/>
    <text x="1240" y="260" font-family="PingFang SC" font-size="26" font-weight="700" fill="#2E7D46">俯视图（车顶四叶草 Ø30 喷绘）</text>
    <rect x="1290" y="300" width="26" height="16" rx="8" fill="#12241A"/>
    <rect x="1290" y="440" width="26" height="16" rx="8" fill="#12241A"/>
    <rect x="1660" y="296" width="34" height="22" rx="11" fill="#12241A"/>
    <rect x="1660" y="438" width="34" height="22" rx="11" fill="#12241A"/>
    <path d="M1330,378 C1360,340 1430,344 1490,352 C1560,360 1620,370 1660,376 L1660,400 C1580,412 1470,416 1400,410 C1360,406 1336,394 1330,378 Z" fill="#2E7D46"/>
    <rect x="1660" y="372" width="34" height="32" rx="6" fill="#256539"/>
    <g transform="translate(1480,386) scale(1.5)">
      <g transform="rotate(45)"><path d="M0,0 C-2.4,-1.5 -4,-5.5 -2.2,-8.2 C-0.6,-10.6 0,-8.8 0,-7.6 C0,-8.8 0.6,-10.6 2.2,-8.2 C4,-5.5 2.4,-1.5 0,0 Z" fill="#F2F6F3" stroke="#C9A227" stroke-width="0.8"/></g>
      <g transform="rotate(135)"><path d="M0,0 C-2.4,-1.5 -4,-5.5 -2.2,-8.2 C-0.6,-10.6 0,-8.8 0,-7.6 C0,-8.8 0.6,-10.6 2.2,-8.2 C4,-5.5 2.4,-1.5 0,0 Z" fill="#F2F6F3" stroke="#C9A227" stroke-width="0.8"/></g>
      <g transform="rotate(225)"><path d="M0,0 C-2.4,-1.5 -4,-5.5 -2.2,-8.2 C-0.6,-10.6 0,-8.8 0,-7.6 C0,-8.8 0.6,-10.6 2.2,-8.2 C4,-5.5 2.4,-1.5 0,0 Z" fill="#F2F6F3" stroke="#C9A227" stroke-width="0.8"/></g>
      <g transform="rotate(315)"><path d="M0,0 C-2.4,-1.5 -4,-5.5 -2.2,-8.2 C-0.6,-10.6 0,-8.8 0,-7.6 C0,-8.8 0.6,-10.6 2.2,-8.2 C4,-5.5 2.4,-1.5 0,0 Z" fill="#F2F6F3" stroke="#C9A227" stroke-width="0.8"/></g>
    </g>
    <text x="1290" y="500" font-family="PingFang SC" font-size="19" fill="#8AA093">圆规画 Ø30 → 四等分 → 心形叶 → 先白后金 → 只许平面漆</text>
  </g>
  <!-- 底部：方案卡片 6 项 -->
  <g font-family="PingFang SC">
    <rect x="100" y="580" width="540" height="150" rx="12" fill="#F0F6F1"/><text x="130" y="630" font-size="24" font-weight="700" fill="#2E7D46">车身：混合形</text><text x="130" y="668" font-size="20" fill="#1A2E22">水滴鼻+方形尾——不是妥协，</text><text x="130" y="700" font-size="20" fill="#1A2E22">是头尾各司其职</text>
    <rect x="680" y="580" width="540" height="150" rx="12" fill="#F0F6F1"/><text x="710" y="630" font-size="24" font-weight="700" fill="#2E7D46">材料：PLA 镂空 2mm</text><text x="710" y="668" font-size="20" fill="#1A2E22">Onshape 精确复刻曲线，</text><text x="710" y="700" font-size="20" fill="#1A2E22">镂空壳比实心轻 40%</text>
    <rect x="1260" y="580" width="560" height="150" rx="12" fill="#F0F6F1"/><text x="1290" y="630" font-size="24" font-weight="700" fill="#2E7D46">轮：亚克力切轮 Ø34/Ø36</text><text x="1290" y="668" font-size="20" fill="#1A2E22">圆度最好（激光切割），</text><text x="1290" y="700" font-size="20" fill="#1A2E22">前窄后宽=直线稳定</text>
    <rect x="100" y="760" width="540" height="150" rx="12" fill="#F0F4F8"/><text x="130" y="810" font-size="24" font-weight="700" fill="#1D6FA5">配色：绿白金</text><text x="130" y="848" font-size="20" fill="#1A2E22">racing green 车身+白条纹+</text><text x="130" y="880" font-size="20" fill="#1A2E22">金描边——观众记得住</text>
    <rect x="680" y="760" width="540" height="150" rx="12" fill="#F0F4F8"/><text x="710" y="810" font-size="24" font-weight="700" fill="#1D6FA5">主题：四叶草=幸运</text><text x="710" y="848" font-size="20" fill="#1A2E22">佳琦原创理由链保留；</text><text x="710" y="880" font-size="20" fill="#1A2E22">车顶平面喷绘（非车体形状）</text>
    <rect x="1260" y="760" width="560" height="150" rx="12" fill="#F0F4F8"/><text x="1290" y="810" font-size="24" font-weight="700" fill="#1D6FA5">稳定：引导绳+6g 前配重</text><text x="1290" y="848" font-size="20" fill="#1A2E22">防抬头（重心前移）+</text><text x="1290" y="880" font-size="20" fill="#1A2E22">防跑偏（绳导轨）</text>
  </g>
  <text x="1820" y="1040" font-family="PingFang SC" font-size="18" fill="#8AA093" text-anchor="end">04 / 07</text>
</svg>
