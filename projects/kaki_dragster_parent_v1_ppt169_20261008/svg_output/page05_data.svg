<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1920" height="8" fill="#1D6FA5"/>
  <text x="100" y="110" font-family="PingFang SC" font-size="52" font-weight="800" fill="#1A2E22">建模数据：每个数都说得出为什么</text>
  <text x="100" y="158" font-family="PingFang SC" font-size="24" fill="#5E7568">Onshape 直接输入 · Pitsco 8g 标准口径 · 开建模前拿此表问老师确认校内规则</text>
  <!-- 数据表 -->
  <g font-family="'Helvetica Neue','PingFang SC',sans-serif">
    <rect x="100" y="200" width="1720" height="60" fill="#1A2E22"/>
    <text x="130" y="238" font-size="24" font-weight="700" fill="#fff">部位</text>
    <text x="440" y="238" font-size="24" font-weight="700" fill="#fff">设计值</text>
    <text x="800" y="238" font-size="24" font-weight="700" fill="#fff">合规区间</text>
    <text x="1120" y="238" font-size="24" font-weight="700" fill="#fff">为什么是这个数（推导链）</text>
    <!-- rows: h=66 -->
    <rect x="100" y="260" width="1720" height="66" fill="#FFFFFF"/><text x="130" y="302" font-size="22" fill="#1A2E22" font-weight="700">车长</text><text x="440" y="302" font-size="22" fill="#2E7D46" font-weight="800">250 mm</text><text x="800" y="302" font-size="21" fill="#5E7568">200–300</text><text x="1120" y="302" font-size="20" fill="#1A2E22">罐舱 51 + 鼻锥 60 需要长；轴距长直线稳；太长表面积大 → 平衡点</text>
    <rect x="100" y="326" width="1720" height="66" fill="#F4F6F3"/><text x="130" y="368" font-size="22" fill="#1A2E22" font-weight="700">轴距</text><text x="440" y="368" font-size="22" fill="#2E7D46" font-weight="800">180 mm</text><text x="800" y="368" font-size="21" fill="#5E7568">105–270</text><text x="1120" y="368" font-size="20" fill="#1A2E22">车长 250 减前后悬 30/40 —— 长轴距=25m 直线不蛇形</text>
    <rect x="100" y="392" width="1720" height="66" fill="#FFFFFF"/><text x="130" y="434" font-size="22" fill="#1A2E22" font-weight="700">车身宽</text><text x="440" y="434" font-size="22" fill="#2E7D46" font-weight="800">40 mm</text><text x="800" y="434" font-size="21" fill="#5E7568">25.5–42</text><text x="1120" y="434" font-size="20" fill="#1A2E22">硬约束夹出：罐 Ø19.5+壁 3×2=25.5 下限；总宽 75−轮外伸=上限</text>
    <rect x="100" y="458" width="1720" height="66" fill="#F4F6F3"/><text x="130" y="500" font-size="22" fill="#1A2E22" font-weight="700">总宽（含轮）</text><text x="440" y="500" font-size="22" fill="#2E7D46" font-weight="800">≤75 mm</text><text x="800" y="500" font-size="21" fill="#5E7568">—</text><text x="1120" y="500" font-size="20" fill="#B3402E" font-weight="700">⚠ 校内口径未确认 → 建模前问老师</text>
    <rect x="100" y="524" width="1720" height="66" fill="#FFFFFF"/><text x="130" y="566" font-size="22" fill="#1A2E22" font-weight="700">总高（含轮）</text><text x="440" y="566" font-size="22" fill="#2E7D46" font-weight="800">≤65 mm</text><text x="800" y="566" font-size="21" fill="#5E7568">56–75</text><text x="1120" y="566" font-size="20" fill="#1A2E22">罐中心 33 + 罐径 10 + 顶弧 = 最低 58；越低越稳</text>
    <rect x="100" y="590" width="1720" height="66" fill="#F4F6F3"/><text x="130" y="632" font-size="22" fill="#1A2E22" font-weight="700">壳壁厚</text><text x="440" y="632" font-size="22" fill="#2E7D46" font-weight="800">2 mm 镂空</text><text x="800" y="632" font-size="21" fill="#5E7568">≥1.5</text><text x="1120" y="632" font-size="20" fill="#1A2E22">1.5 易裂（示范改日志的真实案例）；2 = 打印可靠 + 够轻</text>
    <rect x="100" y="656" width="1720" height="72" fill="#FFF4E8"/><text x="130" y="700" font-size="22" fill="#B3402E" font-weight="800">CO₂ 气罐孔 ★</text><text x="440" y="700" font-size="22" fill="#B3402E" font-weight="800">Ø19.5 × 深 51</text><text x="800" y="700" font-size="21" fill="#5E7568">Ø19–20 / 50–52</text><text x="1120" y="688" font-size="20" fill="#B3402E" font-weight="700">安全关键！罐周壁厚 ≥3mm，孔中心线离底 33mm 平行底面</text><text x="1120" y="716" font-size="19" fill="#B3402E">错 = 比赛直接取消资格——这三个数先核对再开工</text>
    <rect x="100" y="728" width="1720" height="66" fill="#FFFFFF"/><text x="130" y="770" font-size="22" fill="#1A2E22" font-weight="700">轴孔</text><text x="440" y="770" font-size="22" fill="#2E7D46" font-weight="800">Ø3.2 离底 8</text><text x="800" y="770" font-size="21" fill="#5E7568">Ø3.5–4.5 钻</text><text x="1120" y="770" font-size="20" fill="#1A2E22">打印件可留 3.2 过渡配合（紧一点不晃）；离地高=轮半径−轴心偏移</text>
    <rect x="100" y="794" width="1720" height="66" fill="#F4F6F3"/><text x="130" y="836" font-size="22" fill="#1A2E22" font-weight="700">前/后轮</text><text x="440" y="836" font-size="22" fill="#2E7D46" font-weight="800">Ø34 窄 / Ø36 宽</text><text x="800" y="836" font-size="21" fill="#5E7568">32–37 / 30–40</text><text x="1120" y="836" font-size="20" fill="#1A2E22">前小后大前窄后宽 = 防抬頭 + 直线稳定；亚克力切割圆度最好</text>
    <rect x="100" y="860" width="1720" height="66" fill="#FFFFFF"/><text x="130" y="902" font-size="22" fill="#1A2E22" font-weight="700">导绳孔 + 配重</text><text x="440" y="902" font-size="22" fill="#2E7D46" font-weight="800">Ø4 车头 / 6g 前舱</text><text x="800" y="902" font-size="21" fill="#5E7568">整车 45–170g</text><text x="1120" y="902" font-size="20" fill="#1A2E22">规格 5.1 防跑偏；前配重压住重心防 wheelie（打印后厨房秤验证）</text>
  </g>
  <rect x="100" y="950" width="1720" height="70" rx="12" fill="#F0F4F8"/>
  <text x="130" y="993" font-family="PingFang SC" font-size="23" fill="#1D6FA5" font-weight="700">结论：这不是"最优解"——这是约束推导出的合理起点。六年级能对每个数说出为什么，就是 rubric 顶档的 "detailed and justified"。</text>
  <text x="1820" y="1048" font-family="PingFang SC" font-size="18" fill="#8AA093" text-anchor="end">05 / 07</text>
</svg>
