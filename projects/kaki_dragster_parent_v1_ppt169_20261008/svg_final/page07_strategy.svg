<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#F7F5F0" />
  <rect x="0" y="0" width="1920" height="8" fill="#C77D2E" />
  <text x="100" y="110" font-family="PingFang SC" font-size="52" font-weight="800" fill="#1A2E22">辅导策略与日程：搭档不是替身</text>
  
  <g>
    <path fill="#FFFFFF" stroke="#E3DED4" d="M116,180 H944 A16,16 0 0 1 960,196 V664 A16,16 0 0 1 944,680 H116 A16,16 0 0 1 100,664 V196 A16,16 0 0 1 116,180 Z" />
    <text x="140" y="240" font-family="PingFang SC" font-size="30" font-weight="700" fill="#2E7D46">44 页 HTML 讲解材料在做什么</text>
    <g font-family="PingFang SC">
      <text x="140" y="300" font-size="23" fill="#1A2E22">· 老师的原表逐格示范（表头一字不改）——她看到的是</text>
      <text x="165" y="336" font-size="23" fill="#1A2E22">"作业本那页填满了的样子"，格子对格子照抄格式</text>
      <text x="140" y="392" font-size="23" fill="#1A2E22">· 每个概念配动画：风洞气流/重心/直线偏差——先懂</text>
      <text x="165" y="428" font-size="23" fill="#1A2E22">"为什么"，再写"是什么"，面谈不穿帮</text>
      <text x="140" y="484" font-size="23" fill="#1A2E22">· 绿橙双层：主线+备选+成立条件——学的是选择方法，</text>
      <text x="165" y="520" font-size="23" fill="#1A2E22">不是抄一个答案</text>
      <text x="140" y="576" font-size="23" fill="#1A2E22">· 中英双语+双语配音——英文部分直接可改写进作业</text>
      <path fill="#F0F6F1" d="M150,600 H910 A10,10 0 0 1 920,610 V646 A10,10 0 0 1 910,656 H150 A10,10 0 0 1 140,646 V610 A10,10 0 0 1 150,600 Z" />
      <text x="165" y="636" font-size="21" font-weight="700" fill="#2E7D46">红线：不代写答案；她自己填每个格子，材料只教"怎么想"</text>
    </g>
  </g>
  
  <g>
    <path fill="#FFFFFF" stroke="#E3DED4" d="M1016,180 H1804 A16,16 0 0 1 1820,196 V664 A16,16 0 0 1 1804,680 H1016 A16,16 0 0 1 1000,664 V196 A16,16 0 0 1 1016,180 Z" />
    <text x="1040" y="240" font-family="PingFang SC" font-size="30" font-weight="700" fill="#C77D2E">日程表（往回推）</text>
    <g font-family="PingFang SC">
      <path fill="#FFF4E8" d="M1050,272 H1770 A10,10 0 0 1 1780,282 V334 A10,10 0 0 1 1770,344 H1050 A10,10 0 0 1 1040,334 V282 A10,10 0 0 1 1050,272 Z" /><text x="1070" y="300" font-size="22" font-weight="700" fill="#C77D2E">本周末 · 2 小时</text><text x="1070" y="330" font-size="20" fill="#1A2E22">问老师三问 + 补 B2 草图/Biii 论证表 + Onshape 建模</text>
      <path fill="#F4F6F3" d="M1050,354 H1770 A10,10 0 0 1 1780,364 V416 A10,10 0 0 1 1770,426 H1050 A10,10 0 0 1 1040,416 V364 A10,10 0 0 1 1050,354 Z" /><text x="1070" y="382" font-size="22" font-weight="700" fill="#1A2E22">下周 · 打印队列</text><text x="1070" y="412" font-size="20" fill="#1A2E22">交 STL（校方打印）→ 拆支撑/打磨/上色 → 拍照记录</text>
      <path fill="#F4F6F3" d="M1050,436 H1770 A10,10 0 0 1 1780,446 V498 A10,10 0 0 1 1770,508 H1050 A10,10 0 0 1 1040,498 V446 A10,10 0 0 1 1050,436 Z" /><text x="1070" y="464" font-size="22" font-weight="700" fill="#1A2E22">10/22 · Process Journal</text><text x="1070" y="494" font-size="20" fill="#1A2E22">制作过程日志截止（C 段证据都在这）</text>
      <path fill="#F0F4F8" d="M1050,518 H1770 A10,10 0 0 1 1780,528 V580 A10,10 0 0 1 1770,590 H1050 A10,10 0 0 1 1040,580 V528 A10,10 0 0 1 1050,518 Z" /><text x="1070" y="546" font-size="22" font-weight="700" fill="#1D6FA5">比赛日 · D 段</text><text x="1070" y="576" font-size="20" fill="#1A2E22">三次计时取中位 → 对照 B 的目标逐条判定 → 改进三条</text>
      <text x="1040" y="640" font-size="20" fill="#B3402E" font-weight="700">关键路径：建模数据先经老师确认，再进 Onshape——</text>
      <text x="1040" y="672" font-size="20" fill="#B3402E">返工一次 = 损失一周打印窗口</text>
    </g>
  </g>
  
  <path fill="#1A2E22" d="M116,720 H1804 A16,16 0 0 1 1820,736 V964 A16,16 0 0 1 1804,980 H116 A16,16 0 0 1 100,964 V736 A16,16 0 0 1 116,720 Z" />
  <text x="150" y="800" font-family="PingFang SC" font-size="40" font-weight="800" fill="#F7F5F0">满分 = 每个格子都选过、比过、说得出为什么</text>
  <text x="150" y="860" font-family="PingFang SC" font-size="24" fill="#B9C9BF">研究给了道理，设计立了目标，制作留下证据，比赛回答一切。</text>
  <text x="150" y="910" font-family="PingFang SC" font-size="24" fill="#C9A227">佳琦的四叶草会跑完全程。🍀</text>
