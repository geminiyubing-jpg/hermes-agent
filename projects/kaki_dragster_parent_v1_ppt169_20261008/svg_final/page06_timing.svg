<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#F7F5F0" />
  <rect x="0" y="0" width="1920" height="8" fill="#2E7D46" />
  <text x="100" y="110" font-family="PingFang SC" font-size="52" font-weight="800" fill="#1A2E22">时序纪律与思维广度：两条拿分暗线</text>
  
  <g>
    <path fill="#FFFFFF" stroke="#E3DED4" d="M116,180 H944 A16,16 0 0 1 960,196 V804 A16,16 0 0 1 944,820 H116 A16,16 0 0 1 100,804 V196 A16,16 0 0 1 116,180 Z" />
    <text x="140" y="240" font-family="PingFang SC" font-size="30" font-weight="700" fill="#1D6FA5">① 时序因果：B 写目标，D 写实测</text>
    <g font-family="PingFang SC">
      <path fill="#F0F4F8" d="M152,290 H908 A12,12 0 0 1 920,302 V374 A12,12 0 0 1 908,386 H152 A12,12 0 0 1 140,374 V302 A12,12 0 0 1 152,290 Z" />
      <text x="170" y="330" font-size="24" font-weight="700" fill="#1D6FA5">研究（A）</text>
      <text x="170" y="365" font-size="21" fill="#1A2E22">知道"为什么"——风洞原理、材料对比、前人数据</text>
      <path fill="#F0F4F8" d="M152,400 H908 A12,12 0 0 1 920,412 V484 A12,12 0 0 1 908,496 H152 A12,12 0 0 1 140,484 V412 A12,12 0 0 1 152,400 Z" />
      <text x="170" y="440" font-size="24" font-weight="700" fill="#1D6FA5">设计（B）→ 立目标</text>
      <text x="170" y="475" font-size="21" fill="#1A2E22">"Target: ≤50g，打印后厨房秤验证"——只写目标+验证法</text>
      <path fill="#F0F4F8" d="M152,510 H908 A12,12 0 0 1 920,522 V594 A12,12 0 0 1 908,606 H152 A12,12 0 0 1 140,594 V522 A12,12 0 0 1 152,510 Z" />
      <text x="170" y="550" font-size="24" font-weight="700" fill="#1D6FA5">制作（C）→ 知重量</text>
      <text x="170" y="585" font-size="21" fill="#1A2E22">打印完才称得出克数；改日志记"计划X→改成Y→因为Z"</text>
      <path fill="#FFF4E8" d="M152,620 H908 A12,12 0 0 1 920,632 V704 A12,12 0 0 1 908,716 H152 A12,12 0 0 1 140,704 V632 A12,12 0 0 1 152,620 Z" />
      <text x="170" y="660" font-size="24" font-weight="700" fill="#C77D2E">比赛（D）→ 知秒数名次</text>
      <text x="170" y="695" font-size="21" fill="#1A2E22">"1.9s / 全班第 2 / 48g"这类数字只可能出现在这一段</text>
      <text x="140" y="770" font-size="21" fill="#B3402E" font-weight="700">⚠ 赛前表格出现赛后数据 = 编数据 = 比空白更糟</text>
    </g>
  </g>
  
  <g>
    <path fill="#FFFFFF" stroke="#E3DED4" d="M1016,180 H1804 A16,16 0 0 1 1820,196 V804 A16,16 0 0 1 1804,820 H1016 A16,16 0 0 1 1000,804 V196 A16,16 0 0 1 1016,180 Z" />
    <text x="1040" y="240" font-family="PingFang SC" font-size="30" font-weight="700" fill="#C77D2E">② 每格 3-4 个备选：绿=主线，橙=看得见的其他路</text>
    <g font-family="PingFang SC">
      <path fill="#F0F6F1" d="M1052,280 H1768 A12,12 0 0 1 1780,292 V378 A12,12 0 0 1 1768,390 H1052 A12,12 0 0 1 1040,378 V292 A12,12 0 0 1 1052,280 Z" />
      <text x="1070" y="320" font-size="23" font-weight="700" fill="#2E7D46">材料</text>
      <text x="1070" y="356" font-size="20" fill="#1A2E22">PLA（主线）· PETG 抗摔 · ABS 轻但翘边 · 轻木（学校发料才成立）</text>
      <path fill="#F0F6F1" d="M1052,404 H1768 A12,12 0 0 1 1780,416 V502 A12,12 0 0 1 1768,514 H1052 A12,12 0 0 1 1040,502 V416 A12,12 0 0 1 1052,404 Z" />
      <text x="1070" y="444" font-size="23" font-weight="700" fill="#2E7D46">轮子</text>
      <text x="1070" y="480" font-size="20" fill="#1A2E22">亚克力切轮（主线）· 打印一体轮省装配 · 官方套件轮 · CD 碟轮经典但重</text>
      <path fill="#F0F6F1" d="M1052,528 H1768 A12,12 0 0 1 1780,540 V626 A12,12 0 0 1 1768,638 H1052 A12,12 0 0 1 1040,626 V540 A12,12 0 0 1 1052,528 Z" />
      <text x="1070" y="568" font-size="23" font-weight="700" fill="#2E7D46">形状</text>
      <text x="1070" y="604" font-size="20" fill="#1A2E22">混合形（主线）· 纯水滴（气罐可中置时）· 纯楔形最稳 · 雪茄形侧风敏感</text>
      <path fill="#FBF4EE" d="M1052,652 H1768 A12,12 0 0 1 1780,664 V750 A12,12 0 0 1 1768,762 H1052 A12,12 0 0 1 1040,750 V664 A12,12 0 0 1 1052,652 Z" />
      <text x="1070" y="692" font-size="22" font-weight="700" fill="#C77D2E">测速方法</text>
      <text x="1070" y="728" font-size="20" fill="#1A2E22">秒表三跑取中位（主线）· 慢动作视频数帧最准 · 光电门（学校有就用）</text>
    </g>
  </g>
  <path fill="#1A2E22" d="M116,850 H1804 A16,16 0 0 1 1820,866 V964 A16,16 0 0 1 1804,980 H116 A16,16 0 0 1 100,964 V866 A16,16 0 0 1 116,850 Z" />
  <text x="140" y="905" font-family="PingFang SC" font-size="28" font-weight="700" fill="#F7F5F0">为什么这两条是暗线</text>
  <text x="140" y="950" font-family="PingFang SC" font-size="22" fill="#B9C9BF">rubric 顶档要求 "generates data" + "multiple feasible ideas"——时序对=数据真实，选项多=思维广度；被否掉的选项写进表里同样是得分点。</text>
  <text x="1820" y="1040" font-family="PingFang SC" font-size="18" fill="#8AA093" text-anchor="end">06 / 07</text>
</svg>