<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">精读① 甘草：为什么叫「国老」？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">草部卷十二 · 草之一 —— 一味不治病却被尊为国老的神仙和事佬</text>

  <!-- 原文块 -->
  <rect x="60" y="112" width="740" height="196" rx="10" fill="#F5EDD8" stroke="#8A6D3B"/>
  <rect x="60" y="112" width="4" height="196" fill="#A63D2F"/>
  <text x="92" y="142" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">【气味】甘，平，无毒。</text>
  <text x="92" y="170" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">【主治】五脏六腑寒热邪气。坚筋骨，长肌肉，倍气力，金疮尰，</text>
  <text x="92" y="196" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">　　　　解毒，久服轻身延年，温中下气，烦满短气……解百药毒，</text>
  <text x="92" y="222" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">　　　　为九土之精。</text>
  <text x="92" y="252" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">【发明】甘草外赤内黄……甘味主中，有升降浮沉，可上可下，可外可内，</text>
  <text x="92" y="278" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">　　　　有和有缓，有补有泄，居中之道尽矣。</text>
  <text x="92" y="300" font-size="11.5" fill="#8A6D3B">—— 识典古籍《本草纲目》卷十二（A 级数字化原文）</text>

  <!-- 白话拆解 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="820" y="112" width="400" height="196" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="846" y="142" font-size="14" font-weight="700" fill="#2E5C3F">逐句白话</text>
    <text x="846" y="170" font-size="12.5" fill="#2B2620">·「甘平无毒」：味道甜、性子平和、安全</text>
    <text x="846" y="196" font-size="12.5" fill="#2B2620">·「解百药毒」：能解其他药的毒性</text>
    <text x="846" y="222" font-size="12.5" fill="#2B2620">·「九土之精」：大地精华的结晶</text>
    <text x="846" y="248" font-size="12.5" fill="#2B2620">·「居中之道尽矣」：把「中和」发挥到极致</text>
    <text x="846" y="282" font-size="12.5" fill="#A63D2F" font-weight="600">一句话：啥都能搭、谁都不得罪、</text>
    <text x="846" y="302" font-size="12.5" fill="#A63D2F" font-weight="600">还能给全队兜底解毒</text>
  </g>

  <!-- 国老故事 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="328" width="572" height="240" rx="12" fill="#2E5C3F"/>
    <text x="88" y="362" font-size="16" font-weight="700" fill="#FFFFFF">「国老」是什么官？</text>
    <text x="88" y="394" font-size="13.5" fill="#D8E5DB">国老 = 帝王的老师、退休的元老。</text>
    <text x="88" y="422" font-size="13.5" fill="#D8E5DB">不打仗、不管一部，但两朝天子有事都问他的意见。</text>
    <text x="88" y="456" font-size="13.5" fill="#D8E5DB">甘草在药方里就是这个角色：</text>
    <text x="88" y="484" font-size="13.5" fill="#F5EDD8">· 麻黄太猛？加甘草，缓一缓</text>
    <text x="88" y="512" font-size="13.5" fill="#F5EDD8">· 附子有毒？加甘草，压一压</text>
    <text x="88" y="540" font-size="13.5" fill="#F5EDD8">· 两药打架？加甘草，劝个架</text>
    <text x="88" y="572" font-size="13" fill="#D8E5DB">所以中医方剂里十有八九都有它——不是主角，缺它不行。</text>

    <rect x="648" y="328" width="572" height="240" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="676" y="362" font-size="15.5" font-weight="700" fill="#2E5C3F">现代对照（诚实版）</text>
    <rect x="676" y="378" width="516" height="60" rx="8" fill="#EAF2EC"/>
    <text x="684" y="402" font-size="12.5" fill="#2E5C3F">✔ 对的部分：甘草酸/甘草苷确有抗炎、保肝、</text>
    <text x="684" y="422" font-size="12.5" fill="#2E5C3F">　 解毒（药物代谢酶诱导）作用——「调和」有药理基础</text>
    <rect x="676" y="448" width="516" height="60" rx="8" fill="#F5DED8"/>
    <text x="684" y="472" font-size="12.5" fill="#A63D2F">✘ 要打折扣的部分：「久服轻身延年」不成立——</text>
    <text x="684" y="492" font-size="12.5" fill="#A63D2F">　 长期大量服致假性醛固酮增多症（水肿/高血压/低血钾）</text>
    <text x="676" y="536" font-size="12.5" fill="#6E655A">读古书的姿势：把「气味主治」当线索，</text>
    <text x="676" y="556" font-size="12.5" fill="#6E655A">把「久服成仙」当时代的噪音——李时珍自己也是这么干的</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">原文：识典古籍校点本（A）· 药理对照：现代药理学公开综述（B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">05 / 16</text>
</svg>
