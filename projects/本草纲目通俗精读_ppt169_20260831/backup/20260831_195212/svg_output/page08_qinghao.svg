<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">精读④ 青蒿：六个字，与一枚诺贝尔奖</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">草部卷十五 —— 一条跑了 1600 年的科学接力</text>

  <!-- 原文 -->
  <rect x="60" y="112" width="1160" height="100" rx="10" fill="#F5EDD8" stroke="#8A6D3B"/>
  <rect x="60" y="112" width="4" height="100" fill="#A63D2F"/>
  <text x="92" y="146" font-family="'PingFang SC', serif" font-size="15" fill="#2B2620">【气味】苦，寒，无毒。【主治】疥瘙痂痒，恶疮，杀虱，治留热在骨节间，明目……</text>
  <text x="92" y="176" font-family="'PingFang SC', serif" font-size="15" fill="#2B2620">【附方】生捣汁服，<tspan font-weight="700" fill="#A63D2F">治疟疾寒热</tspan>。</text>
  <text x="92" y="200" font-size="11.5" fill="#8A6D3B">—— 识典古籍《本草纲目》卷十五（A 级数字化原文）</text>

  <!-- 接力时间线 -->
  <g font-family="'PingFang SC', sans-serif">
    <line x1="80" y1="272" x2="1220" y2="272" stroke="#2E5C3F" stroke-width="3"/>
    <circle cx="160" cy="272" r="10" fill="#8A6D3B"/>
    <text x="160" y="242" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8A6D3B">东晋 · 340年前后</text>
    <rect x="60" y="292" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="180" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#8A6D3B">葛洪《肘后备急方》</text>
    <text x="180" y="346" text-anchor="middle" font-size="12" fill="#6E655A">「青蒿一握，以水二升渍，</text>
    <text x="180" y="366" text-anchor="middle" font-size="12" fill="#6E655A">绞取汁，尽服之」</text>
    <text x="180" y="396" text-anchor="middle" font-size="11.5" fill="#A63D2F">民间验方首次成文</text>

    <circle cx="460" cy="272" r="10" fill="#2E5C3F"/>
    <text x="460" y="242" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E5C3F">明 · 1578年</text>
    <rect x="350" y="292" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="470" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#2E5C3F">李时珍收录整理</text>
    <text x="470" y="346" text-anchor="middle" font-size="12" fill="#6E655A">纳入《本草纲目》青蒿条：</text>
    <text x="470" y="366" text-anchor="middle" font-size="12" fill="#6E655A">「生捣汁服，治疟疾寒热」</text>
    <text x="470" y="396" text-anchor="middle" font-size="11.5" fill="#A63D2F">验方进入权威药典</text>

    <circle cx="760" cy="272" r="10" fill="#A63D2F"/>
    <text x="760" y="242" text-anchor="middle" font-size="13.5" font-weight="700" fill="#A63D2F">1969-1972</text>
    <rect x="640" y="292" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="760" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#A63D2F">屠呦呦团队「523任务」</text>
    <text x="760" y="346" text-anchor="middle" font-size="12" fill="#6E655A">高温提取全失败→重读古籍，</text>
    <text x="760" y="366" text-anchor="middle" font-size="12" fill="#6E655A">「绞汁」二字点醒：低温！</text>
    <text x="760" y="396" text-anchor="middle" font-size="11.5" fill="#A63D2F">乙醚低温萃取 → 青蒿素</text>

    <circle cx="1060" cy="272" r="10" fill="#2E5C3F"/>
    <text x="1060" y="242" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E5C3F">2015</text>
    <rect x="950" y="292" width="240" height="130" rx="8" fill="#2E5C3F"/>
    <text x="1070" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">诺贝尔生理学或医学奖</text>
    <text x="1070" y="346" text-anchor="middle" font-size="12" fill="#D8E5DB">青蒿素累计拯救数百万</text>
    <text x="1070" y="366" text-anchor="middle" font-size="12" fill="#D8E5DB">疟疾患者生命</text>
    <text x="1070" y="396" text-anchor="middle" font-size="11.5" fill="#F5EDD8">全球抗疟里程碑</text>
  </g>

  <!-- 底部洞察 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="448" width="572" height="164" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="88" y="482" font-size="15.5" font-weight="700" fill="#2E5C3F">这段接力最了不起的一点</text>
    <text x="88" y="514" font-size="13.5" fill="#2B2620">屠呦呦的突破不在实验室，而在<tspan font-weight="700" fill="#A63D2F">重新读书</tspan>——</text>
    <text x="88" y="540" font-size="13.5" fill="#2B2620">古文「绞取汁」三个字藏着的操作参数（不可加热），</text>
    <text x="88" y="566" font-size="13.5" fill="#2B2620">被高温提取的反复失败逼着重新发现。</text>
    <text x="88" y="596" font-size="12.5" fill="#6E655A">古籍不是答案本身，是藏满线索的数据库。</text>

    <rect x="648" y="448" width="572" height="164" rx="12" fill="#2E5C3F"/>
    <text x="676" y="482" font-size="15.5" font-weight="700" fill="#FFFFFF">「低温」为什么是关键（通俗版）</text>
    <text x="676" y="514" font-size="13.5" fill="#D8E5DB">青蒿素分子怕热，煮沸即分解——</text>
    <text x="676" y="540" font-size="13.5" fill="#D8E5DB">葛洪没学过化学，但「冷水浸泡+绞汁」</text>
    <text x="676" y="566" font-size="13.5" fill="#D8E5DB">恰好是全套低温工艺。</text>
    <text x="676" y="596" font-size="13.5" fill="#F5EDD8" font-weight="600">1600 年的民间试错，等来了现代科学的解码</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">原文：识典古籍（A）· 青蒿素史实：诺贝尔奖官方资料/公开报道（A）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">08 / 16</text>
</svg>
