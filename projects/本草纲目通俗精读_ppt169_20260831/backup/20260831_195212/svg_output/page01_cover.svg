<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <!-- 右侧药草装饰 -->
  <g stroke="#2E5C3F" fill="none" stroke-width="2.5">
    <path opacity="0.35" d="M1020,720 C1030,560 1000,480 1060,380 C1100,310 1080,240 1105,180"/>
    <path opacity="0.35" d="M1060,380 C1100,360 1130,380 1140,420"/>
    <path opacity="0.35" d="M1060,380 C1020,360 995,380 985,420"/>
    <path opacity="0.35" d="M1080,270 C1120,255 1150,275 1155,315"/>
    <path opacity="0.35" d="M1080,270 C1040,255 1010,275 1005,315"/>
  </g>
  <circle cx="1105" cy="160" r="26" fill="#A63D2F" opacity="0.75"/>
  <circle cx="1075" cy="130" r="14" fill="#8A6D3B" opacity="0.6"/>

  <text x="60" y="130" font-family="'PingFang SC', sans-serif" font-size="14" fill="#A63D2F" letter-spacing="6">COMPENDIUM OF MATERIA MEDICA · 1578</text>
  <text x="60" y="215" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="58" font-weight="800" fill="#2E5C3F">精读《本草纲目》</text>
  <text x="60" y="278" font-family="'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#2B2620">古文原文 × 通俗解读</text>
  <text x="60" y="318" font-family="'PingFang SC', sans-serif" font-size="15" fill="#6E655A">把 400 年前的 190 万字，读给今天的你听</text>

  <!-- 线装书意象 -->
  <g>
    <rect x="60" y="360" width="180" height="240" rx="6" fill="#F5EDD8" stroke="#8A6D3B" stroke-width="1.5"/>
    <line x1="76" y1="360" x2="76" y2="600" stroke="#A63D2F" stroke-width="2"/>
    <text x="150" y="450" text-anchor="middle" font-family="'PingFang SC', serif" font-size="26" font-weight="700" fill="#2E5C3F">本草</text>
    <text x="150" y="486" text-anchor="middle" font-family="'PingFang SC', serif" font-size="26" font-weight="700" fill="#2E5C3F">纲目</text>
    <text x="150" y="530" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11" fill="#8A6D3B">明 · 李时珍 撰</text>
    <circle cx="150" cy="560" r="4" fill="#A63D2F"/>
    <circle cx="150" cy="576" r="4" fill="#A63D2F"/>
    <circle cx="150" cy="592" r="4" fill="#A63D2F"/>
  </g>

  <!-- 数字卡 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="290" y="360" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="390" y="402" text-anchor="middle" font-size="26" font-weight="700" fill="#2E5C3F" font-family="'Helvetica Neue', sans-serif">1892</text>
    <text x="390" y="430" text-anchor="middle" font-size="12.5" fill="#6E655A">种药物</text>
    <rect x="510" y="360" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="610" y="402" text-anchor="middle" font-size="26" font-weight="700" fill="#2E5C3F" font-family="'Helvetica Neue', sans-serif">11096</text>
    <text x="610" y="430" text-anchor="middle" font-size="12.5" fill="#6E655A">首附方</text>
    <rect x="290" y="490" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="390" y="532" text-anchor="middle" font-size="26" font-weight="700" fill="#2E5C3F" font-family="'Helvetica Neue', sans-serif">27年</text>
    <text x="390" y="560" text-anchor="middle" font-size="12.5" fill="#6E655A">三易其稿</text>
    <rect x="510" y="490" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="610" y="532" text-anchor="middle" font-size="26" font-weight="700" fill="#A63D2F" font-family="'Helvetica Neue', sans-serif">6味</text>
    <text x="610" y="560" text-anchor="middle" font-size="12.5" fill="#6E655A">本书精读原文</text>
  </g>

  <text x="60" y="672" font-family="'PingFang SC', sans-serif" font-size="13" fill="#2B2620">读法：每味药 = 原文摘录 → 逐句白话 → 一个故事 → 现代对照</text>
  <text x="60" y="700" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9184">小爱精读 · 原文引自识典古籍数字化校点本 · 2026-08-31</text>
</svg>
