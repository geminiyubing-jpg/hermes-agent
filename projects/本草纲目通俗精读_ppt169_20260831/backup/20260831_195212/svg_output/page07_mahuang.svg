<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">精读③ 麻黄：一段自称「千古未发之秘旨」的推理</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">草部卷十五 —— 看 16 世纪的医生如何做「生理建模」</text>

  <!-- 原文：发明名段 -->
  <rect x="60" y="112" width="1160" height="200" rx="10" fill="#F5EDD8" stroke="#8A6D3B"/>
  <rect x="60" y="112" width="4" height="200" fill="#A63D2F"/>
  <text x="92" y="142" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">【气味】苦温，无毒。主治中风伤寒，头痛温疟，发表出汗，去邪热气，止咳逆上气……不可多服，令人虚。</text>
  <text x="92" y="174" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">【发明】麻黄乃肺经专药，故治肺病多用之。张仲景治伤寒无汗用麻黄，有汗用桂枝……</text>
  <text x="92" y="200" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">津液为汗，汗即血也，在营则为血，在卫则为汗。夫寒伤营……故无汗发热而憎寒。</text>
  <text x="92" y="226" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">夫风伤卫……故有汗发热而恶风……是则麻黄汤虽太阳发汗重剂，实为发散肺经火郁之药也。</text>
  <text x="92" y="252" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">此千古未发之秘旨，愚因表而出之。</text>
  <text x="92" y="296" font-size="11.5" fill="#8A6D3B">—— 识典古籍《本草纲目》卷十五（A 级数字化原文）</text>

  <!-- 白话+模型图 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="330" width="572" height="280" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="88" y="362" font-size="15.5" font-weight="700" fill="#2E5C3F">这段话在说什么（白话）</text>
    <text x="88" y="392" font-size="13" fill="#2B2620">李时珍提出了一个统一模型：</text>
    <rect x="88" y="406" width="240" height="46" rx="8" fill="#4A7BA6" opacity="0.15"/>
    <text x="208" y="434" text-anchor="middle" font-size="13" fill="#33587A" font-weight="600">血（在血管里 = 营）</text>
    <text x="345" y="434" font-size="16" fill="#8A6D3B">⇌</text>
    <rect x="370" y="406" width="240" height="46" rx="8" fill="#A63D2F" opacity="0.15"/>
    <text x="490" y="434" text-anchor="middle" font-size="13" fill="#A63D2F" font-weight="600">汗（渗出体表 = 卫）</text>
    <text x="88" y="484" font-size="13" fill="#2B2620">同一个东西的两种形态！所以：</text>
    <text x="88" y="512" font-size="13" fill="#2B2620">· 受寒 → 血管收缩（营涩）→ 汗出不来 → 无汗怕冷 → 用<tspan font-weight="700" fill="#2E5C3F">麻黄</tspan>（开闸发汗）</text>
    <text x="88" y="540" font-size="13" fill="#2B2620">· 受风 → 汗腺失守（卫泄）→ 汗止不住 → 有汗怕风 → 用<tspan font-weight="700" fill="#2E5C3F">桂枝</tspan>（加固门户）</text>
    <text x="88" y="572" font-size="12.5" fill="#A63D2F" font-weight="600">同一个「感冒」，分两种工况，选不同开关——然后他宣布：这是千古没人说破的秘密</text>

    <rect x="648" y="330" width="572" height="280" rx="12" fill="#2E5C3F"/>
    <text x="676" y="362" font-size="15.5" font-weight="700" fill="#FFFFFF">医案彩蛋：拉肚子为什么用发汗药？</text>
    <text x="676" y="392" font-size="13" fill="#D8E5DB">原文：一锦衣卫官员夏天喝酒通宵，腹泻数日不止，</text>
    <text x="676" y="416" font-size="13" fill="#D8E5DB">止泻药全无效。李时珍诊脉后判断：这是「风邪入里」，</text>
    <text x="676" y="440" font-size="13" fill="#D8E5DB">用发散风寒的小续命汤——一剂痊愈。</text>
    <text x="676" y="474" font-size="13.5" fill="#F5EDD8" font-weight="600">这就是「异病同治」：</text>
    <text x="676" y="500" font-size="13" fill="#D8E5DB">腹泻和感冒表面无关，但病机同是「风邪」——</text>
    <text x="676" y="524" font-size="13" fill="#D8E5DB">治的是模型里的因，不是症状的果。</text>
    <text x="676" y="556" font-size="12.5" fill="#F5DED8">现代对照：麻黄碱平喘/发汗确凿（西医沿用多年），</text>
    <text x="676" y="578" font-size="12.5" fill="#F5DED8">但也是制毒前体——「不可多服，令人虚」古人早有警告</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">原文：识典古籍校点本（A）· 「营卫」模型解说：中医基础理论通识（B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">07 / 16</text>
</svg>
