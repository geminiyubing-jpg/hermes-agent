<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">精读② 人参：一味药的九个名字</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">草部卷十二 —— 释名栏里的微型文化史</text>

  <!-- 原文 -->
  <rect x="60" y="112" width="1160" height="88" rx="10" fill="#F5EDD8" stroke="#8A6D3B"/>
  <rect x="60" y="112" width="4" height="88" fill="#A63D2F"/>
  <text x="92" y="142" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">【释名】亦名黄参、血参、人衔、鬼盖、神草、土精、地精、海腴、皱面还丹。</text>
  <text x="92" y="170" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">【气味】（根）甘、微寒、无毒。</text>
  <text x="92" y="192" font-size="11.5" fill="#8A6D3B">—— 汉典古籍校点本《本草纲目·草部上》（A 级数字化原文）</text>

  <!-- 九名字解码 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="220" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="90" y="250" font-size="15" font-weight="700" fill="#2E5C3F">黄参 · 血参</text>
    <text x="90" y="278" font-size="12.5" fill="#6E655A">黄：根的颜色</text>
    <text x="90" y="300" font-size="12.5" fill="#6E655A">血：传说用它后气血充盈</text>
    <text x="90" y="326" font-size="12" fill="#A63D2F" font-weight="600">→ 颜色与功效命名</text>

    <rect x="356" y="220" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="386" y="250" font-size="15" font-weight="700" fill="#2E5C3F">人衔 · 鬼盖</text>
    <text x="386" y="278" font-size="12.5" fill="#6E655A">根形似人，传说成精会跑</text>
    <text x="386" y="300" font-size="12.5" fill="#6E655A">要用人「衔」住它才抓得到</text>
    <text x="386" y="326" font-size="12" fill="#A63D2F" font-weight="600">→ 采药人的民间传说</text>

    <rect x="652" y="220" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="682" y="250" font-size="15" font-weight="700" fill="#2E5C3F">神草 · 土精 · 地精</text>
    <text x="682" y="278" font-size="12.5" fill="#6E655A">地气凝聚的精灵</text>
    <text x="682" y="300" font-size="12.5" fill="#6E655A">长在深山、百年难得一株</text>
    <text x="682" y="326" font-size="12" fill="#A63D2F" font-weight="600">→ 万物有灵的自然观</text>

    <rect x="948" y="220" width="272" height="120" rx="10" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="976" y="250" font-size="15" font-weight="700" fill="#2E5C3F">海腴 · 皱面还丹</text>
    <text x="976" y="278" font-size="12.5" fill="#6E655A">海腴：丰腴如海味滋补</text>
    <text x="976" y="300" font-size="12.5" fill="#6E655A">皱面还丹：道家「长生丹」想象</text>
    <text x="976" y="326" font-size="12" fill="#A63D2F" font-weight="600">→ 道教服食文化的投影</text>
  </g>

  <!-- 四君子汤 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="360" width="740" height="208" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <rect x="60" y="360" width="4" height="208" fill="#8A6D3B"/>
    <text x="92" y="392" font-size="15" font-weight="700" fill="#2E5C3F">附方精读：四君子汤 —— 一个方子的「排兵布阵」</text>
    <text x="92" y="420" font-family="'PingFang SC', serif" font-size="13.5" fill="#2B2620">「脾胃气虚，不思饮食。用人参一钱、白术二钱、茯苓一钱、炙甘草五分，</text>
    <text x="92" y="444" font-family="'PingFang SC', serif" font-size="13.5" fill="#2B2620">姜三片，枣一枚……饭前温服。此方名四君子汤。」</text>
    <text x="92" y="478" font-size="13" fill="#2B2620">打仗的比喻（君臣佐使）：</text>
    <text x="92" y="504" font-size="13" fill="#2B2620">· <tspan font-weight="700" fill="#A63D2F">人参 = 君</tspan>（主帅）：补气主力</text>
    <text x="92" y="528" font-size="13" fill="#2B2620">· <tspan font-weight="700" fill="#A63D2F">白术 = 臣</tspan>（副将）：健脾辅佐</text>
    <text x="322" y="504" font-size="13" fill="#2B2620">· <tspan font-weight="700" fill="#A63D2F">茯苓 = 佐</tspan>（参谋）：祛湿助运</text>
    <text x="322" y="528" font-size="13" fill="#2B2620">· <tspan font-weight="700" fill="#A63D2F">甘草 = 使</tspan>（联络官）：调和全方</text>
    <text x="92" y="556" font-size="12.5" fill="#6E655A">「四君子」：四味药配合如四位谦谦君子，不猛不峻、平和中正</text>

    <rect x="820" y="360" width="400" height="208" rx="12" fill="#2E5C3F"/>
    <text x="848" y="394" font-size="15" font-weight="700" fill="#FFFFFF">现代对照（诚实版）</text>
    <text x="848" y="426" font-size="13" fill="#D8E5DB">✔ 人参皂苷：抗疲劳、免疫调节有循证支持；</text>
    <text x="848" y="450" font-size="13" fill="#D8E5DB">　 四君子汤改善消化功能有临床研究</text>
    <text x="848" y="482" font-size="13" fill="#F5DED8">✘「久服轻身延年」：无证据；</text>
    <text x="848" y="506" font-size="13" fill="#F5DED8">　 误区：人参不是人人可补，高血压/热证慎用</text>
    <text x="848" y="542" font-size="12.5" fill="#F5EDD8" font-weight="600">名字越神圣，越要冷静读——</text>
    <text x="848" y="562" font-size="12.5" fill="#F5EDD8" font-weight="600">这是从「神草」还原成「药材」的过程</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">原文：汉典古籍校点本（A）· 四君子汤方解：中医方剂学通识（B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">06 / 16</text>
</svg>
