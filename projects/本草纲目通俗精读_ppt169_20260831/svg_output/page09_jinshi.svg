<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">精读⑤ 金石部：李时珍怒斥「服金成仙」</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">金石部卷八 —— 400 年前的一次漂亮的科学打假</text>

  <!-- 原文 -->
  <rect x="60" y="112" width="1160" height="150" rx="10" fill="#F5EDD8" stroke="#8A6D3B"/>
  <rect x="60" y="112" width="4" height="150" fill="#A63D2F"/>
  <text x="92" y="146" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">【发明】（前人曰）仙经以醯、蜜及猪肪炼至柔软，服之成仙……饵黄金不亚于金液，服之升仙。</text>
  <text x="92" y="176" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620">（时珍驳曰）岂知<tspan font-weight="700" fill="#A63D2F">血肉之躯，水谷为赖，可能堪此金石重坠之物，久在肠胃乎？</tspan></text>
  <text x="92" y="206" font-family="'PingFang SC', serif" font-size="14.5" fill="#2B2620"><tspan font-weight="700" fill="#A63D2F">求生而丧生，可谓愚也矣。</tspan></text>
  <text x="92" y="244" font-size="11.5" fill="#8A6D3B">—— 识典古籍《本草纲目》卷八·金屑（A 级数字化原文）</text>

  <!-- 对抗格局 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="286" width="572" height="250" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="88" y="320" font-size="15.5" font-weight="700" fill="#2E5C3F">他在跟谁吵架？</text>
    <text x="88" y="352" font-size="13.5" fill="#2B2620">对象：从秦皇汉武传下来的「服食长生」传统——</text>
    <text x="88" y="378" font-size="13.5" fill="#2B2620">炼丹术士宣称金、银、水银、丹砂炼后服食可成仙。</text>
    <text x="88" y="406" font-size="13.5" fill="#2B2620">到明代，皇帝贵族服丹药中毒死亡的案例史不绝书。</text>
    <text x="88" y="440" font-size="13.5" fill="#2B2620" font-weight="600">李时珍的论证（朴素但致命）：</text>
    <text x="88" y="466" font-size="13.5" fill="#2B2620">1. 人是血肉之躯，靠水谷活着</text>
    <text x="88" y="492" font-size="13.5" fill="#2B2620">2. 金石重坠之物不能消化</text>
    <text x="88" y="518" font-size="13.5" fill="#2B2620">3. 堆在肠胃里只会坏事 → 结论：想吃金长生？蠢！</text>

    <rect x="648" y="286" width="572" height="250" rx="12" fill="#2E5C3F"/>
    <text x="676" y="320" font-size="15.5" font-weight="700" fill="#FFFFFF">这场吵架的历史分量</text>
    <text x="676" y="352" font-size="13.5" fill="#D8E5DB">· 他挑战的不是某个人，是延续 1800 年的</text>
    <text x="676" y="376" font-size="13.5" fill="#D8E5DB">  官方权威传统（多位皇帝亲自背书）</text>
    <text x="676" y="406" font-size="13.5" fill="#D8E5DB">· 用的是常识推理+临床观察，而非引经据典——</text>
    <text x="676" y="430" font-size="13.5" fill="#D8E5DB">  「证据优先于权威」的雏形</text>
    <text x="676" y="460" font-size="13.5" fill="#F5EDD8" font-weight="600">但他并未全盘否定矿物药：</text>
    <text x="676" y="486" font-size="13.5" fill="#D8E5DB">外用（金银煮水漱口、烙法）仍记录——</text>
    <text x="676" y="510" font-size="13.5" fill="#D8E5DB">打的是「服食迷信」，不是「矿物入药」</text>
  </g>

  <!-- 冷峻按语 -->
  <rect x="60" y="556" width="1159" height="56" rx="10" fill="#2B2620"/>
  <text x="90" y="590" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5EDD8">彩蛋按语：书里还记了「亡人以黄金塞九窍，则尸不朽」，李时珍接一句<tspan fill="#F0C98A">「此虽近于理，然亦诲盗矣」</tspan>——听着有道理，但这是教人盗墓啊。冷幽默满分。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">原文：识典古籍校点本（A）· 历史背景：炼丹服食史通识（B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">09 / 16</text>
</svg>
