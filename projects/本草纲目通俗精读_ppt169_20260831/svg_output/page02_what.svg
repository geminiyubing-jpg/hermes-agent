<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">这是一本什么书：一个人编了 27 年的「药宇宙」</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">52 卷 · 1892 种药 · 11096 首方 · 约 190 万字 · 16 部 60 类</text>

  <!-- 时间轴 -->
  <line x1="80" y1="170" x2="1220" y2="170" stroke="#2E5C3F" stroke-width="3"/>
  <g font-family="'PingFang SC', sans-serif">
    <circle cx="140" cy="170" r="9" fill="#2E5C3F"/>
    <text x="140" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E5C3F">1552</text>
    <rect x="70" y="190" width="200" height="108" rx="8" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="170" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#2E5C3F">35 岁，动笔</text>
    <text x="170" y="240" text-anchor="middle" font-size="11.5" fill="#6E655A">太医院任职后返乡</text>
    <text x="170" y="260" text-anchor="middle" font-size="11.5" fill="#6E655A">发现旧本草错误千计</text>
    <text x="170" y="284" text-anchor="middle" font-size="11" fill="#A63D2F">「渔猎群书，搜罗百氏」</text>

    <circle cx="420" cy="170" r="9" fill="#8A6D3B"/>
    <text x="420" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8A6D3B">1552-1578</text>
    <rect x="310" y="190" width="220" height="108" rx="8" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="420" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#8A6D3B">27 年，三易其稿</text>
    <text x="420" y="240" text-anchor="middle" font-size="11.5" fill="#6E655A">读万卷书：引据 800+ 种书</text>
    <text x="420" y="260" text-anchor="middle" font-size="11.5" fill="#6E655A">行万里路：带徒弟野外采药</text>
    <text x="420" y="284" text-anchor="middle" font-size="11" fill="#A63D2F">脚印遍湖广、江西、江苏</text>

    <circle cx="700" cy="170" r="9" fill="#A63D2F"/>
    <text x="700" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#A63D2F">1578</text>
    <rect x="600" y="190" width="200" height="108" rx="8" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="700" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#A63D2F">60 岁，定稿</text>
    <text x="700" y="240" text-anchor="middle" font-size="11.5" fill="#6E655A">万历六年成书</text>
    <text x="700" y="260" text-anchor="middle" font-size="11.5" fill="#6E655A">请王世贞作序（十年后才等到）</text>
    <text x="700" y="284" text-anchor="middle" font-size="11" fill="#6E655A">书商排队等刊刻</text>

    <circle cx="980" cy="170" r="9" fill="#2E5C3F"/>
    <text x="980" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E5C3F">1593-1596</text>
    <rect x="870" y="190" width="220" height="108" rx="8" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="980" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#2E5C3F">金陵本刊行</text>
    <text x="980" y="240" text-anchor="middle" font-size="11.5" fill="#6E655A">去世次年刻成，三年后发行</text>
    <text x="980" y="260" text-anchor="middle" font-size="11.5" fill="#6E655A">「东方药物巨典」</text>
    <text x="980" y="284" text-anchor="middle" font-size="11" fill="#A63D2F">2011 入选世界记忆名录</text>

    <circle cx="1180" cy="170" r="7" fill="#8A6D3B"/>
    <text x="1180" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8A6D3B">今天</text>
  </g>

  <!-- 三个身份 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="330" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="88" y="364" font-size="15.5" font-weight="700" fill="#2E5C3F">身份一 · 药物学百科</text>
    <text x="88" y="394" font-size="13" fill="#2B2620">载药 1892 种（新增 374 种），</text>
    <text x="88" y="418" font-size="13" fill="#2B2620">附方 11096 首，图 1109+ 幅</text>
    <text x="88" y="448" font-size="12.5" fill="#6E655A">规模空前：汉代《神农本草经》365 种→</text>
    <text x="88" y="470" font-size="12.5" fill="#6E655A">唐《新修本草》844 种→宋《证类》1744 种</text>
    <text x="88" y="500" font-size="12.5" fill="#6E655A">→《纲目》1892 种，集大成</text>

    <rect x="453" y="330" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="481" y="364" font-size="15.5" font-weight="700" fill="#2E5C3F">身份二 · 分类学革命</text>
    <text x="481" y="394" font-size="13" fill="#2B2620">按自然属性分 16 部 60 类，</text>
    <text x="481" y="418" font-size="13" fill="#2B2620">亲缘相近的排一起</text>
    <text x="481" y="448" font-size="12.5" fill="#6E655A">例：伞形科当归、川芎、蛇床、藁本同卷</text>
    <text x="481" y="478" font-size="13" font-weight="600" fill="#A63D2F">比林奈的自然分类早约 200 年</text>

    <rect x="846" y="330" width="373" height="200" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="874" y="364" font-size="15.5" font-weight="700" fill="#2E5C3F">身份三 · 博物志</text>
    <text x="874" y="394" font-size="13" fill="#2B2620">训诂、地理、冶金、博物无所不包</text>
    <text x="874" y="424" font-size="12.5" fill="#6E655A">达尔文引用其中金鱼、家鸡变异资料，</text>
    <text x="874" y="446" font-size="12.5" fill="#6E655A">称之为「古代中国百科全书」</text>
    <text x="874" y="476" font-size="12.5" fill="#6E655A">17 世纪起传朝、日，后译成多国文字</text>
    <text x="874" y="502" font-size="12.5" fill="#6E655A">（日、韩、英、法、德、俄……）</text>
  </g>

  <!-- 本页要点 -->
  <rect x="60" y="556" width="1159" height="80" rx="12" fill="#2B2620"/>
  <text x="90" y="588" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F5EDD8">一个人，用 27 年把此前 1500 年的所有药物知识重做了一遍：查错（正误）、补新（新增374种）、分类（16部60类）——</text>
  <text x="90" y="616" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F5EDD8">这不是写书，是做了一次「古代药物数据库的大版本升级」。我们今天精读的每一味药，都是这个数据库里的一条记录。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">数据：金陵本系统研究/香港卫生署展板（A-/B+）· 「三易其稿」据王世贞序</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">02 / 16</text>
</svg>
