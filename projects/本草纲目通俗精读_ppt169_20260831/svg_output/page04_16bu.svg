<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">十六部宇宙：从一滴水，到一个人</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">16 部 60 类的排列顺序，藏着李时珍的世界观：从无机到有机，从低等到高等</text>

  <!-- 16部排列 -->
  <g font-family="'PingFang SC', sans-serif">
    <!-- 第一行：无机界 -->
    <rect x="60" y="118" width="130" height="88" rx="8" fill="#4A7BA6"/>
    <text x="125" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">水部</text>
    <text x="125" y="178" text-anchor="middle" font-size="11" fill="#DCE8F2">雨水/露/井泉水</text>
    <rect x="204" y="118" width="130" height="88" rx="8" fill="#B3541E"/>
    <text x="269" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">火部</text>
    <text x="269" y="178" text-anchor="middle" font-size="11" fill="#F5D9CB">炭火/艾火/灯火</text>
    <rect x="348" y="118" width="130" height="88" rx="8" fill="#8A6D3B"/>
    <text x="413" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">土部</text>
    <text x="413" y="178" text-anchor="middle" font-size="11" fill="#F0E8D8">黄土/东壁土</text>
    <rect x="492" y="118" width="130" height="88" rx="8" fill="#6E655A"/>
    <text x="557" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">金石部</text>
    <text x="557" y="178" text-anchor="middle" font-size="11" fill="#E8E2D8">金/银/铜/铁/汞</text>

    <!-- 第二行：植物界 -->
    <rect x="60" y="222" width="130" height="88" rx="8" fill="#2E5C3F"/>
    <text x="125" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">草部</text>
    <text x="125" y="282" text-anchor="middle" font-size="11" fill="#D8E5DB">最大！分9类</text>
    <rect x="204" y="222" width="130" height="88" rx="8" fill="#2E5C3F"/>
    <text x="269" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">谷部</text>
    <text x="269" y="282" text-anchor="middle" font-size="11" fill="#D8E5DB">稻麦豆/造酿</text>
    <rect x="348" y="222" width="130" height="88" rx="8" fill="#2E5C3F"/>
    <text x="413" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">菜部</text>
    <text x="413" y="282" text-anchor="middle" font-size="11" fill="#D8E5DB">荤菜/瓜菜/芝栭</text>
    <rect x="492" y="222" width="130" height="88" rx="8" fill="#2E5C3F"/>
    <text x="557" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">果部</text>
    <text x="557" y="282" text-anchor="middle" font-size="11" fill="#D8E5DB">五果/夷果/瓜</text>
    <rect x="636" y="222" width="130" height="88" rx="8" fill="#2E5C3F"/>
    <text x="701" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">木部</text>
    <text x="701" y="282" text-anchor="middle" font-size="11" fill="#D8E5DB">香木/乔木/灌木</text>
    <rect x="780" y="222" width="130" height="88" rx="8" fill="#8A6D3B"/>
    <text x="845" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">服器部</text>
    <text x="845" y="282" text-anchor="middle" font-size="11" fill="#F0E8D8">纸/布/器物入药</text>

    <!-- 第三行：动物界 -->
    <rect x="60" y="326" width="130" height="88" rx="8" fill="#A63D2F"/>
    <text x="125" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">虫部</text>
    <text x="125" y="386" text-anchor="middle" font-size="11" fill="#F5DED8">蜜蜂/虫/蚁</text>
    <rect x="204" y="326" width="130" height="88" rx="8" fill="#A63D2F"/>
    <text x="269" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">鳞部</text>
    <text x="269" y="386" text-anchor="middle" font-size="11" fill="#F5DED8">鱼/蛇/龙类</text>
    <rect x="348" y="326" width="130" height="88" rx="8" fill="#A63D2F"/>
    <text x="413" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">介部</text>
    <text x="413" y="386" text-anchor="middle" font-size="11" fill="#F5DED8">龟/鳖/蟹/蚌</text>
    <rect x="492" y="326" width="130" height="88" rx="8" fill="#A63D2F"/>
    <text x="557" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">禽部</text>
    <text x="557" y="386" text-anchor="middle" font-size="11" fill="#F5DED8">鸡/鸭/鹰/孔雀</text>
    <rect x="636" y="326" width="130" height="88" rx="8" fill="#A63D2F"/>
    <text x="701" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">兽部</text>
    <text x="701" y="386" text-anchor="middle" font-size="11" fill="#F5DED8">豕/牛/马/鹿</text>
    <rect x="780" y="326" width="130" height="88" rx="8" fill="#5C3A2E"/>
    <text x="845" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">人部</text>
    <text x="845" y="386" text-anchor="middle" font-size="11" fill="#EBDDD5">爪甲/头发…</text>

    <!-- 右侧解读 -->
    <rect x="940" y="118" width="280" height="296" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="966" y="150" font-size="15" font-weight="700" fill="#2E5C3F">顺序的秘密</text>
    <text x="966" y="180" font-size="12.5" fill="#2B2620">水→火→土→金石：无机</text>
    <text x="966" y="204" font-size="12.5" fill="#2B2620">草→谷→菜→果→木：植物</text>
    <text x="966" y="228" font-size="12.5" fill="#2B2620">  （从草本到木本）</text>
    <text x="966" y="252" font-size="12.5" fill="#2B2620">虫→鳞→介→禽→兽：动物</text>
    <text x="966" y="276" font-size="12.5" fill="#2B2620">  （从低等到高等）</text>
    <text x="966" y="300" font-size="12.5" fill="#2B2620">人部殿后：万物之灵</text>
    <rect x="966" y="316" width="228" height="76" rx="8" fill="#F5EDD8"/>
    <text x="1080" y="346" text-anchor="middle" font-size="12.5" fill="#A63D2F" font-weight="600">这就是朴素的演化树</text>
    <text x="1080" y="370" text-anchor="middle" font-size="12.5" fill="#A63D2F" font-weight="600">比林奈分类早约200年</text>
  </g>

  <!-- 底部 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="440" width="572" height="196" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="88" y="474" font-size="15.5" font-weight="700" fill="#2E5C3F">冷知识：什么都能入药</text>
    <text x="88" y="506" font-size="13" fill="#2B2620">· 服器部：用过的纸、蓑衣、尿壶都入药（当然多数无效）</text>
    <text x="88" y="534" font-size="13" fill="#2B2620">· 水部：立春雨水、梅雨水、半天河（树洞里的水）各有主治</text>
    <text x="88" y="562" font-size="13" fill="#2B2620">· 人部：乱发、爪甲……李时珍收录但多加按语存疑</text>
    <text x="88" y="594" font-size="12.5" fill="#6E655A">读法提示：这部分恰恰是「批判阅读」的最佳素材——</text>
    <text x="88" y="616" font-size="12.5" fill="#6E655A">伟大的书也有时代的荒诞，分辨它们正是读它的乐趣</text>

    <rect x="648" y="440" width="572" height="196" rx="12" fill="#2E5C3F"/>
    <text x="676" y="474" font-size="15.5" font-weight="700" fill="#FFFFFF">分类背后的思想革命</text>
    <text x="676" y="506" font-size="13.5" fill="#D8E5DB">· 前代本草按功效分（上/中/下三品）——</text>
    <text x="676" y="530" font-size="13.5" fill="#D8E5DB">  「这药有用没用」的贵族式眼光</text>
    <text x="676" y="558" font-size="13.5" fill="#D8E5DB">· 《纲目》按自然属性分——「这东西是什么」</text>
    <text x="676" y="582" font-size="13.5" fill="#D8E5DB">  的博物学家眼光</text>
    <text x="676" y="616" font-size="13.5" fill="#F5EDD8" font-weight="600">从「用途分类」到「自然分类」：科学史上的范式转变</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">卷次划分：香港卫生署展板（A-/B+）· 16部顺序据金陵本目录</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">04 / 16</text>
</svg>
