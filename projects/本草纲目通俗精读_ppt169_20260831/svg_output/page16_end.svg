<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <!-- 背景装饰 -->
  <g stroke="#2E5C3F" fill="none" stroke-width="2">
    <path opacity="0.15" d="M1000,720 C1010,540 980,440 1040,330"/>
    <path opacity="0.15" d="M1100,720 C1110,560 1080,460 1140,350"/>
    <path opacity="0.15" d="M1200,720 C1210,580 1180,480 1240,380"/>
  </g>

  <text x="60" y="120" font-family="'PingFang SC', sans-serif" font-size="15" fill="#A63D2F" letter-spacing="5">EPILOGUE</text>
  <text x="60" y="200" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="36" font-weight="800" fill="#2E5C3F">读古书，如晤古人</text>

  <rect x="60" y="240" width="4" height="130" fill="#A63D2F"/>
  <text x="90" y="278" font-family="'PingFang SC', serif" font-size="17" fill="#2B2620">你此刻读到的每一个「时珍曰」，都是一个人在油灯下</text>
  <text x="90" y="310" font-family="'PingFang SC', serif" font-size="17" fill="#2B2620">翻了几百本书、走了几万里路之后，认真写下的判断。</text>
  <text x="90" y="342" font-family="'PingFang SC', serif" font-size="17" fill="#2B2620">他有对的地方，也有错的地方——和我们每个人一样。</text>

  <!-- 三句总结 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="400" width="373" height="180" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="88" y="438" font-size="15" font-weight="700" fill="#2E5C3F">记住一句话就够了</text>
    <text x="88" y="476" font-size="14" fill="#2B2620">「上web不必尽信书，</text>
    <text x="88" y="502" font-size="14" fill="#2B2620">尽信书不如无书。」</text>
    <text x="88" y="536" font-size="12.5" fill="#6E655A">（孟子——李时珍用一生</text>
    <text x="88" y="558" font-size="12.5" fill="#6E655A">实践了这句话）</text>

    <rect x="453" y="400" width="373" height="180" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <text x="481" y="438" font-size="15" font-weight="700" fill="#2E5C3F">本次精读走过的路</text>
    <text x="481" y="472" font-size="13" fill="#2B2620">一本书的结构（16部/8字段）</text>
    <text x="481" y="498" font-size="13" fill="#2B2620">六味药的原文与白话</text>
    <text x="481" y="524" font-size="13" fill="#2B2620">一位作者的读书法与批判</text>
    <text x="481" y="556" font-size="13" fill="#2B2620">一条 1600 年的知识接力</text>

    <rect x="846" y="400" width="373" height="180" rx="12" fill="#2E5C3F"/>
    <text x="874" y="438" font-size="15" font-weight="700" fill="#F0C98A">下一步（可选）</text>
    <text x="874" y="472" font-size="13" fill="#D8E5DB">① 走 30 分钟试读路线（P15）</text>
    <text x="874" y="500" font-size="13" fill="#D8E5DB">② 精读第二辑：黄花蒿/当归/</text>
    <text x="874" y="524" font-size="13" fill="#D8E5DB">　 黄连/大黄/茯苓（可续做）</text>
    <text x="874" y="556" font-size="13" fill="#D8E5DB">③ 把某个「主治」拿去查现代文献</text>
  </g>

  <text x="60" y="640" font-family="'PingFang SC', sans-serif" font-size="13" fill="#2B2620">—— 完 ——</text>
  <text x="60" y="668" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">小爱精读 · 原文 A 级（识典古籍/汉典古籍校点本）· 白话解读为小爱理解，欢迎指正</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">16 / 16</text>
</svg>
