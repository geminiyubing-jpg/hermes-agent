<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">它如何改变世界：一本书的全球旅行</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">从金陵书坊到达尔文的参考文献，再到联合国书库</text>

  <!-- 传播路线 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="280" height="270" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <rect x="60" y="112" width="280" height="44" rx="12" fill="#2E5C3F"/>
    <text x="200" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">东亚先行（17世纪）</text>
    <text x="88" y="184" font-size="13" fill="#2B2620">· 1607年传入日本与朝鲜</text>
    <text x="88" y="210" font-size="13" fill="#2B2620">· 日本江户时代翻刻、</text>
    <text x="88" y="234" font-size="13" fill="#2B2620">  训注、研究成显学</text>
    <text x="88" y="262" font-size="12.5" fill="#6E655A">「物产、医药、博物之</text>
    <text x="88" y="284" font-size="12.5" fill="#6E655A">  总揽」——日本学界评价</text>
    <text x="88" y="320" font-size="12.5" fill="#A63D2F" font-weight="600">深刻影响日本本草学</text>
    <text x="88" y="348" font-size="12.5" fill="#6E655A">（贝原益轩《大和本草》等</text>
    <text x="88" y="370" font-size="12.5" fill="#6E655A">均承其体例）</text>

    <rect x="356" y="112" width="280" height="270" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <rect x="356" y="112" width="280" height="44" rx="12" fill="#8A6D3B"/>
    <text x="496" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">欧洲知音（18-19世纪）</text>
    <text x="384" y="184" font-size="13" fill="#2B2620">· 1735年杜赫德《中华帝国全志》</text>
    <text x="384" y="208" font-size="13" fill="#2B2620">  法文节译本收录</text>
    <text x="384" y="236" font-size="13" fill="#2B2622">· 达尔文研读其中金鱼家养</text>
    <text x="384" y="260" font-size="13" fill="#2B2622">  变异、家鸡品种等资料，</text>
    <text x="384" y="284" font-size="13" fill="#2B2620">  论及动物变异时引用，</text>
    <text x="384" y="308" font-size="13" fill="#2B2620">  称之为「古代中国百科全书」</text>
    <text x="384" y="344" font-size="12.5" fill="#A63D2F" font-weight="600">写进《动物和植物在家养下的变异》</text>
    <text x="384" y="372" font-size="12.5" fill="#6E655A">（进化论参考文献之一）</text>

    <rect x="652" y="112" width="280" height="270" rx="12" fill="#FFFFFF" stroke="#E3D9C6"/>
    <rect x="652" y="112" width="280" height="44" rx="12" fill="#A63D2F"/>
    <text x="792" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">科学回响（20-21世纪）</text>
    <text x="680" y="184" font-size="13" fill="#2B2620">· 李约瑟《中国科学技术史》</text>
    <text x="680" y="208" font-size="13" fill="#2B2620">  高度评价其分类学</text>
    <text id="nosuch" y="232" font-size="13" fill="#2B2620">· 2011年入选联合国教科文组织</text>
    <text x="680" y="256" font-size="13" fill="#2B2620">  《世界记忆名录》</text>
    <text x="680" y="284" font-size="13" fill="#2B2620">· 2015年青蒿素诺奖</text>
    <text x="680" y="308" font-size="13" fill="#2B2620">  （其知识谱系的现代胜利）</text>
    <text x="680" y="344" font-size="12.5" fill="#A63D2F" font-weight="600">东方药物巨典 → 人类共同遗产</text>

    <rect x="948" y="112" width="272" height="270" rx="12" fill="#2E5C3F"/>
    <text x="976" y="150" font-size="15" font-weight="700" fill="#FFFFFF">今天的世界记忆名录</text>
    <text x="976" y="184" font-size="13" fill="#D8E5DB">与《黄帝内经》一起</text>
    <text x="976" y="208" font-size="13" fill="#D8E5DB">成为中国最早入选的</text>
    <text x="976" y="232" font-size="13" fill="#D8E5DB">两部医学典籍</text>
    <rect x="976" y="252" width="216" height="100" rx="8" fill="#F5EDD8"/>
    <text x="1084" y="290" text-anchor="middle" font-size="13" fill="#2E5C3F" font-weight="600">评选词（大意）：</text>
    <text x="1084" y="316" text-anchor="middle" font-size="12.5" fill="#6E655A">16世纪前东亚药学的</text>
    <text x="1084" y="336" text-anchor="middle" font-size="12.5" fill="#6E655A">集大成科学文献</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="404" width="1160" height="230" rx="12" fill="#2B2620"/>
  <text x="90" y="442" font-family="'PingFang SC', sans-serif" font-size="16.5" font-weight="700" fill="#F0C98A">它凭什么走得这么远？三个结构性原因</text>
  <text x="90" y="482" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5EDD8">① 体例标准化——外国人不用读懂中文思想，也能按字段查数据（先被翻译利用的正是矿物/动植物条目）</text>
  <text x="90" y="516" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5EDD8">② 内容实证性强——大量具体观察（形态、产地、加工），跨越语言和时代仍然可检验</text>
  <text x="90" y="550" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5EDD8">③ 规模效应——1892 种药的数据库，任何后续研究都绕不开它</text>
  <text x="90" y="598" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F0C98A" font-weight="600">一句话：好体例让知识可迁移，好观察让知识不腐朽——这是所有时代通用的写作课。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">传播史：公开研究综述（B+）· 达尔文引用见《变异》原著引用目录（A-）· 世界记忆名录：UNESCO（A）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">14 / 16</text>
</svg>
