<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F4EC" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">怎么读它：八项体例 = 数据库的八个字段</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">每味药都是同一套模板填出来的——这正是它 400 年后仍好用的原因</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E3D9C6" d="M70,116 H315 A10,10 0 0 1 325,126 V226 A10,10 0 0 1 315,236 H70 A10,10 0 0 1 60,226 V126 A10,10 0 0 1 70,116 Z" />
    <path fill="#2E5C3F" d="M70,116 H315 A10,10 0 0 1 325,126 V140 A10,10 0 0 1 315,150 H70 A10,10 0 0 1 60,140 V126 A10,10 0 0 1 70,116 Z" />
    <text x="192" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">① 释名</text>
    <text x="80" y="172" font-size="12" fill="#6E655A">这药叫什么、为什么叫这名</text>
    <text x="80" y="196" font-size="12" fill="#6E655A">（含别名、方言、训诂）</text>
    <text x="80" y="222" font-size="12.5" fill="#A63D2F" font-weight="600">= 名片栏</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M357,116 H602 A10,10 0 0 1 612,126 V226 A10,10 0 0 1 602,236 H357 A10,10 0 0 1 347,226 V126 A10,10 0 0 1 357,116 Z" />
    <path fill="#2E5C3F" d="M357,116 H602 A10,10 0 0 1 612,126 V140 A10,10 0 0 1 602,150 H357 A10,10 0 0 1 347,140 V126 A10,10 0 0 1 357,116 Z" />
    <text x="479" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">② 集解</text>
    <text x="367" y="172" font-size="12" fill="#6E655A">长在哪、长什么样、</text>
    <text x="367" y="196" font-size="12" fill="#6E655A">怎么鉴别真假、何时采</text>
    <text x="367" y="222" font-size="12.5" fill="#A63D2F" font-weight="600">= 产地与鉴别栏</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M644,116 H889 A10,10 0 0 1 899,126 V226 A10,10 0 0 1 889,236 H644 A10,10 0 0 1 634,226 V126 A10,10 0 0 1 644,116 Z" />
    <path fill="#A63D2F" d="M644,116 H889 A10,10 0 0 1 899,126 V140 A10,10 0 0 1 889,150 H644 A10,10 0 0 1 634,140 V126 A10,10 0 0 1 644,116 Z" />
    <text x="766" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">③ 正误</text>
    <text x="654" y="172" font-size="12" fill="#6E655A">前书写错了的，我来纠正</text>
    <text x="654" y="196" font-size="12" fill="#6E655A">（品种混淆、毒性误记…）</text>
    <text x="654" y="222" font-size="12.5" fill="#A63D2F" font-weight="600">= 勘误栏（首创！）</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M931,116 H1176 A10,10 0 0 1 1186,126 V226 A10,10 0 0 1 1176,236 H931 A10,10 0 0 1 921,226 V126 A10,10 0 0 1 931,116 Z" />
    <path fill="#2E5C3F" d="M931,116 H1176 A10,10 0 0 1 1186,126 V140 A10,10 0 0 1 1176,150 H931 A10,10 0 0 1 921,140 V126 A10,10 0 0 1 931,116 Z" />
    <text x="1053" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">④ 修治</text>
    <text x="941" y="172" font-size="12" fill="#6E655A">炮制：切片/炒/炙/蒸…</text>
    <text x="941" y="196" font-size="12" fill="#6E655A">加工方法决定药性</text>
    <text x="941" y="222" font-size="12.5" fill="#A63D2F" font-weight="600">= 工艺栏</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M70,252 H315 A10,10 0 0 1 325,262 V362 A10,10 0 0 1 315,372 H70 A10,10 0 0 1 60,362 V262 A10,10 0 0 1 70,252 Z" />
    <path fill="#2E5C3F" d="M70,252 H315 A10,10 0 0 1 325,262 V276 A10,10 0 0 1 315,286 H70 A10,10 0 0 1 60,276 V262 A10,10 0 0 1 70,252 Z" />
    <text x="192" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">⑤ 气味</text>
    <text x="80" y="308" font-size="12" fill="#6E655A">四气（寒热温凉）</text>
    <text x="80" y="332" font-size="12" fill="#6E655A">五味（酸苦甘辛咸）+ 有无毒</text>
    <text x="80" y="358" font-size="12.5" fill="#A63D2F" font-weight="600">= 参数栏</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M357,252 H602 A10,10 0 0 1 612,262 V362 A10,10 0 0 1 602,372 H357 A10,10 0 0 1 347,362 V262 A10,10 0 0 1 357,252 Z" />
    <path fill="#2E5C3F" d="M357,252 H602 A10,10 0 0 1 612,262 V276 A10,10 0 0 1 602,286 H357 A10,10 0 0 1 347,276 V262 A10,10 0 0 1 357,252 Z" />
    <text x="479" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">⑥ 主治</text>
    <text x="367" y="308" font-size="12" fill="#6E655A">能治什么病（汇总历代）</text>
    <text x="367" y="332" font-size="12" fill="#6E655A">多数引《本经》《别录》</text>
    <text x="367" y="358" font-size="12.5" fill="#A63D2F" font-weight="600">= 适应症栏</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M644,252 H889 A10,10 0 0 1 899,262 V362 A10,10 0 0 1 889,372 H644 A10,10 0 0 1 634,362 V262 A10,10 0 0 1 644,252 Z" />
    <path fill="#8A6D3B" d="M644,252 H889 A10,10 0 0 1 899,262 V276 A10,10 0 0 1 889,286 H644 A10,10 0 0 1 634,276 V262 A10,10 0 0 1 644,252 Z" />
    <text x="766" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">⑦ 发明</text>
    <text x="654" y="308" font-size="12" fill="#6E655A">李时珍自己的药理阐发</text>
    <text x="654" y="332" font-size="12" fill="#6E655A">署名观点，与引文区分</text>
    <text x="654" y="358" font-size="12.5" fill="#A63D2F" font-weight="600">= 原创论文栏</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M931,252 H1176 A10,10 0 0 1 1186,262 V362 A10,10 0 0 1 1176,372 H931 A10,10 0 0 1 921,362 V262 A10,10 0 0 1 931,252 Z" />
    <path fill="#2E5C3F" d="M931,252 H1176 A10,10 0 0 1 1186,262 V276 A10,10 0 0 1 1176,286 H931 A10,10 0 0 1 921,276 V262 A10,10 0 0 1 931,252 Z" />
    <text x="1053" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">⑧ 附方</text>
    <text x="941" y="308" font-size="12" fill="#6E655A">附验方，按病索引</text>
    <text x="941" y="332" font-size="12" fill="#6E655A">全书共 11096 首</text>
    <text x="941" y="358" font-size="12.5" fill="#A63D2F" font-weight="600">= 用例库</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#F5EDD8" stroke="#8A6D3B" d="M72,394 H798 A12,12 0 0 1 810,406 V622 A12,12 0 0 1 798,634 H72 A12,12 0 0 1 60,622 V406 A12,12 0 0 1 72,394 Z" />
    <rect x="60" y="394" width="4" height="240" fill="#A63D2F" />
    <text x="92" y="428" font-size="15" font-weight="700" fill="#2E5C3F">示范：甘草条目在八个字段里长什么样</text>
    <text x="92" y="458" font-size="13" fill="#2B2620">释名 →「亦名蜜甘、蜜草、美草、<tspan fill="#A63D2F" font-weight="600">国老</tspan>、灵通」</text>
    <text x="92" y="484" font-size="13" fill="#2B2620">气味 →「<tspan fill="#A63D2F" font-weight="600">甘，平，无毒</tspan>」（参数：味甘/性平/安全）</text>
    <text x="92" y="510" font-size="13" fill="#2B2620">主治 →「五脏六腑寒热邪气……<tspan fill="#A63D2F" font-weight="600">解百药毒</tspan>，为九土之精」</text>
    <text x="92" y="536" font-size="13" fill="#2B2620">发明 →「甘味主中……<tspan fill="#A63D2F" font-weight="600">有和有缓，有补有泄，居中之道尽矣</tspan>」</text>
    <text x="92" y="568" font-size="12.5" fill="#6E655A">集解/正误/修治/附方同样各有内容（本页从略，P5 精读展开）</text>
    <text x="92" y="600" font-size="12.5" fill="#8A6D3B">读任何一味药，先扫一遍八个字段，就像看一张填好的表单</text>

    <path fill="#2E5C3F" d="M842,394 H1208 A12,12 0 0 1 1220,406 V622 A12,12 0 0 1 1208,634 H842 A12,12 0 0 1 830,622 V406 A12,12 0 0 1 842,394 Z" />
    <text x="858" y="428" font-size="15" font-weight="700" fill="#FFFFFF">为什么这个设计了不起</text>
    <text x="858" y="460" font-size="13" fill="#D8E5DB">· 模板统一 → 1892 条记录可直接对比</text>
    <text x="858" y="488" font-size="13" fill="#D8E5DB">· 引文与己见分开 → 知道哪句是谁说的</text>
    <text x="858" y="516" font-size="13" fill="#D8E5DB">· 勘误专栏 → 错误不会代代相传</text>
    <text x="858" y="544" font-size="13" fill="#D8E5DB">· 方以病附 → 可按病反查药</text>
    <text x="858" y="580" font-size="13.5" fill="#F5EDD8" font-weight="600">这就是为什么 LLM 时代它是</text>
    <text x="858" y="604" font-size="13.5" fill="#F5EDD8" font-weight="600">天生的结构化语料</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">体例说明：香港卫生署中医药规管办公室展板，引赵中振《本草的世界》（A-/B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">03 / 16</text>
</svg>