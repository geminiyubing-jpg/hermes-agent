  <text x="90" y="498" font-family="'PingFang SC', sans-serif" font-size="16.5" font-weight="700" fill="#F0C98A">送你一条「30 分钟首次试读路线」</text>
  <text x="90" y="532" font-family="'PingFang SC', sans-serif" font-size="14" fill="#D8E5DB">① 打开识典古籍《本草纲目》卷十二 → 读甘草条「释名+气味+主治+发明」（10分钟）</text>
  <text x="90" y="564" font-family="'PingFang SC', sans-serif" font-size="14" fill="#D8E5DB">② 跳卷十五青蒿条「附方」→ 想一想屠呦呦为什么被「绞汁」点醒（5分钟）</text>
  <text x="90" y="596" font-family="'PingFang SC', sans-serif" font-size="14" fill="#D8E5DB">③ 跳卷八金屑「发明」→ 欣赏李时珍怎么骂人「可谓愚也矣」（10分钟）</text>
