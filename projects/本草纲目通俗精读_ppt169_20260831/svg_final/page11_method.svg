<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F4EC" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">李时珍的读书法：他是怎么查资料的？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">王世贞序说他「渔猎群书，搜罗百氏」——这背后是一套完整的方法论</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E3D9C6" d="M72,112 H328 A12,12 0 0 1 340,124 V400 A12,12 0 0 1 328,412 H72 A12,12 0 0 1 60,400 V124 A12,12 0 0 1 72,112 Z" />
    <path fill="#2E5C3F" d="M72,112 H328 A12,12 0 0 1 340,124 V144 A12,12 0 0 1 328,156 H72 A12,12 0 0 1 60,144 V124 A12,12 0 0 1 72,112 Z" />
    <text x="200" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">① 全源检索</text>
    <text x="88" y="184" font-size="13" fill="#2B2620">引据书籍 800+ 种：</text>
    <text x="88" y="210" font-size="13" fill="#6E655A">经史子集、佛道典籍、</text>
    <text x="88" y="234" font-size="13" fill="#6E655A">农书、乐府、方言……</text>
    <text x="88" y="268" font-size="12.5" fill="#2B2620">王世贞序：「子史经传，</text>
    <text x="88" y="290" font-size="12.5" fill="#2B2620">声韵农圃，医卜星相，</text>
    <text x="88" y="312" font-size="12.5" fill="#2B2620">乐府诸家，稍有得处，</text>
    <text x="88" y="334" font-size="12.5" fill="#2B2620">辄著数言」</text>
    <text x="88" y="372" font-size="12.5" fill="#A63D2F" font-weight="600">= 先穷尽文献再下笔</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M368,112 H624 A12,12 0 0 1 636,124 V400 A12,12 0 0 1 624,412 H368 A12,12 0 0 1 356,400 V124 A12,12 0 0 1 368,112 Z" />
    <path fill="#A63D2F" d="M368,112 H624 A12,12 0 0 1 636,124 V144 A12,12 0 0 1 624,156 H368 A12,12 0 0 1 356,144 V124 A12,12 0 0 1 368,112 Z" />
    <text x="496" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">② 野外调查</text>
    <text x="384" y="184" font-size="13" fill="#2B2B2B">「远穷僻壤之产，</text>
    <text x="384" y="210" font-size="13" fill="#2B2B2B">险探麓藏之物」</text>
    <text x="384" y="244" font-size="13" fill="#6E655A">带弟子采药踏遍湖广、</text>
    <text x="384" y="268" font-size="13" fill="#6E655A">江西、江苏、安徽……</text>
    <text x="384" y="302" font-size="13" fill="#2B2B2B">农民、渔人、樵夫、</text>
    <text x="384" y="326" font-size="13" fill="#2B2B2B">猎户、药农都是访谈对象</text>
    <text x="384" y="372" font-size="12.5" fill="#A63D2F" font-weight="600">= 文献必须过实地验证</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M664,112 H920 A12,12 0 0 1 932,124 V400 A12,12 0 0 1 920,412 H664 A12,12 0 0 1 652,400 V124 A12,12 0 0 1 664,112 Z" />
    <path fill="#8A6D3B" d="M664,112 H920 A12,12 0 0 1 932,124 V144 A12,12 0 0 1 920,156 H664 A12,12 0 0 1 652,144 V124 A12,12 0 0 1 664,112 Z" />
    <text x="792" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">③ 引文规范</text>
    <text x="680" y="184" font-size="13" fill="#2B2B2B">每句话标出处：</text>
    <text x="680" y="210" font-size="13" fill="#6E655A">「恭曰」「颂曰」</text>
    <text x="680" y="234" font-size="13" fill="#6E655A">「弘景曰」「藏器曰」</text>
    <text x="680" y="268" font-size="13" fill="#2B2B2B">自己的观点单独放</text>
    <text x="680" y="292" font-size="13" fill="#2B2B2B">「发明」栏，署名</text>
    <text x="680" y="326" font-size="13" fill="#6E655A">「时珍曰」三字全书</text>
    <text x="680" y="350" font-size="13" fill="#6E655A">出现上千次</text>
    <text x="680" y="386" font-size="12.5" fill="#A63D2F" font-weight="600">= 引用与原创严格分离</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M960,112 H1208 A12,12 0 0 1 1220,124 V400 A12,12 0 0 1 1208,412 H960 A12,12 0 0 1 948,400 V124 A12,12 0 0 1 960,112 Z" />
    <path fill="#2E5C3F" d="M960,112 H1208 A12,12 0 0 1 1220,124 V144 A12,12 0 0 1 1208,156 H960 A12,12 0 0 1 948,144 V124 A12,12 0 0 1 960,112 Z" />
    <text x="1084" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">④ 勘误专栏</text>
    <text x="976" y="184" font-size="13" fill="#2B2B2B">专设「正误」一项：</text>
    <text x="976" y="210" font-size="13" fill="#6E655A">把前代本草可疑处</text>
    <text x="976" y="234" font-size="13" fill="#6E655A">逐条辨析纠正</text>
    <text x="976" y="268" font-size="13" fill="#2B2B2B">品种混淆、产地讹传、</text>
    <text x="976" y="292" font-size="13" fill="#2B2B2B">毒性误记……</text>
    <text x="976" y="326" font-size="13" fill="#6E655A">如陶弘景认错的药，</text>
    <text x="976" y="350" font-size="13" fill="#6E655A">他直接点名批注</text>
    <text x="976" y="386" font-size="12.5" fill="#A63D2F" font-weight="600">= 让错误不再代代相传</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#2B2620" d="M72,432 H1208 A12,12 0 0 1 1220,444 V608 A12,12 0 0 1 1208,620 H72 A12,12 0 0 1 60,608 V444 A12,12 0 0 1 72,432 Z" />
    <text x="90" y="468" font-size="16.5" font-weight="700" fill="#F0C98A">用今天的行话说，李时珍做了四件事：</text>
    <text x="90" y="508" font-size="14.5" fill="#F5EDD8">文献综述（systematic review）＋ 田野调查（field study）＋ 引用规范（citation）＋ 同行勘误（peer review 的雏形）</text>
    <text x="90" y="548" font-size="14" fill="#D8E5DB">差别只在于：他没有搜索引擎和期刊数据库，靠一双腿、一盏灯、27 年。</text>
    <text x="90" y="588" font-size="14" fill="#F0C98A" font-weight="600">这也是为什么今天的 LLM 能从这本书里学到东西——它本来就是按「可检索」的方式写的。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">王世贞序/金陵本研究（A-/B+）· 方法论概括：小爱基于原文归纳</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">11 / 16</text>
</svg>