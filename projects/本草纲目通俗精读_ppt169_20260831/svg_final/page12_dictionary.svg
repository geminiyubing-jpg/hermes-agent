<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F4EC" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">古文小词典：读懂原文的 10 把钥匙</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">这些词反复出现，认识它们，原文就通了一半</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="1160" height="38" fill="#2E5C3F" />
    <text x="160" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">古文词</text>
    <text x="500" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">白话意思</text>
    <text x="960" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#F0C98A">原文例句（出处见页脚）</text>

    <rect x="60" y="150" width="1160" height="42" fill="#FFFFFF" />
    <text x="160" y="177" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">气味</text>
    <text x="500" y="177" text-anchor="middle" font-size="13" fill="#2B2620">四气五味+毒性（药性参数）</text>
    <text x="960" y="177" text-anchor="middle" font-size="12.5" fill="#6E655A">「气味甘，平，无毒」</text>

    <rect x="60" y="192" width="1160" height="42" fill="#F2EDE0" />
    <text x="160" y="219" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">主治</text>
    <text x="500" y="219" text-anchor="middle" font-size="13" fill="#2B2620">主要功效、能治什么</text>
    <text x="960" y="219" text-anchor="middle" font-size="12.5" fill="#6E655A">「主治五脏六腑寒热邪气」</text>

    <rect x="60" y="234" width="1160" height="42" fill="#FFFFFF" />
    <text x="160" y="261" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">发明</text>
    <text x="500" y="261" text-anchor="middle" font-size="13" fill="#2B2620">李时珍的个人阐发（不是古训）</text>
    <text x="960" y="261" text-anchor="middle" font-size="12.5" fill="#6E655A">「此千古未发之秘旨，愚因表而出之」</text>

    <rect x="60" y="276" width="1160" height="42" fill="#F2EDE0" />
    <text x="160" y="303" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">释名 / 集解</text>
    <text x="500" y="303" text-anchor="middle" font-size="13" fill="#2B2620">名字由来 / 产地形态鉴别</text>
    <text x="960" y="303" text-anchor="middle" font-size="12.5" fill="#6E655A">「亦名蜜甘、蜜草、美草、国老」</text>

    <rect x="60" y="318" width="1160" height="42" fill="#FFFFFF" />
    <text x="160" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">附方</text>
    <text x="500" y="345" text-anchor="middle" font-size="13" fill="#2B2620">附带的验方（配方+用法）</text>
    <text x="960" y="345" text-anchor="middle" font-size="12.5" fill="#6E655A">「用人参一钱、白术二钱……」</text>

    <rect x="60" y="360" width="1160" height="42" fill="#F2EDE0" />
    <text x="160" y="387" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">无汗 / 发表</text>
    <text x="500" y="387" text-anchor="middle" font-size="13" fill="#2B2620">不出汗 / 发汗（把邪气「赶出门」）</text>
    <text x="960" y="387" text-anchor="middle" font-size="12.5" fill="#6E655A">「发表出汗，去邪热气」</text>

    <rect x="60" y="402" width="1160" height="42" fill="#FFFFFF" />
    <text x="160" y="429" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">营 / 卫</text>
    <text x="500" y="429" text-anchor="middle" font-size="13" fill="#2B2620">血管内养分 / 体表防御（李时珍模型）</text>
    <text x="960" y="429" text-anchor="middle" font-size="12.5" fill="#6E655A">「在营则为血，在卫则为汗」</text>

    <rect x="60" y="444" width="1160" height="42" fill="#F2EDE0" />
    <text x="160" y="471" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">君臣佐使</text>
    <text x="500" y="471" text-anchor="middle" font-size="13" fill="#2B2620">方剂里的主帅/副将/参谋/联络官</text>
    <text x="960" y="471" text-anchor="middle" font-size="12.5" fill="#6E655A">四君子汤：人参为君……</text>

    <rect x="60" y="486" width="1160" height="42" fill="#FFFFFF" />
    <text x="160" y="513" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">炮制 / 修治</text>
    <text x="500" y="513" text-anchor="middle" font-size="13" fill="#2B2620">加工：切片/炒/炙/煅/淬……</text>
    <text x="960" y="513" text-anchor="middle" font-size="12.5" fill="#6E655A">「自然铜火煅，醋淬九次」</text>

    <rect x="60" y="528" width="1160" height="42" fill="#F2EDE0" />
    <text x="160" y="555" text-anchor="middle" font-size="14" font-weight="600" fill="#2E5C3F">久服轻身延年</text>
    <text x="500" y="555" text-anchor="middle" font-size="13" fill="#2B2620">长期吃能长寿（多系道家套话，存疑读）</text>
    <text x="960" y="555" text-anchor="middle" font-size="12.5" fill="#6E655A">「久服轻身延年」——全书高频句</text>
  </g>
  <rect x="60" y="112" width="1160" height="458" fill="none" stroke="#E3D9C6" />

  
  <path fill="#2B2620" d="M70,590 H1209 A10,10 0 0 1 1219,600 V624 A10,10 0 0 1 1209,634 H70 A10,10 0 0 1 60,624 V600 A10,10 0 0 1 70,590 Z" />
  <text x="90" y="618" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5EDD8">小技巧：读原文时先找「气味→主治→发明」三段，「发明」里必看「时珍曰」——那是全书最有个人色彩的部分。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">词条解释：小爱基于原文归纳（例句均为 A 级原文摘录）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">12 / 16</text>
</svg>