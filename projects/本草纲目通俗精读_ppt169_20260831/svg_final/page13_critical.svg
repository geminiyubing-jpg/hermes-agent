<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F4EC" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">批判地读：伟大的书里也有时代的噪音</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">三步分辨法——把 400 年前的金子和沙子分开</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E3D9C6" d="M72,112 H421 A12,12 0 0 1 433,124 V410 A12,12 0 0 1 421,422 H72 A12,12 0 0 1 60,410 V124 A12,12 0 0 1 72,112 Z" />
    <path fill="#2E5C3F" d="M72,112 H421 A12,12 0 0 1 433,124 V144 A12,12 0 0 1 421,156 H72 A12,12 0 0 1 60,144 V124 A12,12 0 0 1 72,112 Z" />
    <text x="246" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">第一步 · 看句子类型</text>
    <text x="88" y="186" font-size="13" fill="#2B2620" font-weight="600">可信度较高的：</text>
    <text x="88" y="210" font-size="12.5" fill="#6E655A">· 具体操作细节（绞汁、醋淬九次）</text>
    <text x="88" y="234" font-size="12.5" fill="#6E655A">· 带失败记录的（麻黄「不可多服」）</text>
    <text x="88" y="258" font-size="12.5" fill="#6E655A">· 有医案支撑的（锦衣卫腹泻案）</text>
    <text x="88" y="292" font-size="13" fill="#2B2620" font-weight="600">要打折扣的：</text>
    <text x="88" y="316" font-size="12.5" fill="#6E655A">·「久服轻身延年」「成仙」类套话</text>
    <text x="88" y="340" font-size="12.5" fill="#6E655A">·「神草」「鬼盖」类传说命名</text>
    <text x="88" y="364" font-size="12.5" fill="#6E655A">· 服器部、人部多数条目</text>
    <text x="88" y="398" font-size="12.5" fill="#A63D2F" font-weight="600">细节越具体，越可能是真观察</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M465,112 H814 A12,12 0 0 1 826,124 V410 A12,12 0 0 1 814,422 H465 A12,12 0 0 1 453,410 V124 A12,12 0 0 1 465,112 Z" />
    <path fill="#8A6D3B" d="M465,112 H814 A12,12 0 0 1 826,124 V144 A12,12 0 0 1 814,156 H465 A12,12 0 0 1 453,144 V124 A12,12 0 0 1 465,112 Z" />
    <text x="639" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">第二步 · 看谁说的</text>
    <text x="481" y="186" font-size="13" fill="#2B2620">原文出处分层：</text>
    <text x="481" y="214" font-size="12.5" fill="#6E655A">·《本经》《别录》（汉魏）：最古但</text>
    <text x="481" y="238" font-size="12.5" fill="#6E655A">  夹带神仙学说</text>
    <text x="481" y="266" font-size="12.5" fill="#6E655A">· 陶弘景/苏恭/苏颂（南北朝-宋）：</text>
    <text x="481" y="290" font-size="12.5" fill="#6E655A">  转述+各地见闻</text>
    <text x="481" y="318" font-size="12.5" fill="#6E655A">·「时珍曰」：本人考察+推理，</text>
    <text x="481" y="342" font-size="12.5" fill="#6E655A">  通常最审慎（金石批判为证）</text>
    <text x="481" y="376" font-size="12.5" fill="#A63D2F" font-weight="600">遇到「时珍曰」，可以提高注意力——</text>
    <text x="481" y="400" font-size="12.5" fill="#A63D2F" font-weight="600">这里常有他纠正前人的地方</text>

    <path fill="#FFFFFF" stroke="#E3D9C6" d="M858,112 H1207 A12,12 0 0 1 1219,124 V410 A12,12 0 0 1 1207,422 H858 A12,12 0 0 1 846,410 V124 A12,12 0 0 1 858,112 Z" />
    <path fill="#A63D2F" d="M858,112 H1207 A12,12 0 0 1 1219,124 V144 A12,12 0 0 1 1207,156 H858 A12,12 0 0 1 846,144 V124 A12,12 0 0 1 858,112 Z" />
    <text x="1032" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">第三步 · 用今天的知识验</text>
    <text x="874" y="186" font-size="13" fill="#2B2620">三层验证结果都存在：</text>
    <path fill="#EAF2EC" d="M882,202 H1183 A8,8 0 0 1 1191,210 V250 A8,8 0 0 1 1183,258 H882 A8,8 0 0 1 874,250 V210 A8,8 0 0 1 882,202 Z" />
    <text x="1032" y="226" text-anchor="middle" font-size="12.5" fill="#2E5C3F" font-weight="600">已验证 ✔</text>
    <text x="1032" y="246" text-anchor="middle" font-size="12" fill="#2E5C3F">青蒿治疟、麻黄平喘、自然铜助骨痂</text>
    <path fill="#F5EDD8" d="M882,268 H1183 A8,8 0 0 1 1191,276 V316 A8,8 0 0 1 1183,324 H882 A8,8 0 0 1 874,316 V276 A8,8 0 0 1 882,268 Z" />
    <text x="1032" y="292" text-anchor="middle" font-size="12.5" fill="#8A6D3B" font-weight="600">待研究 ？</text>
    <text x="1032" y="312" text-anchor="middle" font-size="12" fill="#8A6D3B">大量复方配伍原理、炮制减毒机制</text>
    <path fill="#F5DED8" d="M882,334 H1183 A8,8 0 0 1 1191,342 V382 A8,8 0 0 1 1183,390 H882 A8,8 0 0 1 874,382 V342 A8,8 0 0 1 882,334 Z" />
    <text x="1032" y="358" text-anchor="middle" font-size="12.5" fill="#A63D2F" font-weight="600">已证伪 ✘</text>
    <text x="1032" y="378" text-anchor="middle" font-size="12" fill="#A63D2F">服金长生、人部多数、符水治病</text>
    <text x="874" y="412" font-size="12.5" fill="#6E655A">验证工具是现代药理与临床试验，</text>
    <text x="874" y="434" font-size="12.5" fill="#6E655A">不是「古人云」也不是「我觉得」</text>
  </g>

  
  <path fill="#2B2620" d="M72,442 H1208 A12,12 0 0 1 1220,454 V622 A12,12 0 0 1 1208,634 H72 A12,12 0 0 1 60,622 V454 A12,12 0 0 1 72,442 Z" />
  <text x="90" y="480" font-family="'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#F0C98A">最有趣的事实：李时珍自己就是批判性读者</text>
  <text x="90" y="518" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5EDD8">他引《神农本草经》但不迷信它——把三品分类改成了自然分类；他敬重陶弘景但点名纠错；</text>
  <text x="90" y="548" font-family="'PingFang SC', sans-serif" font-size="14" fill="#F5EDD8">他收录道家说法又亲手拆穿服食成仙。</text>
  <text x="90" y="590" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#F0C98A" font-weight="600">所以最好的致敬不是全盘相信这本书，而是用他自己的方法去读它。</text>
  <text x="90" y="618" font-family="'PingFang SC', sans-serif" font-size="13" fill="#D8E5DB">（同理：本 PPT 的通俗解读也请保持批判——原文引的是 A 级，白话是我的理解）</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">方法论：小爱构建 · 验证案例均为公开药理文献（B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">13 / 16</text>
</svg>