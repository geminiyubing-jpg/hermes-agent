<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F4EC" />
  <rect x="0" y="0" width="1280" height="6" fill="#2E5C3F" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2620">精读⑥ 自然铜：一味「接骨神药」的真相</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6E655A">金石部卷八 —— 从「石髓铅」到现代骨科</text>

  
  <path fill="#F5EDD8" stroke="#8A6D3B" d="M70,112 H790 A10,10 0 0 1 800,122 V252 A10,10 0 0 1 790,262 H70 A10,10 0 0 1 60,252 V122 A10,10 0 0 1 70,112 Z" />
  <rect x="60" y="112" width="4" height="150" fill="#A63D2F" />
  <text x="92" y="142" font-family="'PingFang SC', serif" font-size="14" fill="#2B2620">【释名】石髓铅。志曰：其色青黄如铜，不从矿炼，故号自然铜。</text>
  <text x="92" y="168" font-family="'PingFang SC', serif" font-size="14" fill="#2B2620">【主治】折伤散血，止痛，破积聚。消瘀血，排脓，<tspan font-weight="700" fill="#A63D2F">续筋骨</tspan>，</text>
  <text x="92" y="194" font-family="'PingFang SC', serif" font-size="14" fill="#2B2620">治产后血邪……以酒磨服。</text>
  <text x="92" y="224" font-size="11.5" fill="#8A6D3B">【附方】暑湿瘫痪方：自然铜烧红，酒浸一夜……觉四肢麻木即止。</text>
  <text x="92" y="250" font-size="11.5" fill="#8A6D3B">—— 识典古籍《本草纲目》卷八（A 级数字化原文）</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E3D9C6" d="M830,112 H1210 A10,10 0 0 1 1220,122 V252 A10,10 0 0 1 1210,262 H830 A10,10 0 0 1 820,252 V122 A10,10 0 0 1 830,112 Z" />
    <text x="846" y="142" font-size="14" font-weight="700" fill="#2E5C3F">白话速览</text>
    <text x="846" y="168" font-size="12.5" fill="#2B2620">· 名字由来：天然长着铜样、不经冶炼</text>
    <text x="846" y="192" font-size="12.5" fill="#2B2620">· 主打：跌打损伤、骨折 → 「续筋骨」</text>
    <text x="846" y="216" font-size="12.5" fill="#2B2620">· 用法：煅烧醋淬研末，酒送服；外敷</text>
    <text x="846" y="246" font-size="12.5" fill="#A63D2F" font-weight="600">中医骨科沿用至今的接骨要药</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E3D9C6" d="M72,282 H428 A12,12 0 0 1 440,294 V524 A12,12 0 0 1 428,536 H72 A12,12 0 0 1 60,524 V294 A12,12 0 0 1 72,282 Z" />
    <text x="88" y="316" font-size="15.5" font-weight="700" fill="#2E5C3F">现代身份：它其实不是铜</text>
    <text x="88" y="350" font-size="20" font-family="'Helvetica Neue', sans-serif" font-weight="700" fill="#8A6D3B">FeS₂</text>
    <text x="150" y="350" font-size="13" fill="#2B2620">（二硫化铁，黄铁矿）</text>
    <text x="88" y="382" font-size="13" fill="#2B2620">古人叫「铜」是因为颜色金黄——</text>
    <text x="88" y="406" font-size="13" fill="#2B2620">命名按外观，不按成分（时代局限）</text>
    <text x="88" y="440" font-size="13" fill="#2B2620">现代研究：含铁矿物确可</text>
    <text x="88" y="464" font-size="13" fill="#2B2620">促进骨痂形成、胶原合成——</text>
    <text x="88" y="488" font-size="13" fill="#2B2620">「续筋骨」有药理对应</text>
    <text x="88" y="518" font-size="12.5" fill="#6E655A">至今仍是中成药接骨丸组分</text>

    <path fill="#F5EDD8" stroke="#8A6D3B" d="M472,282 H828 A12,12 0 0 1 840,294 V524 A12,12 0 0 1 828,536 H472 A12,12 0 0 1 460,524 V294 A12,12 0 0 1 472,282 Z" />
    <text x="488" y="316" font-size="15.5" font-weight="700" fill="#2E5C3F">铜末接骨：古代「标记实验」</text>
    <text x="488" y="348" font-size="13" fill="#2B2620">原文医案（《朝野佥载》）：定州崔务坠马</text>
    <text x="488" y="372" font-size="13" fill="#2B2620">折足，医者用铜末和酒让他服下，痊愈。</text>
    <text x="488" y="396" font-size="13" fill="#2B2620">死后十年改葬，<tspan font-weight="700" fill="#A63D2F">骨中有铜末</tspan>。</text>
    <text x="488" y="430" font-size="12.5" fill="#6E655A">这几乎是一次「示踪实验」：</text>
    <text x="488" y="452" font-size="12.5" fill="#6E655A">吃进去的铜沉积在愈合的骨头上——</text>
    <text x="488" y="474" font-size="12.5" fill="#6E655A">古人用解剖机会验证了药物归宿。</text>
    <text x="488" y="508" font-size="12.5" fill="#8A6D3B">注意：铜末内服今已不用（重金属风险），</text>
    <text x="488" y="528" font-size="12.5" fill="#8A6D3B">案例价值在方法而非结论</text>

    <path fill="#2E5C3F" d="M872,282 H1208 A12,12 0 0 1 1220,294 V524 A12,12 0 0 1 1208,536 H872 A12,12 0 0 1 860,524 V294 A12,12 0 0 1 872,282 Z" />
    <text x="888" y="316" font-size="15.5" font-weight="700" fill="#FFFFFF">读金石部的三重滤镜</text>
    <text x="888" y="350" font-size="13" fill="#D8E5DB">① 命名滤镜：外观命名≠化学身份</text>
    <text x="888" y="378" font-size="13" fill="#D8E5DB">　（自然铜是铁、铅粉是铅……）</text>
    <text x="888" y="410" font-size="13" fill="#D8E5DB">② 疗效滤镜：外用抗菌多数成立，</text>
    <text x="888" y="434" font-size="13" fill="#D8E5DB">　内服重金属多数危险</text>
    <text x="888" y="466" font-size="13" fill="#D8E5DB">③ 剂量滤镜：「神效」记载常常</text>
    <text x="888" y="490" font-size="13" fill="#D8E5DB">　忽略毒性累积</text>
    <text x="888" y="520" font-size="13.5" fill="#F5EDD8" font-weight="600">结论：当史料读满分，当处方读须医生</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9184">原文：识典古籍（A）· 化学与药理对照：现代文献综述（B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#2E5C3F">10 / 16</text>
</svg>