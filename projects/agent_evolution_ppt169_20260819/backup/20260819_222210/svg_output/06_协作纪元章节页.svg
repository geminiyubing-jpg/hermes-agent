<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="collabGlow" cx="72%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.09"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <marker id="flow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#0B1426"/>
  <rect width="1280" height="720" fill="url(#collabGlow)"/>

  <!-- Multi-agent collaboration scene right-of-center -->
  <g id="collab">
    <!-- central workspace hexagon -->
    <path d="M 1010 330 L 1055 356 L 1055 408 L 1010 434 L 965 408 L 965 356 Z" fill="#111F35" stroke="#F59E0B" stroke-width="2"/>
    <text x="1010" y="388" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="800" fill="#F59E0B" text-anchor="middle">共享</text>
    <text x="1010" y="406" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="800" fill="#F59E0B" text-anchor="middle">工作区</text>
    <!-- 5 agents -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
      <rect x="880" y="180" width="120" height="54" rx="10" fill="#111F35" stroke="#22D3EE" stroke-width="1.8"/>
      <text x="940" y="212" font-size="13" font-weight="700" fill="#22D3EE">规划者</text>
      <rect x="1090" y="200" width="120" height="54" rx="10" fill="#111F35" stroke="#22D3EE" stroke-width="1.8"/>
      <text x="1150" y="232" font-size="13" font-weight="700" fill="#22D3EE">执行者 ×2</text>
      <rect x="860" y="500" width="120" height="54" rx="10" fill="#111F35" stroke="#8B5CF6" stroke-width="1.8"/>
      <text x="920" y="532" font-size="13" font-weight="700" fill="#8B5CF6">审校者</text>
      <rect x="1100" y="490" width="120" height="54" rx="10" fill="#111F35" stroke="#8B5CF6" stroke-width="1.8"/>
      <text x="1160" y="522" font-size="13" font-weight="700" fill="#8B5CF6">工具服务</text>
    </g>
    <!-- light streams -->
    <g stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.6" fill="none">
      <path d="M 950 234 L 990 322" marker-end="url(#flow)"/>
      <path d="M 1130 254 L 1060 320" marker-end="url(#flow)"/>
      <path d="M 930 500 L 965 440" marker-end="url(#flow)"/>
      <path d="M 1140 490 L 1075 436" marker-end="url(#flow)"/>
    </g>
    <!-- in-transit message focal -->
    <circle cx="1015" cy="270" r="5" fill="#F59E0B"/>
    <circle cx="1015" cy="270" r="12" fill="none" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Chapter block left -->
  <g id="chapter">
    <text x="100" y="240" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="120" font-weight="800" fill="#16263F">03</text>
    <rect x="104" y="268" width="56" height="6" rx="3" fill="#8B5CF6"/>
    <text x="100" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="800" fill="#E8EEF7">协作纪元</text>
    <text x="102" y="390" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="500" fill="#8B5CF6" letter-spacing="3">多智能体系统与能力分层</text>
    <text x="102" y="438" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8FA3BF">2024 MetaGPT / AutoGen → 2025 商业化编排平台</text>

    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600">
      <rect x="102" y="470" width="240" height="30" rx="15" fill="none" stroke="#1E2D45" stroke-width="1.5"/>
      <text x="222" y="490" fill="#8FA3BF" text-anchor="middle">一个 agent 干不了的事</text>
      <rect x="356" y="470" width="240" height="30" rx="15" fill="none" stroke="#1E2D45" stroke-width="1.5"/>
      <text x="476" y="490" fill="#8FA3BF" text-anchor="middle">一群 agent 就能干了吗？</text>
    </g>
  </g>
</svg>
