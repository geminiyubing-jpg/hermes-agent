<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B1426"/>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="48" width="4" height="44" rx="2" fill="#8B5CF6"/>
    <text x="78" y="78" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">2025：商业化元年 — 编排与 Computer-Use</text>
    <text x="78" y="102" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">从框架混战到平台收敛 · 从 API 到接管屏幕</text>
  </g>

  <!-- Left: 编排平台收敛 timeline-ish list -->
  <g id="orchestration" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="100" y="150" font-size="15" font-weight="700" fill="#8B5CF6" letter-spacing="1">多智能体编排：从 200+ 框架到 3 种范式</text>
    <g>
      <rect x="100" y="168" width="530" height="88" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <circle cx="128" cy="196" r="5" fill="#22D3EE"/>
      <text x="146" y="201" font-size="15" font-weight="800" fill="#E8EEF7">代码优先 Code-first</text>
      <text x="146" y="226" font-size="13" fill="#8FA3BF">LangGraph / CrewAI — 工程师写图，可控性最高</text>
      <text x="146" y="246" font-size="13" fill="#8FA3BF">银行审计场景的主力选择</text>

      <rect x="100" y="270" width="530" height="88" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <circle cx="128" cy="298" r="5" fill="#F59E0B"/>
      <text x="146" y="303" font-size="15" font-weight="800" fill="#E8EEF7">低代码 Low-code</text>
      <text x="146" y="328" font-size="13" fill="#8FA3BF">Dify / Coze — 拖拽编排，业务人员可用</text>
      <text x="146" y="348" font-size="13" fill="#8FA3BF">原型快，复杂逻辑碰壁</text>

      <rect x="100" y="372" width="530" height="88" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <circle cx="128" cy="400" r="5" fill="#8B5CF6"/>
      <text x="146" y="405" font-size="15" font-weight="800" fill="#E8EEF7">模型原生 Model-native</text>
      <text x="146" y="430" font-size="13" fill="#8FA3BF">Claude Agent SDK / OpenAI Agents — 编排逻辑</text>
      <text x="146" y="450" font-size="13" fill="#8FA3BF">长在模型能力里，SubAgent 派生即用</text>
    </g>
    <text x="100" y="496" font-size="13" fill="#5B6E8C">趋势：模型每强一分，框架就薄一层 — 编排正在被吸收进模型本身</text>
  </g>

  <!-- Right: Computer-Use -->
  <g id="computerUse" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="690" y="150" font-size="15" font-weight="700" fill="#22D3EE" letter-spacing="1">Computer-Use：agent 长出眼睛和手</text>
    <rect x="690" y="168" width="530" height="292" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <!-- mini screen schematic -->
    <g>
      <rect x="720" y="196" width="470" height="200" rx="8" fill="#0B1426" stroke="#1E2D45" stroke-width="1.5"/>
      <circle cx="740" cy="214" r="4" fill="#F59E0B"/><circle cx="756" cy="214" r="4" fill="#F59E0B" fill-opacity="0.5"/><circle cx="772" cy="214" r="4" fill="#F59E0B" fill-opacity="0.25"/>
      <rect x="720" y="226" width="470" height="4" fill="#1E2D45"/>
      <!-- UI elements -->
      <rect x="740" y="246" width="120" height="26" rx="4" fill="#16263F"/>
      <rect x="740" y="284" width="200" height="26" rx="4" fill="#16263F"/>
      <rect x="740" y="322" width="160" height="26" rx="4" fill="#16263F"/>
      <rect x="740" y="360" width="90" height="26" rx="13" fill="#1A2C4A" stroke="#22D3EE" stroke-width="1.5"/>
      <!-- cursor + click ripple -->
      <path d="M 860 320 L 860 348 L 868 340 L 874 354" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="860" cy="318" r="14" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="860" cy="318" r="24" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.2"/>
    </g>
    <text x="716" y="428" font-size="13.5" fill="#B8C7DC">看屏幕截图 → 定位元素 → 移动光标 → 点击/输入</text>
    <text x="716" y="450" font-size="13.5" fill="#B8C7DC">2025-10 Claude 4.5 computer-use 编码任务 SOTA</text>
    <text x="716" y="472" font-size="13.5" fill="#B8C7DC">2026：UI-Mate 开源权重追赶 + 安全基准先行</text>
  </g>

  <!-- Bottom: security note -->
  <g id="security" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="100" y="560" width="1120" height="100" rx="12" fill="#111F35" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="100" y="560" width="6" height="100" fill="#F59E0B"/>
    <text x="130" y="596" font-size="15" font-weight="800" fill="#F59E0B">内审视角：能力落地前，安全基准已先行</text>
    <text x="130" y="626" font-size="13.5" fill="#B8C7DC">MobileWorldSafety（2026-08）：GUI agent 处理的每一屏 untrusted 内容都是攻击面 — 恶意 App 界面可藏指令注入。</text>
    <text x="130" y="648" font-size="13.5" fill="#B8C7DC">部署 computer-use 的瓶颈已从“能不能”变成“敢不敢” — 环境注入防护是审计必查项。</text>
  </g>

  <text x="1220" y="695" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">08 / 15</text>
</svg>
