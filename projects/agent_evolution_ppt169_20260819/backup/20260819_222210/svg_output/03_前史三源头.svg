<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- P03 前史时间轴 — chart page -->
  <rect width="1280" height="720" fill="#0B1426"/>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="48" width="4" height="44" rx="2" fill="#22D3EE"/>
    <text x="78" y="78" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">前史：三个源头（1956 → 2015）</text>
    <text x="78" y="102" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">SYMBOLIC · BEHAVIORAL · RL — 规则系统的天花板</text>
  </g>

  <g id="chartArea">
    <!-- chart-plot-area: 100,150,1180,560 -->
    <!-- Era bands -->
    <rect x="100" y="410" width="640" height="44" rx="22" fill="#111F35"/>
    <text x="120" y="437" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#3D5270" letter-spacing="2">符号主义时代 1956-1990s</text>
    <rect x="760" y="410" width="240" height="44" rx="22" fill="#111F35"/>
    <text x="780" y="437" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#3D5270" letter-spacing="2">行为主义</text>
    <rect x="1010" y="410" width="170" height="44" rx="22" fill="#111F35"/>
    <text x="1030" y="437" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#3D5270" letter-spacing="2">RL 伏笔</text>

    <!-- Track -->
    <line x1="120" y1="432" x2="1160" y2="432" stroke="#1E2D45" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="432" x2="1160" y2="432" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" stroke-opacity="0.55"/>

    <!-- 6 nodes + cards -->
    <!-- N1 1956 above -->
    <g id="n1">
      <line x1="160" y1="386" x2="160" y2="410" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.5"/>
      <circle cx="160" cy="432" r="15" fill="#0B1426" stroke="#22D3EE" stroke-width="3"/>
      <circle cx="160" cy="432" r="5" fill="#22D3EE"/>
      <rect x="72" y="266" width="180" height="120" rx="10" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <rect x="72" y="266" width="180" height="30" rx="10" fill="#16263F"/>
      <text x="162" y="286" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#22D3EE" text-anchor="middle" letter-spacing="1.5">1956</text>
      <text x="162" y="318" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#E8EEF7" text-anchor="middle">达特茅斯会议</text>
      <text x="162" y="342" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">“人工智能”命名</text>
      <text x="162" y="362" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">GPS 通用问题求解器</text>
    </g>
    <!-- N2 1980s below -->
    <g id="n2">
      <line x1="340" y1="454" x2="340" y2="478" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.5"/>
      <circle cx="340" cy="432" r="15" fill="#0B1426" stroke="#22D3EE" stroke-width="3"/>
      <circle cx="340" cy="432" r="5" fill="#22D3EE"/>
      <rect x="252" y="478" width="180" height="120" rx="10" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <rect x="252" y="478" width="180" height="30" rx="10" fill="#16263F"/>
      <rect x="252" y="498" width="180" height="10" fill="#16263F"/>
      <text x="342" y="498" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#22D3EE" text-anchor="middle" letter-spacing="1.5">1980s</text>
      <text x="342" y="530" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#E8EEF7" text-anchor="middle">专家系统</text>
      <text x="342" y="554" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">MYCIN / XCON</text>
      <text x="342" y="574" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">规则爆炸 · 维护噩梦</text>
    </g>
    <!-- N3 1997 above -->
    <g id="n3">
      <line x1="520" y1="386" x2="520" y2="410" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.5"/>
      <circle cx="520" cy="432" r="15" fill="#0B1426" stroke="#22D3EE" stroke-width="3"/>
      <circle cx="520" cy="432" r="5" fill="#22D3EE"/>
      <rect x="432" y="266" width="180" height="120" rx="10" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <rect x="432" y="266" width="180" height="30" rx="10" fill="#16263F"/>
      <text x="522" y="286" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#22D3EE" text-anchor="middle" letter-spacing="1.5">1997</text>
      <text x="522" y="318" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#E8EEF7" text-anchor="middle">深蓝胜卡斯帕罗夫</text>
      <text x="522" y="342" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">搜索+评估函数</text>
      <text x="522" y="362" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">专用智能巅峰</text>
    </g>
    <!-- N4 2005 below -->
    <g id="n4">
      <line x1="700" y1="454" x2="700" y2="478" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.5"/>
      <circle cx="700" cy="432" r="15" fill="#0B1426" stroke="#22D3EE" stroke-width="3"/>
      <circle cx="700" cy="432" r="5" fill="#22D3EE"/>
      <rect x="612" y="478" width="180" height="120" rx="10" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <rect x="612" y="478" width="180" height="30" rx="10" fill="#16263F"/>
      <rect x="612" y="498" width="180" height="10" fill="#16263F"/>
      <text x="702" y="498" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#22D3EE" text-anchor="middle" letter-spacing="1.5">2005</text>
      <text x="702" y="530" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#E8EEF7" text-anchor="middle">BDI 模型成熟</text>
      <text x="702" y="554" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">信念-愿望-意图</text>
      <text x="702" y="574" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">理性 Agent 理论定型</text>
    </g>
    <!-- N5 2013 above (RL dawn) -->
    <g id="n5">
      <line x1="880" y1="386" x2="880" y2="410" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.6"/>
      <circle cx="880" cy="432" r="15" fill="#0B1426" stroke="#8B5CF6" stroke-width="3"/>
      <circle cx="880" cy="432" r="5" fill="#8B5CF6"/>
      <rect x="792" y="266" width="180" height="120" rx="10" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <rect x="792" y="266" width="180" height="30" rx="10" fill="#16263F"/>
      <text x="882" y="286" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#8B5CF6" text-anchor="middle" letter-spacing="1.5">2013</text>
      <text x="882" y="318" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#E8EEF7" text-anchor="middle">DQN 玩转 Atari</text>
      <text x="882" y="342" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">深度学习 × RL</text>
      <text x="882" y="362" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">为 13 年后埋下伏笔</text>
    </g>
    <!-- N6 2015-17 below -->
    <g id="n6">
      <line x1="1060" y1="454" x2="1060" y2="478" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.6"/>
      <circle cx="1060" cy="432" r="15" fill="#0B1426" stroke="#F59E0B" stroke-width="3"/>
      <circle cx="1060" cy="432" r="5" fill="#F59E0B"/>
      <rect x="972" y="478" width="180" height="120" rx="10" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
      <rect x="972" y="478" width="180" height="30" rx="10" fill="#16263F"/>
      <rect x="972" y="498" width="180" height="10" fill="#16263F"/>
      <text x="1062" y="498" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="1.5">2015-17</text>
      <text x="1062" y="530" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#E8EEF7" text-anchor="middle">AlphaGo 时刻</text>
      <text x="1062" y="554" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">RL 走出游戏的第一步</text>
      <text x="1062" y="574" font-family="'PingFant SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8FA3BF" text-anchor="middle">但世界仍是封闭的</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <g id="takeaway">
    <rect x="100" y="628" width="1080" height="56" rx="10" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <text x="124" y="663" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#B8C7DC">
      <tspan fill="#F59E0B" font-weight="800">关键教训：</tspan><tspan>规则系统天花板 = 知识获取瓶颈。手写规则无法穷尽真实世界 —— 这个教训在 2026 年以“幻觉”之名重现。</tspan>
    </text>
  </g>

  <text x="1220" y="695" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">03 / 15</text>
</svg>
