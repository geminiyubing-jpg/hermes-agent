<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B1426"/>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="44" width="4" height="44" rx="2" fill="#F59E0B"/>
    <text x="78" y="74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">2026 前沿四大主线（8 月单周证据）</text>
    <text x="78" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">8月10-19 · 40+ 篇论文聚类 — 同一范式正在多线同时收敛</text>
  </g>

  <g id="chartArea">
    <!-- chart-plot-area: 100,130,1180,610 -->
    <!-- quadrant axes -->
    <line x1="640" y1="130" x2="640" y2="610" stroke="#1E2D45" stroke-width="1.5"/>
    <line x1="100" y1="370" x2="1180" y2="370" stroke="#1E2D45" stroke-width="1.5"/>

    <!-- axis labels -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#5B6E8C" letter-spacing="2">
      <text x="640" y="122" text-anchor="middle">能力侧 CAPABILITY ▲</text>
      <text x="640" y="640" text-anchor="middle">治理侧 GOVERNANCE ▼</text>
      <text x="96" y="374">系统级 ◀</text>
      <text x="1184" y="374" text-anchor="end">▶ 模型级</text>
    </g>

    <!-- Q top-left: Harness-RL (focal) -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="130" y="150" width="470" height="196" rx="14" fill="#111F35" stroke="#F59E0B" stroke-width="2"/>
      <rect x="130" y="150" width="470" height="44" rx="14" fill="#2A2450"/>
      <rect x="130" y="178" width="470" height="16" fill="#2A2450"/>
      <circle cx="158" cy="172" r="6" fill="#F59E0B"/>
      <text x="176" y="178" font-size="16" font-weight="800" fill="#F59E0B">① Harness-Native Agentic RL</text>
      <text x="156" y="222" font-size="13.5" fill="#B8C7DC">8/17-18 五篇同日撞车：Agent Lightning、LEGO-RL、</text>
      <text x="156" y="244" font-size="13.5" fill="#B8C7DC">ClawGym II、Agentic ESOpt、协同进化</text>
      <text x="156" y="274" font-size="13.5" fill="#8FA3BF">训练对象从“模型”变成“整个 Agent 系统”</text>
      <text x="156" y="296" font-size="13.5" fill="#8FA3BF">ES 路线砍掉反向传播 — 消费级 GPU 可训</text>
      <text x="156" y="326" font-size="12.5" font-weight="700" fill="#22D3EE">范式信号：harness 是新的训练边界</text>
    </g>

    <!-- Q top-right: Test-time -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="680" y="150" width="470" height="196" rx="14" fill="#111F35" stroke="#22D3EE" stroke-width="1.5"/>
      <rect x="680" y="150" width="470" height="44" rx="14" fill="#16263F"/>
      <rect x="680" y="178" width="470" height="16" fill="#16263F"/>
      <circle cx="708" cy="172" r="6" fill="#22D3EE"/>
      <text x="726" y="178" font-size="16" font-weight="800" fill="#22D3EE">② Test-Time 精细化分配</text>
      <text x="706" y="222" font-size="13.5" fill="#B8C7DC">CLR 主张级证伪 · DCR 发散-收敛 · ES 覆盖率</text>
      <text x="706" y="244" font-size="13.5" fill="#B8C7DC">RLVR 难度调度（图结构在线估计）</text>
      <text x="706" y="274" font-size="13.5" fill="#8FA3BF">从“多采样”到“算力该花在哪”的元问题</text>
      <text x="706" y="326" font-size="12.5" font-weight="700" fill="#22D3EE">趋势：验证正在吃掉采样的预算</text>
    </g>

    <!-- Q bottom-left: Reliability -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="130" y="394" width="470" height="196" rx="14" fill="#111F35" stroke="#8B5CF6" stroke-width="1.5"/>
      <rect x="130" y="394" width="470" height="44" rx="14" fill="#1E2C4F"/>
      <rect x="130" y="422" width="470" height="16" fill="#1E2C4F"/>
      <circle cx="158" cy="416" r="6" fill="#8B5CF6"/>
      <text x="176" y="422" font-size="16" font-weight="800" fill="#8B5CF6">③ 可靠性经济学</text>
      <text x="156" y="466" font-size="13.5" fill="#B8C7DC">Fragility 三重脆弱性 · HarnessRisk 全生命周期</text>
      <text x="156" y="488" font-size="13.5" fill="#B8C7DC">轨迹级不确定性量化 UQ · 行为合同认证</text>
      <text x="156" y="518" font-size="13.5" fill="#8FA3BF">组合独立性被证伪：同模型两实例误差相关，</text>
      <text x="156" y="540" font-size="13.5" fill="#8FA3BF">组件级 SLO 不能直接乘出系统级 SLO</text>
      <text x="156" y="570" font-size="12.5" font-weight="700" fill="#8B5CF6">口号：先问会不会错，再问有多强</text>
    </g>

    <!-- Q bottom-right: Transaction -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="680" y="394" width="470" height="196" rx="14" fill="#111F35" stroke="#22D3EE" stroke-width="1.5"/>
      <rect x="680" y="394" width="470" height="44" rx="14" fill="#16263F"/>
      <rect x="680" y="422" width="470" height="16" fill="#16263F"/>
      <circle cx="708" cy="416" r="6" fill="#22D3EE"/>
      <text x="726" y="422" font-size="16" font-weight="800" fill="#22D3EE">④ Tool-Use 工程化</text>
      <text x="706" y="466" font-size="13.5" fill="#B8C7DC">Agentic Transaction：给 agent 上 ACID 事务</text>
      <text x="706" y="488" font-size="13.5" fill="#B8C7DC">DOCSCHISEL 优化工具文档 · UserToolBench 个性化</text>
      <text x="706" y="518" font-size="13.5" fill="#8FA3BF">长程工作流需要原子性/一致性/隔离性/持久性</text>
      <text x="706" y="540" font-size="13.5" fill="#8FA3BF">agent 从“玩具”到“生产系统”的关键一跃</text>
      <text x="706" y="570" font-size="12.5" font-weight="700" fill="#22D3EE">内审直接对口：事务边界 = 审计边界</text>
    </g>

    <!-- center chip -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <circle cx="640" cy="370" r="26" fill="#0B1426" stroke="#F59E0B" stroke-width="2"/>
      <text x="640" y="366" font-size="11" font-weight="800" fill="#F59E0B" text-anchor="middle">2026-08</text>
      <text x="640" y="382" font-size="11" font-weight="800" fill="#F59E0B" text-anchor="middle">收敛点</text>
    </g>
  </g>

  <text x="1220" y="695" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">09 / 15</text>
</svg>
