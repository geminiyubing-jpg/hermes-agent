<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B1426" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" data-pptx-pattern="lgGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#0B1426"/>
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#22D3EE" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0B1426"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#coverGlow)"/>

  <!-- Ascending neural pathway (bottom-left simple nodes to top-right constellation) -->
  <g id="pathway">
    <path d="M 120 660 C 320 640, 420 560, 560 500 S 860 380, 1010 300 S 1130 170, 1180 120"
          fill="none" stroke="url(#pathGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- simple geometric nodes at bottom -->
    <rect x="104" y="644" width="32" height="32" rx="6" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="196" y="620" width="26" height="26" rx="5" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.55"/>
    <circle cx="300" cy="608" r="11" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- mid complexity -->
    <g stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.65" fill="none">
      <path d="M 545 512 L 560 500 L 575 512 M 560 500 L 560 482"/>
      <circle cx="560" cy="500" r="6"/>
      <circle cx="700" cy="440" r="9"/>
      <circle cx="700" cy="422" r="4"/>
      <circle cx="860" cy="380" r="7"/>
      <circle cx="848" cy="366" r="4"/>
      <circle cx="874" cy="394" r="3.5"/>
    </g>
    <!-- top-right radiant constellation -->
    <g stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.8" fill="none">
      <path d="M 1120 150 L 1150 128 M 1150 128 L 1186 118 M 1150 128 L 1168 96"/>
    </g>
    <circle cx="1186" cy="118" r="7" fill="#F59E0B" fill-opacity="0.9"/>
    <circle cx="1186" cy="118" r="16" fill="url(#nodeGlow)"/>
    <circle cx="1120" cy="150" r="4.5" fill="#22D3EE" fill-opacity="0.85"/>
    <circle cx="1168" cy="96" r="3.5" fill="#8B5CF6" fill-opacity="0.85"/>
    <circle cx="1096" cy="98" r="2.5" fill="#22D3EE" fill-opacity="0.5"/>
    <circle cx="1210" cy="146" r="2.5" fill="#8B5CF6" fill-opacity="0.5"/>
  </g>

  <!-- anchor dots -->
  <g fill="#22D3EE" fill-opacity="0.35">
    <circle cx="120" cy="120" r="3"/><circle cx="1160" cy="640" r="3"/>
    <circle cx="90" cy="360" r="2.5"/><circle cx="1195" cy="400" r="2.5"/>
  </g>

  <!-- Title block (calm lower-left) -->
  <g id="title">
    <rect x="100" y="238" width="56" height="6" rx="3" fill="#22D3EE"/>
    <text x="100" y="318" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="800" fill="#E8EEF7" letter-spacing="2">
      <tspan>智能体演进之路</tspan>
    </text>
    <text x="102" y="374" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="500" fill="#22D3EE" letter-spacing="6">
      <tspan>从规则引擎到自主智能体</tspan>
    </text>
    <text x="102" y="428" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#8FA3BF" letter-spacing="1">
      <tspan>Agent Evolution Training · 基于 2026-08 arXiv / HuggingFace 一手研究综述</tspan>
    </text>
    <!-- meta chips -->
    <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600">
      <rect x="102" y="460" width="150" height="30" rx="15" fill="none" stroke="#1E2D45" stroke-width="1.5"/>
      <text x="177" y="480" fill="#8FA3BF" text-anchor="middle">1956 → 2026</text>
      <rect x="266" y="460" width="122" height="30" rx="15" fill="none" stroke="#1E2D45" stroke-width="1.5"/>
      <text x="327" y="480" fill="#8FA3BF" text-anchor="middle">四代跃迁</text>
      <rect x="402" y="460" width="140" height="30" rx="15" fill="none" stroke="#1E2D45" stroke-width="1.5"/>
      <text x="472" y="480" fill="#8FA3BF" text-anchor="middle">80+ 篇前沿论文</text>
    </g>
  </g>

  <!-- footer -->
  <text x="100" y="672" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#5B6E8C" letter-spacing="1.5">
    <tspan>内部培训 · 2026 年 8 月</tspan>
  </text>
</svg>
