<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="recurGlow" cx="72%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="#0B1426"/>
  <rect width="1280" height="720" fill="url(#recurGlow)"/>

  <!-- Recursive self-similar branching, right-of-center -->
  <g id="recursion" stroke-linecap="round" fill="none">
    <!-- trunk -->
    <path d="M 1010 620 L 1010 540" stroke="#22D3EE" stroke-width="4"/>
    <!-- gen1 -->
    <path d="M 1010 540 C 970 500, 940 470, 910 420 M 1010 540 C 1050 500, 1080 470, 1110 420" stroke="#22D3EE" stroke-width="3"/>
    <!-- gen2 -->
    <path d="M 910 420 C 880 385, 865 355, 855 315 M 910 420 C 940 390, 960 370, 975 330 M 1110 420 C 1140 385, 1155 355, 1165 315 M 1110 420 C 1080 390, 1060 370, 1045 330" stroke="#8B5CF6" stroke-width="2.2"/>
    <!-- gen3 smaller self-similar copies -->
    <g stroke="#F59E0B" stroke-width="1.6" stroke-opacity="0.85">
      <path d="M 855 315 C 835 290, 825 270, 818 245 M 855 315 C 875 295, 888 278, 896 255"/>
      <path d="M 975 330 C 958 305, 950 288, 945 262 M 975 330 C 993 310, 1005 295, 1012 272"/>
      <path d="M 1045 330 C 1028 305, 1020 288, 1015 262 M 1045 330 C 1063 310, 1075 295, 1082 272"/>
      <path d="M 1165 315 C 1145 290, 1135 270, 1128 245 M 1165 315 C 1185 295, 1198 278, 1206 255"/>
    </g>
    <!-- budding tip focal -->
    <circle cx="1206" cy="255" r="6" fill="#F59E0B"/>
    <circle cx="1206" cy="255" r="14" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="1206" cy="255" r="22" fill="none" stroke="#F59E0B" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="818" cy="245" r="3.5" fill="#F59E0B" fill-opacity="0.7"/>
    <circle cx="1012" cy="272" r="3.5" fill="#F59E0B" fill-opacity="0.6"/>
    <circle cx="896" cy="255" r="3" fill="#8B5CF6" fill-opacity="0.7"/>
    <circle cx="945" cy="262" r="3" fill="#8B5CF6" fill-opacity="0.7"/>
    <circle cx="1015" cy="262" r="3" fill="#8B5CF6" fill-opacity="0.7"/>
    <circle cx="1128" cy="245" r="3" fill="#8B5CF6" fill-opacity="0.7"/>
    <!-- root label -->
    <text x="1010" y="650" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5B6E8C" text-anchor="middle">自相似递归 · 每一代都长出更小的自己</text>
  </g>

  <!-- Chapter block left -->
  <g id="chapter">
    <text x="100" y="240" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="120" font-weight="800" fill="#16263F">04</text>
    <rect x="104" y="268" width="56" height="6" rx="3" fill="#F59E0B"/>
    <text x="100" y="340" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="800" fill="#E8EEF7">自进化纪元</text>
    <text x="102" y="390" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="500" fill="#F59E0B" letter-spacing="3">2026：训练整个系统，而不只是模型</text>
    <text x="102" y="438" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8FA3BF">能力跃迁与治理补课同步发生</text>

    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600">
      <rect x="102" y="470" width="220" height="30" rx="15" fill="none" stroke="#1E2D45" stroke-width="1.5"/>
      <text x="212" y="490" fill="#8FA3BF" text-anchor="middle">狂飙期结束</text>
      <rect x="336" y="470" width="220" height="30" rx="15" fill="none" stroke="#1E2D45" stroke-width="1.5"/>
      <text x="446" y="490" fill="#8FA3BF" text-anchor="middle">可靠性收敛期开始</text>
    </g>
  </g>
</svg>
