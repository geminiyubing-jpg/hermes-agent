<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B1426"/>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="44" width="4" height="44" rx="2" fill="#8B5CF6"/>
    <text x="78" y="74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">自主性金字塔：L0 → L5</text>
    <text x="78" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">AUTOBUS 分级 — 当前量产上限：L3，实验室：L4</text>
  </g>

  <g id="chartArea">
    <!-- chart-plot-area: 300,140,780,600 -->
    <!-- Pyramid: 6 tiers, apex up. Widths shrink upward -->
    <!-- L0 bottom -->
    <polygon points="180,600 780,600 745,545 215,545" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <text x="480" y="568" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#8FA3BF" text-anchor="middle">L0 无自主 · 固定脚本 / RPA</text>
    <text x="480" y="588" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5B6E8C" text-anchor="middle">确定性回放，零泛化</text>

    <!-- L1 -->
    <polygon points="215,545 745,545 710,490 250,490" fill="#13233C" stroke="#1E2D45" stroke-width="1.5"/>
    <text x="480" y="513" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#8FA3BF" text-anchor="middle">L1 提示自主 · 单轮建议，人执行</text>
    <text x="480" y="533" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5B6E8C" text-anchor="middle">GitHub Copilot 式补全</text>

    <!-- L2 -->
    <polygon points="250,490 710,490 675,435 285,435" fill="#16263F" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="480" y="458" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#22D3EE" text-anchor="middle">L2 工具自主 · ReAct 循环，人审批</text>
    <text x="480" y="478" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5B6E8C" text-anchor="middle">ChatGPT + 工具 · 今天的主流</text>

    <!-- L3 -->
    <polygon points="285,435 675,435 640,380 320,380" fill="#1A2C4A" stroke="#22D3EE" stroke-width="2"/>
    <text x="480" y="403" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="middle">L3 流程自主 · 多步任务，边界内自由</text>
    <text x="480" y="423" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8FA3BF" text-anchor="middle">Devin / Claude Code · 量产上限</text>

    <!-- L4 -->
    <polygon points="320,380 640,380 600,325 360,325" fill="#1E2C4F" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="480" y="348" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="800" fill="#8B5CF6" text-anchor="middle">L4 目标自主 · 自分解、自纠错</text>
    <text x="480" y="368" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8FA3BF" text-anchor="middle">实验室阶段 · 长任务成功率仍低</text>

    <!-- L5 apex -->
    <polygon points="360,325 600,325 480,260" fill="#2A2450" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="480" y="298" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="800" fill="#F59E0B" text-anchor="middle">L5 价值自主</text>
    <text x="480" y="316" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#8FA3BF" text-anchor="middle">哲学问题，非工程问题</text>

    <!-- side annotations (right) -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <line x1="790" y1="372" x2="880" y2="372" stroke="#1E2D45" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="896" y="366" font-size="14" font-weight="700" fill="#E8EEF7">2026 现状</text>
      <text x="896" y="388" font-size="12.5" fill="#8FA3BF">L3 已量产（编码/客服/审计辅助）</text>
      <text x="896" y="408" font-size="12.5" fill="#8FA3BF">L4 卡在可靠性：长任务成功率</text>
      <text x="896" y="428" font-size="12.5" fill="#8FA3BF">随步数指数衰减</text>

      <line x1="600" y1="285" x2="880" y2="285" stroke="#1E2D45" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="896" y="279" font-size="14" font-weight="700" fill="#F59E0B">关键瓶颈</text>
      <text x="896" y="301" font-size="12.5" fill="#8FA3BF">不是智力，是可靠性经济：</text>
      <text x="896" y="321" font-size="12.5" fill="#8FA3BF">错误预算 × 责任归属</text>
    </g>

    <!-- left annotation -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <line x1="180" y1="600" x2="120" y2="600" stroke="#1E2D45" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="114" y="588" font-size="13" font-weight="700" fill="#E8EEF7" text-anchor="end">每上一级</text>
      <text x="114" y="608" font-size="12" fill="#8FA3BF" text-anchor="end">自主性 ×10</text>
      <text x="114" y="626" font-size="12" fill="#8FA3BF" text-anchor="end">信任成本 ×10</text>
    </g>
  </g>

  <!-- Bottom takeaway -->
  <rect x="100" y="636" width="1080" height="52" rx="10" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
  <text x="124" y="668" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" font-weight="600" fill="#B8C7DC">
    <tspan fill="#F59E0B" font-weight="800">分级启示：</tspan><tspan>爬金字塔的代价不是模型能力，而是每级新增的治理成本 — L3 的审批门、L4 的审计闭环、L5 的价值对齐。</tspan>
  </text>

  <text x="1220" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">07 / 15</text>
</svg>
