<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B1426"/>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="44" width="4" height="44" rx="2" fill="#22D3EE"/>
    <text x="78" y="74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">给我们的五条启示</text>
    <text x="78" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">从 70 年演进史 + 2026-08 前沿反推行动项</text>
  </g>

  <g id="insights" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- 1 -->
    <rect x="100" y="130" width="1080" height="88" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <circle cx="146" cy="174" r="22" fill="#16263F" stroke="#22D3EE" stroke-width="2"/>
    <text x="146" y="181" font-size="18" font-weight="800" fill="#22D3EE" text-anchor="middle">1</text>
    <text x="190" y="162" font-size="16" font-weight="800" fill="#E8EEF7">天花板从模型转移到系统</text>
    <text x="190" y="190" font-size="13.5" fill="#8FA3BF">harness（工具+记忆+编排）现在是能力瓶颈与攻击面的双重所在 — 竞争力在系统设计，不在选模型</text>

    <!-- 2 -->
    <rect x="100" y="234" width="1080" height="88" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <circle cx="146" cy="278" r="22" fill="#16263F" stroke="#22D3EE" stroke-width="2"/>
    <text x="146" y="285" font-size="18" font-weight="800" fill="#22D3EE" text-anchor="middle">2</text>
    <text x="190" y="266" font-size="16" font-weight="800" fill="#E8EEF7">L3 是甜点位：边界内自主 + 人工审批门</text>
    <text x="190" y="294" font-size="13.5" fill="#8FA3BF">L4 的长任务成功率随步数指数衰减尚待解 — 生产落地先从 L3 场景切入（编码/客服/审计辅助）</text>

    <!-- 3 -->
    <rect x="100" y="338" width="1080" height="88" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <circle cx="146" cy="382" r="22" fill="#16263F" stroke="#F59E0B" stroke-width="2"/>
    <text x="146" y="389" font-size="18" font-weight="800" fill="#F59E0B" text-anchor="middle">3</text>
    <text x="190" y="370" font-size="16" font-weight="800" fill="#E8EEF7">先问错误预算，再谈能力上限</text>
    <text x="190" y="398" font-size="13.5" fill="#8FA3BF">可靠性经济学是 2026 主旋律 — 任何 agent 上线方案应先写“错误预算表”：错误率容忍线、补偿机制、责任人</text>

    <!-- 4 -->
    <rect x="100" y="442" width="1080" height="88" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <circle cx="146" cy="486" r="22" fill="#16263F" stroke="#F59E0B" stroke-width="2"/>
    <text x="146" y="493" font-size="18" font-weight="800" fill="#F59E0B" text-anchor="middle">4</text>
    <text x="190" y="474" font-size="16" font-weight="800" fill="#E8EEF7">简单方案先验证：原始数据可能就够了</text>
    <text x="190" y="502" font-size="13.5" fill="#8FA3BF">“原始聊天记录检索 ≈ 结构化记忆”的实证提醒 — 上复杂架构前先测简单基线，避免为叙事付费</text>

    <!-- 5 -->
    <rect x="100" y="546" width="1080" height="88" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <circle cx="146" cy="590" r="22" fill="#16263F" stroke="#8B5CF6" stroke-width="2"/>
    <text x="146" y="597" font-size="18" font-weight="800" fill="#8B5CF6" text-anchor="middle">5</text>
    <text x="190" y="578" font-size="16" font-weight="800" fill="#E8EEF7">自学习系统必须带回归审计</text>
    <text x="190" y="606" font-size="13.5" fill="#8FA3BF">安全漂移审计（8/18 金融 agent 案例）是前置课 — 自进化上线 = 回归基线 + 漂移监控 + 接口变更检测三件套</text>
  </g>

  <text x="1220" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">14 / 15</text>
</svg>
