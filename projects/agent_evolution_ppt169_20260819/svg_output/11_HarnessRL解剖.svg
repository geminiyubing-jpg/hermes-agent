<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B1426"/>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="44" width="4" height="44" rx="2" fill="#F59E0B"/>
    <text x="78" y="74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">Harness-Native RL：范式转移的解剖</text>
    <text x="78" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">为什么“训练整个系统”突然可行了</text>
  </g>

  <!-- Before/After comparison -->
  <g id="compare" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Before -->
    <rect x="100" y="130" width="520" height="260" rx="14" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <text x="130" y="168" font-size="16" font-weight="800" fill="#8FA3BF">旧范式：训练模型，手搭系统</text>
    <g>
      <rect x="140" y="192" width="150" height="52" rx="8" fill="#0B1426" stroke="#3D5270" stroke-width="1.5"/>
      <text x="215" y="223" font-size="14" font-weight="700" fill="#8FA3BF" text-anchor="middle">预训练模型</text>
      <rect x="340" y="192" width="150" height="52" rx="8" fill="#0B1426" stroke="#3D5270" stroke-width="1.5"/>
      <text x="415" y="223" font-size="14" font-weight="700" fill="#8FA3BF" text-anchor="middle">SFT / RLHF</text>
      <rect x="140" y="270" width="150" height="52" rx="8" fill="#0B1426" stroke="#3D5270" stroke-width="1.5"/>
      <text x="215" y="301" font-size="14" font-weight="700" fill="#8FA3BF" text-anchor="middle">手工 harness</text>
      <rect x="340" y="270" width="150" height="52" rx="8" fill="#0B1426" stroke="#3D5270" stroke-width="1.5"/>
      <text x="415" y="294" font-size="14" font-weight="700" fill="#8FA3BF" text-anchor="middle">工具+记忆+编排</text>
      <text x="415" y="312" font-size="11" fill="#5B6E8C" text-anchor="middle">人工设计，与训练脱节</text>
      <line x1="290" y1="218" x2="340" y2="218" stroke="#3D5270" stroke-width="2"/>
      <line x1="415" y1="244" x2="415" y2="270" stroke="#3D5270" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="130" y="360" font-size="13" fill="#5B6E8C">痛点：harness 与模型能力错配 — 模型越强，手工系统越是瓶颈</text>
    </g>

    <!-- After -->
    <rect x="660" y="130" width="520" height="260" rx="14" fill="#1A2C4A" stroke="#F59E0B" stroke-width="2"/>
    <text x="690" y="168" font-size="16" font-weight="800" fill="#F59E0B">新范式：整个系统进训练循环</text>
    <g>
      <rect x="700" y="192" width="180" height="52" rx="8" fill="#0B1426" stroke="#22D3EE" stroke-width="1.8"/>
      <text x="790" y="223" font-size="14" font-weight="700" fill="#22D3EE" text-anchor="middle">Agent 系统（黑盒环境）</text>
      <rect x="940" y="192" width="180" height="52" rx="8" fill="#0B1426" stroke="#F59E0B" stroke-width="1.8"/>
      <text x="1030" y="223" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="middle">RL 训练器（外环）</text>
      <!-- feedback loop -->
      <path d="M 880 210 L 940 210" stroke="#F59E0B" stroke-width="2"/>
      <path d="M 940 236 C 910 258, 870 258, 820 244 L 800 236" stroke="#22D3EE" stroke-width="2" fill="none"/>
      <rect x="700" y="270" width="420" height="52" rx="8" fill="#0B1426" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="910" y="292" font-size="14" font-weight="700" fill="#8B5CF6" text-anchor="middle">轨迹 → 奖励 → 策略更新（ES 或 PG）</text>
      <text x="910" y="311" font-size="11" fill="#8FA3BF" text-anchor="middle">LLM 当奖励/评估端点（Agent Lightning 路线）</text>
      <text x="690" y="360" font-size="13" fill="#B8C7DC">解耦架构：任意 harness ↔ 任意训练器，动作空间离散化对齐</text>
    </g>

    <!-- arrow between -->
    <path d="M 620 260 L 660 260" stroke="#F59E0B" stroke-width="3"/>
    <path d="M 652 252 L 662 260 L 652 268 Z" fill="#F59E0B"/>
  </g>

  <!-- Bottom: two routes + significance -->
  <g id="routes" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="100" y="420" width="520" height="150" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <text x="130" y="456" font-size="15" font-weight="800" fill="#22D3EE">路线 A：黑盒 RL on Harness</text>
    <text x="130" y="484" font-size="13.5" fill="#B8C7DC">Agent Lightning v1.0 / LEGO-RL / ClawGym II</text>
    <text x="130" y="508" font-size="13.5" fill="#8FA3BF">无需改 harness 内部 — 把系统当环境，</text>
    <text x="130" y="530" font-size="13.5" fill="#8FA3BF">离散化动作空间后标准 RL 循环</text>
    <text x="130" y="556" font-size="12.5" font-weight="700" fill="#22D3EE">适合：已有复杂系统，不想重写</text>

    <rect x="660" y="420" width="520" height="150" rx="12" fill="#111F35" stroke="#1E2D45" stroke-width="1.5"/>
    <text x="690" y="456" font-size="15" font-weight="800" fill="#8B5CF6">路线 B：进化策略 ES（无梯度）</text>
    <text x="690" y="484" font-size="13.5" fill="#B8C7DC">Agentic ESOpt / ES for Coverage</text>
    <text x="690" y="508" font-size="13.5" fill="#8FA3BF">放弃反向传播 — 显存需求砍到消费级 GPU，</text>
    <text x="690" y="530" font-size="13.5" fill="#8FA3BF">长轨迹稀疏奖励场景反而更稳</text>
    <text x="690" y="556" font-size="12.5" font-weight="700" fill="#F59E0B">意义：Mac Mini 级硬件也能做 agent 后训练</text>
  </g>

  <!-- takeaway -->
  <rect x="100" y="596" width="1080" height="64" rx="10" fill="#111F35" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
  <text x="124" y="634" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" font-weight="600" fill="#B8C7DC">
    <tspan fill="#F59E0B" font-weight="800">死结已解：</tspan><tspan>此前 agentic RL 卡在长轨迹+分支交互+稀疏奖励让 backprop 栈不实用 — 2026-08 两条路线同时给出工程解，五篇同日撞车即共识形成的标志。</tspan>
  </text>

  <text x="1220" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">11 / 15</text>
</svg>
