<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="endGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid3" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#22D3EE" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#0B1426"/>
  <rect width="1280" height="720" fill="url(#grid3)"/>
  <rect width="1280" height="720" fill="url(#endGlow)"/>

  <!-- horizon path ascending to question mark node -->
  <g id="horizon">
    <path d="M 100 640 C 300 620, 500 560, 700 480 S 1000 330, 1150 220" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6,5"/>
    <circle cx="700" cy="480" r="5" fill="#22D3EE" fill-opacity="0.6"/>
    <circle cx="940" cy="360" r="4" fill="#8B5CF6" fill-opacity="0.5"/>
    <!-- open question node -->
    <circle cx="1150" cy="220" r="9" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="1150" cy="220" r="18" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="1150" cy="220" r="28" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.15"/>
  </g>

  <!-- Center message -->
  <g id="close" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="440" y="256" width="56" height="6" rx="3" fill="#22D3EE"/>
    <text x="440" y="330" font-size="48" font-weight="800" fill="#E8EEF7">下一个十年，从 L4 开始</text>
    <text x="442" y="384" font-size="20" font-weight="500" fill="#22D3EE" letter-spacing="2">而治理，从今天开始</text>
    <text x="442" y="440" font-size="15" fill="#8FA3BF">Agent 演进史告诉我们：每次能力跃迁，都会重新提出同一个问题 —</text>
    <text x="442" y="466" font-size="15" fill="#8FA3BF">自主性升级时，错误由谁负责？答案的速度，决定落地的速度。</text>
  </g>

  <!-- footer -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="100" y="660" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="1">内部培训 · 2026 年 8 月 · 数据源：arXiv API + HuggingFace Daily Papers（80+ 篇，8月10-19 窗口）</text>
    <text x="1180" y="660" font-size="13" font-weight="800" fill="#3D5270" text-anchor="end">THANKS · Q&amp;A</text>
  </g>
</svg>
