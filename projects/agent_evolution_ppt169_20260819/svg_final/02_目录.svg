<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid2" data-pptx-pattern="lgGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#0B1426" />
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#22D3EE" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#0B1426" />
  <rect width="1280" height="720" fill="url(#grid2)" />

  
  <g id="header">
    <path fill="#22D3EE" d="M82,64 H82 A2,2 0 0 1 84,66 V106 A2,2 0 0 1 82,108 H82 A2,2 0 0 1 80,106 V66 A2,2 0 0 1 82,64 Z" />
    <text x="98" y="94" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="800" fill="#E8EEF7">目录</text>
    <text x="98" y="120" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="3">CONTENTS · 约 40 分钟</text>
  </g>

  
  <g id="rail">
    <line x1="130" y1="190" x2="130" y2="640" stroke="#1E2D45" stroke-width="2" />
    <line x1="130" y1="190" x2="130" y2="330" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.6" />
  </g>

  
  <g id="item1">
    <circle cx="130" cy="206" r="10" fill="#0B1426" stroke="#22D3EE" stroke-width="2.5" />
    <text x="160" y="200" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#22D3EE" letter-spacing="2">01 · 前史</text>
    <text x="160" y="224" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#E8EEF7">三个源头：符号、行为、强化</text>
    <text x="160" y="248" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8FA3BF">1956-2015 · 规则系统的天花板与 RL 的伏笔</text>
  </g>
  
  <g id="item2">
    <circle cx="130" cy="316" r="10" fill="#0B1426" stroke="#22D3EE" stroke-width="2.5" />
    <text x="160" y="310" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#22D3EE" letter-spacing="2">02 · LLM 纪元</text>
    <text x="160" y="334" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#E8EEF7">语言模型成为 Agent 的大脑</text>
    <text x="160" y="358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8FA3BF">2022-2024 · ReAct 范式 / 记忆与规划补全</text>
  </g>
  
  <g id="item3">
    <circle cx="130" cy="426" r="10" fill="#0B1426" stroke="#8B5CF6" stroke-width="2.5" />
    <text x="160" y="420" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#8B5CF6" letter-spacing="2">03 · 协作纪元</text>
    <text x="160" y="444" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#E8EEF7">多智能体系统与能力分层</text>
    <text x="160" y="468" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8FA3BF">2024-2025 · L0-L5 自主性金字塔 · 商业化落地</text>
  </g>
  
  <g id="item4">
    <circle cx="130" cy="536" r="10" fill="#0B1426" stroke="#F59E0B" stroke-width="2.5" />
    <text x="160" y="530" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#F59E0B" letter-spacing="2">04 · 自进化纪元</text>
    <text x="160" y="554" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#E8EEF7">2026 前沿：训练整个系统</text>
    <text x="160" y="578" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8FA3BF">Harness-Native RL / 可靠性经济学 / 四大主线</text>
  </g>

  
  <g id="takeaway">
    <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M716,190 H1184 A16,16 0 0 1 1200,206 V624 A16,16 0 0 1 1184,640 H716 A16,16 0 0 1 700,624 V206 A16,16 0 0 1 716,190 Z" />
    <path fill="#16263F" d="M716,190 H1184 A16,16 0 0 1 1200,206 V246 A16,16 0 0 1 1184,262 H716 A16,16 0 0 1 700,246 V206 A16,16 0 0 1 716,190 Z" />
    <rect x="700" y="246" width="500" height="16" fill="#16263F" />
    <text x="728" y="234" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#E8EEF7">贯穿全场的一个问题</text>
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#B8C7DC">
      <text x="728" y="306">“智能体的自主性每提升一级，</text>
      <text x="728" y="334">它的错误由谁负责？”</text>
    </g>
    <line x1="728" y1="368" x2="1172" y2="368" stroke="#1E2D45" stroke-width="1.5" />
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8FA3BF">
      <text x="728" y="404">这条主线同时驱动着两件事：</text>
      <text x="728" y="440">▸ 能力侧 — 从工具调用到自我改进的技术跃迁</text>
      <text x="728" y="472">▸ 治理侧 — 从提示工程到行为合同、安全审计</text>
      <text x="728" y="516">2026 年的答案是：能力狂飙期结束，</text>
      <text x="728" y="544">工程化收敛期开始 —— 每个系统都要回答</text>
      <text x="728" y="572">“错误预算是多少，谁签字担保”。</text>
    </g>
    <text x="728" y="616" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#22D3EE" letter-spacing="1">AGENT EVOLUTION · 2026-08</text>
  </g>
</svg>