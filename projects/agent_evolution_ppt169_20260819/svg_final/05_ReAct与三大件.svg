<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B1426" />

  
  <g id="header">
    <path fill="#22D3EE" d="M62,48 H62 A2,2 0 0 1 64,50 V90 A2,2 0 0 1 62,92 H62 A2,2 0 0 1 60,90 V50 A2,2 0 0 1 62,48 Z" />
    <text x="78" y="78" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">ReAct：把“思考-行动”写进提示词</text>
    <text x="78" y="102" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">REASON + ACT — 2022 论文 → 2024 事实标准</text>
  </g>

  
  <g id="reactLoop">
    <text x="100" y="150" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#22D3EE" letter-spacing="1">核心循环</text>
    
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
      
      <path fill="#111F35" stroke="#22D3EE" stroke-width="2" d="M162,176 H308 A12,12 0 0 1 320,188 V228 A12,12 0 0 1 308,240 H162 A12,12 0 0 1 150,228 V188 A12,12 0 0 1 162,176 Z" />
      <text x="235" y="203" font-size="17" font-weight="800" fill="#22D3EE">思考 Thought</text>
      <text x="235" y="226" font-size="12" fill="#8FA3BF">拆解目标 · 选择工具</text>
      
      <path fill="#111F35" stroke="#F59E0B" stroke-width="2" d="M342,300 H488 A12,12 0 0 1 500,312 V352 A12,12 0 0 1 488,364 H342 A12,12 0 0 1 330,352 V312 A12,12 0 0 1 342,300 Z" />
      <text x="415" y="327" font-size="17" font-weight="800" fill="#F59E0B">行动 Action</text>
      <text x="415" y="350" font-size="12" fill="#8FA3BF">调用工具 · 结构化参数</text>
      
      <path fill="#111F35" stroke="#8B5CF6" stroke-width="2" d="M162,424 H308 A12,12 0 0 1 320,436 V476 A12,12 0 0 1 308,488 H162 A12,12 0 0 1 150,476 V436 A12,12 0 0 1 162,424 Z" />
      <text x="235" y="451" font-size="17" font-weight="800" fill="#8B5CF6">观察 Observation</text>
      <text x="235" y="474" font-size="12" fill="#8FA3BF">读取结果 · 更新认知</text>
      
      <path fill="#16263F" stroke="#1E2D45" stroke-width="2" d="M-8,300 H138 A12,12 0 0 1 150,312 V352 A12,12 0 0 1 138,364 H-8 A12,12 0 0 1 -20,352 V312 A12,12 0 0 1 -8,300 Z" />
      <text x="65" y="327" font-size="17" font-weight="800" fill="#E8EEF7">答案 Answer</text>
      <text x="65" y="350" font-size="12" fill="#5B6E8C">终止条件</text>
    </g>
    
    <g stroke="#22D3EE" stroke-width="2" fill="none" stroke-opacity="0.7">
      <path d="M 300 208 Q 380 220 400 292" marker-end="url(#arr)" />
      <path d="M 400 372 Q 380 440 300 452" marker-end="url(#arr)" />
      <path d="M 150 456 Q 70 440 60 372" marker-end="url(#arr)" />
    </g>
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <path d="M 0 0 L 8 4 L 0 8 Z" fill="#22D3EE" />
      </marker>
    </defs>
    <text x="235" y="530" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8FA3BF" text-anchor="middle">循环直到任务完成 — 全部由提示词驱动，零训练</text>
  </g>

  
  <g id="components">
    <text x="560" y="150" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#22D3EE" letter-spacing="1">Agent 三大件（2023-24 补全）</text>
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M572,170 H1208 A12,12 0 0 1 1220,182 V244 A12,12 0 0 1 1208,256 H572 A12,12 0 0 1 560,244 V182 A12,12 0 0 1 572,170 Z" />
      <rect x="560" y="170" width="6" height="86" fill="#22D3EE" />
      <text x="588" y="200" font-size="16" font-weight="800" fill="#E8EEF7">记忆 Memory</text>
      <text x="588" y="226" font-size="13" fill="#8FA3BF">短期：上下文窗口 · 长期：向量库 RAG · 2026 实测：原始聊天记录直接检索 ≈ 结构化记忆</text>

      <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M572,272 H1208 A12,12 0 0 1 1220,284 V346 A12,12 0 0 1 1208,358 H572 A12,12 0 0 1 560,346 V284 A12,12 0 0 1 572,272 Z" />
      <rect x="560" y="272" width="6" height="86" fill="#F59E0B" />
      <text x="588" y="302" font-size="16" font-weight="800" fill="#E8EEF7">规划 Planning</text>
      <text x="588" y="328" font-size="13" fill="#8FA3BF">任务分解 Task Decomposition · 反思 Reflexion · 自我批评 Self-Critique</text>

      <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M572,374 H1208 A12,12 0 0 1 1220,386 V448 A12,12 0 0 1 1208,460 H572 A12,12 0 0 1 560,448 V386 A12,12 0 0 1 572,374 Z" />
      <rect x="560" y="374" width="6" height="86" fill="#8B5CF6" />
      <text x="588" y="404" font-size="16" font-weight="800" fill="#E8EEF7">工具 Tools</text>
      <text x="588" y="430" font-size="13" fill="#8FA3BF">Function Calling 官方化（2023-06）· MCP 协议（2024-11）— 工具生态标准化</text>
    </g>
  </g>

  
  <g id="lesson">
    <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M112,560 H1208 A12,12 0 0 1 1220,572 V648 A12,12 0 0 1 1208,660 H112 A12,12 0 0 1 100,648 V572 A12,12 0 0 1 112,560 Z" />
    <path fill="#16263F" d="M112,560 H1208 A12,12 0 0 1 1220,572 V590 A12,12 0 0 1 1208,602 H112 A12,12 0 0 1 100,590 V572 A12,12 0 0 1 112,560 Z" />
    <rect x="100" y="586" width="1120" height="16" fill="#16263F" />
    <text x="128" y="588" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="800" fill="#F59E0B">AutoGPT 的教训（2023）</text>
    <text x="128" y="630" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B8C7DC">全自动幻想：给 GPT-4 一个目标就让它自己跑 → 死循环、漂移、烧钱。教训：没有环境反馈闭环的自主性是空中楼阁。</text>
    <text x="128" y="652" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B8C7DC">→ 2024 年收敛：人机协同（Human-in-the-loop）+ 受限自主（受限工具集 + 审批门）成为工程共识。</text>
  </g>

  <text x="1220" y="695" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">05 / 15</text>
</svg>