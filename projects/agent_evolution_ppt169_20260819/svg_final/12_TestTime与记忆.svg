<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B1426" />

  
  <g id="header">
    <path fill="#22D3EE" d="M62,44 H62 A2,2 0 0 1 64,46 V86 A2,2 0 0 1 62,88 H62 A2,2 0 0 1 60,86 V46 A2,2 0 0 1 62,44 Z" />
    <text x="78" y="74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">Test-Time 与记忆：算力与知识的再分配</text>
    <text x="78" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">验证吃掉采样 · 原始记录挑战结构化</text>
  </g>

  
  <g id="testtime" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="100" y="146" font-size="15" font-weight="700" fill="#22D3EE" letter-spacing="1">Test-Time 算力分配的迁移</text>

    
    <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M112,166 H578 A12,12 0 0 1 590,178 V274 A12,12 0 0 1 578,286 H112 A12,12 0 0 1 100,274 V178 A12,12 0 0 1 112,166 Z" />
    <text x="126" y="196" font-size="14" font-weight="700" fill="#8FA3BF">2024-25：多采样为主</text>
    
    <path fill="#3D5270" d="M132,212 H558 A6,6 0 0 1 564,218 V234 A6,6 0 0 1 558,240 H132 A6,6 0 0 1 126,234 V218 A6,6 0 0 1 132,212 Z" />
    <path fill="#22D3EE" fill-opacity="0.45" d="M132,212 H450 A6,6 0 0 1 456,218 V234 A6,6 0 0 1 450,240 H132 A6,6 0 0 1 126,234 V218 A6,6 0 0 1 132,212 Z" />
    <text x="291" y="231" font-size="12" font-weight="700" fill="#0B1426" text-anchor="middle">采样 75%</text>
    <text x="495" y="231" font-size="11" fill="#8FA3BF">验证 25%</text>
    <text x="126" y="264" font-size="12" fill="#5B6E8C">CoT 自洽投票：生成 k 个答案，选多数 — 贵且浅</text>

    
    <path fill="#111F35" stroke="#22D3EE" stroke-width="1.5" d="M112,304 H578 A12,12 0 0 1 590,316 V412 A12,12 0 0 1 578,424 H112 A12,12 0 0 1 100,412 V316 A12,12 0 0 1 112,304 Z" />
    <text x="126" y="334" font-size="14" font-weight="700" fill="#22D3EE">2026：定向验证为主</text>
    <path fill="#3D5270" d="M132,350 H558 A6,6 0 0 1 564,356 V372 A6,6 0 0 1 558,378 H132 A6,6 0 0 1 126,372 V356 A6,6 0 0 1 132,350 Z" />
    <path fill="#22D3EE" fill-opacity="0.85" d="M132,350 H470 A6,6 0 0 1 476,356 V372 A6,6 0 0 1 470,378 H132 A6,6 0 0 1 126,372 V356 A6,6 0 0 1 132,350 Z" />
    <text x="300" y="369" font-size="12" font-weight="700" fill="#0B1426" text-anchor="middle">定向验证 80%</text>
    <text x="495" y="369" font-size="11" fill="#8FA3BF">20%</text>
    <text x="126" y="402" font-size="12" fill="#8FA3BF">CLR 主张级证伪：对每个 claim 定向花算力证伪 — training-free</text>

    
    <text x="100" y="462" font-size="13" font-weight="700" fill="#E8EEF7">本周代表论文</text>
    <g font-size="12.5" fill="#8FA3BF">
      <text x="100" y="488">▸ CLR：Claim-Level Reliability（8/12）— 主张级可靠性</text>
      <text x="100" y="512">▸ DCR：发散-收敛两阶段（8/15）— 探索多候选→结构化综合</text>
      <text x="100" y="536">▸ RLVR 难度调度（8/18）— 图结构在线估计，按难度分配 rollout</text>
      <text x="100" y="560">▸ ES for Coverage（8/13）— 进化策略提升解空间覆盖率</text>
    </g>
  </g>

  
  <g id="memory" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="660" y="146" font-size="15" font-weight="700" fill="#8B5CF6" letter-spacing="1">记忆研究的两个冲击波</text>

    
    <path fill="#111F35" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.6" d="M672,166 H1168 A12,12 0 0 1 1180,178 V304 A12,12 0 0 1 1168,316 H672 A12,12 0 0 1 660,304 V178 A12,12 0 0 1 672,166 Z" />
    <text x="688" y="198" font-size="15" font-weight="800" fill="#F59E0B">冲击一：结构化优势被质疑</text>
    <text x="688" y="226" font-size="13.5" fill="#B8C7DC">“When Your Agent Opens the Chat App”（8/13）：</text>
    <text x="688" y="250" font-size="13.5" fill="#B8C7DC">agent 直接检索原始聊天记录 ≈ 摘要/嵌入/树/图谱方案</text>
    <text x="688" y="278" font-size="12.5" fill="#8FA3BF">打脸一批 memory 初创叙事 — 结构化收益远小于宣称</text>
    <text x="688" y="302" font-size="12.5" font-weight="700" fill="#22D3EE">对内审：简单方案先验证，再谈复杂架构</text>

    
    <path fill="#111F35" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.6" d="M672,334 H1168 A12,12 0 0 1 1180,346 V472 A12,12 0 0 1 1168,484 H672 A12,12 0 0 1 660,472 V346 A12,12 0 0 1 672,334 Z" />
    <text x="688" y="366" font-size="15" font-weight="800" fill="#8B5CF6">冲击二：跨 agent 记忆协议出现</text>
    <text x="688" y="394" font-size="13.5" fill="#B8C7DC">MELD（8/17）：两 agent 记忆如何对齐“同一件事的</text>
    <text x="688" y="418" font-size="13.5" fill="#B8C7DC">两种说法”、消解矛盾知识 — 分布式 CAP 重演</text>
    <text x="688" y="446" font-size="12.5" fill="#8FA3BF">配套：MemoryLake/MemoryArena 评测基准（8/14-15）</text>
    <text x="688" y="470" font-size="12.5" fill="#8FA3BF">隐私感知记忆：What to Remember, What to Reveal（8/17）</text>

    
    <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M672,502 H1168 A12,12 0 0 1 1180,514 V590 A12,12 0 0 1 1168,602 H672 A12,12 0 0 1 660,590 V514 A12,12 0 0 1 672,502 Z" />
    <text x="688" y="534" font-size="13.5" font-weight="700" fill="#E8EEF7">效率侧同步进化</text>
    <text x="688" y="560" font-size="12.5" fill="#8FA3BF">LycheeMemory V2（8/13）：语义分段级合并替代每轮 LLM 摘要，</text>
    <text x="688" y="582" font-size="12.5" fill="#8FA3BF">记忆维护 token 成本大幅下降</text>
  </g>

  
  <path fill="#111F35" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4" d="M110,596 H630 A10,10 0 0 1 640,606 V650 A10,10 0 0 1 630,660 H110 A10,10 0 0 1 100,650 V606 A10,10 0 0 1 110,596 Z" />
  <text x="124" y="632" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#B8C7DC">
    <tspan fill="#22D3EE" font-weight="800">同一枚硬币：</tspan><tspan>test-time（验证&gt;采样）与 RLVR（验证器比策略值钱）同时收敛</tspan>
  </text>

  <text x="1220" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">12 / 15</text>
</svg>