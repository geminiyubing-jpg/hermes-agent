<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0B1426" />

  
  <g id="header">
    <path fill="#8B5CF6" d="M62,44 H62 A2,2 0 0 1 64,46 V86 A2,2 0 0 1 62,88 H62 A2,2 0 0 1 60,86 V46 A2,2 0 0 1 62,44 Z" />
    <text x="78" y="74" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#E8EEF7">可靠性经济学：自进化时代的审计课</text>
    <text x="78" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#5B6E8C" letter-spacing="2">FRAGILITY · HARNESSRISK · CONTRACTS — 2026-08 集中爆发</text>
  </g>

  
  <g id="pillars" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    
    <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M114,136 H426 A14,14 0 0 1 440,150 V352 A14,14 0 0 1 426,366 H114 A14,14 0 0 1 100,352 V150 A14,14 0 0 1 114,136 Z" />
    <path fill="#1E2C4F" d="M114,136 H426 A14,14 0 0 1 440,150 V170 A14,14 0 0 1 426,184 H114 A14,14 0 0 1 100,170 V150 A14,14 0 0 1 114,136 Z" />
    <rect x="100" y="166" width="340" height="18" fill="#1E2C4F" />
    <text x="128" y="167" font-size="15" font-weight="800" fill="#8B5CF6">脆弱性解剖</text>
    <g font-size="12.5" fill="#B8C7DC">
      <text x="128" y="212">On the Fragility of Self-Improving</text>
      <text x="128" y="232">Agents（8/18）⭐</text>
      <text x="128" y="262" fill="#8FA3BF">记忆型自改进的三重脆弱：</text>
      <text x="128" y="286">① 方差 — 同配置不同跑差异显著</text>
      <text x="128" y="310">② 任务顺序 — 换序结果统计显著不同</text>
      <text x="128" y="334">③ 欠约束 — 改进方向无界</text>
    </g>
    <text x="128" y="356" font-size="12" font-weight="700" fill="#F59E0B">审计含义：自改进 ≠ 可复现</text>

    
    <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M484,136 H796 A14,14 0 0 1 810,150 V352 A14,14 0 0 1 796,366 H484 A14,14 0 0 1 470,352 V150 A14,14 0 0 1 484,136 Z" />
    <path fill="#1E2C4F" d="M484,136 H796 A14,14 0 0 1 810,150 V170 A14,14 0 0 1 796,184 H484 A14,14 0 0 1 470,170 V150 A14,14 0 0 1 484,136 Z" />
    <rect x="470" y="166" width="340" height="18" fill="#1E2C4F" />
    <text x="498" y="167" font-size="15" font-weight="800" fill="#8B5CF6">harness 成为攻击面</text>
    <g font-size="12.5" fill="#B8C7DC">
      <text x="498" y="212">HarnessRisk（8/18）— 首个</text>
      <text x="498" y="232">agent harness 全生命周期安全基准</text>
      <text x="498" y="262" fill="#8FA3BF">攻击面从模型扩到系统件：</text>
      <text x="498" y="286">① 工具权限边界</text>
      <text x="498" y="310">② 持久状态（记忆/缓存）投毒</text>
      <text x="498" y="334">③ 扩展与插件供应链</text>
    </g>
    <text x="498" y="356" font-size="12" font-weight="700" fill="#F59E0B">审计含义：系统件纳入检查范围</text>

    
    <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M854,136 H1166 A14,14 0 0 1 1180,150 V352 A14,14 0 0 1 1166,366 H854 A14,14 0 0 1 840,352 V150 A14,14 0 0 1 854,136 Z" />
    <path fill="#1E2C4F" d="M854,136 H1166 A14,14 0 0 1 1180,150 V170 A14,14 0 0 1 1166,184 H854 A14,14 0 0 1 840,170 V150 A14,14 0 0 1 854,136 Z" />
    <rect x="840" y="166" width="340" height="18" fill="#1E2C4F" />
    <text x="868" y="167" font-size="15" font-weight="800" fill="#8B5CF6">组合谬误被证伪</text>
    <g font-size="12.5" fill="#B8C7DC">
      <text x="868" y="212">Agent Behavioral Contracts II</text>
      <text x="868" y="232">（8/13）🔥</text>
      <text x="868" y="262" fill="#8FA3BF">“组件级 SLO 相乘 = 系统级 SLO”</text>
      <text x="868" y="286">的假设不成立：</text>
      <text x="868" y="310">同一模型两实例在 handoff 中误差相关</text>
      <text x="868" y="334">（条件独立性破坏）</text>
    </g>
    <text x="868" y="356" font-size="12" font-weight="700" fill="#F59E0B">审计含义：必须整体测，不能拆开签</text>
  </g>

  
  <g id="case" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#111F35" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.5" d="M114,396 H1166 A14,14 0 0 1 1180,410 V550 A14,14 0 0 1 1166,564 H114 A14,14 0 0 1 100,550 V410 A14,14 0 0 1 114,396 Z" />
    <rect x="100" y="396" width="6" height="168" fill="#F59E0B" />
    <text x="132" y="430" font-size="16" font-weight="800" fill="#F59E0B">最直接对口：金融 agent 自进化安全审计（8/18）</text>
    <text x="132" y="462" font-size="13.5" fill="#B8C7DC">对 SkillOpt、Agent Workflow Memory、Reflexion 三种自进化机制做安全漂移审计，核心问题：</text>
    <text x="132" y="488" font-size="14" font-weight="700" fill="#E8EEF7">“进化后的能力提升，是否以牺牲原本正确的行为和安全约束为代价？”</text>
    <text x="132" y="516" font-size="13.5" fill="#8FA3BF">发现 execution-interface mismatch 类缺陷 — 自进化改动执行接口后，原校验逻辑静默失效。</text>
    <text x="132" y="544" font-size="13.5" font-weight="600" fill="#22D3EE">→ 这就是 agent 版的“变更影响审计”：任何自学习系统上线，必须带回归基线 + 漂移监控。</text>
  </g>

  
  <path fill="#111F35" stroke="#1E2D45" stroke-width="1.5" d="M110,592 H1170 A10,10 0 0 1 1180,602 V648 A10,10 0 0 1 1170,658 H110 A10,10 0 0 1 100,648 V602 A10,10 0 0 1 110,592 Z" />
  <text x="124" y="620" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" font-weight="600" fill="#B8C7DC">
    <tspan fill="#8B5CF6" font-weight="800">方法论迁移：</tspan><tspan>2025-26 agent 研究的重心从“能力展示”转向“可靠性经济学” —</tspan>
  </text>
  <text x="124" y="644" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#B8C7DC">每篇顶流都在回答同一个问题的某个侧面：这个系统的错误预算是多少，谁签字担保。与金融风控演化路径完全同构。</text>

  <text x="1220" y="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#3D5270" text-anchor="end">13 / 15</text>
</svg>