<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">宏观底色：通胀过山车 × 就业拐点</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">MACRO BACKDROP · CPI/PCE 月环比 + 非农 + 失业率（2026-04 → 07）</text>
  </g>

  
  <g id="cpi-chart">
    <text x="100" y="132" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E0E6ED">CPI 月环比 %（过山车）</text>
    <line x1="100" y1="380" x2="620" y2="380" stroke="#22304A" stroke-width="1.5" />
    <line x1="360" y1="160" x2="360" y2="380" stroke="#5A6B85" stroke-dasharray="4,4" opacity="0.6" />
    <g font-family="'SF Mono','Menlo',monospace">
      
      <path fill="#FF5252" opacity="0.85" d="M134,212 H216 A4,4 0 0 1 220,216 V376 A4,4 0 0 1 216,380 H134 A4,4 0 0 1 130,376 V216 A4,4 0 0 1 134,212 Z" />
      <text x="175" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#FF5252">+0.64</text>
      <text x="175" y="404" text-anchor="middle" font-size="13" fill="#8FA3BF">4 月</text>
      
      <path fill="#FF5252" opacity="0.7" d="M254,256 H336 A4,4 0 0 1 340,260 V376 A4,4 0 0 1 336,380 H254 A4,4 0 0 1 250,376 V260 A4,4 0 0 1 254,256 Z" />
      <text x="295" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#FF5252">+0.47</text>
      <text x="295" y="404" text-anchor="middle" font-size="13" fill="#8FA3BF">5 月</text>
      
      <path fill="#00C853" opacity="0.85" d="M374,380 H456 A4,4 0 0 1 460,384 V486 A4,4 0 0 1 456,490 H374 A4,4 0 0 1 370,486 V384 A4,4 0 0 1 374,380 Z" />
      <text x="415" y="512" text-anchor="middle" font-size="16" font-weight="bold" fill="#00C853">−0.42</text>
      <text x="415" y="404" text-anchor="middle" font-size="13" fill="#8FA3BF">6 月</text>
      
      <path fill="#FFB300" opacity="0.9" d="M494,362 H576 A4,4 0 0 1 580,366 V376 A4,4 0 0 1 576,380 H494 A4,4 0 0 1 490,376 V366 A4,4 0 0 1 494,362 Z" />
      <text x="535" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFB300">+0.07</text>
      <text x="535" y="404" text-anchor="middle" font-size="13" fill="#8FA3BF">7 月</text>
    </g>
    <text x="100" y="546" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8FA3BF">4 月年化一度逼近 8% → 6 月骤降转负 → 7 月归零。</text>
    <text x="100" y="566" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8FA3BF">单月波动极大，方向判断需依赖 Core PCE 趋势而非单点。</text>
  </g>

  
  <g id="emp-panel">
    <text x="680" y="132" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E0E6ED">就业：四连降后转负</text>
    <g font-family="'SF Mono','Menlo',monospace">
      
      <path fill="#131B2E" stroke="#22304A" d="M690,160 H1150 A10,10 0 0 1 1160,170 V300 A10,10 0 0 1 1150,310 H690 A10,10 0 0 1 680,300 V170 A10,10 0 0 1 690,160 Z" />
      <text x="700" y="186" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">非农新增（千人）</text>
      <path fill="#00C853" opacity="0.75" d="M704,200 H776 A4,4 0 0 1 780,204 V276 A4,4 0 0 1 776,280 H704 A4,4 0 0 1 700,276 V204 A4,4 0 0 1 704,200 Z" />
      <text x="740" y="248" text-anchor="middle" font-size="14" fill="#0A0E1A" font-weight="bold">+148</text>
      <path fill="#00C853" opacity="0.55" d="M804,230 H876 A4,4 0 0 1 880,234 V276 A4,4 0 0 1 876,280 H804 A4,4 0 0 1 800,276 V234 A4,4 0 0 1 804,230 Z" />
      <text x="840" y="262" text-anchor="middle" font-size="14" fill="#0A0E1A" font-weight="bold">+63</text>
      <path fill="#FFB300" opacity="0.7" d="M904,255 H976 A4,4 0 0 1 980,259 V276 A4,4 0 0 1 976,280 H904 A4,4 0 0 1 900,276 V259 A4,4 0 0 1 904,255 Z" />
      <text x="940" y="273" text-anchor="middle" font-size="13" fill="#0A0E1A" font-weight="bold">+20</text>
      <path fill="#FF5252" opacity="0.9" d="M1004,262 H1076 A4,4 0 0 1 1080,266 V276 A4,4 0 0 1 1076,280 H1004 A4,4 0 0 1 1000,276 V266 A4,4 0 0 1 1004,262 Z" />
      <text x="1040" y="276" text-anchor="middle" font-size="13" fill="#FF5252" font-weight="bold">−23</text>
      <text x="1120" y="290" font-size="12" fill="#5A6B85" font-family="'PingFang SC',sans-serif">7月初值</text>

      
      <path fill="#131B2E" stroke="#22304A" d="M690,330 H1150 A10,10 0 0 1 1160,340 V450 A10,10 0 0 1 1150,460 H690 A10,10 0 0 1 680,450 V340 A10,10 0 0 1 690,330 Z" />
      <text x="700" y="356" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">失业率 U3 %</text>
      <path d="M 720 390 L 830 390 L 940 378 L 1050 366" fill="none" stroke="#00C853" stroke-width="3" />
      <g font-size="14" fill="#00C853">
        <circle cx="720" cy="390" r="4" /><circle cx="830" cy="390" r="4" /><circle cx="940" cy="378" r="4" /><circle cx="1050" cy="366" r="5" />
        <text x="720" y="382" text-anchor="middle">4.3</text>
        <text x="830" y="382" text-anchor="middle">4.3</text>
        <text x="940" y="370" text-anchor="middle">4.2</text>
        <text x="1050" y="356" text-anchor="middle" font-weight="bold">4.1</text>
      </g>
      <text x="700" y="440" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">4-5月 4.3 → 6月 4.2 → 7月 4.1（连降）</text>
    </g>

    
    <path fill="#131B2E" stroke="#FFB300" stroke-opacity="0.6" d="M692,480 H1148 A12,12 0 0 1 1160,492 V618 A12,12 0 0 1 1148,630 H692 A12,12 0 0 1 680,618 V492 A12,12 0 0 1 692,480 Z" />
    <text x="700" y="510" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#FFB300">悖论解读：供给收缩型放缓</text>
    <text x="700" y="536" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E0E6ED">新增就业萎缩至转负 + 失业率反而下降 =</text>
    <text x="700" y="556" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E0E6ED">劳动参与率收缩（人口结构 + 移民收紧），</text>
    <text x="700" y="576" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E0E6ED">分母变小而非分子变强。</text>
    <text x="700" y="602" font-family="'PingFang SC',sans-serif" font-size="13" fill="#FF5252">对 Fed：不是典型衰退信号，但总需求确在失速。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：FRED CPIAUCSL / PCEPILFE / UNRATE / PAYEMS · 7 月非农为初值，可能修正 · Core PCE 7 月值待公布（8 月底）</text>
</svg>