<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">操作含义：配置与对冲坐标</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">POSITIONING IMPLICATIONS · 基于情景 A 55% 的基准配置 + 尾部对冲</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    
    <path fill="#161E32" d="M68,116 H1212 A8,8 0 0 1 1220,124 V152 A8,8 0 0 1 1212,160 H68 A8,8 0 0 1 60,152 V124 A8,8 0 0 1 68,116 Z" />
    <text x="84" y="144" font-size="15" font-weight="bold" fill="#8FA3BF">资产</text>
    <text x="264" y="144" font-size="15" font-weight="bold" fill="#8FA3BF">基准观点</text>
    <text x="484" y="144" font-size="15" font-weight="bold" fill="#8FA3BF">结构偏好</text>
    <text x="784" y="144" font-size="15" font-weight="bold" fill="#8FA3BF">核心逻辑</text>

    
    <path fill="#131B2E" d="M68,168 H1212 A8,8 0 0 1 1220,176 V248 A8,8 0 0 1 1212,256 H68 A8,8 0 0 1 60,248 V176 A8,8 0 0 1 68,168 Z" />
    <rect x="60" y="168" width="4" height="88" fill="#00C853" />
    <text x="84" y="200" font-size="16" font-weight="bold" fill="#E0E6ED">美股</text>
    <text x="84" y="226" font-size="12" fill="#5A6B85">EQUITY</text>
    <text x="264" y="204" font-size="14" fill="#00C853" font-weight="bold">中性偏多（A 情景）</text>
    <text x="264" y="230" font-size="12.5" fill="#8FA3BF">但拥挤度极高</text>
    <text x="484" y="204" font-size="14" fill="#E0E6ED">等权/小盘（RUT 动能）&gt; 市值加权</text>
    <text x="484" y="230" font-size="12.5" fill="#8FA3BF">NVDA/AAPL 硬件层 &gt; 高估值叙事股</text>
    <text x="784" y="204" font-size="13.5" fill="#8FA3BF">Breadth 扩散仍在，但贴现率上移</text>
    <text x="784" y="230" font-size="13.5" fill="#8FA3BF">压缩估值上限——赚盈利的钱不赚估值的钱</text>

    <path fill="#131B2E" d="M68,266 H1212 A8,8 0 0 1 1220,274 V346 A8,8 0 0 1 1212,354 H68 A8,8 0 0 1 60,346 V274 A8,8 0 0 1 68,266 Z" />
    <rect x="60" y="266" width="4" height="88" fill="#FFB300" />
    <text x="84" y="298" font-size="16" font-weight="bold" fill="#E0E6ED">美债</text>
    <text x="84" y="324" font-size="12" fill="#5A6B85">TREASURY</text>
    <text x="264" y="302" font-size="14" fill="#FFB300" font-weight="bold">短端有票息，长端等信号</text>
    <text x="264" y="328" font-size="12.5" fill="#8FA3BF">久期中性偏短</text>
    <text x="484" y="302" font-size="14" fill="#E0E6ED">2-5Y 段吃 4%+ 锁定收益</text>
    <text x="484" y="328" font-size="12.5" fill="#8FA3BF">30Y 5.2%+ 分批建仓区但别抄底</text>
    <text x="784" y="302" font-size="13.5" fill="#8FA3BF">熊陡未完（期货定价不降息）；</text>
    <text x="784" y="328" font-size="13.5" fill="#8FA3BF">C 情景下长端是最大赢家——对冲价值</text>

    <path fill="#131B2E" d="M68,364 H1212 A8,8 0 0 1 1220,372 V444 A8,8 0 0 1 1212,452 H68 A8,8 0 0 1 60,444 V372 A8,8 0 0 1 68,364 Z" />
    <rect x="60" y="364" width="4" height="88" fill="#FF5252" />
    <text x="84" y="396" font-size="16" font-weight="bold" fill="#E0E6ED">信用债</text>
    <text x="84" y="422" font-size="12" fill="#5A6B85">CREDIT</text>
    <text x="264" y="400" font-size="14" fill="#FF5252" font-weight="bold">低配（最错定价资产）</text>
    <text x="264" y="426" font-size="12.5" fill="#8FA3BF">利差保护几乎为零</text>
    <text x="484" y="400" font-size="14" fill="#E0E6ED">若持有：IG 短端票息策略</text>
    <text x="484" y="426" font-size="12.5" fill="#8FA3BF">回避 HY 久期+利差双敞口</text>
    <text x="784" y="400" font-size="13.5" fill="#8FA3BF">273bp 定价完美软着陆，</text>
    <text x="784" y="426" font-size="13.5" fill="#8FA3BF">非农转负背景下赔率极差：上行 150bp vs 下行 20bp</text>

    <path fill="#131B2E" d="M68,462 H1212 A8,8 0 0 1 1220,470 V542 A8,8 0 0 1 1212,550 H68 A8,8 0 0 1 60,542 V470 A8,8 0 0 1 68,462 Z" />
    <rect x="60" y="462" width="4" height="88" fill="#00D4FF" />
    <text x="84" y="494" font-size="16" font-weight="bold" fill="#E0E6ED">黄金</text>
    <text x="84" y="520" font-size="12" fill="#5A6B85">GOLD</text>
    <text x="264" y="498" font-size="14" fill="#00D4FF" font-weight="bold">战术持有（对冲 B+C）</text>
    <text x="264" y="524" font-size="12.5" fill="#8FA3BF">8 月动量确认</text>
    <text x="484" y="498" font-size="14" fill="#E0E6ED">4400-4500 支撑区分批</text>
    <text x="484" y="524" font-size="12.5" fill="#8FA3BF">突破 4700 确认趋势恢复</text>
    <text x="784" y="498" font-size="13.5" fill="#8FA3BF">C 情景避险 + B 情景抗通胀，</text>
    <text x="784" y="524" font-size="13.5" fill="#8FA3BF">唯一在两个坏情景里都受益的资产</text>

    <path fill="#131B2E" d="M68,560 H1212 A8,8 0 0 1 1220,568 V640 A8,8 0 0 1 1212,648 H68 A8,8 0 0 1 60,640 V568 A8,8 0 0 1 68,560 Z" />
    <rect x="60" y="560" width="4" height="88" fill="#8B5CF6" />
    <text x="84" y="592" font-size="16" font-weight="bold" fill="#E0E6ED">现金/短债</text>
    <text x="84" y="618" font-size="12" fill="#5A6B85">CASH / T-BILLS</text>
    <text x="264" y="596" font-size="14" fill="#00C853" font-weight="bold">持有底仓（4% 无风险）</text>
    <text x="264" y="622" font-size="12.5" fill="#8FA3BF">等待弹药</text>
    <text x="484" y="596" font-size="14" fill="#E0E6ED">3M-1Y T-Bill 滚动</text>
    <text x="484" y="622" font-size="12.5" fill="#8FA3BF">货币基金等效</text>
    <text x="784" y="596" font-size="13.5" fill="#8FA3BF">无风险 4% 是估值的地心引力，</text>
    <text x="784" y="622" font-size="13.5" fill="#8FA3BF">也是 C 情景爆发时的机动仓位</text>
  </g>

  <text x="60" y="678" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8FA3BF">对冲组合（小仓位高凸性）：30Y 长债期货多单（对冲 C）+ 黄金（对冲 B+C）+ VIX 看涨期权（对冲流动性冲击）——三者合计 ≤5% 仓位。</text>
  <text x="60" y="700" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">以上为分析框架示例，不构成投资建议 · 请结合自身风险约束执行</text>
</svg>