<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A" />

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF" />
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">为什么熊陡：两台发动机的拆解</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">TERM PREMIUM DECOMPOSITION · 2Y 领涨 +72bp 的两个来源</text>
  </g>

  
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <path fill="#131B2E" stroke="#22304A" d="M72,120 H608 A12,12 0 0 1 620,132 V378 A12,12 0 0 1 608,390 H72 A12,12 0 0 1 60,378 V132 A12,12 0 0 1 72,120 Z" />
    <rect x="60" y="120" width="560" height="4" fill="#FF5252" />
    <text x="84" y="158" font-size="18" font-weight="bold" fill="#FF5252">发动机 ①：降息预期被撤回</text>
    <text x="84" y="186" font-size="14" fill="#E0E6ED">2Y 收益率 YTD +72bp，而 Fed Funds 现值仅 3.63%——</text>
    <text x="84" y="208" font-size="14" fill="#E0E6ED">2Y（4.19%）已高出政策利率 56bp</text>
    <g font-family="'SF Mono','Menlo',monospace">
      <path fill="#161E32" d="M92,228 H316 A8,8 0 0 1 324,236 V280 A8,8 0 0 1 316,288 H92 A8,8 0 0 1 84,280 V236 A8,8 0 0 1 92,228 Z" />
      <text x="100" y="252" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">ZQ 期货隐含 FF</text>
      <text x="100" y="276" font-size="20" font-weight="bold" fill="#FF5252">3.72%</text>
      <path fill="#161E32" d="M352,228 H576 A8,8 0 0 1 584,236 V280 A8,8 0 0 1 576,288 H352 A8,8 0 0 1 344,280 V236 A8,8 0 0 1 352,228 Z" />
      <text x="360" y="252" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">现值（DFF）</text>
      <text x="360" y="276" font-size="20" font-weight="bold" fill="#00D4FF">3.63%</text>
      <text x="600" y="262" font-size="14" fill="#FFB300" font-family="'PingFang SC',sans-serif">→ 市场定价：年内不再降息</text>
    </g>
    <text x="84" y="322" font-size="13" fill="#8FA3BF">1 月市场曾定价年内再降 2-3 次；如今远月合约隐含利率</text>
    <text x="84" y="342" font-size="13" fill="#8FA3BF">反而高于现值——期货市场已经"变心"，从押注宽松转向</text>
    <text x="84" y="362" font-size="13" fill="#8FA3BF">接受"更高更久"。这是 2-5Y 段 +65~72bp 的主因。</text>

    
    <path fill="#131B2E" stroke="#22304A" d="M672,120 H1208 A12,12 0 0 1 1220,132 V378 A12,12 0 0 1 1208,390 H672 A12,12 0 0 1 660,378 V132 A12,12 0 0 1 672,120 Z" />
    <rect x="660" y="120" width="560" height="4" fill="#FFB300" />
    <text x="684" y="158" font-size="18" font-weight="bold" fill="#FFB300">发动机 ②：长端期限溢价 + 财政供给</text>
    <text x="684" y="186" font-size="14" fill="#E0E6ED">30Y 5.23%（年内高位区），YTD +37bp 且 7 月以来加速</text>
    <g font-family="'SF Mono','Menlo',monospace">
      <path fill="#161E32" d="M692,206 H836 A8,8 0 0 1 844,214 V258 A8,8 0 0 1 836,266 H692 A8,8 0 0 1 684,258 V214 A8,8 0 0 1 692,206 Z" />
      <text x="700" y="230" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">7/1 30Y</text>
      <text x="700" y="254" font-size="20" font-weight="bold" fill="#FFB300">4.97%</text>
      <text x="856" y="240" font-size="18" fill="#5A6B85">→</text>
      <path fill="#161E32" d="M892,206 H1036 A8,8 0 0 1 1044,214 V258 A8,8 0 0 1 1036,266 H892 A8,8 0 0 1 884,258 V214 A8,8 0 0 1 892,206 Z" />
      <text x="900" y="230" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">8/20 30Y</text>
      <text x="900" y="254" font-size="20" font-weight="bold" fill="#FF5252">5.23%</text>
      <text x="1060" y="240" font-size="16" font-weight="bold" fill="#FF5252">+26bp/7周</text>
    </g>
    <text x="684" y="300" font-size="13" fill="#8FA3BF">长端上行与降息预期无关——驱动来自：赤字与国债供给</text>
    <text x="684" y="320" font-size="13" fill="#8FA3BF">持续放量（期限溢价回归）、通胀不确定性（10Y 盈亏平衡</text>
    <text x="684" y="340" font-size="13" fill="#8FA3BF">8/18 跳升至 2.34%）。10Y-2Y 从倒挂修复至 +46bp，</text>
    <text x="684" y="360" font-size="13" fill="#8FA3BF">曲线"正常化"的方式是长端抬高而非短端回落。</text>
  </g>

  
  <path fill="#131B2E" stroke="#22304A" d="M72,416 H1208 A12,12 0 0 1 1220,428 V624 A12,12 0 0 1 1208,636 H72 A12,12 0 0 1 60,624 V428 A12,12 0 0 1 72,416 Z" />
  <text x="84" y="452" font-size="18" font-weight="bold" fill="#00D4FF">曲线信号面板</text>
  <g font-family="'SF Mono','Menlo',monospace">
    
    <path fill="#161E32" d="M92,476 H416 A8,8 0 0 1 424,484 V534 A8,8 0 0 1 416,542 H92 A8,8 0 0 1 84,534 V484 A8,8 0 0 1 92,476 Z" />
    <text x="100" y="500" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">10Y − 2Y 期限利差</text>
    <text x="100" y="526" font-size="20" font-weight="bold" fill="#00C853">+46bp</text>
    <text x="310" y="526" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">倒挂→正常化</text>

    <path fill="#161E32" d="M460,476 H784 A8,8 0 0 1 792,484 V534 A8,8 0 0 1 784,542 H460 A8,8 0 0 1 452,534 V484 A8,8 0 0 1 460,476 Z" />
    <text x="468" y="500" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">10Y − 3M</text>
    <text x="468" y="526" font-size="20" font-weight="bold" fill="#00C853">+82bp</text>
    <text x="660" y="526" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">衰退信号解除</text>

    <path fill="#161E32" d="M828,476 H1188 A8,8 0 0 1 1196,484 V534 A8,8 0 0 1 1188,542 H828 A8,8 0 0 1 820,534 V484 A8,8 0 0 1 828,476 Z" />
    <text x="836" y="500" font-size="13" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">10Y 盈亏平衡通胀（8/20）</text>
    <text x="836" y="526" font-size="20" font-weight="bold" fill="#FFB300">2.34%</text>
    <text x="1030" y="526" font-size="13" fill="#FF5252" font-family="'PingFang SC',sans-serif">↑ 两日 +4bp</text>

    <text x="84" y="584" font-size="14" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">历史上"熊陡+信用利差极紧+就业转弱"组合的后续：曲线信号不再报警衰退，但债市用价格逼股市让步——</text>
    <text x="84" y="608" font-size="14" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">估值分母（贴现率）上移终将传导至风险资产，除非盈利增长持续超预期对冲。这是"股市后妥协"路径的机制。</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：FRED（DFF/DGS/T10Y2Y/T10Y3M/T10YIE）· 30 天联邦基金期货（Yahoo）· 美国财政部</text>
</svg>