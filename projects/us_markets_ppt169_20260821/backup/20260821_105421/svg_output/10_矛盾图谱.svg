<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">矛盾图谱：三个市场各说各话</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">CONTRADICTION MAP · 谁在说真话？</text>
  </g>

  <!-- central node -->
  <g id="center">
    <circle cx="640" cy="380" r="86" fill="#161E32" stroke="#FFB300" stroke-width="2"/>
    <text x="640" y="368" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="#FFB300">同一个经济体</text>
    <text x="640" y="394" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="15" fill="#E0E6ED">三份互相矛盾的</text>
    <text x="640" y="416" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="15" fill="#E0E6ED">"体检报告"</text>
  </g>

  <!-- connecting lines -->
  <g stroke="#22304A" stroke-width="2">
    <line x1="560" y1="340" x2="330" y2="230"/>
    <line x1="720" y1="340" x2="950" y2="230"/>
    <line x1="640" y1="466" x2="640" y2="540"/>
  </g>

  <!-- Node 1: equity (top-left) -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="90" y="140" width="420" height="180" rx="12" fill="#131B2E" stroke="#00C853" stroke-opacity="0.7"/>
    <text x="114" y="172" font-size="17" font-weight="bold" fill="#00C853">股市说："增长没问题"</text>
    <text x="114" y="202" font-size="14" fill="#E0E6ED">· S&amp;P +11.6%、RUT +20.6% 新高区</text>
    <text x="114" y="226" font-size="14" fill="#E0E6ED">· 盈利仍在扩张，AI 资本开支兑现</text>
    <text x="114" y="250" font-size="14" fill="#E0E6ED">· VIX 14.9 无人恐慌</text>
    <text x="114" y="286" font-size="13" fill="#8FA3BF">隐含假设：软着陆成立，贴现率上移可被盈利对冲</text>

    <!-- Node 2: bond (top-right) -->
    <rect x="770" y="140" width="420" height="180" rx="12" fill="#131B2E" stroke="#FF5252" stroke-opacity="0.7"/>
    <text x="794" y="172" font-size="17" font-weight="bold" fill="#FF5252">债市说："利率要更高更久"</text>
    <text x="794" y="202" font-size="14" fill="#E0E6ED">· 2Y +72bp、30Y 5.23% 年内高位</text>
    <text x="794" y="226" font-size="14" fill="#E0E6ED">· ZQ 期货隐含年内不再降息</text>
    <text x="794" y="250" font-size="14" fill="#E0E6ED">· 期限溢价 + 通胀预期双双回升</text>
    <text x="794" y="286" font-size="13" fill="#8FA3BF">隐含假设：通胀粘性 + 财政供给，宽松别想了</text>

    <!-- Node 3: credit+macro (bottom) -->
    <rect x="330" y="540" width="620" height="140" rx="12" fill="#131B2E" stroke="#FFB300" stroke-opacity="0.7"/>
    <text x="354" y="572" font-size="17" font-weight="bold" fill="#FFB300">信用与宏观数据说："再看看，但别太乐观"</text>
    <text x="354" y="602" font-size="14" fill="#E0E6ED">· 信用 HY 273bp 定价完美（偏乐观）</text>
    <text x="354" y="626" font-size="14" fill="#E0E6ED">· 但非农四连降转负、CPI 过山车（现实在降温）</text>
    <text x="354" y="656" font-size="13" fill="#8FA3BF">宏观数据走在"放缓但未衰退"的窄路上，两个市场的极端定价必有一个要修正</text>
  </g>

  <!-- side verdict -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="360" width="200" height="180" rx="12" fill="#161E32" stroke="#22304A"/>
    <text x="84" y="392" font-size="14" font-weight="bold" fill="#00D4FF">谁更可能让步？</text>
    <text x="84" y="420" font-size="13" fill="#E0E6ED">债市的态度由</text>
    <text x="84" y="440" font-size="13" fill="#E0E6ED">期货真金白银押注，</text>
    <text x="84" y="460" font-size="13" fill="#E0E6ED">短期难以反转；</text>
    <text x="84" y="488" font-size="13" fill="#FFB300">股市对贴现率的</text>
    <text x="84" y="508" font-size="13" fill="#FFB300">"钝感"更可能是</text>
    <text x="84" y="528" font-size="13" fill="#FFB300">下一阶段的风险源</text>

    <rect x="1020" y="360" width="200" height="180" rx="12" fill="#161E32" stroke="#22304A"/>
    <text x="1044" y="392" font-size="14" font-weight="bold" fill="#00D4FF">验证信号</text>
    <text x="1044" y="420" font-size="13" fill="#E0E6ED">若 9 月 FOMC 按兵不动</text>
    <text x="1044" y="440" font-size="13" fill="#E0E6ED">且点阵图上移，</text>
    <text x="1044" y="468" font-size="13" fill="#FF5252">股市估值分母压力</text>
    <text x="1044" y="488" font-size="13" fill="#FF5252">将直接显性化</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">综合：FRED · Treasury · Yahoo · CME 联邦基金期货</text>
</svg>
