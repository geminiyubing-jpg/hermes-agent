<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">未来趋势 Ⅱ：三情景推演（未来 6-12 个月）</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">SCENARIO ANALYSIS · 概率为主观校准，锚定当前市场定价</text>
  </g>

  <!-- Scenario A: base -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="116" width="1160" height="164" rx="12" fill="#131B2E" stroke="#00C853" stroke-opacity="0.6"/>
    <rect x="60" y="116" width="6" height="164" fill="#00C853"/>
    <text x="92" y="148" font-size="17" font-weight="bold" fill="#00C853">情景 A · 金发女孩延续（软着陆）</text>
    <rect x="1105" y="126" width="100" height="34" rx="17" fill="#00C853" opacity="0.18"/>
    <text x="1155" y="149" text-anchor="middle" font-size="16" font-weight="bold" fill="#00C853">55%</text>
    <text x="92" y="180" font-size="13.5" fill="#E0E6ED">路径：通胀回落至 2.5% 附近粘住，就业零增长但失业率稳，Fed 按兵不动至年底、明年初再降</text>
    <text x="92" y="204" font-size="13.5" fill="#E0E6ED">条件：Core PCE 月环比 ≤0.2% 持续 + 非农 −50k~+50k 区间震荡 + 10Y 盈亏平衡 ≤2.4%</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13">
      <text x="92" y="236" fill="#00C853">股票 → 区间上行，RUT/价值补涨</text>
      <text x="400" y="236" fill="#FFB300">债券 → 10Y 4.4-4.8% 震荡，曲线继续陡</text>
      <text x="780" y="236" fill="#8FA3BF">信用 → HY 250-320bp 温和扩</text>
      <text x="92" y="262" fill="#FFB300">黄金 → 4400-4900 区间</text>
      <text x="400" y="262" fill="#8FA3BF">美元 → 温和走弱</text>
    </g>

    <!-- Scenario B -->
    <rect x="60" y="296" width="1160" height="164" rx="12" fill="#131B2E" stroke="#FF5252" stroke-opacity="0.6"/>
    <rect x="60" y="296" width="6" height="164" fill="#FF5252"/>
    <text x="92" y="328" font-size="17" font-weight="bold" fill="#FF5252">情景 B · 再通胀（Higher for Longer 硬化）</text>
    <rect x="1105" y="306" width="100" height="34" rx="17" fill="#FF5252" opacity="0.18"/>
    <text x="1155" y="329" text-anchor="middle" font-size="16" font-weight="bold" fill="#FF5252">25%</text>
    <text x="92" y="360" font-size="13.5" fill="#E0E6ED">路径：通胀二次抬头（关税传导/油价/工资粘性），Fed 被迫讨论加息，2Y 冲 4.5%+</text>
    <text x="92" y="384" font-size="13.5" fill="#E0E6ED">触发：连续两月 CPI MoM ≥0.4% + 盈亏平衡 &gt;2.6% + 非农重新 +150k 以上</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13">
      <text x="92" y="416" fill="#FF5252">股票 → 估值压缩 10-15%，成长股领跌</text>
      <text x="400" y="416" fill="#FF5252">债券 → 10Y 冲 5.0-5.3%，30Y 5.6%+</text>
      <text x="780" y="416" fill="#FFB300">信用 → HY 扩至 380-450bp</text>
      <text x="92" y="442" fill="#00C853">黄金 → 实际利率受通胀侵蚀，相对抗跌</text>
      <text x="400" y="442" fill="#00C853">美元 → 大概率走强</text>
    </g>

    <!-- Scenario C -->
    <rect x="60" y="476" width="1160" height="164" rx="12" fill="#131B2E" stroke="#FFB300" stroke-opacity="0.7"/>
    <rect x="60" y="476" width="6" height="164" fill="#FFB300"/>
    <text x="92" y="508" font-size="17" font-weight="bold" fill="#FFB300">情景 C · 硬着陆（就业断裂）</text>
    <rect x="1105" y="486" width="100" height="34" rx="17" fill="#FFB300" opacity="0.18"/>
    <text x="1155" y="509" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFB300">20%</text>
    <text x="92" y="540" font-size="13.5" fill="#E0E6ED">路径：非农连续 −100k 级别 + 初请失业金陡升 + 信用卡/车贷违约率先爆，信用利差急扩倒逼 Fed 转向快速降息</text>
    <text x="92" y="564" font-size="13.5" fill="#E0E6ED">触发：HY 单月扩 80bp+ / 初请 &gt;260k 持续 / 大型零售商盈利暴雷</text>
    <g font-family="'SF Mono','Menlo',monospace" font-size="13">
      <text x="92" y="596" fill="#FF5252">股票 → 急跌 15-25%，防御/公用事业避险</text>
      <text x="400" y="596" fill="#00C853">债券 → 大幅牛市，10Y 跌向 3.5-3.8%</text>
      <text x="780" y="596" fill="#FF5252">信用 → HY 500bp+ 无差别抛售</text>
      <text x="92" y="622" fill="#FFB300">黄金 → 避险+降息双击，冲 5000+</text>
      <text x="400" y="622" fill="#8FA3BF">美元 → 先强后弱</text>
    </g>
  </g>

  <!-- footer note -->
  <text x="60" y="672" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8FA3BF">概率校准依据：期货定价（年内不降息）支持 A/B 合计 80%；就业动量与非农转负给 C 20%。三情景共用观察哨：Core PCE（8 月底）→ 9 月 FOMC 点阵图 → 10 月非农修正。</text>
  <text x="60" y="696" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">情景推演为分析框架而非预测 · 概率随数据发布动态调整</text>
</svg>
