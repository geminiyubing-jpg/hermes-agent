<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">目录</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">CONTENTS · 四部分十四章</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Part 1 -->
    <text x="80" y="140" font-size="15" font-weight="bold" fill="#00D4FF">Ⅰ · 现状全景</text>
    <rect x="80" y="154" width="540" height="2" fill="#22304A"/>
    <g font-size="15" fill="#E0E6ED">
      <text x="80" y="186"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">02</tspan>  执行摘要：一句话结论 + 三大矛盾</text>
      <text x="80" y="218"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">03</tspan>  股市全景：小盘领跑的普涨</text>
      <text x="80" y="250"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">04</tspan>  MAG7 分化：40pp 的内部裂缝</text>
    </g>

    <!-- Part 2 -->
    <text x="80" y="306" font-size="15" font-weight="bold" fill="#FFB300">Ⅱ · 债市与信用</text>
    <rect x="80" y="320" width="540" height="2" fill="#22304A"/>
    <g font-size="15" fill="#E0E6ED">
      <text x="80" y="352"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">05</tspan>  债市主线：熊陡——曲线全线上移</text>
      <text x="80" y="384"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">06</tspan>  为什么熊陡：两台发动机拆解</text>
      <text x="80" y="416"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">07</tspan>  信用市场：极紧利差在替谁背书</text>
    </g>

    <!-- Part 3 -->
    <text x="680" y="140" font-size="15" font-weight="bold" fill="#00C853">Ⅲ · 宏观与交叉验证</text>
    <rect x="680" y="154" width="540" height="2" fill="#22304A"/>
    <g font-size="15" fill="#E0E6ED">
      <text x="680" y="186"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">08</tspan>  宏观底色：通胀过山车 × 就业拐点</text>
      <text x="680" y="218"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">09</tspan>  黄金：被掩盖的剧烈再定价</text>
      <text x="680" y="250"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">10</tspan>  矛盾图谱：三个市场各说各话</text>
    </g>

    <!-- Part 4 -->
    <text x="680" y="306" font-size="15" font-weight="bold" fill="#FF5252">Ⅳ · 未来趋势与操作</text>
    <rect x="680" y="320" width="540" height="2" fill="#22304A"/>
    <g font-size="15" fill="#E0E6ED">
      <text x="680" y="352"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">11</tspan>  前瞻指标仪表盘：市场自己的预测</text>
      <text x="680" y="384"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">12</tspan>  三情景推演：软着陆 / 再通胀 / 硬着陆</text>
      <text x="680" y="416"><tspan font-family="'SF Mono',monospace" fill="#5A6B85">13</tspan>  操作含义：配置与对冲坐标</text>
    </g>
  </g>

  <!-- bottom narrative line -->
  <rect x="80" y="480" width="1120" height="160" rx="12" fill="#131B2E" stroke="#22304A"/>
  <text x="110" y="520" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#FFB300">阅读主线</text>
  <text x="110" y="552" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">先看三个市场各自的价格表态（Ⅰ·Ⅱ），再用宏观数据交叉验证谁在说谎（Ⅲ），</text>
  <text x="110" y="578" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">最后落到前瞻定价、情景概率与可操作的配置坐标（Ⅳ）。</text>
  <text x="110" y="614" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8FA3BF">全部数据为实盘官方来源（FRED / 美国财政部 / Yahoo / CME），采集时点 2026-08-21 上午。</text>
</svg>
