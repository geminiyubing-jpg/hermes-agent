<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">执行摘要</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">EXECUTIVE SUMMARY · 截至 2026-08-20 收盘</text>
  </g>

  <!-- Four KPI cards -->
  <g id="kpi-cards" font-family="'SF Mono','Menlo',monospace">
    <!-- S&P -->
    <rect x="60" y="120" width="278" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="84" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8FA3BF">标普 500</text>
    <text x="84" y="200" font-size="38" font-weight="bold" fill="#E0E6ED">7,641</text>
    <text x="84" y="228" font-size="16" fill="#00C853">▲ +11.62% YTD</text>
    <text x="84" y="252" font-size="12" fill="#5A6B85">距 52 周高点 −2.0%</text>

    <!-- 10Y -->
    <rect x="354" y="120" width="278" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="378" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8FA3BF">10 年期美债</text>
    <text x="378" y="200" font-size="38" font-weight="bold" fill="#FFB300">4.69%</text>
    <text x="378" y="228" font-size="16" fill="#FF5252">▲ +50bp YTD</text>
    <text x="378" y="252" font-size="12" fill="#5A6B85">30Y 5.23% · 2Y 4.19%</text>

    <!-- HY -->
    <rect x="648" y="120" width="278" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="672" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8FA3BF">高收益债利差</text>
    <text x="672" y="200" font-size="38" font-weight="bold" fill="#00D4FF">273bp</text>
    <text x="672" y="228" font-size="16" fill="#00C853">历史极低分位</text>
    <text x="672" y="252" font-size="12" fill="#5A6B85">IG 81bp · 信用零恐慌</text>

    <!-- VIX -->
    <rect x="942" y="120" width="278" height="150" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="966" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8FA3BF">恐慌指数 VIX</text>
    <text x="966" y="200" font-size="38" font-weight="bold" fill="#00D4FF">14.89</text>
    <text x="966" y="228" font-size="16" fill="#00C853">低位休眠</text>
    <text x="966" y="252" font-size="12" fill="#5A6B85">波动率市场无应激</text>
  </g>

  <!-- One-line verdict -->
  <rect x="60" y="300" width="1160" height="56" rx="8" fill="#161E32" stroke="#FFB300" stroke-opacity="0.5"/>
  <text x="84" y="335" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFB300">一句话结论：股市定价"完美软着陆"，债市定价"更高更久"，两者不可能都对——这场分歧本身就是 2026 下半年最大的交易主题。</text>

  <!-- Three contradictions -->
  <text x="60" y="402" font-family="'PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="#E0E6ED">三大核心矛盾</text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="60" y="420" width="368" height="240" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="60" y="420" width="368" height="4" fill="#FF5252"/>
    <text x="84" y="456" font-size="16" font-weight="bold" fill="#FF5252">① 股债跷跷板失效</text>
    <text x="84" y="486" font-size="14" fill="#E0E6ED">股市：S&amp;P 新高区 +11.6%，</text>
    <text x="84" y="508" font-size="14" fill="#E0E6ED">小盘 RUT +20.6% 领跑</text>
    <text x="84" y="540" font-size="14" fill="#E0E6ED">债市：30Y 5.23% 年内高位，</text>
    <text x="84" y="562" font-size="14" fill="#E0E6ED">2Y YTD +72bp 熊陡</text>
    <text x="84" y="598" font-size="13" fill="#8FA3BF">资金没有股债避险切换，而是</text>
    <text x="84" y="618" font-size="13" fill="#8FA3BF">双向定价"增长韧性+利率更高"</text>

    <rect x="456" y="420" width="368" height="240" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="456" y="420" width="368" height="4" fill="#FFB300"/>
    <text x="480" y="456" font-size="16" font-weight="bold" fill="#FFB300">② 就业悖论</text>
    <text x="480" y="486" font-size="14" fill="#E0E6ED">非农：+148k → +63k → +20k</text>
    <text x="480" y="508" font-size="14" fill="#E0E6ED">→ 7 月 −23k 转负</text>
    <text x="480" y="540" font-size="14" fill="#E0E6ED">失业率却 4.3 → 4.1% 连降</text>
    <text x="480" y="572" font-size="13" fill="#8FA3BF">新增就业萎缩 + 失业率下降 =</text>
    <text x="480" y="592" font-size="13" fill="#8FA3BF">劳动参与收缩型放缓，</text>
    <text x="480" y="612" font-size="13" fill="#8FA3BF">不是典型裁员衰退形态</text>

    <rect x="852" y="420" width="368" height="240" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="852" y="420" width="368" height="4" fill="#00D4FF"/>
    <text x="876" y="456" font-size="16" font-weight="bold" fill="#00D4FF">③ 信用错定价候选</text>
    <text x="876" y="486" font-size="14" fill="#E0E6ED">HY 273bp / IG 81bp，</text>
    <text x="876" y="508" font-size="14" fill="#E0E6ED">处于历史极低分位</text>
    <text x="876" y="540" font-size="14" fill="#E0E6ED">同期非农转负、增长放缓</text>
    <text x="876" y="572" font-size="13" fill="#8FA3BF">信用市场定价"完美软着陆"，</text>
    <text x="876" y="592" font-size="13" fill="#8FA3BF">若就业持续恶化，利差是</text>
    <text x="876" y="612" font-size="13" fill="#8FA3BF">全市场最大的错定价候选</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：FRED · 美国财政部 · Yahoo Finance｜截至 2026-08-20 美东收盘</text>
</svg>
