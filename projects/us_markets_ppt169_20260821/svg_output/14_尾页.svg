<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="endGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0A0E1A"/>
  <rect width="1280" height="720" fill="url(#endGrad)"/>

  <!-- ticker strip bottom (mirror of cover) -->
  <rect x="0" y="674" width="1280" height="46" fill="#101626" opacity="0.92"/>
  <line x1="0" y1="674" x2="1280" y2="674" stroke="#22304A"/>
  <g font-family="'SF Mono','Menlo',monospace" font-size="14">
    <text x="60" y="702" fill="#5A6B85">NEXT WATCH:</text>
    <text x="170" y="702" fill="#FFB300">08月底 Core PCE</text>
    <text x="330" y="702" fill="#FFB300">09月 FOMC+点阵图</text>
    <text x="510" y="702" fill="#FFB300">10月非农修正</text>
    <text x="650" y="702" fill="#5A6B85">RE-RUN DATA:</text>
    <text x="780" y="702" fill="#00D4FF">/tmp/us_mkt → 重新采集</text>
  </g>

  <!-- central message -->
  <text x="640" y="230" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8FA3BF" letter-spacing="4">CONCLUSION</text>
  <text x="640" y="300" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="bold" fill="#E0E6ED">债市已经表态，股市还在拖延</text>
  <text x="640" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3BF">下一阶段的胜负手，不在于谁对谁错，</text>
  <text x="640" y="388" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3BF">而在于哪个市场先被迫修正定价。</text>

  <!-- three watchpoints -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="190" y="440" width="280" height="120" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="190" y="440" width="280" height="4" fill="#FFB300"/>
    <text x="330" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFB300">观察哨 ①</text>
    <text x="330" y="508" text-anchor="middle" font-size="14" fill="#E0E6ED">Core PCE（8 月底）</text>
    <text x="330" y="534" text-anchor="middle" font-size="13" fill="#8FA3BF">≥0.3% → 情景 B 概率上调</text>

    <rect x="500" y="440" width="280" height="120" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="500" y="440" width="280" height="4" fill="#00D4FF"/>
    <text x="640" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#00D4FF">观察哨 ②</text>
    <text x="640" y="508" text-anchor="middle" font-size="14" fill="#E0E6ED">9 月 FOMC 点阵图</text>
    <text x="640" y="534" text-anchor="middle" font-size="13" fill="#8FA3BF">上移 → 股市分母压力显性化</text>

    <rect x="810" y="440" width="280" height="120" rx="12" fill="#131B2E" stroke="#22304A"/>
    <rect x="810" y="440" width="280" height="4" fill="#FF5252"/>
    <text x="950" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#FF5252">观察哨 ③</text>
    <text x="950" y="508" text-anchor="middle" font-size="14" fill="#E0E6ED">非农修正 + 初请</text>
    <text x="950" y="534" text-anchor="middle" font-size="13" fill="#8FA3BF">连续 −100k → 情景 C 预警</text>
  </g>

  <!-- disclaimer -->
  <text x="640" y="620" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#5A6B85">数据截至 2026-08-20 美东收盘 · 来源：FRED 圣路易斯联储 / 美国财政部 / Yahoo Finance / CME</text>
  <text x="640" y="644" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#5A6B85">本分析基于公开实盘数据与主观情景校准，不构成任何投资建议 · 2026-08-21 制作</text>
