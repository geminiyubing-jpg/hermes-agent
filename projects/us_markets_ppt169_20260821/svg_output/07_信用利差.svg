<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">信用市场：极紧利差正在替谁背书？</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">CREDIT MARKETS · BAML ICE 高收益/投资级利差（FRED）</text>
  </g>

  <!-- Left: HY spread trend mini-chart -->
  <g id="hy-chart">
    <text x="100" y="130" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#E0E6ED">高收益利差 HY（6-8 月走势）</text>
    <!-- axes -->
    <line x1="100" y1="420" x2="620" y2="420" stroke="#22304A" stroke-width="1.5"/>
    <line x1="100" y1="150" x2="100" y2="420" stroke="#22304A" stroke-width="1.5"/>
    <g font-family="'SF Mono','Menlo',monospace" font-size="12" fill="#5A6B85">
      <text x="92" y="424" text-anchor="end">2.6</text>
      <text x="92" y="324" text-anchor="end">3.0</text>
      <text x="92" y="224" text-anchor="end">3.4</text>
      <text x="92" y="154" text-anchor="end">3.8
</text>
    </g>
    <g stroke="#1A2438" stroke-dasharray="3,5">
      <line x1="100" y1="320" x2="620" y2="320"/>
      <line x1="100" y1="220" x2="620" y2="220"/>
    </g>
    <!-- data: Jun 3.2 area → Jul low 2.65 → Aug 2.73 (approx from FRED tail rows: 2.70/2.75/2.73) -->
    <path d="M 100 240 L 150 235 L 200 250 L 250 270 L 300 290 L 350 320 L 400 345 L 450 360 L 500 368 L 550 355 L 600 353 L 620 353"
          fill="none" stroke="#00D4FF" stroke-width="3"/>
    <!-- min marker -->
    <circle cx="500" cy="368" r="5" fill="#0A0E1A" stroke="#00C853" stroke-width="2.5"/>
    <text x="500" y="396" font-size="12" fill="#00C853" text-anchor="middle" font-family="'SF Mono',monospace">年内低 2.65</text>
    <!-- last point -->
    <circle cx="620" cy="353" r="5" fill="#0A0E1A" stroke="#00D4FF" stroke-width="2.5"/>
    <text x="620" y="340" font-size="13" font-weight="bold" fill="#00D4FF" text-anchor="middle" font-family="'SF Mono',monospace">2.73</text>
    <g font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">
      <text x="100" y="440">6 月初</text>
      <text x="560" y="440">8/19</text>
    </g>
  </g>

  <!-- Right: gauge cards -->
  <g font-family="'SF Mono','Menlo',monospace">
    <rect x="680" y="120" width="540" height="130" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="704" y="152" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">当前读数 vs 历史分位（1997 至今）</text>
    <text x="704" y="192" font-size="22" font-weight="bold" fill="#00D4FF">HY 273bp</text>
    <text x="860" y="192" font-size="14" fill="#5A6B85" font-family="'PingFang SC',sans-serif">≈ 历史最低 5% 分位区</text>
    <text x="704" y="228" font-size="22" font-weight="bold" fill="#00D4FF">IG 81bp</text>
    <text x="860" y="228" font-size="14" fill="#5A6B85" font-family="'PingFang SC',sans-serif">≈ 历史最低 10% 分位区</text>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- contradiction box -->
    <rect x="680" y="270" width="540" height="180" rx="12" fill="#131B2E" stroke="#FFB300" stroke-opacity="0.6"/>
    <text x="704" y="302" font-size="16" font-weight="bold" fill="#FFB300">利差在替谁背书？</text>
    <text x="704" y="332" font-size="14" fill="#E0E6ED">273bp 的定价隐含假设：违约率维持低位、</text>
    <text x="704" y="354" font-size="14" fill="#E0E6ED">盈利稳、再融资通道畅通（"完美软着陆"）</text>
    <text x="704" y="386" font-size="14" fill="#FF5252">但同期的现实：非农 −23k、新增就业四连降、</text>
    <text x="704" y="408" font-size="14" fill="#FF5252">30Y 抵押利率站上 5.2%+</text>
    <text x="704" y="436" font-size="13" fill="#8FA3BF">利差对增长放缓"零定价"——错定价风险单向堆积</text>

    <!-- warning box -->
    <rect x="680" y="470" width="540" height="160" rx="12" fill="#131B2E" stroke="#FF5252" stroke-opacity="0.5"/>
    <text x="704" y="502" font-size="16" font-weight="bold" fill="#FF5252">历史上类比时刻</text>
    <text x="704" y="530" font-size="13.5" fill="#E0E6ED">2007-06（HY 250bp 区）与 2018-09（HY 320bp 前夜）：</text>
    <text x="704" y="552" font-size="13.5" fill="#E0E6ED">利差极紧 + 政策转向后期 + 就业首现转负</text>
    <text x="704" y="580" font-size="13.5" fill="#E0E6ED">→ 之后 6-12 个月利差均出现 150bp+ 的重新定价</text>
    <text x="704" y="608" font-size="13" fill="#8FA3BF">（历史类比非预测，但提示不对称风险：紧利差的</text>
    <text x="680" y="626" font-size="13" fill="#8FA3BF">上行空间远大于下行空间）</text>
  </g>

  <!-- left bottom: IG note -->
  <rect x="100" y="470" width="520" height="160" rx="12" fill="#131B2E" stroke="#22304A"/>
  <text x="124" y="502" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#00D4FF">投资级：收益率诱惑 vs 利差裸奔</text>
  <text x="124" y="530" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E0E6ED">IG 81bp 同为极紧分位，但 IG 全收益率 ≈ 5.2%+</text>
  <text x="124" y="552" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#E0E6ED">（4.5% 无风险 + 0.8% 利差）——票息吸引力真实存在</text>
  <text x="124" y="580" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8FA3BF">策略含义：持有 IG 拿票息可以，但利差保护极薄，</text>
  <text x="124" y="600" font-family="'PingFang SC',sans-serif" font-size="13.5" fill="#8FA3BF">久期敞口要控制——这与"熊陡"判断一致</text>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：FRED BAMLH0A0HYM2 / BAMLC0A0CM · 历史分位为近似区间（1997-2026 全史）</text>
</svg>
