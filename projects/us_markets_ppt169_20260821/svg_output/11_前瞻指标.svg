<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">未来趋势 Ⅰ：前瞻指标仪表盘</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">FORWARD-LOOKING DASHBOARD · 市场自己的预测（截至 08-20/21）</text>
  </g>

  <!-- six gauge cards -->
  <g font-family="'SF Mono','Menlo',monospace">
    <!-- Row 1 -->
    <rect x="60" y="120" width="372" height="190" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="84" y="150" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">联邦基金期货定价（ZQ 主力）</text>
    <text x="84" y="200" font-size="34" font-weight="bold" fill="#FF5252">3.72%</text>
    <text x="84" y="232" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">vs 现值 3.63%（DFF）</text>
    <rect x="84" y="252" width="324" height="34" rx="6" fill="#161E32"/>
    <text x="96" y="274" font-size="13.5" fill="#FF5252" font-family="'PingFang SC',sans-serif">含义：市场定价年内不再降息</text>

    <rect x="454" y="120" width="372" height="190" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="478" y="150" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">盈亏平衡通胀 10Y</text>
    <text x="478" y="200" font-size="34" font-weight="bold" fill="#FFB300">2.34%</text>
    <text x="478" y="232" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">5Y 2.28% · 两日 +4bp 跳升</text>
    <rect x="478" y="252" width="324" height="34" rx="6" fill="#161E32"/>
    <text x="490" y="274" font-size="13.5" fill="#FFB300" font-family="'PingFang SC',sans-serif">含义：通胀预期温和回升，Fed 空间受限</text>

    <rect x="848" y="120" width="372" height="190" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="872" y="150" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">曲线形态 10Y−2Y / 10Y−3M</text>
    <text x="872" y="200" font-size="34" font-weight="bold" fill="#00C853">+46 / +82</text>
    <text x="872" y="232" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">单位 bp · 均已正常化转正</text>
    <rect x="872" y="252" width="324" height="34" rx="6" fill="#161E32"/>
    <text x="884" y="274" font-size="13.5" fill="#00C853" font-family="'PingFang SC',sans-serif">含义：衰退利差警报解除（但属熊陡式解除）</text>

    <!-- Row 2 -->
    <rect x="60" y="330" width="372" height="190" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="84" y="360" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">VIX 恐慌指数</text>
    <text x="84" y="410" font-size="34" font-weight="bold" fill="#00D4FF">14.89</text>
    <text x="84" y="442" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">长期均值约 19-20</text>
    <rect x="84" y="462" width="324" height="34" rx="6" fill="#161E32"/>
    <text x="96" y="484" font-size="13.5" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">含义：期权市场无应激，也意味着无保护垫</text>

    <rect x="454" y="330" width="372" height="190" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="478" y="360" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">信用利差 HY / IG</text>
    <text x="478" y="410" font-size="34" font-weight="bold" fill="#00C853">273 / 81</text>
    <text x="478" y="442" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">单位 bp · 双双极低分位</text>
    <rect x="478" y="462" width="324" height="34" rx="6" fill="#161E32"/>
    <text x="490" y="484" font-size="13.5" fill="#FFB300" font-family="'PingFang SC',sans-serif">含义：定价完美软着陆，无违约风险缓冲</text>

    <rect x="848" y="330" width="372" height="190" rx="12" fill="#131B2E" stroke="#22304A"/>
    <text x="872" y="360" font-size="14" fill="#8FA3BF" font-family="'PingFang SC',sans-serif">黄金 8 月动量</text>
    <text x="872" y="410" font-size="34" font-weight="bold" fill="#FFB300">+12.8%</text>
    <text x="872" y="442" font-size="13" fill="#5A6B85" font-family="'PingFang SC',sans-serif">1 个月涨幅（7/16 低点起 +15%）</text>
    <rect x="872" y="462" width="324" height="34" rx="6" fill="#161E32"/>
    <text x="884" y="484" font-size="13.5" fill="#FFB300" font-family="'PingFang SC',sans-serif">含义：避险/地缘/央行购金需求回归的信号</text>
  </g>

  <!-- bottom synthesis -->
  <rect x="60" y="546" width="1160" height="110" rx="12" fill="#161E32" stroke="#FFB300" stroke-opacity="0.6"/>
  <text x="84" y="580" font-family="'PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#FFB300">仪表盘合成的方向判断</text>
  <text x="84" y="610" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">利率路径：更高更久（期货定价 + 通胀预期回升双重确认）｜风险偏好：股市/信用/波动率三重自满，拥挤在"软着陆"一侧</text>
  <text x="84" y="636" font-family="'PingFang SC',sans-serif" font-size="14.5" fill="#E0E6ED">唯一的逆势信号是黄金——当所有风险指标都在睡觉时，它的 8 月拉升像是有人已经开始悄悄买保险。</text>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：FRED（VIXCLS/DFF/T10YIE/T5YIE/BAML）· CME 30 天联邦基金期货（Yahoo ZQ 主力合约）</text>
</svg>
