<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0A0E1A"/>

  <g id="header">
    <rect x="60" y="44" width="4" height="30" fill="#00D4FF"/>
    <text x="80" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#E0E6ED">股市全景：指数普涨，小盘领跑</text>
    <text x="80" y="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8FA3BF">EQUITY OVERVIEW · YTD 表现（截至 08-20）</text>
  </g>

  <!-- YTD bar chart -->
  <g font-family="'SF Mono','Menlo',monospace">
    <!-- axis -->
    <line x1="260" y1="140" x2="260" y2="560" stroke="#22304A"/>
    <text x="120" y="145" font-size="12" fill="#5A6B85" font-family="'PingFang SC',sans-serif">YTD 涨幅</text>

    <!-- RUT +20.57 -->
    <text x="200" y="185" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">罗素 2000</text>
    <rect x="260" y="160" width="618" height="36" rx="4" fill="#00C853" opacity="0.9"/>
    <text x="888" y="184" font-size="17" font-weight="bold" fill="#00C853">+20.57%</text>

    <!-- NASDAQ +12.16 -->
    <text x="200" y="255" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">纳斯达克</text>
    <rect x="260" y="230" width="366" height="36" rx="4" fill="#00C853" opacity="0.7"/>
    <text x="636" y="254" font-size="17" font-weight="bold" fill="#00C853">+12.16%</text>

    <!-- S&P +11.62 -->
    <text x="200" y="325" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">标普 500</text>
    <rect x="260" y="300" width="350" height="36" rx="4" fill="#00C853" opacity="0.7"/>
    <text x="620" y="324" font-size="17" font-weight="bold" fill="#00C853">+11.62%</text>

    <!-- DOW +9.77 -->
    <text x="200" y="395" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">道琼斯</text>
    <rect x="260" y="370" width="294" height="36" rx="4" fill="#00C853" opacity="0.6"/>
    <text x="564" y="394" font-size="17" font-weight="bold" fill="#00C853">+9.77%</text>

    <!-- GOLD +6.15 -->
    <text x="200" y="465" text-anchor="end" font-size="15" fill="#E0E6ED" font-family="'PingFang SC',sans-serif">黄金</text>
    <rect x="260" y="440" width="185" height="36" rx="4" fill="#FFB300" opacity="0.75"/>
    <text x="455" y="464" font-size="17" font-weight="bold" fill="#FFB300">+6.15%</text>

    <!-- annotations right -->
    <g font-family="'PingFang SC',sans-serif">
      <rect x="900" y="160" width="320" height="120" rx="10" fill="#131B2E" stroke="#22304A"/>
      <text x="920" y="190" font-size="14" font-weight="bold" fill="#00D4FF">小盘跑赢大盘 9 个百分点</text>
      <text x="920" y="216" font-size="13" fill="#8FA3BF">RUT 20.6% vs S&amp;P 11.6%，</text>
      <text x="920" y="236" font-size="13" fill="#8FA3BF">降息受益 + 板块轮动扩散，</text>
      <text x="920" y="256" font-size="13" fill="#8FA3BF">不再是 Mag7 独舞的行情</text>

      <rect x="900" y="300" width="320" height="120" rx="10" fill="#131B2E" stroke="#22304A"/>
      <text x="920" y="330" font-size="14" font-weight="bold" fill="#00D4FF">四大指数全部站上均线</text>
      <text x="920" y="356" font-size="13" fill="#8FA3BF">MA50 / MA200 双多头排列，</text>
      <text x="920" y="376" font-size="13" fill="#8FA3BF">S&amp;P 距 52 周高点仅 −2.0%，</text>
      <text x="920" y="396" font-size="13" fill="#8FA3BF">趋势结构完好</text>

      <rect x="900" y="440" width="320" height="120" rx="10" fill="#131B2E" stroke="#22304A"/>
      <text x="920" y="470" font-size="14" font-weight="bold" fill="#FFB300">黄金的 V 型暗线</text>
      <text x="920" y="496" font-size="13" fill="#8FA3BF">YTD 仅 +6.2% 掩盖剧震：</text>
      <text x="920" y="516" font-size="13" fill="#8FA3BF">1 月 5318 → 7 月 3986（−25%）</text>
      <text x="920" y="536" font-size="13" fill="#8FA3BF">→ 8 月 4592 反弹 +15%</text>
    </g>

    <text x="260" y="600" font-size="12" fill="#5A6B85" font-family="'PingFang SC',sans-serif">点位：S&amp;P 7,641 · NASDAQ 26,067 · DOW 52,759 · RUT 2,992 · 黄金 4,592 美元/盎司</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5A6B85">数据源：Yahoo Finance 日线，2026-08-20 收盘</text>
</svg>
