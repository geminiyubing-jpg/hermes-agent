<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">京沪对照：同一个十年，两种收敛路径</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">土地出让金与房价路径对比（2016-2025）—— 北京的「缩量提质」vs 上海的「稳量稳价」</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="1160" height="38" fill="#2B2B2B" />
    <text x="230" y="137" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">维度</text>
    <text x="640" y="137" text-anchor="middle" font-size="14.5" font-weight="600" fill="#C9A227">北京</text>
    <text x="1010" y="137" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">上海</text>

    <rect x="60" y="150" width="1160" height="46" fill="#FFFFFF" />
    <text x="230" y="179" text-anchor="middle" font-size="13.5" fill="#2B2B2B">2025涉宅出让金</text>
    <text x="640" y="179" text-anchor="middle" font-size="14" font-weight="600" fill="#8C1F28" font-family="'Helvetica Neue', sans-serif">1427亿（40宗）</text>
    <text x="1010" y="179" text-anchor="middle" font-size="14" font-weight="600" fill="#33587A" font-family="'Helvetica Neue', sans-serif">~1400亿+（上海连续3年全国前三）</text>

    <rect x="60" y="196" width="1160" height="46" fill="#F2EDE3" />
    <text x="230" y="225" text-anchor="middle" font-size="13.5" fill="#2B2B2B">宅地溢价率 2025</text>
    <text x="640" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#8C1F28" font-family="'Helvetica Neue', sans-serif">平均~14%，最高39.2%</text>
    <text x="1010" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#33587A" font-family="'Helvetica Neue', sans-serif">平均15.3%（全年成交101宗）</text>

    <rect x="60" y="242" width="1160" height="46" fill="#FFFFFF" />
    <text x="230" y="271" text-anchor="middle" font-size="13.5" fill="#2B2B2B">房价路径</text>
    <text x="640" y="271" text-anchor="middle" font-size="13.5" fill="#8C1F28">涨→跌回2016（十年+16%）</text>
    <text x="1010" y="271" text-anchor="middle" font-size="13.5" fill="#33587A">涨→缓跌守住大部分涨幅</text>

    <rect x="60" y="288" width="1160" height="46" fill="#F2EDE3" />
    <text x="230" y="317" text-anchor="middle" font-size="13.5" fill="#2B2B2B">供给策略</text>
    <text x="640" y="317" text-anchor="middle" font-size="13.5" fill="#8C1F28">宗数-62%，单价+173%<tspan font-size="12" fill="#6B6B6B">（极致缩量）</tspan></text>
    <text x="1010" y="317" text-anchor="middle" font-size="13.5" fill="#33587A">宗数为北京2.5倍，平稳放量<tspan font-size="12" fill="#6B6B6B">（稳量）</tspan></text>

    <rect x="60" y="334" width="1160" height="46" fill="#FFFFFF" />
    <text x="230" y="363" text-anchor="middle" font-size="13.5" fill="#2B2B2B">人口</text>
    <text x="640" y="363" text-anchor="middle" font-size="13.5" fill="#8C1F28">2180万横盘（疏解导向）</text>
    <text x="1010" y="363" text-anchor="middle" font-size="13.5" fill="#33587A">~2480万缓增（抢人导向）</text>

    <rect x="60" y="380" width="1160" height="46" fill="#F2EDE3" />
    <text x="230" y="409" text-anchor="middle" font-size="13.5" fill="#2B2B2B">2026土拍温度</text>
    <text x="640" y="409" text-anchor="middle" font-size="13.5" fill="#8C1F28">四季青97.6亿地王+苹果园23.5%</text>
    <text x="1010" y="409" text-anchor="middle" font-size="13.5" fill="#33587A">上半年宅地出让金521亿全国第一</text>
  </g>
  <rect x="60" y="112" width="1160" height="314" fill="none" stroke="#E5DED2" />

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,448 H620 A12,12 0 0 1 632,460 V624 A12,12 0 0 1 620,636 H72 A12,12 0 0 1 60,624 V460 A12,12 0 0 1 72,448 Z" />
    <text x="88" y="482" font-size="15.5" font-weight="700" fill="#8C1F28">为什么北京房价回撤更深？</text>
    <text x="88" y="512" font-size="13.5" fill="#2B2B2B">· 2017.317最严调控+人口主动疏解，</text>
    <text x="88" y="536" font-size="13.5" fill="#2B2B2B">  基本面顶点比上海早出现 3 年</text>
    <text x="88" y="566" font-size="13.5" fill="#2B2B2B">· 供给端激进缩量反成双刃剑：</text>
    <text x="88" y="590" font-size="13.5" fill="#2B2B2B">  新房高价化把刚需全推向二手，</text>
    <text x="88" y="614" font-size="13.5" fill="#2B2B2B">  二手承压更深、出清更慢</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M660,448 H1208 A12,12 0 0 1 1220,460 V624 A12,12 0 0 1 1208,636 H660 A12,12 0 0 1 648,624 V460 A12,12 0 0 1 660,448 Z" />
    <text x="676" y="482" font-size="15.5" font-weight="700" fill="#33587A">殊途同归的两个信号</text>
    <text x="676" y="512" font-size="13.5" fill="#2B2B2B">· 土地端：两市都出现「点状高热」</text>
    <text x="676" y="536" font-size="13.5" fill="#2B2B2B">  ——核心区争抢与郊区底价并存</text>
    <text x="676" y="566" font-size="13.5" fill="#2B2B2B">· 需求端：两市豪宅/顶豪 segment</text>
    <text x="676" y="590" font-size="13.5" fill="#2B2B2B">  率先回暖 —— 财富效应先于</text>
    <text x="676" y="614" font-size="13.5" fill="#2B2B2B">  刚需复苏，是全国一线共同规律</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：中指院/21经济网/证券时报（A/B+）· 上海人口为2024口径</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">19 / 22</text>
</svg>