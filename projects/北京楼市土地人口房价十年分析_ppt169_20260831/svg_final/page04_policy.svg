<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">政策编年史：四轮调控塑造的十年</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">每一轮房价拐点背后都站着一项制度变量</text>

  
  <line x1="90" y1="200" x2="1200" y2="200" stroke="#8C1F28" stroke-width="4" />

  
  <g font-family="'PingFang SC', sans-serif">
    
    <circle cx="180" cy="200" r="11" fill="#8C1F28" />
    <circle cx="180" cy="200" r="5" fill="#F7F5F0" />
    <path fill="#8C1F28" d="M103,120 H317 A8,8 0 0 1 325,128 V176 A8,8 0 0 1 317,184 H103 A8,8 0 0 1 95,176 V128 A8,8 0 0 1 103,120 Z" />
    <text x="210" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2017.3.17</text>
    <text x="210" y="170" text-anchor="middle" font-size="13" fill="#FFFFFF">认房又认贷 · 史上最严</text>
    <path fill="#FFFFFF" stroke="#E5DED2" d="M103,222 H317 A8,8 0 0 1 325,230 V310 A8,8 0 0 1 317,318 H103 A8,8 0 0 1 95,310 V230 A8,8 0 0 1 103,222 Z" />
    <text x="112" y="248" font-size="12.5" fill="#2B2B2B">二套首付60-80%、暂停发放</text>
    <text x="112" y="270" font-size="12.5" fill="#2B2B2B">25年以上贷款；房价应声</text>
    <text x="112" y="292" font-size="12.5" fill="#2B2B2B">见顶，2017-19阴跌三年</text>

    
    <circle cx="460" cy="200" r="11" fill="#4A7BA6" />
    <circle cx="460" cy="200" r="5" fill="#F7F5F0" />
    <path fill="#4A7BA6" d="M383,120 H597 A8,8 0 0 1 605,128 V176 A8,8 0 0 1 597,184 H383 A8,8 0 0 1 375,176 V128 A8,8 0 0 1 383,120 Z" />
    <text x="490" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2021.2</text>
    <text x="490" y="170" text-anchor="middle" font-size="13" fill="#FFFFFF">两集中供地 · 房贷集中度</text>
    <path fill="#FFFFFF" stroke="#E5DED2" d="M383,222 H597 A8,8 0 0 1 605,230 V310 A8,8 0 0 1 597,318 H383 A8,8 0 0 1 375,310 V230 A8,8 0 0 1 383,222 Z" />
    <text x="392" y="248" font-size="12.5" fill="#2B2B2B">22城一年三批集中出让；</text>
    <text x="392" y="270" font-size="12.5" fill="#2B2B2B">触顶摇号+销售限价成为</text>
    <text x="392" y="292" font-size="12.5" fill="#2B2B2B">标配——土地市场制度化</text>

    
    <circle cx="740" cy="200" r="11" fill="#C9A227" />
    <circle cx="740" cy="200" r="5" fill="#F7F5F0" />
    <path fill="#A08318" d="M663,120 H877 A8,8 0 0 1 885,128 V176 A8,8 0 0 1 877,184 H663 A8,8 0 0 1 655,176 V128 A8,8 0 0 1 663,120 Z" />
    <text x="770" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2023.9</text>
    <text x="770" y="170" text-anchor="middle" font-size="13" fill="#FFFFFF">认房不认贷 · 政策转向</text>
    <path fill="#FFFFFF" stroke="#E5DED2" d="M663,222 H877 A8,8 0 0 1 885,230 V310 A8,8 0 0 1 877,318 H663 A8,8 0 0 1 655,310 V230 A8,8 0 0 1 663,222 Z" />
    <text x="672" y="248" font-size="12.5" fill="#2B2B2B">从压制转向支持刚改；</text>
    <text x="672" y="270" font-size="12.5" fill="#2B2B2B">但恰逢二手峰值后下行</text>
    <text x="672" y="292" font-size="12.5" fill="#2B2B2B">——刺激未能扭转趋势</text>

    
    <circle cx="1020" cy="200" r="11" fill="#B3541E" />
    <circle cx="1020" cy="200" r="5" fill="#F7F5F0" />
    <path fill="#B3541E" d="M943,120 H1157 A8,8 0 0 1 1165,128 V176 A8,8 0 0 1 1157,184 H943 A8,8 0 0 1 935,176 V128 A8,8 0 0 1 943,120 Z" />
    <text x="1050" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2026.8.28</text>
    <text x="1050" y="170" text-anchor="middle" font-size="13" fill="#FFFFFF">三箭齐发 · 制度重构</text>
    <path fill="#FFFFFF" stroke="#E5DED2" d="M943,222 H1157 A8,8 0 0 1 1165,230 V310 A8,8 0 0 1 1157,318 H943 A8,8 0 0 1 935,310 V230 A8,8 0 0 1 943,222 Z" />
    <text x="952" y="248" font-size="12.5" fill="#2B2B2B">封顶预售/现房销售/主办</text>
    <text x="952" y="270" font-size="12.5" fill="#2B2B2B">银行制/房贷40年；调控</text>
    <text x="952" y="292" font-size="12.5" fill="#2B2B2B">工具退役→制度化管理</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,344 H1207 A12,12 0 0 1 1219,356 V632 A12,12 0 0 1 1207,644 H72 A12,12 0 0 1 60,632 V356 A12,12 0 0 1 72,344 Z" />
    <text x="90" y="382" font-size="17" font-weight="600" fill="#8C1F28">政策周期与房价反应的错位规律</text>
    <text x="90" y="418" font-size="14" fill="#2B2B2B">· <tspan font-weight="600" fill="#8C1F28">收紧即时见效</tspan>：317后北京二手当年即跌7.1%——压制性政策对价格的弹性远大于支持性政策</text>
    <text x="90" y="450" font-size="14" fill="#2B2B2B">· <tspan font-weight="600" fill="#8C1F28">放松钝化明显</tspan>：2023认房不认贷、2024取消限价，均未止住二手下行——下行期政策只能"托"不能"拉"</text>
    <text x="90" y="482" font-size="14" fill="#2B2B2B">· <tspan font-weight="600" fill="#8C1F28">土地制度先行</tspan>：集中供地(2021)→限价放开(2024)→现房销售(2026)，供给端改革节奏快于需求端</text>
    <text x="90" y="514" font-size="14" fill="#2B2B2B">· <tspan font-weight="600" fill="#8C1F28">本轮不同以往</tspan>：8·28不是逆周期刺激，而是制度换轨——对市场的影响以"年"为单位慢释放</text>
    <path fill="#8C1F28" opacity="0.08" d="M98,540 H1181 A8,8 0 0 1 1189,548 V604 A8,8 0 0 1 1181,612 H98 A8,8 0 0 1 90,604 V548 A8,8 0 0 1 98,540 Z" />
    <text x="640" y="570" text-anchor="middle" font-size="14" font-weight="600" fill="#8C1F28">规律总结：北京楼市对"打压"敏感、对"扶持"钝化</text>
    <text x="640" y="596" text-anchor="middle" font-size="13" fill="#6B6B6B">这决定了前瞻判断的基调——修复靠时间换空间，而非政策脉冲</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：历年政策文件/新华社/央视（A）；房价反应见P12</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">04 / 22</text>
</svg>