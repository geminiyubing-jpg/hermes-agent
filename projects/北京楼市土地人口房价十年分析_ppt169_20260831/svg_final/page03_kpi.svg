<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  
  <text x="60" y="66" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="30" font-weight="700" fill="#2B2B2B">十年总览：六个关键数字</text>
  <text x="60" y="96" font-family="'PingFang SC', sans-serif" font-size="15" fill="#6B6B6B">土地出让金累计 1.92 万亿元 —— 全国城市第一</text>

  
  <g font-family="'Helvetica Neue', 'PingFang SC', sans-serif">
    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M70,125 H423 A10,10 0 0 1 433,135 V265 A10,10 0 0 1 423,275 H70 A10,10 0 0 1 60,265 V135 A10,10 0 0 1 70,125 Z" />
    <text x="85" y="170" font-size="40" font-weight="700" fill="#8C1F28">2796 亿</text>
    <text x="85" y="200" font-size="15" fill="#2B2B2B" font-family="'PingFang SC', sans-serif">2017 年出让金峰值（+228%）</text>
    <text x="85" y="224" font-size="13" fill="#6B6B6B" font-family="'PingFang SC', sans-serif">104 宗地 · 限竞房/共有产权集中入市</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M463,125 H816 A10,10 0 0 1 826,135 V265 A10,10 0 0 1 816,275 H463 A10,10 0 0 1 453,265 V135 A10,10 0 0 1 463,125 Z" />
    <text x="478" y="170" font-size="40" font-weight="700" fill="#8C1F28">1427 亿</text>
    <text x="478" y="200" font-size="15" fill="#2B2B2B" font-family="'PingFang SC', sans-serif">2025 年出让金（较峰值 -49%）</text>
    <text x="478" y="224" font-size="13" fill="#6B6B6B" font-family="'PingFang SC', sans-serif">40 宗地 · 仍居全国城市第一</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M856,125 H1209 A10,10 0 0 1 1219,135 V265 A10,10 0 0 1 1209,275 H856 A10,10 0 0 1 846,265 V135 A10,10 0 0 1 856,125 Z" />
    <text x="871" y="170" font-size="40" font-weight="700" fill="#B3541E">104 → 40</text>
    <text x="871" y="200" font-size="15" fill="#2B2B2B" font-family="'PingFang SC', sans-serif">年成交宗数（2017→2025，-62%）</text>
    <text x="871" y="224" font-size="13" fill="#6B6B6B" font-family="'PingFang SC', sans-serif">单宗均价 26.9亿 → 35.7亿（+33%）</text>

    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M70,295 H423 A10,10 0 0 1 433,305 V435 A10,10 0 0 1 423,445 H70 A10,10 0 0 1 60,435 V305 A10,10 0 0 1 70,295 Z" />
    <text x="85" y="340" font-size="40" font-weight="700" fill="#C9A227">+173%</text>
    <text x="85" y="370" font-size="15" fill="#2B2B2B" font-family="'PingFang SC', sans-serif">宅地楼面价（1.5万 → 4.1万/㎡）</text>
    <text x="85" y="394" font-size="13" fill="#6B6B6B" font-family="'PingFang SC', sans-serif">2025 树村/祈年大街双双破 10 万/㎡</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M463,295 H816 A10,10 0 0 1 826,305 V435 A10,10 0 0 1 816,445 H463 A10,10 0 0 1 453,435 V305 A10,10 0 0 1 463,295 Z" />
    <text x="478" y="340" font-size="40" font-weight="700" fill="#4A7BA6">2180 万</text>
    <text x="478" y="370" font-size="15" fill="#2B2B2B" font-family="'PingFang SC', sans-serif">常住人口（十年净变 +0.3%）</text>
    <text x="478" y="394" font-size="13" fill="#6B6B6B" font-family="'PingFang SC', sans-serif">2017-19 疏解 -19.3万 · 七普后 -9.3万</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M856,295 H1209 A10,10 0 0 1 1219,305 V435 A10,10 0 0 1 1209,445 H856 A10,10 0 0 1 846,435 V305 A10,10 0 0 1 856,295 Z" />
    <text x="871" y="340" font-size="40" font-weight="700" fill="#B3541E">-35%</text>
    <text x="871" y="370" font-size="15" fill="#2B2B2B" font-family="'PingFang SC', sans-serif">二手房价自 2023.4 峰值回撤</text>
    <text x="871" y="394" font-size="13" fill="#6B6B6B" font-family="'PingFang SC', sans-serif">7.03万 → 4.59万，回到 2016 年中</text>
  </g>

  
  <path fill="#8C1F28" d="M70,472 H1209 A10,10 0 0 1 1219,482 V536 A10,10 0 0 1 1209,546 H70 A10,10 0 0 1 60,536 V482 A10,10 0 0 1 70,472 Z" />
  <text x="90" y="503" font-family="'PingFang SC', sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">本页要点</text>
  <text x="90" y="530" font-family="'PingFang SC', sans-serif" font-size="15" fill="#FFFFFF">人口横盘封顶需求总量，土地以「缩量提价」对冲财政，房价完成一轮涨跌周期 —— 三条曲线的方向分歧构成十年的主线。</text>

  
  <text x="60" y="690" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：规自委/中指院（A）· 我爱我家/gotohui（B+）· 2019-21出让金为估计值（C）</text>
  <text x="1220" y="690" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">03 / 22</text>
</svg>