  <path fill="#8C1F28" d="M70,520 H1209 A10,10 0 0 1 1219,530 V622 A10,10 0 0 1 1209,632 H70 A10,10 0 0 1 60,622 V530 A10,10 0 0 1 70,520 Z" />
  <text x="90" y="553" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">本页要点</text>
  <text x="90" y="581" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">国央企+地方国资拿地占 92.7%，联合体拿地 14 宗（2024年仅5宗）—— 地价门槛把民企几乎清出牌桌，抱团分险成为生存策略。</text>
  <text x="90" y="607" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">2026 前8月：海淀四季青 97.6亿新地王（溢价14%）延续核心区热；同期房山/顺义底价 —— 分化格局在新政下进一步固化。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：凤凰网房产/新京报整理规自委成交公告（A/B+）</text>
