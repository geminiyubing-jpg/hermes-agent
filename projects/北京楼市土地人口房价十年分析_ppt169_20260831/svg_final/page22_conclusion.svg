<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">结论：三线联动与前瞻判断</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,100 H588 A12,12 0 0 1 600,112 V378 A12,12 0 0 1 588,390 H72 A12,12 0 0 1 60,378 V112 A12,12 0 0 1 72,100 Z" />
    <text x="90" y="136" font-size="17" font-weight="600" fill="#8C1F28">十年因果链</text>
    <path fill="#4A7BA6" opacity="0.12" d="M108,158 H552 A8,8 0 0 1 560,166 V202 A8,8 0 0 1 552,210 H108 A8,8 0 0 1 100,202 V166 A8,8 0 0 1 108,158 Z" />
    <text x="120" y="180" font-size="14" font-weight="600" fill="#33587A">人口横盘 2180 万</text>
    <text x="120" y="200" font-size="12.5" fill="#33587A">需求总量封顶 → 只剩结构故事</text>
    <text x="330" y="230" font-size="18" fill="#8C1F28">↓</text>
    <path fill="#8C1F28" opacity="0.10" d="M108,240 H552 A8,8 0 0 1 560,248 V284 A8,8 0 0 1 552,292 H108 A8,8 0 0 1 100,284 V248 A8,8 0 0 1 108,240 Z" />
    <text x="120" y="262" font-size="14" font-weight="600" fill="#8C1F28">土地缩量提质（宗数-62%）</text>
    <text x="120" y="282" font-size="12.5" fill="#8C1F28">供给收缩全部投向核心区 → 地价+173%</text>
    <text x="330" y="312" font-size="18" fill="#8C1F28">↓</text>
    <path fill="#C9A227" opacity="0.15" d="M108,322 H552 A8,8 0 0 1 560,330 V366 A8,8 0 0 1 552,374 H108 A8,8 0 0 1 100,366 V330 A8,8 0 0 1 108,322 Z" />
    <text x="120" y="344" font-size="14" font-weight="600" fill="#8C6F14">房价结构性分裂</text>
    <text x="120" y="364" font-size="12.5" fill="#8C6F14">二手普跌回2016 · 核心区新房6-10万挺住</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M642,100 H1208 A12,12 0 0 1 1220,112 V378 A12,12 0 0 1 1208,390 H642 A12,12 0 0 1 630,378 V112 A12,12 0 0 1 642,100 Z" />
    <text x="660" y="136" font-size="17" font-weight="600" fill="#8C1F28">8·28 新政的耦合效应</text>
    <text x="660" y="166" font-size="13.5" fill="#2B2B2B">· 封顶预售 + 现房销售 → 开发周期拉长 1 年以上</text>
    <text x="660" y="192" font-size="13.5" fill="#2B2B2B">· 主办银行制 + 竣备放贷 → 房企现金流模型重构</text>
    <text x="660" y="218" font-size="13.5" fill="#2B2B2B">· 新地首批适用（2026 出让）→ 供给低谷锁定 2027-28</text>
    <path fill="#8C1F28" d="M668,238 H1182 A8,8 0 0 1 1190,246 V296 A8,8 0 0 1 1182,304 H668 A8,8 0 0 1 660,296 V246 A8,8 0 0 1 668,238 Z" />
    <text x="680" y="264" font-size="14" font-weight="600" fill="#FFFFFF">核心判断（80% 概率）</text>
    <text x="680" y="288" font-size="13" fill="#FFFFFF">2027-28 核心区新房供需实质性反转，价格获得支撑</text>
    <text x="660" y="332" font-size="13.5" fill="#2B2B2B">· 远郊存量消化周期进一步拉长（利空远郊二手）</text>
    <text x="660" y="358" font-size="13.5" fill="#2B2B2B">· 高价地开发贷 LTV 恶化风险值得银行前瞻压测</text>
    <text x="660" y="384" font-size="13.5" fill="#2B2B2B">· 花乡地块底价托底（2025.12）已是财政脉冲预警</text>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M70,412 H423 A10,10 0 0 1 433,422 V572 A10,10 0 0 1 423,582 H70 A10,10 0 0 1 60,572 V422 A10,10 0 0 1 70,412 Z" />
    <text x="88" y="446" font-size="15" font-weight="600" fill="#8C1F28">自住家庭</text>
    <text x="88" y="474" font-size="13" fill="#2B2B2B">· 新规新地=所见即所得+拿房再还贷</text>
    <text x="88" y="500" font-size="13" fill="#2B2B2B">· 老项目照旧查五证+工程进度</text>
    <text x="88" y="526" font-size="13" fill="#2B2B2B">· 40年贷降月供15%但总利息+39%</text>
    <text x="88" y="552" font-size="13" fill="#2B2B2B">· 核心区深V可期，远郊继续消化</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M463,412 H816 A10,10 0 0 1 826,422 V572 A10,10 0 0 1 816,582 H463 A10,10 0 0 1 453,572 V422 A10,10 0 0 1 463,412 Z" />
    <text x="481" y="446" font-size="15" font-weight="600" fill="#8C1F28">银行同业（审计视角）</text>
    <text x="481" y="474" font-size="13" fill="#2B2B2B">· 主办行资金归集的操作风险</text>
    <text x="481" y="500" font-size="13" fill="#2B2B2B">· 年度押品重估的估值独立性</text>
    <text x="481" y="526" font-size="13" fill="#2B2B2B">· 40年贷的久期错配（负债5年为主）</text>
    <text x="481" y="552" font-size="13" fill="#2B2B2B">· 2023-25高价地开发贷前瞻压测</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M856,412 H1209 A10,10 0 0 1 1219,422 V572 A10,10 0 0 1 1209,582 H856 A10,10 0 0 1 846,572 V422 A10,10 0 0 1 856,412 Z" />
    <text x="874" y="446" font-size="15" font-weight="600" fill="#8C1F28">观察哨（2026-27）</text>
    <text x="874" y="474" font-size="13" fill="#2B2B2B">· 北京新地是否挂「现房销售」条件</text>
    <text x="874" y="500" font-size="13" fill="#2B2B2B">· 9-10月一线土拍热度延续性</text>
    <text x="874" y="526" font-size="13" fill="#2B2B2B">· REITs 二级走势（政策第三支箭）</text>
    <text x="874" y="552" font-size="13" fill="#2B2B2B">· 二手挂牌量去化（筑底信号）</text>
  </g>

  <text x="60" y="640" font-family="'PingFang SC', sans-serif" font-size="13" fill="#6B6B6B">风险提示：本分析基于公开数据推演，预测为概率判断而非承诺；2019-21出让金为估计口径。</text>
  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">综合：规自委/统计局/中指院/贝壳系/金规〔2026〕5号（分级标注见各页脚）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">22 / 22</text>
</svg>