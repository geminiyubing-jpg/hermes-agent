  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">二手市场：量在价先，出清进行时</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">存量房成交套数（2020-2024）与 2026 月度节奏 —— 流动性才是底部的先行指标</text>

  
  <g>
    <text x="80" y="126" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#4A7BA6">存量房（二手）网签（万套/年）</text>
