      <text x="162" y="442">2020</text><text x="267" y="442">2021</text><text x="372" y="442">2022</text>
      <text x="477" y="442">2023</text><text x="565" y="442">2024</text>
    </g>
    <text x="350" y="462" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">住建委口径 · 2021年19.11万套为历史峰值</text>
  </g>

  
  <g>
    <text x="680" y="126" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#8C1F28">2026 年月度二手成交（万套）+ 均价</text>
    <g stroke="#DDD5C8" stroke-width="1">
      <line x1="700" y1="420" x2="1200" y2="420" />
      <line x1="700" y1="340" x2="1200" y2="340" stroke-dasharray="4,4" />
