    <g font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="600" fill="#33587A" text-anchor="middle">
      <text x="162" y="179">16.46</text><text x="267" y="142">19.11</text><text x="372" y="253">14.09</text>
      <text x="477" y="236">15.32</text><text x="565" y="208">17.32</text>
