    <rect x="700" y="150" width="500" height="0" fill="none" />
    <text x="950" y="462" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">7月同比+9% —— 以价换量下月均1.3万套仍属活跃</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,484 H1207 A12,12 0 0 1 1219,496 V624 A12,12 0 0 1 1207,636 H72 A12,12 0 0 1 60,624 V496 A12,12 0 0 1 72,484 Z" />
  <text x="90" y="516" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#C9A227">本页要点</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">① 二手是北京楼市的「主战场」：年成交 14-19 万套，约为新房的 3 倍 —— 二手定价权已经取代新房成为市场锚。</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">② 量的信号好于价：2026 年月均 1.3 万套、7 月同比 +9% —— 「以价换量」持续，说明刚需承接盘存在，出清以时间换空间。</text>
  <text x="90" y="600" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">③ 但价仍未见底信号：均价同比 -15.9%（2026.8），挂牌/成交裂口未收敛 —— 底部确认需等待「量稳 + 挂牌去化 + 同比转正」三条件齐备。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：住建委网签(A)/gotohui月度(B+)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">15 / 22</text>
</svg>