<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">估值与信贷：三个温度计都偏低烧</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">租售比 / 房价收入比 / 个人住房贷款余额 —— 判断底部区域的交叉证据</text>

  
  <g font-family="'PingFang SC', sans-serif">
    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,116 H421 A12,12 0 0 1 433,128 V394 A12,12 0 0 1 421,406 H72 A12,12 0 0 1 60,394 V128 A12,12 0 0 1 72,116 Z" />
    <path fill="#4A7BA6" d="M64,116 H429 A4,4 0 0 1 433,120 V120 A4,4 0 0 1 429,124 H64 A4,4 0 0 1 60,120 V120 A4,4 0 0 1 64,116 Z" />
    <text x="88" y="158" font-size="16" font-weight="700" fill="#33587A">① 租售比（年租金回报率）</text>
    <text x="88" y="212" font-family="'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#2B2B2B">2.62<tspan font-size="18" fill="#6B6B6B">%</tspan></text>
    <text x="88" y="240" font-size="13" fill="#6B6B6B">2026.7 全市二手（月租100元/㎡）</text>
    <line x1="88" y1="258" x2="405" y2="258" stroke="#E5DED2" />
    
    <path fill="#E5DED2" d="M97,278 H396 A9,9 0 0 1 405,287 V287 A9,9 0 0 1 396,296 H97 A9,9 0 0 1 88,287 V287 A9,9 0 0 1 97,278 Z" />
    <path fill="#4A7BA6" d="M97,278 H232 A9,9 0 0 1 241,287 V287 A9,9 0 0 1 232,296 H97 A9,9 0 0 1 88,287 V287 A9,9 0 0 1 97,278 Z" />
    <line x1="232" y1="270" x2="232" y2="304" stroke="#B3541E" stroke-width="2" stroke-dasharray="3,3" />
    <text x="232" y="322" text-anchor="middle" font-size="11.5" fill="#B3541E">按揭利率~3.0%</text>
    <text x="88" y="352" font-size="13" fill="#2B2B2B">· 十年期国债 ~1.8%：租售比已</text>
    <text x="88" y="376" font-size="13" fill="#2B2B2B">  高于无风险利率+风险溢价窄幅</text>
    <text x="88" y="400" font-size="13" fill="#2B2B2B">· 国际健康区间 3-5% 仍差距明显</text>

    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M465,116 H814 A12,12 0 0 1 826,128 V394 A12,12 0 0 1 814,406 H465 A12,12 0 0 1 453,394 V128 A12,12 0 0 1 465,116 Z" />
    <path fill="#C9A227" d="M457,116 H822 A4,4 0 0 1 826,120 V120 A4,4 0 0 1 822,124 H457 A4,4 0 0 1 453,120 V120 A4,4 0 0 1 457,116 Z" />
    <text x="481" y="158" font-size="16" font-weight="700" fill="#8C6F14">② 房价收入比</text>
    <text x="481" y="212" font-family="'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#2B2B2B">14.3<tspan font-size="18" fill="#6B6B6B"> 年</tspan></text>
    <text x="481" y="240" font-size="13" fill="#6B6B6B">三口之家购90㎡（2025收入）</text>
    <line x1="481" y1="258" x2="798" y2="258" stroke="#E5DED2" />
    <path fill="#E5DED2" d="M490,278 H789 A9,9 0 0 1 798,287 V287 A9,9 0 0 1 789,296 H490 A9,9 0 0 1 481,287 V287 A9,9 0 0 1 490,278 Z" />
    <path fill="#C9A227" d="M490,278 H648 A9,9 0 0 1 657,287 V287 A9,9 0 0 1 648,296 H490 A9,9 0 0 1 481,287 V287 A9,9 0 0 1 490,278 Z" />
    <line x1="595" y1="270" x2="595" y2="304" stroke="#B3541E" stroke-width="2" stroke-dasharray="3,3" />
    <text x="595" y="322" text-anchor="middle" font-size="11.5" fill="#B3541E">合理区间~8年</text>
    <text x="481" y="352" font-size="13" fill="#2B2B2B">· 双职工口径 9.2 年稍温和</text>
    <text x="481" y="376" font-size="13" fill="#2B2B2B">· 峰值期（2021）曾达 ~20 年，</text>
    <text x="481" y="400" font-size="13" fill="#2B2B2B">  回落靠「房价跌+收入涨」双轮</text>

    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M858,116 H1207 A12,12 0 0 1 1219,128 V394 A12,12 0 0 1 1207,406 H858 A12,12 0 0 1 846,394 V128 A12,12 0 0 1 858,116 Z" />
    <path fill="#8C1F28" d="M850,116 H1215 A4,4 0 0 1 1219,120 V120 A4,4 0 0 1 1215,124 H850 A4,4 0 0 1 846,120 V120 A4,4 0 0 1 850,116 Z" />
    <text x="874" y="158" font-size="16" font-weight="700" fill="#8C1F28">③ 个人住房贷款余额</text>
    <text x="874" y="212" font-family="'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#2B2B2B">↓<tspan font-size="20" fill="#6B6B6B"> 连续回落</tspan></text>
    <text x="874" y="240" font-size="13" fill="#6B6B6B">全国口径 2023见顶后逐年收缩</text>
    <line x1="874" y1="258" x2="1191" y2="258" stroke="#E5DED2" />
    <text x="874" y="288" font-size="13" fill="#2B2B2B">· 居民中长期贷款同比少增</text>
    <text x="874" y="312" font-size="13" fill="#2B2B2B">· 提前还贷潮 2023-2024 显性化</text>
    <text x="874" y="336" font-size="13" fill="#2B2B2B">· 8·28新政40年贷+DTI 60%</text>
    <text x="874" y="360" font-size="13" fill="#2B2B2B">  贷款能力最多放大 28.5%</text>
    <text x="874" y="384" font-size="13" fill="#2B2B2B">· 银行按揭额度充裕、需求不足</text>
    <text x="874" y="408" font-size="13" fill="#2B2B2B">  ——「资产荒」镜像的负债荒</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,432 H1207 A12,12 0 0 1 1219,444 V624 A12,12 0 0 1 1207,636 H72 A12,12 0 0 1 60,624 V444 A12,12 0 0 1 72,432 Z" />
  <text x="90" y="468" font-family="'PingFang SC', sans-serif" font-size="17" font-weight="600" fill="#C9A227">三个温度计的交叉结论</text>
  <text x="90" y="502" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#FFFFFF">· 租售比 2.62% &gt; 国债 1.8%：持有房产的机会成本首次转正 —— 从「炒」的角度，北京的租金收益已略优于无风险利率，但离「便宜」仍有距离</text>
  <text x="90" y="532" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#FFFFFF">· 房价收入比 14.3 年：从 20 年回落但仍接近合理值的两倍 —— 估值消化约完成 40-50%，处于「半山腰偏下」</text>
  <text x="90" y="562" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#FFFFFF">· 信贷三宽松（40年+DTI60%+带押过户）而余额仍收缩：政策松绑速度跑赢需求恢复 —— 底部区域特征明确，但反转需外生变量</text>
  <text x="90" y="598" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#C9A227" font-weight="600">综合评级：估值偏低烧（合理偏低），非深度低估 —— 支撑「企稳」判断，不支持「V型反转」</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：gotohui(B+)/人行北京营管部(B+)；温度条位置为示意</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">20 / 22</text>
</svg>