<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">拿地格局：国央企的牌桌，民企的观众席</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">2025 年北京土拍拿地主体结构 —— 风险出清期的市场微观画像</text>

  
  <g>
    <text x="80" y="130" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#8C1F28">拿地主体结构（按宗数）</text>
    
    
    <circle cx="300" cy="320" r="120" fill="none" stroke="#8C1F28" stroke-width="42" />
    
    <path d="M 300,200 A 120,120 0 0,1 333.5,204.1" fill="none" stroke="#C9A227" stroke-width="42" />
    <text x="300" y="315" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="34" font-weight="700" fill="#8C1F28">92.7%</text>
    <text x="300" y="344" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#6B6B6B">国央企+地方国资</text>
    <g font-family="'PingFang SC', sans-serif" font-size="13">
      <rect x="130" y="480" width="14" height="14" fill="#8C1F28" />
      <text x="152" y="492">国央企+地方国资（37宗）</text>
      <rect x="130" y="506" width="14" height="14" fill="#C9A227" />
      <text x="152" y="518">民企（3宗：懋源2+明芳1）</text>
    </g>
  </g>

  
  <g font-family="'PingFang SC', sans-serif">
    <text x="620" y="130" font-size="16" font-weight="600" fill="#8C1F28">三个结构性变化</text>
    <path fill="#FFFFFF" stroke="#E5DED2" d="M630,148 H1210 A10,10 0 0 1 1220,158 V258 A10,10 0 0 1 1210,268 H630 A10,10 0 0 1 620,258 V158 A10,10 0 0 1 630,148 Z" />
    <text x="648" y="182" font-size="15" font-weight="600" fill="#2B2B2B">① 联合体抱团成主流</text>
    <text x="648" y="210" font-size="13.5" fill="#6B6B6B">2024年5宗 → 2025年14宗；黄杉木店126亿由四家联合体分食</text>
    <text x="648" y="236" font-size="13.5" fill="#6B6B6B">—— 高地价下连央企也选择分摊风险</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M630,284 H1210 A10,10 0 0 1 1220,294 V394 A10,10 0 0 1 1210,404 H630 A10,10 0 0 1 620,394 V294 A10,10 0 0 1 630,284 Z" />
    <text x="648" y="318" font-size="15" font-weight="600" fill="#2B2B2B">② 「中建系」军团现象</text>
    <text x="648" y="346" font-size="13.5" fill="#6B6B6B">中海/中建智地/壹品/玖合/方程全线出击，合计13宗521.6亿</text>
    <text x="648" y="372" font-size="13.5" fill="#6B6B6B">—— 央企体系内「基建→开发」的资金协同优势</text>

    <path fill="#FFFFFF" stroke="#E5DED2" d="M630,420 H1210 A10,10 0 0 1 1220,430 V530 A10,10 0 0 1 1210,540 H630 A10,10 0 0 1 620,530 V430 A10,10 0 0 1 630,420 Z" />
    <text x="648" y="454" font-size="15" font-weight="600" fill="#2B2B2B">③ 新势力入场试探</text>
    <text x="648" y="482" font-size="13.5" fill="#6B6B6B">贝壳（贝好家）联合体首次拿地昌平生命科学园；</text>
    <text x="648" y="508" font-size="13.5" fill="#6B6B6B">渠道商逆向入场 —— 用数据优势赌「精准定价」</text>
  </g>

  
  <path fill="#2B2B2B" d="M70,560 H1209 A10,10 0 0 1 1219,570 V626 A10,10 0 0 1 1209,636 H70 A10,10 0 0 1 60,626 V570 A10,10 0 0 1 70,560 Z" />
  <text x="90" y="592" font-family="'PingFang SC', sans-serif" font-size="14.5" fill="#FFFFFF" font-weight="600">微观含义：土地市场已从「百舸争流」变成「寡头桌牌」—— 出清的不是土地，是玩家。</text>
  <text x="90" y="620" font-family="'PingFang SC', sans-serif" font-size="13.5" fill="#C9A227">8·28新政后资金门槛更高，这个格局只会强化；对购房者的启示：未来新房产品的「兜底信用」几乎全是国央企</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：凤凰网房产2025年度盘点整理规自委公告（A/B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">11 / 22</text>
</svg>