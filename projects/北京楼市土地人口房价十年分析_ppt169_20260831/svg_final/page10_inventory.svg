<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">库存与去化：三层库存的消化账</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">土地库存 → 新房库存 → 二手挂牌 —— 三层「堰塞湖」各自的出清进度</text>

  
  <g font-family="'PingFang SC', sans-serif">
    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,116 H1208 A12,12 0 0 1 1220,128 V232 A12,12 0 0 1 1208,244 H72 A12,12 0 0 1 60,232 V128 A12,12 0 0 1 72,116 Z" />
    <path fill="#8C1F28" d="M65,116 H65 A5,5 0 0 1 70,121 V239 A5,5 0 0 1 65,244 H65 A5,5 0 0 1 60,239 V121 A5,5 0 0 1 65,116 Z" />
    <text x="100" y="152" font-size="16" font-weight="700" fill="#8C1F28">第一层 · 土地库存（已出让未开工）</text>
    <text x="100" y="182" font-size="13.5" fill="#2B2B2B">2022-2025 年累计成交宅地建面 ~1948 万㎡，同期新开工持续低位 —— 沉淀约 <tspan font-weight="700" fill="#B3541E">800-1000 万㎡</tspan> 未充分开发</text>
    <text x="100" y="210" font-size="13.5" fill="#6B6B6B">现房销售新政下这部分「慢开发」反而合理 —— 土地库存成为调节供给的缓冲垫（非堰塞湖）</text>

    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,260 H1208 A12,12 0 0 1 1220,272 V376 A12,12 0 0 1 1208,388 H72 A12,12 0 0 1 60,376 V272 A12,12 0 0 1 72,260 Z" />
    <path fill="#C9A227" d="M65,260 H65 A5,5 0 0 1 70,265 V383 A5,5 0 0 1 65,388 H65 A5,5 0 0 1 60,383 V265 A5,5 0 0 1 65,260 Z" />
    <text x="100" y="296" font-size="16" font-weight="700" fill="#A08318">第二层 · 新房库存（取得预售未售）</text>
    <text x="100" y="326" font-size="13.5" fill="#2B2B2B">2026 年初新房待售面积约 <tspan font-weight="700" fill="#B3541E">900-1000 万㎡</tspan>（住建委待售口径），按年成交 500-600 万㎡ 去化周期约 <tspan font-weight="700" fill="#B3541E">18-20 个月</tspan></text>
    <text x="100" y="354" font-size="13.5" fill="#6B6B6B">结构性撕裂：核心区热门盘开盘售罄 vs 远郊盘去化率 25-40% —— 平均数掩盖极端分化</text>

    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,404 H1208 A12,12 0 0 1 1220,416 V520 A12,12 0 0 1 1208,532 H72 A12,12 0 0 1 60,520 V416 A12,12 0 0 1 72,404 Z" />
    <path fill="#B3541E" d="M65,404 H65 A5,5 0 0 1 70,409 V527 A5,5 0 0 1 65,532 H65 A5,5 0 0 1 60,527 V409 A5,5 0 0 1 65,404 Z" />
    <text x="100" y="440" font-size="16" font-weight="700" fill="#B3541E">第三层 · 二手挂牌（隐性超级库存）</text>
    <text x="100" y="470" font-size="13.5" fill="#2B2B2B">北京在售挂牌量约 <tspan font-weight="700" fill="#B3541E">15-16 万套</tspan>（贝壳口径），是新房库存的 1.5 倍以上 —— 挂牌/成交裂口（西城挂牌15.4万 vs 成交10.6万）仍未收敛</text>
    <text x="100" y="498" font-size="13.5" fill="#6B6B6B">这一层才是价格的真实压力源：每月 1.3 万套成交 vs 15 万套在售 = 去化周期 ~12 个月（健康为 6-9 个月）</text>
  </g>

  
  <path fill="#8C1F28" d="M72,552 H1207 A12,12 0 0 1 1219,564 V624 A12,12 0 0 1 1207,636 H72 A12,12 0 0 1 60,624 V564 A12,12 0 0 1 72,552 Z" />
  <text x="90" y="586" font-family="'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">本页要点</text>
  <text x="90" y="614" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">三层库存的性质不同：土地层是「缓冲」、新房层是「分化」、二手层是「压力」—— 判断底部看第三层的挂牌去化，判断反转看第二层的核心区去化率。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：住建委(B)/贝壳(B+)/中指(B+) · 土地沉淀为推算值</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">10 / 22</text>
</svg>