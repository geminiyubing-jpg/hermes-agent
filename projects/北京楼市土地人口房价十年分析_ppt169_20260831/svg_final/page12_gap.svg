<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">新房×二手联动：倒挂如何撕裂又重塑市场</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">典型板块的价格倒挂地图与「打新退潮」的机制解释</text>

  
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="112" width="1160" height="40" fill="#2B2B2B" />
    <text x="200" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">板块</text>
    <text x="450" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">2025-26新房价格</text>
    <text x="700" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">周边二手成交</text>
    <text x="920" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">倒挂率</text>
    <text x="1110" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">市场反应</text>

    <rect x="60" y="152" width="1160" height="48" fill="#FFFFFF" />
    <text x="200" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2B2B">海淀·树村板块</text>
    <text x="450" y="182" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">臻澐/海晏 ~12万（预）</text>
    <text x="700" y="182" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">~9.5万</text>
    <text x="920" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">+26%</text>
    <text x="1110" y="182" text-anchor="middle" font-size="12.5" fill="#6B6B6B">顶豪认筹火爆</text>

    <rect x="60" y="200" width="1160" height="48" fill="#F2EDE3" />
    <text x="200" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2B2B">朝阳·太阳宫</text>
    <text x="450" y="230" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">新盘预期 ~12万+</text>
    <text x="700" y="230" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">~8.5万</text>
    <text x="920" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">+41%</text>
    <text x="1110" y="230" text-anchor="middle" font-size="12.5" fill="#6B6B6B">330轮抢地豪赌</text>

    <rect x="60" y="248" width="1160" height="48" fill="#FFFFFF" />
    <text x="200" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2B2B">丰台·郭公庄南</text>
    <text x="450" y="278" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">北京隅西颂 ~7.9万</text>
    <text x="700" y="278" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">~6.0万</text>
    <text x="920" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">+32%</text>
    <text x="1110" y="278" text-anchor="middle" font-size="12.5" fill="#6B6B6B">去化率仅25%</text>

    <rect x="60" y="296" width="1160" height="48" fill="#F2EDE3" />
    <text x="200" y="326" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2B2B">丰台·花乡</text>
    <text x="450" y="326" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">新地块待开发</text>
    <text x="700" y="326" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">万年花城 ~6.0万</text>
    <text x="920" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D5B" font-family="'Helvetica Neue', sans-serif">地价-16%</text>
    <text x="1110" y="326" text-anchor="middle" font-size="12.5" fill="#6B6B6B">托底成交警示</text>

    <rect x="60" y="344" width="1160" height="48" fill="#FFFFFF" />
    <text x="200" y="374" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2B2B">海淀·上地</text>
    <text x="450" y="374" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">0702地块 新盘待入</text>
    <text x="700" y="374" text-anchor="middle" font-size="14" font-family="'Helvetica Neue', sans-serif" fill="#2B2B2B">~8.8万</text>
    <text x="920" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#A08318" font-family="'Helvetica Neue', sans-serif">分化中</text>
    <text x="1110" y="374" text-anchor="middle" font-size="12.5" fill="#6B6B6B">年末仅0.4%溢价</text>
  </g>
  <rect x="60" y="112" width="1160" height="280" fill="none" stroke="#E5DED2" />

  
  <g font-family="'PingFang SC', sans-serif">
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,412 H620 A12,12 0 0 1 632,424 V624 A12,12 0 0 1 620,636 H72 A12,12 0 0 1 60,624 V424 A12,12 0 0 1 72,412 Z" />
    <text x="88" y="448" font-size="16" font-weight="700" fill="#8C1F28">倒挂市场的两个循环</text>
    <text x="88" y="482" font-size="13.5" fill="#2B2B2B" font-weight="600">恶性循环（2024-25已发生）：</text>
    <text x="88" y="510" font-size="13" fill="#6B6B6B">新房贵过二手 → 打新客群退场 →</text>
    <text x="88" y="534" font-size="13" fill="#6B6B6B">新房去化率跌至25-40% → 房企回款恶化</text>
    <text x="88" y="558" font-size="13" fill="#6B6B6B">→ 只能买更核心的地赌溢价 → 倒挂加深</text>
    <text x="88" y="594" font-size="13.5" fill="#2B2B2B" font-weight="600">良性循环（基准剧本赌的路径）：</text>
    <text x="88" y="620" font-size="13" fill="#6B6B6B">供给收缩+现房品质溢价 → 核心区新房</text>
    <text x="640" y="620" font-size="13" fill="#6B6B6B">去化修复 → 带动周边二手企稳</text>

    <path fill="#2B2B2B" d="M660,412 H1208 A12,12 0 0 1 1220,424 V624 A12,12 0 0 1 1208,636 H660 A12,12 0 0 1 648,624 V424 A12,12 0 0 1 660,412 Z" />
    <text x="676" y="448" font-size="16" font-weight="700" fill="#C9A227">倒挂的三重结构性后果</text>
    <text x="676" y="484" font-size="13.5" fill="#FFFFFF">① 新房与二手变成两个平行市场——定价逻辑脱钩</text>
    <text x="676" y="514" font-size="13.5" fill="#FFFFFF">　（新房看地价+品质溢价，二手看供需+挂牌量）</text>
    <text x="676" y="544" font-size="13.5" fill="#FFFFFF">② 置换链被冻结：卖不掉旧房就买不起新房</text>
    <text x="676" y="574" font-size="13.5" fill="#FFFFFF">　（带押过户等新政就是冲着解冻这条链）</text>
    <text x="676" y="604" font-size="13.5" fill="#FFFFFF">③ 倒挂收敛只有两条路：二手涨或新房降——</text>
    <text x="676" y="628" font-size="13.5" fill="#C9A227">　基准剧本选前者，悲观剧本被迫选后者</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：网签/贝壳成交/新京报案例（B+）· 预期价格为推算</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">12 / 22</text>
</svg>