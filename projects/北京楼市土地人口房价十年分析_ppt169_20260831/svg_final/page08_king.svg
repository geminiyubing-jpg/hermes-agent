<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5F0" />
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28" />
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">地王解剖：楼面价 10 万+ 时代的三块界碑</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">2025-2026 年北京楼面价纪录的刷新路径 —— 从远郊刚需到核心区顶豪的定价革命</text>

  
  <g font-family="'PingFang SC', sans-serif">
    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M72,116 H421 A12,12 0 0 1 433,128 V434 A12,12 0 0 1 421,446 H72 A12,12 0 0 1 60,434 V128 A12,12 0 0 1 72,116 Z" />
    <path fill="#8C1F28" d="M64,116 H429 A4,4 0 0 1 433,120 V120 A4,4 0 0 1 429,124 H64 A4,4 0 0 1 60,120 V120 A4,4 0 0 1 64,116 Z" />
    <text x="88" y="158" font-size="16" font-weight="700" fill="#8C1F28">海淀 · 树村</text>
    <text x="88" y="182" font-size="12.5" fill="#9B9B9B">2025.3.18 · 中海竞得</text>
    <text x="88" y="228" font-family="'Helvetica Neue', sans-serif" font-size="38" font-weight="700" fill="#2B2B2B">10.23<tspan font-size="16" fill="#6B6B6B"> 万/㎡</tspan></text>
    <text x="88" y="254" font-size="13" fill="#6B6B6B">住宅楼面价 · 北京首宗破10万</text>
    <line x1="88" y1="272" x2="405" y2="272" stroke="#E5DED2" />
    <text x="88" y="298" font-size="13" fill="#2B2B2B">· 溢价率 27.93%，多轮竞价</text>
    <text x="88" y="324" font-size="13" fill="#2B2B2B">· 海淀7宗全部溢价成交之一</text>
    <text x="88" y="350" font-size="13" fill="#2B2B2B">· 周边新房售价预期 12万+</text>
    <text x="88" y="376" font-size="13" fill="#2B2B2B">· 意义：西北旺-树村板块</text>
    <text x="88" y="400" font-size="13" fill="#2B2B2B">  正式进入「10万地价俱乐部」</text>
    <path fill="#8C1F28" opacity="0.08" d="M94,412 H399 A6,6 0 0 1 405,418 V430 A6,6 0 0 1 399,436 H94 A6,6 0 0 1 88,430 V418 A6,6 0 0 1 94,412 Z" />
    <text x="246" y="429" text-anchor="middle" font-size="12" font-weight="600" fill="#8C1F28">纯商品房 · 无配建束缚</text>

    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M465,116 H814 A12,12 0 0 1 826,128 V434 A12,12 0 0 1 814,446 H465 A12,12 0 0 1 453,434 V128 A12,12 0 0 1 465,116 Z" />
    <path fill="#C9A227" d="M457,116 H822 A4,4 0 0 1 826,120 V120 A4,4 0 0 1 822,124 H457 A4,4 0 0 1 453,120 V120 A4,4 0 0 1 457,116 Z" />
    <text x="481" y="158" font-size="16" font-weight="700" fill="#A08318">东城 · 祈年大街</text>
    <text x="481" y="182" font-size="12.5" fill="#9B9B9B">2025.11.19 · 北京城建竞得</text>
    <text x="481" y="228" font-family="'Helvetica Neue', sans-serif" font-size="38" font-weight="700" fill="#2B2B2B">10.36<tspan font-size="16" fill="#6B6B6B"> 万/㎡</tspan></text>
    <text x="481" y="254" font-size="13" fill="#6B6B6B">年度楼面价王 · 二环内稀缺宅地</text>
    <line x1="481" y1="272" x2="798" y2="272" stroke="#E5DED2" />
    <text x="481" y="298" font-size="13" fill="#2B2B2B">· 溢价率仅 4% —— 底价附近</text>
    <text x="481" y="324" font-size="13" fill="#2B2B2B">· 东城长期「零供应」后破冰</text>
    <text x="481" y="350" font-size="13" fill="#2B2B2B">· 紧邻天坛，风貌保护限高</text>
    <text x="481" y="376" font-size="13" fill="#2B2B2B">· 意义：内城土地的「惜售</text>
    <text x="481" y="400" font-size="13" fill="#2B2B2B">  定价」——低溢价≠低价值</text>
    <path fill="#C9A227" opacity="0.15" d="M487,412 H792 A6,6 0 0 1 798,418 V430 A6,6 0 0 1 792,436 H487 A6,6 0 0 1 481,430 V418 A6,6 0 0 1 487,412 Z" />
    <text x="639" y="429" text-anchor="middle" font-size="12" font-weight="600" fill="#A08318">起拍价即高 · 稀缺性定价</text>

    
    <path fill="#FFFFFF" stroke="#E5DED2" d="M858,116 H1207 A12,12 0 0 1 1219,128 V434 A12,12 0 0 1 1207,446 H858 A12,12 0 0 1 846,434 V128 A12,12 0 0 1 858,116 Z" />
    <path fill="#B3541E" d="M850,116 H1215 A4,4 0 0 1 1219,120 V120 A4,4 0 0 1 1215,124 H850 A4,4 0 0 1 846,120 V120 A4,4 0 0 1 850,116 Z" />
    <text x="874" y="158" font-size="16" font-weight="700" fill="#B3541E">朝阳 · 太阳宫</text>
    <text x="874" y="182" font-size="12.5" fill="#9B9B9B">2025.9.30 · 中建智地竞得</text>
    <text x="874" y="228" font-family="'Helvetica Neue', sans-serif" font-size="38" font-weight="700" fill="#2B2B2B">39.18<tspan font-size="16" fill="#6B6B6B"> % 溢价</tspan></text>
    <text x="874" y="254" font-size="13" fill="#6B6B6B">年度溢价王 · 住宅楼面价9.42万</text>
    <line x1="874" y1="272" x2="1191" y2="272" stroke="#E5DED2" />
    <text x="874" y="298" font-size="13" fill="#2B2B2B">· 竞价 330+ 轮，超40分钟</text>
    <text x="874" y="324" font-size="13" fill="#2B2B2B">· 朝阳核心区多年罕见纯宅地</text>
    <text x="874" y="350" font-size="13" fill="#2B2B2B">· 刷新朝阳宅地楼面价纪录</text>
    <text x="874" y="376" font-size="13" fill="#2B2B2B">· 意义：房企对核心区去化</text>
    <text x="874" y="400" font-size="13" fill="#2B2B2B">  确定性的极致定价</text>
    <path fill="#B3541E" opacity="0.10" d="M880,412 H1185 A6,6 0 0 1 1191,418 V430 A6,6 0 0 1 1185,436 H880 A6,6 0 0 1 874,430 V418 A6,6 0 0 1 880,412 Z" />
    <text x="1032" y="429" text-anchor="middle" font-size="12" font-weight="600" fill="#B3541E">竞争激烈度年度之最</text>
  </g>

  
  <path fill="#2B2B2B" d="M72,470 H1207 A12,12 0 0 1 1219,482 V624 A12,12 0 0 1 1207,636 H72 A12,12 0 0 1 60,624 V482 A12,12 0 0 1 72,470 Z" />
  <text x="90" y="502" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#C9A227">三块界碑的共同信号</text>
  <text x="90" y="532" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">① 楼面价10万+已从个案变为「俱乐部」——2025年溢价超10%的9宗地全部在城六区+通州；地价体系完成结构性上移</text>
  <text x="90" y="560" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">② 高价地三种形态并存：竞争型（太阳宫39%）/ 惜售型（祈年大街4%）/ 板块型（树村28%）——但都指向核心区稀缺共识</text>
  <text x="90" y="588" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">③ 2026年海淀四季青97.6亿总价地王（楼面价6.84万+溢价14%）延续此势——但需警惕：面粉10万意味着面包必须12万+才成立</text>
  <text x="90" y="616" font-family="'PingFang SC', sans-serif" font-size="14" fill="#C9A227">风险注脚：2025.12.25 丰台花乡地块楼面价4.2万仅一家报名托底成交——较2023郭公庄6.81万回调38%，地王与流拍一墙之隔</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：规自委成交公告/新京报/凤凰网房产（A/B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">08 / 22</text>
</svg>