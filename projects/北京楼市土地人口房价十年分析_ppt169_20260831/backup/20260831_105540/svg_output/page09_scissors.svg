<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">剪刀差：面粉追上了面包</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">宅地楼面价 ÷ 二手房成交均价（%），2015—2026.7</text>

  <!-- 网格 -->
  <g stroke="#DDD5C8" stroke-width="1">
    <line x1="120" y1="470" x2="1150" y2="470"/>
    <line x1="120" y1="380" x2="1150" y2="380" stroke-dasharray="4,4"/>
    <line x1="120" y1="290" x2="1150" y2="290" stroke-dasharray="4,4"/>
    <line x1="120" y1="200" x2="1150" y2="200" stroke-dasharray="4,4"/>
    <line x1="120" y1="110" x2="1150" y2="110" stroke-dasharray="4,4"/>
  </g>
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#9B9B9B">
    <text x="112" y="474" text-anchor="end">0%</text>
    <text x="112" y="384" text-anchor="end">25%</text>
    <text x="112" y="294" text-anchor="end">50%</text>
    <text x="112" y="204" text-anchor="end">75%</text>
    <text x="112" y="114" text-anchor="end">100%</text>
  </g>

  <!-- 曲线 32 41 36 34 33 33 32 45 57 77 89 -->
  <!-- y = 470 - ratio*3.6 -->
  <polyline points="160,354.8 250,322.4 340,340.4 430,347.6 520,351.2 610,351.2 700,354.8 790,308 880,265.2 970,193.6 1060,150.4"
    fill="none" stroke="#8C1F28" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#8C1F28">
    <circle cx="160" cy="354.8" r="6"/><circle cx="250" cy="322.4" r="6"/><circle cx="340" cy="340.4" r="6"/>
    <circle cx="430" cy="347.6" r="6"/><circle cx="520" cy="351.2" r="6"/><circle cx="610" cy="351.2" r="6"/>
    <circle cx="700" cy="354.8" r="6"/><circle cx="790" cy="308" r="6"/><circle cx="880" cy="265.2" r="6"/>
    <circle cx="970" cy="193.6" r="7"/><circle cx="1060" cy="150.4" r="8"/>
  </g>
  <g font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="700" fill="#2B2B2B">
    <text x="140" y="335">32%</text><text x="230" y="303">41%</text><text x="680" y="335">32%</text>
    <text x="770" y="288">45%</text><text x="860" y="245">57%</text>
    <text x="935" y="180" font-size="17" fill="#8C1F28">77%</text>
    <text x="1010" y="132" font-size="19" fill="#8C1F28">89%</text>
  </g>
  <!-- 年份 -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#6B6B6B" text-anchor="middle">
    <text x="160" y="492">'15</text><text x="250" y="492">'17</text><text x="340" y="492">'18</text>
    <text x="430" y="492">'19</text><text x="520" y="492">'20</text><text x="610" y="492">'21</text>
    <text x="700" y="492">'22</text><text x="790" y="492">'23</text><text x="880" y="492">'24</text>
    <text x="970" y="492">'25</text><text x="1060" y="492">'26.7</text>
  </g>
  <!-- 警示区 -->
  <rect x="930" y="110" width="220" height="360" fill="#B3541E" opacity="0.06"/>
  <text x="1040" y="460" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#B3541E">历史极值区</text>

  <!-- 三重解读 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="515" width="373" height="130" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="549" font-size="15" font-weight="600" fill="#8C1F28">① 新房被迫高价</text>
    <text x="88" y="577" font-size="13" fill="#2B2B2B">楼面价4.1万+建安财务 ≈ 7万+</text>
    <text x="88" y="600" font-size="13" fill="#2B2B2B">才有利润，与二手4.6万全面</text>
    <text x="88" y="623" font-size="13" fill="#2B2B2B">倒挂——赌改善盘接受度</text>

    <rect x="453" y="515" width="373" height="130" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="481" y="549" font-size="15" font-weight="600" fill="#8C1F28">② 财政的单价依赖</text>
    <text x="481" y="577" font-size="13" fill="#2B2B2B">人均出让金 1.29万→0.65万元</text>
    <text x="481" y="600" font-size="13" fill="#2B2B2B">依赖度降一半，但越来越押注</text>
    <text x="481" y="623" font-size="13" fill="#2B2B2B">单宗高价地——怕流拍</text>

    <rect x="846" y="515" width="373" height="130" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="874" y="549" font-size="15" font-weight="600" fill="#8C1F28">③ 不可长期维持</text>
    <text x="874" y="577" font-size="13" fill="#2B2B2B">89%的面粉/面包比只能以</text>
    <text x="874" y="600" font-size="13" fill="#2B2B2B">「地价回落 / 房价反弹 /</text>
    <text x="874" y="623" font-size="13" fill="#2B2B2B">新房滞销→停拍」三式收敛</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：楼面价(B+)/二手均价(B+)比值推算——趋势可靠，点值供方向判断</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">09 / 10</text>
</svg>
