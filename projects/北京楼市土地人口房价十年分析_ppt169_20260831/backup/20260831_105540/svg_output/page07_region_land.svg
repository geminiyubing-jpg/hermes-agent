<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">区域分化（土地篇）：海淀朝阳撑起半壁江山</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">2025 年各区涉宅用地成交金额（亿元）与溢价特征</text>

  <!-- 条形图 -->
  <!-- 比例尺: 448.37亿 = 620px -->
  <g font-family="'PingFang SC', sans-serif">
    <!-- 海淀 448.37 -->
    <text x="150" y="140" font-size="16" font-weight="600" fill="#2B2B2B">海淀</text>
    <rect x="210" y="122" width="620" height="30" rx="4" fill="#8C1F28"/>
    <text x="845" y="143" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#8C1F28">448.4</text>
    <text x="930" y="143" font-size="12.5" fill="#6B6B6B">7宗全部溢价 · 楼面价6.74万/㎡ · 树村27.9%</text>
    <!-- 朝阳 311.14 -->
    <text x="150" y="192" font-size="16" font-weight="600" fill="#2B2B2B">朝阳</text>
    <rect x="210" y="174" width="430" height="30" rx="4" fill="#8C1F28" opacity="0.88"/>
    <text x="655" y="195" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#8C1F28">311.1</text>
    <text x="740" y="195" font-size="12.5" fill="#6B6B6B">太阳宫39.2%溢价王(330+轮) · 打包出让</text>
    <!-- 丰台 128.14 -->
    <text x="150" y="244" font-size="16" font-weight="600" fill="#2B2B2B">丰台</text>
    <rect x="210" y="226" width="177" height="30" rx="4" fill="#C9A227"/>
    <text x="402" y="247" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#A08318">128.1</text>
    <text x="487" y="247" font-size="12.5" fill="#6B6B6B">多为底价 · 丽泽楼面价新低 · 年末花乡托底</text>
    <!-- 通州 122.23 -->
    <text x="150" y="296" font-size="16" font-weight="600" fill="#2B2B2B">通州</text>
    <rect x="210" y="278" width="169" height="30" rx="4" fill="#C9A227"/>
    <text x="394" y="299" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#A08318">122.2</text>
    <text x="479" y="299" font-size="12.5" fill="#6B6B6B">梨园溢价20%+ · 副中心叙事</text>
    <!-- 昌平 116.97 -->
    <text x="150" y="348" font-size="16" font-weight="600" fill="#2B2B2B">昌平</text>
    <rect x="210" y="330" width="162" height="30" rx="4" fill="#C9A227"/>
    <text x="387" y="351" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#A08318">117.0</text>
    <text x="472" y="351" font-size="12.5" fill="#6B6B6B">宗数第二(6宗)但全部底价成交</text>
    <!-- 顺义 3宗 -->
    <text x="150" y="400" font-size="16" font-weight="600" fill="#2B2B2B">顺义</text>
    <rect x="210" y="382" width="95" height="30" rx="4" fill="#D8CBA0"/>
    <text x="320" y="403" font-size="12.5" fill="#6B6B6B">3宗 · 懋源民企拿地亮点</text>
    <!-- 其余 -->
    <text x="150" y="452" font-size="16" font-weight="600" fill="#2B2B2B">其他</text>
    <rect x="210" y="434" width="220" height="30" rx="4" fill="#D8CBA0"/>
    <text x="445" y="455" font-size="12.5" fill="#6B6B6B">大兴/石景山各2宗 · 东城祈年大街楼面价10.36万创纪录</text>
  </g>

  <!-- 梯队标注 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="1020" y="122" width="200" height="64" rx="8" fill="#8C1F28" opacity="0.08"/>
    <text x="1120" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#8C1F28">T0 核心引擎</text>
    <text x="1120" y="171" text-anchor="middle" font-size="12" fill="#8C1F28">两区 = 全市 53%</text>
    <rect x="1020" y="226" width="200" height="64" rx="8" fill="#C9A227" opacity="0.12"/>
    <text x="1120" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#A08318">T1 百亿俱乐部</text>
    <text x="1120" y="275" text-anchor="middle" font-size="12" fill="#A08318">城六区占比升至50%</text>
    <rect x="1020" y="434" width="200" height="64" rx="8" fill="#4A7BA6" opacity="0.10"/>
    <text x="1120" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#4A7BA6">挂零区</text>
    <text x="1120" y="483" text-anchor="middle" font-size="12" fill="#4A7BA6">西城/平谷/密云零供应</text>
  </g>

  <!-- 本页要点 -->
  <rect x="60" y="520" width="1159" height="112" rx="10" fill="#8C1F28"/>
  <text x="90" y="553" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">本页要点</text>
  <text x="90" y="581" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">国央企+地方国资拿地占 92.7%，联合体拿地 14 宗（2024年仅5宗）—— 地价门槛把民企几乎清出牌桌，抱团分险成为生存策略。</text>
  <text x="90" y="607" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">2026 前8月：海淀四季青 97.6亿新地王（溢价14%）延续核心区热；同期房山/顺义底价 —— 分化格局在新政下进一步固化。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：凤凰网房产/新京报整理规自委成交公告（A/B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">07 / 10</text>
</svg>
