<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">人口：玻璃天花板下的零增长</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">常住人口（万人），2015—2025 · 十年净变化仅 +7 万（+0.3%）</text>

  <!-- 图区 -->
  <g stroke="#DDD5C8" stroke-width="1">
    <line x1="110" y1="460" x2="1180" y2="460"/>
    <line x1="110" y1="390" x2="1180" y2="390" stroke-dasharray="4,4"/>
    <line x1="110" y1="320" x2="1180" y2="320" stroke-dasharray="4,4"/>
    <line x1="110" y1="250" x2="1180" y2="250" stroke-dasharray="4,4"/>
    <line x1="110" y1="180" x2="1180" y2="180" stroke-dasharray="4,4"/>
  </g>
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#9B9B9B">
    <text x="102" y="464" text-anchor="end">2140</text>
    <text x="102" y="394" text-anchor="end">2155</text>
    <text x="102" y="324" text-anchor="end">2170</text>
    <text x="102" y="254" text-anchor="end">2185</text>
    <text x="102" y="184" text-anchor="end">2200</text>
  </g>

  <!-- 阶段背景 -->
  <rect x="228" y="150" width="228" height="310" fill="#8C1F28" opacity="0.05"/>
  <rect x="456" y="150" width="182" height="310" fill="#C9A227" opacity="0.10"/>
  <rect x="638" y="150" width="542" height="310" fill="#4A7BA6" opacity="0.05"/>

  <!-- 折线: 2015-2025 -->
  <!-- y = 460 - (pop-2140)*4.667 -->
  <polyline points="140,315.7 226,314.6 312,315.6 398,397.1 484,399.8 570,130.1 656,133.4 742,153.4 828,146.4 914,158.5 1000,173.9"
    fill="none" stroke="#4A7BA6" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#4A7BA6">
    <circle cx="140" cy="315.7" r="5"/><circle cx="226" cy="314.6" r="5"/><circle cx="312" cy="315.6" r="5"/>
    <circle cx="398" cy="397.1" r="5"/><circle cx="484" cy="399.8" r="5"/><circle cx="570" cy="130.1" r="6"/>
    <circle cx="656" cy="133.4" r="5"/><circle cx="742" cy="153.4" r="5"/><circle cx="828" cy="146.4" r="5"/>
    <circle cx="914" cy="158.5" r="5"/><circle cx="1000" cy="173.9" r="6"/>
  </g>
  <!-- 数值 -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#33587A">
    <text x="118" y="303">2170.5</text><text x="204" y="302">2172.9</text><text x="290" y="303">2170.7</text>
    <text x="376" y="385">2154.2</text><text x="462" y="388">2153.6</text>
    <text x="548" y="118" font-size="14">2189.3</text><text x="634" y="121">2188.6</text><text x="720" y="141">2184.3</text>
    <text x="806" y="134">2185.8</text><text x="892" y="146">2183.2</text>
    <text x="978" y="161" font-size="14">2180.0</text>
  </g>
  <!-- 年份 -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#6B6B6B" text-anchor="middle">
    <text x="140" y="482">'15</text><text x="226" y="482">'16</text><text x="312" y="482">'17</text>
    <text x="398" y="482">'18</text><text x="484" y="482">'19</text><text x="570" y="482">'20</text>
    <text x="656" y="482">'21</text><text x="742" y="482">'22</text><text x="828" y="482">'23</text>
    <text x="914" y="482">'24</text><text x="1000" y="482">'25</text>
  </g>

  <!-- 注释 -->
  <text x="342" y="440" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13" fill="#8C1F28">疏解非首都功能 -19.3万</text>
  <text x="547" y="200" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#A08318">七普口径跳升 +35.7万</text>
  <text x="547" y="220" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#A08318">（普查摸底更准，非真实增长）</text>
  <text x="838" y="230" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="13" fill="#33587A">自然增长趋负 -9.3万</text>

  <!-- 底部三卡 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="512" width="373" height="120" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="548" font-size="15" font-weight="600" fill="#8C1F28">需求端没有增量故事</text>
    <text x="88" y="576" font-size="13" fill="#2B2B2B">人口零增长封顶住房总需求，</text>
    <text x="88" y="598" font-size="13" fill="#2B2B2B">楼市只剩结构故事（换房/改善）</text>
    <rect x="453" y="512" width="373" height="120" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="481" y="548" font-size="15" font-weight="600" fill="#8C1F28">老龄化伏笔</text>
    <text x="481" y="576" font-size="13" fill="#2B2B2B">60+ 岁占比 19.6%（2025），</text>
    <text x="481" y="598" font-size="13" fill="#2B2B2B">2028 前后退休潮 → 远期供给释放</text>
    <rect x="846" y="512" width="373" height="120" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="874" y="548" font-size="15" font-weight="600" fill="#8C1F28">高素质结构</text>
    <text x="874" y="576" font-size="13" fill="#2B2B2B">本科以上学历占比近 25% 全国第一，</text>
    <text x="874" y="598" font-size="13" fill="#2B2B2B">改善购买力集中于核心区</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：北京市统计局历年统计公报/七普（A）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">05 / 10</text>
</svg>
