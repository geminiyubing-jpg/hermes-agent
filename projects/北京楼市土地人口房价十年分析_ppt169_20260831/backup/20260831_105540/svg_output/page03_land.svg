<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">土地出让金：三段式坠落</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">北京经营性用地年度出让金（亿元），2015—2025</text>

  <!-- 阶段背景带 -->
  <rect x="100" y="120" width="294" height="410" fill="#8C1F28" opacity="0.06"/>
  <rect x="394" y="120" width="392" height="410" fill="#C9A227" opacity="0.08"/>
  <rect x="786" y="120" width="394" height="410" fill="#4A7BA6" opacity="0.07"/>
  <text x="247" y="145" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#8C1F28">狂飙期</text>
  <text x="590" y="145" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#A08318">平台期</text>
  <text x="983" y="145" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#4A7BA6">缩量提质期</text>

  <!-- 网格线 -->
  <g stroke="#DDD5C8" stroke-width="1">
    <line x1="100" y1="510" x2="1180" y2="510"/>
    <line x1="100" y1="425" x2="1180" y2="425" stroke-dasharray="4,4"/>
    <line x1="100" y1="340" x2="1180" y2="340" stroke-dasharray="4,4"/>
    <line x1="100" y1="255" x2="1180" y2="255" stroke-dasharray="4,4"/>
    <line x1="100" y1="170" x2="1180" y2="170" stroke-dasharray="4,4"/>
  </g>
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#9B9B9B">
    <text x="92" y="514" text-anchor="end">0</text>
    <text x="92" y="429" text-anchor="end">700</text>
    <text x="92" y="344" text-anchor="end">1400</text>
    <text x="92" y="259" text-anchor="end">2100</text>
    <text x="92" y="174" text-anchor="end">2800</text>
  </g>

  <!-- 柱体 -->
  <rect x="118" y="269.2" width="62" height="240.8" fill="#B0656B"/>
  <rect x="216" y="406.5" width="62" height="103.5" fill="#8C1F28"/>
  <rect x="314" y="170.5" width="62" height="339.5" fill="#8C1F28"/>
  <rect x="412" y="305.7" width="62" height="204.3" fill="#8C1F28"/>
  <rect x="510" y="309.6" width="62" height="200.4" fill="#C98F94" stroke="#8C1F28" stroke-dasharray="3,3"/>
  <rect x="608" y="279.3" width="62" height="230.7" fill="#C98F94" stroke="#8C1F28" stroke-dasharray="3,3"/>
  <rect x="706" y="279.3" width="62" height="230.7" fill="#C98F94" stroke="#8C1F28" stroke-dasharray="3,3"/>
  <rect x="804" y="297.8" width="62" height="212.2" fill="#8C1F28"/>
  <rect x="902" y="298.5" width="62" height="211.5" fill="#8C1F28"/>
  <rect x="1000" y="319.5" width="62" height="190.5" fill="#8C1F28"/>
  <rect x="1098" y="336.7" width="62" height="173.3" fill="#8C1F28"/>

  <!-- 数值标注 -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#2B2B2B" text-anchor="middle">
    <text x="149" y="261">1983</text>
    <text x="247" y="398">853</text>
    <text x="345" y="162" fill="#8C1F28" font-size="15">2796</text>
    <text x="443" y="297">1683</text>
    <text x="541" y="301" fill="#8A6A6D">~1650</text>
    <text x="639" y="271" fill="#8A6A6D">~1900</text>
    <text x="737" y="271" fill="#8A6A6D">~1900</text>
    <text x="835" y="289">1747</text>
    <text x="933" y="290">1741</text>
    <text x="1031" y="311">1569</text>
    <text x="1129" y="328" fill="#8C1F28" font-size="15">1427</text>
  </g>

  <!-- 年份轴 -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#6B6B6B" text-anchor="middle">
    <text x="149" y="532">'15</text><text x="247" y="532">'16</text><text x="345" y="532">'17</text>
    <text x="443" y="532">'18</text><text x="541" y="532">'19</text><text x="639" y="532">'20</text>
    <text x="737" y="532">'21</text><text x="835" y="532">'22</text><text x="933" y="532">'23</text>
    <text x="1031" y="532">'24</text><text x="1129" y="532">'25</text>
  </g>
  <text x="300" y="556" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">注：虚线柱为估计值（C级）；2015-18含非宅地全口径，2022-25为涉宅口径</text>

  <!-- 本页要点 -->
  <rect x="60" y="580" width="1159" height="80" rx="10" fill="#8C1F28"/>
  <text x="90" y="611" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">本页要点</text>
  <text x="90" y="638" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">2017 年 2796 亿是十年天花板；此后平台震荡、2022 起逐年下台阶至 1427 亿（-49%）——但楼面价同期翻倍以上，「量跌价升」是主动选择而非被动结果。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：中指院/规自委（A/B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">03 / 10</text>
</svg>
