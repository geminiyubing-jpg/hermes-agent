<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">房价：一轮完整周期，终点回到起点</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">二手房 vs 新房（元/㎡），2016—2026.7 · 双线对照</text>

  <!-- 图例 -->
  <g font-family="'PingFang SC', sans-serif" font-size="14">
    <line x1="800" y1="62" x2="830" y2="62" stroke="#C9A227" stroke-width="4"/>
    <text x="838" y="67" fill="#2B2B2B">二手成交均价</text>
    <line x1="985" y1="62" x2="1015" y2="62" stroke="#8C1F28" stroke-width="4"/>
    <text x="1023" y="67" fill="#2B2B2B">新房网签均价</text>
  </g>

  <!-- 网格 -->
  <g stroke="#DDD5C8" stroke-width="1">
    <line x1="110" y1="470" x2="1180" y2="470"/>
    <line x1="110" y1="392" x2="1180" y2="392" stroke-dasharray="4,4"/>
    <line x1="110" y1="314" x2="1180" y2="314" stroke-dasharray="4,4"/>
    <line x1="110" y1="236" x2="1180" y2="236" stroke-dasharray="4,4"/>
    <line x1="110" y1="158" x2="1180" y2="158" stroke-dasharray="4,4"/>
  </g>
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#9B9B9B">
    <text x="102" y="474" text-anchor="end">2.0万</text>
    <text x="102" y="396" text-anchor="end">3.5万</text>
    <text x="102" y="318" text-anchor="end">5.0万</text>
    <text x="102" y="240" text-anchor="end">6.5万</text>
    <text x="102" y="162" text-anchor="end">8.0万</text>
  </g>

  <!-- y = 470 - (price-2.0)*62.67 -->
  <!-- 二手: 47000 60400 56100 58500 60000 61000 62000 67000 58000 53000 45855 -->
  <polyline points="150,324.5 243,240.5 336,267.4 429,252.4 522,243 615,236.7 708,230.5 801,199.2 894,255.5 987,286.8 1080,331.5"
    fill="none" stroke="#C9A227" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#C9A227" stroke="#8C6F14" stroke-width="1">
    <circle cx="150" cy="324.5" r="5"/><circle cx="243" cy="240.5" r="5"/><circle cx="336" cy="267.4" r="5"/>
    <circle cx="429" cy="252.4" r="5"/><circle cx="522" cy="243" r="5"/><circle cx="615" cy="236.7" r="5"/>
    <circle cx="708" cy="230.5" r="5"/><circle cx="801" cy="199.2" r="5"/><circle cx="894" cy="255.5" r="5"/>
    <circle cx="987" cy="286.8" r="5"/><circle cx="1080" cy="331.5" r="6"/>
  </g>

  <!-- 新房(2025-2026才有连续序列, 虚线示意): 55800@25 60700@25.12 54500@26.7 -->
  <polyline points="987,200.6 1033,169.9 1080,209.2" fill="none" stroke="#8C1F28" stroke-width="4" stroke-dasharray="8,5" stroke-linejoin="round"/>
  <g fill="#8C1F28">
    <circle cx="987" cy="200.6" r="5"/><circle cx="1033" cy="169.9" r="5"/><circle cx="1080" cy="209.2" r="6"/>
  </g>

  <!-- 数值标注 -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#8C6F14">
    <text x="128" y="312">4.70万</text><text x="221" y="228" font-size="14">6.04万</text><text x="314" y="294">5.61万</text>
    <text x="407" y="240">5.85万</text><text x="596" y="224">6.10万</text>
    <text x="758" y="186" font-size="14">7.03万峰值</text><text x="942" y="272">5.80万</text>
    <text x="998" y="310">5.30万</text><text x="1044" y="352" font-size="14">4.59万</text>
  </g>
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#8C1F28">
    <text x="1008" y="158">6.07万</text><text x="1092" y="232">5.45万</text>
  </g>

  <!-- 年份 -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#6B6B6B" text-anchor="middle">
    <text x="150" y="492">'16</text><text x="243" y="492">'17</text><text x="336" y="492">'18</text>
    <text x="429" y="492">'19</text><text x="522" y="492">'20</text><text x="615" y="492">'21</text>
    <text x="708" y="492">'22</text><text x="801" y="492">'23</text><text x="894" y="492">'24</text>
    <text x="987" y="492">'25</text><text x="1080" y="492">'26.7</text>
  </g>

  <!-- 阶段注释 -->
  <text x="196" y="150" font-family="'PingFang SC', sans-serif" font-size="13" fill="#8C1F28">317调控前暴涨</text>
  <text x="470" y="150" font-family="'PingFang SC', sans-serif" font-size="13" fill="#6B6B6B">限竞房阴跌企稳</text>
  <text x="700" y="140" font-family="'PingFang SC', sans-serif" font-size="13" fill="#A08318">放水+学区 二次冲顶</text>
  <text x="960" y="140" font-family="'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#B3541E">主跌浪 -35%</text>

  <!-- 本页要点 -->
  <rect x="60" y="520" width="1159" height="112" rx="10" fill="#8C1F28"/>
  <text x="90" y="553" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">本页要点</text>
  <text x="90" y="581" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">二手房十年净涨仅 16%，考虑持币成本后实际回报为负；2023.4 峰值 7.03 万 → 当前 4.59 万，回到 2016 年中。</text>
  <text x="90" y="607" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">新房在限价放开+高地价推动下结构性维持 5.5-6 万，与二手全面倒挂 —— 「新房贵过二手」成为市场新常态。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：gotohui逐月序列/我爱我家年报/中指（B+）；新房2025前无连续公开序列</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">06 / 10</text>
</svg>
