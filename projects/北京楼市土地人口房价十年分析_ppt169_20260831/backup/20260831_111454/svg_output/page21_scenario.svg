<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">情景推演：2027-2028 三种剧本</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">基于供给缺口（P16）× 政策节奏（P04）× 估值水位（P18）的概率分布</text>

  <!-- 三剧本 -->
  <g font-family="'PingFang SC', sans-serif">
    <!-- 基准 -->
    <rect x="60" y="116" width="373" height="400" rx="12" fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/>
    <rect x="60" y="116" width="373" height="52" rx="12" fill="#C9A227"/>
    <text x="246" y="141" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">基准剧本 · 结构性反转</text>
    <text x="246" y="190" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="46" font-weight="700" fill="#A08318">55%</text>
    <text x="88" y="226" font-size="13.5" fill="#2B2B2B" font-weight="600">剧情（2027-2028）：</text>
    <text x="88" y="252" font-size="13" fill="#2B2B2B">· 核心区新房供给缺口兑现</text>
    <text x="88" y="276" font-size="13" fill="#2B2B2B">· 现房高品质盘定价权强化</text>
    <text x="88" y="300" font-size="13" fill="#2B2B2B">· 核心区二手止跌、量价企稳</text>
    <text x="88" y="324" font-size="13" fill="#2B2B2B">· 远郊继续以价换量</text>
    <text x="88" y="360" font-size="13.5" fill="#2B2B2B" font-weight="600">价格路径：</text>
    <text x="88" y="386" font-size="13" fill="#2B2B2B">核心区新房 +5~10%</text>
    <text x="88" y="410" font-size="13" fill="#2B2B2B">全市二手 0~-5% 后转正</text>
    <text x="88" y="446" font-size="13.5" fill="#2B2B2B" font-weight="600">触发条件：</text>
    <text x="88" y="472" font-size="13" fill="#6B6B6B">经济弱复苏+政策按兵不动</text>
    <text x="88" y="496" font-size="13" fill="#6B6B6B">+ 土拍热度延续（观察哨①②）</text>

    <!-- 乐观 -->
    <rect x="453" y="116" width="373" height="400" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <rect x="453" y="116" width="373" height="52" rx="12" fill="#2E7D5B"/>
    <text x="639" y="141" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">乐观剧本 · 全面回暖</text>
    <text x="639" y="190" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="46" font-weight="700" fill="#2E7D5B">25%</text>
    <text x="667" y="226" font-size="13.5" fill="#2B2B2B" font-weight="600">剧情：</text>
    <text x="667" y="252" font-size="13" fill="#2B2B2B">· 利率再降 50bp+ 收入预期改善</text>
    <text x="667" y="276" font-size="13" fill="#2B2B2B">· 置换链全面激活（卖旧买新）</text>
    <text x="667" y="300" font-size="13" fill="#2B2B2B">· 挂牌出清加速、量价齐升</text>
    <text x="667" y="324" font-size="13" fill="#2B2B2B">· 土拍向郊区扩散回暖</text>
    <text x="667" y="360" font-size="13.5" fill="#2B2B2B" font-weight="600">价格路径：</text>
    <text x="667" y="386" font-size="13" fill="#2B2B2B">全市二手 +5~10%</text>
    <text x="667" y="410" font-size="13" fill="#2B2B2B">新房去化率回 60%+</text>
    <text x="667" y="446" font-size="13.5" fill="#2B2B2B" font-weight="600">触发条件：</text>
    <text x="667" y="472" font-size="13" fill="#6B6B6B">宏观强刺激（降息降首付）</text>
    <text x="667" y="496" font-size="13" fill="#6B6B6B">或出口/就业超预期改善</text>

    <!-- 悲观 -->
    <rect x="846" y="116" width="373" height="400" rx="12" fill="#FFFFFF" stroke="#E5DED2"/>
    <rect x="846" y="116" width="373" height="52" rx="12" fill="#B3541E"/>
    <text x="1032" y="141" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">悲观剧本 · 二次探底</text>
    <text x="1032" y="190" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="46" font-weight="700" fill="#B3541E">20%</text>
    <text x="1060" y="226" font-size="13.5" fill="#2B2B2B" font-weight="600">剧情：</text>
    <text x="1060" y="252" font-size="13" fill="#2B2B2B">· 经济承压+收入预期走弱</text>
    <text x="1060" y="276" font-size="13" fill="#2B2B2B">· 高价地项目滞销 → 房企</text>
    <text x="1060" y="300" font-size="13" fill="#2B2B2B">  停拍 → 地价回落（P17收敛）</text>
    <text x="1060" y="324" font-size="13" fill="#2B2B2B">· 挂牌堰塞湖二次决口</text>
    <text x="1060" y="360" font-size="13.5" fill="#2B2B2B" font-weight="600">价格路径：</text>
    <text x="1060" y="386" font-size="13" fill="#2B2B2B">全市二手再跌 10-15%</text>
    <text x="1060" y="410" font-size="13" fill="#2B2B2B">核心区地王项目亏本出货</text>
    <text x="1060" y="446" font-size="13.5" fill="#2B2B2B" font-weight="600">触发条件：</text>
    <text x="1060" y="472" font-size="13" fill="#6B6B6B">外部冲击/就业恶化</text>
    <text x="1060" y="496" font-size="13" fill="#6B6B6B">或花乡式托底成交蔓延</text>
  </g>

  <!-- 概率条 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="556" font-size="14" font-weight="600" fill="#2B2B2B">概率分布（主观校准，随观察哨数据滚动修正）：</text>
    <rect x="60" y="570" width="637" height="26" fill="#C9A227"/>
    <rect x="697" y="570" width="290" height="26" fill="#2E7D5B"/>
    <rect x="987" y="570" width="232" height="26" fill="#B3541E"/>
    <text x="378" y="588" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">基准 55%</text>
    <text x="842" y="588" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">乐观 25%</text>
    <text x="1103" y="588" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">悲观 20%</text>
    <text x="60" y="628" font-size="13" fill="#6B6B6B">关键分歧变量：① 现房项目去化率（2026Q4首批数据）② 二手挂牌量走势 ③ 居民收入预期（消费信心指数）</text>
    <text x="60" y="652" font-size="13" fill="#6B6B6B">历史校验：本框架在2025年初对「量缩价升延续」的判断与实际走势一致；概率为分析工具而非投资建议</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">推演：小爱基于P04-P18数据链构建 · 概率主观校准</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">21 / 22</text>
</svg>
