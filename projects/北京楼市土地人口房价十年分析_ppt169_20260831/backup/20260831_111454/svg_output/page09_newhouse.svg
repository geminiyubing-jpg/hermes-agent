<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">新房市场：被地价推着走的「结构性高位」</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">新房网签均价与成交套数（2020-2026.7）· 限价放开后的定价迁移</text>

  <!-- 左：新房均价柱状 -->
  <g>
    <text x="80" y="126" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#8C1F28">新房网签均价（元/㎡）</text>
    <!-- 网格 -->
    <g stroke="#DDD5C8" stroke-width="1">
      <line x1="100" y1="420" x2="620" y2="420"/>
      <line x1="100" y1="356" x2="620" y2="356" stroke-dasharray="4,4"/>
      <line x1="100" y1="292" x2="620" y2="292" stroke-dasharray="4,4"/>
      <line x1="100" y1="228" x2="620" y2="228" stroke-dasharray="4,4"/>
      <line x1="100" y1="164" x2="620" y2="164" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B">
      <text x="94" y="424" text-anchor="end">4.5万</text>
      <text x="94" y="360" text-anchor="end">5.0万</text>
      <text x="94" y="296" text-anchor="end">5.5万</text>
      <text x="94" y="232" text-anchor="end">6.0万</text>
      <text x="94" y="168" text-anchor="end">6.5万</text>
    </g>
    <!-- 柱: 2020~4.9万(估) 2021~5.1 2022~5.4 2023~5.6 2024~5.5 2025~5.6 2026.7 5.45 -->
    <!-- y=420-(p-4.5)*64/0.5*0.5... 直接: y = 420 - (p-45000)/5000*64 -->
    <rect x="125" y="244" width="56" height="176" fill="#C9A227" opacity="0.75"/>
    <rect x="202" y="218.4" width="56" height="201.6" fill="#C9A227" opacity="0.75"/>
    <rect x="279" y="180" width="56" height="240" fill="#C9A227" opacity="0.75"/>
    <rect x="356" y="154.4" width="56" height="265.6" fill="#A5821B"/>
    <rect x="433" y="166.8" width="56" height="253.2" fill="#A5821B"/>
    <rect x="510" y="152" width="56" height="268" fill="#8C6F14"/>
    <rect x="587" y="171.2" width="33" height="248.8" fill="#8C6F14"/>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12.5" font-weight="600" fill="#2B2B2B" text-anchor="middle">
      <text x="153" y="234">~4.9万</text><text x="230" y="208">~5.1万</text><text x="307" y="170">~5.4万</text>
      <text x="384" y="144">~5.6万</text><text x="461" y="157">~5.5万</text><text x="538" y="142">~5.6万</text><text x="603" y="161">5.45万</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#6B6B6B" text-anchor="middle">
      <text x="153" y="442">'20</text><text x="230" y="442">'21</text><text x="307" y="442">'22</text>
      <text x="384" y="442">'23</text><text x="461" y="442">'24</text><text x="538" y="442">'25</text><text x="603" y="442">'26</text>
    </g>
    <text x="360" y="462" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">限竞房退场+高价地入市推动均价台阶式上移</text>
  </g>

  <!-- 右：新房成交套数 + 认购限期 -->
  <g>
    <text x="690" y="126" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#4A7BA6">新房住宅网签（万套/年）</text>
    <g stroke="#DDD5C8" stroke-width="1">
      <line x1="710" y1="420" x2="1200" y2="420"/>
      <line x1="710" y1="340" x2="1200" y2="340" stroke-dasharray="4,4"/>
      <line x1="710" y1="260" x2="1200" y2="260" stroke-dasharray="4,4"/>
      <line x1="710" y1="180" x2="1200" y2="180" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B">
      <text x="704" y="424" text-anchor="end">0</text>
      <text x="704" y="344" text-anchor="end">3</text>
      <text x="704" y="264" text-anchor="end">6</text>
      <text x="704" y="184" text-anchor="end">9</text>
    </g>
    <!-- 折线: 6.81 9.07 6.81 6.56 5.11 (2020-2024) -->
    <polyline points="745,213.2 856,151.4 967,213.2 1078,229.6 1189,271.2" fill="none" stroke="#4A7BA6" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="#4A7BA6">
      <circle cx="745" cy="213.2" r="5"/><circle cx="856" cy="151.4" r="5"/><circle cx="967" cy="213.2" r="5"/>
      <circle cx="1078" cy="229.6" r="5"/><circle cx="1189" cy="271.2" r="6"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#33587A">
      <text x="725" y="200">6.81</text><text x="836" y="139">9.07</text><text x="947" y="200">6.81</text>
      <text x="1058" y="217">6.56</text><text x="1169" y="259">5.11</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#6B6B6B" text-anchor="middle">
      <text x="745" y="442">2020</text><text x="856" y="442">2021</text><text x="967" y="442">2022</text>
      <text x="1078" y="442">2023</text><text x="1189" y="442">2024</text>
    </g>
    <text x="955" y="462" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="11.5" fill="#9B9B9B">来源：北京市住建委 · 2025年月均约3000套低位企稳</text>
  </g>

  <!-- 本页要点 -->
  <rect x="60" y="484" width="1159" height="152" rx="12" fill="#8C1F28"/>
  <text x="90" y="516" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">本页要点</text>
  <text x="90" y="544" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">① 新房均价十年台阶式上移（4.9→5.6万），与二手的「一轮轮回」形成鲜明反差 —— 高地价+限价放开是直接推手，成交套数却缩至半衰（9.07→5.11万套）。</text>
  <text x="90" y="572" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">② 「量缩价升」的含义：新房正在退出刚需市场、转型纯改善市场 —— 2025年入市的树村/太阳宫项目定位全部是顶豪，与二手刚需盘形成两个平行市场。</text>
  <text x="90" y="600" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">③ 8·28新政后新地现房销售：开发周期+1年以上、资金占用更重 —— 新房供给将进一步收缩，价格「结构性高位」大概率自我强化而非回落。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：住建委网签(B+)/gotohui(B+)；2020-2022均价为限竞房结构性推算</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">09 / 22</text>
</svg>
