<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">供需天平：未来三年的确定性收缩</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">宅地成交建面 → 新房潜在供给的传导账本（万㎡）</text>

  <!-- 供给漏斗 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="80" y="132" font-size="16" font-weight="600" fill="#8C1F28">宅地成交规划建面（万㎡/年）</text>
    <!-- 柱: 2022 538 2023 581 2024 ~470 2025 359 -->
    <g stroke="#DDD5C8" stroke-width="1">
      <line x1="100" y1="420" x2="620" y2="420"/>
      <line x1="100" y1="330" x2="620" y2="330" stroke-dasharray="4,4"/>
      <line x1="100" y1="240" x2="620" y2="240" stroke-dasharray="4,4"/>
      <line x1="100" y1="150" x2="620" y2="150" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B">
      <text x="94" y="424" text-anchor="end">0</text>
      <text x="94" y="334" text-anchor="end">200</text>
      <text x="94" y="244" text-anchor="end">400</text>
      <text x="94" y="154" text-anchor="end">600</text>
    </g>
    <rect x="150" y="178.5" width="90" height="241.5" fill="#8C1F28" opacity="0.85"/>
    <rect x="290" y="159" width="90" height="261" fill="#8C1F28" opacity="0.85"/>
    <rect x="430" y="208.5" width="90" height="211.5" fill="#8C1F28"/>
    <rect x="570" y="258.5" width="40" height="161.5" fill="#2B2B2B"/>
    <g font-family="'Helvetica Neue', sans-serif" font-size="15" font-weight="700" fill="#2B2B2B" text-anchor="middle">
      <text x="195" y="168">538</text><text x="335" y="149">581</text><text x="475" y="198">~470</text><text x="590" y="248">359</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#6B6B6B" text-anchor="middle">
      <text x="195" y="442">2022</text><text x="335" y="442">2023</text><text x="475" y="442">2024</text><text x="590" y="442">2025</text>
    </g>
    <text x="360" y="462" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">2026.8月已知约204万㎡(33宗/713亿) 全年有望回补</text>
  </g>

  <!-- 右：传导账本 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="690" y="132" font-size="16" font-weight="600" fill="#8C1F28">供给传导账本（推演）</text>
    <rect x="690" y="150" width="510" height="270" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="715" y="186" font-size="14" font-weight="600" fill="#2B2B2B">2025 年拿地 → 2027-28 年入市</text>
    <line x1="715" y1="198" x2="1175" y2="198" stroke="#E5DED2"/>
    <text x="715" y="226" font-size="13.5" fill="#2B2B2B">· 359 万㎡建面 ≈ <tspan font-weight="700" fill="#8C1F28">3.6 万套</tspan>（按100㎡/套）</text>
    <text x="715" y="254" font-size="13.5" fill="#2B2B2B">· 现房销售新政 → 交付即售，无期房提前锁定</text>
    <text x="715" y="282" font-size="13.5" fill="#2B2B2B">· 对比 2021 峰值供给 ~9 万套：收缩 <tspan font-weight="700" fill="#B3541E">-60%</tspan></text>
    <text x="715" y="310" font-size="13.5" fill="#2B2B2B">· 年成交需求底 5-6 万套（新房+二手分流后）</text>
    <rect x="715" y="330" width="460" height="70" rx="8" fill="#8C1F28" opacity="0.08"/>
    <text x="945" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#8C1F28">2027-28 供给缺口 ≈ 2-3 万套/年</text>
    <text x="945" y="384" text-anchor="middle" font-size="12.5" fill="#6B6B6B">集中于核心区高品质段 —— 支撑结构性反转判断</text>
  </g>

  <!-- 底部三卡 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="484" width="373" height="152" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="88" y="518" font-size="15" font-weight="600" fill="#8C1F28">需求底座测算</text>
    <text x="88" y="548" font-size="13" fill="#2B2B2B">· 换房链条：二手年成交15万套×</text>
    <text x="88" y="572" font-size="13" fill="#2B2B2B">  30% 置换率 ≈ 4.5万套新房需求</text>
    <text x="88" y="596" font-size="13" fill="#2B2B2B">· 新增刚需：婚育+落户 ≈ 2万套</text>
    <text x="88" y="620" font-size="13" fill="#2B2B2B">· 合计底座 6-7 万套/年 vs 供给3.6万</text>

    <rect x="453" y="484" width="373" height="152" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="481" y="518" font-size="15" font-weight="600" fill="#8C1F28">出清的另一面</text>
    <text x="481" y="548" font-size="13" fill="#2B2B2B">· 远郊在售项目去化率普遍25-40%</text>
    <text x="481" y="572" font-size="13" fill="#2B2B2B">· 库存消化周期 >30 个月的板块</text>
    <text x="481" y="596" font-size="13" fill="#2B2B2B">  需「以价换量」多年——供给收缩</text>
    <text x="481" y="620" font-size="13" fill="#2B2B2B">  的红利到不了这些区域</text>

    <rect x="846" y="484" width="373" height="152" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="874" y="518" font-size="15" font-weight="600" fill="#8C1F28">全国对照</text>
    <text x="874" y="548" font-size="13" fill="#2B2B2B">· 300城宅地出让金2024年-27.8%</text>
    <text x="874" y="572" font-size="13" fill="#2B2B2B">· 北京-8%（显著优于全国）</text>
    <text x="874" y="596" font-size="13" fill="#2B2B2B">· 供给收缩是全国现象，但北京</text>
    <text x="874" y="620" font-size="13" fill="#2B2B2B">  收缩得最「贵」——质量对冲数量</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：中指院(A)/推算=小爱(标注) · 2024建面按总额/楼面价反推(B)</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">17 / 22</text>
</svg>
