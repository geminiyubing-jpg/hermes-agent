<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">供给结构：卖更少的地，卖更贵的地</text>

  <!-- 左：宗数暴跌 -->
  <g>
    <text x="80" y="108" font-family="'PingFang SC', sans-serif" font-size="17" font-weight="600" fill="#8C1F28">年成交宗数（宗）</text>
    <g stroke="#DDD5C8" stroke-width="1">
      <line x1="100" y1="430" x2="600" y2="430"/>
      <line x1="100" y1="360" x2="600" y2="360" stroke-dasharray="4,4"/>
      <line x1="100" y1="290" x2="600" y2="290" stroke-dasharray="4,4"/>
      <line x1="100" y1="220" x2="600" y2="220" stroke-dasharray="4,4"/>
      <line x1="100" y1="150" x2="600" y2="150" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B">
      <text x="94" y="434" text-anchor="end">0</text>
      <text x="94" y="364" text-anchor="end">25</text>
      <text x="94" y="294" text-anchor="end">50</text>
      <text x="94" y="224" text-anchor="end">75</text>
      <text x="94" y="154" text-anchor="end">100</text>
    </g>
    <!-- 折线: 2017(104) 2018(72) 2022(61) 2023(61) 2024(41) 2025(40) -->
    <polyline points="130,151.2 205,240.6 355,300.8 450,300.8 545,386.2 590,389.2" fill="none" stroke="#8C1F28" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="#8C1F28">
      <circle cx="130" cy="151.2" r="5"/><circle cx="205" cy="240.6" r="5"/><circle cx="355" cy="300.8" r="5"/>
      <circle cx="450" cy="300.8" r="5"/><circle cx="545" cy="386.2" r="5"/><circle cx="590" cy="389.2" r="5"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#2B2B2B">
      <text x="118" y="136">104</text><text x="193" y="228">72</text><text x="343" y="288">61</text>
      <text x="438" y="288">61</text><text x="533" y="374">41</text><text x="578" y="407">40</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#6B6B6B">
      <text x="130" y="452" text-anchor="middle">'17</text><text x="205" y="452" text-anchor="middle">'18</text>
      <text x="355" y="452" text-anchor="middle">'22</text><text x="450" y="452" text-anchor="middle">'23</text>
      <text x="545" y="452" text-anchor="middle">'24</text><text x="590" y="452" text-anchor="middle">'25</text>
    </g>
  </g>

  <!-- 右：单宗均价 + 城六区占比 -->
  <g>
    <text x="680" y="108" font-family="'PingFang SC', sans-serif" font-size="17" font-weight="600" fill="#C9A227">单宗成交均价（亿元/宗）</text>
    <g stroke="#DDD5C8" stroke-width="1">
      <line x1="700" y1="430" x2="1210" y2="430"/>
      <line x1="700" y1="352" x2="1210" y2="352" stroke-dasharray="4,4"/>
      <line x1="700" y1="274" x2="1210" y2="274" stroke-dasharray="4,4"/>
      <line x1="700" y1="196" x2="1210" y2="196" stroke-dasharray="4,4"/>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#9B9B9B">
      <text x="694" y="434" text-anchor="end">0</text>
      <text x="694" y="356" text-anchor="end">15</text>
      <text x="694" y="278" text-anchor="end">30</text>
      <text x="694" y="200" text-anchor="end">45</text>
    </g>
    <!-- 柱: 2017=26.9 2018=23.4 2022=28.6 2023=28.5 2024=38.3 2025=35.7 -->
    <rect x="725" y="266.8" width="56" height="163.2" fill="#C9A227" opacity="0.85"/>
    <rect x="800" y="288" width="56" height="142" fill="#C9A227" opacity="0.85"/>
    <rect x="875" y="256.2" width="56" height="173.8" fill="#C9A227" opacity="0.85"/>
    <rect x="950" y="256.8" width="56" height="173.2" fill="#C9A227" opacity="0.85"/>
    <rect x="1025" y="197.1" width="56" height="232.9" fill="#A5821B"/>
    <rect x="1100" y="213" width="56" height="217" fill="#A5821B"/>
    <g font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#2B2B2B" text-anchor="middle">
      <text x="753" y="259">26.9</text><text x="828" y="280">23.4</text><text x="903" y="248">28.6</text>
      <text x="978" y="249">28.5</text><text x="1053" y="189">38.3</text><text x="1128" y="205">35.7</text>
    </g>
    <g font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#6B6B6B" text-anchor="middle">
      <text x="753" y="452">'17</text><text x="828" y="452">'18</text><text x="903" y="452">'22</text>
      <text x="978" y="452">'23</text><text x="1053" y="452">'24</text><text x="1128" y="452">'25</text>
    </g>
  </g>

  <!-- 底部洞察条 -->
  <rect x="60" y="490" width="1159" height="150" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
  <text x="90" y="526" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#8C1F28">结构性替代：数量换单价</text>
  <text x="90" y="556" font-family="'PingFang SC', sans-serif" font-size="14" fill="#2B2B2B">· 城六区供地占比 2024 年 40% → 2025 年 50%：核心区存量挖潜取代郊区铺量</text>
  <text x="90" y="582" font-family="'PingFang SC', sans-serif" font-size="14" fill="#2B2B2B">· 海淀+朝阳两区占全市出让金 53%：「半壁江山」式集中</text>
  <text x="90" y="608" font-family="'PingFang SC', sans-serif" font-size="14" fill="#2B2B2B">· 人均新增宅地建面 0.40㎡ → 0.165㎡（-58%）：远期新房供给确定性收缩</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：中指院/凤凰网房产整理规自委公告（A/B+）</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">06 / 22</text>
</svg>
