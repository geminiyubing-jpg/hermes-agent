<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">分析框架：三线一链 + 三个核心问题</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">方法论：供给-需求-价格-制度的四维交叉验证</text>

  <!-- 三线 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="118" width="373" height="120" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <rect x="60" y="118" width="373" height="6" rx="3" fill="#8C1F28"/>
    <text x="88" y="156" font-size="17" font-weight="700" fill="#8C1F28">土地线（供给）</text>
    <text x="88" y="184" font-size="13.5" fill="#2B2B2B">出让金 / 宗数 / 楼面价 / 溢价率</text>
    <text x="88" y="208" font-size="13.5" fill="#2B2B2B">区域结构 / 拿地主体</text>

    <rect x="453" y="118" width="373" height="120" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <rect x="453" y="118" width="373" height="6" rx="3" fill="#4A7BA6"/>
    <text x="481" y="156" font-size="17" font-weight="700" fill="#33587A">人口线（需求基数）</text>
    <text x="481" y="184" font-size="13.5" fill="#2B2B2B">常住总量 / 增速 / 年龄结构</text>
    <text x="481" y="208" font-size="13.5" fill="#2B2B2B">购买力分布 / 学历结构</text>

    <rect x="846" y="118" width="373" height="120" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <rect x="846" y="118" width="373" height="6" rx="3" fill="#C9A227"/>
    <text x="874" y="156" font-size="17" font-weight="700" fill="#8C6F14">房价线（结果）</text>
    <text x="874" y="184" font-size="13.5" fill="#2B2B2B">新房网签 / 二手成交 / 挂牌出清</text>
    <text x="874" y="208" font-size="13.5" fill="#2B2B2B">地价房价比 / 分区韧性</text>
  </g>

  <!-- 传导链 -->
  <g font-family="'PingFang SC', sans-serif">
    <rect x="60" y="262" width="1159" height="64" rx="10" fill="#2B2B2B"/>
    <text x="640" y="290" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="600">传导链：人口横盘 → 需求封顶 → 土地缩量提质保财政 → 供给收缩集中于核心区 → 地价房价剪刀差拉大 → 新房二手倒挂 → 区域分化固化</text>
    <text x="640" y="313" text-anchor="middle" font-size="13" fill="#C9A227">制度变量（317调控 / 集中供地 / 限价放开 / 8·28新政）在每个节点调节传导强度</text>
  </g>

  <!-- 三个核心问题 -->
  <g font-family="'PingFang SC', sans-serif">
    <text x="60" y="372" font-size="18" font-weight="700" fill="#8C1F28">本报告回答的三个核心问题</text>
    <rect x="60" y="390" width="1159" height="76" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="90" y="420" font-size="15" font-weight="600" fill="#2B2B2B">Q1 · 十年一轮回：房价回到起点，是什么支撑土地市场仍居全国第一？</text>
    <text x="90" y="446" font-size="13" fill="#6B6B6B">答案在 P05-P08（供给端的结构性替代）与 P18（剪刀差的财政逻辑）</text>

    <rect x="60" y="478" width="1159" height="76" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="90" y="508" font-size="15" font-weight="600" fill="#2B2B2B">Q2 · 区域大分化：同样是北京，为什么西城只回到2017、顺义却跌回2016年初？</text>
    <text x="90" y="534" font-size="13" fill="#6B6B6B">答案在 P14-P16（土地/新房/二手三市场联动 + 挂牌出清证据）</text>

    <rect x="60" y="566" width="1159" height="76" rx="10" fill="#FFFFFF" stroke="#E5DED2"/>
    <text x="90" y="596" font-size="15" font-weight="600" fill="#2B2B2B">Q3 · 前瞻：8·28 新政后，2027-2028 年北京楼市往哪走？</text>
    <text x="90" y="622" font-size="13" fill="#6B6B6B">答案在 P19-P21（京沪对照 + 估值三温度计 + 三情景概率推演）与 P22（行动建议）</text>
  </g>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">框架：小爱基于公开数据构建 · 页码指引便于跳读</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">02 / 22</text>
</svg>
