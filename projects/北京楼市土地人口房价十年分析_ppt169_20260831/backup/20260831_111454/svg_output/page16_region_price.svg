<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8C1F28"/>
  <text x="60" y="62" font-family="'PingFang SC', 'Heiti SC', sans-serif" font-size="28" font-weight="700" fill="#2B2B2B">区域分化（房价篇）：你的房子跌回了哪一年？</text>
  <text x="60" y="90" font-family="'PingFang SC', sans-serif" font-size="14" fill="#6B6B6B">各区二手房当前价位 vs 2023 峰值回撤 · 2026 年初状态（成交口径）</text>

  <!-- 表格 -->
  <g font-family="'PingFang SC', sans-serif">
    <!-- 表头 -->
    <rect x="60" y="112" width="1160" height="36" fill="#2B2B2B"/>
    <text x="150" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">区域</text>
    <text x="340" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">成交均价(万/㎡)</text>
    <text x="560" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">价格回到</text>
    <text x="730" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">较峰值回撤</text>
    <text x="930" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">2026挂牌参考(万/㎡)</text>
    <text x="1130" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">韧性评级</text>

    <!-- 行: 42px/行 y0=148 -->
    <rect x="60" y="148" width="1160" height="42" fill="#FFFFFF"/>
    <text x="150" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2B2B">西城</text>
    <text x="340" y="175" text-anchor="middle" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#2B2B2B">10.56</text>
    <text x="560" y="175" text-anchor="middle" font-size="14" fill="#8C1F28" font-weight="600">2017年2月</text>
    <text x="730" y="175" text-anchor="middle" font-size="14" fill="#2E7D5B" font-family="'Helvetica Neue', sans-serif">-19%</text>
    <text x="930" y="175" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="'Helvetica Neue', sans-serif">15.36</text>
    <text x="1130" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D5B">★★★★</text>

    <rect x="60" y="190" width="1160" height="42" fill="#F2EDE3"/>
    <text x="150" y="217" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2B2B">东城</text>
    <text x="340" y="217" text-anchor="middle" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#2B2B2B">8.80</text>
    <text x="560" y="217" text-anchor="middle" font-size="14" fill="#8C1F28" font-weight="600">2018年3月</text>
    <text x="730" y="217" text-anchor="middle" font-size="14" fill="#2E7D5B" font-family="'Helvetica Neue', sans-serif">-17%</text>
    <text x="930" y="217" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="'Helvetica Neue', sans-serif">13.60</text>
    <text x="1130" y="217" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D5B">★★★★</text>

    <rect x="60" y="232" width="1160" height="42" fill="#FFFFFF"/>
    <text x="150" y="259" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2B2B">海淀</text>
    <text x="340" y="259" text-anchor="middle" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#2B2B2B">7.70</text>
    <text x="560" y="259" text-anchor="middle" font-size="14" fill="#8C1F28" font-weight="600">2016年12月</text>
    <text x="730" y="259" text-anchor="middle" font-size="14" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-22%</text>
    <text x="930" y="259" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="'Helvetica Neue', sans-serif">9.79</text>
    <text x="1130" y="259" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D5B">★★★☆</text>

    <rect x="60" y="274" width="1160" height="42" fill="#F2EDE3"/>
    <text x="150" y="301" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2B2B">朝阳</text>
    <text x="340" y="301" text-anchor="middle" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#2B2B2B">5.50</text>
    <text x="560" y="301" text-anchor="middle" font-size="14" fill="#8C1F28" font-weight="600">2016年9月</text>
    <text x="730" y="301" text-anchor="middle" font-size="14" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-25%</text>
    <text x="930" y="301" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="'Helvetica Neue', sans-serif">9.39</text>
    <text x="1130" y="301" text-anchor="middle" font-size="13" font-weight="600" fill="#C9A227">★★★</text>

    <rect x="60" y="316" width="1160" height="42" fill="#FFFFFF"/>
    <text x="150" y="343" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2B2B">丰台</text>
    <text x="340" y="343" text-anchor="middle" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#2B2B2B">4.67</text>
    <text x="560" y="343" text-anchor="middle" font-size="14" fill="#8C1F28" font-weight="600">2016年9月</text>
    <text x="730" y="343" text-anchor="middle" font-size="14" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-28%</text>
    <text x="930" y="343" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="'Helvetica Neue', sans-serif">8.69</text>
    <text x="1130" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#C9A227">★★☆</text>

    <rect x="60" y="358" width="1160" height="42" fill="#F2EDE3"/>
    <text x="150" y="385" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2B2B">昌平</text>
    <text x="340" y="385" text-anchor="middle" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#2B2B2B">3.76</text>
    <text x="560" y="385" text-anchor="middle" font-size="14" fill="#8C1F28" font-weight="600">2016年9月</text>
    <text x="730" y="385" text-anchor="middle" font-size="14" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-28%</text>
    <text x="930" y="385" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="'Helvetica Neue', sans-serif">—</text>
    <text x="1130" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#C9A227">★★☆</text>

    <rect x="60" y="400" width="1160" height="42" fill="#FFFFFF"/>
    <text x="150" y="427" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2B2B">大兴</text>
    <text x="340" y="427" text-anchor="middle" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#2B2B2B">3.35</text>
    <text x="560" y="427" text-anchor="middle" font-size="14" fill="#8C1F28" font-weight="600">2016年8月</text>
    <text x="730" y="427" text-anchor="middle" font-size="14" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-30%</text>
    <text x="930" y="427" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="'Helvetica Neue', sans-serif">—</text>
    <text x="1130" y="427" text-anchor="middle" font-size="13" font-weight="600" fill="#B3541E">★★</text>

    <rect x="60" y="442" width="1160" height="42" fill="#F2EDE3"/>
    <text x="150" y="469" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2B2B">顺义</text>
    <text x="340" y="469" text-anchor="middle" font-size="15" font-family="'Helvetica Neue', sans-serif" font-weight="600" fill="#2B2B2B">2.70</text>
    <text x="560" y="469" text-anchor="middle" font-size="14" fill="#8C1F28" font-weight="600">2016年4月</text>
    <text x="730" y="469" text-anchor="middle" font-size="14" fill="#B3541E" font-family="'Helvetica Neue', sans-serif">-33%</text>
    <text x="930" y="469" text-anchor="middle" font-size="14" fill="#6B6B6B" font-family="'Helvetica Neue', sans-serif">—</text>
    <text x="1130" y="469" text-anchor="middle" font-size="13" font-weight="600" fill="#B3541E">★☆</text>
  </g>
  <rect x="60" y="112" width="1160" height="372" fill="none" stroke="#E5DED2"/>

  <!-- 本页要点 -->
  <rect x="60" y="508" width="1159" height="124" rx="10" fill="#8C1F28"/>
  <text x="90" y="540" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">本页要点</text>
  <text x="90" y="568" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">越核心回撤越浅（西城-17%），越远郊跌得越干净（顺义-33%）——「回到哪一年」与距天安门的距离严格正相关。</text>
  <text x="90" y="594" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">挂牌价与成交价的巨大裂口（西城挂牌15.4万 vs 成交10.6万）说明：挂牌虚高未出清，真实筑底仍在进行。</text>
  <text x="90" y="620" font-family="'PingFang SC', sans-serif" font-size="14" fill="#FFFFFF">对置业者的含义：核心区「深V」可期，远郊仍是漫漫消化路 —— 地段是这轮周期唯一的护城河。</text>

  <text x="60" y="694" font-family="'PingFang SC', sans-serif" font-size="12" fill="#9B9B9B">数据：知乎专栏整理贝壳成交(2026.2)/安居客挂牌(2026.8)（B+）；回撤以2023.4峰值计</text>
  <text x="1220" y="694" text-anchor="end" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#8C1F28">16 / 22</text>
</svg>
